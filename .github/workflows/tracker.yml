name: AI Update Tracker

on:
  # 毎時17分。毎時0分は負荷が集中して遅延・スキップが起きやすいため避ける
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 依存をインストール
        run: pip install -r requirements.txt

      - name: 新着をチェック
        run: python -m tracker.run --mode check

      # 要約は派生データ。失敗しても次のコミットを止めないこと——止まると
      # 送信済みの記事が未読に戻って再送される。コード側でも例外を投げないが、
      # 想定外のクラッシュでも巻き込まないよう二重に守る。
      - name: 日本語の要約を付ける
        continue-on-error: true
        run: python -m tracker.run --mode summarize

      - name: 既読状態とアーカイブをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker/
          git diff --staged --quiet || git commit -m "chore: トラッカーの既読状態を更新"
          git push
