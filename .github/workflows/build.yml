name: Build & Deploy Site

on:
  push:
    branches: [main]
    # data/ は毎時トラッカーが書き換える。paths を絞らないとサイトが
    # 1日24回リビルドされる。news.json はトップの「AIアップデート」欄の
    # 中身なので例外（ニュースが実際に増えたコミットだけ再ビルドされる。
    # seen.json だけの既読更新では動かない）
    paths:
      - "content/**"
      # `_` 始まりはビルド対象外（content.py）なので、キュー・ログ・保管庫だけの
      # コミット（毎晩の担当・毎朝の回転）で再デプロイしない
      - "!content/_*.md"
      - "templates/**"
      - "static/**"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"
      - "data/tracker/news.json"
      - "data/tracker/media_news.json"
      - "tracker/sources.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ⚠️ deploy-pages が「Deployment cancelled」で落ち続けるときは、同じコミットSHAの
# デプロイ記録が向こう側で詰まっている。再実行では直らない（4回実測）。
# 直し方＝ /pages/deployments/<sha>/cancel を叩いてから、新しいコミットを積んで流す。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 依存をインストール
        run: pip install -r requirements.txt

      # テストが落ちたらここで止まる。壊れたものは公開に到達しない
      - name: テスト
        run: python -m pytest -q

      - name: ビルド
        run: python -m src.build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
