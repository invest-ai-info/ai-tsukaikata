<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="AI画像のストック販売についてAIに聞いた結果を並べた表。上6行は原文と一致した回数で、規約を渡さずに作った30本のプロンプトに禁止5項目に当たる語が無かったのが30/30、規約を渡して作った30本も30/30、Adobe Stockは33%と述べたのが3/3、PIXTAはAI生成素材は不可と述べたのが3/3、材料を貼った回に最低残高US$25は26枚ぶんと計算したのが3/3、派生を何十枚も出すと不採用・停止の対象と述べたのが3/3で、いずれも緑。下2行は原文に無いこと・違うことを言った回数で、PIXTAの停止を2023年の話として説明したのが2/3、材料を貼った回に材料に無いドル額・パーセントを足したのが1/3で、いずれも赤。下の枠には、作らせたプロンプト60本に実在の人物名・作品名・政府機関名・他社IP・ニュース性は0本だったこと、どこが買うか・率はいくらかは当たるが、いつから止まったかは2/3が2023年と答え2026年の日付は0/3だったこと、禁止項目と率はAIに聞いてよいが、いま受け入れているかと日付は原文で見るという結論が書かれている。">
<style>
