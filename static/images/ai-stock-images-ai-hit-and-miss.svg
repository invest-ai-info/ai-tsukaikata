    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="450"/>
<text class="t-strong" x="18" y="26">禁止項目は最初から避ける。「いつから不可か」は外す</text>
<text class="t-sm" x="18" y="45">実測2026-09-18。ウェブ検索を切ったAI（独立実行）に、プロンプト作成2通り・可否と率・材料あり・派生量産・ページ名を各3回。</text>
<text class="t-sm" x="18" y="64">上6行＝原文と一致した回数（多いほど良い）。下2行＝原文に無いこと・違うことを言った回数（少ないほど良い）。</text>
<text class="t-xs" x="538.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">規約を渡さずに作った30本に、禁止5項目に当たる語が無かった</text>
<rect class="box-good" x="458" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="125" text-anchor="middle" style="font-weight:700">30/30</text>
<text class="t" x="18" y="157">規約を渡して作った30本に、禁止5項目に当たる語が無かった</text>
<rect class="box-good" x="458" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="157" text-anchor="middle" style="font-weight:700">30/30</text>
<text class="t" x="18" y="189">Adobe Stock＝33%と述べた</text>
<rect class="box-good" x="458" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">PIXTA＝AI生成素材は不可と述べた</text>
<rect class="box-good" x="458" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="253">材料を貼った回：最低残高US$25は26枚ぶん、と計算した</text>
<rect class="box-good" x="458" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="253" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="285">派生を何十枚も出すと不採用・停止の対象、と述べた</text>
<rect class="box-good" x="458" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="285" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="317">PIXTAの停止を「2023年」の話として説明した（原文は2026年）</text>
<rect class="box-bad" x="458" y="296" width="160" height="26" rx="4"/>
<text class="t-bad" x="538.0" y="317" text-anchor="middle" style="font-weight:700">2/3</text>
<text class="t" x="18" y="349">材料を貼った回に、材料に無いドル額・％を足した</text>
<rect class="box-bad" x="458" y="328" width="160" height="26" rx="4"/>
<text class="t-bad" x="538.0" y="349" text-anchor="middle" style="font-weight:700">1/3</text>
<rect class="box-accent" x="18" y="366" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="386">作らせたプロンプト60本に、実在の人物名・作品名・政府機関名・他社IP・ニュース性は0本だった。</text>
<text class="t-accent" x="34" y="404">「どこが買うか」「率はいくらか」は当たる。「いつ止まったか」は2/3が2023年と答え、2026年の日付は0/3。</text>
<text class="t-accent" x="34" y="422">＝禁止項目と率はAIに聞いてよい。「いま受け入れているか」と日付は、原文で見る。</text>
</svg>
