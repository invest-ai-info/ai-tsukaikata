<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-label="増加傾向のある問い合わせ受信件数の記録2本（材料A・材料C）で、直近14日の目安と56日全体の目安を4本の横棒で比べた図。材料Aは直近14日6.14件/日・56日全体4.50件/日で差は約37%。材料Cは直近14日8.21件/日・56日全体4.88件/日で差は約68%。下の枠には、材料Aの真値差が約36.5%、材料Cの真値差が約68.5%であること、どちらも増減の無いフラットな記録（差約6%）とは別の性質を持つことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="372"/>
<text class="t-strong" x="18" y="24">増加傾向のある記録では、直近14日の目安が56日全体より明確に高い</text>
<text class="t-sm" x="18" y="43">問い合わせフォームの受信件数（増加傾向のある架空ログ）2本を、直近14日と56日全体に切り分けて単純平均（真値）を比べた。</text>
<text class="t-sm" x="18" y="62">材料Aは前作（how-far-back）と同じ系列、材料Cはこの記事で新しく作った、より急な増加傾向の記録。</text>
<text class="t-xs" x="516.0" y="120">件/日</text>
<text class="t" x="18" y="144">材料A・直近14日(8/25〜9/7)</text>
<rect class="box-quiet" x="300.0" y="132" width="230.0" height="16" rx="3"/>
<rect class="bar-new" x="300.0" y="132" width="156.9" height="16" rx="3"/>
<text class="t-strong" x="544.0" y="144">6.14件/日</text>
<text class="t-xs" x="18" y="144">56日全体より約37%高い</text>
<text class="t" x="18" y="178">材料A・56日全体(7/14〜9/7)</text>
<rect class="box-quiet" x="300.0" y="166" width="230.0" height="16" rx="3"/>
<rect class="bar-old" x="300.0" y="166" width="115.0" height="16" rx="3"/>
<text class="t-strong" x="544.0" y="178">4.50件/日</text>
<text class="t-xs" x="18" y="178">材料Aの基準値</text>
<text class="t" x="18" y="222">材料C・直近14日(9/1〜9/14)</text>
<rect class="box-quiet" x="300.0" y="210" width="230.0" height="16" rx="3"/>
<rect class="bar-new" x="300.0" y="210" width="209.8" height="16" rx="3"/>
<text class="t-strong" x="544.0" y="222">8.21件/日</text>
<text class="t-xs" x="18" y="222">56日全体より約68%高い</text>
<text class="t" x="18" y="256">材料C・56日全体(7/21〜9/14)</text>
<rect class="box-quiet" x="300.0" y="244" width="230.0" height="16" rx="3"/>
<rect class="bar-old" x="300.0" y="244" width="124.7" height="16" rx="3"/>
<text class="t-strong" x="544.0" y="256">4.88件/日</text>
<text class="t-xs" x="18" y="256">材料Cの基準値</text>
<rect class="box-accent" x="18" y="286" width="684" height="66" rx="6"/>
<text class="t-accent" x="34" y="306">材料A：真値6.142857…件→4.5件/日。差は約36.5%（前作で「大きく動く」側だった幅）。</text>
<text class="t-accent" x="34" y="324">材料C：真値8.214286…件→4.875件/日。差は約68.5%（材料Aよりさらに急な増加傾向）。</text>
<text class="t-accent" x="34" y="342">どちらも「増減の無いフラットな記録（先行記事・差約6%）」とは別の性質を持つ材料。</text>
</svg>
