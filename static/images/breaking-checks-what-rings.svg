</style>
<rect class="bg" x="0" y="0" width="720" height="407"/>
<text class="t-strong" x="18" y="26">AIが作った壊れ例のうち、点検が実際に鳴ったのはどれだけか</text>
<text class="t-sm" x="18" y="45">架空の「毎朝の点検・5条」を文章で渡し、わざと壊した記録の全文を書かせた（材料2本 × 各2回 = 4回ずつ）。</text>
<text class="t-sm" x="18" y="64">5条は Python で実装してあり、返ってきた記録に当てて数えている。</text>
<text class="t-xs" x="282" y="100">濃い部分＝実際に鳴った例　薄い部分＝1条も鳴らなかった例</text>
<text class="t" x="18" y="125">そのまま「わざと壊して確かめて」</text>
<rect class="bar-old" x="282" y="112" width="296.1" height="16" rx="2"/>
<rect class="bar-new" x="282" y="112" width="230.3" height="16" rx="2"/>
<text class="t-xs" x="586.1" y="124">21 / 27例</text>
<text class="t" x="18" y="171">＋「6件作って、どの条か書いて」</text>
<rect class="bar-old" x="282" y="158" width="263.2" height="16" rx="2"/>
<rect class="bar-new" x="282" y="158" width="241.3" height="16" rx="2"/>
<text class="t-xs" x="553.2" y="170">22 / 24例</text>
<text class="t" x="18" y="217">＋「すり抜ける例も3件」</text>
<rect class="bar-old" x="282" y="204" width="340.0" height="16" rx="2"/>
<rect class="bar-new" x="282" y="204" width="208.4" height="16" rx="2"/>
<text class="t-xs" x="630.0" y="216">19 / 31例</text>
<text class="t" x="18" y="263">「条ごとに1件ずつ」に変える</text>
<rect class="bar-old" x="282" y="250" width="219.4" height="16" rx="2"/>
<rect class="bar-new" x="282" y="250" width="219.4" height="16" rx="2"/>
<text class="t-xs" x="509.4" y="262">20 / 20例</text>
<text class="t-bad" x="18" y="302">※「すり抜ける例も3件」と頼んだ4回だけ、鳴らない例が12件出た。</text>
<text class="t-bad" x="18" y="323">　 頼んだのは 4回 × 3件 ＝ ちょうど12件。作れないのではなく、頼まないと作らない。</text>
<text class="t-good" x="18" y="344">※「条ごとに1件ずつ」に変えた4回は、20例すべてが鳴り、</text>
<text class="t-good" x="18" y="365">　 AIの申告（どの条に当たるか）も 10件中10件が実際と一致した。</text>
<text class="t-xs" x="18" y="386">架空データでの実測（全24回）。生の返りは docs/evidence/ に置いてある。</text>
</svg>
