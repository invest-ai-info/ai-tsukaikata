<svg xmlns="http://www.w3.org/2000/svg" width="720" height="407" viewBox="0 0 720 407" role="img" aria-label="AIが作った壊れ例のうち、点検の5条が実際に鳴った例の数を頼み方4通りで並べた横棒グラフ。棒全体が作られた例の数、濃い部分が実際に鳴った例の数。そのままわざと壊して確かめてと頼んだ4回は27例中21例が鳴った。6件作ってどの条か書いてと足した4回は24例中22例。すり抜ける例も3件と足した4回は31例中19例で、鳴らない例が12件出ている。条ごとに1件ずつに変えた4回は20例すべてが鳴り、鳴らない例は0件だった。鳴らない例が大きく出たのは、すり抜ける例を明示的に頼んだ回だけで、その数は頼んだ数とちょうど同じ12件である。">
<style>
