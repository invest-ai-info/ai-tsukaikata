<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-label="短い見本に含まれていなかった接続詞は、どちらの頼み方でも0回のままだったことを示す横棒グラフ。犬「ちなみに」はフル見本の実物（先行記事）が2回、短い見本・単純は0回、短い見本・2段階も0回。万年筆「そもそも」もフル見本の実物が2回、短い見本・単純は0回、短い見本・2段階も0回。縦の点線はフル見本の実物の回数（2回）を示す。下の枠には、短い見本（1〜2文）には「ちなみに」「そもそも」が含まれていなかったこと、結果、単純版・2段階版とも4回中4回この接続詞を1回も使わなかったことが書かれている。">
