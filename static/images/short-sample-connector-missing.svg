<text class="t-sm" x="330.0" y="266">0回</text>
<rect class="box-accent" x="18" y="290.0" width="684" height="52" rx="6"/>
<text class="t-accent" x="34" y="312.0">短い見本（1〜2文）には「ちなみに」「そもそも」が含まれていなかった。</text>
<text class="t-accent" x="34" y="330.0">結果、単純版・2段階版とも4回中4回、この接続詞を1回も使わなかった。</text>
