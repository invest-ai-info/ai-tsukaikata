<rect class="bg" x="0" y="0" width="720" height="352"/>
<text class="t-strong" x="18" y="26">見本に無かった接続詞は、どちらの頼み方でも0回のままだった</text>
<text class="t-sm" x="18" y="45">実測2026-10-20。1〜2文に短縮した見本には「ちなみに」「そもそも」が1回も入っていない。</text>
<text class="t-sm" x="18" y="64">フル見本（7〜9文・先行記事2026-10-14実測）では、実物も再現も2回で揃っていた。</text>
