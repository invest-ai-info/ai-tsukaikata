<rect class="bar-out" x="90" y="479" width="459.0" height="22" rx="3"/>
<text class="t-xs" x="555.0" y="494.0">17日</text>
<line class="line" x1="225.0" y1="114" x2="225.0" y2="505" style="stroke-dasharray:4,3"/>
<line class="line" x1="279.0" y1="114" x2="279.0" y2="505" style="stroke-dasharray:4,3"/>
<text class="t-xs" x="215.0" y="110">5日</text>
<text class="t-xs" x="269.0" y="110">7日</text>
<rect class="box-accent" x="18" y="519" width="684" height="56" rx="6"/>
<text class="t-accent" x="34" y="539">R-04・R-07・R-16の3件は、5日ルールなら催促するが、AIの基準（7日）ではまだ早い。</text>
<text class="t-sm" x="34" y="557">自分の基準を書かないと、この3件はAIの基準に沿ってそのまま見送られる。</text>
</svg>
