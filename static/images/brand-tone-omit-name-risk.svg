<svg xmlns="http://www.w3.org/2000/svg" width="720" height="326" viewBox="0 0 720 326" role="img" aria-label="店名を省いたときに確認を返した割合を示す横棒グラフ。ふだんの頼み方(ガードなし)は2回中1回(50%)だけ確認し、残り1回は確認せず直前のブランドのトーンのまま投稿文を作った。「店名が無ければ必ず確認して」という一文を足した版(ガードあり)は2回とも確認した(100%)。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="326"/>
<text class="t-strong" x="18" y="26">店名を省いたとき、確認したのはガードなしで2回中1回だけ</text>
<text class="t-sm" x="18" y="45">同じ会話で2ブランドのトーンを渡した後、店名も商品名も書かずに「もう1件」と頼んだ場合。</text>
<text class="t-sm" x="18" y="64">ガードなしで確認しなかった1回は、直前に使っていた敬語トーンのまま投稿文を作ってしまった。</text>
<line class="line" x1="230.0" y1="142" x2="230.0" y2="148"/>
<text class="t-xs" x="230.0" y="136" text-anchor="middle">0%</text>
<line class="line" x1="330.0" y1="142" x2="330.0" y2="148"/>
<text class="t-xs" x="330.0" y="136" text-anchor="middle">25%</text>
<line class="line" x1="430.0" y1="142" x2="430.0" y2="148"/>
<text class="t-xs" x="430.0" y="136" text-anchor="middle">50%</text>
<line class="line" x1="530.0" y1="142" x2="530.0" y2="148"/>
<text class="t-xs" x="530.0" y="136" text-anchor="middle">75%</text>
<line class="line" x1="630.0" y1="142" x2="630.0" y2="148"/>
<text class="t-xs" x="630.0" y="136" text-anchor="middle">100%</text>
<line class="line" x1="230.0" y1="145" x2="630.0" y2="145"/>
<text class="t" x="18" y="165">ふだんの頼み方</text>
<text class="t-xs" x="18" y="180">(ガードなし)</text>
<rect class="box" x="230.0" y="161.0" width="400.0" height="24"/>
<rect class="bar-old" x="230.0" y="161.0" width="200.0" height="24"/>
<text class="t-strong" x="438.0" y="178" style="font-size:12.5px">確認1/2回</text>
<text class="t" x="18" y="245">「店名が無ければ必ず確認して」を足す</text>
<text class="t-xs" x="18" y="260">(ガードあり)</text>
<rect class="box" x="230.0" y="241.0" width="400.0" height="24"/>
<rect class="bar-new" x="230.0" y="241.0" width="400.0" height="24"/>
<text class="t-strong" x="638.0" y="258" style="font-size:12.5px">確認2/2回</text>
<text class="t-xs" x="18" y="294">※ いずれもn=2と少数の実測です。この条件・この2回での結果として扱ってください。</text>
</svg>
