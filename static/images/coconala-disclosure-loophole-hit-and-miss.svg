<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">原文を貼ると、「開示すれば足りる」という誤った救済策が10回中9回消えた</text>
<text class="t-sm" x="18" y="45">実測2026-10-21。架空の案件文2本（SNSアイコン・VTuber立ち絵）。</text>
<text class="t-sm" x="18" y="64">結論の方向が正しかった回数は多いほど良い。救済策を提案した回数は少ないほど良い。</text>
