<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="ココナラのAIイラスト出品禁止ルールについて、素朴に聞いた場合と規約原文を貼って聞いた場合の結果を比べた表。結論の方向(避けるべき)が正しかった回数は、素朴な6回・原文を貼った10回のどちらも全数。規約原文を引用した回数は、素朴な6回では0回、原文を貼った10回では10回。「発注者に開示して合意を得れば問題ない」という、原文には無い救済策を提案した回数は、素朴な6回では6回、原文を貼った10回では1回。下の枠には、素朴に聞くと結論は合っていても根拠は原文に基づかず6回とも救済策が混ざったこと、原文を貼ると10回中9回はこの救済策が消えたことが書かれている。">
