<rect class="box-accent" x="18" y="302" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="322">素朴に聞くと、結論は6回とも合っていたが、根拠は原文に基づかず6回とも救済策が混ざった。</text>
<text class="t-accent" x="34" y="340">原文を貼ると、結論に加えて根拠も正しくなり、救済策が出た回は10回中1回まで減った。</text>
