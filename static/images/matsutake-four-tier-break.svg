<svg xmlns="http://www.w3.org/2000/svg" width="720" height="374" viewBox="0 0 720 374" role="img" aria-label="材料A（記事執筆代行）に「安い/標準/高い/特急」の4段階見積もりを1回頼んだ結果を示す横棒グラフ。安い8,000円・標準15,000円・高い28,000円・特急27,000円（特急だけ赤で強調）。特急は高いプランより1,000円安い。下の枠には、安い→標準→高いの比率は1.875倍・1.867倍で6回の実測クラスターとほぼ重なったこと、特急は標準の内容に特急料金を足す方式で決まり高いプランより安くなったこと、段を増やす指示は比率で段を増やすとは限らず4段目が金額の並びを守らずに割り込んできたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="374"/>
<text class="t-strong" x="18" y="26">4段目の「特急」は、高いプランより安く割り込んだ</text>
<text class="t-sm" x="18" y="45">材料A（記事執筆代行）に「安い/標準/高い/特急」の4段階を1回だけ頼んだ結果。</text>
<text class="t-sm" x="18" y="64">特急は作業内容を標準のままにし、納期短縮の特急料金12,000円を足して27,000円にしていた。</text>
<text class="t-strong" x="18" y="124">安い</text>
<rect class="bar-in" x="230" y="111" width="114" height="18" rx="3"/>
<text class="t-strong" x="352" y="124">8,000円</text>
<text class="t-strong" x="18" y="168">標準</text>
<rect class="bar-in" x="230" y="155" width="214" height="18" rx="3"/>
<text class="t-strong" x="452" y="168">15,000円</text>
<text class="t-strong" x="18" y="212">高い</text>
<rect class="bar-in" x="230" y="199" width="400" height="18" rx="3"/>
<text class="t-strong" x="638" y="212">28,000円</text>
<text class="t-strong" x="18" y="256">特急（4段目として追加）</text>
<rect class="box-bad" x="230" y="243" width="386" height="18" rx="3"/>
<text class="t-strong" x="624" y="256">27,000円</text>
<rect class="box-accent" x="18" y="290" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="310">安い→標準→高いの比率は1.875倍・1.867倍で、6回の実測クラスター（1.88〜2.00倍）とほぼ重なった。</text>
<text class="t-accent" x="34" y="328">特急だけ「標準の内容＋特急料金」という足し算で決まり、高いプラン28,000円より1,000円安い27,000円。</text>
<text class="t-accent" x="34" y="346">段を増やす指示は、比率で段を増やすとは限らない。4段目は金額の並びを守らずに割り込んできた。</text>
</svg>
