<text class="t-xs" x="18" y="289">※ 9/4と9/7は、どちらも「翌営業日」の規則で説明でき、この2件だけでは区別できない。</text>
<text class="t-xs" x="18" y="310">※ 版aの真値は「週末のみ除いた場合」。版b・cの真値は架空の祝日表ありの場合で、両者は別の値になる。</text>
<text class="t-xs" x="18" y="331">架空データでの実測。生の返り12回は docs/evidence/ に全文置いてある。</text>
