<svg xmlns="http://www.w3.org/2000/svg" width="720" height="347" viewBox="0 0 720 347" role="img" aria-label="受注日4件（9/4金・9/7月・9/18金・9/28月）に「中5営業日で」と逆算させた結果を、版ごとに並べたマス目。休みを言わない版aは、起算日の決め方が3通りに割れた——9/4と9/7は翌営業日にずらす規則で説明でき区別できない、9/18は非営業日を着手日にする、9/28は答えた着手日と計算が矛盾する。架空の祝日表を渡した版bと、さらに数え方の定義文を足した版cは、どちらも4件とも真値と一致し、結果の内容も完全に同じだった。">
