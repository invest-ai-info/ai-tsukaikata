<text class="t-sm" x="18" y="234">版c　＋数え方の定義文</text>
<rect class="box-good" x="210" y="214" width="96" height="32" rx="4"/>
<text class="t-good" x="246.8" y="234">一致</text>
<rect class="box-good" x="316" y="214" width="96" height="32" rx="4"/>
