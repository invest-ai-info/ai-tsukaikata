<rect class="bg" x="0" y="0" width="720" height="347"/>
<text class="t-strong" x="18" y="26">休みを言わない版は、起算日の決め方が3通りに割れた</text>
<text class="t-sm" x="18" y="45">受注日4件（金曜／祝日前日の月曜／連休直前の金曜／月をまたぐ月曜）に「中5営業日で」とだけ頼んだ（版a）。</text>
<text class="t-sm" x="18" y="64">同じ4件に、架空の祝日表を渡した版（版b）と、数え方の定義文まで足した版（版c）も試した。</text>
<text class="t-sm" x="18" y="83">版b・版cは、返ってきた着手日・納品日が4件とも真値と一致し、内容も完全に同じだった。</text>
<text class="t-xs" x="236.0" y="118">9/4(金)</text>
