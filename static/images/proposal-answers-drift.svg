<rect class="bg" x="0" y="0" width="720" height="539"/>
<text class="t-strong" x="18" y="26">他人と被る前に、自分の4本の中で割れていた</text>
<text class="t-sm" x="18" y="45">募集文が「必ず書いてください」と指定した5項目のうち、数字で比べられる3項目を数えたもの。</text>
<text class="t-sm" x="18" y="64">同じ募集文から作った4本の答えが、何種類に分かれたか。1 なら4本とも同じ値、4 なら全部ばらばら。</text>
<text class="t-sm" x="18" y="83">5項目に答えたかどうかで見れば、24本すべてが 5/5 で満点である。割れているのは中身のほう。</text>
