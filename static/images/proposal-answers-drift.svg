<svg xmlns="http://www.w3.org/2000/svg" width="720" height="539" viewBox="0 0 720 539" role="img" aria-label="架空の募集文が必ず書いてくださいと指定した5項目のうち、数字で比べられる3項目について、同じ募集文から作った4本の答えが何種類に分かれたかを並べた表。素材メモを渡さない場合、希望単価は記事執筆で3種類、手順書の清書で4種類。1週間に使える時間はどちらも3種類。初稿までの日数はどちらも2種類だった。素材メモを渡した場合は、単価も時間も日数も、どちらの募集文でも1種類、つまり4本とも同じ値である。5項目に答えたかどうかで見れば24本すべてが5項目中5項目で満点なので、割れているのは答えの中身のほうだけである。素材メモを渡さない8本に実際に出た値は、単価が1文字1.2円、1.0円、1文字1.5円、1本4,000円、1本4,500円、1本5,000円。時間が8時間、10時間、12時間。日数が3日と4日だった。手順書の清書では1本あたりの金額と1文字あたりの金額が混ざり、数え方そのものが4本で違っている。これまでに書いた記事の有無は、素材を渡さない8本とも、あります、だけで中身は0件だった。素材メモを渡した16本では、あります、だけの本は0本になる。素材をまだ渡していないときに、私が決めるという形で空欄のまま残させると、4回とも5項目すべてが空欄で残った。">
