<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="集計表の不均等さを1対3から1対6に広げても、数式が正しい値に届くかを示した表。店舗売上表でSUMIFS方式を選んだ回は5回とも80か所ずつ正解で400/400（SUBTOTAL方式は0回）、部門経費表でSUMIFS方式を選んだ回は3回とも115か所ずつ正解で345/345、SUBTOTAL方式を選んだ回は115か所中114か所の正解（1回）、SUMを階層の深さで割る方式を選んだ回は115か所中113か所の正解（1回）。下の枠には、SUMIFS方式は合計8回・745か所すべてで正しい値に届いたこと、SUBTOTAL方式は前作と同じく1か所だけ崩れ場所も増えなかったこと、見たことのない第3の方式は2か所崩れ総合計まで連鎖したことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">比率を1対6に広げても、崩れたのはやはり1か所だけ</text>
<text class="t-sm" x="18" y="45">実測2026-10-12。店舗売上表（570行・80か所）・部門経費表（640行・115か所）を各5回。</text>
<text class="t-sm" x="18" y="64">返ってきた数式を同じ階層の他セルへコピーし直して全箇所を再計算した。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">店舗売上表・SUMIFS方式を選んだ回（5回・SUBTOTAL方式は0回）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">400/400</text>
<text class="t" x="18" y="157">部門経費表・SUMIFS方式を選んだ回（3回）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">345/345</text>
<text class="t" x="18" y="189">部門経費表・SUBTOTAL方式を選んだ回（1回）</text>
<rect class="box" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-sm" x="558.0" y="189" text-anchor="middle" style="font-weight:700">114/115</text>
<text class="t" x="18" y="221">部門経費表・SUMを階層の深さで割る方式を選んだ回（1回）</text>
<rect class="box" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-sm" x="558.0" y="221" text-anchor="middle" style="font-weight:700">113/115</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">SUMIFS方式（ラベルの文字列で絞り込む）は、合計8回・745か所すべてで正しい値に届いた。</text>
<text class="t-accent" x="34" y="276">SUBTOTAL方式は前作（不均等「1対3」）と同じく1か所だけ崩れた——場所も増えなかった。</text>
<text class="t-accent" x="34" y="294">見たことのない第3の方式（SUMを階層の深さで割る）は2か所崩れ、総合計まで連鎖した。</text>
</svg>
