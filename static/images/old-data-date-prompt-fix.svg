<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="同じ参考データ15件（2023年〜2024年）に聞き方だけを変えた結果を示す表。自然に聞いた材料G・H計6回のうち、データの日付が古いと自分から言及したのは2回。「何か変だと思う点は」と開いて聞いた2回のうち言及したのは1回。今日の日付（2026年11月15日）から見て何年前かを先に確認させた2回は2回とも言及した。最初の回答で古さに触れなかった回に、あとから「気づいていましたか」と聞き直すと2回とも認めた。下の枠には、今日の日付を先に計算させると2回とも古いと明言すること、開いた問いだけでは2回中1回にとどまること、あとから直接聞けば2回とも認めることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="340"/>
<text class="t-strong" x="18" y="26">「今日の日付から何年前か」を先に聞くと、古さの指摘が安定する</text>
<text class="t-sm" x="18" y="45">実測2026-11-15。同じ参考データ15件（2023〜2024年）に、聞き方だけを変えた。</text>
<text class="t-sm" x="18" y="64">上段＝自然な聞き方。下段＝今日の日付を先に確認させる／あとから聞き直す、の2つの直し方。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">自然に聞く（材料G＋H・計6回）</text>
<rect class="box" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="125" text-anchor="middle" style="font-weight:700">2/6</text>
<text class="t" x="18" y="157">「何か変だと思う点は」と開いて聞く（2回）</text>
<rect class="box" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="157" text-anchor="middle" style="font-weight:700">1/2</text>
<text class="t" x="18" y="189">今日の日付を先に確認させる（2回）</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="221">あとから「気づいていましたか」と聞き直す（2回）</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="82" rx="6"/>
<text class="t-accent" x="34" y="258">今日の日付（2026年11月15日）から見て何年前・何か月前かを先に計算させると、2回とも</text>
<text class="t-accent" x="34" y="276">「古い」と明言した。開いた問い（「何か変だと思う点は」）だけでは2回中1回にとどまった。</text>
<text class="t-accent" x="34" y="294">最初の回答で古さに触れなかった2回に、あとから直接「気づいていましたか」と聞くと、</text>
<text class="t-accent" x="34" y="312">2回とも「古い」と認めた。知識が無いわけではなく、聞き方次第で使うかどうかが変わる。</text>
</svg>
