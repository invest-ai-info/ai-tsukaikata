</style>
<rect class="bg" x="0" y="0" width="720" height="272"/>
<text class="t-strong" x="18" y="26">「本文は一字一句そのまま」の一文を足すと、一致率は5/8から10/10に変わった</text>
<text class="t-sm" x="18" y="45">前作（一文を足す前）の実測は8回中5回のみ本文が一致。今回、一文を足して材料5本×各2回を実測した。</text>
<text class="t-sm" x="18" y="64">あわせて、既存の「前日より前を指す語で止める」受け皿が壊れていないかも材料1本×2回で確認した。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">前作＝一文を足す前。本文が一致した回数（8回中）</text>
<rect class="box" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="558.0" y="125" text-anchor="middle" style="font-weight:700">5/8</text>
<text class="t" x="18" y="157">今回＝一文を足した後。本文が一致した回数（材料A・B・C・D・F、計10回）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="189">今回、既存の「止まる」受け皿が壊れていないか（材料E、2回）</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="206" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="226">追記した本文の一字一句は、指示文で明示的に約束させない限り保たれるとは限らない。</text>
<text class="t-accent" x="34" y="244">新しい一文を足すときは、それが既存の別のルールを壊していないかも同じ実測で確かめる（★148）。</text>
</svg>
