<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img" aria-label="行ごとの一致率を示す表形式の図。前作（一文を足す前）は本文が一致したのが8回中5回だった。今回、追記する本文は入力された文章を一字一句そのまま使ってくださいという一文を指示文に足し、材料4本と長文1本の計5本を各2回、合計10回実測したところ、本文が一致した回数は10回中10回に変わった。あわせて、既存の「前日より前を指す語が出たら止める」受け皿が新しい一文で壊れていないかを別の材料1本で2回確認し、2回とも正しく作動した。下の注記には、追記した本文の一字一句は指示文で明示的に約束させない限り保たれるとは限らないこと、新しい一文を足すときはそれが既存の別のルールを壊していないかも同じ実測で確かめるべきことが書かれている。">
<style>
