<svg xmlns="http://www.w3.org/2000/svg" width="720" height="412" viewBox="0 0 720 412" role="img" aria-label="材料A（15項目）と材料B（13項目）それぞれについて、「そのまま」「わかりやすく」「わかりやすく＋省略禁止」の3条件で要約に残った項目数を比べた横棒グラフ。材料Aは、そのまま15/15、わかりやすく13/15、わかりやすく＋省略禁止15/15。材料Bは、そのまま12/13、わかりやすく12/13、わかりやすく＋省略禁止13/13。材料Aは「わかりやすく」の条件だけ満数を割り、材料Bは「そのまま」の時点ですでに1項目欠けていて「わかりやすく」でも増えていない。どちらも「省略禁止」を足した条件は満数に戻っている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="412"/>
<text class="t-strong" x="18" y="24">「わかりやすく」で残った項目数は、材料によって違う動き方をした</text>
<text class="t-sm" x="18" y="43">架空の自動監視ダイジェスト2本（材料A＝15項目・材料B＝13項目）に、3通りの指示文を各2回当てた。</text>
<text class="t-xs" x="18" y="62">縦軸は、仕込んだ数字・条件のうち要約にそのまま残った項目数。2回とも同じ数だった。</text>
<text class="t-strong" x="18" y="128">材料A（15項目中）</text>
<text class="t" x="28" y="160">そのまま</text>
<rect class="box-quiet" x="320.0" y="150" width="160.0" height="14" rx="3"/>
<rect class="box-good" x="320.0" y="150" width="160.0" height="14" rx="3"/>
<text class="t-sm" x="492.0" y="160">15/15</text>
<text class="t" x="28" y="184">わかりやすく</text>
<rect class="box-quiet" x="320.0" y="174" width="160.0" height="14" rx="3"/>
<rect class="box-bad" x="320.0" y="174" width="138.7" height="14" rx="3"/>
<text class="t-sm" x="492.0" y="184">13/15</text>
<text class="t" x="28" y="208">わかりやすく＋省略禁止</text>
<rect class="box-quiet" x="320.0" y="198" width="160.0" height="14" rx="3"/>
<rect class="box-good" x="320.0" y="198" width="160.0" height="14" rx="3"/>
<text class="t-sm" x="492.0" y="208">15/15</text>
<text class="t-strong" x="18" y="228">材料B（13項目中）</text>
<text class="t" x="28" y="260">そのまま</text>
<rect class="box-quiet" x="320.0" y="250" width="160.0" height="14" rx="3"/>
<rect class="box-bad" x="320.0" y="250" width="147.7" height="14" rx="3"/>
<text class="t-sm" x="492.0" y="260">12/13</text>
<text class="t" x="28" y="284">わかりやすく</text>
<rect class="box-quiet" x="320.0" y="274" width="160.0" height="14" rx="3"/>
<rect class="box-bad" x="320.0" y="274" width="147.7" height="14" rx="3"/>
<text class="t-sm" x="492.0" y="284">12/13</text>
<text class="t" x="28" y="308">わかりやすく＋省略禁止</text>
<rect class="box-quiet" x="320.0" y="298" width="160.0" height="14" rx="3"/>
<rect class="box-good" x="320.0" y="298" width="160.0" height="14" rx="3"/>
<text class="t-sm" x="492.0" y="308">13/13</text>
<rect class="box-accent" x="18" y="330" width="684" height="66" rx="6"/>
<text class="t-accent" x="34" y="350">材料Aは「わかりやすく」だけ2項目減った。他の2条件は満数（15/15・13/13）だった。</text>
<text class="t-accent" x="34" y="368">材料Bは「そのまま」の時点で1項目欠けており、「わかりやすく」で追加の欠落は起きなかった。</text>
<text class="t-accent" x="34" y="386">どちらも「省略禁止」を足すと満数に戻った（15/15・13/13）。</text>
</svg>
