<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="シーン延長のとき、モデルが参照する直前の秒数を示した図。従来のモデルは1秒、Gemini Omni 1.1 Flashは10秒を参照する。延長は10秒刻みで、10秒・20秒・30秒・40秒と合計40秒まで積み増せる。延長は動画の最後にしか継ぎ足せず、途中への挿入や先頭への追加はできないと明記されている。アップロードした動画の延長はEU・スイス・英国では利用できないが、モデルが生成した動画の延長・複数ターンでの継続は全地域で利用できる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="330"/>
<text class="t-strong" x="18" y="26">直前1秒しか見ていなかった延長が、10秒を見るようになった</text>
<text class="t-sm" x="18" y="45">シーン延長のとき、モデルが参照する直前の秒数。</text>
<text class="t-sm" x="18" y="64">10倍の長さを踏まえるので、続きの動きや構図が前の場面と繋がりやすくなる。</text>
<text class="t" x="18" y="108.0">従来のモデル</text>
<rect class="bar-old" x="208" y="90" width="41.2" height="24" rx="3"/>
<text class="t-sm" x="257.2" y="108.0">1秒</text>
<text class="t" x="18" y="146.0">Gemini Omni 1.1 Flash</text>
<rect class="bar-new" x="208" y="128" width="412.0" height="24" rx="3"/>
<text class="t-sm" x="628.0" y="146.0">10秒</text>
<text class="t-strong" x="18" y="194">延長は10秒刻みで、合計40秒まで積み増せる</text>
<text class="t" x="18" y="230.0">延長</text>
<rect class="bar-new" x="208.0" y="208" width="100.8" height="30" rx="3"/>
<rect class="bar-new" x="311.8" y="208" width="100.8" height="30" rx="3"/>
<rect class="bar-new" x="415.5" y="208" width="100.8" height="30" rx="3"/>
<rect class="bar-new" x="519.2" y="208" width="100.8" height="30" rx="3"/>
<text class="t-xs" x="288.8" y="254">10秒</text>
<text class="t-xs" x="392.5" y="254">20秒</text>
<text class="t-xs" x="496.2" y="254">30秒</text>
<text class="t-xs" x="600.0" y="254">40秒</text>
<text class="t-xs" x="18" y="274">※ 延長は動画の最後にしか継ぎ足せない。途中への挿入や先頭への追加はできないと明記されている。</text>
<text class="t-xs" x="18" y="292">※ アップロードした動画の延長は、EU・スイス・英国では利用できないと明記されている</text>
<text class="t-xs" x="18" y="310">　（モデルが生成した動画の延長・複数ターンでの継続は全地域で利用可）。</text>
</svg>
