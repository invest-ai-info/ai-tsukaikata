<rect class="bg" x="0" y="0" width="720" height="342"/>
<text class="t-strong" x="18" y="26">人が手動処理した5件、書き戻し忘れだと3回とも5件が再び対象に含まれた</text>
<text class="t-sm" x="18" y="45">架空の受付ログ2本（問い合わせ24件・PC故障受付24件）。前回処理済み14件・新着10件のうち、人が手動で5件を処理した。</text>
<text class="t-sm" x="18" y="64">自動側に渡す指示文はどちらの状況でも一字一句同じ。違うのは「前回位置」の記録の値だけ。</text>
<text class="t-sm" x="18" y="83">重複＝人がすでに処理した5件のうち、次の自動実行がまた対象に含めた件数（真値0）。材料2本×各3回。</text>
<text class="t-xs" x="306.0" y="120">← 真値は0件</text>
<path class="line" d="M300.0 128 L300.0 274" stroke-dasharray="4 3"/>
<text class="t" x="18" y="146">書き戻し忘れ・材料A（問い合わせ）</text>
<rect class="box-bad" x="500.0" y="134" width="3.0" height="16" rx="3"/>
<text class="t-bad" x="510.0" y="146">5・5・5件</text>
<text class="t" x="18" y="186">書き戻し忘れ・材料B（PC故障受付）</text>
<rect class="box-bad" x="500.0" y="174" width="3.0" height="16" rx="3"/>
<text class="t-bad" x="510.0" y="186">5・5・5件</text>
<text class="t" x="18" y="226">書き戻し済み・材料A（問い合わせ）</text>
<rect class="box-good" x="300.0" y="214" width="3.0" height="16" rx="3"/>
<text class="t-accent" x="510.0" y="226">0・0・0件</text>
<text class="t" x="18" y="266">書き戻し済み・材料B（PC故障受付）</text>
<rect class="box-good" x="300.0" y="254" width="3.0" height="16" rx="3"/>
<text class="t-accent" x="510.0" y="266">0・0・0件</text>
<text class="t-sm" x="18" y="298">※ 上2本＝人が処理した5件の書き戻しを忘れたまま次の自動実行を迎えた。下2本＝人が処理した最新IDまで記録を更新してから迎えた。</text>
<text class="t-xs" x="18" y="318">架空データでの実測（材料2本×3パターン×各3回＝18回、うち上下4本は各3回）。生の回答は docs/evidence/ に全文置いてある。</text>
</svg>
