<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" role="img" aria-label="自動処理の前回位置を、人の手動処理後に書き戻したかどうかで、重複件数を比べた図。人が処理した5件のうち、書き戻し忘れの材料A（問い合わせ）は3回とも5件、材料B（PC故障受付）も3回とも5件が、次の自動実行でまた対象に含まれた。書き戻し済みの材料A・材料Bはどちらも3回とも0件で、重複は起きなかった。重複の真値は0件である。">
<style>
