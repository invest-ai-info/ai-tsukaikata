<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-label="「重要度も踏まえて」という一言より、材料に理由の一文があるかどうかが優先順位を決めたことを示す図。架空のタスク一覧20件×2種類に、締切が近いが遅れても実害のない仕事4件と、締切は先でも遅れると重大な影響が出る仕事4件を仕込み、この重大4件×軽い4件＝16組のうち何組で重大側が先に並んだかを数えた。理由の一文（なぜ重要か・なぜ軽微か）を書いた材料では、「優先順位をつけて」だけの指示が64／64（100%）、「重要度も踏まえて」を足した指示も64／64（100%）で、どちらも全組で重大4件が先だった。理由の一文を消して「重要度：高・中・低」というラベルだけにすると、「優先順位をつけて」だけの指示が0／32（0%）、「重要度も踏まえて」を足した指示も0／32（0%）で、どちらも全組で軽い4件が先になり、向きが完全に逆転した。「重要度も踏まえて」という一言は、どちらの材料でも結果を動かさなかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="364"/>
<text class="t-strong" x="18" y="26">「重大4件が軽い4件より上」の割合（組ごとの勝敗）</text>
<text class="t-sm" x="18" y="45">締切は近いが遅れても実害のない4件と、締切は先でも遅れると重大な影響が出る4件を仕込み、</text>
<text class="t-sm" x="18" y="64">並べ替えの結果で「重大4件×軽い4件＝16組」がどちらを先にしたかを数えた。</text>
<text class="t-xs" x="18" y="83">数字は「重大4件が先だった組数／全体の組数」。理由の一文ありは材料2本×各2回、</text>
<text class="t-xs" x="18" y="99">ラベルのみは材料1本×各2回で数えている。</text>
<text class="t-sm" x="18" y="139.0">理由の一文あり・「優先順位をつけて」だけ</text>
<rect class="box-good" x="378" y="118" width="324.0" height="32" rx="4"/>
<text class="t-good" x="540.0" y="139.0" text-anchor="middle" style="font-weight:700">64／64（100%）</text>
<text class="t-sm" x="18" y="181.0">理由の一文あり・「重要度も踏まえて」を追加</text>
<rect class="box-good" x="378" y="160" width="324.0" height="32" rx="4"/>
<text class="t-good" x="540.0" y="181.0" text-anchor="middle" style="font-weight:700">64／64（100%）</text>
<text class="t-sm" x="18" y="223.0">ラベルのみ・「優先順位をつけて」だけ</text>
<rect class="box-bad" x="378" y="202" width="324.0" height="32" rx="4"/>
<text class="t-bad" x="540.0" y="223.0" text-anchor="middle" style="font-weight:700">0／32（0%）</text>
<text class="t-sm" x="18" y="265.0">ラベルのみ・「重要度も踏まえて」を追加</text>
<rect class="box-bad" x="378" y="244" width="324.0" height="32" rx="4"/>
<text class="t-bad" x="540.0" y="265.0" text-anchor="middle" style="font-weight:700">0／32（0%）</text>
<rect class="box-accent" x="18" y="292" width="684" height="56" rx="6"/>
<text class="t-accent" x="34" y="312">「重要度も踏まえて」と一言足しても、結果はまったく動かなかった。</text>
<text class="t-sm" x="34" y="330">決め手は指示文ではなく、材料に「なぜ重要か」を書いたかどうかだった。</text>
</svg>
