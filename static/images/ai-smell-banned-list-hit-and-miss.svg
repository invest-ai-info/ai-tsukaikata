<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="禁止語13種のうち何種が、指示のパターンごとに消えたかを示す表。(a)素朴に「人間らしく書き直して」だけの版は6回中5回で13種が全部消え、(b)禁止語13種を明示した版は6回とも全部消え、(c)禁止語13種に加えて文末の3回以上連続を禁じる一文を足した版も6回とも全部消えた。最後の行は18回を通じて文末が3回以上連続した回数で、0/18（多いほど問題という向き）。下の枠には、禁止語13種のうち12種はリストを渡さなくても6回とも出なかったこと、リストで実際に消えたのは6回中1回に残った「ぜひ」という最後の1語だけだったこと、文末の3回以上連続は18回とも起きず機械的ルールの追加効果はこの実験では確認できなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">禁止語13種のうち12種は、リストを渡さなくても消えていた</text>
<text class="t-sm" x="18" y="45">実測2026-10-07。架空ブログ下書き2本×3パターン×各3回＝18回。</text>
<text class="t-sm" x="18" y="64">すべて「禁止語13種が全部消えた回数」（多いほど良い）。最後の行だけ例外。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">(a) 素朴に「人間らしく書き直して」だけ</text>
<rect class="box" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="125" text-anchor="middle" style="font-weight:700">5/6</text>
<text class="t" x="18" y="157">(b) 禁止語13種を明示</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="189">(c) 禁止語13種＋文末の3回連続禁止</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="221">18回中、文末が3回以上連続した回数</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">0/18</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">禁止語13種のうち12種は、リストを渡さなかった6回でも一度も出なかった。</text>
<text class="t-accent" x="34" y="276">リストで消えたのは、6回中1回に残った「ぜひ」という最後の1語だけだった。</text>
<text class="t-accent" x="34" y="294">文末の3回以上連続は18回とも一度も起きず、機械的ルール(c)の追加効果は確認できなかった。</text>
</svg>
