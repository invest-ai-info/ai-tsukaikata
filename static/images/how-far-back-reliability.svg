<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="計算そのものの的中率を4行で示した図。すべて「指示どおりになった回数／試した回数」。目安の計算が真値（単純平均）と一致したのは2週・4週・8週の各2回ずつ合計6回中6回。週ごとの小計を先に出させる言い直し方でも、小計8個すべてが真値と一致したのは2回中2回。保存版（①②③の3項目だけを出す指示）の書式が崩れなかったのは材料Bの2回中2回。祝日で0件だった日を指示どおり目安の計算から除外できたのは2回中2回。下の枠には、崩れていたのはAIの計算力ではなく「ふだん」の定義そのものだったこと、週ごとの小計を先に出す言い直し方でも最終的な目安と倍率は変わらなかったこと、祝日除外と保存版の書式は明示すれば2回とも確実に効いたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">計算そのものは、条件を変えても崩れなかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-03。架空の受信件数ログ2本（問い合わせフォーム・来店予約）で、AI自身の計算を真値（単純平均）と照合した。</text>
<text class="t-sm" x="18" y="64">「ふだんの目安」という言葉のあいまいさとは別に、計算の正確さ自体は毎回そろっている。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">目安の計算が真値（単純平均）と一致（2週/4週/8週・各2回）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="157">週ごとの小計を先に出させても、小計8個すべてが真値と一致（各2回）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="189">保存版（①②③の3項目だけ）の書式が崩れなかった（材料B・各2回）</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="221">祝日で0件だった日を、指示どおり目安の計算から除外できた（各2回）</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">崩れていたのはAIの計算力ではなく、「ふだん」の定義そのものだった。</text>
<text class="t-accent" x="34" y="276">条件を「週ごとの小計を先に出して」と変えても、最終的な目安と倍率は変わらなかった。</text>
<text class="t-accent" x="34" y="294">祝日除外・保存版の書式は、明示すれば2回とも確実に効いた。</text>
</svg>
