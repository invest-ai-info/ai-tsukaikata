<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="「分からない場合は分からないと答えて」という一文が、範囲を聞く質問と金額を計算させる質問で効き方が違ったことを示す表。すべて具体的な数字を言い切った回数で、少ないほど逃げ道が効いている。範囲を聞く質問（70%ロイヤリティを選べる価格帯はいくらからいくらまでか）は、逃げ道なしで6回中4回が具体的な数字（250円〜1,250円、実際は1,650円で誤り）を言い切ったが、逃げ道の一文を末尾に足すと6回中0回、先頭に足しても6回中0回に下がった。金額を計算させる質問（500円のKindle本の印税はいくらか）は、逃げ道なしで4回中4回が具体的な金額（175円・350円など）を計算し、同じ逃げ道の一文を足しても4回中4回のまま動かなかった。「計算例も出すな」まで名指しした一文を足して初めて4回中0回になった。下の枠には、範囲の質問では逃げ道の一文だけで4/6から0/6に下がったこと（位置は前後どちらでも同じ）、金額を計算させる質問では同じ逃げ道の一文が4/4のまま動かなかったこと、「分からない」と言いながら計算例だけは書いてくるので計算例そのものを名指しで禁止する必要があったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">「分からないと答えて」は、範囲では効いたが金額計算では効かなかった</text>
<text class="t-sm" x="18" y="45">実測2026-09-22。Kindleロイヤリティの話題で、資料は一切見せていない。</text>
<text class="t-sm" x="18" y="64">すべて「具体的な数字を言い切った回数」（少ないほど逃げ道が効いている）。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">範囲を聞く・逃げ道なし（「いくらからいくらまで」）</text>
<rect class="box-bad" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="125" text-anchor="middle" style="font-weight:700">4/6</text>
<text class="t" x="18" y="157">範囲を聞く・逃げ道を末尾に追加</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">0/6</text>
<text class="t" x="18" y="189">範囲を聞く・逃げ道を先頭に追加</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">0/6</text>
<text class="t" x="18" y="221">金額を計算させる・逃げ道なし（「いくらですか」）</text>
<rect class="box-bad" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="221" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="253">金額を計算させる・逃げ道を追加（「分からない場合は分からないと」）</text>
<rect class="box-bad" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="253" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="285">金額を計算させる・「計算例も出すな」まで追加</text>
<rect class="box-good" x="478" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="285" text-anchor="middle" style="font-weight:700">0/4</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">範囲の質問では、逃げ道の一文だけで4/6→0/6に下がった（位置は前後どちらでも同じ）。</text>
<text class="t-accent" x="34" y="340">金額を計算させる質問では、同じ逃げ道の一文は4/4のまま動かなかった。</text>
<text class="t-accent" x="34" y="358">「分からない」と言いながら計算例だけは書いてくる。止めるには計算例そのものを名指しで禁止する必要があった。</text>
</svg>
