<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-label="実際にAIイラスト出品を禁止しているプラットフォーム名を募集文に明記したときと、伏せたときの比較。イラスト制作案件(禁止対象カテゴリ)にプラットフォーム名を明記した5回は、5回とも規約の具体的な中身を自分から語ったが、真値(公式ガイドライン原文)と一致したのは0件で、3回は禁止されていないという正反対、2回は開示すれば足りるという弱い説明だった。名前を伏せた5回は具体的な言及が0件。レシピコラム案件(禁止対象外カテゴリ)は、名前を明記しても伏せても具体的な言及は0件だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="490"/>
<text class="t-strong" x="18" y="26">実際に禁止されているカテゴリでは、名前を出すと5回とも規約を語った</text>
<text class="t-sm" x="18" y="45">架空の募集文2パターン（イラスト制作＝ココナラが実際にAI生成物の出品を禁止しているカテゴリ／</text>
<text class="t-sm" x="18" y="64">レシピコラム執筆＝禁止対象外）に、AI利用についての記載は一切入れていない。「ココナラで募集しています」と</text>
<text class="t-sm" x="18" y="83">明記した版と、「オンラインのスキルマーケット」に置き換えた版で、同じ質問を各5回ずつ試した（計20回）。</text>
<text class="t-xs" x="18" y="102">生の回答と真値との突き合わせは docs/evidence/ に全文置いてある。</text>
<text class="t-xs" x="18" y="133">イラスト制作・伏せた</text>
<text class="t" x="70" y="158" style="font-size:11px">規約に言及した回数・5回中0回</text>
<rect class="box-quiet" x="300" y="138" width="300" height="28" rx="3"/>
<text class="t-good" x="610" y="158">0/5回</text>
<text class="t-xs" x="18" y="187">イラスト制作・ココナラと明記</text>
<text class="t" x="70" y="212" style="font-size:11px">規約に言及した回数・5回中5回（うち真値と一致0件）</text>
<rect class="box-quiet" x="300" y="192" width="300" height="28" rx="3"/>
<rect class="box-bad" x="300" y="192" width="300.0" height="28" rx="3"/>
<text class="t-bad" x="610" y="212">5/5回</text>
<text class="t-xs" x="18" y="241">レシピコラム・伏せた</text>
<text class="t" x="70" y="266" style="font-size:11px">規約に言及した回数・5回中0回</text>
<rect class="box-quiet" x="300" y="246" width="300" height="28" rx="3"/>
<text class="t-good" x="610" y="266">0/5回</text>
<text class="t-xs" x="18" y="295">レシピコラム・ココナラと明記</text>
<text class="t" x="70" y="320" style="font-size:11px">規約に言及した回数・5回中0回</text>
<rect class="box-quiet" x="300" y="300" width="300" height="28" rx="3"/>
<text class="t-good" x="610" y="320">0/5回</text>
<rect class="box-quiet" x="18" y="358" width="678" height="108" rx="6"/>
<text class="t-strong" x="34" y="380">言及した5件のうち、真値(公式ガイドライン原文)と一致したのは0件。</text>
<text class="t-sm" x="34" y="400">真値は「AI技術を利用したイラスト生成サービスは、一律で出品を禁止しています」。</text>
<text class="t-sm" x="34" y="418">3件は「禁止されていない」という正反対の断定、2件は「明示すれば出品できる」という</text>
<text class="t-sm" x="34" y="436">実際には無い開示制度への言い換えだった。</text>
<text class="t-xs" x="34" y="454">話題が当たっていても、中身まで合っているとは限らない。</text>
</svg>
