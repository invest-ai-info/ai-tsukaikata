<rect class="bg" x="0" y="0" width="720" height="458"/>
<text class="t-strong" x="18" y="26">「件数が少ない順に、件数と日付も」と頼んだ20回の一致・不一致</text>
<text class="t-sm" x="18" y="45">○＝申告した件数・列挙した日付・真値がすべて一致。×＝申告した件数が日付の数とも真値とも食い違った。</text>
<text class="t-sm" x="18" y="64">△＝いったん数え間違えたが、同じ回答の中で自分から数え直して訂正した。</text>
<text class="t-xs" x="326" y="110" text-anchor="middle">材料A 1回目</text>
