<svg xmlns="http://www.w3.org/2000/svg" width="720" height="458" viewBox="0 0 720 458" role="img" aria-label="「この見積もりで、いちばん外れやすい工程はどれですか。根拠にした記録の件数が少ない順に並べてください。件数と、根拠にした記録の日付も書いてください」と、5通りの前置き（素朴に聞く・先に最大値だけを基準にする質問を挟む・先に2工程だけに絞る質問を挟む・先に無関係な雑談を挟む・「何件から選んだかを書いてください」を念押しで足す）×材料2本×各2回＝20回試した結果の表。素朴に聞いた回は、材料Aの1回目は件数・日付とも真値と一致したが、2回目は「下調べ」を4件のところ5件と申告し、自分で挙げた日付は4つしか書けていなかった。材料Bは1回目・2回目とも一致。先に最大値だけを基準にする質問を挟んだ回は、材料A・材料Bとも1回目・2回目とも一致。先に2工程だけに絞る質問を挟んだ回は、材料Aの2回目でまた「下調べ」を5件と申告する同じ誤りが起きたが、他の3回は一致。先に無関係な雑談を挟んだ回は、材料Bの1回目で「修正」をいったん6件と申告したあと、同じ回答の中で「数え直すと7件でした」と自分で訂正した。他の3回は一致。「何件から選んだかを書いてください」を念押しで足した回は、材料A・材料Bとも1回目・2回目とも一致し、この4回だけは食い違いが1件も起きなかった。">
