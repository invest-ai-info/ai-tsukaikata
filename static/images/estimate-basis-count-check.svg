<text class="t-bad" x="18" y="390">※ ×の2回はどちらも「下調べ」を4件のところ5件と申告し、自分で挙げた日付は4つしか書けていなかった。</text>
<text class="t-accent" x="18" y="412">※ △は「修正」をいったん6件と書いたあと、同じ回答の中で「数え直すと7件でした」と自分で訂正した回。</text>
<text class="t-xs" x="18" y="434">架空データでの実測。20回とも、会話の文脈を引き継がない独立した回答。生の回答は docs/evidence/ に全文置いてある。</text>
