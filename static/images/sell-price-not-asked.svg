    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">棚卸しを頼むと、聞いていない金額が付いてくる</text>
<text class="t-sm" x="18" y="45">架空の会社員の箇条書き21行。同じ材料で、頼み方だけを変えた。金額の数え上げは正規表現（数字＋円／万円）。</text>
<text class="t-sm" x="330" y="86">金額を書くなと言ったか</text>
<text class="t-sm" x="500" y="86">返りに出た金額</text>
<text class="t" x="18" y="120">「私は何で稼げますか。一言で」</text>
<text class="t-bad" x="330" y="120">言っていない</text>
<text class="t-bad" x="500" y="120">3件</text>
<text class="t" x="18" y="148">「売れそうなものを挙げて」</text>
<text class="t-bad" x="330" y="148">言っていない</text>
<text class="t-bad" x="500" y="148">4件</text>
<text class="t" x="18" y="176">「募集されている仕事の名前に」</text>
<text class="t-good" x="330" y="176">言った</text>
<text class="t-good" x="500" y="176">0件</text>
<text class="t" x="18" y="204">「相場を自分で確かめる手順を」</text>
<text class="t-good" x="330" y="204">言った</text>
<text class="t-good" x="500" y="204">0件</text>
<text class="t-strong" x="18" y="246">頼んでいないのに出てきた金額（そのまま引用）</text>
<text class="t-sm" x="18" y="264">・単価が時間2,000〜3,000円のあたりから始まるとして、最初の数ヶ月は月2〜5万円</text>
<text class="t-sm" x="18" y="284">・雛形づくりが1件1〜3万円、リストの整理が1,000件で1〜3万円あたりから</text>
<text class="t-sm" x="18" y="304">・引き継ぎ書の代行は（中略）1本5〜15万円くらいのレンジ</text>
<text class="t-xs" x="18" y="338">※ 金額を禁じた側は、断ったうえで理由まで書いた＝「推測の数字は、当てにできる数字と見た目が同じ」。</text>
<text class="t-xs" x="18" y="356">※ どの数字にも出どころが書かれていない。募集ページを開いて確かめた数字ではない。</text>
</svg>
