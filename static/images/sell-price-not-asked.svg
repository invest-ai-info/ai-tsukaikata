<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="架空の会社員の箇条書き21行を渡して、頼み方だけを変えたときに、返りに金額がいくつ出るかを比べた表。私は何で稼げますかと一言で聞いた場合、金額を書くなとは言っておらず、返りに金額が3件出た。売れそうなものを挙げてと頼んだ場合も、言っておらず、金額が4件出た。募集されている仕事の名前に対応づけてくださいと頼み、実際に募集ページを見て確かめた数字でない限り金額を書かないでくださいと足した場合は、0件だった。相場を自分で確かめる手順を書いてくださいと頼み、同じ禁止を足した場合も0件だった。頼んでいないのに出てきた金額は次のとおり。単価が時間2,000から3,000円のあたりから始まるとして、最初の数ヶ月は月2から5万円。雛形づくりが1件1から3万円、リストの整理が1,000件で1から3万円あたりから。引き継ぎ書の代行は1本5から15万円くらいのレンジ。金額を禁じた側は、断ったうえで理由まで書いた。推測の数字は、当てにできる数字と見た目が同じだから混ぜないのが安全だ、という理由である。どの数字にも出どころが書かれておらず、募集ページを開いて確かめた数字ではない。">
<style>
