<svg xmlns="http://www.w3.org/2000/svg" width="720" height="444" viewBox="0 0 720 444" role="img" aria-label="抜き取り件数を1件から10件まで増やしたときに、20件中5件の不良を1つも拾わない確率を示した横棒グラフ。組み合わせの計算による理論値で、実験ではない。1件は75.0%、2件は55.3%、3件（今回の記事の運用・濃い色）は39.9%、4件は28.2%、5件は19.4%、6件は12.9%、7件は8.3%、8件は5.1%、9件は3.0%、10件は1.6%。下の枠には、抜き取りが少ないと拾えないのは判定が甘いからではなくそもそも母数が足りないから、この記事の全数確認（20件全部）ならこの確率は0%になるという結論が書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="444"/>
<text class="t-strong" x="18" y="26">抜き取り3件では、不良を1つも拾わない確率がまだ4割ある</text>
<text class="t-sm" x="18" y="45">20件中5件が不良のとき、無作為にn件を抜き取っても不良を1つも含まない確率（組み合わせの計算。実験ではない）。</text>
<text class="t-sm" x="18" y="64">3件（濃い色＝今回の記事の運用）は39.9%。半分以下にするには6件、1割を切るには8件が要る。</text>
<text class="t-sm" x="18" y="126.0">1件</text>
<rect class="bar-old" x="66" y="112" width="450.0" height="20" rx="3"/>
<text class="t-xs" x="522.0" y="126.0">75.0%</text>
<text class="t-sm" x="18" y="151.0">2件</text>
<rect class="bar-old" x="66" y="137" width="331.8" height="20" rx="3"/>
<text class="t-xs" x="403.8" y="151.0">55.3%</text>
<text class="t-sm" x="18" y="176.0">3件</text>
<rect class="bar-out" x="66" y="162" width="239.4" height="20" rx="3"/>
<text class="t-xs" x="311.4" y="176.0">39.9%</text>
<text class="t-sm" x="18" y="201.0">4件</text>
<rect class="bar-old" x="66" y="187" width="169.2" height="20" rx="3"/>
<text class="t-xs" x="241.2" y="201.0">28.2%</text>
<text class="t-sm" x="18" y="226.0">5件</text>
<rect class="bar-old" x="66" y="212" width="116.4" height="20" rx="3"/>
<text class="t-xs" x="188.4" y="226.0">19.4%</text>
<text class="t-sm" x="18" y="251.0">6件</text>
<rect class="bar-old" x="66" y="237" width="77.4" height="20" rx="3"/>
<text class="t-xs" x="149.4" y="251.0">12.9%</text>
<text class="t-sm" x="18" y="276.0">7件</text>
<rect class="bar-old" x="66" y="262" width="49.8" height="20" rx="3"/>
<text class="t-xs" x="121.8" y="276.0">8.3%</text>
<text class="t-sm" x="18" y="301.0">8件</text>
<rect class="bar-old" x="66" y="287" width="30.6" height="20" rx="3"/>
<text class="t-xs" x="102.6" y="301.0">5.1%</text>
<text class="t-sm" x="18" y="326.0">9件</text>
<rect class="bar-old" x="66" y="312" width="18.0" height="20" rx="3"/>
<text class="t-xs" x="90.0" y="326.0">3.0%</text>
<text class="t-sm" x="18" y="351.0">10件</text>
<rect class="bar-old" x="66" y="337" width="9.6" height="20" rx="3"/>
<text class="t-xs" x="81.6" y="351.0">1.6%</text>
<rect class="box-accent" x="18" y="372" width="684" height="56" rx="6"/>
<text class="t-accent" x="34" y="392">抜き取りが少ないと、拾えないのは判定が甘いからではなく、そもそも母数が足りないから。</text>
<text class="t-sm" x="34" y="410">この記事の全数確認（20件全部）なら、この確率は0%になる。</text>
</svg>
