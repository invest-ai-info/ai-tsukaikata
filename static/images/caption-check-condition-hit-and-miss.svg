<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="動画の自動字幕キャプションの検品で、仕込んだ8件の誤り（同音異義語6件・数字2件）を条件ごとに何回拾えたかを示す表。各行は「拾えた件数の合計／40件（8件×5回）」。素朴に『聞き取りミスを指摘して』と頼んだ回は36/40。「自信の低い語に印をつけて」と頼んだ回は40/40。自動字幕だと伝えずに「確認して」と頼んだ回は40/40。キャプションを47行（約2.6倍）に増やして同じ素朴な頼み方をした回は39/40。動画3本分（計46行）をまとめて頼んだ回は、この動画の8件だけを数えて40/40。下の枠には、素朴に聞いた回だけ36/40で、5回中4回、保温時間の数字（最大4時間）だけを見逃したこと、印をつけて聞く・自動字幕だと伝えない・長くする・3本まとめる、のどれに変えてもこの見逃しは起きなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">8件の仕込み誤りは、素朴に聞いた回だけ満点を取れなかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-06。動画1本の自動生成キャプション（同音異義語6件・数字2件を仕込み）に、頼み方・分量を変えて各5回。</text>
<text class="t-sm" x="18" y="64">各行は「拾えた件数の合計／40件（8件×5回）」。多いほど良い。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">素朴に「聞き取りミスを指摘して」と頼んだ回</text>
<rect class="box" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="125" text-anchor="middle" style="font-weight:700">36/40</text>
<text class="t" x="18" y="157">「自信の低い語に印をつけて」と頼んだ回</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">40/40</text>
<text class="t" x="18" y="189">自動字幕だと伝えずに「確認して」と頼んだ回</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">40/40</text>
<text class="t" x="18" y="221">キャプションを47行（約2.6倍）に増やし、同じ素朴な頼み方をした回</text>
<rect class="box" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="221" text-anchor="middle" style="font-weight:700">39/40</text>
<text class="t" x="18" y="253">動画3本分（計46行）をまとめて頼んだ回（この動画の8件のみ集計）</text>
<rect class="box-good" x="438" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="253" text-anchor="middle" style="font-weight:700">40/40</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">素朴に聞いた回だけ36/40。5回中4回、保温時間の数字（最大4時間）だけを見逃した。</text>
<text class="t-accent" x="34" y="308">印をつけて聞く・自動字幕だと伝えない・長くする・3本まとめる、のどれに変えても</text>
<text class="t-accent" x="34" y="326">この見逃しは起きなかった（残り4条件はいずれも39/40か40/40）。</text>
</svg>
