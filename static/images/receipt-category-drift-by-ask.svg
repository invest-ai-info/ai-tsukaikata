<text class="t-bad" x="18" y="438">※ そのまま頼んだ12回では、費目の名前そのものが毎月作り直された（3か月ぶんでのべ18〜20種、3か月とも出たのは2〜4種）。</text>
<text class="t-good" x="18" y="460">※ 対応表を渡して「あなたが選び直さないでください」と書いた12回だけが、4系列とも 0/5 だった。</text>
<text class="t-xs" x="18" y="482">架空データでの実測（全56回）。生の返りは docs/evidence/ に置いてある。</text>
