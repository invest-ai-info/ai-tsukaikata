<svg xmlns="http://www.w3.org/2000/svg" width="720" height="504" viewBox="0 0 720 504" role="img" aria-label="4通りの頼み方で、同じ店・同じ用途の行が月をまたいで違う費目に入った数を並べた横棒グラフ。1つの頼み方につき4系列ぶんの棒があり、棒1本の最大は5件。そのまま費目ごとに分けてと頼んだ4系列は3件・3件・3件・2件で、のべ20件中11件。費目の一覧9つを固定して受け皿を付けた4系列は3件・1件・1件・0件で、のべ5件。そこに毎月かならず同じ費目にという一文を足した4系列は0件・1件・0件・2件で、のべ3件。こちらが持つ店名とメモと費目の対応表を渡した4系列は4系列とも0件で、のべ0件。頼み方を変えるほど揺れは減るが、0になったのは対応表を渡した回だけだった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
