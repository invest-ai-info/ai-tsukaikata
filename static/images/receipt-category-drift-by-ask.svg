    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="504"/>
<text class="t-strong" x="18" y="26">同じ店・同じ用途の行が、月をまたいで違う費目に入った数</text>
<text class="t-sm" x="18" y="45">架空の領収書メモを3か月ぶん・材料2本（表形式と走り書き）作り、3か月とも1文字も同じで出る行を5件ずつ仕込んだ。</text>
<text class="t-sm" x="18" y="64">1つの頼み方につき、材料2本 × 各2回 = 4系列。棒1本が1系列ぶんで、長いほど月ごとにばらけている。</text>
<text class="t-xs" x="298" y="100">棒の長さ＝5件の定点のうち、3か月そろわなかった件数（短いほうがよい）</text>
<text class="t" x="18" y="136">そのまま「費目ごとに分けて」</text>
