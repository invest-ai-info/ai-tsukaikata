<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" role="img" aria-label="安全策の仕組みの変化を示した表。違反の検知＝従来は申請のたびにリアルタイムでブロック、LSVPでは行動パターンをオフラインでまとめて分析。データの保持＝従来は個々の申請で完結し保持の記載なし、LSVPでは30日間保持し学習利用・内部チームの閲覧は禁止。見つかったら＝従来はその場でブロックして終了、LSVPでは組織の管理者に通知し合意した期限内に対応。保持したデータはモデルの学習に使われず、Anthropicの生命科学研究チームもアクセスできないと明記されている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="384"/>
<text class="t-strong" x="18" y="26">都度ブロックから、30日分をまとめて見る方式に変わった</text>
<text class="t-sm" x="18" y="45">従来の一般提供モデルの安全策と、LSVPのグラントでの安全策の違い。</text>
<text class="t-sm" x="18" y="64">生命科学に関係しない安全策（サイバー攻撃対策など）は、引き続き有効なまま。</text>
<text class="t-sm" x="18" y="83">発表ページの「How monitoring works in LSVP」節に書かれている範囲だけを並べた。</text>
<text class="t-accent" x="138.0" y="144">従来（一般提供モデル）</text>
<text class="t-accent" x="428.0" y="144">LSVPのグラント</text>
<text class="t-sm" x="18" y="178.0">違反の検知</text>
<rect class="box-quiet" x="130.0" y="158" width="278.0" height="50" rx="4"/>
<text class="t-sm" x="140.0" y="178">申請のたびに</text>
<text class="t-sm" x="140.0" y="195">リアルタイムでブロック</text>
<rect class="box-accent" x="420.0" y="158" width="278.0" height="50" rx="4"/>
<text class="t-accent" x="430.0" y="178">行動パターンを</text>
<text class="t-accent" x="430.0" y="195">オフラインでまとめて分析</text>
<text class="t-sm" x="18" y="238.0">データの保持</text>
<rect class="box-quiet" x="130.0" y="218" width="278.0" height="50" rx="4"/>
<text class="t-sm" x="140.0" y="238">個々の申請で完結</text>
<text class="t-sm" x="140.0" y="255">（保持の記載なし）</text>
<rect class="box-accent" x="420.0" y="218" width="278.0" height="50" rx="4"/>
<text class="t-accent" x="430.0" y="238">30日間保持</text>
<text class="t-accent" x="430.0" y="255">学習利用・内部チーム閲覧は禁止</text>
<text class="t-sm" x="18" y="298.0">見つかったら</text>
<rect class="box-quiet" x="130.0" y="278" width="278.0" height="50" rx="4"/>
<text class="t-sm" x="140.0" y="298">その場でブロックして</text>
<text class="t-sm" x="140.0" y="315">終了</text>
<rect class="box-accent" x="420.0" y="278" width="278.0" height="50" rx="4"/>
<text class="t-accent" x="430.0" y="298">管理者に通知し</text>
<text class="t-accent" x="430.0" y="315">合意した期限内に対応</text>
<text class="t-xs" x="18" y="370">※ 保持したデータはモデルの学習に使われず、Anthropicの生命科学研究チームもアクセスできないと明記されている。</text>
</svg>
