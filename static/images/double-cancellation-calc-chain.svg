<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-label="備考に書かれた2件のキャンセル額を、基本月額から順に引く計算の流れを示した図。満月印刷（Webサイト保守契約）は基本月額49,000円からオプションA3,000円とオプションB2,000円を引くと確定44,000円、入金は40,000円で不足4,000円。10回とも正しく見つかった。星空クリニック（SNS運用代行契約）は基本月額51,000円からストーリーズ4,000円とハイライト編集1,500円を引くと確定45,500円、入金は43,000円で不足2,500円。こちらも10回とも正しく見つかった。下の枠には、どちらもキャンセル額を1件しか引かない・2件を足し間違えるという崩れ方は10回とも出なかったこと、1件分だけのキャンセルを実測した前の記事と見逃し0・誤判定0の精度は同じだったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="352"/>
<text class="t-strong" x="18" y="26">備考に書かれた2件のキャンセル額は、両方を順に引かないと確定額に届かない</text>
<text class="t-sm" x="18" y="45">備考はどちらも「2件とも返金対応済み」とだけ書き、引いた後の確定額は書いていない。</text>
<text class="t-sm" x="18" y="64">計算式を明示する指示文は、合計ではなく「キャンセルされた金額」としか言っていないが、2件とも引けた。</text>
<rect class="box" x="18" y="96" width="684" height="82" rx="6"/>
<text class="t-strong" x="34" y="118">満月印刷（Webサイト保守・材料A）</text>
<text class="mono" x="34" y="140">基本月額 49,000円 − オプションA 3,000円 − オプションB 2,000円 = 確定 44,000円</text>
<text class="t-good" x="34" y="160">入金 40,000円 → 不足 4,000円（10回とも正しく見つかった）</text>
<rect class="box" x="18" y="188" width="684" height="82" rx="6"/>
<text class="t-strong" x="34" y="210">星空クリニック（SNS運用代行・材料B）</text>
<text class="mono" x="34" y="232">基本月額 51,000円 − ストーリーズ 4,000円 − ハイライト編集 1,500円 = 確定 45,500円</text>
<text class="t-good" x="34" y="252">入金 43,000円 → 不足 2,500円（10回とも正しく見つかった）</text>
<rect class="box-accent" x="18" y="286" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="306">どちらも、キャンセル額を1件しか引かない・2件を足し間違えるという崩れ方は10回とも出なかった。</text>
<text class="t-accent" x="34" y="324">（1件分だけのキャンセルを実測した前の記事と、見逃し0・誤判定0の精度は同じだった）</text>
</svg>
