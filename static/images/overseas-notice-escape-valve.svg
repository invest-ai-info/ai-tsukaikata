<svg xmlns="http://www.w3.org/2000/svg" width="720" height="442" viewBox="0 0 720 442" role="img" aria-label="海外案内を日本時間に直す実測で、指示文の版ごとに〔要確認〕の要不要を間違えた割合を示した横棒グラフ。素のまま頼った版と、時差・夏時間を申告させた版は、材料2本×各2回＝288件中0件で間違えなかった。決められないものは換算せず〔要確認〕にしてと足した版は、96件中5件で、略号により答えが決まっている項目を1/4回だけ誤って疑った。略号を優先してと先に指定して直そうとした版は、材料2本×各1回＝48件中10件で、2回ともかえって悪化し、今度は夏時間の判定が暦から決まる別の5件を巻き込んだ。止まった行だけを貼り直して聞き直す言い直し方は、10件中0件で2回とも全部直った。仕上げに二重変換していないか自己点検させる版も48件中0件で、自己点検自体も2回とも正しかった。日付・時刻の計算そのものの間違いは、全394件を通じて0件だった。">
<style>
