<rect class="bg" x="0" y="0" width="720" height="442"/>
<text class="t-strong" x="18" y="26">日付・時刻の計算は394件とも合っていた。誤りは全部〔要確認〕の要不要だった</text>
<text class="t-sm" x="18" y="45">架空の英文案内24通を2セット用意し、3通りの指示文（a・b・c）を材料2本×各2回＝のべ288件、機械で照合した。</text>
<text class="t-sm" x="18" y="64">日付が変わる回・夏時間の判定・30分刻みの時差・すでに日本時間の項目は、全288件で1件も間違えなかった。</text>
<text class="t-sm" x="18" y="83">崩れたのは「決められないものは換算せず〔要確認〕にして」を足した(c)だけ。略号で答えが決まっている5件を、1/4回だけ疑った。</text>
<text class="t-sm" x="18" y="102">先回りして直そうとした(d)は材料2本×各1回で、2回とも別の5件（〔要確認〕にしなくてよいものの側）を巻き込んで悪化した。</text>
<text class="t-sm" x="18" y="121">効いたのは、止まった行だけを貼り直して聞き直す(e)——2回とも5件全部が直った。仕上げの自己点検(f)も2回とも正しかった。</text>
<text class="t-xs" x="18" y="140">横軸＝〔要確認〕の要不要を間違えた割合（対象件数のうち）。日付・時刻の計算間違いは含まない。</text>
<text class="t" x="18" y="181">(a) 素のまま</text>
<text class="t-good" x="318.0" y="181">0/96件</text>
<text class="t-xs" x="18" y="197">確認の仕組み自体が無い</text>
<text class="t" x="18" y="221">(b) 時差・夏時間を申告させる</text>
<text class="t-good" x="318.0" y="221">0/96件</text>
<text class="t-xs" x="18" y="237">確認の仕組み自体が無い</text>
<text class="t" x="18" y="261">(c) 決められないものは〔要確認〕</text>
<rect class="bar-old" x="310.0" y="249" width="71.0" height="16" rx="3"/>
<text class="t-bad" x="389.0" y="261">5/96件</text>
<text class="t-xs" x="18" y="277">1/4回で、決まっている5件を疑った</text>
<text class="t" x="18" y="301">(d) 略号を優先してと先に指定</text>
<rect class="bar-old" x="310.0" y="289" width="284.1" height="16" rx="3"/>
<text class="t-bad" x="602.1" y="301">10/48件</text>
<text class="t-xs" x="18" y="317">2/2回とも、別の5件を巻き込んだ</text>
<text class="t" x="18" y="341">(e) 止まった行だけ貼り直して聞く</text>
<text class="t-good" x="318.0" y="341">0/10件</text>
<text class="t-xs" x="18" y="357">2/2回とも直った</text>
<text class="t" x="18" y="381">(f) 仕上げに二重変換を確認させる</text>
<text class="t-good" x="318.0" y="381">0/48件</text>
<text class="t-xs" x="18" y="397">自己点検も2/2回とも正しかった</text>
