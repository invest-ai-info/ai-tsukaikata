<svg xmlns="http://www.w3.org/2000/svg" width="720" height="434" viewBox="0 0 720 434" role="img" aria-label="Xの収益配分でお金が動く順を、上から3段に並べた図。1段目「先に払う」＝Xプレミアム月980円（日本・ウェブ）。持ち出しは980円×加入した月数。2段目「門を通る」＝収益配分ページの参加資格5項目と、別ページの収益化の参加資格9項目の2階建て。図に書き出してある3つは、プレミアム以上、過去3か月以内に500万回以上のオーガニック インプレッション、認証済みフォロワー500人以上。3段目「入金される」＝最小入金額10ドル・2週間ごとに処理・Stripeの接続と本人確認が必要。最下段の注記は、1段目と3段目のあいだは収益がゼロでも月980円が出ていくこと、窓いっぱいの3か月なら2,940円だがこの掛け算は記事のものであること。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="434"/>
<text class="t-strong" x="18" y="26">Xの収益配分は、入ってくる前に出ていく</text>
<text class="t-sm" x="18" y="45">各公式ページの記述の整理（2026-08-29確認）。金額は日本・ウェブサイトからの購入の場合。</text>
<text class="t-sm" x="18" y="64">「過去3か月以内」は、待つ期間ではなく、さかのぼって数える集計の窓。</text>
<rect class="box-bad" x="18" y="92" width="684" height="74" rx="6"/>
<text class="t-strong" x="34" y="116">① 先に払う（自分の持ち出し）</text>
<text class="t" x="34" y="138">Xプレミアム 月980円（日本・ウェブ）</text>
<text class="t-sm" x="34" y="157">申請にはプレミアム以上が必要。持ち出し＝980円 × 加入した月数</text>
<path class="line" d="M58 169 L58 183"/>
<rect class="box-quiet" x="18" y="186" width="684" height="74" rx="6"/>
<text class="t-strong" x="34" y="210">② 門を通る（2階建て）</text>
<text class="t" x="34" y="232">収益配分ページの参加資格5項目 ＋ 別ページの収益化の参加資格9項目</text>
<text class="t-sm" x="34" y="251">プレミアム以上／過去3か月以内に500万回以上のオーガニック インプレッション／認証済みフォロワー500人以上</text>
<path class="line" d="M58 263 L58 277"/>
<rect class="box-good" x="18" y="280" width="684" height="74" rx="6"/>
<text class="t-strong" x="34" y="304">③ 入金される</text>
<text class="t" x="34" y="326">最小入金額10ドル・2週間ごとに処理</text>
<text class="t-sm" x="34" y="345">Stripeの入金アカウント接続と本人確認の完了が要る</text>
<rect class="box-accent" x="18" y="368" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="388">①と③のあいだ、収益がゼロでも月980円は出ていく（持ち出し＝980円×加入月数）。</text>
<text class="t-accent" x="34" y="406">窓いっぱいの3か月かけたなら2,940円（この掛け算は記事のもの。原文の数字ではない）。</text>
</svg>
