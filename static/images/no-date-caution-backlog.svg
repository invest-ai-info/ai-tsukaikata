<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="情報システム部（既読リストの無い新規対象）が報告した新着件数を、軽い注意の有無で比べた横棒グラフ。取得した件数はどちらも8件（S-01〜S-08・日付や時刻の記載は無い）。軽い注意なしは新着8件（灰色、全件）、軽い注意ありは新着0件（青）。下の枠には、取得した8件はどちらの条件でも同じ記録であること、軽い注意が既読リストが無いことを基準に使い8件を新着から外せたことが2回とも起きたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">取得した8件は変わらない。報告される「新着件数」が変わる</text>
<text class="t-sm" x="18" y="45">情報システム部（既読リストの無い新規対象）が今回取得した件数は、どちらも8件。</text>
<text class="t-sm" x="18" y="64">指示文に軽い注意を足すかどうかだけで、報告される「新着件数」が8件か0件かに分かれた。</text>
<text class="t" x="18" y="114.0">軽い注意なし</text>
<rect class="bar-old" x="260" y="90" width="340.0" height="32" rx="4"/>
<text class="t-sm" x="610.0" y="114.0">新着8件</text>
<text class="t" x="18" y="176.0">軽い注意あり</text>
<rect class="bar-new" x="260" y="152" width="2.0" height="32" rx="4"/>
<text class="t-sm" x="272.0" y="176.0">新着0件</text>
<rect class="box-accent" x="18" y="224" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="244">取得した8件は、どちらの条件でも同じ記録（S-01〜S-08・日付や時刻の記載は無い）。</text>
<text class="t-accent" x="34" y="262">軽い注意が「既読リストが無いこと」を基準に使い、8件を新着から外せた（2回とも）。</text>
</svg>
