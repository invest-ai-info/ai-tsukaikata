    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="310"/>
<text class="t-strong" x="18" y="26">発表ページが挙げた点数は、どれもGoogle自身の測定</text>
<text class="t-sm" x="18" y="45">目盛りは0〜100%で揃えているが、テストの中身も対象も別々で平均は取れない。</text>
<text class="t-sm" x="18" y="64">他社モデルを同じ条件で測った数字は発表に無い。単価以外の「どちらが賢いか」は比較できない。</text>
<text class="t" x="18" y="115">DeepSWE v1.1（新記録）</text>
<rect class="bar-new" x="272" y="100" width="271.1" height="20" rx="3"/>
<text class="t-sm" x="551.1" y="115">77.9%</text>
<text class="t-xs" x="18" y="132">長時間のソフト開発作業</text>
<text class="t" x="18" y="157">LVBench（新記録）</text>
<rect class="bar-new" x="272" y="142" width="319.1" height="20" rx="3"/>
<text class="t-sm" x="599.1" y="157">91.7%</text>
<text class="t-xs" x="18" y="174">長い動画の理解</text>
<text class="t" x="18" y="199">CWE-bench v1（同率1位）</text>
<rect class="bar-new" x="272" y="184" width="236.6" height="20" rx="3"/>
<text class="t-sm" x="516.6" y="199">68%</text>
<text class="t-xs" x="18" y="216">セキュリティ脆弱性の修復</text>
<text class="t" x="18" y="241">AutomationBench（1位）</text>
<rect class="bar-new" x="272" y="226" width="178.5" height="20" rx="3"/>
<text class="t-sm" x="458.5" y="241">51.3%</text>
<text class="t-xs" x="18" y="258">Zapier運営・業務自動化の実行力</text>
<text class="t-xs" x="18" y="286">※ 出典: Gemini 4 Argon の発表ページ（blog.google・2026年9月30日）。</text>
<text class="t-bad" x="18" y="302">※ 比較相手（他社・前のモデル）の同条件の点数は発表に無い。鵜呑みにしない。</text>
