<svg xmlns="http://www.w3.org/2000/svg" width="720" height="508" viewBox="0 0 720 508" role="img" aria-label="新しい監視対象を1件追加する場面で、「初期化」の頼み方6通りを比べたマス目。追加した対象の名前を主語にして「〇〇を追加したので、初期化して」と頼んだ材料2本×各2回＝4回は4/4で、新対象を正しく対応待ち0件にでき、既存の対象も壊れなかった。対象名を出さず「この一覧をいったん初期化して」とだけ頼んだ材料2本×各4回＝8回では3/8にとどまり、残り5回のうち4回は新対象の過去分7件をそのまま対応待ちとして数え、1回は既存5件（3・0・5・2・1件）までまとめて0件に巻き戻った。範囲を明示する一文を足した詳しい版（8回）、他は変更しないでと一言足す版（4回）、対象名だけ挙げて0件にしてと頼む版（4回）、同時に2件追加して範囲を明示した版（2回）は、合わせて18回とも正しく処理できた。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="508"/>
<text class="t-strong" x="18" y="26">対象名を出さずに「一覧を初期化して」と頼むと、8回中5回で数え違えた</text>
<text class="t-sm" x="18" y="45">架空のSNS対応待ち一覧・取引先未対応一覧の2本に、新しい監視対象を1件追加する</text>
<text class="t-sm" x="18" y="64">場面を仕込んだ（過去分7件、本日分・今週分はどちらも0件）。</text>
<text class="t-xs" x="18" y="83">数字は、新対象を正しく「対応待ち0件」にでき、かつ既存の対象を壊さなかった回数。</text>
<text class="t-xs" x="18" y="102">生の回答は docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="181">対象名を主語にする（材料2本×各2回）</text>
<rect class="box-good" x="358" y="160" width="150" height="32" rx="4"/>
<text class="t-good" x="388.0" y="181">4/4 正しく処理</text>
<text class="t-sm" x="18" y="223">「この一覧をいったん初期化して」（材料2本×各4回）</text>
<rect class="box-bad" x="358" y="202" width="150" height="32" rx="4"/>
<text class="t-bad" x="388.0" y="223">3/8 正しく処理</text>
<text class="t-sm" x="18" y="265">範囲を明示する一文を足す（材料2本×各4回）</text>
<rect class="box-good" x="358" y="244" width="150" height="32" rx="4"/>
<text class="t-good" x="388.0" y="265">8/8 正しく処理</text>
<text class="t-sm" x="18" y="307">短い一言・他は変更しないで（材料2本×各2回）</text>
<rect class="box-good" x="358" y="286" width="150" height="32" rx="4"/>
<text class="t-good" x="388.0" y="307">4/4 正しく処理</text>
<text class="t-sm" x="18" y="349">対象名だけ挙げて0件にして（材料2本×各2回）</text>
<rect class="box-good" x="358" y="328" width="150" height="32" rx="4"/>
<text class="t-good" x="388.0" y="349">4/4 正しく処理</text>
<text class="t-sm" x="18" y="391">同時に2件追加・範囲明示（材料1本×2回）</text>
<rect class="box-good" x="358" y="370" width="150" height="32" rx="4"/>
<text class="t-good" x="388.0" y="391">2/2 正しく処理</text>
<rect class="box-quiet" x="18" y="416" width="678" height="68" rx="6"/>
<text class="t-strong" x="34" y="436">崩れた5回の中身は2通り。4回は新対象の過去分7件をそのまま対応待ちに数え、</text>
<text class="t-sm" x="34" y="454">1回は新対象だけでなく既存5件（3・0・5・2・1件）まで、まとめて0件に巻き戻った。</text>
<text class="t-sm" x="34" y="472">範囲を一文で明示するか対象名だけ挙げれば、残り18回は同時追加も含め崩れなかった。</text>
</svg>
