<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-label="Google のモデルカードの比較表で、Gemini 3.7 Flash が最高値だった項目の数を示した図。20項目のうち9項目で最高、残り11項目は他社か前の世代のほうが上だった。上だった例として、DeepSWE v1.1 は3.7 Flash の65.3％に対し GPT-5.6 Terra が69.6％、Terminal-bench 3.0 は14.9％に対し GPT-5.6 Terra が20.8％、GDPVal-AA v2 は Elo 1525 に対し Muse Spark 1.2 が1628、Agent's Last Exam は26.3％に対し Claude Sonnet 5 が33.3％、CharXiv（道具あり）は88.7％に対し前の世代の Gemini 3.6 Flash が89.4％。表を作ったのは Google であり、相手の会社が同じ条件で測った値ではない。">
