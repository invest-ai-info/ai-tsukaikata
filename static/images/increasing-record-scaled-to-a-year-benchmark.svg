<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="問い合わせフォームの架空ログ（364日・緩やかな増加傾向で3件/日から9件/日まで育つ設計）で、渡す記録の長さだけを変えて「ふだんの目安」をAI自身に計算させた結果を2本の横棒で比べた図。直近56日だけ渡すと目安8.48件/日で本日34件はその約4.0倍、364日（約1年）全部渡すと目安5.96件/日で本日はその約5.7倍。下の枠には、56日だけだと目安8.48件/日・364日全部だと5.96件/日で動いた幅は約42%であること、先行記事（同じ記録の2週・4週・8週での比較）では約36%動いたこと、記録を364日に伸ばしても動きの大きさは縮まらなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="24">記録を56日から364日に伸ばすと、目安の動きは縮まらなかった</text>
<text class="t-sm" x="18" y="43">問い合わせフォームの架空ログ（364日・緩やかな増加傾向、3件/日→9件/日）。</text>
<text class="t-sm" x="18" y="62">「直近56日だけ」と「記録の全部（364日）」の2条件で、同じ指示文をAIに3回ずつ試した。</text>
<text class="t-xs" x="18" y="81">横棒は真値（単純平均）としての「ふだんの1日あたりの目安」（件/日）。先行記事（増減の無い記録・同じ長さ）の実測と条件をそろえた。</text>
<text class="t-xs" x="446.0" y="130">件/日</text>
<text class="t" x="18" y="154">直近56日だけ渡す</text>
<rect class="box-quiet" x="280.0" y="142" width="180.0" height="16" rx="3"/>
<rect class="bar-new" x="280.0" y="142" width="169.6" height="16" rx="3"/>
<text class="t-strong" x="474.0" y="154">8.48件/日</text>
<text class="t-accent" x="564.0" y="154">本日34件の約4.0倍</text>
<text class="t" x="18" y="188">364日（約1年）全部渡す</text>
<rect class="box-quiet" x="280.0" y="176" width="180.0" height="16" rx="3"/>
<rect class="bar-new" x="280.0" y="176" width="119.2" height="16" rx="3"/>
<text class="t-strong" x="474.0" y="188">5.96件/日</text>
<text class="t-accent" x="564.0" y="188">本日34件の約5.7倍</text>
<rect class="box-accent" x="18" y="218" width="684" height="66" rx="6"/>
<text class="t-accent" x="34" y="238">56日だけだと目安8.48件/日、364日全部だと5.96件/日。動いた幅は約42%。</text>
<text class="t-accent" x="34" y="256">先行記事（同じ記録の2週/4週/8週での比較）では約36%動いた。記録を364日に伸ばしても縮まなかった。</text>
<text class="t-accent" x="34" y="274">この記録は増加傾向が364日間ずっと続く設計。傾きが途中で止まる記録では結果が変わりうる。</text>
</svg>
