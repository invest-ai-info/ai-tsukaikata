  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">「止まったまま」を開いて聞くと、12回中5回しか合わなかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-08。問い合わせ待ち行列に10日分の新着を加えながら、毎日1件処理した。</text>
<text class="t-sm" x="18" y="64">7日後・10日後それぞれで、新規セッションに3回ずつ「止まったままの行は何件か」を聞いた。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">そのまま聞いた／印で残す版・7日後（正解3件）</text>
<rect class="box" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="125" text-anchor="middle" style="font-weight:700">1/3</text>
<text class="t" x="18" y="157">そのまま聞いた／印で残す版・10日後（正解4件）</text>
<rect class="box" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="157" text-anchor="middle" style="font-weight:700">1/3</text>
<text class="t" x="18" y="189">そのまま聞いた／いちばん下へ移す版・7日後（正解3件）</text>
<rect class="box-bad" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="518.0" y="189" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="221">そのまま聞いた／いちばん下へ移す版・10日後（正解4件）</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="253">資料の中身を条件にして聞いた（4通り×3回）</text>
<rect class="box-good" x="438" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="253" text-anchor="middle" style="font-weight:700">12/12</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">開いた聞き方は、12回のうち5回しか正しい件数に合わなかった。</text>
<text class="t-accent" x="34" y="308">ずれた7回はすべて、資料がそろっていてまだ返信していないだけの行を、詰んだ行に数えていた。</text>
<text class="t-accent" x="34" y="326">聞き方を「資料の行が（取得できませんでした）になっている行だけ」に変えると、12回とも正しい件数になった。</text>
</svg>
