<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="「止まったままの行は何件か」を開いて聞いた場合と、資料の中身を条件にして聞いた場合の正答率を比べた表。印で残す版は7日後・10日後とも正解3件・4件に対して1/3回しか合わず、いちばん下へ移す版は7日後が正解3件に対して0/3回、10日後は正解4件に対して3/3回だった。合計で開いた聞き方は12回中5回しか合わなかった。資料の行が「（取得できませんでした）」になっている行だけを数える条件に変えると、4通り×3回＝12回すべてで正しい件数になった。下の枠には、ずれた7回はすべて資料がそろっていてまだ返信していないだけの行を詰んだ行に数えていたこと、条件を資料の中身に変えると12回とも正しくなったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
