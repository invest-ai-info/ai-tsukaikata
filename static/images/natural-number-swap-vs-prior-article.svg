<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="動画の自動字幕キャプションの検品で、同じ素朴な指示文「聞き取りミスを指摘して」を使った2つの記事の結果を比べる表。先行記事（数字そのものが不自然な誤り・同音異義語が中心）は39/40（97.5%）拾えた。この記事のブレンダー材料（文脈上どちらでも成立する数字の誤り）は10/40（25%）。同じくこの記事の掃除機材料は13/40（32.5%）だった。下の枠には、先行記事は97.5%拾えたがこの記事の2材料は25%・32.5%しか拾えなかったこと、合計すると80回中23回（28.75%）しか拾われなかったこと、違いは誤りの種類だけで指示文も判定の仕組みも先行記事と同じであることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">自然に読める数字の誤りは、素朴に聞くと3割も拾えない</text>
<text class="t-sm" x="18" y="45">実測2026-10-11。同じ素朴な指示文「聞き取りミスを指摘して」を使った2つの記事の比較。</text>
<text class="t-sm" x="18" y="64">先行記事は数字そのものが不自然な誤り・同音異義語。この記事は文脈上どちらでも成立する誤り。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">先行記事：数字が不自然・同音異義語の誤り</text>
<rect class="box" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="125" text-anchor="middle" style="font-weight:700">39/40</text>
<text class="t" x="18" y="157">この記事：ブレンダー・文脈と矛盾しない数字の誤り</text>
<rect class="box" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="157" text-anchor="middle" style="font-weight:700">10/40</text>
<text class="t" x="18" y="189">この記事：掃除機・文脈と矛盾しない数字の誤り</text>
<rect class="box" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="189" text-anchor="middle" style="font-weight:700">13/40</text>
<rect class="box-accent" x="18" y="206" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="226">先行記事は97.5%（39/40）拾えたが、この記事の2つの材料は25%・32.5%しか拾えなかった。</text>
<text class="t-accent" x="34" y="244">合計すると、文脈上どちらでも成立する誤りは80回中23回（28.75%）しか拾われなかった。</text>
<text class="t-accent" x="34" y="262">違いは誤りの種類だけ——指示文も判定の仕組みも、先行記事とまったく同じものを使っている。</text>
</svg>
