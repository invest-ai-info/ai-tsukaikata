<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334" role="img" aria-label="触ってはいけない8件×2回＝16件のうち、版ごとに絶対日付へ誤って書き換えた件数の合計を示す横棒グラフ。版a（そのまま）は5件、版b（先週/来月まで/最近を禁止を追加）は6件でむしろ増え、版c（基準日と基準日不明の逃げ道を追加）は3件に減り、版d（比較の言葉は残せと名指しした）は1件まで下がった。変換すべき12件×2回＝24件は、どの版も24件中24件が正解だった。">
