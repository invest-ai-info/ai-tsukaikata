<rect class="bg" x="0" y="0" width="720" height="334"/>
<text class="t-strong" x="18" y="26">記事の推奨（版b）は減らなかった。減らしたのは基準日と、名指しの一文</text>
<text class="t-sm" x="18" y="45">触ってはいけない8件×2回＝16件のうち、絶対日付へ誤って書き換えた件数の合計。</text>
<text class="t-sm" x="18" y="64">版b＝このサイトの別記事が勧める「先週/来月まで/最近を禁止」をそのまま追加した版。</text>
<text class="t-sm" x="18" y="83">版d＝誤変換の対象そのもの（「○○比」のような比較の言葉）を名指しして残すよう頼んだ版。</text>
<path class="line" d="M208.0 122 L208.0 254" stroke-width="1" opacity="0.3"/>
<text class="t-xs" x="205.0" y="116">0</text>
<path class="line" d="M321.0 122 L321.0 254" stroke-width="1" opacity="0.3"/>
<text class="t-xs" x="318.0" y="116">2</text>
<path class="line" d="M434.0 122 L434.0 254" stroke-width="1" opacity="0.3"/>
<text class="t-xs" x="431.0" y="116">4</text>
<path class="line" d="M547.0 122 L547.0 254" stroke-width="1" opacity="0.3"/>
<text class="t-xs" x="544.0" y="116">6</text>
<path class="line" d="M660.0 122 L660.0 254" stroke-width="1" opacity="0.3"/>
<text class="t-xs" x="657.0" y="116">8</text>
<text class="t-xs" x="18" y="149">版a：そのまま</text>
<rect class="bar-out" x="208" y="136.0" width="282.5" height="18" rx="3"/>
<text class="t-xs" x="498.5" y="150.0">5／16件</text>
<text class="t-xs" x="18" y="183">版b：＋「先週/来月まで/最近」を禁止</text>
<rect class="bar-out" x="208" y="170.0" width="339.0" height="18" rx="3"/>
<text class="t-xs" x="555.0" y="184.0">6／16件</text>
<text class="t-xs" x="18" y="217">版c：＋基準日と〔基準日不明〕</text>
<rect class="bar-in" x="208" y="204.0" width="169.5" height="18" rx="3"/>
<text class="t-xs" x="385.5" y="218.0">3／16件</text>
<text class="t-xs" x="18" y="251">版d：＋「○○比は残せ」を明記</text>
<rect class="bar-new" x="208" y="238.0" width="56.5" height="18" rx="3"/>
<text class="t-xs" x="272.5" y="252.0">1／16件</text>
<text class="t-xs" x="18" y="284">※ 変換すべき12件×2回＝24件はどの版も24／24で正解（この図には含めない）。</text>
<text class="t-xs" x="18" y="305">架空データでの実測。生の返り8通は docs/evidence/ に全文置いてある。</text>
</svg>
