<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">13%でもう『大きく違う』——10%とのあいだで、もう切り替わっていた</text>
<text class="t-sm" x="18" y="45">同じ指示文で、直近14日と56日全体の差だけを13.0%・15.0%・18.0%に振った、独立した新しい記録。</text>
<text class="t-sm" x="18" y="64">それぞれ独立した新規の呼び出しで2回ずつ試し、2回とも同じ判定だった（2026-11-25実測）。</text>
