<text class="t-xs" x="338.2" y="170" text-anchor="middle">10%＝同じ（先行記事）</text>
<circle class="bar-new" cx="606.4" cy="150" r="5"/>
<text class="t-xs" x="606.4" y="170" text-anchor="middle">20%＝違う（先行記事）</text>
<rect class="box-accent" x="18" y="302" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="322">差が13.0%・15.0%・18.0%のどれも、2回とも『大きく違う』でした。差20.0%と同じ側です。</text>
<text class="t-accent" x="34" y="340">先行記事で『同じ』だった10.0%との間、13.0%より手前のどこかで切り替わったことになります。</text>
