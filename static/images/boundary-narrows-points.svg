<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="差の大きさ（直近14日と56日全体の1日あたり件数の差）を横軸にした数直線に、この記事の3つの材料を置いた図。材料I（差13.0%）は5.6件/日対5.0件/日で、2回とも『大きく違う』と判定された（青）。材料G（差15.0%）は4.9件/日対4.3件/日で、2回とも『大きく違う』と判定された（青）。材料H（差18.0%）は4.2件/日対3.6件/日で、2回とも『大きく違う』と判定された（青）。参考として先行記事の10.0%（同じ・灰色）と20.0%（大きく違う・青）の点も薄く添えてある。下の枠には、13.0%・15.0%・18.0%のどれも『大きく違う』で20.0%と同じ側だったこと、先行記事で『同じ』だった10.0%との間、13.0%より手前のどこかで切り替わったことが書かれている。">
<style>
