<line class="line" x1="418.6" y1="159" x2="168.3" y2="190"/>
<rect class="box-accent" x="83.3" y="190" width="170" height="94" rx="6"/>
<text class="t-strong" x="168.3" y="210" text-anchor="middle">材料I（13%）</text>
<text class="t-sm" x="168.3" y="230" text-anchor="middle">直近14日 5.6件</text>
<text class="t-sm" x="168.3" y="248" text-anchor="middle">56日全体 5.0件</text>
<text class="t-accent" x="168.3" y="270" text-anchor="middle" style="font-weight:700">2回『違う』</text>
<circle class="bar-new" cx="472.3" cy="150" r="9"/>
<line class="line" x1="472.3" y1="159" x2="365.0" y2="190"/>
<rect class="box-accent" x="280.0" y="190" width="170" height="94" rx="6"/>
