<text class="t-sm" x="365.0" y="230" text-anchor="middle">直近14日 4.9件</text>
<text class="t-sm" x="365.0" y="248" text-anchor="middle">56日全体 4.3件</text>
<text class="t-accent" x="365.0" y="270" text-anchor="middle" style="font-weight:700">2回『違う』</text>
<circle class="bar-new" cx="552.7" cy="150" r="9"/>
<line class="line" x1="552.7" y1="159" x2="561.7" y2="190"/>
<rect class="box-accent" x="476.7" y="190" width="170" height="94" rx="6"/>
<text class="t-strong" x="561.7" y="210" text-anchor="middle">材料H（18%）</text>
<text class="t-sm" x="561.7" y="230" text-anchor="middle">直近14日 4.2件</text>
<text class="t-sm" x="561.7" y="248" text-anchor="middle">56日全体 3.6件</text>
<text class="t-accent" x="561.7" y="270" text-anchor="middle" style="font-weight:700">2回『違う』</text>
