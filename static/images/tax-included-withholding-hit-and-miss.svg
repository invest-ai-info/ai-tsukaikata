<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="4つの条件で、手取り額が国税庁の通達どおりの正解と一致した回数を示す表。①消費税を区分記載した契約は2回中2回正解、②消費税込みで総額のみ・通達を示さずに依頼は3回中1回正解、③消費税込みで総額のみ・通達の文言を先に示して依頼は2回中2回正解、④区分の有無をまず確認させる汎用プロンプトを契約①②の両方に適用は2回中2回正解。下の枠には、②で誤った2回はどちらも消費税込みの金額を税抜へ逆算してから源泉徴収をかけ、本来より2,907円多い手取り額（302,092円、正解は299,001円）を出したことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">区分記載の無い契約は、3回中2回、源泉徴収が少なく計算された</text>
<text class="t-sm" x="18" y="45">実測2026-10-26。架空の業務委託契約（請求総額333,000円）、消費税の書き方だけを変えた。</text>
<text class="t-sm" x="18" y="64">各条件の「正解（通達どおりの手取り額）に到達した回数／試した回数」。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">①消費税を区分記載した契約</text>
<rect class="box-good" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="125" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="157">②込み・区分なし・通達を示さず依頼</text>
<rect class="box" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="157" text-anchor="middle" style="font-weight:700">1/3</text>
<text class="t" x="18" y="189">③込み・区分なし・通達の文言を先に提示</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="221">④区分の有無を確認させる汎用プロンプト</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">⚠️ ②で誤った2回は、消費税込みの金額を税抜へ逆算してから源泉徴収をかけ、</text>
<text class="t-accent" x="34" y="276">本来より2,907円多い手取り額（302,092円。正解は299,001円）を出した</text>
</svg>
