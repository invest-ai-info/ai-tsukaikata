<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="架空の出品メモ19行から作った商品説明文を、頼み方を4通りに変えて機械で照合した図。メモから取り出した23項目のうち説明文に残った数と、先に決めた49語の盛り語のうち本文に出た数を並べている。そのまま頼むと、残った事実は23項目中14項目で、盛り語は14件だった。落ちた9項目は、制作時間、なめし方と産地が不明、金具の材質が不明、色ムラが1ミリであること、水濡れは試していない、金具の耐久は試していない、価格、普通郵便で追跡なし、同じ型を3個作った、である。メモに書いていないことは書かないでくださいと足すと、盛り語は0件になるが、残った事実は17項目にとどまった。落ちた6項目のうち5項目は、なめし方が不明、金具の材質が不明、水濡れは試していない、金具の耐久は試していない、追跡なし、で、いずれも買う人に不利な情報である。良し悪しの言葉は引用できるときだけ使い、書けないものは私が確かめることとして箇条書きにしてくださいと足すと、事実は21項目まで戻り、本文に残った盛り語は1件になった。その1件はそれ以外に目立った傷や汚れはありませんという一文で、確かめていない箇所まで含めて言い切っている。さらに不明と試していない項目と追跡の有無を本文の中に書いてくださいと足すと、盛り語0件のまま23項目すべてが残った。つまり盛りが入った量だけ事実が落ちており、禁止だけを渡すと不利な情報まで一緒に消える。">
<style>
