<svg xmlns="http://www.w3.org/2000/svg" width="720" height="518" viewBox="0 0 720 518" role="img" aria-label="過去分100件の材料2本に、対策の一文を変えて各2回=4回ずつ実行し、正しく新着0件と答えられた回数を比べた横棒グラフ。日付を明示する対策の一文（4/4）、軽い注意の一文（4/4）はどちらも崩れなかった。ところが同じ対策の一文に「簡潔にしてください。件数だけを答え、内訳や補足は書かないでください」という書式の指定を重ねると、4回とも過去いちばん新しい1件を新着として数えてしまった（0/4）。簡潔さを保ったまま念押しの一文を足すと、材料の一方（SNS監視）は4回とも2回中2回で直ったが、もう一方（問い合わせ監視）は2回とも直らなかった（合計2/4）。対策の一文を次回以降の既読リスト登録までまとめて頼んだ応用版は、4回とも崩れなかった（4/4）。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="518"/>
<text class="t-strong" x="18" y="26">過去分100件でも対策は効く。ただし「簡潔に」の一言で崩れた</text>
<text class="t-sm" x="18" y="45">過去分100件の材料2本に、対策の一文を変えて各2回=4回ずつ実行した。</text>
<text class="t-sm" x="18" y="64">正しい答えは「新着0件」。書式を縮める一文が、対策そのものを巻き込んだ。</text>
<text class="t-xs" x="18" y="83">生の回答は docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="160">対策：本日の日付のものだけ</text>
<rect class="box" x="320" y="168" width="320" height="36" rx="4"/>
<rect class="box-good" x="320" y="168" width="320.0" height="36" rx="4"/>
<text class="t-good" x="654" y="191">4/4</text>
<text class="t-xs" x="320" y="219">対策の一文どおりに機能</text>
<text class="t-sm" x="18" y="230">対策：軽い注意（過去分は含めない）</text>
<rect class="box" x="320" y="238" width="320" height="36" rx="4"/>
<rect class="box-good" x="320" y="238" width="320.0" height="36" rx="4"/>
<text class="t-good" x="654" y="261">4/4</text>
<text class="t-xs" x="320" y="289">短い注意でも機能</text>
<text class="t-sm" x="18" y="300">対策＋「簡潔に」で書式を縮める</text>
<rect class="box" x="320" y="308" width="320" height="36" rx="4"/>
<text class="t-bad" x="654" y="331">0/4</text>
<text class="t-xs" x="320" y="359">4回とも「1件」と誤答</text>
<text class="t-sm" x="18" y="370">対策＋簡潔化＋念押しを追加</text>
<rect class="box" x="320" y="378" width="320" height="36" rx="4"/>
<rect class="box-accent" x="320" y="378" width="160.0" height="36" rx="4"/>
<text class="t-bad" x="654" y="401">2/4</text>
<text class="t-xs" x="320" y="429">材料Aのみ直り、材料Bは崩れたまま</text>
<text class="t-sm" x="18" y="440">対策＋既読リストへ登録まで一括</text>
<rect class="box" x="320" y="448" width="320" height="36" rx="4"/>
<rect class="box-good" x="320" y="448" width="320.0" height="36" rx="4"/>
<text class="t-good" x="654" y="471">4/4</text>
<text class="t-xs" x="320" y="499">応用として渡しても機能</text>
</svg>
