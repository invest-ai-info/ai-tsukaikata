<text class="t-xs" x="30" y="251">Sierra調べ・3.8 Live Extended Thinking</text>
<text class="t-accent" x="440" y="243">35.1%</text>
<rect class="box-accent" x="18" y="268" width="684" height="40" rx="5"/>
<text class="t" x="30" y="285">Big Bench Audio</text>
<text class="t-xs" x="30" y="301">3.8 Live Extended Thinking</text>
<text class="t-accent" x="440" y="293">97.7%</text>
