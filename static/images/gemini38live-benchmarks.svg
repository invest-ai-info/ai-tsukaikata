<rect class="bg" x="0" y="0" width="720" height="418"/>
<text class="t-strong" x="18" y="26">5つの指標は、満点も測り方もバラバラ——足し引きでは比べられない</text>
<text class="t-sm" x="18" y="45">発表ページに書かれている第三者ベンチマークの値をそのまま並べた（指数・％・順位が混在）。</text>
<text class="t-sm" x="18" y="64">上4つは3.8 Live Extended Thinkingの値。Speech Agent Arenaだけ、Extended Thinkingではない3.8 Liveの値。</text>
<text class="t-sm" x="18" y="83">評価したのはArtificial AnalysisやSierraなどの第三者だが、この記事では独自に検証していない。</text>
