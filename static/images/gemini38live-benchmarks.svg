<svg xmlns="http://www.w3.org/2000/svg" width="720" height="418" viewBox="0 0 720 418" role="img" aria-label="Gemini 3.8 Live / 3.8 Live Extended Thinking の発表ページにある第三者ベンチマーク5つを箱で並べた図。Speech to Speech Quality Indexは82.6で総合1位（Artificial Analysis調べ）、τ-Voiceは68.6%、τ-Voice-banking（Sierra調べ）は35.1%、Big Bench Audioは97.7%——この4つはいずれも3.8 Live Extended Thinkingの値。Speech Agent Arenaは2位で、こちらはExtended Thinkingではない3.8 Liveの値。指数・％・順位が混在し満点や測り方も指標ごとに違うため、値をそのまま並べており、足し引きや平均はしていない。評価したのは第三者だが、この記事では独自に検証していない。">
