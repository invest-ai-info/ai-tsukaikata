<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">見本を渡すと実物に近い比率。言葉だけだと全文が対象の文末になる</text>
<text class="t-sm" x="18" y="45">実測2026-10-14。くだけた文体（犬レビュー）と硬い文体（万年筆レビュー）の2材料で実測。</text>
<text class="t-sm" x="18" y="64">見本の実物の比率は、犬レビューが9文中7文（78%）、万年筆が7文中7文（100%）。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">犬レビュー：見本を渡さない（2回・11文）</text>
<rect class="box-bad" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="125" text-anchor="middle" style="font-weight:700">0/11</text>
<text class="t" x="18" y="157">犬レビュー：見本を渡す（4回・35文）</text>
<rect class="box" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="157" text-anchor="middle" style="font-weight:700">27/35</text>
<text class="t" x="18" y="189">犬レビュー：言葉だけで説明する（4回・41文）</text>
<rect class="box-good" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="189" text-anchor="middle" style="font-weight:700">41/41</text>
<text class="t" x="18" y="221">万年筆：見本を渡さない（2回・11文）</text>
<rect class="box" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="221" text-anchor="middle" style="font-weight:700">2/11</text>
<text class="t" x="18" y="253">万年筆：見本を渡す（4回・28文）</text>
<rect class="box-good" x="398" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="253" text-anchor="middle" style="font-weight:700">28/28</text>
<text class="t" x="18" y="285">万年筆：言葉だけで説明する（4回・16文）</text>
<rect class="box-good" x="398" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="285" text-anchor="middle" style="font-weight:700">16/16</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">犬レビューは、見本を渡すと実物とほぼ同じ比率（77%）になった。実物は78%。</text>
<text class="t-accent" x="34" y="340">言葉だけで説明すると、犬レビューは全文が対象の文末になった（100%）——実物より多い。</text>
<text class="t-accent" x="34" y="358">万年筆はどちらの条件も100%。『である調を使うか』という二値の切り替えでは差が出なかった。</text>
</svg>
