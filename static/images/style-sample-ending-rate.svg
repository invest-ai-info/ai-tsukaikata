<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="2つの架空ブログ文体で、新しい話題のレビュー文を書かせたときに見本の文末パターンがどれだけ再現されたかを示す表。犬の散歩バッグ：見本を渡さない場合は11文中0文、見本を渡す場合は35文中27文（77%）、言葉だけで説明する場合は41文中41文（100%）。万年筆：見本を渡さない場合は11文中2文、見本を渡す場合は28文中28文（100%）、言葉だけで説明する場合は16文中16文（100%）。下の枠には、見本の実物の比率は犬レビューが9文中7文（78%）・万年筆が7文中7文（100%）であること、犬レビューは見本を渡すと実物とほぼ同じ比率（77%）になったが言葉だけだと全文が対象の文末になり実物より多くなったこと（100%）、万年筆はどちらの条件も100%で二値の切り替えでは差が出なかったことが書かれている。">
<style>
