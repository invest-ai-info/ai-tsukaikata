<rect class="bg" x="0" y="0" width="720" height="436"/>
<text class="t-strong" x="18" y="26">複数の報酬が1枚の請求書に混在しても、合算で正しく判定された</text>
<text class="t-sm" x="18" y="45">実測2026-11-22。原稿料・講演料・著作権使用料・立替を組み合わせた架空請求書、計24回。</text>
<text class="t-sm" x="18" y="64">「正しい手取り額（または正しい前提）に到達した回数／試した回数」。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">2項目・合計120万円（小計表示の有無を問わず計6回）</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="157">2項目・合計70万円・100万円以下（対照）</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="189">3項目・合計110万円</text>
<rect class="box-good" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">報酬＋立替の混在・合計110万円</text>
<rect class="box-good" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="253">請求書の小計自体が誤っている版</text>
<rect class="box-good" x="398" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="253" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="285">「項目2は対象外です」と指示文に書いた版</text>
<rect class="box-bad" x="398" y="264" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="285" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="317">前提を確認させる一文を足した版</text>
<rect class="box-good" x="398" y="296" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="317" text-anchor="middle" style="font-weight:700">3/3</text>
<rect class="box-accent" x="18" y="334" width="684" height="82" rx="6"/>
<text class="t-accent" x="34" y="354">✅ 項目数（2〜3）・小計の有無・立替の混在・請求書自体の集計ミスのいずれでも、</text>
<text class="t-accent" x="34" y="372">　合算して100万円を判定する動きは21/21で崩れなかった</text>
<text class="t-accent" x="34" y="390">⚠️ 崩れたのは、指示文に誤った前提（対象外です）を書いたときだけ。</text>
<text class="t-accent" x="34" y="408">　見出しの結論が3回とも前提どおりになり、正しい金額は注記にしか出なかった</text>
</svg>
