<svg xmlns="http://www.w3.org/2000/svg" width="720" height="436" viewBox="0 0 720 436" role="img" aria-label="7つの条件で、正しい手取り額または正しい前提に到達した回数を示す表。2項目・合計120万円（小計表示の有無を問わず）は6回中6回、2項目・合計70万円・100万円以下の対照は3回中3回、3項目・合計110万円は3回中3回、報酬と立替の混在・合計110万円も3回中3回、請求書の小計自体が誤っている版も3回中3回、「項目2は対象外です」と指示文に書いた版は3回中0回、前提を確認させる一文を足した版は3回中3回、正解に到達した。下の枠には、項目数・小計の有無・立替の混在・請求書自体の集計ミスのいずれでも合算して100万円を判定する動きは21回中21回崩れなかったこと、崩れたのは指示文に誤った前提を書いたときだけで、見出しの結論が3回とも前提どおりになり正しい金額は注記にしか出なかったことが書かれている。">
<style>
