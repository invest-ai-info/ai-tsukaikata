<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="Opus 4.8 から Opus 5 への変化を2列で比べた図。変わらないもの＝入力5ドル、出力25ドル、読める量100万トークン、書ける量12.8万トークン。変わったもの＝学習データの締め切りが2026年1月から5月へ、既定で考えてから答えるようになった、返事が4.8より長くなる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">Opus 4.8 から Opus 5 で何が変わったか</text>
<text class="t-sm" x="18" y="45">値段と容量は据え置き。変わったのは知識の新しさと、既定の動き方。</text>
<rect class="box-quiet" x="18" y="62" width="330" height="166" rx="6"/>
<rect class="box-accent" x="372" y="62" width="330" height="166" rx="6"/>
<text class="t-strong" x="32" y="82">変わらないもの</text>
<text class="t-accent" x="386" y="82">変わったもの</text>
<text class="t" x="32" y="114">入力 $5 → $5</text>
<text class="t" x="32" y="148">出力 $25 → $25</text>
<text class="t" x="32" y="182">読める量 100万トークン</text>
<text class="t" x="32" y="216">書ける量 12.8万トークン</text>
<text class="t" x="386" y="114">学習データ 2026年1月 → 5月</text>
<text class="t" x="386" y="148">既定で「考えてから答える」</text>
<text class="t" x="386" y="182">返事が4.8より長くなる</text>
<text class="t-xs" x="18" y="278">※「考えてから答える」ぶんも出力として数えられます。上限を低いままにすると途中で切れます。</text>
</svg>
