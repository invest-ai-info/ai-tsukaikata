<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" role="img" aria-label="IDが非連番で新着3件がバラバラな位置にあるときの、一括と分割それぞれの見逃し・誤検知を示す表。行は一括・系列A問い合わせ受付(3回)、一括・系列B入出庫記録(3回)、分割・系列A(2回)、分割・系列B(2回)。列は見逃しと誤検知したID数。一括系列Aは0/9、一括系列Bは0/9、分割系列Aは0/6、分割系列Bは0/6で、誤検知したID数はすべての行で0件。合計10回・仕込み30件中、見逃しは0/30、誤検知は0件。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="424"/>
<text class="t-strong" x="18" y="26">IDがバラバラで新着が3件に増えても、見逃し・誤検知は0のまま</text>
<text class="t-sm" x="18" y="45">既読ID一覧も投稿一覧もハッシュ風の非連番ID。新着3件を先頭寄り・中ほど・末尾寄りに分けて仕込んだ。</text>
<text class="t-sm" x="18" y="64">指示文は「既読リストに無い項目を新着として列挙」のまま。一括（全300件を1通）と分割（150件ずつ2通）を比べた。</text>
<text class="t-sm" x="18" y="83">見逃しの分母＝セッション数×仕込み3件。誤検知は無関係な既読済みIDを新着と答えた回数。</text>
<text class="t-accent" x="281" y="112" text-anchor="middle">見逃し</text>
<text class="t-accent" x="413" y="112" text-anchor="middle">誤検知したID数</text>
<text class="t" x="18" y="153" style="font-size:12px">一括・系列A</text>
<text class="t-sm" x="18" y="167" style="font-size:12px">(問い合わせ受付・3回)</text>
<rect class="box-good" x="222" y="138" width="118" height="40" rx="4"/>
<text class="t-good" x="281" y="163" text-anchor="middle" style="font-size:14px">0/9</text>
<rect class="box-good" x="354" y="138" width="118" height="40" rx="4"/>
<text class="t-good" x="413" y="163" text-anchor="middle" style="font-size:14px">0件</text>
<text class="t" x="18" y="205" style="font-size:12px">一括・系列B</text>
<text class="t-sm" x="18" y="219" style="font-size:12px">(入出庫記録・3回)</text>
<rect class="box-good" x="222" y="190" width="118" height="40" rx="4"/>
<text class="t-good" x="281" y="215" text-anchor="middle" style="font-size:14px">0/9</text>
<rect class="box-good" x="354" y="190" width="118" height="40" rx="4"/>
<text class="t-good" x="413" y="215" text-anchor="middle" style="font-size:14px">0件</text>
<text class="t" x="18" y="257" style="font-size:12px">分割・系列A</text>
<text class="t-sm" x="18" y="271" style="font-size:12px">(問い合わせ受付・2回)</text>
<rect class="box-good" x="222" y="242" width="118" height="40" rx="4"/>
<text class="t-good" x="281" y="267" text-anchor="middle" style="font-size:14px">0/6</text>
<rect class="box-good" x="354" y="242" width="118" height="40" rx="4"/>
<text class="t-good" x="413" y="267" text-anchor="middle" style="font-size:14px">0件</text>
<text class="t" x="18" y="309" style="font-size:12px">分割・系列B</text>
<text class="t-sm" x="18" y="323" style="font-size:12px">(入出庫記録・2回)</text>
<rect class="box-good" x="222" y="294" width="118" height="40" rx="4"/>
<text class="t-good" x="281" y="319" text-anchor="middle" style="font-size:14px">0/6</text>
<rect class="box-good" x="354" y="294" width="118" height="40" rx="4"/>
<text class="t-good" x="413" y="319" text-anchor="middle" style="font-size:14px">0件</text>
<text class="t-strong" x="18" y="379" style="font-size:12.5px">合計(10回)</text>
<rect class="box-good" x="222" y="354" width="118" height="40" rx="4"/>
<text class="t-good" x="281" y="379" text-anchor="middle" style="font-size:14.5px">0/30</text>
<rect class="box-good" x="354" y="354" width="118" height="40" rx="4"/>
<text class="t-good" x="413" y="379" text-anchor="middle" style="font-size:14.5px">0件</text>
</svg>
