<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334" role="img" aria-label="座標の検査の死角を説明する図。見ているもの＝文字と線の位置、枠からのはみ出し、画面からのはみ出し。見ていないもの＝色。定義漏れのclassは真っ黒になるが、位置は正しいので検査を通る。塞ぎ方＝使っているclassがstyleに定義されているかを、公開のたびに機械で照合する。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="334"/>
<text class="t-strong" x="18" y="26">検査には死角がある。何を見ていないかを知っておく</text>
<text class="t-sm" x="18" y="45">座標の検査は位置しか見ません。色の事故は素通りします。</text>
<rect class="box-good" x="18" y="62" width="330" height="132" rx="6"/>
<rect class="box-bad" x="372" y="62" width="330" height="132" rx="6"/>
<text class="t-good" x="32" y="82">座標の検査が見ているもの</text>
<text class="t-bad" x="386" y="82">見ていないもの</text>
<text class="t" x="32" y="114">文字と線の位置</text>
<text class="t" x="32" y="148">枠からのはみ出し</text>
<text class="t" x="32" y="182">画面からのはみ出し</text>
<text class="t" x="386" y="114">色は見ていない</text>
<text class="t" x="386" y="148">定義漏れのclassは真っ黒になる</text>
<text class="t" x="386" y="182">真っ黒でも位置は正しい → 通る</text>
<rect class="box-accent" x="18" y="234" width="684" height="64" rx="6"/>
<text class="t-accent" x="32" y="259">死角は、別の小さな検査で塞ぐ</text>
<text class="t" x="32" y="282">使っているclassが&lt;style&gt;に定義されているか、公開のたびに機械で照合する</text>
<text class="t-xs" x="18" y="322">※ 実際にこの死角で、真っ黒に塗り潰された図が検査を通り抜けました。</text>
</svg>
