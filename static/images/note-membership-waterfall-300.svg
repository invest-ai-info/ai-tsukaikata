<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" role="img" aria-label="noteのメンバーシップで月額1,000円のプランに300人が加入し、全員がクレジットカード決済だった月の振込額の内訳を示す図。売上300,000円から事務手数料5%の15,000円が引かれて285,000円になり、そこからプラットフォーム利用料10%の28,500円が引かれて256,500円になり、さらに振込手数料270円が1回ぶん引かれて、最終的な振込額は256,230円になる。売上の85.4%が手元に残る計算。全員が携帯キャリア決済（事務手数料15%）なら229,230円で差は27,000円。決済手段を選ぶのは会員で書き手には選べないため、手取りは幅でしか言えない。AIに素朴に聞いた3回のうち1回は事務手数料を10%で計算して242,730円と答えた（原文は5%）。300人はこちらが置いた前提。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="384"/>
<text class="t-strong" x="18" y="26">月額1,000円×300人の売上から、振込までに3回引かれる</text>
<text class="t-sm" x="18" y="45">全員がクレジットカード決済の月。原文の公式例の順に、事務手数料→プラットフォーム利用料→振込手数料の順で当てはめた。</text>
<text class="t-sm" x="18" y="64">プラットフォーム利用料は「売上そのもの」ではなく「事務手数料を引いた残り」に掛かる。300人は前提。</text>
<text class="t-xs" x="300" y="88">残額（円）</text>
<text class="t" x="18" y="126">売上（1,000円 × 300人）</text>
<rect class="bar-out" x="300" y="111" width="250" height="20" rx="3"/>
<text class="t-strong" x="558" y="126">300,000円</text>
<text class="t" x="18" y="172">事務手数料 5%（クレカ決済）を引く</text>
<rect class="bar-in" x="300" y="157" width="238" height="20" rx="3"/>
<text class="t-strong" x="546" y="172">285,000円（－15,000円）</text>
<text class="t" x="18" y="218">プラットフォーム利用料 10% を引く</text>
<rect class="bar-in" x="300" y="203" width="214" height="20" rx="3"/>
<text class="t-strong" x="522" y="218">256,500円（－28,500円）</text>
<text class="t" x="18" y="264">振込手数料 270円/回 を引く</text>
<rect class="bar-out" x="300" y="249" width="214" height="20" rx="3"/>
<text class="t-strong" x="522" y="264">256,230円（－270円）</text>
<rect class="box-accent" x="18" y="300" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="320">振込額 256,230円（売上の85.4%）。全員が携帯キャリア決済（事務手数料15%）なら 229,230円＝差 27,000円。</text>
<text class="t-accent" x="34" y="338">決済手段を選ぶのは会員で、書き手には選べない。だから手取りは「幅」でしか言えない。</text>
<text class="t-accent" x="34" y="356">AIに素朴に聞いた3回のうち1回は、事務手数料を10%で計算して 242,730円 と答えた（原文は5%）。</text>
</svg>
