<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" aria-label="AI利用について書かれた文に加えてプラットフォームの規約も別枠で挙げるよう頼んだ実測で、出典を辞退した回数と作り話した回数を示す図。8回中8回が、募集文からはどのプラットフォームか特定できないため規約は挙げられない、という趣旨で正直に答え、実在しない規約を作り話した回は0回だった。">
<style>
