  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="286"/>
<text class="t-strong" x="18" y="26">版④（規約を別枠で挙げさせる）＝出典を辞退した回数と作り話した回数</text>
<text class="t-sm" x="18" y="45">架空の募集文にはプラットフォーム名を書いていない。真値＝規約の出典は挙げられないはず。</text>
<text class="t-sm" x="18" y="64">8回＝4群（禁止・要申告・可・一言も書かれていない）×各2回。</text>
<text class="t-sm" x="18" y="137">実在しない規約を作り話した</text>
<rect class="bar-old" x="260.0" y="125" width="4.0" height="18" rx="3"/>
<text class="t-good" x="272.0" y="138">0/8</text>
<text class="t-sm" x="18" y="171">「特定できない」と正直に辞退した</text>
<rect class="bar-out" x="260.0" y="159" width="350.0" height="18" rx="3"/>
<text class="t-good" x="618.0" y="172">8/8</text>
<path class="line" d="M260 186 L610.0 186"/>
<path class="line" d="M260.0 186 L260.0 191"/>
<text class="t-xs" x="254.0" y="204">0回</text>
<path class="line" d="M347.5 186 L347.5 191"/>
<text class="t-xs" x="341.5" y="204">2回</text>
<path class="line" d="M435.0 186 L435.0 191"/>
<text class="t-xs" x="429.0" y="204">4回</text>
<path class="line" d="M522.5 186 L522.5 191"/>
<text class="t-xs" x="516.5" y="204">6回</text>
<path class="line" d="M610.0 186 L610.0 191"/>
<text class="t-xs" x="604.0" y="204">8回</text>
<text class="t-xs" x="18" y="226">8回とも、募集文からはどのプラットフォームか特定できないため規約は挙げられない、</text>
<text class="t-xs" x="18" y="244">という趣旨で正直に答えた。実在しない規約を作り話した回は0回。</text>
<text class="t-xs" x="18" y="262">⚠️ これは「プラットフォーム名を書かなかった場合」の実測。実在の名前があった場合は試していない。</text>
</svg>
