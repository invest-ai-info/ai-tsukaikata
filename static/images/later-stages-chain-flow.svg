<rect class="bg" x="0" y="0" width="720" height="670"/>
<text class="t-strong" x="18" y="26">工程を5つまで増やしても、新しい2工程は崩れなかった</text>
<text class="t-sm" x="18" y="45">前の記事の工程3の出力（4本・実測済み）をそのまま使い、工程4・5を新しく足した。</text>
<text class="t-sm" x="18" y="64">工程3が完全に0件で止まった場合に、工程4がどう振る舞うかも別に試した（下）。</text>
<rect class="box-quiet" x="18" y="100" width="684" height="68" rx="6"/>
<text class="t-strong" x="34" y="120">工程1〜3（前の記事・2026-08-23）</text>
<text class="t" x="34" y="140">件数を書かせた版は4通しとも12件のまま。</text>
<text class="t" x="34" y="158">ただし3本は「期限」欄が本工程に届かず機能しなかった。</text>
<path class="line" d="M360.0 178 L360.0 194"/>
<path class="line" d="M355.0 190 L360.0 198 L365.0 190"/>
<rect class="box-good" x="18" y="200" width="684" height="68" rx="6"/>
<text class="t-strong" x="34" y="220">工程4（今回・新規）部署への振り分け</text>
<text class="t-good" x="34" y="240">見積もり→営業部／不具合→サポート部／日程→総務部。</text>
<text class="t-good" x="34" y="258">4通し・48件すべて真値どおり（期限は使っていない）。</text>
<path class="line" d="M360.0 278 L360.0 294"/>
<path class="line" d="M355.0 290 L360.0 298 L365.0 290"/>
<rect class="box-good" x="18" y="300" width="684" height="68" rx="6"/>
<text class="t-strong" x="34" y="320">工程5（今回・新規）部署別の集計表</text>
<text class="t-good" x="34" y="340">営業部・サポート部・総務部・合計の4セル。</text>
<text class="t-good" x="34" y="358">4通しとも真値どおり。</text>
<text class="t-accent" x="18" y="396">別の版：工程3が0件で完全に止まった場合</text>
<rect class="box-bad" x="18" y="416" width="684" height="68" rx="6"/>
<text class="t-strong" x="34" y="436">工程3が0件で停止（前の記事の別の版）</text>
<text class="t-bad" x="34" y="456">下流に渡せる3行（型番・用件・期限）が1件もなく、</text>
<text class="t-bad" x="34" y="474">「作れません」と断って停止した。</text>
<path class="line" d="M360.0 494 L360.0 510"/>
<path class="line" d="M355.0 506 L360.0 514 L365.0 506"/>
<rect class="box-good" x="18" y="516" width="684" height="68" rx="6"/>
<text class="t-strong" x="34" y="536">工程4（今回・新規）に、この停止をそのまま渡す</text>
<text class="t-good" x="34" y="556">「受け取った件数: 0件」と自己申告。作り話の部署は0件。</text>
<text class="t-good" x="34" y="574">前工程への質問をそのまま引き継いで、ここでも停止した。</text>
<rect class="box-accent" x="18" y="604" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="624">✅ 48件・4セルとも、新しく足した工程4・5は崩れなかった（期限欄の欠けを使わないため）。</text>
<text class="t-accent" x="34" y="642">✅ 工程3が0件で止まった場合も、工程4は作り話で埋めず、同じ理由を引き継いで止まった。</text>
</svg>
