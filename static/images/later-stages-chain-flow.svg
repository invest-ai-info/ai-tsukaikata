<svg xmlns="http://www.w3.org/2000/svg" width="720" height="670" viewBox="0 0 720 670" role="img" aria-label="3工程のチェーンに工程4（部署への振り分け）・工程5（部署別の集計表）を足した流れを示す図。工程1〜3（前の記事・2026年8月23日の実測）は、件数を書かせた版が4通しとも12件のまま保たれたが、4通しのうち3本は「期限」欄が本工程に届かず機能しなかった。工程4（今回・新規）は、見積もりを営業部、不具合をサポート部、日程を総務部に振り分け、4通し・48件すべて真値どおりだった（期限は使っていない）。工程5（今回・新規）は営業部・サポート部・総務部・合計の4セルを集計し、4通しとも真値どおりだった。下には別の版として、工程3が完全に0件で止まった場合を示す。工程3が0件で停止したのは、下流に渡せる型番・用件・期限の3行が1件もなく「作れません」と断ったため。この停止をそのまま渡した工程4（今回・新規）は、「受け取った件数: 0件」と自己申告し、作り話で部署を割った件数は0件で、前工程への質問をそのまま引き継いで同じく停止した。下の枠には、48件・4セルとも新しく足した工程4・5は崩れなかったこと、工程3が0件で止まった場合も工程4は作り話で埋めず同じ理由を引き継いで止まったことが書かれている。">
<style>
