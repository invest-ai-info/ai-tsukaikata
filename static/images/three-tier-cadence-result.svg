<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="横棒の一覧表。頻度を毎日・週1回・月1回の3段に増やした監視ログで、正常版・停止版に各2回試した結果を示す。正常版でP1〜P6のどこにも誤報が出なかった回は2/2で緑。停止版でP5（週1回・2週連続停止）を正しく検出した回は2/2で緑。停止版でP6（月1回・1か月分の停止）を正しく検出した回も2/2で緑。停止版で止まっていないP1〜P4を誤って該当にした回は0/2で緑（少ないほど良い）。下の枠には、月1回しか動かない処理（サンプルが年4回しかない）でも誤検知なく検出できたこと、一般化の範囲はこの材料・各2回に限り隔週など別の頻度が混ざった場合は未測定であることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">頻度を3段（毎日・週1・月1）に増やしても、誤報も見逃しも0件だった</text>
<text class="t-sm" x="18" y="45">実測2026-11-23。P1〜P4（毎日）・P5（週1回）・P6（月1回）の6処理、123日分のログで正常版・停止版に各2回試した。</text>
<text class="t-sm" x="18" y="64">指示文はP1・P5に加えP6用の一文（本来動くはずの月に実行が0回なら必ず該当）を足したもの。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">正常版：P1〜P6のどこにも誤報が出なかった回</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="157">停止版：P5（週1回・2週連続停止）を正しく検出した回</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="189">停止版：P6（月1回・1か月分の停止）を正しく検出した回</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="221">停止版：止まっていないP1〜P4を誤って該当にした回</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">0/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">月1回しか動かない処理（サンプルが年4回しかない）でも、誤検知なく検出できた。</text>
<text class="t-accent" x="34" y="276">一般化の範囲はこの材料・各2回に限る。隔週など、さらに別の頻度が混ざった場合は未測定。</text>
</svg>
