<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="動画の自動字幕キャプションの検品で、素朴な指示文と公式仕様書を添えた指示文の検出率を比べる表。先行記事の素朴な指示文（80回ぶん）は23/80。この記事のブレンダーを仕様書と照合（5回×8件）は40/40。掃除機を仕様書と照合（5回×8件）も40/40。下の枠には、先行記事の素朴な指示文は80件中23件（28.75%）しか拾えなかったこと、仕様書を添えるとブレンダー・掃除機ともに40件中40件（100%）を拾ったこと、指示文の文面は同じで添えた仕様書1枚だけが違いを生んだことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">公式仕様書を添えると、検出は28.75%から100%に上がった</text>
<text class="t-sm" x="18" y="45">実測2026-10-20。架空のブレンダー・掃除機キャプション、仕込み誤り計16件・計160回。</text>
<text class="t-sm" x="18" y="64">指示文の構造は先行記事と同じ。違うのは、公式仕様書を添えたことだけ。</text>
<text class="t-xs" x="458.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">先行記事：素朴な指示文（80回ぶん）</text>
<rect class="box" x="378" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="458.0" y="125" text-anchor="middle" style="font-weight:700">23/80</text>
<text class="t" x="18" y="157">この記事：ブレンダーを仕様書と照合（5回×8件）</text>
<rect class="box-good" x="378" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="157" text-anchor="middle" style="font-weight:700">40/40</text>
<text class="t" x="18" y="189">この記事：掃除機を仕様書と照合（5回×8件）</text>
<rect class="box-good" x="378" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="189" text-anchor="middle" style="font-weight:700">40/40</text>
<rect class="box-accent" x="18" y="206" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="226">先行記事の素朴な指示文は80件中23件（28.75%）しか拾えなかった。</text>
<text class="t-accent" x="34" y="244">仕様書を添えると、ブレンダー・掃除機ともに40件中40件（100%）を拾った。</text>
<text class="t-accent" x="34" y="262">指示文はどちらの記事でも同じ文面。添えた仕様書1枚だけが違いを生んだ。</text>
</svg>
