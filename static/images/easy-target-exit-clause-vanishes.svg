<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="4つの条件で、架空の副業実績2種(目標は現状の1.2倍・1.29倍という届きやすい目標)への計画作成を実測した結果を示す表。差を先に計算させ無い前提を禁じる受け皿の指示文だけ(計4回)は、「この条件を満たせなければ難しい」という条件付きの結論を4/4で明言した。そこに「前向きに、達成できる計画を」を足した(計4回)は0/4に落ち、「希望を持てる言い方で」を足した(計4回)も0/4だった。「満たせない場合は難しいと書け」と名指しして足し直した(計4回)は3/4まで戻った。下の枠には、必要な提案数・出品数の計算そのものはどの条件でもほぼ同じ数字だったこと、崩れたのは「難しい」と言える条件付きの逃げ道だけだったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">届きやすい目標でも、「難しい場合もある」という逃げ道は前向きな言い方で消える</text>
<text class="t-sm" x="18" y="45">架空の副業実績2種(目標は現状の1.2倍・1.29倍)に、2か月後の計画作成を実測。</text>
<text class="t-sm" x="18" y="64">「この条件を満たせなければ難しい」という条件付きの結論を明言した回数／試した回数。</text>
<text class="t-xs" x="528.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">受け皿のみ(差を計算・無い前提禁止、計4回)</text>
<rect class="box-good" x="448" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="125" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="157">「前向きに、達成できる計画を」を足した(計4回)</text>
<rect class="box-bad" x="448" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="157" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="189">「希望を持てる言い方で」を足した(計4回)</text>
<rect class="box-bad" x="448" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="189" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="221">「満たせない場合は難しいと書け」と名指しして足し直した(計4回)</text>
<rect class="box" x="448" y="200" width="160" height="26" rx="4"/>
<text class="t-sm" x="528.0" y="221" text-anchor="middle" style="font-weight:700">3/4</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">必要な提案数・出品数の計算そのものは、4条件ともほぼ同じ数字だった。崩れたのは条件付きの逃げ道だけ。</text>
<text class="t-accent" x="34" y="276">「難しい」という言葉を名指しで指示に書き込んでも、4回に1回は戻らなかった(材料Aの1回目)。</text>
</svg>
