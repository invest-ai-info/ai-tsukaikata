<svg xmlns="http://www.w3.org/2000/svg" width="720" height="406" viewBox="0 0 720 406" role="img" aria-label="狙いの置き方（地の文に織り込む／切り離した追記）ごとに、提案文が本音に触れた回数を材料別に比べたグループ横棒グラフ。材料1（サイトリニューアル）は、狙いなしの対照で0/4、地の文への織り込みで6/6、切り離した追記で0/6、一文を足すと6/6。材料2（動画ナレーション）は、対照で0/4、織り込みで4/4、切り離しで3/4、一文を足すと4/4。下の枠には、同じ狙いの一文でも地の文に混ぜるか切り離すかで拾われ方が変わること、材料2のように切り離しても効き目が弱い場合があるので切り離せば安全とは言えないことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="406"/>
<text class="t-strong" x="18" y="26">「切り離す」だけで、材料1は本音への言及が消えた</text>
<text class="t-sm" x="18" y="45">バーは「提案文の本体で本音に触れた回数／試した回数」。狙いの一文はどの版も1文字も変えていない。</text>
<text class="t-sm" x="18" y="64">材料2では切り離しても3/4が触れており、落ち方の強さは材料によって違った。</text>
<text class="t-sm" x="18" y="83">「困っていそうなことも考えて」を足すと、どちらの材料も切り離した版が満点に戻った。</text>
<text class="t-strong" x="18" y="122">材料1：サイトリニューアル</text>
<text class="t-xs" x="248" y="142" text-anchor="end">狙いなし（対照）</text>
<rect class="box-quiet" x="260" y="130" width="350" height="16" rx="3"/>
<text class="t-sm" x="620" y="142">0／4</text>
<text class="t-xs" x="248" y="163" text-anchor="end">地の文に織り込み</text>
<rect class="box-quiet" x="260" y="151" width="350" height="16" rx="3"/>
<rect class="box-good" x="260" y="151" width="350.0" height="16" rx="3"/>
<text class="t-sm" x="620" y="163">6／6</text>
<text class="t-xs" x="248" y="184" text-anchor="end">切り離した追記</text>
<rect class="box-quiet" x="260" y="172" width="350" height="16" rx="3"/>
<text class="t-sm" x="620" y="184">0／6</text>
<text class="t-xs" x="248" y="205" text-anchor="end">＋「困っていそうなことも考えて」</text>
<rect class="box-quiet" x="260" y="193" width="350" height="16" rx="3"/>
<rect class="box-good" x="260" y="193" width="350.0" height="16" rx="3"/>
<text class="t-sm" x="620" y="205">6／6</text>
<text class="t-strong" x="18" y="226">材料2：動画ナレーション</text>
<text class="t-xs" x="248" y="246" text-anchor="end">狙いなし（対照）</text>
<rect class="box-quiet" x="260" y="234" width="350" height="16" rx="3"/>
<text class="t-sm" x="620" y="246">0／4</text>
<text class="t-xs" x="248" y="267" text-anchor="end">地の文に織り込み</text>
<rect class="box-quiet" x="260" y="255" width="350" height="16" rx="3"/>
<rect class="box-good" x="260" y="255" width="350.0" height="16" rx="3"/>
<text class="t-sm" x="620" y="267">4／4</text>
<text class="t-xs" x="248" y="288" text-anchor="end">切り離した追記</text>
<rect class="box-quiet" x="260" y="276" width="350" height="16" rx="3"/>
<rect class="box" x="260" y="276" width="262.5" height="16" rx="3"/>
<text class="t-sm" x="620" y="288">3／4</text>
<text class="t-xs" x="248" y="309" text-anchor="end">＋「困っていそうなことも考えて」</text>
<rect class="box-quiet" x="260" y="297" width="350" height="16" rx="3"/>
<rect class="box-good" x="260" y="297" width="350.0" height="16" rx="3"/>
<text class="t-sm" x="620" y="309">4／4</text>
<rect class="box-accent" x="18" y="342" width="684" height="44" rx="6"/>
<text class="t-accent" x="34" y="362">同じ狙いの一文でも、地の文に混ぜるか切り離すかで拾われ方が変わる。</text>
<text class="t-accent" x="34" y="380">材料2のように、切り離しても効き目が弱い場合があるので「切り離せば安全」とは言えない。</text>
</svg>
