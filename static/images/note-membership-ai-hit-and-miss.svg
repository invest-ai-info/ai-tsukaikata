<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="noteのメンバーシップについてAIに聞いた結果を並べた表。上6行は原文と一致した回数で、素朴に聞いた回に最終額256,230円（真値）を出したのが2/3、引く順番を事務手数料→利用料→振込と述べたのが6/6で緑、利用料10%は事務手数料を引いた後に掛かると述べたのが3/3で緑、振込手数料270円と申請は売上1,000円以上を挙げたのが3/3で緑、材料を貼った回にクレカ256,230円とキャリア229,230円を出したのが3/3で緑、数字は書かないでの回に率・金額の数字がゼロだったのが6/6で緑。下2行は原文と違うことを言った回数で、素朴に聞いた回にクレカの事務手数料を10%で計算したのが1/3、振込の質問で出典に無い過去の額や期限（260円・失効）を述べたのが2/3で、いずれも赤。下の枠には、3段の順番は6/6で率の数字も手数料の種類を聞いた3回は原文どおりだったこと、素朴に300人なら手取りはと聞いた3回のうち1回はクレカ5%を10%として242,730円と答えたこと、式と順番は聞いてよいが率の数字は原文を貼り、貼れば3/3で1円単位まで一致したという結論が書かれている。">
<style>
