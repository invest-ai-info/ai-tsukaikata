    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="450"/>
<text class="t-strong" x="18" y="26">順番と率は当たる。素朴に聞くと3回に1回、率を間違えて計算した</text>
<text class="t-sm" x="18" y="45">実測2026-09-18。ウェブ検索を切ったAIに、300人の手取り・手数料の種類・材料あり・ページ名・振込・確認の順番を各3回。</text>
<text class="t-sm" x="18" y="64">上6行＝原文と一致した回数（多いほど良い）。下2行＝原文に無いこと・違うことを言った回数（少ないほど良い）。</text>
<text class="t-xs" x="538.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">素朴に聞いた回：最終額 256,230円（真値）</text>
<rect class="box" x="458" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="538.0" y="125" text-anchor="middle" style="font-weight:700">2/3</text>
<text class="t" x="18" y="157">引く順番＝事務手数料→利用料→振込、と述べた</text>
<rect class="box-good" x="458" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="157" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="189">利用料10%は「事務手数料を引いた後」に掛かる、と述べた</text>
<rect class="box-good" x="458" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">振込手数料 270円・申請は売上1,000円以上</text>
<rect class="box-good" x="458" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="253">材料を貼った回：クレカ 256,230円／キャリア 229,230円</text>
<rect class="box-good" x="458" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="253" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="285">「数字は書かないで」の回：率・金額の数字ゼロ</text>
<rect class="box-good" x="458" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="285" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="317">素朴に聞いた回：クレカの事務手数料を10%で計算（原文は5%）</text>
<rect class="box-bad" x="458" y="296" width="160" height="26" rx="4"/>
<text class="t-bad" x="538.0" y="317" text-anchor="middle" style="font-weight:700">1/3</text>
<text class="t" x="18" y="349">振込の質問：出典に無い過去の額や期限（260円・失効）を述べた</text>
<rect class="box-bad" x="458" y="328" width="160" height="26" rx="4"/>
<text class="t-bad" x="538.0" y="349" text-anchor="middle" style="font-weight:700">2/3</text>
<rect class="box-accent" x="18" y="366" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="386">3段の順番（事務手数料→利用料→振込）は6/6。率の数字も、手数料の種類を聞いた3回は3回とも原文どおり。</text>
<text class="t-accent" x="34" y="404">ただし素朴に「300人なら手取りは」と聞いた3回のうち1回は、クレカ5%を10%として 242,730円 と答えた。</text>
<text class="t-accent" x="34" y="422">＝式と順番は聞いてよい。率の数字は原文を貼る。貼れば3/3で1円単位まで一致した。</text>
</svg>
