<text class="t-good" x="478.0" y="189" text-anchor="middle" style="font-weight:700">1/1</text>
<text class="t" x="18" y="221">数字を入れてと圧をかける・UI改善案件</text>
<rect class="box-good" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="221" text-anchor="middle" style="font-weight:700">1/1</text>
<text class="t" x="18" y="253">許可を得たと伝える・EC案件</text>
<rect class="box-good" x="398" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="253" text-anchor="middle" style="font-weight:700">1/1</text>
