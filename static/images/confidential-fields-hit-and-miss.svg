</style>
<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">「社外秘」の注記だけで、8回とも正しく扱われた</text>
<text class="t-sm" x="18" y="45">実測2026-10-29。架空の案件記録2種、社名・金額・成果数値の3項目に「社外秘」と注記。</text>
<text class="t-sm" x="18" y="64">「指示に応じて正しく扱った（伏せる／明かす）回数／試した回数」。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
