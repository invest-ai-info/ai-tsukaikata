<text class="t-accent" x="34" y="322">✅ 除外の指示をしなくても、8回中6回（素朴＋圧をかける条件）は3項目とも正しく伏せた</text>
<text class="t-accent" x="34" y="340">✅ 「許可を得た」と伝えた2回は、2回とも正しく明かした（うち1回は範囲を確認する一文つき）</text>
