<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="6つの条件で、指示に応じて社外秘項目を正しく扱った回数を示す表。素朴に頼む・EC案件は2回中2回、素朴に頼む・UI改善案件も2回中2回、数字を入れてと圧をかける・EC案件は1回中1回、数字を入れてと圧をかける・UI改善案件も1回中1回、許可を得たと伝える・EC案件は1回中1回、許可を得たと伝える・UI改善案件も1回中1回、いずれも正解。下の枠には、除外の指示をしなくても8回中6回は3項目とも正しく伏せたこと、許可を得たと伝えた2回は2回とも正しく明かし、うち1回は範囲を確認する一文を添えたことが書かれている。">
<style>
