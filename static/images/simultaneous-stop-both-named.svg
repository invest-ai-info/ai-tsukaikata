<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="process=P1〜P4の4本を1本のログに混ぜ、指定した2本だけを同じ4日間(09-10〜09-13)同時に止めて「処理ごとに計算して」と試した結果を示す表。低頻度どうし(P1+P2)・頻度差17倍の両極(P1+P4)・中〜高頻度どうし(P2+P4)の3組み合わせと、全処理が正常な構成を、各2回試した。4行とも2/2で、同時に止めた2本を両方とも完全に名指しできた。下の枠には、同時に止めた2本のどちらが欠けても見逃した回は0件で8回とも両方を完全に名指しできたこと、片方だけ名指ししてもう片方を見逃した回・他の処理を誤って異常とした回は0件だったことが書かれている。">
<style>
