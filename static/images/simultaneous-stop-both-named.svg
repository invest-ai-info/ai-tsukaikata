<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">2本が同時に止まっても、両方とも8回中8回名指しできた</text>
<text class="t-sm" x="18" y="45">実測2026-11-04。P1〜P4を1本のログに混ぜ、2本を同じ4日間だけ同時に止めて「処理ごとに計算して」を試した。</text>
<text class="t-sm" x="18" y="64">低頻度どうし・頻度差17倍の両極・中〜高頻度どうしの3組み合わせと、全処理が正常な構成を各2回。</text>
<text class="t-xs" x="458.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">P1+P2（低頻度どうし）が同時停止</text>
<rect class="box-good" x="378" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="125" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="157">P1+P4（頻度差17倍の両極）が同時停止</text>
<rect class="box-good" x="378" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="157" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="189">P2+P4（中〜高頻度どうし）が同時停止</text>
<rect class="box-good" x="378" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="221">全処理が正常（誤報ゼロの確認）</text>
<rect class="box-good" x="378" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">同時に止めた2本のどちらが欠けても見逃した回は0件。8回とも両方を完全に名指しできた。</text>
<text class="t-accent" x="34" y="276">片方だけ名指しして、もう片方を見逃した回・誤って他の処理を異常とした回は0件だった。</text>
</svg>
