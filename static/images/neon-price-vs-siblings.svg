<svg xmlns="http://www.w3.org/2000/svg" width="720" height="348" viewBox="0 0 720 348" role="img" aria-label="Gemini 4 Hydrogen（入力1.50ドル出力7.50ドル）、Carbon・Argon（〜2026年11月30日・入力2.00ドル出力10.00ドル）、Gemini 4 Neon（発表時点・入力3.00ドル出力15.00ドル）、Carbon・Argon（2026年12月1日から・入力4.00ドル出力20.00ドル）を比べた横棒グラフ。100万トークンあたりのドル。NeonはCarbon・Argonの今の価格より高いが、2026年12月1日の値上げ後の価格よりは安い。Neon自身の発表には値上がりの予告が書かれていない。">
<style>
