  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="348"/>
<text class="t-strong" x="18" y="26">Neonの値段は、Carbon・Argonの今と値上げ後の間</text>
<text class="t-sm" x="18" y="45">薄い色＝入力、濃い色＝出力。100万トークンあたりのドル。</text>
<text class="t-sm" x="18" y="64">Carbon・Argonは2026年12月1日に価格が2倍になる予定。Neonの発表に期限の記載は無い。</text>
<text class="t" x="18" y="94">Gemini 4 Hydrogen</text>
<text class="t-xs" x="264" y="93">入力</text>
<rect class="bar-in" x="300" y="82" width="24.0" height="14" rx="2"/>
<text class="t-sm" x="332.0" y="93">$1.5</text>
<text class="t-xs" x="264" y="112">出力</text>
<rect class="bar-out" x="300" y="101" width="120.0" height="14" rx="2"/>
<text class="t-sm" x="428.0" y="112">$7.5</text>
<text class="t" x="18" y="149">Carbon・Argon（〜11/30）</text>
<text class="t-xs" x="264" y="148">入力</text>
<rect class="bar-in" x="300" y="137" width="32.0" height="14" rx="2"/>
<text class="t-sm" x="340.0" y="148">$2</text>
<text class="t-xs" x="264" y="167">出力</text>
<rect class="bar-out" x="300" y="156" width="160.0" height="14" rx="2"/>
<text class="t-sm" x="468.0" y="167">$10</text>
<text class="t" x="18" y="204">Gemini 4 Neon（発表時点）</text>
<text class="t-xs" x="264" y="203">入力</text>
<rect class="bar-in" x="300" y="192" width="48.0" height="14" rx="2"/>
<text class="t-sm" x="356.0" y="203">$3</text>
<text class="t-xs" x="264" y="222">出力</text>
<rect class="bar-out" x="300" y="211" width="240.0" height="14" rx="2"/>
<text class="t-sm" x="548.0" y="222">$15</text>
<text class="t" x="18" y="259">Carbon・Argon（12/1から）</text>
<text class="t-xs" x="264" y="258">入力</text>
<rect class="bar-in" x="300" y="247" width="64.0" height="14" rx="2"/>
<text class="t-sm" x="372.0" y="258">$4</text>
<text class="t-xs" x="264" y="277">出力</text>
<rect class="bar-out" x="300" y="266" width="320.0" height="14" rx="2"/>
<text class="t-sm" x="628.0" y="277">$20</text>
<text class="t-xs" x="18" y="322">※ Neonの発表に値上がりの予告は書かれていない（2026年11月18日時点）。</text>
<text class="t-xs" x="18" y="340">※ 出典: Neon発表ページ本文、Carbon・ArgonとHydrogenは既刊記事で確認済み。</text>
</svg>
