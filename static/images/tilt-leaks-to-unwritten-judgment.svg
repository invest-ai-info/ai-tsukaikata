<svg xmlns="http://www.w3.org/2000/svg" width="720" height="559" viewBox="0 0 720 559" role="img" aria-label="迷ったときに倒す方向を指示すると、指示していない別の判定まで影響を受けるかを、頼み方4通りで並べた表。架空の30行を2本（問い合わせメールの件名とニュースの見出し）作り、明らかに重要8件、明らかに重要でない10件、どちらとも取れる境界12件を仕込んだ。同じ回の中に、倒す方向を一度も書いていない第2の判定として、いますぐ知らせたいものに感嘆符を付けるという指示を混ぜてある。1つの頼み方につき材料2本かける各2回で4回ずつ、全部で16回。倒す方向を言わない土台だけの4回は、感嘆符が8件7件7件7件で合計29件。迷ったら重要ではない側に倒してくださいの1文を足した4回は、感嘆符の指示を1文字も変えていないのに5件5件5件6件の合計21件まで減った。つまり倒す方向は、書いた判定の外へ漏れる。さらに倒す理由を2文足した4回も5件5件6件4件で合計20件と、数はほとんど変わらなかった。しかも同じ材料の2回転で6件と4件になり、中身も2件ちがった。漏れ方は安定しない。感嘆符の判定にも、その判定のための倒す方向を書いた4回だけが、感嘆符5件5件3件3件で、境界12件の割り当ても感嘆符の集合も、2回転で4組とも完全に一致した。他の3通りは4組中2組しか一致していない。また、境界12件のうち重要ではない側に入った件数は、倒す方向を言わないと1件1件11件10件と材料によって正反対になり、倒す方向を書くと11件6件12件12件、理由まで書くと12件11件12件12件になった。理由の2文が効いたのは、書いていない判定への漏れではなく、書いた判定の安定のほうである。">
<style>
