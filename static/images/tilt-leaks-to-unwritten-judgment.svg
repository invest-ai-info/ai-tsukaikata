<rect class="bg" x="0" y="0" width="720" height="559"/>
<text class="t-strong" x="18" y="26">倒す方向は、書いていない判定にも漏れる。ただし漏れ方は回ごとに違う</text>
<text class="t-sm" x="18" y="45">架空の30行を2本（問い合わせメールの件名／ニュースの見出し）。明らかに重要8件・明らかに重要でない10件・</text>
<text class="t-sm" x="18" y="64">どちらとも取れる境界12件。同じ回の中に、倒す方向を一度も書いていない第2の判定（! を付ける）を混ぜてある。</text>
<text class="t-sm" x="18" y="83">1つの頼み方につき4回（材料2本 × 各2回）、全16回。</text>
<text class="t-xs" x="380" y="104" text-anchor="middle">書いていない判定</text>
<text class="t-xs" x="380" y="117" text-anchor="middle">! の件数（4回ぶん）</text>
<text class="t-xs" x="580" y="104" text-anchor="middle">書いた判定</text>
<text class="t-xs" x="580" y="117" text-anchor="middle">境界12件のうち低へ（4回ぶん）</text>
<text class="t" x="18" y="150">倒す方向を言わない（土台だけ）</text>
<rect class="box-bad" x="314" y="136" width="132" height="19" rx="4"/>
<text class="t-bad" x="380" y="150" text-anchor="middle">8・7・7・7</text>
<rect class="box-quiet" x="472" y="136" width="216" height="19" rx="4"/>
<text class="t" x="580" y="150" text-anchor="middle">1・1・11・10</text>
<text class="t-bad" x="32" y="167">2回転でそろった組: 2／4組</text>
<text class="t" x="18" y="206">＋「迷ったら重要ではない側に倒して」</text>
<rect class="box-bad" x="314" y="192" width="132" height="19" rx="4"/>
<text class="t-bad" x="380" y="206" text-anchor="middle">5・5・5・6</text>
<rect class="box-quiet" x="472" y="192" width="216" height="19" rx="4"/>
<text class="t" x="580" y="206" text-anchor="middle">11・6・12・12</text>
<text class="t-bad" x="32" y="223">2回転でそろった組: 2／4組</text>
<text class="t" x="18" y="262">＋倒す理由を2文</text>
<rect class="box-bad" x="314" y="248" width="132" height="19" rx="4"/>
<text class="t-bad" x="380" y="262" text-anchor="middle">5・5・6・4</text>
<rect class="box-quiet" x="472" y="248" width="216" height="19" rx="4"/>
<text class="t" x="580" y="262" text-anchor="middle">12・11・12・12</text>
<text class="t-bad" x="32" y="279">2回転でそろった組: 2／4組</text>
<text class="t-good" x="18" y="318">＋ ! の判定にも倒す方向を書く</text>
<rect class="box-good" x="314" y="304" width="132" height="19" rx="4"/>
<text class="t-good" x="380" y="318" text-anchor="middle">5・5・3・3</text>
<rect class="box-quiet" x="472" y="304" width="216" height="19" rx="4"/>
<text class="t" x="580" y="318" text-anchor="middle">11・11・12・12</text>
<text class="t-good" x="32" y="335">2回転でそろった組: 4／4組</text>
<text class="t-bad" x="18" y="370">※ 1行目→2行目＝! の指示は1文字も変えていないのに、! が 29件から21件に減った。</text>
<text class="t-bad" x="18" y="391">　 倒す方向は、書いた判定の外へ漏れる。</text>
<text class="t-bad" x="18" y="412">※ ただし漏れ方は安定しない。理由まで書いた3行目は、同じ材料の2回転で 6件と4件</text>
<text class="t-bad" x="18" y="433">　 （中身も2件ちがう）。漏れることを当てにはできない。</text>
<text class="t-good" x="18" y="454">※ ! の判定にも倒す方向を書いた4行目だけ、境界の割り当ても ! も、</text>
<text class="t-good" x="18" y="475">　 2回転で4組とも完全に一致した。</text>
<text class="t-good" x="18" y="496">※ 理由の2文が効いたのは「漏れ」ではなく「書いた判定の安定」のほう</text>
<text class="t-good" x="18" y="517">　 （2行目は 11・6・12・12 とばらつき、3行目は 12・11・12・12）。</text>
<text class="t-xs" x="18" y="538">架空データでの実測（全16回）。生の返りは docs/evidence/ に全文置いてある。</text>
</svg>
