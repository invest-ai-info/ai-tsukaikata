<svg xmlns="http://www.w3.org/2000/svg" width="720" height="224" viewBox="0 0 720 224" role="img" aria-label="アバターを足すと一度に書ける出力トークンの上限がどれだけ減るかを示した横棒グラフ。Live（音声・テキストのみ）は64,000トークン、Live with Avatar（＋動画）は24,000トークン。62.5%の下がり幅はモデルカードの2つの数字からこの記事が計算した値で、ページに直接の記載はない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="224"/>
<text class="t-strong" x="18" y="26">動画を足すと、書ける上限は64,000から24,000に減る</text>
<text class="t-sm" x="18" y="45">一度の応答で書けるトークンの上限（音声・テキストも動画も、この中に収まる）。</text>
<text class="t-sm" x="18" y="64">62.5%という下がり幅は、モデルカードの2つの数字からこの記事が計算した値。</text>
<text class="t" x="18" y="112">Live（音声・テキストのみ）</text>
<rect class="bar-old" x="268" y="96" width="348.0" height="20" rx="2"/>
<text class="t-sm" x="624.0" y="112">64,000トークン</text>
<text class="t" x="18" y="156">Live with Avatar（＋動画）</text>
<rect class="bar-new" x="268" y="140" width="130.5" height="20" rx="2"/>
<text class="t-sm" x="406.5" y="156">24,000トークン</text>
<text class="t-xs" x="18" y="202">※ 出典: Gemini 3.8 Audio モデルカード（deepmind.google・2026年9月25日に確認）。</text>
<text class="t-xs" x="18" y="218">※ 62.5%の下がり幅はこの記事の計算（1－24,000／64,000）。ページに直接の記載はない。</text>
</svg>
