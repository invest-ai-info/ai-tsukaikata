<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" role="img" aria-label="冷蔵庫にあった15品のうち、献立に登場した品数を比べた図。「あるもので作って」と頼んだときは15品中9品しか使われず、にんじん、玉ねぎ、ピーマン、牛乳、ミックスベジタブル、食パンの6品が残った。使い切る量まで書かせると15品すべてが使われた。残った6品には次の週まで持たないものが混ざるが、使わなかったものを挙げてと頼むまで、残ったこと自体が見えない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="316"/>
<text class="t-strong" x="18" y="26">「あるもので」と頼んでも、6品は使われずに残る</text>
<text class="t-sm" x="18" y="45">冷蔵庫と食品棚にあった15品のうち、献立に出てきた数。</text>
<text class="t-sm" x="18" y="124">「あるもので作って」</text>
<rect class="box-quiet" x="172" y="96" width="450" height="46" rx="6"/>
<rect class="box-accent" x="172" y="96" width="270" height="46" rx="6"/>
<text class="t-accent" x="632" y="124">9／15品</text>
<text class="t-sm" x="18" y="190">使い切る量まで書かせる</text>
<rect class="box-quiet" x="172" y="162" width="450" height="46" rx="6"/>
<rect class="box-good" x="172" y="162" width="450" height="46" rx="6"/>
<text class="t-good" x="632" y="190">15／15品</text>
<text class="t-bad" x="18" y="242">残ったもの: にんじん・玉ねぎ・ピーマン・牛乳・ミックスベジタブル・食パン</text>
<text class="t-xs" x="18" y="302">※ 残った6品は、次の週まで持たないものが混ざる。「使わなかったものを挙げて」と頼むまで、残ったこと自体が見えない。</text>
</svg>
