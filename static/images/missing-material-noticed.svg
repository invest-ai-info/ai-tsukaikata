<svg xmlns="http://www.w3.org/2000/svg" width="720" height="398" viewBox="0 0 720 398" role="img" aria-label="貼り忘れた材料の種類ごとに、AIがその不足に気づいたかどうかを並べた図。材料をひとつも貼らなかった12回は、12回とも貼られていないものを名前で挙げ、そのまま貼れる文面が返った回は0回だった。実績メモや原稿のような事実の中身を1つだけ貼り忘れた4回も、4回とも名指しした。ところが「いつもの様式」を貼り忘れた2回は、2回とも様式に一言も触れず、2回ともそのまま相手に貼れる納品連絡メールが返った。保存版の上に受け皿の前置きを足すと、同じ様式の貼り忘れを2回とも名指しして止まり、そのまま貼れる文面は0回になった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="398"/>
<text class="t-strong" x="18" y="26">貼り忘れに気づくかどうかは、貼り忘れたものの種類で割れる</text>
<text class="t-sm" x="18" y="45">架空の副業ライターの、保存して使い回している指示文6本。全32回の実測。</text>
<text class="t-sm" x="18" y="64">青＝「貼られていないもの」を名前で挙げた回。灰＝一言も触れなかった回。</text>
<text class="t-sm" x="18" y="83">右は、そのまま相手に貼れる文面が返った回数（埋める穴が1つも無いもの）。</text>
<text class="t-xs" x="262" y="110">貼られていないものを名指しした回</text>
<text class="t-xs" x="546" y="110">そのまま貼れる文面</text>
<text class="t-sm" x="18" y="142">材料をひとつも貼らない</text>
<rect class="box-quiet" x="262" y="122" width="268" height="30" rx="4"/>
<rect class="bar-new" x="262" y="122" width="268.0" height="30" rx="4"/>
<text class="t-strong" x="468" y="142">12／12回</text>
<rect class="box-good" x="546" y="122" width="96" height="30" rx="4"/>
<text class="t-good" x="580" y="142">0回</text>
<text class="t-sm" x="18" y="194">事実の中身を1つ貼り忘れ</text>
<rect class="box-quiet" x="262" y="174" width="268" height="30" rx="4"/>
<rect class="bar-new" x="262" y="174" width="268.0" height="30" rx="4"/>
<text class="t-strong" x="468" y="194">4／4回</text>
<rect class="box-good" x="546" y="174" width="96" height="30" rx="4"/>
<text class="t-good" x="580" y="194">0回</text>
<text class="t-sm" x="18" y="246">「いつもの様式」を貼り忘れ</text>
<rect class="box-quiet" x="262" y="226" width="268" height="30" rx="4"/>
<text class="t-strong" x="468" y="246">0／2回</text>
<rect class="box-bad" x="546" y="226" width="96" height="30" rx="4"/>
<text class="t-bad" x="580" y="246">2回</text>
<text class="t-sm" x="18" y="298">受け皿を足して、様式を貼り忘れ</text>
<rect class="box-quiet" x="262" y="278" width="268" height="30" rx="4"/>
<rect class="bar-new" x="262" y="278" width="268.0" height="30" rx="4"/>
<text class="t-strong" x="468" y="298">2／2回</text>
<rect class="box-good" x="546" y="278" width="96" height="30" rx="4"/>
<text class="t-good" x="580" y="298">0回</text>
<text class="t-bad" x="18" y="338">※ 素通りした2回は、原稿を1文字も見ていないのに「範囲内に収めております」と4件ずつ書いていた。</text>
<text class="t-xs" x="18" y="360">※ 「受け皿」＝保存版の上に貼る前置き。参照している材料が実際に貼られているかを、先に確かめさせる。</text>
<text class="t-xs" x="18" y="382">架空データでの実測。指示文ごとの生の返りは docs/evidence/ に置いてある。</text>
</svg>
