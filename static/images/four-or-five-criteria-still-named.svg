<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="検品の基準を5つに増やした場合の全数確認の結果を示す表。4基準同時違反・パターンA（D-09・12回試行）は12/12。4基準同時違反・パターンB（D-16・12回試行）も12/12。5基準すべて同時違反（D-14・12回試行）も12/12で、いずれも全部が当たりで塗られている。下の枠には、12回とも違反理由をすべて正しく列挙したこと、見出しの件数と列挙件数の食い違いも今回は起きなかったこと、3基準までだった前の記事と同じ天井が基準を5つに増やしても続いていることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">基準を5つに増やしても、全数確認は12回とも理由を数え切った</text>
<text class="t-sm" x="18" y="45">材料2本（各20件）×各6回=12回。重量・期限・型番に数量・産地コードの2基準を増設した。</text>
<text class="t-sm" x="18" y="64">D-09とD-16は4基準中4基準が同時違反（違う1基準だけ合格）、D-14は5基準すべてが同時違反。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">4基準同時違反・パターンA（D-09・12回）</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">12/12</text>
<text class="t" x="18" y="157">4基準同時違反・パターンB（D-16・12回）</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">12/12</text>
<text class="t" x="18" y="189">5基準すべて同時違反（D-14・12回）</text>
<rect class="box-good" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="189" text-anchor="middle" style="font-weight:700">12/12</text>
<rect class="box-accent" x="18" y="206" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="226">12回とも、3件の違反理由はすべて（4つなら4つ、5つなら5つ）正しく列挙された。</text>
<text class="t-accent" x="34" y="244">見出しの件数（合格17件・不良3件）と列挙件数の食い違いも、今回は12回とも起きなかった。</text>
<text class="t-accent" x="34" y="262">前の記事（3基準まで）と同じ天井が、基準を5つに増やしても続いている。</text>
</svg>
