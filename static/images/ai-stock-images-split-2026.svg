<svg xmlns="http://www.w3.org/2000/svg" width="720" height="488" viewBox="0 0 720 488" role="img" aria-label="同じ「AI画像を売る」が2026年に真逆へ割れたことを、左右2枚の枠で並べた図。左の緑の枠はAdobe Stockで、生成AIのラベル必須で受け入れる、ロイヤリティは写真・ベクター・イラスト33%（ビデオ35%）、公式の計算例はUS$29.99を10枚で割って33%を掛けた1枚US$0.99、支払いは最低残高US$25・初回販売から45日・日本はプレミアムPayPal、禁止プロンプトは実在の人物・作品名・政府機関名・他社IP・ニュース性、同じまたは類似プロンプトの複数バージョン提出は禁止、と書かれている。右の赤の枠はPIXTAで、2026年4月20日で新規の審査申請を終了、2026年5月22日で販売中のAI生成素材も販売停止、範囲はプロンプトのみやImage to ImageなどAI生成素材の全部、理由は原文で短期間に大量アップロードされる一方で購入者のニーズとのマッチングが困難な状況が継続、姿勢は「AIによる創作活動を否定する意図は一切ございません」と書かれている。下の枠には、答えは売る場所で真逆になるのでまず場所ごとの受け入れ可否を原文で見ること、受け入れる側にも量産の禁止があり、同じプロンプトの派生を何十枚も出す作戦は規約の側で閉じていることが書かれている。">
