</style>
<rect class="bg" x="0" y="0" width="720" height="342"/>
<text class="t-strong" x="18" y="26">出典を引用させるだけでは0件。言葉の実在まで確認すると21行中3行見つかった</text>
<text class="t-sm" x="18" y="45">「出典なし」と書かれた行はどちらの材料にも無かった。AIは必ずそれらしい一文を選んできた。</text>
<text class="t-sm" x="18" y="64">その引用文を読み直すと、関係に使った言葉そのものが無い行が材料ごとに見つかった。</text>
<text class="t-xs" x="274" y="110">②出典を引用（出典なし件数）</text>
<text class="t-xs" x="450" y="110">④言葉の実在を確認（修正・削除）</text>
<text class="t" x="18" y="150" style="font-size:12.5px">材料1（経費精算・9行）</text>
<rect class="box-good" x="264" y="124" width="160" height="42" rx="3"/>
<text class="t-good" x="284" y="150" style="font-size:13px">0/9</text>
<rect class="box-bad" x="440" y="124" width="160" height="42" rx="3"/>
<text class="t-bad" x="460" y="150" style="font-size:13px">2/9</text>
<text class="t" x="18" y="202" style="font-size:12.5px">材料2（図書館予約・12行）</text>
<rect class="box-good" x="264" y="176" width="160" height="42" rx="3"/>
<text class="t-good" x="284" y="202" style="font-size:13px">0/12</text>
<rect class="box-bad" x="440" y="176" width="160" height="42" rx="3"/>
<text class="t-bad" x="460" y="202" style="font-size:13px">1/12</text>
<text class="t" x="18" y="254" style="font-size:12.5px">合計（21行）</text>
<rect class="box-good" x="264" y="228" width="160" height="42" rx="3"/>
<text class="t-good" x="284" y="254" style="font-size:13px">0/21</text>
<rect class="box-bad" x="440" y="228" width="160" height="42" rx="3"/>
<text class="t-bad" x="460" y="254" style="font-size:13px">3/21</text>
<text class="t-xs" x="18" y="296">※ 図書館の例＝「予約者 → 図書館 → 来館する」。根拠に挙げた一文に「図書館」という言葉は無かった。</text>
<text class="t-xs" x="18" y="318">架空データでの実測。生の返りは docs/evidence/list-before-you-diagram.md に全文置いてある。</text>
</svg>
