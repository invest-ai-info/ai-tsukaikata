<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" role="img" aria-label="出典の引用だけでは捏造を防げなかったことを示す表。材料1（経費精算・9行）は、出典を引用させた段階の「出典なし」件数が0/9、言葉の実在を確認した段階で修正・削除になった件数が2/9。材料2（図書館予約・12行）は、出典なし件数が0/12、言葉の実在確認での修正・削除が1/12。合計21行では、出典なし件数が0/21、言葉の実在確認での修正・削除が3/21。図書館の例では「予約者 → 図書館 → 来館する」という行の根拠に挙げた一文に「図書館」という言葉が無く、削除された。">
<style>
