<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312" role="img" aria-label="校正の頼み方3種を比べた実測の図。下書きに直したい欠陥6件と触ってほしくない語4件を仕込んで測った。「校正して」とだけ頼むと欠陥は6件すべて直るが、守りたい語は4件中0件しか残らず、社内用語が全部書き換わった。「誤字だけ。他は変えるな」と頼むと守りたい語は4件すべて残るが、直った欠陥は6件中3件で冗長さが3件とも残った。直す種類を列挙して守る語を宣言すると、欠陥6件すべてが直り、守りたい語も4件すべて残った。1行目は誤字が全部直っているため、読むと良くなったように見え、書き換えは差分を取るまで見えない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="312"/>
<text class="t-strong" x="18" y="26">広すぎても狭すぎても駄目。直す種類を名指しするとそろう</text>
<text class="t-sm" x="18" y="45">同じ下書きに、直したい欠陥6件と触ってほしくない語4件を仕込んで測った。</text>
<text class="t-xs" x="238" y="84">直った欠陥（6件中）</text>
<text class="t-xs" x="388" y="84">守れた語（4件中）</text>
<text class="t-sm" x="18" y="124">「校正して」</text>
<rect class="box-quiet" x="238" y="96" width="120" height="46" rx="6"/>
<rect class="box-accent" x="238" y="96" width="120" height="46" rx="6"/>
<text class="t-accent" x="366" y="124">6</text>
<rect class="box-quiet" x="388" y="96" width="80" height="46" rx="6"/>
<text class="t-bad" x="476" y="124">0</text>
<text class="t-bad" x="494" y="124">社内用語が全部消えた</text>
<text class="t-sm" x="18" y="186">「誤字だけ。他は変えるな」</text>
<rect class="box-quiet" x="238" y="158" width="120" height="46" rx="6"/>
<rect class="box-accent" x="238" y="158" width="60" height="46" rx="6"/>
<text class="t-bad" x="366" y="186">3</text>
<rect class="box-quiet" x="388" y="158" width="80" height="46" rx="6"/>
<rect class="box-accent" x="388" y="158" width="80" height="46" rx="6"/>
<text class="t-accent" x="476" y="186">4</text>
<text class="t-bad" x="494" y="186">冗長さが3件とも残った</text>
<text class="t-sm" x="18" y="248">直す種類を列挙＋守る語を宣言</text>
<rect class="box-quiet" x="238" y="220" width="120" height="46" rx="6"/>
<rect class="box-good" x="238" y="220" width="120" height="46" rx="6"/>
<text class="t-good" x="366" y="248">6</text>
<rect class="box-quiet" x="388" y="220" width="80" height="46" rx="6"/>
<rect class="box-good" x="388" y="220" width="80" height="46" rx="6"/>
<text class="t-good" x="476" y="248">4</text>
<text class="t-good" x="494" y="248">両方そろった</text>
<text class="t-xs" x="18" y="298">※ 1行目は誤字が全部直っているので、読むと良くなったように見える。書き換えは差分を取るまで見えない。</text>
</svg>
