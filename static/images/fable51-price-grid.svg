<rect class="bg" x="0" y="0" width="720" height="358"/>
<text class="t-strong" x="18" y="26">Fable 5 から Fable 5.1 で何が変わったか（100万トークンあたり）</text>
<text class="t-sm" x="18" y="45">入力も出力も単価は同じ。値下げは「一度読んだものを読み直す」料金の1項目だけ。</text>
<rect class="box-quiet" x="18" y="62" width="330" height="234" rx="6"/>
<rect class="box-accent" x="372" y="62" width="330" height="234" rx="6"/>
<text class="t-strong" x="32" y="82">変わらないもの</text>
<text class="t-accent" x="386" y="82">変わったもの</text>
<text class="t" x="32" y="114">入力 $10 → $10</text>
<text class="t" x="32" y="148">出力 $50 → $50</text>
<text class="t" x="32" y="182">キャッシュ書き込み（5分） $12.50 → $12.50</text>
<text class="t" x="32" y="216">キャッシュ書き込み（1時間） $20 → $20</text>
<text class="t" x="32" y="250">まとめ処理（Batch） $5 / $25 → 同じ</text>
<text class="t" x="32" y="284">読める量 100万トークン・書ける量 12.8万</text>
<text class="t" x="386" y="114">キャッシュ読み取り $1 → $0.25（75%減）</text>
<text class="t" x="386" y="148">学習データの締め切り 2026年6月</text>
<text class="t" x="386" y="182">セキュリティ系の誤検知 約60%減</text>
<text class="t" x="386" y="216">初歩的な生物・医療の誤検知 85%減</text>
<text class="t-xs" x="18" y="346">※ 出典: Anthropic の料金ページ・モデル一覧・発表ページ（2026年9月2日に確認）。誤検知の減り方は Anthropic の説明。</text>
