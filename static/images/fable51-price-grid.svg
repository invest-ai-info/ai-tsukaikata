<svg xmlns="http://www.w3.org/2000/svg" width="720" height="358" viewBox="0 0 720 358" role="img" aria-label="Fable 5 から Fable 5.1 への単価の変化を2列で比べた図。100万トークンあたり。変わらないもの＝入力10ドル、出力50ドル、キャッシュ書き込みは5分が12.50ドル・1時間が20ドル、まとめ処理は入力5ドル・出力25ドル、読める量100万トークン、書ける量12.8万トークン。変わったもの＝キャッシュ読み取りが1ドルから0.25ドルへ75%減、学習データの締め切りが2026年6月、セキュリティ系の安全装置の誤検知が約60%減、初歩的な生物・医療の質問での誤検知が85%減。">
