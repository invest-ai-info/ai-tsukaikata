<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-label="実在のプラットフォーム名を募集文に明記すると、AIが規約に自分から言及するかを比べた図。架空の募集文2パターン（記事執筆・データ入力、どちらもAI利用の記載なし）に「クラウドワークス」と明記した版と「オンラインの受発注サイト」に伏せた版で、同じ質問を各5回ずつ計20回試した。伏せた版は10回中0回、クラウドワークスと明記した版は10回中4回（のべ5件）で規約の具体的な中身に自分から触れた。言及した5件のうち原文どおりだったのは1件だけで、残り4件は原文が「心がけてください」「留意してください」と依頼の強さで書いている項目を、「規約違反」「禁止されているのが一般的」のように禁止事項であるかのような強さに言い換えていた。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="364"/>
<text class="t-strong" x="18" y="26">サイト名を明記すると、AIは規約に自分から触れにいった</text>
<text class="t-sm" x="18" y="45">架空の募集文2パターン（記事執筆・データ入力）に、AI利用についての記載は一切入れていない。</text>
<text class="t-sm" x="18" y="64">「クラウドワークスで募集しています」と明記した版と、「オンラインの受発注サイト」に置き換えた版で、同じ質問を各5回ずつ試した（計20回）。</text>
<text class="t-xs" x="18" y="83">数えたのは、返りの中でクラウドワークスの規約の具体的な中身に断定的に触れた回数。</text>
<text class="t-xs" x="18" y="102">生の回答と判定は docs/evidence/ に全文置いてある。</text>
<text class="t-xs" x="18" y="133">伏せた（オンラインの受発注サイト）</text>
<text class="t" x="70" y="158" style="font-size:11.5px">規約に言及した回数・10回中0回</text>
<rect class="box-quiet" x="300" y="138" width="300" height="28" rx="3"/>
<text class="t-good" x="610" y="158">0/10回</text>
<text class="t-xs" x="18" y="187">クラウドワークスと明記</text>
<text class="t" x="70" y="212" style="font-size:11.5px">規約に言及した回数・10回中4回（のべ5件）</text>
<rect class="box-quiet" x="300" y="192" width="300" height="28" rx="3"/>
<rect class="box-bad" x="300" y="192" width="120.0" height="28" rx="3"/>
<text class="t-bad" x="610" y="212">4/10回</text>
<rect class="box-quiet" x="18" y="250" width="678" height="90" rx="6"/>
<text class="t-strong" x="34" y="272">言及した5件のうち、原文どおりだったのは1件だけ。</text>
<text class="t-sm" x="34" y="292">残り4件は、原文が「心がけてください」「留意してください」と依頼の強さで書いている項目を、</text>
<text class="t-sm" x="34" y="310">「規約違反」「禁止されているのが一般的」のように、禁止事項であるかのような強さに言い換えていた。</text>
<text class="t-xs" x="34" y="328">名指しされた案件で規約の中身を語られても、原文の強さまでは信じないほうがよい。</text>
</svg>
