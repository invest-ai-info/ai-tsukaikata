    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="432"/>
<text class="t-strong" x="18" y="26">条件を3→6→9→12個と積んでも、逆順にしても、崩れは1件も無かった</text>
<text class="t-sm" x="18" y="45">架空の社内お知らせ1本を、条件数を変えた5版×各2回＝10回作らせ、12条件をPythonで判定。</text>
<text class="t-sm" x="18" y="64">「12個・逆順」は同じ12条件を逆の順番で並べた版。数字は「満たした数／条件の数」。</text>
<text class="t-xs" x="283.0" y="114" text-anchor="middle">1回目</text>
<text class="t-xs" x="433.0" y="114" text-anchor="middle">2回目</text>
<text class="t" x="18" y="150">3個</text>
<rect class="box-good" x="224" y="128" width="118" height="28" rx="4"/>
