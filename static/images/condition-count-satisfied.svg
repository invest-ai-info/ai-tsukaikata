<rect class="box-good" x="224" y="212" width="118" height="28" rx="4"/>
<text class="t-good" x="283.0" y="234" text-anchor="middle" style="font-weight:700">9／9</text>
<rect class="box-good" x="374" y="212" width="118" height="28" rx="4"/>
<text class="t-good" x="433.0" y="234" text-anchor="middle" style="font-weight:700">9／9</text>
<text class="t" x="18" y="276">12個</text>
<rect class="box-good" x="224" y="254" width="118" height="28" rx="4"/>
<text class="t-good" x="283.0" y="276" text-anchor="middle" style="font-weight:700">12／12</text>
<rect class="box-good" x="374" y="254" width="118" height="28" rx="4"/>
<text class="t-good" x="433.0" y="276" text-anchor="middle" style="font-weight:700">12／12</text>
<text class="t" x="18" y="318">12個・逆順</text>
<rect class="box-good" x="224" y="296" width="118" height="28" rx="4"/>
<text class="t-good" x="283.0" y="318" text-anchor="middle" style="font-weight:700">12／12</text>
<rect class="box-good" x="374" y="296" width="118" height="28" rx="4"/>
<text class="t-good" x="433.0" y="318" text-anchor="middle" style="font-weight:700">12／12</text>
<rect class="box-accent" x="18" y="344" width="678" height="64" rx="6"/>
<text class="t-accent" x="34" y="364">10回・84問すべて（100%）が条件を満たした。12個まで積んでも、条件そのものによる劣化は見えなかった。</text>
<text class="t-accent" x="34" y="383">9個版・12個版・逆順版のいずれも2回とも満点。「後に書いた条件から落ちる」も裏づけられなかった。</text>
<text class="t-accent" x="34" y="402">AIの自己申告は10回とも「すべて満たしています」で、実際の判定と一致した（崩れが無かったため）。</text>
</svg>
