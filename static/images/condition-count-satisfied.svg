<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" role="img" aria-label="架空の社内お知らせを作らせるタスクで、機械で判定できる12条件のうち先頭から3個・6個・9個・12個を積んだ4版と、同じ12個を逆順に並べた版を、それぞれ2回ずつ実測した表。3個版・6個版・9個版・12個版・逆順版のいずれも、2回とも条件の数ぶん満点だった（3／3、6／6、9／9、12／12、12／12）。10回・84問すべてで条件を満たし、条件を増やしても崩れは見えなかった。AIの自己申告は10回とも「すべて満たしています」で、実際の判定と一致していた。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
