<svg xmlns="http://www.w3.org/2000/svg" width="720" height="374" viewBox="0 0 720 374" role="img" aria-label="架空の副業プロフィール4本（A=雑所得寄り、B・Cは国税庁の目安の境界線、D=事業所得寄り）に「事業所得か雑所得か」を素朴に2回、続けて「一言で」と決断を迫った1回の結果を示す3行×4列のマス目。Aは3回とも雑所得。Dは3回とも事業所得。Bは1回目が事業所得、2回目が要確認、一言で聞くと雑所得。Cは1回目が事業所得、2回目が要確認、一言で聞くと事業所得。境界線の2件だけ、回によって異なる結論が出た。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="374"/>
<text class="t-strong" x="18" y="26">事業所得か雑所得か——境界線の2件だけ、聞くたびに結論が変わった</text>
<text class="t-sm" x="18" y="45">架空の副業プロフィール4本。継続年数・売上規模・帳簿の有無を段階的に変えた。</text>
<text class="t-sm" x="18" y="64">AとDは明確なケース、BとCは国税庁の目安（記帳・300万円・本業の10%）の境界線。</text>
<text class="t-xs" x="18" y="88">同じプロフィールに同じ聞き方を2回。3行目は、続けて「一言で」と決断を迫った回。</text>
<text class="t-xs" x="175.0" y="122">プロフィールA</text>
<text class="t-xs" x="179.0" y="138">(雑所得寄り)</text>
<text class="t-xs" x="303.0" y="122">プロフィールB</text>
<text class="t-xs" x="307.0" y="138">(境界線)</text>
<text class="t-xs" x="431.0" y="122">プロフィールC</text>
<text class="t-xs" x="435.0" y="138">(境界線)</text>
<text class="t-xs" x="559.0" y="122">プロフィールD</text>
<text class="t-xs" x="563.0" y="138">(事業所得寄り)</text>
<text class="t-sm" x="18" y="170">素朴に聞く・1回目</text>
<rect class="box-accent" x="150" y="150" width="118" height="30" rx="4"/>
<text class="t-bad" x="189.5" y="170">雑所得</text>
<rect class="box-good" x="278" y="150" width="118" height="30" rx="4"/>
<text class="t-good" x="311.0" y="170">事業所得</text>
<rect class="box-good" x="406" y="150" width="118" height="30" rx="4"/>
<text class="t-good" x="439.0" y="170">事業所得</text>
<rect class="box-good" x="534" y="150" width="118" height="30" rx="4"/>
<text class="t-good" x="567.0" y="170">事業所得</text>
<text class="t-sm" x="18" y="210">素朴に聞く・2回目</text>
<rect class="box-accent" x="150" y="190" width="118" height="30" rx="4"/>
<text class="t-bad" x="189.5" y="210">雑所得</text>
<rect class="box-quiet" x="278" y="190" width="118" height="30" rx="4"/>
<text class="t-sm" x="317.5" y="210">要確認</text>
<rect class="box-quiet" x="406" y="190" width="118" height="30" rx="4"/>
<text class="t-sm" x="445.5" y="210">要確認</text>
<rect class="box-good" x="534" y="190" width="118" height="30" rx="4"/>
<text class="t-good" x="567.0" y="210">事業所得</text>
<text class="t-sm" x="18" y="250">一言で聞く</text>
<rect class="box-accent" x="150" y="230" width="118" height="30" rx="4"/>
<text class="t-bad" x="189.5" y="250">雑所得</text>
<rect class="box-accent" x="278" y="230" width="118" height="30" rx="4"/>
<text class="t-bad" x="317.5" y="250">雑所得</text>
<rect class="box-good" x="406" y="230" width="118" height="30" rx="4"/>
<text class="t-good" x="439.0" y="250">事業所得</text>
<rect class="box-good" x="534" y="230" width="118" height="30" rx="4"/>
<text class="t-good" x="567.0" y="250">事業所得</text>
<text class="t-xs" x="18" y="280">※ A・Dは3回とも同じ結論（安定）。B・Cは3回のうち2種類以上の結論が出た（不安定）。</text>
<text class="t-xs" x="18" y="301">一言で迫った回は4回とも「要確認」が消えたが、Bの一言の答えは1回目の素朴な結論とは</text>
<text class="t-xs" x="18" y="322">一致せず、Cの一言の答えは2回目の素朴な結論とは一致しなかった。</text>
<text class="t-xs" x="18" y="343">架空データでの実測。生の返り14回は docs/evidence/ に全文置いてある。</text>
</svg>
