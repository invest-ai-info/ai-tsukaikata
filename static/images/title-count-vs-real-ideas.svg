<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" role="img" aria-label="タイトル案を100個出させたとき、新しい発想（それまでに出た案と似ていない新規クラスタ）の数が前半50件と後半50件でどう違うかを比べた横棒グラフ。note記事テーマは前半50件のうち30件が新規クラスタだったのに対し、後半50件は5件しかなかった。Kindle本テーマも前半50件のうち33件が新規クラスタだったのに対し、後半50件は3件だった。100件を通しで機械判定すると、実質の種類数はnote記事テーマで35件、Kindle本テーマで36件（いずれも100件中）。どちらのテーマも、後半50件に入ると新しい発想はほぼ出なくなる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="356"/>
<text class="t-strong" x="18" y="26">タイトルを100個出させると、新しい発想は前半に集中する</text>
<text class="t-sm" x="18" y="45">note記事テーマ・Kindle本テーマの2本、各100件を難易度を変えず1回で出させた。</text>
<text class="t-sm" x="18" y="64">棒＝それまでに出た発想と似ていない「新規クラスタ」の数（50件中。difflib の類似度0.5で判定）。</text>
<text class="t-sm" x="18" y="83">🚨 どちらのテーマも、後半50件の新規クラスタは一桁に落ちる。</text>
<text class="t-xs" x="242" y="114">0件 ←────────────────→ 50件中</text>
<text class="t" x="18" y="141">note記事テーマ・前半50件</text>
<rect class="bar-out" x="242" y="129" width="198.0" height="16" rx="3"/>
<text class="t-good" x="448.0" y="141">30件 / 50件</text>
<text class="t" x="18" y="179">note記事テーマ・後半50件</text>
<rect class="bar-old" x="242" y="167" width="33.0" height="16" rx="3"/>
<text class="t-bad" x="283.0" y="179">5件 / 50件</text>
<text class="t" x="18" y="217">Kindle本テーマ・前半50件</text>
<rect class="bar-out" x="242" y="205" width="217.8" height="16" rx="3"/>
<text class="t-good" x="467.8" y="217">33件 / 50件</text>
<text class="t" x="18" y="255">Kindle本テーマ・後半50件</text>
<rect class="bar-old" x="242" y="243" width="19.8" height="16" rx="3"/>
<text class="t-bad" x="269.8" y="255">3件 / 50件</text>
<path class="line" d="M242 282 L572 282"/>
<path class="line" d="M242.0 282 L242.0 287"/>
<text class="t-xs" x="234.0" y="300">0件</text>
<path class="line" d="M407.0 282 L407.0 287"/>
<text class="t-xs" x="399.0" y="300">25件</text>
<path class="line" d="M572.0 282 L572.0 287"/>
<text class="t-xs" x="564.0" y="300">50件</text>
<text class="t-xs" x="18" y="322">※ 100件を通しで機械判定すると、実質の種類数はnote記事テーマ35件・Kindle本テーマ36件（いずれも100件中）。</text>
<text class="t-xs" x="18" y="340">※ 類似度の線は0.5で引いた。しきい値を変えても、前半に偏る傾向は変わらない。</text>
</svg>
