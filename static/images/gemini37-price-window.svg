<svg xmlns="http://www.w3.org/2000/svg" width="720" height="344" viewBox="0 0 720 344" role="img" aria-label="Gemini 3.7 Flash の単価が期間で変わることを示した横棒グラフ。100万トークンあたりのドル。Standard の入力は2026年12月31日まで0.75ドル、2027年1月1日から1.50ドル。Standard の出力は3.75ドルから7.50ドル。まとめ処理（Batch）の入力は0.375ドルから0.75ドル、出力は1.875ドルから3.75ドル。いずれも2027年1月1日に2倍になる。前の世代の Gemini 3.6 Flash も、いまは同じ0.75ドルと3.75ドルで、半額なのは3.7だからではなく導入期間だから。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="344"/>
<text class="t-strong" x="18" y="26">Gemini 3.7 Flash の単価は、2027年1月1日に2倍になります</text>
<text class="t-sm" x="18" y="45">青＝2026年12月31日までの導入価格、灰色＝2027年1月1日からの価格。</text>
<text class="t-sm" x="18" y="64">100万トークンあたりのドル。Batch＝急がない仕事をまとめて流す使い方。</text>
<text class="t" x="18" y="94">入力（Standard）</text>
<text class="t-xs" x="204" y="93">年内</text>
<rect class="bar-new" x="250" y="82" width="37.0" height="14" rx="2"/>
<text class="t-sm" x="295.0" y="93">$0.75</text>
<text class="t-xs" x="204" y="112">以降</text>
<rect class="bar-old" x="250" y="101" width="74.0" height="14" rx="2"/>
<text class="t-sm" x="332.0" y="112">$1.50</text>
<text class="t" x="18" y="147">出力（Standard）</text>
<text class="t-xs" x="204" y="146">年内</text>
<rect class="bar-new" x="250" y="135" width="185.0" height="14" rx="2"/>
<text class="t-sm" x="443.0" y="146">$3.75</text>
<text class="t-xs" x="204" y="165">以降</text>
<rect class="bar-old" x="250" y="154" width="370.0" height="14" rx="2"/>
<text class="t-sm" x="628.0" y="165">$7.50</text>
<text class="t" x="18" y="200">入力（Batch）</text>
<text class="t-xs" x="204" y="199">年内</text>
<rect class="bar-new" x="250" y="188" width="18.5" height="14" rx="2"/>
<text class="t-sm" x="276.5" y="199">$0.375</text>
<text class="t-xs" x="204" y="218">以降</text>
<rect class="bar-old" x="250" y="207" width="37.0" height="14" rx="2"/>
<text class="t-sm" x="295.0" y="218">$0.75</text>
<text class="t" x="18" y="253">出力（Batch）</text>
<text class="t-xs" x="204" y="252">年内</text>
<rect class="bar-new" x="250" y="241" width="92.5" height="14" rx="2"/>
<text class="t-sm" x="350.5" y="252">$1.875</text>
<text class="t-xs" x="204" y="271">以降</text>
<rect class="bar-old" x="250" y="260" width="185.0" height="14" rx="2"/>
<text class="t-sm" x="443.0" y="271">$3.75</text>
<text class="t-xs" x="18" y="314">※ 前の世代の Gemini 3.6 Flash も、いまは同じ $0.75 ／ $3.75 です。</text>
<text class="t-xs" x="18" y="332">※ 半額なのは 3.7 だからではなく、いまが導入期間だからです。</text>
</svg>
