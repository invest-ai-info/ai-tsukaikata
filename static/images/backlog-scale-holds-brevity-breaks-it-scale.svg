<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-label="監視対象の過去分の件数を7件・30件・100件と振り、「既読リストに無い項目を新着として」という素朴な指示文で新着0件を報告できた回数を比べたマス目。過去分7件では材料2本×各2回=4回中2回しか正しく0件にできず（2/4）、過去分30件では4回中3回（3/4）、過去分100件でも4回中3回（3/4）で、件数が増えるほど誤判定が増える・ある件数を境に跳ねる、といった単調な傾向は見られなかった。少ない件数のときのほうが崩れやすい回もあった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="390"/>
<text class="t-strong" x="18" y="26">過去分を7件→30件→100件に増やしても、誤判定は増えなかった</text>
<text class="t-sm" x="18" y="45">架空のSNS監視・問い合わせ監視の2本に、新しい監視対象を1件追加し、</text>
<text class="t-sm" x="18" y="64">「既読リストに無い項目を新着として」という素朴な指示文だけを通した。</text>
<text class="t-sm" x="18" y="83">正しい答えはどの件数でも「新着0件」。件数を増やすほど崩れるとは限らない。</text>
<text class="t-xs" x="18" y="102">数字は、正しく0件と判定できた回数。生の回答は docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="190">過去分7件（材料2本×各2回）</text>
<rect class="box-bad" x="268" y="168" width="190" height="34" rx="4"/>
<text class="t-bad" x="318.0" y="190">2/4 正しく0件</text>
<text class="t-sm" x="18" y="236">過去分30件（材料2本×各2回）</text>
<rect class="box-bad" x="268" y="214" width="190" height="34" rx="4"/>
<text class="t-bad" x="318.0" y="236">3/4 正しく0件</text>
<text class="t-sm" x="18" y="282">過去分100件（材料2本×各2回）</text>
<rect class="box-bad" x="268" y="260" width="190" height="34" rx="4"/>
<text class="t-bad" x="318.0" y="282">3/4 正しく0件</text>
<rect class="box-quiet" x="18" y="310" width="678" height="56" rx="6"/>
<text class="t-strong" x="34" y="332">誤判定は単調に増えず、材料と回によって行ったり来たりした。</text>
<text class="t-sm" x="34" y="350">7件でも崩れる回があり、100件でも崩れない回があった。件数だけでは決まらない。</text>
</svg>
