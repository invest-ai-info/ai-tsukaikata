<rect class="bg" x="0" y="0" width="720" height="316"/>
<text class="t-strong" x="18" y="24">同じ素朴な指示文でも、2回に1回は分けられる部分まで「要確認」にまとめた</text>
<text class="t-sm" x="18" y="43">架空の請求一覧から住所欄を削除し、「フジタ商会」とだけ書かれた2件はどちらの法人か本当に決められない状態にした。</text>
<text class="t-sm" x="18" y="62">縦軸は、法人格が分かる行から確実に区別できたグループの数（正解2）。1回目だけ、両方をまとめて1グループの「要確認」にした。</text>
<text class="t-xs" x="18" y="81">「確定できるものと、本当に決められないものを分けて」と一文足すと、2回とも正解の2グループに分かれた。</text>
<text class="t-xs" x="466.0" y="120">正解=2</text>
<text class="t" x="18" y="144">素朴・1回目</text>
<rect class="box-quiet" x="280.0" y="132" width="200.0" height="16" rx="3"/>
<rect class="box-bad" x="280.0" y="132" width="100.0" height="16" rx="3"/>
<text class="t-bad" x="492.0" y="144">1グループ</text>
<text class="t" x="18" y="178">素朴・2回目</text>
