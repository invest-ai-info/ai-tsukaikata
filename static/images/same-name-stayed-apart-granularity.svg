<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" role="img" aria-label="住所欄がまるごと無い請求一覧で、確実に区別できた会社のグループ数を、4本の横棒で示した図。縦の点線は正解の2グループ（株式会社フジタ商会と有限会社フジタ商会）。素朴な指示文の1回目だけ1グループにとどまり、法人格が分かる行まで「フジタ商会グループ・要確認」として一緒にまとめてしまった。素朴な指示文の2回目は2グループに正しく分かれた。「確定できるものと、本当に決められないものを分けて」と言い直した版は2回とも2グループに正しく分かれた。">
