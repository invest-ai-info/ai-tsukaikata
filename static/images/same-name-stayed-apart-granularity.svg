<text class="t-sm" x="18" y="274">※ 点線は正解の2グループ。素朴・1回目だけ左に届いていない。</text>
<text class="t-xs" x="18" y="293">架空データでの実測（材料1本×2版×各2回＝4回）。生の回答はdocs/evidence/ に全文置いてある。</text>
