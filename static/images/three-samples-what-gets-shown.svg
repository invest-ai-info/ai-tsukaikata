<svg xmlns="http://www.w3.org/2000/svg" width="720" height="402" viewBox="0 0 720 402" role="img" aria-label="毎朝の出来ばえをAIに3件見せさせたとき、その3件に仕込んだ不良が何件入ったかを見せ方6通りで並べた図。架空の毎朝の要約を30日ぶん、ニュース要約と問い合わせ日報の2本用意し、不良を7件仕込んだ。内訳は数字が1つも無い埋め草3件、本文は読んでいませんという断り付き2件、材料0行の空要約2件である。6版かける材料2本かける各2回で全24回。そのまま3件見せてと頼んだ版は4回とも3件のうち2件が不良。1件目15件目30件目と位置を指定した版は4回とも1件。出来のよくないほうから3件と頼んだ版は4回とも3件。先に件数を数えてから3件と頼んだ版も4回とも3件。見せてきた3件に不良が1件も入らなかった回は16回中0回で、当て方を識別子で数える方法と不良の本文がそのまま引用されたかで数える方法の2通りに変えても同じだった。位置を指定した版が毎回1件なのは、指定した15件目がたまたま不良だったためである。保存版（不良の識別子だけを返す版）は3件を選ばせる形ではなく、この実測では毎回5件を返したので、この表には無い。">
<style>
