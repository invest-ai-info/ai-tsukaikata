    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="402"/>
<text class="t-strong" x="18" y="26">「見せてくる3件に、失敗した回は入らない」は外れた。16回とも入っている</text>
<text class="t-sm" x="18" y="45">架空の「毎朝ひとりでにAIが作った要約」を30日ぶん、2本（ニュース要約／問い合わせ日報）用意し、</text>
<text class="t-sm" x="18" y="64">不良を7件仕込んだ（数字が1つも無い埋め草3件／「本文は読んでいません」2件／材料0行の空要約2件）。</text>
<text class="t-sm" x="18" y="83">振ったのは「どう見せさせるか」の1つだけ。6版 × 材料2本 × 各2回 ＝ 全24回。</text>
<text class="t-xs" x="268" y="120">見せてきた3件のうち、仕込んだ不良だった数（材料2本×各2回の4回ぶん）</text>
<text class="t" x="18" y="146">① そのまま「3件見せて」</text>
<rect class="bar-out" x="268" y="133" width="22" height="18" rx="3"/>
<text class="t-xs" x="294" y="146">2</text>
<rect class="bar-out" x="314" y="133" width="22" height="18" rx="3"/>
