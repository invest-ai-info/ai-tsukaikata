<rect class="bar-out" x="406" y="167" width="11" height="18" rx="3"/>
<text class="t-xs" x="421" y="180">1</text>
<text class="t" x="18" y="214">③ 出来のよくないほうから3件</text>
<rect class="bar-out" x="268" y="201" width="33" height="18" rx="3"/>
<text class="t-xs" x="305" y="214">3</text>
<rect class="bar-out" x="314" y="201" width="33" height="18" rx="3"/>
<text class="t-xs" x="351" y="214">3</text>
<rect class="bar-out" x="360" y="201" width="33" height="18" rx="3"/>
<text class="t-xs" x="397" y="214">3</text>
<rect class="bar-out" x="406" y="201" width="33" height="18" rx="3"/>
<text class="t-xs" x="443" y="214">3</text>
<text class="t" x="18" y="248">④ 先に件数を数えてから3件</text>
<rect class="bar-out" x="268" y="235" width="33" height="18" rx="3"/>
<text class="t-xs" x="305" y="248">3</text>
<rect class="bar-out" x="314" y="235" width="33" height="18" rx="3"/>
<text class="t-xs" x="351" y="248">3</text>
<rect class="bar-out" x="360" y="235" width="33" height="18" rx="3"/>
<text class="t-xs" x="397" y="248">3</text>
<rect class="bar-out" x="406" y="235" width="33" height="18" rx="3"/>
<text class="t-xs" x="443" y="248">3</text>
<text class="t-good" x="18" y="276">※ どの版でも、見せてきた3件に不良が1件も入らなかった回は 16回中0回。</text>
<text class="t-good" x="18" y="297">   当て方2通り（識別子で数える／不良の本文がそのまま引用されたか）でも同じ。</text>
<text class="t-bad" x="18" y="318">🚨 ②が毎回1件なのは、こちらが指定した15件目がたまたま不良だったから。</text>
<text class="t-bad" x="18" y="339">   位置を決めると、結果はその位置に何があるかで決まる。指示文の手柄ではない。</text>
<text class="t-xs" x="18" y="360">⑤（全件判定）と⑥（保存版・件数と識別子だけ）は、3件を選ばせていないので、この表には無い。</text>
<text class="t-xs" x="18" y="381">架空データでの実測（全24回）。24通の生の返りは docs/evidence/ に全文置いてある。</text>
</svg>
