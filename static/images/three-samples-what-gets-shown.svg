<text class="t-xs" x="432" y="146">2</text>
<text class="t" x="18" y="180">② 1件目・15件目・30件目</text>
<rect class="bar-out" x="268" y="167" width="11" height="18" rx="3"/>
<text class="t-xs" x="283" y="180">1</text>
<rect class="bar-out" x="314" y="167" width="11" height="18" rx="3"/>
<text class="t-xs" x="329" y="180">1</text>
<rect class="bar-out" x="360" y="167" width="11" height="18" rx="3"/>
