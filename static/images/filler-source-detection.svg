<svg xmlns="http://www.w3.org/2000/svg" width="720" height="466" viewBox="0 0 720 466" role="img" aria-label="保存指示文3本に仕込んだ8種類の「下限を強制する指定」を、3つの頼み方×材料3本×各2回＝18回でいくつ見つけたかを、横棒グラフで並べた図。「必ず3つ挙げて」型は18回中18回、「候補から必ず1つ選んで」型は16回、「良い点と悪い点を同数で」型は12回、「原因を3つ書いて」型は12回、「表の全欄を埋めて」型は10回見つかった。一方「◯行でまとめて」型は3回、「5段階で点数を」型は2回、「各項目に一言添えて」型は2回しか見つからず、赤で示している。安全な8個の指定（上限のみ）を危険と間違えて挙げた回は、18回×8個=144件中0件だった。見つけた項目の直し方は、すべて「下限を外す・逃げ道を足す」方向で、「言葉を強める」という提案は1件も無かった。">
<style>
