<svg xmlns="http://www.w3.org/2000/svg" width="720" height="394" viewBox="0 0 720 394" role="img" aria-label="基準となる日数を渡すかどうかで、5日ルールとの一致率がどう変わるかを示す横棒グラフ。架空の送付記録2本（18件・12件）に、今日2026年9月25日の日付から機械で判定できる正解を仕込んだ。基準を渡さずにAI自身に日数を決めさせた場合、材料1（18件）は4回とも15／18件（83%）が5日ルールと一致し、材料2（12件）は1回目が10／12件（83%）、2回目が11／12件（92%）だった。「最後にやりとりした日から5日以上」と基準を明記すると、材料1・材料2ともに、のべ4回すべてで18／18件・12／12件（いずれも100%）が一致した。基準を渡さなかったときの取りこぼしは全部同じ向きで、5日ルールなら催促すべきなのにAIの基準ではまだ早いと判定されたケースだけで、早すぎる催促は1件も出なかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="394"/>
<text class="t-strong" x="18" y="26">基準を渡さないと83〜92%、「5日以上」と渡すと100%が、5日ルールと一致した</text>
<text class="t-sm" x="18" y="45">架空の送付記録2本（18件・12件）に、今日2026-09-25の日付から機械で判定できる正解を仕込んだ。</text>
<text class="t-sm" x="18" y="64">基準を渡さない場合はAIが自分で決めた日数（多くは7日）で判定し、5日ルールとの一致率を数えた。</text>
<text class="t-xs" x="18" y="83">数字は「5日ルールと判定が一致した件数／全体の件数」。取りこぼしはすべて片方向（5日ルールは催促だがAIはまだ）だった。</text>
<text class="t-sm" x="18" y="136.0">基準なし・材料1（18件・4回とも同じ判定）</text>
<rect class="box-quiet" x="358" y="116" width="344.0" height="30" rx="4"/>
<text class="t-strong" x="530.0" y="136.0" text-anchor="middle" style="font-weight:700">15／18（83%）</text>
<text class="t-sm" x="18" y="176.0">基準なし・材料2・1回目（12件）</text>
<rect class="box-quiet" x="358" y="156" width="344.0" height="30" rx="4"/>
<text class="t-strong" x="530.0" y="176.0" text-anchor="middle" style="font-weight:700">10／12（83%）</text>
<text class="t-sm" x="18" y="216.0">基準なし・材料2・2回目（12件）</text>
<rect class="box-quiet" x="358" y="196" width="344.0" height="30" rx="4"/>
<text class="t-strong" x="530.0" y="216.0" text-anchor="middle" style="font-weight:700">11／12（92%）</text>
<text class="t-sm" x="18" y="256.0">基準「5日以上」を渡す・材料1（18件・2回とも）</text>
<rect class="box-good" x="358" y="236" width="344.0" height="30" rx="4"/>
<text class="t-good" x="530.0" y="256.0" text-anchor="middle" style="font-weight:700">18／18（100%）</text>
<text class="t-sm" x="18" y="296.0">基準「5日以上」を渡す・材料2（12件・2回とも）</text>
<rect class="box-good" x="358" y="276" width="344.0" height="30" rx="4"/>
<text class="t-good" x="530.0" y="296.0" text-anchor="middle" style="font-weight:700">12／12（100%）</text>
<rect class="box-accent" x="18" y="322" width="684" height="56" rx="6"/>
<text class="t-accent" x="34" y="342">取りこぼしは全部同じ向き（AIのほうが甘い）。早すぎる催促は1件も出なかった。</text>
<text class="t-sm" x="34" y="360">自分の会社の基準が5日なら、日数を書かないとAIの基準（多くは7日）に合わせられてしまう。</text>
</svg>
