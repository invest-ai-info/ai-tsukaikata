<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="記憶に書くことと書かないことの対比。書くのは、なぜその方式を選んだか、何を試して駄目だったか、どう働いてほしいか、外部の事情。書かないのは、どういう作りになっているか、何が実装されているか、修正履歴、ファイル一覧。前者は変わらないが、後者はすぐ変わって記憶のほうが嘘になる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .box-warn { fill: #fdf6e8; stroke: #d4a72c; stroke-width: 1.3; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13.5px; font-weight: 700; }
  .t-bad { fill: #b02020; font-size: 13px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 13px; font-weight: 700; }
  .t-warn { fill: #8a6100; font-size: 12px; }
  .mono { fill: #1f2328; font-size: 13px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .mono-big { fill: #1f2328; font-size: 21px; font-weight: 700; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .mono-sm { fill: #616b76; font-size: 11px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .line { stroke: #8b949e; stroke-width: 1.4; fill: none; }
  .line-quiet { stroke: #d5dae0; stroke-width: 1; fill: none; }
  .head { fill: #8b949e; }
  .bar { fill: #c8d1da; }
  .bar-hot { fill: #d92b2b; }
  .bar-pick { fill: #1a56b8; }
  .dot-ok { fill: #1a7f37; }
  .dot-skip { fill: #d92b2b; }
  .dot-idle { fill: #c8d1da; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .box-warn { fill: #2b2415; stroke: #a68321; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .t-warn { fill: #e0b644; }
    .mono { fill: #e6e9ec; }
    .mono-big { fill: #e6e9ec; }
    .mono-sm { fill: #9aa4ae; }
    .line { stroke: #6e7781; }
    .line-quiet { stroke: #363c43; }
    .head { fill: #6e7781; }
    .bar { fill: #3a424a; }
    .bar-hot { fill: #f07a7a; }
    .bar-pick { fill: #7ab0ff; }
    .dot-ok { fill: #57ab68; }
    .dot-skip { fill: #f07a7a; }
    .dot-idle { fill: #3a424a; }
  }
</style>

<rect class="bg" x="0" y="0" width="720" height="300" rx="8"/>

<text class="t-strong" x="24" y="34">リポジトリを読めば分かることは書かない</text>
<text class="t-sm" x="24" y="56">コードは変わり、記憶は変わりません。数ヶ月後、記憶のほうが嘘になります。</text>

<rect class="box-good" x="24" y="74" width="330" height="164" rx="7"/>
<text class="t-good" x="42" y="100">書く（変わらないこと）</text>
<text class="t" x="42" y="130">・なぜその方式を選んだか</text>
<text class="t" x="42" y="156">・何を試して駄目だったか</text>
<text class="t" x="42" y="182">・自分がどう働いてほしいか</text>
<text class="t" x="42" y="208">・外部の事情・制約</text>
<text class="t-xs" x="42" y="230">「なぜ」は変わらない</text>

<rect class="box-bad" x="372" y="74" width="324" height="164" rx="7"/>
<text class="t-bad" x="390" y="100">書かない（すぐ変わること）</text>
<text class="t" x="390" y="130">・どういう作りになっているか</text>
<text class="t" x="390" y="156">・何が実装されているか</text>
<text class="t" x="390" y="182">・過去の修正履歴</text>
<text class="t" x="390" y="208">・ファイル一覧</text>
<text class="t-xs" x="390" y="230">「何」はすぐ変わる</text>

<rect class="box-warn" x="24" y="252" width="672" height="36" rx="7"/>
<text class="t-warn" x="42" y="275">迷ったときの目安：同じ指摘を2回したことは、記憶に書く価値があります。</text>
</svg>
