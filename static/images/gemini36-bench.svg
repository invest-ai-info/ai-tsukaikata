<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-label="Gemini 3.5 Flash と 3.6 Flash の点数を比べた横棒グラフ。DeepSWE は37％から49％、MLE Bench は49.7％から63.9％、OSWorld-Verified は78.4％から83.0％。いずれも Google が自社で測った値で、テストの中身も測り方も3つで別々のため平均は取れない。何回試した値なのかは発表ページに書かれていない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="297"/>
<text class="t-strong" x="18" y="26">公式が挙げた点数（3.5 Flash → 3.6 Flash）</text>
<text class="t-sm" x="18" y="45">灰色＝3.5 Flash、青＝3.6 Flash。目盛りは0〜100％で揃えてあります。</text>
<text class="t-sm" x="18" y="64">どれも Google が自社で測った値です。他社が同じ条件で測った値ではありません。</text>
<text class="t" x="18" y="94">DeepSWE</text>
<text class="t-xs" x="196" y="93">3.5</text>
<rect class="bar-old" x="230" y="82" width="144.3" height="14" rx="2"/>
<text class="t-sm" x="382.3" y="93">37%</text>
<text class="t-xs" x="196" y="112">3.6</text>
<rect class="bar-new" x="230" y="101" width="191.1" height="14" rx="2"/>
<text class="t-sm" x="429.1" y="112">49%</text>
<text class="t" x="18" y="149">MLE Bench</text>
<text class="t-xs" x="196" y="148">3.5</text>
<rect class="bar-old" x="230" y="137" width="193.8" height="14" rx="2"/>
<text class="t-sm" x="431.8" y="148">49.7%</text>
<text class="t-xs" x="196" y="167">3.6</text>
<rect class="bar-new" x="230" y="156" width="249.2" height="14" rx="2"/>
<text class="t-sm" x="487.2" y="167">63.9%</text>
<text class="t" x="18" y="204">OSWorld-Verified</text>
<text class="t-xs" x="196" y="203">3.5</text>
<rect class="bar-old" x="230" y="192" width="305.8" height="14" rx="2"/>
<text class="t-sm" x="543.8" y="203">78.4%</text>
<text class="t-xs" x="196" y="222">3.6</text>
<rect class="bar-new" x="230" y="211" width="323.7" height="14" rx="2"/>
<text class="t-sm" x="561.7" y="222">83%</text>
<text class="t-xs" x="18" y="267">※ テストの中身も測り方も、この3つで別々です。並べても平均は取れません。</text>
<text class="t-xs" x="18" y="285">※ 点数が何回試した値なのかは、発表ページに書かれていません。</text>
