</style>
<rect class="bg" x="0" y="0" width="720" height="434"/>
<text class="t-strong" x="18" y="24">誤報が起きたのは「正常版×②」の2回のうち1回だけだった</text>
<text class="t-sm" x="18" y="43">①処理ごとに自分の記録から目安を計算するだけの指示文。②①に「0件が2日以上続いたら必ず該当」の一文を足した指示文。</text>
<text class="t-sm" x="18" y="62">正常版＝P5（週1回）に本当の停止なし。停止版＝P5が2回ぶん（21日間）動かなかった版。</text>
<text class="t-accent" x="283.0" y="132" text-anchor="middle">①計算のみ</text>
<text class="t-accent" x="527.0" y="132" text-anchor="middle">②①＋2日ルール</text>
<text class="t-sm" x="18" y="180.0">正常版</text>
<text class="t-sm" x="18" y="196.0">（本当の</text>
<text class="t-sm" x="18" y="212.0">停止なし）</text>
<rect class="box-good" x="168.0" y="148.0" width="230.0" height="92" rx="6"/>
<text class="t-good" x="283.0" y="180.0" text-anchor="middle">2/2が</text>
<text class="t-good" x="283.0" y="198.0" text-anchor="middle">正しく</text>
<text class="t-good" x="283.0" y="216.0" text-anchor="middle">「該当なし」</text>
<rect class="box-bad" x="412.0" y="148.0" width="230.0" height="92" rx="6"/>
<text class="t-bad" x="527.0" y="162.0" text-anchor="middle">1/2が結論で</text>
<text class="t-bad" x="527.0" y="180.0" text-anchor="middle">誤報</text>
<text class="t-bad" x="527.0" y="198.0" text-anchor="middle">（もう1/2は</text>
<text class="t-bad" x="527.0" y="216.0" text-anchor="middle">読み替えて</text>
<text class="t-bad" x="527.0" y="234.0" text-anchor="middle">該当なし）</text>
<line class="line" x1="18" y1="247.0" x2="702" y2="247.0" stroke-dasharray="3 3"/>
<text class="t-sm" x="18" y="286.0">停止版</text>
<text class="t-sm" x="18" y="302.0">（P5に21日間</text>
<text class="t-sm" x="18" y="318.0">の停止）</text>
<rect class="box-good" x="168.0" y="254.0" width="230.0" height="92" rx="6"/>
<text class="t-good" x="283.0" y="277.0" text-anchor="middle">2/2が正しく</text>
<text class="t-good" x="283.0" y="295.0" text-anchor="middle">本当の停止</text>
<text class="t-good" x="283.0" y="313.0" text-anchor="middle">だけを該当</text>
<text class="t-good" x="283.0" y="331.0" text-anchor="middle">に挙げた</text>
<rect class="box-good" x="412.0" y="254.0" width="230.0" height="92" rx="6"/>
<text class="t-good" x="527.0" y="277.0" text-anchor="middle">2/2が正しく</text>
<text class="t-good" x="527.0" y="295.0" text-anchor="middle">本当の停止</text>
<text class="t-good" x="527.0" y="313.0" text-anchor="middle">だけを該当</text>
<text class="t-good" x="527.0" y="331.0" text-anchor="middle">に挙げた</text>
<rect class="box-accent" x="18" y="366" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="386">2日ルールが誤報したのは正常版に当てはめたときだけ（2回のうち1回）。</text>
<text class="t-accent" x="34" y="404">本当の停止を見つける力は、①②どちらの指示文でも、正常版・停止版とも崩れなかった。</text>
</svg>
