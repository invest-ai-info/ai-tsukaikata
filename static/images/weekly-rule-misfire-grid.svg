<svg xmlns="http://www.w3.org/2000/svg" width="720" height="434" viewBox="0 0 720 434" role="img" aria-label="指示文（①自分の記録から計算するだけ・②①に2日ルールを足したもの）を列、材料（正常版・停止版）を行にした2行2列の表。正常版×①は2/2が正しく『該当なし』で緑。正常版×②は1/2が結論で誤報（赤）、もう1/2は読み替えて該当なし。停止版×①は2/2が正しく本当の停止だけを該当として名指し（緑）。停止版×②も2/2が正しく本当の停止だけを該当として名指し（緑）。下の枠には、2日ルールが誤報したのは正常版に当てはめたときだけで、本当の停止を見つける力はどちらの指示文でも崩れなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
