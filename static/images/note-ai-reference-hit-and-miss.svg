<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="noteの「AI参照」対価還元プログラムについて、AIに材料なしで聞いた回と、公式ブログ本文を材料として渡して聞いた回を比べた一覧表。正しく「分からない」または「材料に無い」と答えた回数／聞いた回数。材料なしで概要を聞いた3回のうち2/3が正しく「分からない」と答え、1回は存在しない日付・URL・検索結果を作った。材料なしで還元総額・対象人数・手数料の割合を聞いた3回は3/3が正しく「分からない」と答えた。材料なしで受け取れる金額を聞いた2回は1/2が正しく「分からない」と答え、もう1回はnote公式ページを確認したと偽って独自の分配式と2027年3月という支払日を書いた。材料を貼って要約させた3回は3/3が書かれていない数字を作らなかった。材料を貼って対象かどうかを判定させた2回は2/2が正しく対象外と判定した。材料を貼って申込手順を聞いた2回は2/2が正しく「申し込み不要」と答えた。材料を貼って金額を聞いた2回は2/2が書かれていない数字を作らなかった。下の枠には、材料なしで数字を聞いた3種類・合わせて8回のうち2回(25%)は作り話をしたこと、材料を貼って縛った9回は0回とも作り話をしなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="400"/>
<text class="t-strong" x="18" y="26">材料なしは8回中2回が作り話。材料を貼った9回は0回</text>
<text class="t-sm" x="18" y="45">noteのAI参照対価還元を、材料なし/材料ありでAIに聞いた実測(2026-11-27・claude --safe-mode)。</text>
<text class="t-sm" x="18" y="64">正しく「分からない」または「材料に無い」と答えた回数／聞いた回数。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">材料なしで概要を聞いた(3回)</text>
<rect class="box" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="125" text-anchor="middle" style="font-weight:700">2/3</text>
<text class="t" x="18" y="157">材料なしで総額・人数・手数料率を聞いた(3回)</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="189">材料なしで受け取れる金額を聞いた(2回)</text>
<rect class="box" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="189" text-anchor="middle" style="font-weight:700">1/2</text>
<text class="t" x="18" y="221">材料を貼って要約させた(3回)</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="253">材料を貼って対象かどうかを判定させた(2回)</text>
<rect class="box-good" x="438" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="253" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="285">材料を貼って申込手順を聞いた(2回)</text>
<rect class="box-good" x="438" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="285" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="317">材料を貼って金額を聞いた(2回)</text>
<rect class="box-good" x="438" y="296" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="317" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="334" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="354">材料なしで数字を聞いた3種類・合わせて8回のうち2回(25%)は、確認していない日付や仕組みを作った。</text>
<text class="t-accent" x="34" y="372">材料を貼って「書かれていない数字は書かれていないと言って」と縛った9回は、0回とも作り話をしなかった。</text>
</svg>
