<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" role="img" aria-label="検収完了のタイミングで支払期日の解釈が2つに分かれる仕組みを示す分岐図。材料A（ライティング受託）。1段目＝納品日2026年9月28日（月）。2段目＝検収完了は基本契約第7条により7営業日以内で、最短なら9月中・最長なら2026年10月7日（水）までかかる。ここで9月と10月の境目にかかっているのが仕込みの核心。3段目は2つの分岐。左＝9月中に検収完了した場合、発注書と基本契約のどちらの基準で計算しても2026年10月31日で一致する（緑）。右＝10月に入ってから検収完了した場合、基本契約の基準（検収完了月の翌月末）では2026年11月30日になる（赤）のに対し、発注書の基準（納品月の翌月末）は変わらず2026年10月31日のまま（青）で、1か月のズレが生じる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="424"/>
<text class="t-strong" x="18" y="26">検収完了が月をまたぐかどうかで、支払期日の解釈が2つに分かれる</text>
<text class="t-sm" x="18" y="45">材料A（ライティング受託）。納品日から7営業日以内という検収期限が、9月と10月の境目にかかっている。</text>
<rect class="box-quiet" x="18" y="96" width="684" height="40" rx="6"/>
<text class="t-strong" x="34" y="118">納品日：2026年9月28日（月）</text>
<rect class="box-quiet" x="18" y="150" width="684" height="58" rx="6"/>
<text class="t-strong" x="34" y="172">検収完了（基本契約第7条：7営業日以内）</text>
<text class="t-sm" x="34" y="191">最短＝9月中　／　最長＝2026年10月7日（水）</text>
<text class="t-xs" x="18" y="224">検収完了がどちらで終わるかで、下の2つに分かれる</text>
<rect class="box" x="18" y="230" width="332.0" height="40" rx="6"/>
<text class="t-strong" x="34" y="252">9月中に検収完了</text>
<rect class="box" x="370.0" y="230" width="332.0" height="40" rx="6"/>
<text class="t-strong" x="386.0" y="252">10月に入ってから検収完了</text>
<rect class="box-good" x="18" y="280" width="332.0" height="54" rx="6"/>
<text class="t-good" x="34" y="302">発注書・基本契約　どちらの基準でも一致</text>
<text class="t-good" x="34" y="321">→ 2026年10月31日</text>
<rect class="box-bad" x="370.0" y="280" width="332.0" height="54" rx="6"/>
<text class="t-bad" x="386.0" y="302">基本契約の基準（検収完了月）</text>
<text class="t-bad" x="386.0" y="321">→ 2026年11月30日</text>
<rect class="box-accent" x="370.0" y="344" width="332.0" height="54" rx="6"/>
<text class="t-accent" x="386.0" y="366">発注書の基準（納品月）</text>
<text class="t-accent" x="386.0" y="385">→ 2026年10月31日のまま</text>
</svg>
