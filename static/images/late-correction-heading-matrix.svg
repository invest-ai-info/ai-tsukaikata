<svg xmlns="http://www.w3.org/2000/svg" width="720" height="550" viewBox="0 0 720 550" role="img" aria-label="見出しと指示文を4通り変えたときに、後から見つかった先月分の訂正が前月比へ反映されたかを示す表。材料Aは相談受付件数、材料Bは売上金額。正しい前月比は材料Aが▲14.3%、材料Bが▲6.1%で、訂正を無視すると材料Aは▲4.0%、材料Bは符号が逆転して+10.3%になる。見出しに「まだ反映されていません」と明記してそのまま頼んだ2回は、材料A・材料Bとも2回中2回で正しい訂正後の値（28件・▲6.1%）を使った。同じ見出しで「直してから比較して」と明示的に頼んだ2回も同じ結果だった。見出しを「メモ」に変えて反映済みかどうかを書かなかった2回は、材料Aが2回とも26件（正しくは28件）で止まり、これは「二重登録扱い」という備考の一言を引き算の理由と読み違えたため。材料Bは2回とも数字を確定させず先に確認を求め、うち1回は訂正額の合計そのものを14,400円ではなく8,600円と計算違いした。「メモ」の見出しのまま「理由の書き方によらず必ず加算してください」と指示を足すと、材料Aは2回とも正しい28件に戻った（材料Bは未実施）。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="550"/>
<text class="t-strong" x="18" y="26">見出しの一言で、先月分の訂正が前月比に反映されるかが変わった</text>
<text class="t-sm" x="18" y="45">架空の月次記録2本（材料A＝相談受付件数、材料B＝売上金額）。先月の確定値には無い3件の訂正を、後から見つかった記録として同じ材料に含めた。</text>
<text class="t-sm" x="18" y="64">正しい前月比は材料A＝▲14.3%（28件→24件）、材料B＝▲6.1%（97,000円→91,100円）。</text>
<text class="t-sm" x="18" y="83">訂正を無視すると材料Aは▲4.0%、材料Bは符号が逆転して+10.3%になる。頼み方4通り×材料2本×各2回＝14回試した。</text>
<rect class="box-quiet" x="288" y="118" width="190" height="34" rx="3"/>
<text class="t-strong" x="343" y="140" style="font-size:12.5px">材料A（件数）</text>
<rect class="box-quiet" x="490" y="118" width="190" height="34" rx="3"/>
<text class="t-strong" x="545" y="140" style="font-size:12.5px">材料B（金額）</text>
<text class="t-strong" x="18" y="184" style="font-size:12px">見出しに「まだ反映されていません」</text>
<text class="t-sm" x="18" y="202">そのまま頼む</text>
<rect class="box-good" x="288" y="164" width="190" height="60" rx="3"/>
<text class="t-good" x="302" y="199" style="font-size:12.5px">28件（2/2）</text>
<rect class="box-good" x="490" y="164" width="190" height="60" rx="3"/>
<text class="t-good" x="504" y="199" style="font-size:12.5px">▲6.1%（2/2）</text>
<text class="t-strong" x="18" y="256" style="font-size:12px">同じ見出し＋「直してから比較して」</text>
<text class="t-sm" x="18" y="274">と明示的に頼む</text>
<rect class="box-good" x="288" y="236" width="190" height="60" rx="3"/>
<text class="t-good" x="302" y="271" style="font-size:12.5px">28件（2/2）</text>
<rect class="box-good" x="490" y="236" width="190" height="60" rx="3"/>
<text class="t-good" x="504" y="271" style="font-size:12.5px">▲6.1%（2/2）</text>
<text class="t-strong" x="18" y="328" style="font-size:12px">見出しを「メモ」に変える</text>
<text class="t-sm" x="18" y="346">（反映済みかは書かない）</text>
<rect class="box-bad" x="288" y="308" width="190" height="60" rx="3"/>
<text class="t-bad" x="302" y="343" style="font-size:12.5px">26件（2/2）</text>
<rect class="box-accent" x="490" y="308" width="190" height="60" rx="3"/>
<text class="t-accent" x="504" y="343" style="font-size:12.5px">保留・要確認（2/2）</text>
<text class="t-strong" x="18" y="400" style="font-size:12px">「メモ」のまま＋理由によらず</text>
<text class="t-sm" x="18" y="418">必ず加算してと指示</text>
<rect class="box-good" x="288" y="380" width="190" height="60" rx="3"/>
<text class="t-good" x="302" y="415" style="font-size:12.5px">28件（2/2）</text>
<rect class="box-quiet" x="490" y="380" width="190" height="60" rx="3"/>
<text class="t-xs" x="504" y="415" style="font-size:12.5px">未実施</text>
<text class="t-bad" x="18" y="466">※ 見出しを「メモ」に変えただけで、材料Aは「二重登録扱い」という一言を</text>
<text class="t-bad" x="18" y="486">　引き算の理由と読み、2回とも28件ではなく26件で止まった。</text>
<text class="t-sm" x="18" y="506">※ 材料Bは数字を確定させず、2回とも先に確認を求めた。うち1回は訂正額そのものの合計を間違えた（14,400円のはずが8,600円）。</text>
<text class="t-xs" x="18" y="526">架空データでの実測。指示文ごとの生の返りは docs/evidence/ に置いてある。</text>
</svg>
