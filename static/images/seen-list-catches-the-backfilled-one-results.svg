<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="既読ID一覧を実際に渡して新着を判定したとき、一括で渡した場合と100件ごと3分割で渡した場合の結果を示す表。行は一括・100件ごと3分割、列は系列ANN（お知らせ一覧）・系列MNT（メンテナンス履歴）。すべての行・列で「2/2検出・見逃し0件」。2回転とも同じ結果だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="220"/>
<text class="t-strong" x="18" y="26">既読ID一覧を実際に渡すと、一括でも3分割でも新着2件とも見逃さなかった</text>
<text class="t-sm" x="18" y="45">架空のお知らせ一覧・メンテナンス履歴（各300件）×2系列。新着2件のうち1件は一覧の中ほどの古い日付。</text>
<text class="t-sm" x="18" y="64">既読ID一覧298件を実際に渡し、「既読リストに無い項目を新着として」で聞いた。2系列×2回転＝4回ずつ機械で確認。</text>
<text class="t-accent" x="136.0" y="86">系列ANN</text>
<text class="t-accent" x="428.0" y="86">系列MNT</text>
<text class="t-sm" x="18" y="120">一括（分割なし）</text>
<rect class="box-good" x="128.0" y="100" width="282.0" height="30" rx="4"/>
<text class="t-good" x="136.0" y="120">2/2検出・見逃し0件</text>
<rect class="box-good" x="420.0" y="100" width="282.0" height="30" rx="4"/>
<text class="t-good" x="428.0" y="120">2/2検出・見逃し0件</text>
<text class="t-sm" x="18" y="160">100件ごと3分割</text>
<rect class="box-good" x="128.0" y="140" width="282.0" height="30" rx="4"/>
<text class="t-good" x="136.0" y="160">2/2検出・見逃し0件</text>
<rect class="box-good" x="420.0" y="140" width="282.0" height="30" rx="4"/>
<text class="t-good" x="428.0" y="160">2/2検出・見逃し0件</text>
<text class="t-xs" x="18" y="196">※ 誤検知（既読を新着と誤る）も4セル・8回とも0件。2回転とも同じ結果（割れた回は無し）。</text>
</svg>
