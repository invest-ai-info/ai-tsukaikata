    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">「分からないと答えて」は、範囲の質問でも1回も効かなかった</text>
<text class="t-sm" x="18" y="45">実測2026-09-27。クラウドワークスの手数料段階が材料。資料は一切見せていない。</text>
<text class="t-sm" x="18" y="64">すべて「具体的な数字を言い切った回数」（少ないほど逃げ道が効いている）。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">範囲を聞く・逃げ道なし（「区切りと率を教えて」）</text>
<rect class="box-bad" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="125" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="157">範囲を聞く・逃げ道を追加（「分からない場合は分からないと」）</text>
<rect class="box-bad" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="157" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="189">範囲を聞く・数字も目安も書くなまで追加</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="221">金額を計算させる・逃げ道なし（「手取りはいくら」）</text>
<rect class="box-bad" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="221" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="253">金額を計算させる・逃げ道を追加</text>
<rect class="box-bad" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="253" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="285">金額を計算させる・計算例も目安も書くなまで追加</text>
<rect class="box-good" x="478" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="285" text-anchor="middle" style="font-weight:700">0/3</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">先行記事（Kindle）は範囲だけ一文で4/6→0/6に下がったが、この材料では下がらない。</text>
<text class="t-accent" x="34" y="340">逃げ道の一文だけでは、範囲でも計算でも『分かりません』は1回も出なかった（10/10）。</text>
<text class="t-accent" x="34" y="358">『数字も目安も一切書くな』まで名指しして、初めて両方の質問が0/3になった。</text>
</svg>
