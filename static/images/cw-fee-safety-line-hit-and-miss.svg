<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="「分からない場合は分からないと答えてください」という一文を、クラウドワークスの手数料段階を聞く範囲の質問と、手取り額を聞く計算の質問の両方に足した実測結果を示す表。すべて具体的な数字を言い切った回数で、少ないほど逃げ道が効いている。範囲を聞く質問（手数料の区切りと率）は、逃げ道なしで5回中5回が具体的な数字を言い切り、逃げ道の一文を足しても5回中5回のまま変わらなかった。『数字も目安も一切書くな』まで名指しした一文を足すと3回中0回になった。金額を計算させる質問（92,000円の手取り）も、逃げ道なしで5回中5回が具体的な金額を言い切り、逃げ道を足しても5回中5回のまま変わらず、同じ強い言い直しでようやく3回中0回になった。下の枠には、先行記事のKindleロイヤリティでは範囲の質問だけ一文で4/6から0/6に下がったのに、この材料では範囲の質問でも下がらなかったこと、『分からない場合は分からないと答えて』だけでは範囲でも計算でも10回中0回しか『分かりません』にならなかったこと、『数字も目安も一切書くな』まで名指しして初めて両方の質問が0になったことが書かれている。">
<style>
