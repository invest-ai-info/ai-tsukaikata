<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-label="Gemini 4 Argonの導入価格と導入後、前のモデルGemini 3.1 Proの2段階の単価を比べた横棒グラフ。100万トークンあたりのドル。Argon（導入価格）は入力2ドル・出力10ドル、Argon（導入後）は入力4ドル・出力20ドル、3.1 Pro（20万トークン以下）は入力2ドル・出力12ドル、3.1 Pro（20万トークン超過時）は入力4ドル・出力18ドル。Argonの導入価格が終わる時期は発表に書かれていない。キャッシュ済み入力はArgonが入力価格の95%引き、3.1 Proは90%引き。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="352"/>
<text class="t-strong" x="18" y="26">単価（100万トークンあたり・ドル）</text>
<text class="t-sm" x="18" y="45">薄い色＝入力、濃い色＝出力。Argonの導入価格が終わる時期は発表に書かれていない。</text>
<text class="t-sm" x="18" y="64">3.1 Proの「超過時」は20万トークンを超えるプロンプトに適用される料金。</text>
<text class="t" x="18" y="94">Argon（導入価格・期限の記載なし）</text>
<text class="t-xs" x="226" y="93">入力</text>
<rect class="bar-in" x="262" y="82" width="35.8" height="14" rx="2"/>
<text class="t-sm" x="305.8" y="93">$2</text>
<text class="t-xs" x="226" y="112">出力</text>
<rect class="bar-out" x="262" y="101" width="179.0" height="14" rx="2"/>
<text class="t-sm" x="449.0" y="112">$10</text>
<text class="t" x="18" y="149">Argon（導入後。開始日は未公表）</text>
<text class="t-xs" x="226" y="148">入力</text>
<rect class="bar-in" x="262" y="137" width="71.6" height="14" rx="2"/>
<text class="t-sm" x="341.6" y="148">$4</text>
<text class="t-xs" x="226" y="167">出力</text>
<rect class="bar-out" x="262" y="156" width="358.0" height="14" rx="2"/>
<text class="t-sm" x="628.0" y="167">$20</text>
<text class="t" x="18" y="204">3.1 Pro（20万トークン以下）</text>
<text class="t-xs" x="226" y="203">入力</text>
<rect class="bar-in" x="262" y="192" width="35.8" height="14" rx="2"/>
<text class="t-sm" x="305.8" y="203">$2</text>
<text class="t-xs" x="226" y="222">出力</text>
<rect class="bar-out" x="262" y="211" width="214.8" height="14" rx="2"/>
<text class="t-sm" x="484.8" y="222">$12</text>
<text class="t" x="18" y="259">3.1 Pro（20万トークン超過時）</text>
<text class="t-xs" x="226" y="258">入力</text>
<rect class="bar-in" x="262" y="247" width="71.6" height="14" rx="2"/>
<text class="t-sm" x="341.6" y="258">$4</text>
<text class="t-xs" x="226" y="277">出力</text>
<rect class="bar-out" x="262" y="266" width="322.2" height="14" rx="2"/>
<text class="t-sm" x="592.2" y="277">$18</text>
<text class="t-xs" x="18" y="322">※ キャッシュ済み入力はArgonが入力価格の95%引き、3.1 Proは90%引き（$0.20/$2.00）。</text>
<text class="t-xs" x="18" y="340">※ 出典: Argonは発表ページ本文・脚注1、3.1 Proは ai.google.dev の料金ページ。</text>
</svg>
