<svg xmlns="http://www.w3.org/2000/svg" width="720" height="292" viewBox="0 0 720 292" role="img" aria-label="監視を仕掛ける時刻の決め方。監視対象が朝7時27分に動き、遅延対策で8時57分まで再試行する場合、監視は9時ではなく90分以上のバッファを取って12時に置く。早すぎると、対象が遅れているだけなのに異常と判定して毎日偽の警報が鳴る。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .box-warn { fill: #fdf6e8; stroke: #d4a72c; stroke-width: 1.3; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13.5px; font-weight: 700; }
  .t-bad { fill: #b02020; font-size: 13px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 13px; font-weight: 700; }
  .t-warn { fill: #8a6100; font-size: 12px; }
  .mono { fill: #1f2328; font-size: 13px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .mono-big { fill: #1f2328; font-size: 21px; font-weight: 700; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .mono-sm { fill: #616b76; font-size: 11px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .line { stroke: #8b949e; stroke-width: 1.4; fill: none; }
  .line-quiet { stroke: #d5dae0; stroke-width: 1; fill: none; }
  .head { fill: #8b949e; }
  .bar { fill: #c8d1da; }
  .bar-hot { fill: #d92b2b; }
  .bar-pick { fill: #1a56b8; }
  .dot-ok { fill: #1a7f37; }
  .dot-skip { fill: #d92b2b; }
  .dot-idle { fill: #c8d1da; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .box-warn { fill: #2b2415; stroke: #a68321; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .t-warn { fill: #e0b644; }
    .mono { fill: #e6e9ec; }
    .mono-big { fill: #e6e9ec; }
    .mono-sm { fill: #9aa4ae; }
    .line { stroke: #6e7781; }
    .line-quiet { stroke: #363c43; }
    .head { fill: #6e7781; }
    .bar { fill: #3a424a; }
    .bar-hot { fill: #f07a7a; }
    .bar-pick { fill: #7ab0ff; }
    .dot-ok { fill: #57ab68; }
    .dot-skip { fill: #f07a7a; }
    .dot-idle { fill: #3a424a; }
  }
</style>

<rect class="bg" x="0" y="0" width="720" height="292" rx="8"/>

<text class="t-strong" x="24" y="34">監視は「対象の最後の砦」より後ろに置く</text>

<path class="line-quiet" d="M40 108 H688"/>
<text class="mono-sm" x="36" y="130">7:00</text>
<text class="mono-sm" x="196" y="130">8:00</text>
<text class="mono-sm" x="356" y="130">9:00</text>
<text class="mono-sm" x="516" y="130">10:00</text>
<text class="mono-sm" x="644" y="130">12:00</text>

<text class="t-sm" x="24" y="80">監視される側</text>
<circle class="dot-ok" cx="112" cy="108" r="8"/>
<circle class="dot-idle" cx="192" cy="108" r="6"/>
<circle class="dot-idle" cx="272" cy="108" r="6"/>
<circle class="dot-idle" cx="332" cy="108" r="6"/>
<text class="t-xs" x="92" y="94">7:27</text>
<text class="t-xs" x="300" y="94">8:57 が最後の再試行</text>

<rect class="box-bad" x="332" y="152" width="180" height="52" rx="7"/>
<text class="t-bad" x="348" y="176">9:00 に監視すると</text>
<text class="t-sm" x="348" y="196">遅れているだけで警報が鳴る</text>

<rect class="box-good" x="528" y="152" width="168" height="52" rx="7"/>
<text class="t-good" x="544" y="176">12:00 に監視する</text>
<text class="t-sm" x="544" y="196">90分以上のバッファ</text>

<path class="line" d="M340 148 V120"/>
<path class="head" d="M335 120 l5 -10 5 10 z"/>
<path class="line" d="M660 148 V120"/>
<path class="head" d="M655 120 l5 -10 5 10 z"/>

<rect class="box-warn" x="24" y="222" width="672" height="56" rx="7"/>
<text class="t-warn" x="42" y="244">狼少年になった監視は無視されるようになり、無いのと同じになります。</text>
<text class="t-warn" x="42" y="264">誤報を出さないことは、検知することと同じくらい大事です。</text>
</svg>
