<svg xmlns="http://www.w3.org/2000/svg" width="720" height="242" viewBox="0 0 720 242" role="img" aria-label="文末5パターンどうしが1つにまとめられた回の割合を、前作と今回で比べた図。前作の意味が近い5パターン（材料B）は5回中3回まとめられた。今回の意味が離れた5パターンは、架空の下書き2本・計10回の実測で、まとめられた回は0回だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="242"/>
<text class="t-strong" x="18" y="26">文末5パターンどうしが、1つにまとめられた回の割合</text>
<text class="t-sm" x="18" y="45">前作は新しく足した表現が既存の表現と意味が近かった（どちらも告知の言い回し）。</text>
<text class="t-sm" x="18" y="64">今回は5パターンを依頼・断定・推量・伝聞・勧誘という意味の離れた形に差し替えた。</text>
<text class="t" x="18" y="105">意味が近い5パターン（前作・材料B）</text>
<rect class="box-quiet" x="330" y="82" width="290" height="34" rx="3"/>
<rect class="bar-old" x="330" y="82" width="174.0" height="34" rx="3"/>
<text class="t-strong" x="632" y="105">3 / 5回</text>
<text class="t" x="18" y="173">意味が離れた5パターン（今回・材料2本×5回）</text>
<rect class="box-quiet" x="330" y="150" width="290" height="34" rx="3"/>
<text class="t-strong" x="632" y="173">0 / 10回</text>
<text class="t-xs" x="18" y="230">※ 架空の下書き2本（清掃当番メモ・備品発注メモ）・計10回の実測。統合は0回だった。</text>
</svg>
