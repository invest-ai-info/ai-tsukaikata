<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312" role="img" aria-label="架空の走り書き14行から5分の動画の台本を作らせて、頼み方ごとに台詞の字数を実測した図。5分くらいの台本を書いてと頼んだ場合、台詞は2,320字で、1分300字で計算すると7分44秒、5分より2分44秒長い。1分300字で計算して5分なので1,500字を目安にと頼むと1,449字で4分50秒、5分より10秒短いだけ。同じ指示文をもう1回走らせると1,489字で4分58秒、5分より2秒短いだけだった。さらに1文40字以内、書き言葉の禁止、走り書きにないことを足さない、という3つの縛りを足すと969字で3分14秒になり、今度は1分46秒足りなくなった。素朴に頼んだ版は、自分が何字書いたかを最後まで書かなかったので、画面上は5分の台本として渡される。時間ではなく字数で渡した2回は、どちらも申告した字数が実測と一致した。縛りを重ねると尺が足りなくなり、足すのは自分の仕事になる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="312"/>
<text class="t-strong" x="18" y="26">「5分の動画」と言っても、5分にはならない</text>
<text class="t-sm" x="18" y="45">架空の走り書き14行から、5分の動画の台本を作らせた。棒は台詞の字数（Pythonで実測）。</text>
<text class="t-sm" x="300" y="84">台詞の字数</text>
<text class="t-sm" x="544" y="84">1分300字なら</text>
<text class="t-sm" x="618" y="84">5分との差</text>
<text class="t" x="18" y="117">「5分くらいの台本を書いて」</text>
<rect class="box-bad" x="300" y="104" width="230" height="18" rx="3"/>
<text class="t-xs" x="306" y="117">2,320字</text>
<text class="t-bad" x="544" y="117">7分44秒</text>
<text class="t-bad" x="618" y="117">＋2分44秒</text>
<text class="t" x="18" y="151">「1分300字・5分なので1,500字」</text>
<rect class="box-good" x="300" y="138" width="144" height="18" rx="3"/>
<text class="t-xs" x="306" y="151">1,449字</text>
<text class="t-good" x="544" y="151">4分50秒</text>
<text class="t-good" x="618" y="151">−10秒</text>
<text class="t" x="18" y="185">同じ指示文をもう1回</text>
<rect class="box-good" x="300" y="172" width="148" height="18" rx="3"/>
<text class="t-xs" x="306" y="185">1,489字</text>
<text class="t-good" x="544" y="185">4分58秒</text>
<text class="t-good" x="618" y="185">−2秒</text>
<text class="t" x="18" y="219">＋1文40字・書き言葉禁止・足さない</text>
<rect class="box-bad" x="300" y="206" width="96" height="18" rx="3"/>
<text class="t-xs" x="306" y="219">969字</text>
<text class="t-bad" x="544" y="219">3分14秒</text>
<text class="t-bad" x="618" y="219">−1分46秒</text>
<text class="t-xs" x="18" y="260">※ 素朴に頼んだ版は、自分が何字書いたかを最後まで書かなかった。画面上は「5分の台本」として渡される。</text>
<text class="t-xs" x="18" y="280">※ 時間ではなく字数で渡した2回は、どちらも申告した字数が実測と一致した（1,449字と1,489字）。</text>
<text class="t-xs" x="18" y="300">※ 縛り（1文40字・書き言葉の禁止・足さない）を重ねると、今度は尺が足りなくなる。足すのは自分の仕事になる。</text>
</svg>
