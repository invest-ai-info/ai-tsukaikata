<svg xmlns="http://www.w3.org/2000/svg" width="720" height="289" viewBox="0 0 720 289" role="img" aria-label="Kindleダイレクトパブリッシングの申告について、AIの判定は原文と一致したが、根拠の一字一句の引用や出典URLは出てこないことを示す図。4シナリオを聞いた4回のうち出典URLを書いた回は0回。根拠の一字一句の引用を求めた2回のうち、引用できた回は0回で、正直に「引用できません」と答えた回が2回。同じ連載のnoteの回では出典URLを求めると実在しないURLが3回とも返ったのに対し、こちらは無いものは無いと答えた。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="289"/>
<text class="t-strong" x="18" y="26">判定は当たっても、原文の言葉そのものは持っていない</text>
<text class="t-sm" x="18" y="45">16判定は原文と一致したが、それとは別に「根拠を一字一句引用して」と求めると別の顔を見せる。</text>
<text class="t-sm" x="18" y="64">同じ連載のnoteの回では、出典URLを求めると実在しないURLが3回とも返った（前の回を参照）。</text>
<text class="t-sm" x="18" y="83">こちらは、無いものは「無い」と答えた。</text>
<text class="t-sm" x="18" y="125">4シナリオを聞いた4回で、出典URLを書いた回</text>
<rect class="bar-old" x="460" y="131" width="4" height="18" rx="3"/>
<text class="t-bad" x="472" y="145">0/4回</text>
<text class="t-sm" x="18" y="173">根拠の一字一句の引用を求めた2回で、引用できた回</text>
<rect class="bar-old" x="460" y="179" width="4" height="18" rx="3"/>
<text class="t-bad" x="472" y="193">0/2回</text>
<text class="t-sm" x="18" y="221">根拠の一字一句の引用を求めた2回で、正直に「引用できません」と答えた回</text>
<rect class="bar-out" x="460" y="227" width="130" height="18" rx="3"/>
<text class="t-good" x="598" y="241">2/2回</text>
<text class="t-xs" x="18" y="260">架空の実測ではなくAIの知識そのものを聞いた回。生の返りと照合コードは docs/evidence/ に全文置いてある。</text>
</svg>
