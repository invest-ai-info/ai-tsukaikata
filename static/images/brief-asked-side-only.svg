<text class="t-bad" x="18" y="500">※「同時には守れない組を挙げて」と聞いた4回は、書かれていない項目を1件も挙げない。</text>
<text class="t-xs" x="18" y="522">架空データでの実測。指示文ごとの生の返りは docs/evidence/ に置いてある。</text>
