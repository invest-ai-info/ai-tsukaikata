<svg xmlns="http://www.w3.org/2000/svg" width="720" height="544" viewBox="0 0 720 544" role="img" aria-label="架空の副業の発注書2本に、同時には守れない条件を6組と、単に書かれていない項目を6件ずつ仕込んで、頼み方を5通りで比べた横棒グラフ。棒1本が1回ぶんで、左が両立しない6組のうち挙がった数、右が書かれていない6件のうち挙がった数。そのまま発注書どおりに書いてと頼んだ4回は、6組が4回とも6件、書かれていない項目は4回とも0件。足りない情報を挙げてまだ書かないでと頼んだ4回は、6組が4回とも6件、書かれていない項目が4件・6件・4件・3件。同時には守れない組を対にして挙げてと頼んだ4回は、6組が4回とも6件、書かれていない項目は4回とも0件。組ごとに私が決める欄を残させた2回は、6組が2回とも6件、書かれていない項目が1件と0件。組と書かれていないことの2つを名指しした保存版の4回は、6組も書かれていない項目も4回とも6件でそろった。つまり仕込んだ矛盾はどの頼み方でも全部挙がり、挙がらないのは聞かなかったほうの項目だけだった。">
