<rect class="bg" x="0" y="0" width="720" height="544"/>
<text class="t-strong" x="18" y="26">仕込んだ矛盾は、どの頼み方でも全部出た。出ないのは「聞かなかったほう」だけ</text>
<text class="t-sm" x="18" y="45">架空の副業の発注書を2本作り、同時には守れない条件を6組と、単に書かれていない項目を6件ずつ仕込んだ。</text>
<text class="t-sm" x="18" y="64">棒1本が1回ぶん（材料2本 × 各2回、または各1回）。目盛りは0件から6件。</text>
<text class="t-accent" x="284" y="96">両立しない6組</text>
<text class="t-accent" x="516.0" y="96">書かれていない6件</text>
