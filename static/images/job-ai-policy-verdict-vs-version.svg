<rect class="bg" x="0" y="0" width="720" height="350"/>
<text class="t-strong" x="18" y="26">AI利用が一言も書かれていない募集文でも、そのまま聞くと判断が生まれる</text>
<text class="t-sm" x="18" y="45">同じ募集文（AI利用について何も書いていない）に、頼み方だけを変えて2回ずつ実測。縦軸＝可否を断定した回数。</text>
<text class="t-sm" x="18" y="64">真値＝募集文には何も書かれていない。正しい答えは「書かれていない」で、可否のどちらにも決めないこと。</text>
<text class="t-sm" x="18" y="133">そのまま聞く</text>
<rect class="bar-old" x="230.0" y="121" width="380.0" height="18" rx="3"/>
<text class="t-bad" x="618.0" y="134">2/2</text>
<text class="t-sm" x="18" y="167">抜き出すだけを頼む</text>
<rect class="bar-out" x="230.0" y="155" width="4.0" height="18" rx="3"/>
<text class="t-good" x="242.0" y="168">0/2</text>
<text class="t-sm" x="18" y="201">＋確認文の下書き</text>
<rect class="bar-out" x="230.0" y="189" width="4.0" height="18" rx="3"/>
<text class="t-good" x="242.0" y="202">0/2</text>
<text class="t-sm" x="18" y="235">＋規約を別枠で挙げる</text>
<rect class="bar-out" x="230.0" y="223" width="4.0" height="18" rx="3"/>
<text class="t-good" x="242.0" y="236">0/2</text>
<path class="line" d="M230 250 L610.0 250"/>
<path class="line" d="M230.0 250 L230.0 255"/>
<text class="t-xs" x="224.0" y="268">0回</text>
<path class="line" d="M420.0 250 L420.0 255"/>
<text class="t-xs" x="414.0" y="268">1回</text>
<path class="line" d="M610.0 250 L610.0 255"/>
<text class="t-xs" x="604.0" y="268">2回</text>
<text class="t-xs" x="18" y="290">そのまま聞いた2回＝1回は留保つき許容、1回は自作のグレー判定。</text>
<text class="t-xs" x="18" y="308">抜き出すだけの3版は、いずれも2回とも「書かれていない」。</text>
<text class="t-xs" x="18" y="326">実測 2026-08-27・全32回（募集文4パターン×頼み方4通り×2回）。生の返りと判定コードは docs/evidence/ に全文置いてある。</text>
