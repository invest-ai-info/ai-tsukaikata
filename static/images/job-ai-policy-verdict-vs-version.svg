<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="AI利用について何も書かれていない募集文に4通りの頼み方をした実測で、可否を断定した回数を版ごとに示す図。そのまま聞いた版は2回中2回で可否を断定した（1回は留保つきの許容、1回は自作のグレー判定）。抜き出すだけを頼んだ版・確認文の下書きを頼んだ版・規約を別枠で挙げさせた版は、いずれも2回中0回で、2回とも「書かれていない」と正しく答えた。">
<style>
