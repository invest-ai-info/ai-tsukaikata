<svg xmlns="http://www.w3.org/2000/svg" width="720" height="508" viewBox="0 0 720 508" role="img" aria-label="同じ請求総額333,000円という条件だけを揃え、消費税の書き方だけを変えた2契約の計算の分かれ道を示す図。上段＝消費税を区分記載した契約。報酬額300,000円×10.21%=30,630円を源泉徴収し、333,000円から引いて手取りは302,370円。中段＝消費税込みで総額333,000円のみ記載した契約の、ありがちな誤りの手順。333,000円を1.1で割って税抜額302,727円へ逆算し、その302,727円×10.21%=30,908円を源泉徴収、333,000円から引いて手取りは302,092円。下段＝同じ契約の正しい手順。区分記載が無いので333,000円全体×10.21%=33,999円を源泉徴収し、手取りは299,001円。下の枠には、誤りの手順は源泉徴収が2,907円少なくなる方向であること、国税庁の通達が原則は消費税込みの金額全体を対象とし、区分記載があるときだけ報酬額のみでよいとしていることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="508"/>
<text class="t-strong" x="18" y="26">税抜へ逆算すると、源泉徴収が2,907円少なくなる</text>
<text class="t-sm" x="18" y="45">同じ請求総額333,000円から、計算の分かれ道で手取り額がどう変わるかを示した（実測はdocs/evidence参照）。</text>
<text class="t-strong" x="18" y="110">①消費税を区分記載した契約（正しい手順）</text>
<rect class="box-good" x="18" y="120" width="684" height="28" rx="5"/>
<text class="t-good" x="34" y="139">報酬額300,000円 × 10.21% = 30,630円を源泉徴収</text>
<rect class="box-good" x="18" y="152" width="684" height="28" rx="5"/>
<text class="t-good" x="34" y="171" style="font-weight:700">333,000円 − 30,630円 = 手取り302,370円</text>
<text class="t-strong" x="18" y="216">②込み・区分なしの契約（ありがちな誤りの手順）</text>
<rect class="box-bad" x="18" y="226" width="684" height="28" rx="5"/>
<text class="t-bad" x="34" y="245">333,000円 ÷ 1.1 = 302,727円へ税抜逆算</text>
<rect class="box-bad" x="18" y="258" width="684" height="28" rx="5"/>
<text class="t-bad" x="34" y="277">302,727円 × 10.21% = 30,908円を源泉徴収</text>
<rect class="box-bad" x="18" y="290" width="684" height="28" rx="5"/>
<text class="t-bad" x="34" y="309" style="font-weight:700">333,000円 − 30,908円 = 手取り302,092円（誤り）</text>
<text class="t-strong" x="18" y="354">②込み・区分なしの契約（通達どおりの正しい手順）</text>
<rect class="box-good" x="18" y="364" width="684" height="28" rx="5"/>
<text class="t-good" x="34" y="383">区分記載が無いため、333,000円全体 × 10.21% = 33,999円を源泉徴収</text>
<rect class="box-good" x="18" y="396" width="684" height="28" rx="5"/>
<text class="t-good" x="34" y="415" style="font-weight:700">333,000円 − 33,999円 = 手取り299,001円</text>
<rect class="box-accent" x="18" y="442" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="462">⚠️ 誤りの手順は、源泉徴収が本来より2,907円少ない方向にズレる</text>
<text class="t-accent" x="34" y="480">✅ 通達は「原則は込みの金額全体が対象。区分記載があるときだけ報酬額のみでよい」という順番</text>
</svg>
