<rect class="bg" x="0" y="0" width="720" height="458"/>
<text class="t-strong" x="18" y="26">頼み方を変えると、表の中で決まっているものが入れ替わる</text>
<text class="t-sm" x="18" y="45">架空の「できること7件・もう決めたこと3件」を材料2本ぶん作り、各2回ずつ通した（計4回）。</text>
<text class="t-sm" x="18" y="64">セルの4つの数は、左から 材料A1回目・A2回目・B1回目・B2回目。畳まずに並べてある。</text>
<rect class="box-quiet" x="236" y="92" width="152" height="38" rx="3"/>
