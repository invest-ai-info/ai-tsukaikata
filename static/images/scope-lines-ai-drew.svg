<svg xmlns="http://www.w3.org/2000/svg" width="720" height="458" viewBox="0 0 720 458" role="img" aria-label="引き受ける範囲の表を、頼み方を5通りに変えて作らせ、3つの数を回ごとに並べた図。材料は架空の「できること7件・もう決めたこと3件」を2本用意し、各2回ずつ通した。数は左から材料Aの1回目、Aの2回目、Bの1回目、Bの2回目。そのまま「表を作って」と頼むと、含まれないことの項目は7・7・7・0で、4回のうち1回は1項目も並ばなかった。そのときAIが自分で引いた上限、たとえば写真3枚までや公開後14日以内といった数は10・3・1・1で、材料に書いていない数字が線として表に入っている。〔私が決める〕の印は4回とも0件。「含まれないものも書いてください」を足すと、含まれないことは4回とも7件になり、上限は4・1・1・0に減る。「含まれるものと同じ数だけ、1行に1つ」まで足すと、含まれないことは4回とも7件、上限は5・1・0・0。〔私が決める：何を決めればよいか〕を表の中に残させると、上限は0・1・0・0まで落ち、かわりに印が19・27・26・18件残る。ただしこの版では含まれないことの項目は4回とも0件になる。対照として「私が上に書いていないことは一切書かないでください」だけを渡すと、2回とも含まれないことも上限も印も全部0件で、表は材料の写しになった。">
