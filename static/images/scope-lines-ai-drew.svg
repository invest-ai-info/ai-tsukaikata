<text class="t-bad" x="410" y="161" style="font-size:12.5px">10 ・ 3 ・ 1 ・ 1</text>
<rect class="box" x="560" y="136" width="152" height="40" rx="3"/>
<text class="t" x="572" y="161" style="font-size:12.5px">0 ・ 0 ・ 0 ・ 0</text>
<text class="t" x="18" y="208" style="font-size:12px">＋「含まれないものも」</text>
<rect class="box-good" x="236" y="183" width="152" height="40" rx="3"/>
<text class="t-good" x="248" y="208" style="font-size:12.5px">7 ・ 7 ・ 7 ・ 7</text>
<rect class="box-bad" x="398" y="183" width="152" height="40" rx="3"/>
<text class="t-bad" x="410" y="208" style="font-size:12.5px">4 ・ 1 ・ 1 ・ 0</text>
<rect class="box" x="560" y="183" width="152" height="40" rx="3"/>
<text class="t" x="572" y="208" style="font-size:12.5px">0 ・ 0 ・ 0 ・ 0</text>
<text class="t" x="18" y="255" style="font-size:12px">＋「同じ数だけ・1行に1つ」</text>
<rect class="box-good" x="236" y="230" width="152" height="40" rx="3"/>
<text class="t-good" x="248" y="255" style="font-size:12.5px">7 ・ 7 ・ 7 ・ 7</text>
<rect class="box-bad" x="398" y="230" width="152" height="40" rx="3"/>
<text class="t-bad" x="410" y="255" style="font-size:12.5px">5 ・ 1 ・ 0 ・ 0</text>
<rect class="box" x="560" y="230" width="152" height="40" rx="3"/>
<text class="t" x="572" y="255" style="font-size:12.5px">0 ・ 0 ・ 0 ・ 0</text>
<text class="t" x="18" y="302" style="font-size:12px">＋〔私が決める〕を表の中に</text>
<rect class="box-bad" x="236" y="277" width="152" height="40" rx="3"/>
<text class="t-bad" x="248" y="302" style="font-size:12.5px">0 ・ 0 ・ 0 ・ 0</text>
<rect class="box" x="398" y="277" width="152" height="40" rx="3"/>
<text class="t" x="410" y="302" style="font-size:12.5px">0 ・ 1 ・ 0 ・ 0</text>
<rect class="box-good" x="560" y="277" width="152" height="40" rx="3"/>
<text class="t-good" x="572" y="302" style="font-size:12.5px">19 ・ 27 ・ 26 ・ 18</text>
<text class="t" x="18" y="349" style="font-size:12px">対照＝「書いてないことは書くな」</text>
<rect class="box-bad" x="236" y="324" width="152" height="40" rx="3"/>
<text class="t-bad" x="248" y="349" style="font-size:12.5px">0 ・ 0 ・ — ・ —</text>
