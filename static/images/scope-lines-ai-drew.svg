<text class="t-xs" x="406" y="124">「3枚まで」等の数</text>
<rect class="box-quiet" x="560" y="92" width="152" height="38" rx="3"/>
<text class="t-strong" x="568" y="109" style="font-size:12px">〔私が決める〕</text>
<text class="t-xs" x="568" y="124">表の中に残った印</text>
<text class="t" x="18" y="161" style="font-size:12px">そのまま「表を作って」</text>
