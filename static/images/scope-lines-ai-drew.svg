<text class="t-bad" x="18" y="390">※ そのまま頼んだ4回のうち1回は、含まれないことが1項目も並ばなかった。残る3回は形が毎回違う（別表・列・見出し）。</text>
<text class="t-bad" x="18" y="412">※ 上限の中身も回ごとに違う。材料Aの2回で両方に出たのは「3枚」「14日」だけで、3,000字・5件・2枚・5ページは片方にしか出ない。</text>
<text class="t-xs" x="18" y="434">架空データでの実測。回ごとの生の返りは docs/evidence/ に全文置いてある。</text>
