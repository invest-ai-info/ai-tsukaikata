<svg xmlns="http://www.w3.org/2000/svg" width="720" height="428" viewBox="0 0 720 428" role="img" aria-label="4つのサービスの門と受け取りの形を、公式ページの記述だけでカードに並べた図。Xのクリエイター収益配分は、門がPremium加入と認証済みフォロワー500人と過去3か月に500万回以上のオーガニック インプレッションで、受け取りはStripe経由で2週間ごと、最低10ドル、本人確認の完了が必要。YouTubeパートナープログラムは、門が登録者1,000人と12か月で4,000時間、またはショート動画90日で1,000万回で、受け取りはYouTube向けAdSense経由、原資は広告掲載から得られる収益の分配と書いてある。KindleのKDPは、門が銀行情報と税に関するインタビューで出版の前に完了し、受け取りは売上月の末日から約60日後、最低売上金額を満たした月が対象。クラウドワークスの受託は、門が応募して受注することで金額は契約で決まり、手数料は10万円以下の部分が20パーセントの段階制、振込手数料は楽天銀行100円・他行500円。いずれも2026年8月29日に各公式ページで確認した記述の整理で、国・規約遵守などの前提条件は別にあり、条件と料率は変わるため始める前に原文を開いて確かめること。">
<style>
