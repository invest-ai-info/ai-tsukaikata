<rect class="bg" x="0" y="0" width="720" height="428"/>
<text class="t-strong" x="18" y="26">「門」の中身と受け取りの形は、公式ページで確かめられる</text>
<text class="t-sm" x="18" y="45">門は①型（X・YouTube）＝実績の数字、②型（Kindle）＝事務手続きと振込条件、③型（受託）＝受注。</text>
<text class="t-sm" x="18" y="64">2026-08-29に各公式ページで確認した記述の整理（noteは2026-08-25確認の既存記事と同じ出典）。</text>
<rect class="box" x="18" y="92" width="333" height="130" rx="6"/>
<text class="t-strong" x="32" y="116">X（クリエイター収益配分）</text>
<text class="t" x="32" y="140">門: Premium加入＋認証済みフォロワー500人</text>
<text class="t" x="32" y="160">　　＋過去3か月に500万回以上の</text>
<text class="t" x="32" y="180">　　　オーガニック インプレッション</text>
<text class="t-sm" x="32" y="200">受け取り: Stripe経由・2週間ごと・最低10ドル・本人確認</text>
<rect class="box" x="369" y="92" width="333" height="130" rx="6"/>
<text class="t-strong" x="383" y="116">YouTube（パートナープログラム）</text>
<text class="t" x="383" y="140">門: 登録者1,000人＋12か月で4,000時間</text>
<text class="t" x="383" y="160">　　（またはショート90日で1,000万回）</text>
<text class="t-sm" x="383" y="180">受け取り: YouTube向けAdSense経由</text>
<text class="t-sm" x="383" y="200">原資は「広告掲載から得られる収益」の分配</text>
<rect class="box" x="18" y="236" width="333" height="130" rx="6"/>
<text class="t-strong" x="32" y="260">Kindle（KDP）</text>
<text class="t" x="32" y="284">門: 銀行情報＋税に関するインタビュー</text>
<text class="t" x="32" y="304">　　（出版の前に完了する）</text>
<text class="t-sm" x="32" y="324">受け取り: 売上月の末日から約60日後</text>
<text class="t-sm" x="32" y="344">最低売上金額を満たした月が対象</text>
<rect class="box" x="369" y="236" width="333" height="130" rx="6"/>
<text class="t-strong" x="383" y="260">クラウドワークス（受託）</text>
<text class="t" x="383" y="284">門: 応募して受注する</text>
<text class="t" x="383" y="304">　　（金額は契約で決まる）</text>
<text class="t-sm" x="383" y="324">手数料: 10万円以下の部分が20%（段階制）</text>
<text class="t-sm" x="383" y="344">振込手数料: 楽天100円・他行500円</text>
<rect class="box-accent" x="18" y="380" width="684" height="28" rx="6"/>
<text class="t-accent" x="34" y="399">条件と料率は変わる（国・規約遵守などの前提条件も別にある）。始める前に必ず原文を開くこと。</text>
</svg>
