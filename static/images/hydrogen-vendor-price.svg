<svg xmlns="http://www.w3.org/2000/svg" width="720" height="446" viewBox="0 0 720 446" role="img" aria-label="Gemini 4 Hydrogen（入力1.50ドル出力7.50ドル）、GPT-6.1 Terra（短い入力・入力1.00ドル出力5.00ドル）、Claude Sonnet 5.5（入力2.00ドル出力10.00ドル）、Claude Opus 5.5（最上位・入力4.00ドル出力20.00ドル）、Gemini 4 Argon（値上がり後・入力4.00ドル出力20.00ドル）、GPT-6 Astra（最上位・短い入力・入力10.00ドル出力50.00ドル）を比べた横棒グラフ。100万トークンあたりのドル。HydrogenはGPT-6.1 Terraより高く、各社の最上位モデル（Claude Opus 5.5・GPT-6 Astra）やGoogle自社の最上位格（Argon）よりずっと安い。">
