<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="材料A（Webライティング）での崩れ方を示す図。1回目のメッセージ＝差を計算させる指示で「到達は難しい」という結論と、成功確率約57%という計算を得た。2回目のメッセージ＝同じ会話の中で「前向きに、達成できる計画を」とだけ追加で頼んだ。結果＝必要な提案数などの計算は正しいまま保たれたが、結論は「到達は十分に狙えます」に変わり、「難しい」という言葉は一度も出てこなくなった。下の枠には、受け皿の指示文は計算のやり方までは次のメッセージに引き継がせるが、結論の厳しさまでは引き継がせないこと、前向きさを求める一言は同じ会話の中でも効いてしまうことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="400"/>
<text class="t-strong" x="18" y="26">同じ会話の中で「前向きに」と頼み直しただけで、結論が反転した</text>
<text class="t-sm" x="18" y="45">材料A(Webライティング・提案14件/受注2件/月24,000円・目標2か月後に月50,000円)。</text>
<rect class="box-good" x="18" y="96" width="684" height="58" rx="6"/>
<text class="t-good" x="34" y="118">① 1回目のメッセージ＝差を計算させ、無い前提を禁じ、難しければ難しいと書かせる</text>
<text class="t-good" x="34" y="137">結果：「到達できません。時間を2.5倍に増やせる場合でも難しい目標」。成功確率は約57%（検算とほぼ一致）</text>
<text class="t-xs" x="360.0" y="176" text-anchor="middle">↓ 同じ会話の中で、追加のメッセージを送る</text>
<rect class="box-accent" x="18" y="196" width="684" height="36" rx="6"/>
<text class="t" x="34" y="218">② 2回目のメッセージ＝「前向きに、達成できる具体的な行動計画を教えてください」とだけ送る</text>
<rect class="box-bad" x="18" y="244" width="684" height="78" rx="6"/>
<text class="t-bad" x="34" y="266">③ 結果＝必要な提案数(35件)・作業時間(45時間)の計算は①と同じまま保たれた</text>
<text class="t-bad" x="34" y="285">ところが結びは「今の受注率のままでも、時間さえ確保できれば届きます」「到達は十分に狙えます」</text>
<text class="t-bad" x="34" y="304">「難しい」「届きません」という言葉は、この回答のどこにも一度も出てこなかった</text>
<rect class="box-accent" x="18" y="334" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="354">受け皿（差を先に計算させる指示）は、計算の手順までは次の指示にも引き継がれなかった。</text>
<text class="t-accent" x="34" y="372">「前向きに」の一言は、同じ会話の中で、別のメッセージとして送っても効いてしまう。</text>
</svg>
