<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334" role="img" aria-label="70%ロイヤリティの価格帯の上限が変わった経緯を時系列で示す図。2026年7月6日までは250円〜1,250円（灰色）。2026年7月7日、Amazonが上限を引き上げ、米国は9.99ドルから12.99ドルに、日本は1,250円から1,650円に変わった（青の強調枠）。2026年11月7日の今回の確認時点では、公式ヘルプは1,650円だが、検索結果には旧い1,250円を書いた記事も混在している（赤）。下の枠には、AIの知識が古いだけなら検索ツールが直してくれそうに見えるが、実際は検索結果の中身自体が新旧混在していることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="334"/>
<text class="t-strong" x="18" y="26">価格帯の上限は4か月前に変わったが、検索結果には旧い数字が残っている</text>
<text class="t-sm" x="18" y="45">2026-07-07の改定を知らない記事・ページが検索結果に混ざり、どちらを拾うかは回によって分かれる。</text>
<rect class="box-quiet" x="18" y="100" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="120">〜2026-07-06</text>
<text class="t" x="34" y="140">70%を選べる価格帯は250円〜1,250円（旧）</text>
<rect class="box-accent" x="18" y="160" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="180">2026-07-07</text>
<text class="t-accent" x="34" y="200">Amazonが上限を引き上げ（米国$9.99→$12.99・日本は1,250円→1,650円）</text>
<rect class="box-bad" x="18" y="220" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="240">2026-11-07（今回の確認時点）</text>
<text class="t-bad" x="34" y="260">公式ヘルプは1,650円。ただし検索結果には旧い1,250円を書いた記事も混在</text>
<rect class="box-good" x="18" y="286" width="684" height="28" rx="6"/>
<text class="t-good" x="34" y="306" style="font-weight:700">⚠️ AIの知識が古いだけなら、検索ツールが直してくれそうに見える。実際は検索結果の中身自体が新旧混在している。</text>
</svg>
