<text class="t" x="18" y="222">Gemini 3.5 Flash-Lite</text>
<text class="t-xs" x="214" y="221" text-anchor="end">入力</text>
<rect class="bar-in" x="250" y="210" width="44.4" height="14" rx="2"/>
<text class="t-sm" x="302.4" y="221">$0.30</text>
<text class="t-xs" x="214" y="240" text-anchor="end">出力</text>
<rect class="bar-out" x="250" y="229" width="370.0" height="14" rx="2"/>
<text class="t-sm" x="628.0" y="240">$2.50</text>
