</style>
<rect class="bg" x="0" y="0" width="720" height="510"/>
<text class="t-strong" x="18" y="26">安い系モデルは、各社の最上位モデルの何十分の1</text>
<text class="t-sm" x="18" y="45">入力＝薄い色 ／ 出力＝濃い色。100万トークンあたりのドル。</text>
<text class="t-sm" x="18" y="64">上下で目盛りの縮尺が違う（下の最上位モデルのほうが値が大きいため）。</text>
