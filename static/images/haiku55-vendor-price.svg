<text class="t" x="18" y="307">Claude Opus 5.5</text>
<text class="t-xs" x="214" y="306" text-anchor="end">入力</text>
<rect class="bar-in" x="250" y="295" width="29.6" height="14" rx="2"/>
<text class="t-sm" x="287.6" y="306">$4.00</text>
<text class="t-xs" x="214" y="325" text-anchor="end">出力</text>
<rect class="bar-out" x="250" y="314" width="148.0" height="14" rx="2"/>
<text class="t-sm" x="406.0" y="325">$20.00</text>
<text class="t" x="18" y="362">GPT-6 Astra</text>
<text class="t-xs" x="214" y="361" text-anchor="end">入力</text>
<rect class="bar-in" x="250" y="350" width="74.0" height="14" rx="2"/>
<text class="t-sm" x="332.0" y="361">$10.00</text>
<text class="t-xs" x="214" y="380" text-anchor="end">出力</text>
<rect class="bar-out" x="250" y="369" width="370.0" height="14" rx="2"/>
