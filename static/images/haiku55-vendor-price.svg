<text class="t" x="18" y="417">Gemini 3.1 Pro Preview</text>
<text class="t-xs" x="214" y="416" text-anchor="end">入力</text>
<rect class="bar-in" x="250" y="405" width="14.8" height="14" rx="2"/>
<text class="t-sm" x="272.8" y="416">$2.00</text>
<text class="t-xs" x="214" y="435" text-anchor="end">出力</text>
<rect class="bar-out" x="250" y="424" width="88.8" height="14" rx="2"/>
<text class="t-sm" x="346.8" y="435">$12.00</text>
<text class="t-xs" x="18" y="480">※ GPT と Gemini は短い入力のときの値段。会社ごとにトークンの数え方が違います。</text>
<text class="t-xs" x="18" y="498">※ 出典: 各社の公式料金ページ（2026年10月8日に確認）。単価が安い＝支払いが安い、ではありません。</text>
