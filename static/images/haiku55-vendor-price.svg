<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-label="安い系モデルと各社の最上位モデルの単価を比べた横棒グラフ。100万トークンあたりのドル。上下で目盛りの縮尺が違う。安い系モデル＝Claude Haiku 5.5は入力0.10ドル・出力0.50ドル、GPT-6 Lunaは入力0.10ドル・出力0.50ドルで両方の4つの単価が完全一致、Gemini 3.5 Flash-Liteは入力0.30ドル・出力2.50ドル。各社の最上位モデル＝Claude Opus 5.5は入力4.00ドル・出力20.00ドル、GPT-6 Astraは入力10.00ドル・出力50.00ドル、Gemini 3.1 Pro Previewは入力2.00ドル・出力12.00ドル（いずれも短い入力のときの値段）。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
