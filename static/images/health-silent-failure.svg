<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="静かな故障の時系列図。自動更新のジョブは毎日成功して緑のままだが、ある日から出力されるデータの日付が止まっている。ジョブの成否だけを見ていると気づけず、更新日を見て初めて分かる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .box-warn { fill: #fdf6e8; stroke: #d4a72c; stroke-width: 1.3; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13.5px; font-weight: 700; }
  .t-bad { fill: #b02020; font-size: 13px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 13px; font-weight: 700; }
  .t-warn { fill: #8a6100; font-size: 12px; }
  .mono { fill: #1f2328; font-size: 13px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .mono-big { fill: #1f2328; font-size: 21px; font-weight: 700; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .mono-sm { fill: #616b76; font-size: 11px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .line { stroke: #8b949e; stroke-width: 1.4; fill: none; }
  .line-quiet { stroke: #d5dae0; stroke-width: 1; fill: none; }
  .head { fill: #8b949e; }
  .bar { fill: #c8d1da; }
  .bar-hot { fill: #d92b2b; }
  .bar-pick { fill: #1a56b8; }
  .dot-ok { fill: #1a7f37; }
  .dot-skip { fill: #d92b2b; }
  .dot-idle { fill: #c8d1da; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .box-warn { fill: #2b2415; stroke: #a68321; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .t-warn { fill: #e0b644; }
    .mono { fill: #e6e9ec; }
    .mono-big { fill: #e6e9ec; }
    .mono-sm { fill: #9aa4ae; }
    .line { stroke: #6e7781; }
    .line-quiet { stroke: #363c43; }
    .head { fill: #6e7781; }
    .bar { fill: #3a424a; }
    .bar-hot { fill: #f07a7a; }
    .bar-pick { fill: #7ab0ff; }
    .dot-ok { fill: #57ab68; }
    .dot-skip { fill: #f07a7a; }
    .dot-idle { fill: #3a424a; }
  }
</style>

<rect class="bg" x="0" y="0" width="720" height="320" rx="8"/>

<text class="t-strong" x="24" y="34">自動化で一番怖いのは、エラーを出さずに壊れること</text>

<text class="t-sm" x="24" y="72">ジョブの結果</text>
<path class="line-quiet" d="M136 92 H688"/>
<circle class="dot-ok" cx="168" cy="92" r="9"/>
<circle class="dot-ok" cx="256" cy="92" r="9"/>
<circle class="dot-ok" cx="344" cy="92" r="9"/>
<circle class="dot-ok" cx="432" cy="92" r="9"/>
<circle class="dot-ok" cx="520" cy="92" r="9"/>
<circle class="dot-ok" cx="608" cy="92" r="9"/>
<text class="t-good" x="136" y="118">ぜんぶ成功。緑のチェックマークが並ぶ</text>

<text class="t-sm" x="24" y="164">出てくるデータ</text>
<path class="line-quiet" d="M136 184 H688"/>
<circle class="dot-ok" cx="168" cy="184" r="9"/>
<circle class="dot-ok" cx="256" cy="184" r="9"/>
<circle class="dot-skip" cx="344" cy="184" r="9"/>
<circle class="dot-skip" cx="432" cy="184" r="9"/>
<circle class="dot-skip" cx="520" cy="184" r="9"/>
<circle class="dot-skip" cx="608" cy="184" r="9"/>
<text class="mono-sm" x="150" y="208">8/1</text>
<text class="mono-sm" x="238" y="208">8/2</text>
<text class="mono-sm" x="326" y="208">8/2</text>
<text class="mono-sm" x="414" y="208">8/2</text>
<text class="mono-sm" x="502" y="208">8/2</text>
<text class="mono-sm" x="590" y="208">8/2</text>
<text class="t-bad" x="326" y="230">ここから日付が止まっている（エラーは1件も出ていない）</text>

<rect class="box-bad" x="24" y="250" width="330" height="58" rx="7"/>
<text class="t-bad" x="42" y="274">ジョブの成否だけを見る</text>
<text class="t-sm" x="42" y="296">→ 何ヶ月でも気づけない</text>

<rect class="box-good" x="372" y="250" width="324" height="58" rx="7"/>
<text class="t-good" x="390" y="274">出てきたものの更新日を見る</text>
<text class="t-sm" x="390" y="296">→ 翌日には分かる</text>
</svg>
