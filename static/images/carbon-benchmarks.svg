<svg xmlns="http://www.w3.org/2000/svg" width="720" height="318" viewBox="0 0 720 318" role="img" aria-label="Gemini 4 Carbonの発表ページが挙げた点数4つを並べた横棒グラフ。Artificial Analysis Intelligence Index v5.0（総合的な知能の指標）は59で1位、SEC-bench Pro（セキュリティ脆弱性の発見）は88.2%で最高水準、ExploitGym（見つけた脆弱性の悪用実証）は54.8%で新記録、CWE-bench（Collinear運営・脆弱性の修復パッチ作成）は71.0%。いずれもGoogle自身の測定で、他社モデルを同じ条件で測った数字は発表に無い。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="318"/>
<text class="t-strong" x="18" y="26">発表ページが挙げた点数は、どれもGoogle自身の測定</text>
<text class="t-sm" x="18" y="45">目盛りは0〜100で揃えているが、テストの中身も対象も別々で平均は取れない。</text>
<text class="t-sm" x="18" y="64">他社モデルを同じ条件で測った数字は発表に無い。単価以外の「どちらが賢いか」は比較できない。</text>
<text class="t" x="18" y="115">Artificial Analysis Intelligence Index v5.0（総合・1位）</text>
<rect class="bar-new" x="272" y="100" width="205.3" height="20" rx="3"/>
<text class="t-sm" x="485.3" y="115">59</text>
<text class="t-xs" x="18" y="132">総合的な知能の指標</text>
<text class="t" x="18" y="159">SEC-bench Pro（最高水準）</text>
<rect class="bar-new" x="272" y="144" width="306.9" height="20" rx="3"/>
<text class="t-sm" x="586.9" y="159">88.2</text>
<text class="t-xs" x="18" y="176">セキュリティ脆弱性の発見</text>
<text class="t" x="18" y="203">ExploitGym（新記録）</text>
<rect class="bar-new" x="272" y="188" width="190.7" height="20" rx="3"/>
<text class="t-sm" x="470.7" y="203">54.8</text>
<text class="t-xs" x="18" y="220">見つけた脆弱性の悪用実証</text>
<text class="t" x="18" y="247">CWE-bench（Collinear運営）</text>
<rect class="bar-new" x="272" y="232" width="247.1" height="20" rx="3"/>
<text class="t-sm" x="527.1" y="247">71</text>
<text class="t-xs" x="18" y="264">脆弱性の修復パッチ作成</text>
<text class="t-xs" x="18" y="294">※ Intelligence Indexは0〜100の指標値。他の3項目は％。出典: Carbon発表ページ（2026年10月28日）。</text>
<text class="t-bad" x="18" y="310">※ 比較相手（他社・前のモデル）の同条件の点数は発表に無い。鵜呑みにしない。</text>
</svg>
