<svg xmlns="http://www.w3.org/2000/svg" width="720" height="333" viewBox="0 0 720 333" role="img" aria-label="Haiku 4.5・GPT-6 Luna・Haiku 5.5 の点数を比べた横棒グラフ。OSWorld 2.1（オフラインsubset）はHaiku 4.5が15.7％、GPT-6 Lunaが48.9％、Haiku 5.5が72.4％。Terminal-Bench 4.0はHaiku 4.5が0.0％、GPT-6 Lunaが16.4％、Haiku 5.5が39.2％。Chartography（道具なし）はHaiku 4.5が6.4％、GPT-6 Lunaが29.1％、Haiku 5.5が46.4％。いずれもHaiku 5.5が最大の設定（max）で3モデル中もっとも高い。">
<style>
