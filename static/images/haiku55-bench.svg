</style>
<rect class="bg" x="0" y="0" width="720" height="333"/>
<text class="t-strong" x="18" y="26">Haiku 5.5 は Haiku 4.5 だけでなく GPT-6 Luna も上回る</text>
<text class="t-sm" x="18" y="45">灰＝Haiku 4.5、薄い青＝GPT-6 Luna、濃い青＝Haiku 5.5。目盛りは0〜100％。</text>
<text class="t-sm" x="18" y="64">3モデルとも値がある項目だけを選んだ（最大の設定 max の点数）。</text>
