<svg xmlns="http://www.w3.org/2000/svg" width="720" height="308" viewBox="0 0 720 308" role="img" aria-label="値の近い2つの範囲（I・K）を含む4件（I・J・K・L）の文字単価を横棒グラフで示す図。Iは700〜900字・1,350円で1.50円から1.93円の範囲、Jは600字・1,020円で1.70円の単一値、Kは1,000〜1,300字・1,820円で1.40円から1.82円の範囲、Lは500字・900円で1.80円の単一値。IとKの範囲は値が重なるほど近いが、1.2円から2.0円の軸の上でそれぞれ区別して示されている。下の枠には、IとKは値が近いが3回とも取り違えなかったこと、並べる順番を変えた2回も含め4件は5回とも正しい値に分かれたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="308"/>
<text class="t-strong" x="18" y="26">値の近い2つの範囲（I・K）を混ぜても、4件は分かれたまま</text>
<text class="t-sm" x="18" y="45">材料M。1.4円〜1.93円の狭い帯に、範囲2件・単一値2件を同時に渡した（3回・計算は全部一致）。</text>
<text class="t-xs" x="230.0" y="86">1.2円</text>
<text class="t-xs" x="636.0" y="86">2.0円</text>
<text class="t" x="18" y="113">I（700〜900字・1,350円）</text>
<rect class="bar-new" x="381.8" y="100" width="217.5" height="18" rx="3"/>
<text class="t-sm" x="607.3" y="113.0">1.5〜1.93円</text>
<text class="t" x="18" y="147">J（600字・1,020円）</text>
<rect class="bar-new" x="482.9" y="134" width="10.1" height="18" rx="3"/>
<text class="t-sm" x="501.1" y="147.0">1.7円</text>
<text class="t" x="18" y="181">K（1,000〜1,300字・1,820円）</text>
<rect class="bar-new" x="331.2" y="168" width="212.5" height="18" rx="3"/>
<text class="t-sm" x="551.6" y="181.0">1.4〜1.82円</text>
<text class="t" x="18" y="215">L（500字・900円）</text>
<rect class="bar-new" x="533.5" y="202" width="10.1" height="18" rx="3"/>
<text class="t-sm" x="551.6" y="215.0">1.8円</text>
<rect class="box-accent" x="18" y="242" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="262">I（1.50〜1.93円）とK（1.40〜1.82円）は値が重なるほど近いが、3回とも取り違えなかった。</text>
<text class="t-accent" x="34" y="280">並べる順番を変えた2回も含め、I・J・K・Lの4件は5回とも正しい値に分かれた。</text>
</svg>
