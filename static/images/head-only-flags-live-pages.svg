<svg xmlns="http://www.w3.org/2000/svg" width="720" height="292" viewBox="0 0 720 292" role="img" aria-label="HEADだけ渡して素朴に聞く・HEADだけ渡して確定できないと言い添える・HEADとGETの両方を渡す、の3つの渡し方で、本当は生きている4本（HEADは404だがGETは200）を「切れている」に含めてしまった件数を比べた横棒グラフ。架空のリンク一覧2本（各20本）に材料2本×各2回＝4回ずつ試した。HEADだけ渡して素朴に聞いた場合は4回とも4本とも混入した。HEADだけ渡しつつ確定できないと言い添えた場合は4回とも混入せず、404や403のリンクを切れているとは断定せず保留の扱いに分けた。HEADとGETの両方を渡した場合も4回とも混入しなかった。ボット判定の可能性がある403の4本は、どの版でも「切れている」には入らず、4回とも要確認や保留の扱いに分けられた。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="292"/>
<text class="t-strong" x="18" y="24">HEADだけで判定すると、生きている4件が4回とも「切れている」に混入する</text>
<text class="t-sm" x="18" y="43">架空のリンク一覧2本（各20本）に、3つの渡し方を材料2本×各2回＝4回ずつ試した。</text>
<text class="t-sm" x="18" y="62">縦軸は、HEADは404だがGETは200の生きている4本を「切れている」に含めた件数（真値0）。</text>
<text class="t-xs" x="18" y="81">①はHEADの応答コードのみを渡した版。②も同じデータだが「確定できない」と言い添えた版。</text>
<text class="t-xs" x="18" y="100">③はHEADとGETの両方を渡した版（数字の基準は指示していない）。</text>
<text class="t" x="18" y="133">① HEADだけ渡して素朴に聞く</text>
<rect class="box-bad" x="330.0" y="122" width="300.0" height="16" rx="3"/>
<text class="t-bad" x="642.0" y="133">4/4回とも混入</text>
<text class="t" x="18" y="163">② HEADだけ+「確定できない」と保留</text>
<rect class="box-quiet" x="330.0" y="152" width="3.0" height="16" rx="3"/>
<text class="t-good" x="642.0" y="163">4回とも保留</text>
<text class="t" x="18" y="193">③ HEADとGETの両方を渡す</text>
<rect class="box-quiet" x="330.0" y="182" width="3.0" height="16" rx="3"/>
<text class="t-good" x="642.0" y="193">4回とも0件</text>
<path class="line" d="M330.0 114 L330.0 196" stroke-dasharray="4 3"/>
<rect class="box-accent" x="18" y="228" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="248">⚠️ 403（ボット判定の可能性）の4本は、①〜③のどの版でも「切れている」には入らず、</text>
<text class="t-accent" x="34" y="266">4回とも「要確認」「判断を保留すべきもの」に分けられた。</text>
</svg>
