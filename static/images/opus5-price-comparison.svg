<text class="t-xs" x="110" y="184">入力</text>
<text class="t-xs" x="110" y="204">出力</text>
<text class="t" x="18" y="239">GPT-5.6-terra</text>
<rect class="bar-in" x="168" y="227" width="18.7" height="15" rx="2"/>
<text class="t-sm" x="194.7" y="239">$2</text>
<rect class="bar-out" x="168" y="247" width="112.3" height="15" rx="2"/>
