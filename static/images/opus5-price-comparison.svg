<text class="t-sm" x="194.7" y="294">$2</text>
<rect class="bar-out" x="168" y="302" width="112.3" height="15" rx="2"/>
<text class="t-sm" x="288.3" y="314">$12</text>
<text class="t-xs" x="110" y="294">入力</text>
<text class="t-xs" x="110" y="314">出力</text>
<text class="t-xs" x="18" y="359">※ 単価が安い＝支払いが安い、ではありません。会社ごとにトークンの数え方が違います。</text>
