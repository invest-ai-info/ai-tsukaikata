<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-label="単一税率と税率2種混在のとき、税率ごとの消費税額がどれだけ残るかを比べる図。上段＝単一税率（10%のみ）で頼んだとき、「代金55万円（税込）」とだけ渡すと、3回中2回は税込の合計額だけで完結し、税率ごとの消費税額を省略した。下段＝税率が2種類（10%・8%）混ざるとき、合計額を出すには税率ごとに分けて計算する必要があり、3回とも税率ごとの内訳（税抜金額・消費税額）がそのまま出力に残った。どちらも登録番号を渡さない同じ条件で、税率の数だけを変えた2つの依頼。下の枠には、単一税率は合計額を書けば用が足りるため内訳を書く動機が弱くなること、税率が混ざると合算のために内訳をいったん経由する必要がありその過程がそのまま出力に残ることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="370"/>
<text class="t-strong" x="18" y="26">内訳を「経由しないと答えが出ない」ときだけ、内訳が残る</text>
<text class="t-sm" x="18" y="45">登録番号を渡さない同じ条件で、税率の数だけを変えた2つの依頼。</text>
<text class="t-sm" x="18" y="64">どちらも「請求書を作ってください」という同じ頼み方。</text>
<rect class="box" x="18" y="112" width="684" height="82" rx="6"/>
<text class="t-strong" x="34" y="134">単一税率（10%のみ）で頼んだとき</text>
<text class="t" x="34" y="154">「代金55万円（税込）」とだけ渡すと、3回中2回は税込の合計額だけで完結し、税率ごとの消費税額を省略した</text>
<rect class="box-good" x="18" y="204" width="684" height="82" rx="6"/>
<text class="t-strong" x="34" y="226">税率が2種類（10%・8%）混ざるとき</text>
<text class="t-good" x="34" y="246">合計額を出すには税率ごとに分けて計算する必要があり、3回とも税率ごとの内訳</text>
<text class="t-good" x="34" y="264">（税抜金額・消費税額）がそのまま出力に残った</text>
<rect class="box-accent" x="18" y="302" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="322">単一税率は「合計額」を書けば用が足りるため、内訳を書く動機が弱くなる。</text>
<text class="t-accent" x="34" y="340">税率が混ざると、合算のために内訳をいったん経由する必要があり、その過程がそのまま出力に残る。</text>
</svg>
