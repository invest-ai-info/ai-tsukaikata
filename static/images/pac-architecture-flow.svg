<svg xmlns="http://www.w3.org/2000/svg" width="720" height="282" viewBox="0 0 720 282" role="img" aria-label="利用者の端末からセキュアエンクレーブを経て暗号化された保管庫に至る、Googleの説明を図にしたもの。利用者の端末は暗号の鍵をここだけに保管しGoogleのサーバーには渡さない。暗号化した通信でセキュアエンクレーブ（クラウド側・隔離された領域）に接続し、処理中だけ一時的に復号する。終わったらすぐ再暗号化して、暗号化された保管庫に保存する。鍵が無いと中身は読めない。下の枠には、独立監査の結果と技術文書の更新も公開したとGoogleが書いていること、ただしその技術文書（PDF）はこの記事を書いた環境からは経路遮断で開けず、監査の中身は発表ページの説明の範囲でしか確認できていないことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="282"/>
<text class="t-strong" x="18" y="26">鍵は端末側だけが持ち、クラウドは復号したままでは保存しない</text>
<text class="t-sm" x="18" y="45">発表ページの説明を図にした。Googleは「Googleを含め第三者はアクセスできない」と書いている。</text>
<rect class="box-quiet" x="18" y="96" width="210" height="88" rx="6"/>
<text class="t-strong" x="28" y="118">利用者の端末</text>
<text class="t-xs" x="28" y="138">暗号の鍵はここだけに保管</text>
<text class="t-xs" x="28" y="154">Googleのサーバーには渡さない</text>
<rect class="box-accent" x="252" y="96" width="210" height="88" rx="6"/>
<text class="t-strong" x="262" y="118">セキュアエンクレーブ</text>
<text class="t-xs" x="262" y="138">（クラウド側・隔離された領域）</text>
<text class="t-xs" x="262" y="154">処理中だけ一時的に復号</text>
<rect class="box" x="486" y="96" width="216" height="88" rx="6"/>
<text class="t-strong" x="496" y="118">暗号化された保管庫</text>
<text class="t-xs" x="496" y="138">終わったらすぐ再暗号化</text>
<text class="t-xs" x="496" y="154">鍵が無いと中身は読めない</text>
<line class="line" x1="230" y1="140" x2="248" y2="140"/>
<polygon class="bar-out" points="248,135 256,140 248,145"/>
<text class="t-xs" x="200" y="90">暗号化した通信</text>
<line class="line" x1="464" y1="140" x2="482" y2="140"/>
<polygon class="bar-out" points="482,135 490,140 482,145"/>
<text class="t-xs" x="440" y="90">再暗号化して保存</text>
<rect class="box-accent" x="18" y="204" width="684" height="62" rx="6"/>
<text class="t-accent" x="34" y="226">「独立監査の結果」と技術文書の更新も公開したとGoogleは書いている。</text>
<text class="t-xs" x="34" y="246">ただしその技術文書（PDF）は、この記事を書いた環境からは開けなかった</text>
<text class="t-xs" x="34" y="262">（経路遮断。監査の中身は発表ページに書かれた説明の範囲でしか確認できていない）。</text>
</svg>
