<rect class="bg" x="0" y="0" width="720" height="393"/>
<text class="t-strong" x="18" y="26">1つの契約書の中だけで矛盾していても、結論として最初に示す基準は割れた</text>
<text class="t-sm" x="18" y="45">架空の基本契約書2本（それぞれ1つの文書）に、支払基準を2つ仕込んだ。</text>
<text class="t-sm" x="18" y="64">「支払条件」条項（検収完了基準）と「特記事項」（納品日基準）が食い違う。</text>
<text class="t-sm" x="18" y="83">「入金予定日はいつですか」と素朴に聞いた回（材料2本×各3回＝6回）。</text>
<text class="t-sm" x="18" y="102">同じ2本に、「特記事項の基準だけを」と起点を名指しした回（各1回）も試した。</text>
<text class="t-xs" x="18" y="126">結論として最初に示した基準の日付</text>
<text class="t-xs" x="175.0" y="168">材料A・1回目</text>
<text class="t-xs" x="265.0" y="168">材料A・2回目</text>
<text class="t-xs" x="355.0" y="168">材料A・3回目</text>
<text class="t-xs" x="445.0" y="168">材料B・1回目</text>
<text class="t-xs" x="535.0" y="168">材料B・2回目</text>
<text class="t-xs" x="625.0" y="168">材料B・3回目</text>
<text class="t-sm" x="18" y="200">素朴に聞く（6回）</text>
<rect class="box-accent" x="160" y="180" width="82" height="32" rx="4"/>
<text class="t-accent" x="173.0" y="200">11/20</text>
<rect class="box-bad" x="250" y="180" width="82" height="32" rx="4"/>
<text class="t-bad" x="263.0" y="200">11/26</text>
<rect class="box-quiet" x="340" y="180" width="82" height="32" rx="4"/>
<text class="t-sm" x="369.8" y="200">両方</text>
<rect class="box-accent" x="430" y="180" width="82" height="32" rx="4"/>
<text class="t-accent" x="443.0" y="200">11/23</text>
<rect class="box-bad" x="520" y="180" width="82" height="32" rx="4"/>
<text class="t-bad" x="538.6" y="200">12/1</text>
<rect class="box-quiet" x="610" y="180" width="82" height="32" rx="4"/>
<text class="t-sm" x="639.8" y="200">両方</text>
<text class="t-sm" x="18" y="240">起点を名指し（2回）</text>
<rect class="box-good" x="160" y="220" width="262" height="32" rx="4"/>
<text class="t-good" x="263.0" y="240">11/26</text>
<rect class="box-good" x="430" y="220" width="262" height="32" rx="4"/>
<text class="t-good" x="538.6" y="240">12/1</text>
<text class="t-xs" x="18" y="293">※ 素朴に聞いた回は、6回とも2つの条項の基準が違うこと自体には触れていた。</text>
<text class="t-xs" x="18" y="314">内訳＝11/20系が先頭2回・11/26系が先頭2回・両方を対等に挙げて未定が2回。</text>
<text class="t-xs" x="18" y="335">※ 起点を名指しした回は、結論の日付が2回とも指定どおり特記事項の基準に揃った</text>
<text class="t-xs" x="18" y="356">（2回中1回は、使わないよう頼んだ支払条件条項の基準を補足として書き足した）。</text>
<text class="t-xs" x="18" y="377">架空データでの実測。生の返り8回は docs/evidence/ に全文置いてある。</text>
</svg>
