<svg xmlns="http://www.w3.org/2000/svg" width="720" height="393" viewBox="0 0 720 393" role="img" aria-label="1つの契約書の中に支払条件条項（検収完了基準）と特記事項（納品日基準）という別々の支払基準を仕込んだ架空の契約書2本に、素朴に「入金予定日はいつですか」と聞いた回（材料2本×各3回）で、結論として最初に示した日付を並べたマス目。材料Aは1回目が11/20（検収完了基準）、2回目が11/26（特記事項基準）、3回目が両方を対等に挙げて未定。材料Bは1回目が11/23、2回目が12/1、3回目が両方で未定。下の行には、起点を名指しして「特記事項の基準だけを使ってください」と聞いた回（材料2本×各1回）は、結論の日付が2回とも指定どおり特記事項の基準（材料Aは11/26・材料Bは12/1）に揃ったことが書かれている。">
<style>
