<svg xmlns="http://www.w3.org/2000/svg" width="720" height="328" viewBox="0 0 720 328" role="img" aria-label="窓の長さ（2週間ぶんと8週間ぶん）を比べたときの「ふだんの目安」の動いた幅を、もとの目安に対する割合で2本の横棒で比べた図。この記事の増減の無い記録は、真値が5.00件から5.29件/日までしか動かず、動いた幅は約6%。前作の増加傾向のある記録は、真値が4.5件から6.1件/日まで動き、動いた幅は約36%で約6倍の差がある。下の枠には、フラットな記録の動いた幅は約6%、増加傾向のある記録は約36%で約6倍の差があること、動いたのは計算の正確さではなく材料に増減の傾向があるかどうかだけであることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="328"/>
<text class="t-strong" x="18" y="24">動いた幅を比べると、フラットな記録は約1/6にしかならない</text>
<text class="t-sm" x="18" y="43">「2週間ぶんだけ渡した目安」と「8週間（全部）渡した目安」の差を、もとの8週間目安に対する割合（%）で比べた。</text>
<text class="t-sm" x="18" y="62">本記事の材料Aと、前作（増加傾向のある材料A）の、それぞれの真値（単純平均）から算出。</text>
<text class="t-xs" x="18" y="81">低いほど、窓の長さを気にせず計算できることを示す。</text>
<text class="t-xs" x="590.0" y="124">動いた幅（%）</text>
<text class="t" x="18" y="156">フラットな記録（この記事・材料A）</text>
<rect class="box-quiet" x="320.0" y="142" width="280.0" height="20" rx="3"/>
<rect class="bar-new" x="320.0" y="142" width="40.0" height="20" rx="3"/>
<text class="t-accent" x="614.0" y="156" style="font-weight:700">約6%</text>
<text class="t-xs" x="18" y="172">増減が無いので、2週も8週もほぼ同じ</text>
<text class="t" x="18" y="204">増加傾向のある記録（前作の材料A）</text>
<rect class="box-quiet" x="320.0" y="190" width="280.0" height="20" rx="3"/>
<rect class="box-bad" x="320.0" y="190" width="248.9" height="20" rx="3"/>
<text class="t-bad" x="614.0" y="204" style="font-weight:700">約36%</text>
<text class="t-xs" x="18" y="220">古い週を含めるほど目安が下がる</text>
<rect class="box-accent" x="18" y="242" width="684" height="66" rx="6"/>
<text class="t-accent" x="34" y="262">フラットな記録（この記事）: 真値5.00件→5.29件/日。動いた幅は約6%。</text>
<text class="t-accent" x="34" y="280">増加傾向のある記録（前作）: 真値4.5件→6.1件/日。動いた幅は約36%で、約6倍の差。</text>
<text class="t-accent" x="34" y="298">動いたのは計算の正確さではなく、材料に増減の傾向があるかどうかだけ。</text>
</svg>
