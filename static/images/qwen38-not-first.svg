<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-label="Qwen がモデルカードに載せた比較表で、Qwen3.8-Max が最高値だった項目の数を示した図。30項目のうち7項目で最高、残り23項目は他社のほうが上だった。上だった例として、SWE-bench Pro は Qwen3.8-Max の67.7に対し Claude Fable 5 が80.0、DeepSWE 1.1 は56.6に対し GPT-5.6 Sol が73.0、FrontierSWE は73.5に対し Claude Fable 5 が88.8、HLE は43.6に対し Claude Fable 5 が53.3、GPQA Diamond は92.6に対し GPT-5.6 Sol が94.1。表を作ったのは Qwen であり、相手の会社が同じ条件で測った値ではない。">
