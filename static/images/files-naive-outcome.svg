<svg xmlns="http://www.w3.org/2000/svg" width="720" height="324" viewBox="0 0 720 324" role="img" aria-label="「このファイル一覧を整理してください」とだけ頼んだときに、45件のファイルがどこへ行ったかを示した図。移動先が示されたものが22件、削除を提案されたものが14件、名前が一度も出てこなかったものが9件。移動先が示された22件だけを見ていると、全部さばけたように読める。削除を提案された14件のうち、名前だけで確実に判定できるのは3件で、残り11件は名前からの推測にすぎない。名前が出てこなかった9件は、スクリーンショット5点、などという書き方に丸められて一覧から消えた。提案の中に5点と書いてあるので、読んでも抜けたことに気づけない。また削除を提案された14件には、更新日時では最も新しいファイルが含まれていた。名前についている最終_確定という語を信じたため。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="324"/>
<text class="t-strong" x="18" y="26">「このファイル一覧を整理してください」だけで頼んだとき、45件はどこへ行ったか</text>
<text class="t-sm" x="18" y="45">架空の散らかったフォルダ45件。返ってきた提案に名前がそのまま出たかを機械で数えた。</text>
<text class="t-xs" x="18" y="74">45件の内訳</text>
<rect class="bar-in" x="18" y="84" width="326" height="34" rx="3"/>
<text class="t-xs" x="28" y="106">22件</text>
<rect class="bar-old" x="344" y="84" width="207" height="34" rx="3"/>
<text class="t-xs" x="354" y="106">14件</text>
<rect class="box-bad" x="551" y="84" width="133" height="34" rx="3"/>
<text class="t-xs" x="561" y="106">9件</text>
<rect class="box-accent" x="18" y="152" width="666" height="30" rx="6"/>
<text class="t" x="30" y="172">移動先が示された　22件</text>
<text class="t-xs" x="286" y="172">この22件だけを見ていると、全部さばけたように読める</text>
<rect class="box-quiet" x="18" y="192" width="666" height="30" rx="6"/>
<text class="t-sm" x="30" y="212">削除を提案された　14件</text>
<text class="t-xs" x="286" y="212">うち名前だけで確実に判定できるのは3件。残り11件は名前からの推測</text>
<rect class="box-bad" x="18" y="232" width="666" height="30" rx="6"/>
<text class="t-bad" x="30" y="252">名前が一度も出てこない　9件</text>
<text class="t-xs" x="286" y="252">「スクリーンショット5点」「など」に丸められて、一覧から消えた</text>
<text class="t-xs" x="18" y="292">※ いちばん下の9件が問題。提案の中に「5点」と書いてあるので、読んでも抜けたことに気づけない。</text>
<text class="t-xs" x="18" y="310">※ 削除を提案された14件には、更新日時では最も新しいファイルが含まれていた（名前の「最終_確定」を信じたため）。</text>
</svg>
