<svg xmlns="http://www.w3.org/2000/svg" width="720" height="479" viewBox="0 0 720 479" role="img" aria-label="PREP法（結論→理由→具体例→結論）を指定すると、資料に無い内容を作るかを試した図。送料改定のお知らせ（理由は書かれていない）では、PREP法指定・型指定なしのどちらも3/3が理由を捏造した。受付時間変更のお知らせでは、型指定なしは0/3で理由に触れなかったが、PREP法を指定すると3/3が理由を作り出した。さらに受付時間変更では、PREP法の「具体例」欄が変更前の時刻を3/3捏造し、しかも18時・17時・9時と回ごとに数字が食い違った。型指定なしでは変更前の時刻を書いた回は1/3にとどまった。PREP法の指示に「書かれていない情報は補わないで」という一文を足すと、理由の捏造・変更前の捏造とも0/3に戻った。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="479"/>
<text class="t-strong" x="18" y="26">「理由」の捏造は型と無関係。「変更前」の捏造はPREP法で起きた</text>
<text class="t-sm" x="18" y="45">資料には無い「理由」を書いた回数（架空のお知らせ2本・各条件3回）。送料改定は型を指定しなくても3/3捏造した。</text>
<text class="t-sm" x="18" y="64">受付時間変更だけは、型を指定しない回は0/3で理由に触れず、PREP法を指定すると3/3が理由を作り出した。</text>
<text class="t-xs" x="190.0" y="120">PREP法指定</text>
<text class="t-xs" x="340.0" y="120">型指定なし</text>
<text class="t-xs" x="490.0" y="120">＋禁止の一文</text>
<text class="t-sm" x="18" y="153">送料改定（材料A）</text>
<rect class="box-bad" x="190" y="132" width="140" height="32" rx="4"/>
<text class="t-bad" x="243.2" y="153">3/3</text>
<rect class="box-bad" x="340" y="132" width="140" height="32" rx="4"/>
<text class="t-bad" x="393.2" y="153">3/3</text>
<rect class="box-good" x="490" y="132" width="140" height="32" rx="4"/>
<text class="t-good" x="543.2" y="153">0/3</text>
<text class="t-sm" x="18" y="195">受付時間変更（材料B）</text>
<rect class="box-bad" x="190" y="174" width="140" height="32" rx="4"/>
<text class="t-bad" x="243.2" y="195">3/3</text>
<rect class="box-good" x="340" y="174" width="140" height="32" rx="4"/>
<text class="t-good" x="393.2" y="195">0/3</text>
<rect class="box-good" x="490" y="174" width="140" height="32" rx="4"/>
<text class="t-good" x="543.2" y="195">0/3</text>
<text class="t-strong" x="18" y="242">「変更前の受付時間」の捏造（材料Bのみ・書いた数字は回ごとに食い違った）</text>
<text class="t-sm" x="18" y="298">PREP法指定</text>
<rect class="box-bad" x="190" y="278" width="140" height="30" rx="4"/>
<text class="t-bad" x="243.2" y="298">3/3</text>
<text class="t-sm" x="18" y="336">型指定なし</text>
<rect class="box-bad" x="190" y="316" width="140" height="30" rx="4"/>
<text class="t-bad" x="243.2" y="336">1/3</text>
<text class="t-sm" x="18" y="374">＋禁止の一文</text>
<rect class="box-good" x="190" y="354" width="140" height="30" rx="4"/>
<text class="t-good" x="243.2" y="374">0/3</text>
<text class="t-xs" x="18" y="423">※PREP法の「変更前」は回ごとに18時・17時・9時と食い違い、どれも資料に書いていない。</text>
<text class="t-xs" x="18" y="444">※「＋禁止の一文」＝PREP法の指示に「書かれていない情報は補わないで」を足した条件。</text>
<text class="t-xs" x="18" y="465">架空データでの実測（計18回）。生の返りは docs/evidence/ に全文置いてある。</text>
</svg>
