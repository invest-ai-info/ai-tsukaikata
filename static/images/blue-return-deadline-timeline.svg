<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="4つの開業プロフィールで、青色申告承認申請書の提出期限と実際の提出日の関係を示す図。②開業2026-04-01・申請書は提出していない場合は、期限2026-06-01(月)があっても提出自体がないため2026年分は白色申告(赤)。③開業2026-04-01・申請書2026-04-01提出は期限より前なので2026年分から青色申告OK(緑)。④開業2026-04-01・申請書2026-07-01提出は期限2026-06-01(月)を過ぎているため2026年分は白色、2027年分から(赤)。⑤開業2026-01-10(1月16日より前)・申請書2026-03-12提出は特例で期限が2026-03-16(月)になるため2026年分から青色申告OK(緑)。上部の注記には、開業日が1月16日以後なら開業日から2か月以内、1月16日より前ならその年の3月15日までが期限であること、2026-05-31と2026-03-15はどちらも日曜日のため翌営業日まで期限が延びること、AIは12回中12回この2種類の期限ルールと曜日のずれを正しく適用したことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="360"/>
<text class="t-strong" x="18" y="26">提出期限と提出日の関係で、青色申告が使えるかが決まる</text>
<text class="t-sm" x="18" y="45">開業日が1月16日以後なら「開業日から2か月以内」、1月16日より前なら「その年の3月15日まで」が期限。</text>
<text class="t-sm" x="18" y="64">2026-05-31と2026-03-15はどちらも日曜日のため、翌営業日(月曜)まで期限が延びる。</text>
<text class="t-xs" x="18" y="83">AIは12回中12回、この2種類の期限ルールと曜日のずれを正しく適用した(docs/evidenceで検算済み)。</text>
<rect class="box-bad" x="18" y="112" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="132">②開業2026-04-01・申請書は提出していない</text>
<text class="t-bad" x="34" y="152">期限2026-06-01(月)はあっても、提出自体がない→2026年分は白色申告</text>
<rect class="box-good" x="18" y="172" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="192">③開業2026-04-01・申請書2026-04-01提出</text>
<text class="t-good" x="34" y="212">期限2026-06-01(月)より前→2026年分から青色申告OK</text>
<rect class="box-bad" x="18" y="232" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="252">④開業2026-04-01・申請書2026-07-01提出</text>
<text class="t-bad" x="34" y="272">期限2026-06-01(月)を過ぎている→2026年分は白色、2027年分から</text>
<rect class="box-good" x="18" y="292" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="312">⑤開業2026-01-10(1月16日より前)・申請書2026-03-12提出</text>
<text class="t-good" x="34" y="332">特例で期限は2026-03-16(月)→2026年分から青色申告OK</text>
</svg>
