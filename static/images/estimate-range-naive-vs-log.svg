<svg xmlns="http://www.w3.org/2000/svg" width="720" height="442" viewBox="0 0 720 442" role="img" aria-label="同じ案件の見積もりを、記録を渡さずに聞いた3回と、自分の作業記録を貼って聞いた3回で比べた図。渡さない3回は10〜16時間・12〜16時間・10〜13時間とばらつき、記録を貼った3回は670〜765分・660〜770分・665〜755分にそろった。記録に実際に残っている2本の合計675分と725分は、貼った3回の帯の内側にある。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="442"/>
<text class="t-strong" x="18" y="26">同じ仕事の見積もり。聞いただけだと 10〜16時間、記録を貼ると 11.0〜12.8時間</text>
<text class="t-sm" x="18" y="45">架空の案件1件（5,000字・未経験の分野）に、同じ指示文を3回ずつ通した実測。</text>
<text class="t-sm" x="18" y="64">帯は、返ってきた合計そのまま。縦の点線は、記録に実際に残っている2本の合計。</text>
<text class="t-xs" x="392.7" y="110">← 実際にかかった2本（675分・725分）</text>
<path class="line" d="M330.6 116 L330.6 322" stroke-dasharray="4 3"/>
<path class="line" d="M382.7 116 L382.7 322" stroke-dasharray="4 3"/>
<text class="t-accent" x="18" y="132">記録を渡さずに聞いた（3回）</text>
<text class="t-sm" x="18" y="158">1回目　10〜16時間</text>
<rect class="bar-old" x="252.5" y="145" width="375.0" height="18" rx="3"/>
<text class="t-sm" x="18" y="184">2回目　12〜16時間</text>
<rect class="bar-old" x="377.5" y="171" width="250.0" height="18" rx="3"/>
<text class="t-sm" x="18" y="210">3回目　10〜13時間</text>
<rect class="bar-old" x="252.5" y="197" width="187.5" height="18" rx="3"/>
<text class="t-accent" x="18" y="236">自分の作業記録を貼った（3回）</text>
<text class="t-sm" x="18" y="262">1回目　670〜765分</text>
<rect class="bar-new" x="325.4" y="249" width="99.0" height="18" rx="3"/>
<text class="t-sm" x="18" y="288">2回目　660〜770分</text>
<rect class="bar-new" x="315.0" y="275" width="114.6" height="18" rx="3"/>
<text class="t-sm" x="18" y="314">3回目　665〜755分</text>
<rect class="bar-new" x="320.2" y="301" width="93.8" height="18" rx="3"/>
<path class="line" d="M190 334 L690.0 334"/>
<path class="line" d="M252.5 334 L252.5 339"/>
<text class="t-xs" x="236.5" y="354">10時間</text>
<path class="line" d="M377.5 334 L377.5 339"/>
<text class="t-xs" x="361.5" y="354">12時間</text>
<path class="line" d="M502.5 334 L502.5 339"/>
<text class="t-xs" x="486.5" y="354">14時間</text>
<path class="line" d="M627.5 334 L627.5 339"/>
<text class="t-xs" x="611.5" y="354">16時間</text>
<text class="t-xs" x="18" y="382">※ 3回を合わせた開きは 6.00時間 と 1.83時間。記録を貼ると 3.27倍せまくなった。</text>
<text class="t-bad" x="18" y="404">※ 上の3回は、何をもとにした数字かが1行も書かれていない。聞き直すと3回とも「推測です」と返る。</text>
<text class="t-xs" x="18" y="426">架空データでの実測。指示文ごとの生の返りは docs/evidence/ に置いてある。</text>
</svg>
