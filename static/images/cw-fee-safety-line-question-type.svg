<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="質問の種類ごとに、逃げ道の一文の効き目を比べたグループ横棒グラフ。範囲を聞く質問（クラウドワークスの手数料段階の区切りと率）は、逃げ道なしで5回中5回が具体的な数字を言い切り、逃げ道を追加しても5回中5回のまま変わらなかった。『数字も目安も禁止』を追加すると3回中0回になった。金額を計算させる質問（92,000円の手取り）も、逃げ道なしで5回中5回が具体的な金額を言い切り、逃げ道を追加しても5回中5回のまま変わらず、『計算例も目安も禁止』を追加して初めて3回中0回になった。下の枠には、同じ一文が範囲の質問にも計算の質問にも効かなかったこと、『数字も目安も一切書くな』と名指しして初めて両方が0になったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">範囲の質問でも、計算の質問でも、同じ形で効かなかった</text>
<text class="t-sm" x="18" y="45">バーは「具体的な数字を言い切った回数／聞いた回数」。短いほど逃げ道が効いている。</text>
<text class="t-sm" x="18" y="64">先行記事（Kindleロイヤリティ）は範囲の質問だけ一文で0になったが、この材料では範囲も計算も一文だけでは0にならなかった。</text>
<text class="t-sm" x="18" y="83">資料はどの回にも見せていない（AIの記憶だけでの回答）。</text>
<text class="t-strong" x="18" y="122">範囲を聞く質問（手数料の区切りと率）</text>
<text class="t-xs" x="248" y="144" text-anchor="end">逃げ道なし</text>
<rect class="box-quiet" x="260" y="130" width="350" height="18" rx="3"/>
<rect class="box-bad" x="260" y="130" width="350.0" height="18" rx="3"/>
<text class="t-sm" x="620" y="144">5／5</text>
<text class="t-xs" x="248" y="168" text-anchor="end">逃げ道を追加</text>
<rect class="box-quiet" x="260" y="154" width="350" height="18" rx="3"/>
<rect class="box-bad" x="260" y="154" width="350.0" height="18" rx="3"/>
<text class="t-sm" x="620" y="168">5／5</text>
<text class="t-xs" x="248" y="192" text-anchor="end">＋数字も目安も禁止</text>
<rect class="box-quiet" x="260" y="178" width="350" height="18" rx="3"/>
<text class="t-sm" x="620" y="192">0／3</text>
<text class="t-strong" x="18" y="216">金額を計算させる質問（92,000円の手取り）</text>
<text class="t-xs" x="248" y="238" text-anchor="end">逃げ道なし</text>
<rect class="box-quiet" x="260" y="224" width="350" height="18" rx="3"/>
<rect class="box-bad" x="260" y="224" width="350.0" height="18" rx="3"/>
<text class="t-sm" x="620" y="238">5／5</text>
<text class="t-xs" x="248" y="262" text-anchor="end">逃げ道を追加</text>
<rect class="box-quiet" x="260" y="248" width="350" height="18" rx="3"/>
<rect class="box-bad" x="260" y="248" width="350.0" height="18" rx="3"/>
<text class="t-sm" x="620" y="262">5／5</text>
<text class="t-xs" x="248" y="286" text-anchor="end">＋計算例も目安も禁止</text>
<rect class="box-quiet" x="260" y="272" width="350" height="18" rx="3"/>
<text class="t-sm" x="620" y="286">0／3</text>
<rect class="box-accent" x="18" y="322" width="684" height="44" rx="6"/>
<text class="t-accent" x="34" y="342">同じ一文（分からない場合は分からないと答えて）が、範囲の質問にも計算の質問にも効かなかった。</text>
<text class="t-accent" x="34" y="360">『数字も目安も一切書くな』と名指しして、初めて両方が0になった。</text>
</svg>
