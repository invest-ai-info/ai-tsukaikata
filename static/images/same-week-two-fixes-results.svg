<text class="t-strong" x="18" y="26">同じ週に条1・条3の誤報が重なっても、1回の依頼で両方直り巻き添え0件</text>
<text class="t-sm" x="18" y="45">架空の受注ログ点検5条・材料31行×2系列（C・D）。条1と条3の誤報を同時に見せ、1回の依頼で両方の除外を頼んだ。</text>
