<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="同じ週に条1と条3で誤報が同時に起きても、1回の依頼で両方を直せたことを示す表。行は週0（基準）・同時修正後1回目・同時修正後2回目、列は系列C・系列D。週0はどちらも7件中7件検出。同時修正後は1回目・2回目とも、誤報2件を除外し本物5件を維持し、条2・条4・条5への巻き添えは0件。4回の独立呼び出し全部が同じ結果だった。">
