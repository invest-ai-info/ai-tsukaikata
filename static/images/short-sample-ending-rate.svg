<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">見本を1〜2文に短縮すると、再現の比率は30%前後まで落ちた</text>
<text class="t-sm" x="18" y="45">実測2026-10-20。先行記事のフル見本を1〜2文に短縮し、単純に書かせる版・2段階版を各4回試した。</text>
<text class="t-sm" x="18" y="64">フル見本（7〜9文）の実物比率は犬78%・万年筆100%だった（先行記事2026-10-14実測）。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">犬：短い見本そのもの（2文中2文）</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
