<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="見本を1〜2文に短縮すると、文末パターンの再現比率がどこまで落ちるかを示す表。犬の短い見本そのものは2文中2文（100%）。短い見本で単純に書かせると27文中8文（30%）、2段階にすると28文中8文（29%）。万年筆の短い見本そのものも2文中2文（100%）。短い見本で単純に書かせると21文中6文（29%）、2段階にすると26文中9文（35%）。下の枠には、短い見本自体は2文とも対象の文末で比率は100%に見えること、単純に書かせても2段階にしても出力の比率は29〜35%にしか届かないこと、フル見本を渡した先行記事は犬78%・万年筆100%で短くすると大きく下がることが書かれている。">
<style>
