<rect class="box" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="189" text-anchor="middle" style="font-weight:700">8/28</text>
<text class="t" x="18" y="221">万年筆：短い見本そのもの（2文中2文）</text>
<rect class="box-good" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="253">万年筆：短い見本で単純に書かせる（4回・21文）</text>
<rect class="box" x="398" y="232" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="253" text-anchor="middle" style="font-weight:700">6/21</text>
<text class="t" x="18" y="285">万年筆：短い見本で2段階（4回・26文）</text>
<rect class="box" x="398" y="264" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="285" text-anchor="middle" style="font-weight:700">9/26</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">短い見本（1〜2文）自体は2文とも対象の文末で、比率は100%に見える。</text>
<text class="t-accent" x="34" y="340">ところが単純に書かせても2段階にしても、出力の比率は29〜35%にしか届かない。</text>
<text class="t-accent" x="34" y="358">フル見本（7〜9文）を渡した先行記事は犬78%・万年筆100%。短くすると大きく下がる。</text>
