<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" role="img" aria-label="架空の納品記録12件と入金明細10行を突き合わせる4つの頼み方を並べたマス目。同額の2件（甲社・戊商店、どちらも30,000円）をどちらかに決めつけて誤配分した回は、版a（素朴）・版b（確かめる欄）・版c（行番号つき）・版d（合算チェック明記）のいずれも0件だった。合算入金（LP制作Fと動画編集Gの2件ぶん、48,000円＋32,000円＝80,000円の1行）を正しく発見した回は、版aで3回中0回、版bで3回中1回、版cで3回中1回、版dで2回中2回だった。">
<style>
