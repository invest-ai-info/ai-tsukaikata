<rect class="bg" x="0" y="0" width="720" height="384"/>
<text class="t-strong" x="18" y="26">同額の取り違えは0件のまま。動いたのは合算への気づき</text>
<text class="t-sm" x="18" y="45">架空の納品記録12件・入金明細10行を突き合わせ「まだ入金の無い案件」を挙げさせた。</text>
<text class="t-sm" x="18" y="64">同額2件（甲社・戊商店、どちらも30,000円）をどちらかに決めつけた回は、全13回で0件。</text>
<text class="t-sm" x="18" y="83">合算入金（LP制作F＋動画編集G＝80,000円の1行）は、「確認して」と明記した版dだけ2回とも発見。</text>
<text class="t-xs" x="230.0" y="126">同額2件を誤配分</text>
<text class="t-xs" x="405.0" y="126">合算入金を発見</text>
<text class="t-sm" x="18" y="160">版a　素朴に聞く（3回）</text>
<rect class="box-good" x="230" y="138" width="165" height="34" rx="4"/>
<text class="t-good" x="295.7" y="160">0/3</text>
<rect class="box-bad" x="405" y="138" width="165" height="34" rx="4"/>
<text class="t-bad" x="470.7" y="160">0/3</text>
<text class="t-sm" x="18" y="204">版b　＋確かめる欄（3回）</text>
<rect class="box-good" x="230" y="182" width="165" height="34" rx="4"/>
<text class="t-good" x="295.7" y="204">0/3</text>
<rect class="box-bad" x="405" y="182" width="165" height="34" rx="4"/>
<text class="t-bad" x="470.7" y="204">1/3</text>
<text class="t-sm" x="18" y="248">版c　＋行番号つき（3回）</text>
<rect class="box-good" x="230" y="226" width="165" height="34" rx="4"/>
<text class="t-good" x="295.7" y="248">0/3</text>
<rect class="box-bad" x="405" y="226" width="165" height="34" rx="4"/>
<text class="t-bad" x="470.7" y="248">1/3</text>
<text class="t-sm" x="18" y="292">版d　＋合算チェック明記（2回）</text>
<rect class="box-good" x="230" y="270" width="165" height="34" rx="4"/>
<text class="t-good" x="295.7" y="292">0/2</text>
<rect class="box-good" x="405" y="270" width="165" height="34" rx="4"/>
<text class="t-good" x="470.7" y="292">2/2</text>
<text class="t-xs" x="18" y="347">※ 真値は日付窓つきの金額総当たり（Python）で確定。手数料500円までの差引は「確かめる」扱い。</text>
<text class="t-xs" x="18" y="368">架空データでの実測（全13回）。生の返りは docs/evidence/ に全文置いてある。</text>
</svg>
