<text class="t-good" x="303.0" y="149" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-good" x="398" y="130" width="110" height="26" rx="4"/>
<text class="t-good" x="453.0" y="149" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-quiet" x="548" y="130" width="110" height="26" rx="4"/>
