<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" role="img" aria-label="役割を付ける・付けないの6版（役割なし、あなたは担当者です、20年の専門家です、念押しの一文を外す、逐語引用を求める、専門家＋逐語引用）について、各2回・計12回72問を実測した結果の表。正答（問1〜3の条文番号一致）と検出（問4〜6の「記載がない」明言）はどの版も6／6で満点、12回全体では72問中72問が正答・検出とも満点だった。捏造引用（記載のない問に実在の条文番号を当てた数）も0件。聞いていないのに条文名を書き添えた回数だけが版によって違い、役割なし・担当者・念押しなし・専門家＋逐語引用の4版は2回とも0回、逐語引用を求めた版は2回中1回、20年の専門家を付けた版だけ2回とも書き添えた。ただし同じ役割に逐語引用を重ねた版では0回に戻っており、一貫した効果とは言えない。">
<style>
