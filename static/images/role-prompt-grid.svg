<rect class="bg" x="0" y="0" width="720" height="424"/>
<text class="t-strong" x="18" y="26">正答と検出はどの版も満点。動いたのは「条文名の書き添え」だけ</text>
<text class="t-sm" x="18" y="45">6版×各2回＝12回・計72問。正答＝問1〜3で条文番号が正しい。検出＝問4〜6で「規程に記載がない」と明言。</text>
<text class="t-sm" x="18" y="64">条文名の書き添え＝聞いていないのに「第2条（出張旅費）」のように名前を添えた回数（／2回）。</text>
<text class="t-xs" x="303.0" y="116" text-anchor="middle">正答（問1〜3）</text>
<text class="t-xs" x="453.0" y="116" text-anchor="middle">検出（問4〜6）</text>
