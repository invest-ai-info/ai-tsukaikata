<rect class="box-good" x="248" y="166" width="110" height="26" rx="4"/>
<text class="t-good" x="303.0" y="185" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-good" x="398" y="166" width="110" height="26" rx="4"/>
<text class="t-good" x="453.0" y="185" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-quiet" x="548" y="166" width="110" height="26" rx="4"/>
<text class="t-sm" x="603.0" y="185" text-anchor="middle" style="font-weight:700">0／2</text>
<text class="t" x="18" y="221">c. 「20年の専門家です」</text>
<rect class="box-good" x="248" y="202" width="110" height="26" rx="4"/>
<text class="t-good" x="303.0" y="221" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-good" x="398" y="202" width="110" height="26" rx="4"/>
<text class="t-good" x="453.0" y="221" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-accent" x="548" y="202" width="110" height="26" rx="4"/>
<text class="t-accent" x="603.0" y="221" text-anchor="middle" style="font-weight:700">2／2</text>
<text class="t" x="18" y="257">d. 念押しの一文を外す</text>
<rect class="box-good" x="248" y="238" width="110" height="26" rx="4"/>
<text class="t-good" x="303.0" y="257" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-good" x="398" y="238" width="110" height="26" rx="4"/>
<text class="t-good" x="453.0" y="257" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-quiet" x="548" y="238" width="110" height="26" rx="4"/>
<text class="t-sm" x="603.0" y="257" text-anchor="middle" style="font-weight:700">0／2</text>
<text class="t" x="18" y="293">e. 逐語引用を求める</text>
<rect class="box-good" x="248" y="274" width="110" height="26" rx="4"/>
<text class="t-good" x="303.0" y="293" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-good" x="398" y="274" width="110" height="26" rx="4"/>
<text class="t-good" x="453.0" y="293" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-accent" x="548" y="274" width="110" height="26" rx="4"/>
<text class="t-accent" x="603.0" y="293" text-anchor="middle" style="font-weight:700">1／2</text>
<text class="t" x="18" y="329">f. c＋逐語引用を求める</text>
<rect class="box-good" x="248" y="310" width="110" height="26" rx="4"/>
<text class="t-good" x="303.0" y="329" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-good" x="398" y="310" width="110" height="26" rx="4"/>
<text class="t-good" x="453.0" y="329" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-quiet" x="548" y="310" width="110" height="26" rx="4"/>
<text class="t-sm" x="603.0" y="329" text-anchor="middle" style="font-weight:700">0／2</text>
<rect class="box-accent" x="18" y="354" width="678" height="46" rx="6"/>
<text class="t-accent" x="34" y="373">72問中72問が正答・検出とも満点。捏造引用（未記載の問に実在条文を当てた数）も0件。</text>
<text class="t-accent" x="34" y="391">条文名の書き添えは「20年の専門家」で2／2回。ただし同じ役割＋逐語引用（f）では0／2回で、一貫しない。</text>
