<svg xmlns="http://www.w3.org/2000/svg" width="720" height="238" viewBox="0 0 720 238" role="img" aria-label="Gemini 4 Carbon（〜2026年11月30日・入力2ドル出力10ドル）と、Gemini 4 Carbon（2026年12月1日から・入力4ドル出力20ドル）を比べた横棒グラフ。100万トークンあたりのドル。金額は10月28日の発表時点から変わっていないが、導入期間が終わる日付（2026年12月1日）は今回の一般提供の発表で初めて判明した。">
<style>
