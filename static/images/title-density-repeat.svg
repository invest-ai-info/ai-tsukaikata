<svg xmlns="http://www.w3.org/2000/svg" width="720" height="548" viewBox="0 0 720 548" role="img" aria-label="切り口を割る方式（濃い色）と素朴に「100個出して」と頼む方式（薄い色）の、実質の種類数÷件数（%）を、架空のnote記事テーマとKindle本テーマで計14回試した結果を昇順に並べた横棒グラフ。素朴方式は35%・36%・43%・44.4%・46.5%・52.5%・59%・67%の8回で、切り口方式は58%・84%・86%・86%・92%・94%の6回。58%から67%の帯では、切り口方式の最低値（58%）が素朴方式の最高値（67%）より低く、両方式が重なっている。下の注記には、1回だけの比較だと運が悪いと逆の結果が出ることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="548"/>
<text class="t-strong" x="18" y="26">切り口方式は平均では濃いが、1回ずつ見ると素朴方式と重なる帯がある</text>
<text class="t-sm" x="18" y="45">先行記事の3回（note/Kindleで素朴35〜36%・切り口86%）に、新規11回を追加した計14回。濃い色＝切り口。</text>
<text class="t-sm" x="18" y="64">横軸は実質の種類数÷件数（%）。架空のnote記事テーマ・Kindle本テーマで、difflibのクラスタ数で機械判定。</text>
<rect class="box-accent" x="457.6" y="90" width="43.4" height="374" rx="4" opacity="0.5"/>
