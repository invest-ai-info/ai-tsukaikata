<text class="t-accent" x="34" y="504">※ 濃い帯（58〜67%）では、切り口方式の最低値が素朴方式の最高値より低い。</text>
<text class="t-accent" x="34" y="523">1回だけの比較だと、運が悪いと逆の結果が出る。</text>
