<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="材料A・B、健全5件のみ条件・既存の誤りも混在させた条件の4パターンを2回ずつ試し、該当件だけを正しく除外し健全5件を巻き込まなかった回数を示す表。4パターンすべてで2回中2回、正しく処理できた。下の枠には、先送り先を書かない優先度下げの依頼でも、広い基準は8回中8回、該当件だけを正しく除外し健全な5件を巻き込まなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">先送り先を書かない依頼でも、広い基準は8回中8回崩れなかった</text>
<text class="t-sm" x="18" y="45">材料A（丁寧な長文）・B（口語）×健全5件のみ／既存の誤りも混在、の4条件を2回ずつ試した。</text>
<text class="t-sm" x="18" y="64">数字は「該当件だけを正しく除外し、健全5件を巻き込まなかった回数／試した回数」。</text>
<text class="t-xs" x="438.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">材料A・健全5件＋新しい依頼1件</text>
<rect class="box-good" x="358" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="438.0" y="125" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="157">材料A・健全5件＋既存の誤り＋新しい依頼</text>
<rect class="box-good" x="358" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="438.0" y="157" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="189">材料B・健全5件＋新しい依頼1件</text>
<rect class="box-good" x="358" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="438.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="221">材料B・健全5件＋既存の誤り＋新しい依頼</text>
<rect class="box-good" x="358" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="438.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">先送り先を書かない優先度下げの依頼でも、広い基準（類義語・言い換えも含める）は</text>
<text class="t-accent" x="34" y="276">8回中8回、該当件だけを正しく除外し、健全な5件を巻き込まなかった。</text>
</svg>
