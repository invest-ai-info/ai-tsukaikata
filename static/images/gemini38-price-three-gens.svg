<svg xmlns="http://www.w3.org/2000/svg" width="720" height="339" viewBox="0 0 720 339" role="img" aria-label="Gemini 3.6 Flash・3.7 Flash・3.8 Flash の3世代の単価を比べた横棒グラフ。100万トークンあたりのドル、2026年12月31日までの値。3世代とも入力0.75ドル・出力3.75ドルで、バーの長さはまったく同じ。2027年1月1日から、3世代いっせいに入力1.50ドル・出力7.50ドルに上がる。3.8が安いのではなく、3世代とも同じ導入期間の値段であることを示す図。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="339"/>
<text class="t-strong" x="18" y="26">Flash は3世代連続で、導入価格がまったく同じ</text>
<text class="t-sm" x="18" y="45">薄い青＝入力、濃い青＝出力。100万トークンあたりのドル、2026年12月31日までの値。</text>
<text class="t-sm" x="18" y="64">3.6・3.7・3.8のどれも $0.75 と $3.75 で、バーの長さは3世代とも同じです。</text>
<text class="t-sm" x="18" y="83">⚠️ 2027年1月1日から、3世代いっせいに入力 $1.50・出力 $7.50 に上がります。</text>
<text class="t" x="18" y="112">Gemini 3.6 Flash</text>
<text class="t-xs" x="214" y="113">入力</text>
<rect class="bar-in" x="250" y="100" width="72.0" height="16" rx="2"/>
<text class="t-sm" x="330.0" y="113">$0.75</text>
<text class="t-xs" x="214" y="134">出力</text>
<rect class="bar-out" x="250" y="121" width="360.0" height="16" rx="2"/>
<text class="t-sm" x="618.0" y="134">$3.75</text>
<text class="t" x="18" y="175">Gemini 3.7 Flash</text>
<text class="t-xs" x="214" y="176">入力</text>
<rect class="bar-in" x="250" y="163" width="72.0" height="16" rx="2"/>
<text class="t-sm" x="330.0" y="176">$0.75</text>
<text class="t-xs" x="214" y="197">出力</text>
<rect class="bar-out" x="250" y="184" width="360.0" height="16" rx="2"/>
<text class="t-sm" x="618.0" y="197">$3.75</text>
<text class="t" x="18" y="238">Gemini 3.8 Flash</text>
<text class="t-xs" x="214" y="239">入力</text>
<rect class="bar-in" x="250" y="226" width="72.0" height="16" rx="2"/>
<text class="t-sm" x="330.0" y="239">$0.75</text>
<text class="t-xs" x="214" y="260">出力</text>
<rect class="bar-out" x="250" y="247" width="360.0" height="16" rx="2"/>
<text class="t-sm" x="618.0" y="260">$3.75</text>
<text class="t-xs" x="18" y="309">※ 出典: Google の Gemini API 料金ページ（ai.google.dev・2026年9月6日に確認）。</text>
<text class="t-xs" x="18" y="327">※ 3.8 が安いのではなく、3世代とも同じ「導入期間」の値段です。</text>
</svg>
