<rect class="bg" x="0" y="0" width="720" height="422"/>
<text class="t-strong" x="18" y="24">消えた項目は、見出しの事実に添えた「時刻」「回数」だけだった</text>
<text class="t-sm" x="18" y="43">材料A・Bとも、仕込んだ数字・条件12〜13項目はそのまま残り、消えたのはこの3項目だけ。</text>
<text class="t-xs" x="18" y="62">縦軸は、2回の実行のうちその項目が消えた回数。</text>
<text class="t-strong" x="18" y="128">材料A：発表時刻（2027-02-09 18:40）</text>
