<text class="t-accent" x="34" y="378">材料Aの発表時刻・停止回数は、「わかりやすく」でだけ2回とも消えた。</text>
<text class="t-accent" x="34" y="396">材料Bの追加日時は、「そのまま」でも「わかりやすく」でも2回とも消えた——指示の言い方とは無関係。</text>
