<svg xmlns="http://www.w3.org/2000/svg" width="720" height="422" viewBox="0 0 720 422" role="img" aria-label="3つの項目について、「そのまま」と「わかりやすく」それぞれで2回中何回消えたかを示す横棒グラフ。材料Aの発表時刻（2027-02-09 18:40）は、そのまま0/2回、わかりやすく2/2回。材料Aの停止回数（52回連続）も、そのまま0/2回、わかりやすく2/2回。材料Bの追加日時（2027-03-04 21:15）は、そのまま2/2回、わかりやすく2/2回。下の枠には、材料Aの発表時刻・停止回数は「わかりやすく」でだけ2回とも消えたこと、材料Bの追加日時は指示の言い方に関係なく2回とも消えたことが書かれている。">
