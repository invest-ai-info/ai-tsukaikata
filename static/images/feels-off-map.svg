<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="「なんか違う」の3つの正体と、それぞれにかける一言を並べた図。結果が違う→「期待していたのは◯◯、出てきたのは△△」。進め方が違う→「いったん止めて、途中で1回見せて」。目的からズレた→「最初の依頼を引用して。対応してる？」。どれか分からなければ、それ自体をAIに聞く。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="340"/>
<text class="t-strong" x="18" y="26">「なんか違う」には正体が3つある</text>
<text class="t-sm" x="18" y="45">どれかが分かれば、かける一言が決まる。分からなければ、それをAIに聞く。</text>
<rect class="box-quiet" x="18" y="84" width="236" height="56" rx="6"/>
<text class="t-strong" x="32" y="117">結果が違う</text>
<line class="line" x1="260" y1="112" x2="306" y2="112"/>
<path d="M306 108 L313 112 L306 116 Z" fill="#8b949e"/>
<rect class="box-accent" x="320" y="84" width="382" height="56" rx="6"/>
<text class="t" x="334" y="117">期待していたのは◯◯、出てきたのは△△</text>
<rect class="box-quiet" x="18" y="164" width="236" height="56" rx="6"/>
<text class="t-strong" x="32" y="197">進め方が違う</text>
<line class="line" x1="260" y1="192" x2="306" y2="192"/>
<path d="M306 188 L313 192 L306 196 Z" fill="#8b949e"/>
<rect class="box-accent" x="320" y="164" width="382" height="56" rx="6"/>
<text class="t" x="334" y="197">いったん止めて、途中で1回見せて</text>
<rect class="box-quiet" x="18" y="244" width="236" height="56" rx="6"/>
<text class="t-strong" x="32" y="277">目的からズレた</text>
<line class="line" x1="260" y1="272" x2="306" y2="272"/>
<path d="M306 268 L313 272 L306 276 Z" fill="#8b949e"/>
<rect class="box-accent" x="320" y="244" width="382" height="56" rx="6"/>
<text class="t" x="334" y="277">最初の依頼を引用して。対応してる？</text>
<text class="t-xs" x="18" y="328">※ 違和感は誤報ではなく、いちばん早い警報。言葉になる前に止まってよい。</text>
</svg>
