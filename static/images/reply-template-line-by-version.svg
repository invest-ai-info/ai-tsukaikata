<svg xmlns="http://www.w3.org/2000/svg" width="720" height="307" viewBox="0 0 720 307" role="img" aria-label="『ほぼ同じ』の結びの一文を誤って固定した回数を、3つの版で比べた横棒グラフ。版a（そのまま）は6回中5回、版b（＋『4通全部で一致』の条件）は6回中0回、版c（＋通数を申告させる）は6回中0回。他の客の固有名詞が固定部に残った回数は、3版とも18回中0回だった。">
