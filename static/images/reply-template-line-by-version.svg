<rect class="bg" x="0" y="0" width="720" height="307"/>
<text class="t-strong" x="18" y="26">「4通全部で一致」を付けるだけで、誤固定は6回中5回→0回になった</text>
<text class="t-sm" x="18" y="45">架空の返信12通を2本。同じ種類の4通のうち3通にしか出ない結びの一文（1通だけ言い回しが違う）を、</text>
<text class="t-sm" x="18" y="64">「毎回同じ文」として固定してしまった回数。3版 × 材料2本 × 各3回＝全18回、独立した新規セッションで実施。</text>
<path class="line" d="M228.0 90 L228.0 206" stroke-width="1" opacity="0.35"/>
<text class="t-xs" x="225.0" y="84">0</text>
<path class="line" d="M295.0 90 L295.0 206" stroke-width="1" opacity="0.35"/>
<text class="t-xs" x="292.0" y="84">1</text>
<path class="line" d="M362.0 90 L362.0 206" stroke-width="1" opacity="0.35"/>
<text class="t-xs" x="359.0" y="84">2</text>
<path class="line" d="M429.0 90 L429.0 206" stroke-width="1" opacity="0.35"/>
<text class="t-xs" x="426.0" y="84">3</text>
<path class="line" d="M496.0 90 L496.0 206" stroke-width="1" opacity="0.35"/>
<text class="t-xs" x="493.0" y="84">4</text>
<path class="line" d="M563.0 90 L563.0 206" stroke-width="1" opacity="0.35"/>
<text class="t-xs" x="560.0" y="84">5</text>
<path class="line" d="M630.0 90 L630.0 206" stroke-width="1" opacity="0.35"/>
<text class="t-xs" x="627.0" y="84">6</text>
<text class="t" x="18" y="121">版a　そのまま</text>
<rect class="box-bad" x="228" y="106.0" width="335.0" height="20" rx="4"/>
<text class="t-bad" x="571.0" y="121.0">5／6件</text>
<text class="t" x="18" y="161">版b　＋「4通全部で一致」</text>
<rect class="box-good" x="228" y="146.0" width="2.0" height="20" rx="4"/>
<text class="t-good" x="238.0" y="161.0">0／6件</text>
<text class="t" x="18" y="201">版c　＋通数を申告させる</text>
<rect class="box-good" x="228" y="186.0" width="2.0" height="20" rx="4"/>
<text class="t-good" x="238.0" y="201.0">0／6件</text>
<text class="t-sm" x="18" y="236">※ 版a（記事 mail-needs-reply.md の一文そのまま）だけが「毎回同じ文は固定して」としか言っていない。</text>
<text class="t-good" x="18" y="257">※ 版b・cは18回中12回とも0件。他の客の固有名詞が固定部に残った回数は、3版とも18回中0回。</text>
<text class="t-xs" x="18" y="278">架空データでの実測。生の返り18通は docs/evidence/ に全文置いてある。</text>
</svg>
