<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="受け皿の作り方ごとに、紛れ込みが起きた割合を3本の横棒で比べた図。架空の送信済み30行と受信25行を2本に、「確認します」「ご連絡します」だけの一次返信を2件ずつ仕込み、3通りの指示文を新規セッションで合計18回試した。①受け皿なし（前回記事の保存版）は、一次返信2件が本体の一覧に混ざった回数が4回中4回。②「一次返信のみ」の受け皿を足すと、無関係な相手が紛れ込んだのは8回中1回。③受け皿を「答えの有無」で定義し直すと、②の取り違えは消えたが、別の相手が〔決められない〕に紛れ込んだのは6回中1回。下の枠には、受け皿が無いと一次返信は4回中4回、本体の催促一覧に混ざったこと、受け皿を足すと激減したがどちらの作り方でも別の誰かが1回だけ紛れ込んだことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="360"/>
<text class="t-strong" x="18" y="26">受け皿を作ると紛れ込みは激減するが、形を変えても0にはならない</text>
<text class="t-sm" x="18" y="45">架空の送信済み30行と受信25行を2本（会社の総務課／お祭りの事務局）。「確認します」「ご連絡します」だけの</text>
<text class="t-sm" x="18" y="64">一次返信が2件ずつ仕込んである。3通りの指示文を、新規セッションで合計18回試した。</text>
<text class="t-sm" x="18" y="83">①は受け皿そのものが無い版、②は前回の記事のキュー項目にある版、③は②の取り違えを防ごうとした版。</text>
<text class="t-xs" x="18" y="102">どの版でも、本体の一覧（催促すべき6件）の中身は18回とも1件も動かなかった（下のもう1枚の図）。</text>
<text class="t-xs" x="320" y="132">紛れ込みが起きた割合（低いほどよい）</text>
<text class="t" x="18" y="166">① 受け皿なし（前回記事の保存版）</text>
<rect class="box-bad" x="320" y="152" width="250" height="20" rx="3"/>
<text class="t-bad" x="578" y="166">4/4</text>
<text class="t-xs" x="18" y="182">本体の一覧に混ざった</text>
<text class="t" x="18" y="212">② 「一次返信のみ」の受け皿を足す</text>
<rect class="bar-old" x="320" y="198" width="31" height="20" rx="3"/>
<text class="t" x="359" y="212">1/8</text>
<text class="t-xs" x="18" y="228">無関係な相手が紛れ込んだ</text>
<text class="t" x="18" y="258">③ 受け皿を「答えの有無」で定義し直す</text>
<rect class="bar-old" x="320" y="244" width="42" height="20" rx="3"/>
<text class="t" x="370" y="258">1/6</text>
<text class="t-xs" x="18" y="274">別の相手が紛れ込んだ</text>
<text class="t-bad" x="18" y="296">🚨 受け皿が無いと、一次返信は2件とも4回中4回、本体の催促一覧に混ざった。</text>
<text class="t-sm" x="18" y="316">   受け皿を足すと激減したが、どちらの作り方でも「別の誰か」が1回だけ紛れ込んだ。</text>
<text class="t-xs" x="18" y="336">架空データでの実測（全18回）。生の返りは docs/evidence/ に全文置いてある。</text>
</svg>
