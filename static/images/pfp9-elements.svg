<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" role="img" aria-label="実験値に近づける r2SCAN 計算モードで扱える元素の数を比べた横棒グラフ。PFP v8 が70種類、PFP v9 が96種類で、水素（H）からキュリウム（Cm）まで。増えたのはランタノイドとアクチノイドの系列。また学習データには表面構造・吸着構造・クラスター・金属錯体が新しく入っており、触媒・電池材料・合金・多孔性材料で頻繁に出てくる形だと発表ページは説明している。もう一方の計算モードである PBE で扱える元素の数は、この発表ページには書かれていない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="356"/>
<text class="t-strong" x="18" y="26">実験値に近づける計算モードで扱える元素が、70種類から96種類になりました</text>
<text class="t-sm" x="18" y="45">水素（H）からキュリウム（Cm）まで。増えたのはランタノイドとアクチノイドの系列です。</text>
<text class="t" x="18" y="117">PFP v8</text>
<rect class="bar-old" x="190" y="96" width="299.0" height="30" rx="2"/>
<text class="t-sm" x="499.0" y="117">70種類</text>
<text class="t" x="18" y="165">PFP v9</text>
<rect class="bar-new" x="190" y="144" width="410.0" height="30" rx="2"/>
<text class="t-sm" x="610.0" y="165">96種類</text>
<rect class="box-accent" x="18" y="206" width="684" height="96" rx="6"/>
<text class="t-strong" x="36" y="234">学習データに新しく入ったもの</text>
<text class="t" x="36" y="258">表面構造・吸着構造・クラスター・金属錯体</text>
<text class="t-sm" x="36" y="282">触媒・電池材料・合金・多孔性材料で頻繁に出てくる形だと発表ページは説明しています。</text>
<text class="t-xs" x="18" y="332">※ もう一方の計算モード（PBE）で扱える元素の数は、この発表ページには書かれていません。</text>
</svg>
