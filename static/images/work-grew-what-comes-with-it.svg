<svg xmlns="http://www.w3.org/2000/svg" width="720" height="447" viewBox="0 0 720 447" role="img" aria-label="副業の往復メール12通から、自分がやることになっている作業を拾わせたときの結果を、頼み方6通りで並べた表。架空の案件2本を作り、1つの頼み方につき材料2本かける各2回で4回ずつ通した。左の列は、相手が希望を書いただけの作業が「やること」の欄に入ってしまった件数で、真値は0。中の列は、金額や報酬の語が出た回数。右の列は、交渉やおすすめが出た回数。そのままやることを全部挙げてと頼んだ4回は、左が0回、金額が4回、交渉が4回。相手の希望だけのものは入れないでと足した4回は、左が0回、金額が3回、交渉が4回。私が決めます、金額の話は書かないでと足した4回は、3つとも0回。4つに分けさせた4回も、3つとも0回。4つに分けて禁止も足した4回も、3つとも0回。保存版の4回も、3つとも0回。つまり拾い分けそのものは24回とも崩れず、崩れるかわりに、材料に1文字も書かれていない金額や交渉の話が、そのまま頼んだときだけ付いてきた。">
<style>
