<rect class="box-bad" x="596" y="130" width="52" height="19" rx="4"/>
<text class="t-bad" x="622" y="144" text-anchor="middle">4 / 4</text>
<text class="t" x="18" y="178">＋「相手の希望だけのものは入れないで」</text>
<rect class="box-good" x="334" y="164" width="52" height="19" rx="4"/>
<text class="t-good" x="360" y="178" text-anchor="middle">0 / 4</text>
