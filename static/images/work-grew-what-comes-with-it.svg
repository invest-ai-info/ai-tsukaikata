<text class="t-good" x="622" y="212" text-anchor="middle">0 / 4</text>
<text class="t" x="18" y="246">4つに分けさせる（判断はしないで）</text>
<rect class="box-good" x="334" y="232" width="52" height="19" rx="4"/>
<text class="t-good" x="360" y="246" text-anchor="middle">0 / 4</text>
