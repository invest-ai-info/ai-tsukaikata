<text class="t" x="18" y="314">保存版（4見出し以外は書かない・引用つき）</text>
<rect class="box-good" x="334" y="300" width="52" height="19" rx="4"/>
<text class="t-good" x="360" y="314" text-anchor="middle">0 / 4</text>
