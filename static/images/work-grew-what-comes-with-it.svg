<text class="t-bad" x="622" y="178" text-anchor="middle">4 / 4</text>
<text class="t" x="18" y="212">＋「私が決めます。金額の話は書かないで」</text>
<rect class="box-good" x="334" y="198" width="52" height="19" rx="4"/>
<text class="t-good" x="360" y="212" text-anchor="middle">0 / 4</text>
