<text class="t-good" x="622" y="246" text-anchor="middle">0 / 4</text>
<text class="t" x="18" y="280">4つに分ける＋上の禁止も足す</text>
<rect class="box-good" x="334" y="266" width="52" height="19" rx="4"/>
<text class="t-good" x="360" y="280" text-anchor="middle">0 / 4</text>
