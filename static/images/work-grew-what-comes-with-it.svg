<text class="t-good" x="18" y="342">※ 左の列は24回とも0。相手が希望を書いただけのものが「やること」に入った回は0回だった。</text>
<text class="t-bad" x="18" y="363">※ 上の2行では「報酬を確認したほうがよい」「再交渉を」が付く。材料に金額は1文字も無い。</text>
<text class="t-bad" x="18" y="384">　 1回は「作業が5点増えている」と書いて、その直後に4点しか並べていなかった。</text>
<text class="t-good" x="18" y="405">※ 4つに分ける形にすると、禁止を書かなくても金額も交渉も0回になった。</text>
<text class="t-xs" x="18" y="426">架空データでの実測（全24回）。生の返りは docs/evidence/ に全文置いてある。</text>
