<rect class="bg" x="0" y="0" width="720" height="447"/>
<text class="t-strong" x="18" y="26">拾い分けは崩れない。崩れないかわりに、頼んでいない交渉の話が付いてくる</text>
<text class="t-sm" x="18" y="45">架空の副業案件の往復メール12通を2本作り、自分が承諾した4件・相手の希望だけの3件・断った2件・発注書のぶん3件を仕込んだ。</text>
<text class="t-sm" x="18" y="64">1つの頼み方につき、材料2本 × 各2回 ＝ 4回。左の列は事故の件数で、真値は0。</text>
<text class="t-sm" x="18" y="83">※ 材料の中に、金額・報酬・単価の記載は1文字も無い。</text>
<text class="t-xs" x="360" y="100" text-anchor="middle">相手の希望が</text>
<text class="t-xs" x="360" y="113" text-anchor="middle">やること欄に入った</text>
<text class="t-xs" x="494" y="100" text-anchor="middle">金額の語が</text>
<text class="t-xs" x="494" y="113" text-anchor="middle">出た回</text>
<text class="t-xs" x="622" y="100" text-anchor="middle">交渉・おすすめが</text>
<text class="t-xs" x="622" y="113" text-anchor="middle">出た回</text>
<text class="t" x="18" y="144">そのまま「やることを全部挙げて」</text>
<rect class="box-good" x="334" y="130" width="52" height="19" rx="4"/>
<text class="t-good" x="360" y="144" text-anchor="middle">0 / 4</text>
