    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="432"/>
<text class="t-strong" x="18" y="26">公式が出している「最低これだけ要る」</text>
<text class="t-sm" x="18" y="45">2026年8月9日に各社の公式ページで確認したものだけを並べています。</text>
<text class="t-sm" x="18" y="64">「記載なし」は、公式が書いていないという意味です。こちらの推測では埋めていません。</text>
<text class="t-xs" x="32" y="92">ツール</text>
<text class="t-xs" x="206" y="92">メモリ</text>
<text class="t-xs" x="296" y="92">対応OS・ブラウザ</text>
<text class="t-xs" x="596" y="92">料金</text>
<rect class="box-quiet" x="18" y="104" width="684" height="48" rx="6"/>
<text class="t-strong" x="32" y="124">ChatGPT</text>
<text class="t-xs" x="32" y="142">ブラウザ</text>
<text class="t-xs" x="206" y="124">記載なし</text>
<text class="t-xs" x="296" y="124">記載なし</text>
<text class="t-sm" x="596" y="124">無料で開始</text>
<rect class="box-quiet" x="18" y="160" width="684" height="48" rx="6"/>
<text class="t-strong" x="32" y="180">Claude</text>
<text class="t-xs" x="32" y="198">ブラウザ</text>
<text class="t-xs" x="206" y="180">記載なし</text>
<text class="t-xs" x="296" y="180">記載なし</text>
<text class="t-sm" x="596" y="180">無料で開始</text>
<rect class="box-quiet" x="18" y="216" width="684" height="48" rx="6"/>
<text class="t-strong" x="32" y="236">Gemini</text>
<text class="t-xs" x="32" y="254">ブラウザ</text>
<text class="t-xs" x="206" y="236">記載なし</text>
<text class="t-sm" x="296" y="236">Chrome / Safari / Firefox /</text>
<text class="t-sm" x="296" y="254">Opera / Edgium</text>
<text class="t-sm" x="596" y="236">無料で開始</text>
<rect class="box-accent" x="18" y="272" width="684" height="48" rx="6"/>
<text class="t-strong" x="32" y="292">Claude Code</text>
<text class="t-xs" x="32" y="310">アプリ</text>
<text class="t-strong" x="206" y="292">4GB以上</text>
<text class="t-sm" x="296" y="292">Windows 10 1809+</text>
<text class="t-sm" x="296" y="310">macOS 13.0+</text>
<text class="t-sm" x="596" y="292">有料プラン</text>
<rect class="box-good" x="18" y="344" width="684" height="54" rx="6"/>
<text class="t-good" x="32" y="368">4GB あれば、この4つのうち一番重いものが動きます</text>
<text class="t-sm" x="32" y="388">ブラウザで使う3つは、必要なメモリを公表していません。それだけ軽いということです。</text>
<text class="t-xs" x="18" y="420">※ Claude Code だけ、公式が 4GB以上・x64かARM64 と明記しています。</text>
</svg>
