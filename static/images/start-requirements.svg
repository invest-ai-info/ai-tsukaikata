<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" role="img" aria-label="4つのAIツールの最低要件を並べた表。2026年8月9日に各社の公式ページで確認したもの。ChatGPT・Claude のブラウザ版は、対応OSもメモリも公式の記載なしで、無料で開始できる。Gemini のブラウザ版は対応ブラウザが Chrome、Safari、Firefox、Opera、Edgium と公表されているが、メモリの記載はなく、無料で開始できる。Claude Code はメモリ4GB以上、Windows 10 1809以降または macOS 13.0以降で、有料プラン。つまり4GBあれば、この4つのうち一番重いものが動く。ブラウザで使う3つは必要なメモリを公表しておらず、それだけ軽いということ。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
