<svg xmlns="http://www.w3.org/2000/svg" width="720" height="326" viewBox="0 0 720 326" role="img" aria-label="要約された確認結果と生ページを比べた図。生ページには gpt-5.5-pro の行が実際にあり、短い入力が30ドルと180ドル、長い入力が60ドルと270ドルと書かれていた。見出しは Short context と Long context の8列。ところがAIが返してきた確認結果は「長い入力の行はありません。272Kトークン未満という但し書きだけです」というもので、行は実在し、272Kという文字列はページに1度も出てこない。確認をAIに要約させると、確認そのものが作り話になる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="326"/>
<text class="t-strong" x="18" y="26">「確認しました」の中身が、作られていることがあります</text>
<text class="t-sm" x="18" y="45">料金表の1行を確かめようとして、AIに要約させた結果と、生ページの実物です。</text>
<text class="t-sm" x="18" y="64">要約のほうを信じて、正しく書かれていた数字を消してしまいました。</text>
<rect class="box-good" x="22" y="96" width="676" height="86" rx="6"/>
<text class="t-good" x="38" y="122">生ページに実際にあった行</text>
<text class="mono" x="38" y="148">gpt-5.5-pro   $30.00   -   -   $180.00   $60.00   -   -   $270.00</text>
<text class="t-xs" x="38" y="170">見出しは「Short context（短い入力）／ Long context（長い入力）」の8列。長い入力の行は在る。</text>
<rect class="box-bad" x="22" y="200" width="676" height="86" rx="6"/>
<text class="t-bad" x="38" y="226">AIが返してきた「確認結果」</text>
<text class="t" x="38" y="252">「長い入力の行はありません。272Kトークン未満という但し書きだけです」</text>
<text class="t-xs" x="38" y="274">→ 行は在る。そして 272K という文字列は、このページに1度も出てこない。</text>
<text class="t-xs" x="18" y="312">※ 確認をAIに要約させると、確認そのものが作り話になります。生の行を見てください。</text>
</svg>
