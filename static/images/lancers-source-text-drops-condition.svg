<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img" aria-label="ランサーズの発表原文を渡しても、コンペ方式という条件が見落とされたことを示す表。原文には条件が2つ（①デザイン・ライティング業務であること②コンペ方式であること）ある。コンペ方式の募集文2回では、2回とも「対象の案件」と正しく判定した（2/2）。プロジェクト方式の募集文2回では、②の条件（コンペ方式であること）を理由に対象外と正しく除外した回数は0/2で、逆に①の業務名（デザイン業務であること）だけを根拠に「対象」と誤判定した回数は2/2だった。下の枠には、原文に「コンペ方式で」と明記されているのにプロジェクト方式の募集文にも2回とも制度を当てはめたこと、見ていたのは条件のうちデザイン業務であることだけで契約形式の条件は2回とも読み落とされていたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="272"/>
<text class="t-strong" x="18" y="26">原文を渡しても、コンペ方式という条件は2回とも見落とされた</text>
<text class="t-sm" x="18" y="45">実測2026-09-26。ランサーズの発表原文(2024-03-07・「コンペ方式で…選択できる機能」)を渡してから判断させた。</text>
<text class="t-sm" x="18" y="64">原文には条件が2つ（①デザイン/ライティング業務②コンペ方式）ある。①だけ見て②を見落としたかを数えた。</text>
<text class="t-xs" x="528.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">コンペ方式の募集文2回・「対象の案件」と正しく判定した回数</text>
<rect class="box-good" x="448" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="125" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="157">プロジェクト方式の募集文2回・②の条件で対象外と正しく除外した回数</text>
<rect class="box-good" x="448" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="157" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="189">プロジェクト方式の募集文2回・①の業務名だけで「対象」と誤判定した回数</text>
<rect class="box-bad" x="448" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="206" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="226">原文に「コンペ方式で」と明記されているのに、プロジェクト方式の募集文にも2回とも制度を当てはめた。</text>
<text class="t-accent" x="34" y="244">見ていたのは条件のうち「デザイン業務であること」だけで、契約形式の条件は2回とも読み落とされていた。</text>
</svg>
