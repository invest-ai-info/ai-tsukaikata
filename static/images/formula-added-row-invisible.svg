<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-label="架空の売上表30行に佐藤さんの36,000円の行を1行足したとき、数式の参照範囲の形で答えがどう動くかを並べた図。範囲を最終行で固定した数式、つまりSUMIFのB2からB31とF2からF31を参照する形では、佐藤さんの合計が足す前も足したあとも269,500円のまま変わらない。その表の真値は305,500円なので、36,000円ぶん足りない。列ぜんぶを見る数式、つまりSUMIFのB列全体とF列全体を参照する形では、足す前が269,500円、足したあとが305,500円になり、真値と一致する。さらに、返りが添えてくる検算の数式も同じ範囲で書かれている。SUMのF2からF31は31行目までしか見ないので、合計は837,500円のまま変わらず、内訳の3人ぶんを足しても837,500円になる。合計と内訳が一致してしまうため、36,000円足りないことが画面からは分からない。なお、さきほどの数式は直さないでくださいと断ったうえで、数字が変わらない担当がいたらその理由も書いてくださいと頼んだ4回は、4回とも変わりませんと答え、4回とも理由に参照範囲を挙げ、4回ともその表の正しい合計を書いた。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="500"/>
<text class="t-strong" x="18" y="26">足した1行は、エラーも警告も出さずにどこにも入らない</text>
<text class="t-sm" x="18" y="45">架空の売上表（30行）に、佐藤さんの 36,000 円の行を1行足した。担当ごとの合計がどう動くかを、</text>
<text class="t-sm" x="18" y="64">参照範囲の形ごとに並べたもの。数字は SUMIF を実際に計算して出した（表計算ソフトで目視していない）。</text>
<text class="t-sm" x="18" y="83">1行足したあとの佐藤さんの正しい合計は 305,500 円。足す前は 269,500 円で、差は 36,000 円ちょうど。</text>
<text class="t-xs" x="320" y="142" text-anchor="middle">足す前（30行）</text>
<text class="t-xs" x="452" y="142" text-anchor="middle">1行足したあと</text>
<text class="t-xs" x="584" y="142" text-anchor="middle">その表の真値</text>
<text class="t-strong" x="18" y="185">範囲を最終行で固定</text>
<text class="mono" x="18" y="206">=SUMIF($B$2:$B$31, H3, $F$2:$F$31)</text>
<rect class="box-quiet" x="262" y="170" width="116" height="24" rx="4"/>
<text class="t-sm" x="320" y="187" text-anchor="middle">269,500 円</text>
<rect class="box-bad" x="394" y="170" width="116" height="24" rx="4"/>
<text class="t-bad" x="452" y="187" text-anchor="middle">269,500 円</text>
<rect class="box-quiet" x="526" y="170" width="116" height="24" rx="4"/>
<text class="t-sm" x="584" y="187" text-anchor="middle">305,500 円</text>
<text class="t-bad" x="18" y="227">🚨 足した 36,000 円がどこにも入らない（範囲が31行目で切れているため）</text>
<text class="t-strong" x="18" y="259">列ぜんぶを見る</text>
<text class="mono" x="18" y="280">=SUMIF($B:$B, H3, $F:$F)</text>
<rect class="box-quiet" x="262" y="244" width="116" height="24" rx="4"/>
<text class="t-sm" x="320" y="261" text-anchor="middle">269,500 円</text>
<rect class="box-good" x="394" y="244" width="116" height="24" rx="4"/>
<text class="t-good" x="452" y="261" text-anchor="middle">305,500 円</text>
<rect class="box-quiet" x="526" y="244" width="116" height="24" rx="4"/>
<text class="t-sm" x="584" y="261" text-anchor="middle">305,500 円</text>
<rect class="box-bad" x="18" y="314" width="666" height="80" rx="6"/>
<text class="t-bad" x="34" y="339">検算も同じ範囲で書かれている</text>
<text class="t" x="34" y="362">返りが添えてくる =SUM($F$2:$F$31) も31行目までなので、合計は 837,500 のまま。</text>
<text class="t" x="34" y="383">内訳の3人ぶんを足しても 837,500。一致するので、36,000 円足りないことが画面から分からない。</text>
<text class="t-good" x="18" y="416">※ 「さきほどの数式は直さないでください」＋「数字が変わらない担当がいたら、その理由も書いてください」</text>
<text class="t-good" x="18" y="437">　 と頼んだ4回は、4回とも「変わりません」と答え、4回とも理由に範囲を挙げ、4回とも正しい合計を書いた。</text>
<text class="t-sm" x="18" y="458">※ 「この数式で大丈夫ですか」ではなく、変わらなかったこと自体を説明させると、範囲の話が出てくる。</text>
<text class="t-xs" x="18" y="479">架空データでの実測（検算の頼み方は材料2本 × 各2回 ＝ 4回）。生の返りは docs/evidence/ にある。</text>
</svg>
