<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="UdemyについてAIに聞いた結果を並べた表。上6行は原文と一致した回数で、紹介リンク経由97%・Udemy経由37%と述べたのが3/3、Net Amount（アプリ手数料30%を引いた後）に触れたのが3/3、Udemy Businessはプールを視聴分数で按分と述べたのが3/3、材料を貼った回に291,000円と111,000円（差180,000円）を出したのが3/3、ページ名だけの回に数字ゼロでInstructor Revenue Shareを挙げたのが3/3、数字は書かないでの確認順の回に率・金額の数字がゼロだったのが3/3で、いずれも緑。下2行は原文に無いこと・違うことを言った回数で、過去の率・変更時期を述べたのが9/9、Udemy Businessの率を現在17.5%と述べたのが1/3で、いずれも赤。下の枠には、現在の率は素朴に聞いても当たり材料を貼れば1円単位で一致したこと、過去の率や変更時期は9回とも添えられ原文には載っていないこと、率は原文を貼って計算だけさせ、いつ変わったかは聞かないという結論が書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
