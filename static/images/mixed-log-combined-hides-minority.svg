<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="架空のログ21日分（セット2・処理Yが09-10〜09-13だけ停止）の日次総数を積み上げ棒で示した図。下段が処理X、上段が処理Y。処理Yが止まった09-10〜09-13の4日間は、印（青い点）が付いているが、合計の高さは09-04・09-20のようなふだんの少ない日とほぼ同じ範囲に収まっていて、見た目では区別できない。下の枠には、印の4日間は処理Yが0回であること、合計の高さはふだんの少ない日と同程度であること、合算だけ見ると目立たないが処理ごとに分けて見るとYだけ4日連続で0回だと分かることが書かれている。">
