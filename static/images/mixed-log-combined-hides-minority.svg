<text class="t-sm" x="18" y="43">架空のログ21日分（セット2・処理Yが09-10〜09-13だけ停止）。下段＝処理X、上段＝処理Y。</text>
<text class="t-sm" x="18" y="62">「日付ごとに合算の目安と比べて」とだけ頼むと、この4日間は『該当なし』と答えが返った。</text>
