<text class="t-strong" x="18" y="26">出す形を固定しても、判定そのものが2回で入れ替わった</text>
<text class="t-sm" x="18" y="45">1行目の見出し・列の名前・列の数まで指定した保存版を、同じ材料で2回ずつ走らせた。</text>
<text class="t-sm" x="18" y="64">列の名前も行の形も4回とも同じ。違うのは「含む/含まない」の欄の値だけ。</text>
