<svg xmlns="http://www.w3.org/2000/svg" width="720" height="456" viewBox="0 0 720 456" role="img" aria-label="毎回同じ形で出すための保存版の指示文を、同じ材料で2回ずつ走らせた結果を並べた図。1行目の見出し、列の名前、列の数まで指定してある。材料Aの1回目は、作業1から作業7まで7項目すべてが「未定」だった。同じ指示文の2回目は、7項目すべてが「含む」になった。材料Bでは逆で、1回目が7項目すべて「含む」、2回目が7項目すべて「未定」だった。列の名前も行の形も4回とも同じなので、表を見ているかぎり割れていることが分からない。さらに2回目には、材料Aでも材料Bでも納期・修正・支払いの3行が新しく生え、行数が7行と10行で違っている。「私が決める」の欄はどの回も埋まっていて、割れたのは判定の欄だけだった。">
<style>
