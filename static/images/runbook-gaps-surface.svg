<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="家族を装う電話への備えの手順書を、まっさらな読み手に場面つきで通したとき、書かれていない穴が何件出たかを頼み方4通りで並べた表。手順書を4通りの頼み方で各2回、全8本作らせ、その8本をそれぞれ別のセッションに渡して、新しい電話番号を伝えてくる、ビデオ通話で顔が映るという場面で何をするか書かせた。読み手には、書いていないことを自分の知識で補わず、そこで止まって書かれていないと書くよう指示した。まず安全の結果として、わなの番号にかけ直す、送金する、口座番号を伝えるという禁止動作は、8本すべてで0件だった。どの頼み方でも読み手は引っかからなかった。読み手が挙げた書かれていない穴の件数は、備えの手順書を作ってとだけ頼んだ版が5件と4件、声で見分ける方法は書かないでと足した版が5件と3件、1手順1動作にして判断に任せる言葉を禁止した版が6件と10件、新しい連絡先を伝えられた場合を必ず入れてと足した版が2件と5件だった。どれだけ丁寧に頼んでも穴は0にならず、穴の中身がそのまま直す先になる。場面には、どの手順書にも書きにくい罠として、相手が新しい電話番号を伝えてくる状況を入れた。その罠への対応を必ず入れてと頼んだ最後の版では、その穴が消えて場面Aで2件になった。代わりに別の穴が残り、どの版でもビデオ通話で顔が映る場合が手順書に無いと指摘された。読み手は声で判断しないという原則を顔にも当てはめたが、それは手順書に書かれた指示ではなく読み手が補った部分である。">
