<rect class="bg" x="0" y="0" width="720" height="450"/>
<text class="t-strong" x="18" y="26">できた手順書を「初めて読む人」に通すと、書き手が気づかなかった穴が出る</text>
<text class="t-sm" x="18" y="45">家族を装う電話への備えの手順書を、4通りの頼み方で作らせた（各2回・全8本）。その8本を、それぞれ</text>
<text class="t-sm" x="18" y="64">別のまっさらなセッションに渡し、実際の場面（新しい番号を伝えてくる、ビデオ通話で顔が映る）で何をするか書かせた。</text>
<text class="t-sm" x="18" y="83">読み手には「書いていないことを自分の知識で補わず、そこで止まって『書かれていない』と書く」と指示した。</text>
<text class="t-good" x="18" y="112">🚨 わなの番号にかけ直す・送金する・口座番号を伝える —— 8本すべてで 0 件。どの頼み方でも、読み手は引っかからなかった。</text>
<text class="t-xs" x="436" y="128" text-anchor="middle">読み手が挙げた</text>
<text class="t-xs" x="436" y="141" text-anchor="middle">「書かれていない」穴（2回ぶん）</text>
<text class="t" x="18" y="168">「備えの手順書を作って」だけ</text>
<rect class="box-quiet" x="376" y="154" width="120" height="19" rx="4"/>
<text class="t" x="436" y="168" text-anchor="middle">5・4 件</text>
<text class="t" x="18" y="208">＋声で見分ける方法は書かない</text>
<rect class="box-quiet" x="376" y="194" width="120" height="19" rx="4"/>
<text class="t" x="436" y="208" text-anchor="middle">5・3 件</text>
<text class="t" x="18" y="248">＋1手順1動作・判断に任せる言葉を禁止</text>
<rect class="box-quiet" x="376" y="234" width="120" height="19" rx="4"/>
<text class="t" x="436" y="248" text-anchor="middle">6・10 件</text>
<text class="t" x="18" y="288">＋新しい連絡先を伝えられた場合を必ず入れる</text>
<rect class="box-quiet" x="376" y="274" width="120" height="19" rx="4"/>
<text class="t" x="436" y="288" text-anchor="middle">2・5 件</text>
<text class="t" x="18" y="324">※ どれだけ丁寧に頼んでも、穴は0にならなかった。穴の中身がそのまま直す先になる。</text>
<text class="t" x="18" y="345">※ 場面には、どの手順書にも書きにくい罠を入れた＝相手が新しい電話番号を伝えてくる。</text>
<text class="t-good" x="18" y="366">※ その罠への対応を『必ず入れて』と頼んだ最後の版は、その穴が消えた（場面Aで2件）。</text>
<text class="t-bad" x="18" y="387">※ 代わりに別の穴が残った＝どの版でも、ビデオ通話（顔が映る）は手順書に無いと指摘された。</text>
<text class="t-bad" x="18" y="408">　 読み手は『声で判断しない』を顔にも当てはめたが、それは手順書の指示ではなく読み手の補い。</text>
<text class="t-xs" x="18" y="429">架空データでの実測（作る8本・通す8本）。生の返りは docs/evidence/ に全文置いてある。</text>
</svg>
