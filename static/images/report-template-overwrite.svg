<svg xmlns="http://www.w3.org/2000/svg" width="720" height="422" viewBox="0 0 720 422" role="img" aria-label="週報で、型の言葉が今週の事実を上書きした対応を並べた図。メモに「返事なし・担当が出張」とあったものが週報では「検討が進んでいます」に、「今週は動きなし」が「順調に進行中」に、「研修が延期・日程未定」が「日程を調整中」に、「値引きの可否を相談したい」が「特になし」になった。さらにメモに進捗の数字が無いのに「進捗85%」と書かれた。右の文はどれも週報として自然に読めるので、メモと並べるまで書き換わっていることが分からない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="422"/>
<text class="t-strong" x="18" y="26">型の言葉が、今週の事実を上書きする</text>
<text class="t-sm" x="18" y="45">左が今週のメモに書いてあったこと。右が返ってきた週報の文。</text>
<text class="t-xs" x="26" y="92">メモ（本当のこと）</text>
<text class="t-xs" x="400" y="92">週報に出てきた文</text>
<rect class="box-quiet" x="18" y="106" width="300" height="44" rx="5"/>
<text class="t-sm" x="30" y="133">返事なし・担当が出張</text>
<rect class="box-bad" x="392" y="106" width="300" height="44" rx="5"/>
<text class="t-bad" x="404" y="133">検討が進んでいます</text>
<line class="link" x1="326" y1="128.0" x2="384" y2="128.0"/>
<rect class="box-quiet" x="18" y="162" width="300" height="44" rx="5"/>
<text class="t-sm" x="30" y="189">今週は動きなし</text>
<rect class="box-bad" x="392" y="162" width="300" height="44" rx="5"/>
<text class="t-bad" x="404" y="189">順調に進行中</text>
<line class="link" x1="326" y1="184.0" x2="384" y2="184.0"/>
<rect class="box-quiet" x="18" y="218" width="300" height="44" rx="5"/>
<text class="t-sm" x="30" y="245">研修が延期・日程未定</text>
<rect class="box-bad" x="392" y="218" width="300" height="44" rx="5"/>
<text class="t-bad" x="404" y="245">日程を調整中</text>
<line class="link" x1="326" y1="240.0" x2="384" y2="240.0"/>
<rect class="box-quiet" x="18" y="274" width="300" height="44" rx="5"/>
<text class="t-sm" x="30" y="301">値引きの可否を相談したい</text>
<rect class="box-bad" x="392" y="274" width="300" height="44" rx="5"/>
<text class="t-bad" x="404" y="301">特になし</text>
<line class="link" x1="326" y1="296.0" x2="384" y2="296.0"/>
<rect class="box-quiet" x="18" y="330" width="300" height="44" rx="5"/>
<text class="t-sm" x="30" y="357">（メモに進捗の数字なし）</text>
<rect class="box-bad" x="392" y="330" width="300" height="44" rx="5"/>
<text class="t-bad" x="404" y="357">進捗85%</text>
<line class="link" x1="326" y1="352.0" x2="384" y2="352.0"/>
<text class="t-xs" x="18" y="408">※ 右の文はどれも週報として自然に読める。メモと並べるまで、書き換わっていることが分からない。</text>
</svg>
