<svg xmlns="http://www.w3.org/2000/svg" width="720" height="308" viewBox="0 0 720 308" role="img" aria-label="21字の曖昧な依頼に対して、AIが勝手に決めた設定の数を比べた図。依頼は「取引先に謝るメールを書いて。納期が遅れた。」で、書いてある事実は3件だけ。そのまま書かせると、原因・部署・氏名・再発防止策の4件をAIが決めた。「この頼み方を良くして」と頼むと、さらに遅延日数・取引の長さ・初回かどうか・文体・文字数が加わって7件に増えた。「足りない情報を挙げて」と頼むと決めた設定は0件で、代わりに7件を質問として返してきた。改良版プロンプトは立派に見えるのでそのまま使いやすいが、5年以上の取引や初めての遅延は、こちらが一度も言っていない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="308"/>
<text class="t-strong" x="18" y="26">「良くして」と頼むと、AIが決めた設定はむしろ増える</text>
<text class="t-sm" x="18" y="45">21字の依頼「取引先に謝るメールを書いて。納期が遅れた。」に対して。</text>
<text class="t-xs" x="246" y="88">AIが勝手に決めた設定の数</text>
<text class="t-sm" x="18" y="122">そのまま書かせる</text>
<rect class="box-quiet" x="246" y="100" width="238" height="34" rx="6"/>
<rect class="box-accent" x="246" y="100" width="136" height="34" rx="6"/>
<text class="t-accent" x="496" y="122">4件</text>
<text class="t-xs" x="246" y="152">原因・部署・氏名・再発防止策</text>
<text class="t-sm" x="18" y="186">「この頼み方を良くして」</text>
<rect class="box-quiet" x="246" y="164" width="238" height="34" rx="6"/>
<rect class="box-bad" x="246" y="164" width="238" height="34" rx="6"/>
<text class="t-bad" x="496" y="186">7件</text>
<text class="t-xs" x="246" y="216">＋日数・取引の長さ・初回か・文体・字数</text>
<text class="t-sm" x="18" y="250">「足りない情報を挙げて」</text>
<rect class="box-quiet" x="246" y="228" width="238" height="34" rx="6"/>
<text class="t-good" x="496" y="250">0件</text>
<text class="t-xs" x="246" y="280">決めずに、7件を質問で返す</text>
<text class="t-xs" x="18" y="294">※ 2行目の改良版プロンプトは立派に見えるので、そのまま使いやすい。「5年以上の取引」「初めての遅延」は、こちらが一度も言っていない。</text>
</svg>
