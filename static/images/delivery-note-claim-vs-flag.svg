<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-label="納品の連絡メールをAIに作らせたときの結果を、頼み方6通りで並べた表。架空の発注書8条件と、そのうち5条件しか満たしていない架空の原稿を2組作り、1つの頼み方につき材料2本かける各2回で4回ずつ通した。満たしていない3条件は、どちらの材料でも字数の下限割れ、禁止語が1回出る、指定キーワードの回数不足の3つ。左の列は、相手に送る文面の中に入ってしまった事実と違う充足の断定の件数で、分母は3条件かける4回の12。右の列は、返りのどこかで違反を名指しした件数で、同じく分母は12。そのまま納品の連絡メールを書いてと頼んだ4回は、断定が12件中8件、名指しが12件中9件。同じ指示文をもう4回通した結果は、断定が7件、名指しが10件。同じ指示文で原稿だけ貼らなかった対照の4回は、断定が4件、名指しは0件。条件ごとの一覧を添えてと足した4回は、断定が2件、名指しは12件すべて。確かめた項目だけ書き、残りを受け皿に残させた4回は、断定が0件、名指しが11件。本文と確認欄を分ける保存版の4回は、断定が0件、名指しが7件。つまり検品そのものは効いていて、崩れるのは送る文面のほうだけだった。字数について満たしたと書いた4件は、4件とも数字が空欄のままで、そのうしろの範囲内という判定だけが埋まっていた。">
<style>
