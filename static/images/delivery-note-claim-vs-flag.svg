<rect class="bg" x="0" y="0" width="720" height="470"/>
<text class="t-strong" x="18" y="26">検品は効く。それでも、送る文面のほうには「満たしています」と書かれる</text>
<text class="t-sm" x="18" y="45">架空の発注書8条件と、そのうち5条件しか満たしていない架空の原稿を2組（記事執筆・商品ページ）作って通した。</text>
<text class="t-sm" x="18" y="64">満たしていない3条件は、どちらの材料でも字数の下限割れ・禁止語1回・指定キーワードの回数不足。</text>
<text class="t-sm" x="18" y="83">1つの頼み方につき、材料2本 × 各2回 ＝ 4回。分母はどちらも 3条件 × 4回 ＝ 12。</text>
<text class="t-sm" x="18" y="102">※ 3行目は対照＝原稿を貼らない回。見ていないので名指しは0件だが、断定のほうは入る。</text>
<text class="t-xs" x="418" y="102" text-anchor="middle">送る文面に入った</text>
<text class="t-xs" x="418" y="115" text-anchor="middle">事実と違う断定</text>
<text class="t-xs" x="598" y="102" text-anchor="middle">返りのどこかで</text>
<text class="t-xs" x="598" y="115" text-anchor="middle">違反を名指し</text>
<text class="t" x="18" y="146">そのまま「納品の連絡メールを書いて」</text>
<rect class="box-bad" x="381" y="132" width="74" height="19" rx="4"/>
<text class="t-bad" x="418" y="146" text-anchor="middle">8 / 12</text>
<rect class="box-quiet" x="561" y="132" width="74" height="19" rx="4"/>
<text class="t" x="598" y="146" text-anchor="middle">9 / 12</text>
<text class="t" x="18" y="180">同じ指示文を、もう4回</text>
<rect class="box-bad" x="381" y="166" width="74" height="19" rx="4"/>
<text class="t-bad" x="418" y="180" text-anchor="middle">7 / 12</text>
<rect class="box-quiet" x="561" y="166" width="74" height="19" rx="4"/>
<text class="t" x="598" y="180" text-anchor="middle">10 / 12</text>
<text class="t" x="18" y="214">同じ指示文で、原稿だけ貼らない</text>
<rect class="box-bad" x="381" y="200" width="74" height="19" rx="4"/>
<text class="t-bad" x="418" y="214" text-anchor="middle">4 / 12</text>
<rect class="box-quiet" x="561" y="200" width="74" height="19" rx="4"/>
<text class="t" x="598" y="214" text-anchor="middle">0 / 12</text>
<text class="t" x="18" y="248">＋「条件ごとの一覧を添えて」</text>
<rect class="box-bad" x="381" y="234" width="74" height="19" rx="4"/>
<text class="t-bad" x="418" y="248" text-anchor="middle">2 / 12</text>
<rect class="box-quiet" x="561" y="234" width="74" height="19" rx="4"/>
<text class="t" x="598" y="248" text-anchor="middle">12 / 12</text>
<text class="t" x="18" y="282">＋確かめた項目だけ書く（受け皿つき）</text>
<rect class="box-good" x="381" y="268" width="74" height="19" rx="4"/>
<text class="t-good" x="418" y="282" text-anchor="middle">0 / 12</text>
<rect class="box-quiet" x="561" y="268" width="74" height="19" rx="4"/>
<text class="t" x="598" y="282" text-anchor="middle">11 / 12</text>
<text class="t" x="18" y="316">保存版＝【本文】と【確認欄】を分ける</text>
<rect class="box-good" x="381" y="302" width="74" height="19" rx="4"/>
<text class="t-good" x="418" y="316" text-anchor="middle">0 / 12</text>
<rect class="box-quiet" x="561" y="302" width="74" height="19" rx="4"/>
<text class="t" x="598" y="316" text-anchor="middle">7 / 12</text>
<text class="t-bad" x="18" y="344">※ 同じ返りの中で起きる。上の1行目と2行目は同じ指示文で、合わせて8回。</text>
<text class="t-bad" x="18" y="365">　 自分で「満たしていません」と書いた条件を、文面では「満たしています」と書いた件数が11件。</text>
<text class="t-bad" x="18" y="386">※ 字数について「満たした」と書いた4件は、4件とも数字が空欄のままだった。</text>
<text class="t-bad" x="18" y="407">　 「〇〇〇〇字（1,900〜2,200字の範囲内）」＝穴が空くのは数字だけで、判定のほうは埋まっている。</text>
<text class="t-good" x="18" y="428">※ 下の2行は、指摘を減らさずに断定だけを0にした。受け皿と、様式で分けた版。</text>
<text class="t-xs" x="18" y="449">架空データでの実測（全28回）。生の返りと判定コードは docs/evidence/ に全文置いてある。</text>
</svg>
