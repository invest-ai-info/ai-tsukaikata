<rect class="bg" x="0" y="0" width="720" height="384"/>
<text class="t-strong" x="18" y="26">料率は混ざらない。ただし書かれていない条件は、実在名だと作り話で埋める</text>
<text class="t-sm" x="18" y="45">note・Kindle・YouTubeの架空売上3行をまとめ、手取りと振込の有無を計15回試した。</text>
<text class="t-sm" x="18" y="64">他社の料率（note5%・YouTube45%など）を取り違えた回は、まとめても単独でも0回。</text>
<text class="t-sm" x="18" y="83">Kindleの振込条件だけ材料に書かず単独で聞くと、3回とも実在KDPの周期で埋めた。</text>
<text class="t-xs" x="230.0" y="126">料率の取り違え</text>
<text class="t-xs" x="405.0" y="126">振込条件の作り話</text>
<text class="t-sm" x="18" y="160">版1　まとめて素朴に聞く（3回）</text>
<rect class="box-good" x="230" y="138" width="165" height="34" rx="4"/>
<text class="t-good" x="295.7" y="160">0/3</text>
<rect class="box-bad" x="405" y="138" width="165" height="34" rx="4"/>
<text class="t-bad" x="470.7" y="160">2/3</text>
<text class="t-sm" x="18" y="204">版2　＋『補わない』を明記（3回）</text>
<rect class="box-good" x="230" y="182" width="165" height="34" rx="4"/>
<text class="t-good" x="295.7" y="204">0/3</text>
<rect class="box-good" x="405" y="182" width="165" height="34" rx="4"/>
<text class="t-good" x="470.7" y="204">0/3</text>
<text class="t-sm" x="18" y="248">版3　Kindleだけ単独で（3回）</text>
<rect class="box-quiet" x="230" y="226" width="165" height="34" rx="4"/>
<text class="t-sm" x="306.9" y="248">—</text>
<rect class="box-bad" x="405" y="226" width="165" height="34" rx="4"/>
<text class="t-bad" x="470.7" y="248">3/3</text>
<text class="t-sm" x="18" y="292">版4　単独＋『補わない』（2回）</text>
<rect class="box-quiet" x="230" y="270" width="165" height="34" rx="4"/>
<text class="t-sm" x="306.9" y="292">—</text>
<rect class="box-good" x="405" y="270" width="165" height="34" rx="4"/>
<text class="t-good" x="470.7" y="292">0/2</text>
<text class="t-xs" x="18" y="347">※「振込条件の作り話」＝材料に無い実在サービスの支払い周期・最低額を断定した回。</text>
<text class="t-xs" x="18" y="368">架空データでの実測（全15回）。生の返りは docs/evidence/ に全文置いてある。</text>
</svg>
