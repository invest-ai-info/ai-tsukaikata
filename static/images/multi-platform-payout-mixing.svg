<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" role="img" aria-label="note・Kindle・YouTubeの架空売上3行をまとめて聞いたときの、料率の取り違えと書かれていない振込条件の作り話を並べたマス目。版1（まとめて素朴に聞く・3回）は料率の取り違えが0/3、振込条件の作り話が2/3。版2（＋『補わない』を明記・3回）は取り違え0/3、作り話0/3。版3（Kindleだけ単独で・3回）は比べる相手がいないため取り違えは対象外（—）、作り話は3/3。版4（単独＋『補わない』・2回）も取り違えは対象外（—）、作り話は0/2。プラットフォーム固有の料率が行をまたいで混ざることはどの版でも起きなかったが、材料に書いていない振込条件は、実在のKindle(KDP)について単独で聞くほど作り話で埋められやすかった。">
<style>
