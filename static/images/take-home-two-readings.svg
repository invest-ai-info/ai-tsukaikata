<rect class="bg" x="0" y="0" width="720" height="432"/>
<text class="t-strong" x="18" y="26">同じ契約額から、手取りが2通り出る</text>
<text class="t-sm" x="18" y="45">架空の契約金額 120,000円（税抜）。公表されている料率（10万円以下の部分 20%／10万円超20万円</text>
<text class="t-sm" x="18" y="64">以下の部分 10%）と、公式の計算例の順（税込にしてから率を掛ける）を、そのまま当てはめた。</text>
<text class="t-sm" x="18" y="83">分かれ目は1点だけ——段を分ける「10万円」を、税込の額で見るか税抜の額で見るか。</text>
<text class="t-bad" x="18" y="107">🚨 どちらが正しいかは、料率のページに書かれていない（2026-08-21 に開いて確認）。</text>
<rect class="box-quiet" x="18" y="138" width="330" height="118" rx="6"/>
<text class="t-strong" x="32" y="164">段の基準を「税込 132,000円」で分ける</text>
<text class="mono" x="32" y="188">10万円まで  100,000 × 20% = 20,000</text>
<text class="mono" x="32" y="207">残り         32,000 × 10% =  3,200</text>
<text class="t-sm" x="32" y="230">利用料 23,200 ＋ 消費税 2,320 ＝ 25,520</text>
<text class="t-accent" x="32" y="249">手取り 106,480 円</text>
<rect class="box-quiet" x="366" y="138" width="330" height="118" rx="6"/>
<text class="t-strong" x="380" y="164">段の基準を「税抜 120,000円」で分ける</text>
<text class="mono" x="380" y="188">10万円まで  100,000 × 20% = 20,000</text>
<text class="mono" x="380" y="207">残り         20,000 × 10% =  2,000</text>
<text class="t-sm" x="380" y="230">利用料 22,000 ＋ 消費税 2,200 ＝ 24,200</text>
<text class="t-accent" x="380" y="249">手取り 107,800 円</text>
<rect class="box-bad" x="18" y="276" width="678" height="46" rx="6"/>
<text class="t-bad" x="34" y="305">差 1,320 円。契約額の 1.1% にあたる。どちらで計算したかを書かないと、受け取ってから気づく。</text>
<text class="t-sm" x="18" y="348">※ 表の見出しは「報酬額」とだけあり、税込か税抜かを示す行が無い。</text>
<text class="t-sm" x="18" y="369">※ 公式の計算例は契約 10,000円（税抜）の1通りだけ。この額は10万円を超えないので、段を分ける場面が出てこない。</text>
<text class="t-good" x="18" y="390">※ 「書かれていますか。書かれていれば行を写して、なければ『書かれていません』とだけ」と聞いた3回は、3回とも正解した。</text>
<text class="t-xs" x="18" y="411">架空データでの実測（全26回）。生の返りと照合コードは docs/evidence/ に全文置いてある。料率は変わるので、使う前に開いて確かめること。</text>
</svg>
