<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" role="img" aria-label="架空の契約金額12万円（税抜）について、手数料の段を分ける基準を税込の132,000円で見るか税抜の120,000円で見るかで、手取りが2通りに分かれることを示した図。税込の132,000円で分けると、10万円までの100,000円に20パーセントで20,000円、残りの32,000円に10パーセントで3,200円、システム利用料は23,200円に消費税2,320円を足して25,520円となり、手取りは106,480円になる。税抜の120,000円で分けると、10万円までの100,000円に20パーセントで20,000円、残りの20,000円に10パーセントで2,000円、利用料は22,000円に消費税2,200円を足して24,200円となり、手取りは107,800円になる。差は1,320円で、契約額の1.1パーセントにあたる。どちらが正しいかは料率のページに書かれていない。2026年8月21日に開いて確認したところ、表の見出しは報酬額とだけあり、税込か税抜かを示す行が無かった。公式の計算例は契約10,000円（税抜）の1通りだけで、この額は10万円を超えないため、段を分ける場面が例には出てこない。なお、書かれていますか、書かれていれば行を写して、なければ書かれていませんとだけ、と聞いた3回は3回とも正解した。">
