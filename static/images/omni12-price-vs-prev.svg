<svg xmlns="http://www.w3.org/2000/svg" width="720" height="388" viewBox="0 0 720 388" role="img" aria-label="Gemini Omni 1.1 Flashから1.2 Flashへの、解像度別・秒あたり価格の変化を示す横棒グラフ。音声付き動画・秒あたりのドル。薄い灰＝旧モデル、濃い青＝新モデル。360pは0.034ドルから0.023ドルへ約31%減、720pは0.10ドルから0.07ドルへ約31%減（この720pの新価格は発表ページ本文に直接書かれている）、1080pは0.15ドルから0.10ドルへ約31%減、4Kは0.30ドルから0.21ドルへ約31%減。360p/1080p/4Kはこの記事が料金ページのトークン数から計算した値。">
