<svg xmlns="http://www.w3.org/2000/svg" width="720" height="394" viewBox="0 0 720 394" role="img" aria-label="AIが出典に無い数字を作った経緯を示した表。GPT-5.6-sol は短い入力5ドルが長い入力10ドル（2倍）、出力30ドルが45ドル（1.5倍）。GPT-5.6-terra も2ドルが4ドル（2倍）、12ドルが18ドル（1.5倍）。ここまでは料金ページに書いてある値。ところが gpt-5.5-pro には長い入力の行が無いのに、同じ倍率を当てはめて60ドルと270ドルという値が書かれていた。出典URLは正しかったが、その数字はページに無かった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="394"/>
<text class="t-strong" x="18" y="26">出典に無い数字が、どうやって出てきたか</text>
<text class="t-sm" x="18" y="45">上4行は料金ページに書いてあった値。下2行は書いていないのに出てきた値。</text>
<text class="t-sm" x="18" y="64">かかっている倍率が、上の行とぴったり同じでした。</text>
<text class="t-xs" x="210" y="84">短い入力</text>
<text class="t-xs" x="330" y="84">長い入力</text>
<text class="t-xs" x="450" y="84">倍率</text>
<text class="t-strong" x="22" y="96">GPT-5.6-sol</text>
<text class="t" x="210" y="96">$5</text>
<text class="t" x="330" y="96">$10</text>
<text class="t-accent" x="450" y="96">×2</text>
<text class="t-sm" x="560" y="96">出典にある</text>
<text class="t" x="210" y="142">$30</text>
<text class="t" x="330" y="142">$45</text>
<text class="t-accent" x="450" y="142">×1.5</text>
<text class="t-sm" x="560" y="142">出典にある</text>
<text class="t-strong" x="22" y="188">GPT-5.6-terra</text>
<text class="t" x="210" y="188">$2</text>
<text class="t" x="330" y="188">$4</text>
<text class="t-accent" x="450" y="188">×2</text>
<text class="t-sm" x="560" y="188">出典にある</text>
<text class="t" x="210" y="234">$12</text>
<text class="t" x="330" y="234">$18</text>
<text class="t-accent" x="450" y="234">×1.5</text>
<text class="t-sm" x="560" y="234">出典にある</text>
<rect class="box-bad" x="14" y="262" width="690" height="38" rx="4"/>
<text class="t-strong" x="22" y="280">gpt-5.5-pro</text>
<text class="t" x="210" y="280">$30</text>
<text class="t" x="330" y="280">$60 ?</text>
<text class="t-accent" x="450" y="280">×2</text>
<text class="t-bad" x="560" y="280">出典に無い</text>
<rect class="box-bad" x="14" y="308" width="690" height="38" rx="4"/>
<text class="t" x="210" y="326">$180</text>
<text class="t" x="330" y="326">$270 ?</text>
<text class="t-accent" x="450" y="326">×1.5</text>
<text class="t-bad" x="560" y="326">出典に無い</text>
<text class="t-xs" x="18" y="382">※ 出典URLは正しく付いていました。そのページに、その数字が無かっただけです。</text>
</svg>
