<svg xmlns="http://www.w3.org/2000/svg" width="720" height="378" viewBox="0 0 720 378" role="img" aria-label="返信のあとに自動で付く説明欄に個人情報が漏れた割合を条件別に示す横棒グラフ。素朴に頼んだ場合は6回とも説明欄が付き、そのうち4回(67%)に伏せたはずの同伴者名・個室や座席の番号・スタッフ実名がそのまま書かれていた。「個人情報には触れないでください」を足した場合は6回とも説明欄は付いたが漏えいは0件。伏せる項目を名前で指定した場合は4回中2回は説明欄自体が付かず、付いた2回も漏えいは0件だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="378"/>
<text class="t-strong" x="18" y="26">素朴に頼むと、返信の下の「説明欄」に名前が戻ってくる（6回中4回）</text>
<text class="t-sm" x="18" y="45">AIは返信のあとに「ここがポイントです」という説明を自動で付けることが多く、そこに伏せた名前を再び書く。</text>
<text class="t-sm" x="18" y="64">返信案をまるごとコピーすると、本文は安全でも説明欄ごと公開されてしまう。</text>
<line class="line" x1="280.0" y1="142" x2="280.0" y2="148"/>
<text class="t-xs" x="280.0" y="136" text-anchor="middle">0%</text>
<line class="line" x1="367.5" y1="142" x2="367.5" y2="148"/>
<text class="t-xs" x="367.5" y="136" text-anchor="middle">25%</text>
<line class="line" x1="455.0" y1="142" x2="455.0" y2="148"/>
<text class="t-xs" x="455.0" y="136" text-anchor="middle">50%</text>
<line class="line" x1="542.5" y1="142" x2="542.5" y2="148"/>
<text class="t-xs" x="542.5" y="136" text-anchor="middle">75%</text>
<line class="line" x1="630.0" y1="142" x2="630.0" y2="148"/>
<text class="t-xs" x="630.0" y="136" text-anchor="middle">100%</text>
<line class="line" x1="280.0" y1="145" x2="630.0" y2="145"/>
<text class="t" x="18" y="163">素朴に頼む</text>
<text class="t-xs" x="18" y="178">(説明欄は6回とも付く)</text>
<rect class="box" x="280.0" y="162.0" width="350.0" height="24"/>
<rect class="box-bad" x="280.0" y="162.0" width="233.5" height="24"/>
<text class="t-bad" x="521.5" y="179" style="font-size:12.5px">4/6回</text>
<text class="t" x="18" y="241">＋「個人情報には触れないで」</text>
<text class="t-xs" x="18" y="256">(説明欄は6回とも付く)</text>
<rect class="box" x="280.0" y="240.0" width="350.0" height="24"/>
<text class="t-good" x="288.0" y="257" style="font-size:12.5px">0/6回</text>
<text class="t" x="18" y="319">＋伏せる項目を名前で指定する</text>
<text class="t-xs" x="18" y="334">(説明欄は2回しか付かない)</text>
<rect class="box" x="280.0" y="318.0" width="350.0" height="24"/>
<text class="t-good" x="288.0" y="335" style="font-size:12.5px">0/4回</text>
</svg>
