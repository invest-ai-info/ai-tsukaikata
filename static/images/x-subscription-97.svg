<svg xmlns="http://www.w3.org/2000/svg" width="720" height="399" viewBox="0 0 720 399" role="img" aria-label="Xのサブスクリプションが1件売れたときの残額を、横棒3本で上から並べた図。1本目はサブスクの金額5.00ドル（iOSアプリ経由）。2本目はAppleのアプリ内購入手数料30%を引いた3.50ドル（−1.50ドル）。3本目は残った額の最大97%がクリエイターへ渡った3.39ドル。つまり最大97%は定価5.00ドルではなく、手数料を引いた後の額に掛かる。下の枠には、手元に残る3.39ドルは定価の67.8%（この割合は記事の割り算）、引かれた合計1.61ドル（5.00−3.39。この引き算も記事のもの）のうち1.50ドルはApple、と書かれている。さらに3つの注記——この内訳例はiOSアプリで購入された場合のみでウェブ経由は含まれないこと、原文には「0.10ドル - 収益からXが得る最低金額」の行も併記されていること、サブスクの最低支払額50ドルは収益配分の10ドルとは別の数字であること。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="399"/>
<text class="t-strong" x="18" y="26">「最大97%」は、5.00ドルの97%ではない</text>
<text class="t-sm" x="18" y="45">Xのサブスクリプション（フォロワーが払う側の道）。原文の内訳例4行に、差引後の額を補って並べた。</text>
<text class="t-sm" x="18" y="64">97%が掛かるのは「アプリ内購入手数料を差し引いた後」の3.50ドル。定価には掛からない。</text>
<text class="t-xs" x="330" y="96">残額（ドル）</text>
<text class="t" x="18" y="134">サブスクの金額（iOSアプリ経由）</text>
<rect class="bar-out" x="330" y="119" width="250" height="20" rx="3"/>
<text class="t-strong" x="588" y="134">5.00ドル</text>
<text class="t" x="18" y="180">Appleのアプリ内購入手数料 30% を引く</text>
<rect class="bar-in" x="330" y="165" width="175" height="20" rx="3"/>
<text class="t-strong" x="513" y="180">3.50ドル（－1.50ドル）</text>
<text class="t" x="18" y="226">残った額の最大97%がクリエイターへ</text>
<rect class="bar-out" x="330" y="211" width="170" height="20" rx="3"/>
<text class="t-strong" x="508" y="226">3.39ドル</text>
<rect class="box-accent" x="18" y="262" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="282">手元に残る3.39ドルは、定価5.00ドルの67.8%（この割合はこの記事の割り算）。</text>
<text class="t-accent" x="34" y="300">引かれた合計1.61ドル（5.00−3.39。この引き算も記事のもの）のうち1.50ドルはApple。</text>
<text class="t-sm" x="18" y="332">※ この内訳例はiOSアプリで購入された場合のみ。ウェブ経由は含まれないと原文が明記している。</text>
<text class="t-xs" x="18" y="351">※ 原文には「0.10ドル - 収益からXが得る最低金額」の行も併記されている。</text>
<text class="t-xs" x="18" y="370">※ サブスクの最低支払額は50ドル。収益配分（10ドル）とは別の数字なので混ぜない。</text>
</svg>
