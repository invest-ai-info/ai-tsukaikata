<rect class="bg" x="0" y="0" width="720" height="474"/>
<text class="t-strong" x="18" y="26">お手本1行だけでも、指示文だけでも同じ。崩れたのは両方書いて食い違わせた版だけ</text>
<text class="t-sm" x="18" y="45">架空の記録を2本（副業の作業記録／家計の買い物メモ）。毎日ひとつの走り書きを渡して、1行だけ</text>
<text class="t-sm" x="18" y="64">追記させる。前の日の返りをそのまま次の日の入力にして3日ぶん回した。日々の依頼文は6版とも</text>
<text class="t-sm" x="18" y="83">一字一句同じで、振ったのは「書式をどこで伝えるか」だけ。6版 × 材料2本 × 各2回 × 3回転 ＝ 全72回。</text>
<text class="t-xs" x="402" y="118">追記された行が規定の形だった回（のべ12回転ぶん）</text>
<text class="t" x="18" y="147">(a) ファイルは見出しだけ・指示文に書式を書かない</text>
<text class="t-bad" x="408" y="147">0/12</text>
<text class="t" x="18" y="181">(b) ファイルは見出しだけ・指示文で書式を説明</text>
<rect class="bar-out" x="402" y="167" width="200" height="19" rx="3"/>
<text class="t-accent" x="608" y="181">12/12</text>
<text class="t" x="18" y="215">(c) お手本を1行だけファイルに置く・指示文には書かない</text>
<rect class="bar-out" x="402" y="201" width="200" height="19" rx="3"/>
<text class="t-accent" x="608" y="215">12/12</text>
<text class="t" x="18" y="249">(d) お手本1行＋指示文でも説明</text>
<rect class="bar-out" x="402" y="235" width="200" height="19" rx="3"/>
<text class="t-accent" x="608" y="249">12/12</text>
<text class="t" x="18" y="283">(e) お手本はスラッシュ、指示文の説明はカンマ</text>
<text class="t-bad" x="408" y="283">0/12</text>
<text class="t" x="18" y="317">(f) お手本1行＋「ファイルにある行と同じ形に」</text>
<rect class="bar-out" x="402" y="303" width="200" height="19" rx="3"/>
<text class="t-accent" x="608" y="317">12/12</text>
<text class="t-bad" x="18" y="348">※ (a) の0件は「ばらけた」ではない。3日とも同じ形にはそろっている。</text>
<text class="t-bad" x="18" y="369">   ただしその形を決めたのは、初日の走り書きの見た目のほうだった。</text>
<text class="t-bad" x="18" y="390">🚨 (e) は12回とも指示文の側（カンマ）に従い、ファイルのお手本（スラッシュ）に従った回は0。</text>
<text class="t-good" x="18" y="411">※ (b)(c)(d)(f) は、日付の書き方も区切り記号も末尾の単位も、12回とも規定どおり。</text>
<text class="t-good" x="18" y="432">※ 追記が1行でなかった回は72回中0回。すでにある行が1文字でも変わった回も0回。</text>
<text class="t-xs" x="18" y="453">架空データでの実測（全72回）。生の返りは docs/evidence/ に全文置いてある。</text>
</svg>
