<svg xmlns="http://www.w3.org/2000/svg" width="720" height="474" viewBox="0 0 720 474" role="img" aria-label="テキストファイルに毎日1行ずつAIに追記させるとき、書式をどこで伝えるかを6通りに振って、追記された行が規定の形になった回数を並べた横棒グラフ。架空の記録を2本、副業の作業記録と家計の買い物メモで用意し、前の日の返りをそのまま次の日の入力にして3日ぶん回した。日々の依頼文は6版とも一字一句同じで、振ったのは書式をどこで伝えるかだけである。6版かける材料2本かける各2回かける3回転で全72回。ファイルは見出しだけで指示文にも書式を書かない版は12回中0回。ファイルは見出しだけで指示文で書式を説明した版は12回中12回。お手本を1行だけファイルに置いて指示文には書かない版も12回中12回。お手本1行と指示文の説明の両方を置いた版も12回中12回。お手本はスラッシュ区切りなのに指示文の説明をカンマ区切りにした版は12回中0回で、12回とも指示文の側に従い、ファイルのお手本に従った回は0回だった。お手本1行にファイルにある行と同じ形にという一文を添えた版は12回中12回。追記が1行でなかった回は72回中0回、すでにある行が1文字でも変わった回も0回である。">
<style>
