<rect class="bg" x="0" y="0" width="720" height="588"/>
<text class="t-strong" x="18" y="26">4本すべてに共通した文は、挨拶と見出しだけだった</text>
<text class="t-sm" x="18" y="45">架空の募集文2本（記事執筆／手順書の清書）を一字一句そのまま固定し、渡すものだけを3通りに</text>
<text class="t-sm" x="18" y="64">振って、それぞれ4本ずつ ＝ 全24本。突き合わせは Python の文字列照合だけ（AIには判定させていない）。</text>
<text class="t-sm" x="18" y="83">全角半角と空白をそろえ、句点で文に分けてから、4本すべてに現れた文を数えた。</text>
<text class="t-xs" x="445" y="126" text-anchor="middle">そのまま</text>
<text class="t-xs" x="445" y="140" text-anchor="middle">比べる</text>
<text class="t-xs" x="565" y="126" text-anchor="middle">項目名と番号を</text>
<text class="t-xs" x="565" y="140" text-anchor="middle">落として比べる</text>
<text class="t" x="18" y="172">(a) 募集文だけ／記事執筆</text>
<rect class="bar-in" x="400" y="159" width="36" height="18" rx="3"/>
<text class="t-sm" x="443" y="172">2件</text>
<rect class="bar-out" x="520" y="159" width="18" height="18" rx="3"/>
<text class="t-sm" x="545" y="172">1件</text>
<text class="t" x="18" y="212">(a) 募集文だけ／手順書の清書</text>
<rect class="bar-in" x="400" y="199" width="54" height="18" rx="3"/>
<text class="t-sm" x="461" y="212">3件</text>
<rect class="bar-out" x="520" y="199" width="36" height="18" rx="3"/>
<text class="t-sm" x="563" y="212">2件</text>
<text class="t" x="18" y="252">(b) ＋素材メモ／記事執筆</text>
<rect class="bar-in" x="400" y="239" width="36" height="18" rx="3"/>
<text class="t-sm" x="443" y="252">2件</text>
<rect class="bar-out" x="520" y="239" width="36" height="18" rx="3"/>
<text class="t-sm" x="563" y="252">2件</text>
<text class="t" x="18" y="292">(b) ＋素材メモ／手順書の清書</text>
<rect class="bar-in" x="400" y="279" width="36" height="18" rx="3"/>
<text class="t-sm" x="443" y="292">2件</text>
<rect class="bar-out" x="520" y="279" width="36" height="18" rx="3"/>
<text class="t-sm" x="563" y="292">2件</text>
<text class="t" x="18" y="332">(c) ＋なぜこの案件か1行／記事執筆</text>
<rect class="bar-in" x="400" y="319" width="90" height="18" rx="3"/>
<text class="t-sm" x="497" y="332">5件</text>
<rect class="bar-out" x="520" y="319" width="36" height="18" rx="3"/>
<text class="t-sm" x="563" y="332">2件</text>
<text class="t" x="18" y="372">(c) ＋なぜこの案件か1行／手順書の清書</text>
<rect class="bar-in" x="400" y="359" width="72" height="18" rx="3"/>
<text class="t-sm" x="479" y="372">4件</text>
<rect class="bar-out" x="520" y="359" width="36" height="18" rx="3"/>
<text class="t-sm" x="563" y="372">2件</text>
<rect class="box-quiet" x="18" y="406" width="678" height="72" rx="6"/>
<text class="t-strong" x="34" y="430">残った文の中身</text>
<text class="mono" x="34" y="452">「はじめまして」／「■ ご指定の5点」／「3. これまでに書いた記事の有無：あります」</text>
<text class="t-sm" x="34" y="471">3つ目は、素材メモを渡していない版にだけ出てくる（渡した版では中身つきの文になる）。</text>
<text class="t-bad" x="18" y="504">※ 「はじめまして」は 24/24本、「よろしくお願いいたします」も 24/24本。冒頭の1文は、どの4本組でも4本とも同じ。</text>
<text class="t-sm" x="18" y="525">※ (c) だけ「そのまま比べる」が 4〜5件に増える。素材を渡したぶん単価・時間・日数の行がまるごと一致するため。</text>
<text class="t-sm" x="18" y="546">　 項目名と番号を落とすと (b) と同じ2件に戻る。増えたのは中身が被ったからではない。</text>
<text class="t-xs" x="18" y="567">架空データでの実測（全24本）。生の返りと照合コードは docs/evidence/ に全文置いてある。</text>
</svg>
