<svg xmlns="http://www.w3.org/2000/svg" width="720" height="588" viewBox="0 0 720 588" role="img" aria-label="架空の募集文2本から作った提案文24本について、同じ募集文・同じ頼み方の4本すべてに現れた文の数を、当て方2通りで並べた横棒グラフ。募集文だけを渡した版は、そのまま比べると記事執筆で2件、手順書の清書で3件。項目名と行頭の番号を落として比べると、それぞれ1件と2件に減る。素材メモを足した版は、そのまま比べても落として比べても、どちらの募集文でも2件。なぜこの案件かを1行書かせた版は、そのまま比べると記事執筆で5件、手順書の清書で4件だが、項目名と番号を落とすと どちらも2件に戻る。残った文の中身は、はじめまして、ご指定の5点という見出し、そして、これまでに書いた記事の有無はありますという行の3つだけだった。3つ目は素材メモを渡していない版にだけ出てくる。なお、はじめましては24本すべて、よろしくお願いいたしますも24本すべてに出ており、冒頭の1文はどの4本組でも4本とも同じである。なぜこの案件かを1行書かせた版でそのまま比べた数だけが増えるのは、素材を渡したぶん単価・時間・日数の行がまるごと一致するためで、中身が被ったからではない。">
