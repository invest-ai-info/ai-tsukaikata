<svg xmlns="http://www.w3.org/2000/svg" width="720" height="416" viewBox="0 0 720 416" role="img" aria-label="保存指示文2本（提案文＝募集要項に無い実績を書き足さない・検品＝原稿に無い数字を書き足さない）を、想定どおりの材料と想定と違う種類の材料で試した結果を示す図。提案文は実績欄が厚い募集要項5回・ほぼ空欄の募集要項5回・応募条件500枚に届かない案件5回、検品は完成稿5回・粗い下書き5回の合計25回すべてで、縛り違反（書かれていない実績・数字を書き足した件数）も形違反（指定した段落数・分類ラベルから外れた件数）も0件だった。応募条件に届かない案件でも、実績320枚を水増しせず正直に不足を報告した。材料の種類を変えても縛りだけが特別弱いという結果にはならなかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="416"/>
<text class="t-strong" x="18" y="26">材料の種類を変えても、縛り違反・形違反はどちらも0件だった</text>
<text class="t-sm" x="18" y="45">保存指示文2本（提案文＝実績を書き足さない・検品＝数字を書き足さない）を、想定どおりの材料と想定と違う材料で各5回試した。</text>
<text class="t-sm" x="18" y="64">縛り違反（書かれていない実績・数字を書き足した件数）は、5条件×各5回＝25回すべてで0件。</text>
<text class="t-xs" x="18" y="83">棒は「縛り違反0件・形違反0件」を表す（崩れなかったことを示す図）。</text>
<text class="t-xs" x="18" y="115">提案文</text>
<text class="t" x="70" y="138" style="font-size:11.5px">募集要項：実績欄が厚い（想定どおり）</text>
<rect class="box-quiet" x="300" y="118" width="300" height="28" rx="3"/>
<rect class="box-good" x="300" y="118" width="300" height="28" rx="3"/>
<text class="t-good" x="610" y="138">0/5</text>
<text class="t-xs" x="18" y="159">提案文</text>
<text class="t" x="70" y="182" style="font-size:11.5px">募集要項：実績欄がほぼ空欄（想定と違う）</text>
<rect class="box-quiet" x="300" y="162" width="300" height="28" rx="3"/>
<rect class="box-good" x="300" y="162" width="300" height="28" rx="3"/>
<text class="t-good" x="610" y="182">0/5</text>
<text class="t-xs" x="18" y="203">提案文</text>
<text class="t" x="70" y="226" style="font-size:11.5px">応募条件（500枚）に届かない案件</text>
<rect class="box-quiet" x="300" y="206" width="300" height="28" rx="3"/>
<rect class="box-good" x="300" y="206" width="300" height="28" rx="3"/>
<text class="t-good" x="610" y="226">0/5</text>
<text class="t-xs" x="18" y="247">検品</text>
<text class="t" x="70" y="270" style="font-size:11.5px">原稿：完成稿（想定どおり）</text>
<rect class="box-quiet" x="300" y="250" width="300" height="28" rx="3"/>
<rect class="box-good" x="300" y="250" width="300" height="28" rx="3"/>
<text class="t-good" x="610" y="270">0/5</text>
<text class="t-xs" x="18" y="291">検品</text>
<text class="t" x="70" y="314" style="font-size:11.5px">原稿：粗い下書き（想定と違う）</text>
<rect class="box-quiet" x="300" y="294" width="300" height="28" rx="3"/>
<rect class="box-good" x="300" y="294" width="300" height="28" rx="3"/>
<text class="t-good" x="610" y="314">0/5</text>
<rect class="box-quiet" x="18" y="342" width="678" height="50" rx="6"/>
<text class="t-strong" x="34" y="364">合計：縛り違反0/25・形違反0/25。崩れたのは「材料が変われば崩れる」という前提のほう。</text>
<text class="t-sm" x="34" y="382">実績が届かない案件（応募条件500枚・実績320枚）でも、正直に不足を報告し、水増しは0件だった。</text>
</svg>
