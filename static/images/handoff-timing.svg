<svg xmlns="http://www.w3.org/2000/svg" width="720" height="382" viewBox="0 0 720 382" role="img" aria-label="人にしかできない作業をいつ知るかを2本のレーンで比べた図。分担表を出させないときは、AIが作る工程が長く続いたあと、公開の直前に人の作業が3つまとめて出てきて、別の日に持ち越しになった。先に分担表を出させたときは、人の作業3つが頼んだ日に一覧で見えているので、順番を入れ替えるだけで済む。3つとはドメインのDNS設定、HTTPSの有効化、検索エンジンへの登録で、どれもログインして画面を操作する作業のためAIは代われない。作業そのものは変わらず、変わるのはそれが見える時刻だけ。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="382"/>
<text class="t-strong" x="18" y="26">人にしかできない作業を、いつ知るか</text>
<text class="t-sm" x="18" y="45">作業そのものは変わりません。変わるのは、それが見える時刻だけです。</text>
<text class="t-sm" x="18" y="64">このサイトを公開したときに実際に起きたことです。</text>
<text class="t-bad" x="18" y="98">分担表を出させないとき</text>
<rect class="bar-old" x="18" y="106" width="470" height="34" rx="3"/>
<text class="t" x="32" y="128">AIが作る</text>
<rect class="box-bad" x="496" y="106" width="206" height="34" rx="6"/>
<text class="t-bad" x="510" y="128">人の作業が3つ</text>
<text class="t-sm" x="18" y="156">公開の直前にまとめて出てくる。別の日に持ち越しになった</text>
<text class="t-good" x="18" y="204">先に分担表を出させたとき</text>
<rect class="box-good" x="18" y="212" width="206" height="34" rx="6"/>
<text class="t-good" x="32" y="234">人の作業が3つ</text>
<rect class="bar-old" x="232" y="212" width="470" height="34" rx="3"/>
<text class="t" x="246" y="234">AIが作る</text>
<text class="t-sm" x="18" y="262">頼んだ日に一覧で見えている。順番を入れ替えるだけで済む</text>
<rect class="box-accent" x="18" y="286" width="684" height="62" rx="6"/>
<text class="t-accent" x="32" y="316">3つとも、ログインして画面を操作する作業</text>
<text class="t-sm" x="32" y="338">ドメインのDNS設定 ／ HTTPSの有効化 ／ 検索エンジンへの登録。AIは代われない</text>
<text class="t-xs" x="18" y="370">※ どれも難しい作業ではありません。最後にまとめて出てくることだけが問題です。</text>
</svg>
