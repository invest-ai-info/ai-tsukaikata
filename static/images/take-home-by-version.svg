<svg xmlns="http://www.w3.org/2000/svg" width="720" height="534" viewBox="0 0 720 534" role="img" aria-label="架空の契約金額12万円の手取りを5通りの頼み方で各2回計算させたとき、税込で段を分けた106,480円と税抜で段を分けた107,800円の両方が返りに出てきた回の数を並べた図。率を貼らずに手取りはいくらですかと聞いた版は2回中0回。料率の表と公式の計算例を貼った版は2回中1回。それに、ページに書かれていないので決められないことという欄を足した版は2回中2回。計算をさせず率と根拠の行だけ写させた版は、金額を1つも出さないので対象外である。先に公式の計算例を再現させてから本番を計算させた版は2回中1回だった。率を貼らない版は2回とも1つの額しか出さず、率のURLは4回とも書かれず、12万円で聞いた2回はページ名も付かなかった。料率の表と公式の計算例を全文貼っても、2回のうち1回は107,800円だけを出して終わっている。決められないことの欄を作った版では、2回とも3件ずつ落ち、両方とも先頭2件が同じで、段の基準が税込か税抜かと、固定報酬制の集計単位だった。4回ぶん12件をページの本文と1件ずつ突き合わせたところ、実は書いてあったものは0件である。計算例を再現させた版は4回とも10,000円から8,580円を再現できたが、本番の額が例の外に出ると再現は保証にならない。">
<style>
