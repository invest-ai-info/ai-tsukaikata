    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="534"/>
<text class="t-strong" x="18" y="26">ページを貼るだけでは閉じない。閉じたのは、置き場所を作ったとき</text>
<text class="t-sm" x="18" y="45">架空の契約金額 120,000円（税抜）を、5通りの頼み方で各2回。下の数は、税込で段を分けた額</text>
<text class="t-sm" x="18" y="64">（106,480円）と税抜で段を分けた額（107,800円）の両方が返りに出てきた回の数。</text>
<text class="t-sm" x="18" y="83">片方だけの回は、読む人にとっては「答えは1つ」に見える。</text>
<text class="t-xs" x="420" y="126">2通りの額を並べた回</text>
<text class="t" x="18" y="165">① 率を貼らずに「手取りはいくらですか」</text>
<rect class="bar-old" x="420" y="151" width="4" height="19" rx="3"/>
<text class="t-bad" x="432" y="165">0/2回</text>
<text class="t" x="18" y="215">② 料率の表と公式の計算例を貼る</text>
<rect class="bar-in" x="420" y="201" width="80" height="19" rx="3"/>
<text class="t-sm" x="508" y="215">1/2回</text>
<text class="t" x="18" y="265">③ ②＋〔ページに書かれていないので決められないこと〕</text>
<rect class="bar-out" x="420" y="251" width="160" height="19" rx="3"/>
<text class="t-good" x="588" y="265">2/2回</text>
<text class="t" x="18" y="315">④ ③＋計算はさせず、率と根拠の行だけ写させる</text>
<rect class="box-quiet" x="420" y="301" width="260" height="19" rx="4"/>
<text class="t-sm" x="430" y="315">金額を1つも出さない（指示どおり）</text>
<text class="t" x="18" y="365">⑤ 先に公式の計算例を再現させてから本番</text>
<rect class="bar-in" x="420" y="351" width="80" height="19" rx="3"/>
<text class="t-sm" x="508" y="365">1/2回</text>
<text class="t-bad" x="18" y="408">※ ①は2回とも1つの額しか出さない。しかも率のURLは4回とも書かず、12万円で聞いた2回はページ名も付かない。</text>
<text class="t-bad" x="18" y="429">※ ②で料率の表と公式の計算例を全文貼っても、2回のうち1回は 107,800円 だけを出して終わった。</text>
<text class="t-good" x="18" y="450">※ ③の欄には2回とも3件ずつ落ち、両方とも先頭2件が同じ（段の基準が税込か税抜か／固定報酬制の集計単位）。</text>
<text class="t-good" x="18" y="471">　 4回ぶん12件をページの本文と1件ずつ突き合わせたところ、実は書いてあったものは0件だった。</text>
<text class="t-sm" x="18" y="492">※ ⑤は4回とも計算例（10,000円→8,580円）を再現できた。それでも本番が例の外に出ると、再現は保証にならない。</text>
<text class="t-xs" x="18" y="513">架空データでの実測（契約12万円ぶん10回。全体は26回）。生の返りは docs/evidence/ にある。</text>
</svg>
