<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="「数字を先にリストアップしてから、一般的な範囲か確認する」2段階方式の検出率を、先行記事の素朴な一括確認・数値に注意して確認と比べた図。素朴な一括確認で拾えた回数は80回中23回（28.75%）、数値に注意して確認で拾えた回数は48回中19回（約40%）、2段階で拾えた回数は80回中29回（36.25%）。2段階の手順を1通のメッセージにまとめた版では、3回のうち2回、正しい値（充電時間2時間）まで誤って疑った。下の枠には、2段階は素朴な一括確認より少し良いが大きくは変わらないこと、16項目のうち6項目は2段階に変えても一度も拾われなかったこと、1通のメッセージにまとめると正しい値まで誤って疑う回が新しく出たことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">数字を先に書き出させても、見逃しの6割はそのまま残る</text>
<text class="t-sm" x="18" y="45">先行記事（natural-number-swap-hides-from-naive-check）と同じ材料・同じ仕込みで比較。</text>
<text class="t-sm" x="18" y="64">素朴な一括確認・数値に注意して確認（どちらも先行記事）・2段階（今回）の3種を比べた。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">素朴な一括確認で拾えた回数（先行記事・80回）</text>
<rect class="box" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="125" text-anchor="middle" style="font-weight:700">23/80</text>
<text class="t" x="18" y="157">数値に注意して確認で拾えた回数（先行記事・48回）</text>
<rect class="box" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="157" text-anchor="middle" style="font-weight:700">19/48</text>
<text class="t" x="18" y="189">2段階（先にリストアップしてから確認）で拾えた回数（今回・80回）</text>
<rect class="box" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="189" text-anchor="middle" style="font-weight:700">29/80</text>
<text class="t" x="18" y="221">2段階を1通のメッセージにまとめた版で、正しい値を誤って疑った回数（3回）</text>
<rect class="box-bad" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="221" text-anchor="middle" style="font-weight:700">2/3</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">✅ 2段階（29/80・36.25%）は素朴な一括確認（23/80・28.75%）より少し良いが、大きくは変わらない。</text>
<text class="t-accent" x="34" y="276">🚨 16項目のうち6項目は、2段階に変えても一度も拾われなかった（先行記事の8項目から2項目減っただけ）。</text>
<text class="t-accent" x="34" y="294">🔑 2段階の手順を1通のメッセージにまとめると、正しい値まで誤って疑う回が新しく出た（3回中2回）。</text>
</svg>
