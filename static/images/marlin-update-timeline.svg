<svg xmlns="http://www.w3.org/2000/svg" width="720" height="212" viewBox="0 0 720 212" role="img" aria-label="Sakana Marlinが公開されてから今回の更新までの年表。2026年6月、AB-MCTSで最大8時間の自律リサーチを行いレポートを自動生成するSakana Marlinを公開。2026年9月16日（公開の3か月後）、対話しながら出典を確認できるInteractive Readingと、編集可能なPowerPoint出力を追加した。「3か月後」は記事側の計算で、発表ページは公開月を「今年6月」とだけ書いている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="212"/>
<text class="t-strong" x="18" y="26">Sakana Marlinは、公開から3か月で「読む」ための機能を足した</text>
<text class="t-sm" x="18" y="45">2026年6月に公開し、9月16日に読み解き・共有まわりを補強するアップデートが来た。</text>
<text class="t-sm" x="18" y="64">「3か月後」は6月と9月16日からこの記事が計算した月数（6月の正確な日付は非公開）。</text>
<line class="line" x1="26" y1="96" x2="26" y2="156"/>
<circle class="box-quiet" cx="26" cy="96" r="7"/>
<text class="t-xs" x="50" y="88">2026年6月</text>
<text class="t-strong" x="50" y="106">Sakana Marlinを公開</text>
<text class="t-sm" x="50" y="123">AB-MCTSで最大8時間の自律リサーチ、レポートを自動生成</text>
<circle class="box-accent" cx="26" cy="156" r="7"/>
<text class="t-xs" x="50" y="148">2026年9月16日（公開の3か月後）</text>
<text class="t-strong" x="50" y="166">Interactive Reading／PowerPoint出力を追加</text>
<text class="t-sm" x="50" y="183">対話しながら出典を確認・編集可能なスライドで共有</text>
<text class="t-xs" x="18" y="178">※ 出典: Sakana Marlinの更新発表ページ（sakana.ai/marlin-update/・2026年9月22日に確認）。</text>
<text class="t-xs" x="18" y="196">※ 「3か月後」はこの記事の計算。発表ページは公開月を「今年6月」とだけ書いている。</text>
</svg>
