<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" role="img" aria-label="値上げを切り出すタイミングとして6つの日付を試した結果を示す表。契約が自動更新された8/1は不適切2/2、感謝のメッセージが届いた8/20は不適切2/2、依頼本数が20%増えた9/5は適切2/2、クレーム対応中の連絡があった9/18は不適切2/2、1か月ぶりに依頼が再開した9/25は不適切2/2、通常どおり提出した10/5（特記なし）は不適切2/2。適切になったのは依頼本数が実際に増えた9/5だけで、契約更新や感謝の言葉だけでは根拠が薄いとして不適切と判定され、9/18のクレーム対応以降は再開・平常提出の日になっても不適切のまま変わらなかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="438"/>
<text class="t-strong" x="18" y="24">値上げの好機とされる日でも、「適切」になったのは1日だけ</text>
<text class="t-sm" x="18" y="43">同じ作業ログ（契約更新・感謝・増量・クレーム対応・再開・平常提出）を使い、</text>
<text class="t-sm" x="18" y="62">「本日は◯月◯日です」の日付だけを変えて、新規プロセスで各2回試した（計12回）。</text>
<text class="t-xs" x="18" y="81">「適切」になったのは、依頼本数が実際に増えた9/5だけ（2/2）。契約更新・感謝の言葉</text>
<text class="t-xs" x="18" y="100">だけの日は根拠が薄いとして「不適切」。9/18のクレーム対応以降は、再開・平常提出の</text>
<text class="t-xs" x="18" y="119">日になっても「不適切」のまま変わらなかった。</text>
<text class="t" x="18" y="156">8/1　契約が自動更新された日</text>
<rect class="box-bad" x="430" y="139" width="128" height="24" rx="4"/>
<text class="t-bad" x="466" y="156" style="font-size:12.5px">不適切　2/2</text>
<text class="t" x="18" y="194">8/20　感謝のメッセージが届いた日</text>
<rect class="box-bad" x="430" y="177" width="128" height="24" rx="4"/>
<text class="t-bad" x="466" y="194" style="font-size:12.5px">不適切　2/2</text>
<text class="t" x="18" y="232">9/5　依頼本数が20%増えた日</text>
<rect class="box-good" x="430" y="215" width="128" height="24" rx="4"/>
<text class="t-good" x="466" y="232" style="font-size:12.5px">適切　2/2</text>
<text class="t" x="18" y="270">9/18　クレーム対応中の連絡があった日</text>
<rect class="box-bad" x="430" y="253" width="128" height="24" rx="4"/>
<text class="t-bad" x="466" y="270" style="font-size:12.5px">不適切　2/2</text>
<text class="t" x="18" y="308">9/25　1か月ぶりに依頼が再開した日</text>
<rect class="box-bad" x="430" y="291" width="128" height="24" rx="4"/>
<text class="t-bad" x="466" y="308" style="font-size:12.5px">不適切　2/2</text>
<text class="t" x="18" y="346">10/5　通常どおり提出した日（特記なし）</text>
<rect class="box-bad" x="430" y="329" width="128" height="24" rx="4"/>
<text class="t-bad" x="466" y="346" style="font-size:12.5px">不適切　2/2</text>
<rect class="box-accent" x="18" y="374" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="394">⚠️ 9/18以降（9/25・10/5）も「不適切」のままだったのは、クレーム対応という古い</text>
<text class="t-accent" x="34" y="412">懸念が、後の好転（依頼再開・平常提出）があっても自分からは解消されなかったため。</text>
</svg>
