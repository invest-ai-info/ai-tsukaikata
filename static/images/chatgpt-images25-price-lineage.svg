<svg xmlns="http://www.w3.org/2000/svg" width="720" height="411" viewBox="0 0 720 411" role="img" aria-label="OpenAIの画像生成モデルの、画像出力トークン単価（100万トークンあたり）を世代順に並べた横棒グラフ。gpt-image-1は40ドル、gpt-image-1.5は32ドル、旧ChatGPTモデル（chatgpt-image-latest）も32ドル、gpt-image-2は30ドル、新しいgpt-image-2.5 Sunburstとgpt-image-2.5 Flareもどちらも30ドル。旧ChatGPTモデルは公式ドキュメントで「以前ChatGPTで使われていたスナップショット」と説明されており、同じページでAPI利用にはSunburstを推奨すると書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="411"/>
<text class="t-strong" x="18" y="26">画像出力トークンの単価は、世代を経て下がってきた</text>
<text class="t-sm" x="18" y="45">100万 画像出力トークンあたりのドル（Standardティア）。テキスト側は別建て。</text>
<text class="t-sm" x="18" y="64">gpt-image-2.5（青）は gpt-image-2 と同額で、旧ChatGPTモデルより安い。</text>
<text class="t" x="18" y="116.0">gpt-image-1</text>
<rect class="bar-old" x="208" y="100" width="412.0" height="22" rx="3"/>
<text class="t-sm" x="628.0" y="116.0">$40.00</text>
<text class="t" x="18" y="153.0">gpt-image-1.5</text>
<rect class="bar-old" x="208" y="137" width="329.6" height="22" rx="3"/>
<text class="t-sm" x="545.6" y="153.0">$32.00</text>
<text class="t" x="18" y="190.0">旧ChatGPTモデル</text>
<rect class="bar-old" x="208" y="174" width="329.6" height="22" rx="3"/>
<text class="t-sm" x="545.6" y="190.0">$32.00</text>
<text class="t" x="18" y="227.0">gpt-image-2</text>
<rect class="bar-old" x="208" y="211" width="309.0" height="22" rx="3"/>
<text class="t-sm" x="525.0" y="227.0">$30.00</text>
<text class="t" x="18" y="264.0">gpt-image-2.5 Sunburst</text>
<rect class="bar-new" x="208" y="248" width="309.0" height="22" rx="3"/>
<text class="t-sm" x="525.0" y="264.0">$30.00</text>
<text class="t" x="18" y="301.0">gpt-image-2.5 Flare</text>
<rect class="bar-new" x="208" y="285" width="309.0" height="22" rx="3"/>
<text class="t-sm" x="525.0" y="301.0">$30.00</text>
<text class="t-xs" x="18" y="341">※ 旧ChatGPTモデル（chatgpt-image-latest）は「以前ChatGPTで使われて</text>
<text class="t-xs" x="18" y="359">　いたスナップショット」と公式ドキュメントに明記。同じページで</text>
<text class="t-xs" x="18" y="377">　API利用には Sunburst を推奨、と書かれている。</text>
<text class="t-xs" x="18" y="395">※ 出典: OpenAI の料金ページ（developers.openai.com・2026年9月20日に確認）。</text>
</svg>
