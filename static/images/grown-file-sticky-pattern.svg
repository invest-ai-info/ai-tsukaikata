<rect class="bg" x="0" y="0" width="720" height="306"/>
<text class="t-strong" x="18" y="26">そろった系列はそろったまま、崩れた系列は崩れたまま続いた</text>
<text class="t-sm" x="18" y="45">同じ100行・同じ1行の乱れ・同じ指示文から出発した、材料Aの独立した2つの会話（2026-10-02）。</text>
<text class="t-sm" x="18" y="64">1日目に規定の書式で返った系列は2日目も規定の書式。1日目に走り書きのままだった系列は2日目も走り書きのまま。</text>
