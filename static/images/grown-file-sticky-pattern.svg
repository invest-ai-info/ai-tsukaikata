<svg xmlns="http://www.w3.org/2000/svg" width="720" height="306" viewBox="0 0 720 306" role="img" aria-label="そろった系列はそろったまま、崩れた系列は崩れたまま続いたことを示す図。材料Aの独立した2つの会話を比べている。系列A-rep2は1日目に「2026-08-01 / C社 / 記事の下書き / 90分」という規定の書式で追記し、2日目も「2026-08-02 / D社 / 打ち合わせメモ起こし / 45分」という同じ規定の書式のままだった。系列A-rep1は1日目に「2026年8月1日 C社 記事の下書き 90分」という走り書きのまま追記し、2日目も「2026年8月2日。D社の打ち合わせメモ起こし。45分。」という走り書きのままだった。指示文はどちらの系列も2日間とも一字一句同じだった。">
<style>
