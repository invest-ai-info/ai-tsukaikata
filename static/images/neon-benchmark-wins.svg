<svg xmlns="http://www.w3.org/2000/svg" width="720" height="226" viewBox="0 0 720 226" role="img" aria-label="Gemini 4 Neon モデルカードの比較表19項目のうち、各モデルが最高値だった項目数を示す横棒グラフ。Gemini 4 Neonが16/19項目、Claude Opus 5.5が2/19項目、GPT-6.2 Solが1/19項目。この表を作ったのはGoogleで、他社が自社で測った値ではない。Opus 5.5が上だったのはTerminal-bench 4.1（不正行為調整後の正解率）とFrontierCode 2.0、GPT-6.2 Solが上だったのはChartography。">
