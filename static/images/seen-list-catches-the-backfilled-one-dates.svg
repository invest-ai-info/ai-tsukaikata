<svg xmlns="http://www.w3.org/2000/svg" width="720" height="278" viewBox="0 0 720 278" role="img" aria-label="日付だけで新着を判定する方法と、既読ID一覧を実際に確認する方法を比べた図。日付だけで判定すると、一覧の中ほどにある古い新着（2024-03-29付け）は最新ではないため新着に見えない。既読ID一覧を実際に確認すると、古い新着も最新の新着も両方検出され、16回中16回とも見逃さなかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="278"/>
<text class="t-strong" x="18" y="26">日付だけでは見えない新着も、既読ID一覧なら見える</text>
<text class="t-sm" x="18" y="45">新着2件のうち1件は、一覧の中ほど（2024-03-29付け）に紛れた「遡って取得し直した分」。</text>
<text class="t-sm" x="18" y="100">日付だけで新着を判定すると</text>
<rect class="box-bad" x="18" y="108" width="500" height="40" rx="4"/>
<text class="t-bad" x="30" y="125">中ほどの古い新着（2024-03-29）は</text>
<text class="t-bad" x="30" y="140">新着に見えない</text>
<text class="t-sm" x="18" y="170">既読ID一覧を実際に確認すると</text>
<rect class="box-good" x="18" y="178" width="500" height="40" rx="4"/>
<text class="t-good" x="30" y="195">古い新着も最新の新着も両方検出</text>
<text class="t-good" x="30" y="210">16回中16回、見逃し0件</text>
<text class="t-xs" x="18" y="254">※「見逃し0件」は材料2本×一括/3分割×2回転＝16回の機械照合（ID抽出→集合比較）による。</text>
</svg>
