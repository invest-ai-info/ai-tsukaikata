<svg xmlns="http://www.w3.org/2000/svg" width="720" height="298" viewBox="0 0 720 298" role="img" aria-label="翻訳をAIに頼むときの指定を、3つの場所に分けた図。訳す前に決めるのは、揺れる言葉を表にする・訳さない語を決める・文体を1つに決める、の3つ。訳すときに縛るのは、原文に無いことを足さない・迷ったら訳さず報告する・段落に番号を振る、の3つ。訳したあとに測るのは、数字を並べて突き合わせる・用語表どおりか確かめる・原文に無い文を探させる、の3つ。左の3つは訳す前なら1回書けば全文に効く。右の3つは原文と訳文の両方を渡さないとできず、訳文だけを渡しても答えは返らない。真ん中の段落に番号を振る指定は、右の突き合わせを機械的にするための下ごしらえ。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="298"/>
<text class="t-strong" x="18" y="26">指定する場所は3つに分かれる。前の1つを飛ばすと、直しが全文に及ぶ</text>
<text class="t-sm" x="18" y="45">用語と文体は、訳し終わってから直すと全部の段落を触ることになります。</text>
<rect class="box-accent" x="18" y="66" width="217" height="124" rx="6"/>
<text class="t-accent" x="32" y="88">訳す前に決める</text>
<text class="t" x="32" y="122">揺れる言葉を表にする</text>
<text class="t" x="32" y="152">訳さない語を決める</text>
<text class="t" x="32" y="182">文体を1つに決める</text>
<rect class="box" x="251" y="66" width="217" height="124" rx="6"/>
<text class="t-strong" x="265" y="88">訳すときに縛る</text>
<text class="t" x="265" y="122">原文に無いことを足さない</text>
<text class="t" x="265" y="152">迷ったら訳さず報告する</text>
<text class="t" x="265" y="182">段落に番号を振る</text>
<rect class="box-good" x="484" y="66" width="217" height="124" rx="6"/>
<text class="t-good" x="498" y="88">訳したあとに測る</text>
<text class="t" x="498" y="122">数字を並べて突き合わせる</text>
<text class="t" x="498" y="152">用語表どおりか確かめる</text>
<text class="t" x="498" y="182">原文に無い文を探させる</text>
<rect class="box-quiet" x="18" y="210" width="684" height="54" rx="6"/>
<text class="t" x="32" y="232">左の3つは、訳す前なら1回書けば全文に効きます。</text>
<text class="t-sm" x="32" y="252">右の3つは、原文と訳文の両方を渡さないとできません。訳文だけを渡しても答えは返りません。</text>
<text class="t-xs" x="18" y="286">※ 真ん中の「段落に番号を振る」は、右の突き合わせを機械的にするための下ごしらえです。</text>
</svg>
