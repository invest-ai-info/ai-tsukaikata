<svg xmlns="http://www.w3.org/2000/svg" width="720" height="514" viewBox="0 0 720 514" role="img" aria-label="複数の取引先からの連絡に緊急度を1つの基準で仕分けたとき、真の緊急8件のうち正しく検出できた件数を、材料2本×各2回（計8回）の内訳で比べた図。「件名に緊急を示す言葉があれば教えて」という件名だけを基準にした指示では、材料1・材料2とも1回目2回目ともに4/8件しか検出できず（4回とも同じ4件を見落とし、同じ3件を誤って緊急に含めた）。「相手によって緊急の伝え方が違うかもしれないので、まず各社の書き方の癖を確認してから」と1文加えた指示では、材料1・材料2とも1回目2回目ともに8/8件で過不足なく検出できた。">
<style>
