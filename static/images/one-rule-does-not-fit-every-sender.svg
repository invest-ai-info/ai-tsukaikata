<rect class="bg" x="0" y="0" width="720" height="514"/>
<text class="t-strong" x="18" y="26">件名だけを基準にすると、真の緊急8件中4件しか検出できなかった</text>
<text class="t-sm" x="18" y="45">架空の取引先5社×5件を2セット用意し、社ごとに緊急の伝え方の型を変えた</text>
<text class="t-sm" x="18" y="64">（件名の慣習語／本文冒頭の一文／返信期限の日付だけ／毎回付く形骸化した慣習語）。</text>
<text class="t-xs" x="18" y="83">数字は、真の緊急8件のうち正しく検出できた件数（材料2本×各2回＝4回の内訳）。</text>
<text class="t-xs" x="18" y="102">生の回答は docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="149">材料1・件名だけを基準（1回目）</text>
<rect class="box-bad" x="318" y="130" width="140" height="28" rx="4"/>
<text class="t-bad" x="353.0" y="149">4/8 件検出</text>
<text class="t-sm" x="18" y="185">材料1・件名だけを基準（2回目）</text>
<rect class="box-bad" x="318" y="166" width="140" height="28" rx="4"/>
<text class="t-bad" x="353.0" y="185">4/8 件検出</text>
<text class="t-sm" x="18" y="221">材料1・まず癖を確認（1回目）</text>
<rect class="box-good" x="318" y="202" width="140" height="28" rx="4"/>
<text class="t-good" x="353.0" y="221">8/8 件検出</text>
<text class="t-sm" x="18" y="257">材料1・まず癖を確認（2回目）</text>
<rect class="box-good" x="318" y="238" width="140" height="28" rx="4"/>
<text class="t-good" x="353.0" y="257">8/8 件検出</text>
<text class="t-sm" x="18" y="293">材料2・件名だけを基準（1回目）</text>
<rect class="box-bad" x="318" y="274" width="140" height="28" rx="4"/>
<text class="t-bad" x="353.0" y="293">4/8 件検出</text>
<text class="t-sm" x="18" y="329">材料2・件名だけを基準（2回目）</text>
<rect class="box-bad" x="318" y="310" width="140" height="28" rx="4"/>
<text class="t-bad" x="353.0" y="329">4/8 件検出</text>
<text class="t-sm" x="18" y="365">材料2・まず癖を確認（1回目）</text>
<rect class="box-good" x="318" y="346" width="140" height="28" rx="4"/>
<text class="t-good" x="353.0" y="365">8/8 件検出</text>
<text class="t-sm" x="18" y="401">材料2・まず癖を確認（2回目）</text>
<rect class="box-good" x="318" y="382" width="140" height="28" rx="4"/>
<text class="t-good" x="353.0" y="401">8/8 件検出</text>
<rect class="box-quiet" x="18" y="422" width="678" height="68" rx="6"/>
<text class="t-strong" x="34" y="442">件名だけを基準にした4回は、どれも本文にしか緊急のサインがない相手の分（各4件）を</text>
<text class="t-sm" x="34" y="460">まるごと見落とし、逆に毎回【至急】を付ける相手の分（各3件）を誤って含めた（誤検知）。</text>
<text class="t-sm" x="34" y="478">「まず癖を確認してから」の1文を足すと、4回とも過不足なく8件全部を検出した。</text>
</svg>
