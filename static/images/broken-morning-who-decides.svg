<rect class="bg" x="0" y="0" width="720" height="525"/>
<text class="t-strong" x="18" y="26">記録が途切れている朝。候補を3つだけ渡すと、決まらないのに1つ選ぶ</text>
<text class="t-sm" x="18" y="45">架空の「毎朝の実行の記録」14日ぶん。今朝（8/19）の行だけが無い。行が無い状態は「実行されていない」とも</text>
<text class="t-sm" x="18" y="64">「まだ書かれていない（遅れて走っている途中）」とも両立するので、この記録だけでは3択のどれとも決まらない。</text>
<text class="t-sm" x="18" y="83">1つの頼み方につき2回。下の行の指示文は、上の行に足し重ねてある。</text>
<text class="t-sm" x="18" y="102">※ 記録には「通信」「権限」「制限」「仕様変更」など24語の原因語が1語も出てこない（走らせる前に検算）。</text>
<text class="t-xs" x="18" y="126">頼み方（下の行は、上の行に足し重ねてある）／その下は、今朝について返りが書いたこと</text>
<text class="t-xs" x="640" y="126">通した回数</text>
<text class="t" x="18" y="154">そのまま「なぜ動かなかったのか教えて」</text>
<text class="t" x="640" y="154">2回</text>
<rect class="box-bad" x="38" y="160" width="208" height="21" rx="4"/>
<text class="t-bad" x="47" y="175">「実行そのものが記録に無い」</text>
<text class="t" x="18" y="208">＋3択だけ渡す（実行されていない／遅れた／取得0件）</text>
<text class="t" x="640" y="208">4回</text>
<rect class="box-bad" x="38" y="214" width="249" height="21" rx="4"/>
<text class="t-bad" x="47" y="229">4回とも「1. 実行されていない」</text>
<text class="t-good" x="18" y="262">＋「どれにも当たらないならそう書いて」</text>
<text class="t" x="640" y="262">4回</text>
<rect class="box-good" x="38" y="268" width="222" height="21" rx="4"/>
<text class="t-good" x="47" y="283">4回とも「どれにも当たらない」</text>
<text class="t-good" x="18" y="316">＋「根拠になった行をそのままコピーして」</text>
<text class="t" x="640" y="316">2回</text>
<rect class="box-good" x="38" y="322" width="222" height="21" rx="4"/>
<text class="t-good" x="47" y="337">2回とも「どれにも当たらない」</text>
<text class="t-good" x="18" y="370">保存版＝3行に固定（区分／根拠／記録に無いこと）</text>
<text class="t" x="640" y="370">2回</text>
<rect class="box-good" x="38" y="376" width="249" height="21" rx="4"/>
<text class="t-good" x="47" y="391">2回とも「この記録では決まらない」</text>
<text class="t-bad" x="18" y="420">※ 2行目が核。候補を3つ渡すと、記録がその3つを見分けられない朝でも、4回とも1つ選んだ。</text>
<text class="t-good" x="18" y="441">※ 「どれにも当たらないならそう書いて」を1行足すと、4回とも選ばずに理由を書いた。</text>
<text class="t-good" x="18" y="462">　 返り自身が「行が無いことは、実行されなかった証拠にも、まだ記録されていない証拠にもなります」。</text>
<text class="t-good" x="18" y="483">※ 記録の中で答えが決まる朝（遅れた／取得0件）は、4通りとも16回すべて当てた。ここは崩れない。</text>
<text class="t-xs" x="18" y="504">この表は「記録が途切れている朝」の14通ぶん。全体では9個の頼み方で56通。生の返りは docs/evidence/ に全文。</text>
</svg>
