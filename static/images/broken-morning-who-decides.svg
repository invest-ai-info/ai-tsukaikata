<svg xmlns="http://www.w3.org/2000/svg" width="720" height="525" viewBox="0 0 720 525" role="img" aria-label="自動実行が動かなかった朝に、実行の記録を貼って原因を聞いたときの返りを、頼み方4通りで並べた表。材料は架空の毎朝の実行の記録14日ぶんで、今朝の行だけが無い。行が無い状態は、実行されていないとも、遅れてまだ書かれていないとも両立するので、この記録だけでは3択のどれとも決まらない。1つの頼み方につき2回ずつ通した。そのままなぜ動かなかったのか教えてと頼んだ2回は、実行そのものが記録に無いと書いた。3択だけを渡した4回は、4回とも1の実行されていないを選んだ。どれにも当たらないならそう書いてくださいという1行を足した4回は、4回ともどれにも当たらないと答えた。さらに根拠になった行をそのままコピーしてくださいを足した2回も、2回ともどれにも当たらないと答えた。保存版として区分と根拠と記録に無いことの3行に固定した2回も、2回とも区分の欄にこの記録では決まらないと書いた。核は2行目で、候補を3つ渡すと、記録がその3つを見分けられない朝でも1つ選ぶ。受け皿の1行を足した4回は、選ばずに理由を書いた。なお、記録の中で答えが決まる朝、つまり遅れた朝と取得0件の朝は、4通りの頼み方すべてで16回とも当たっており、そこは崩れていない。">
