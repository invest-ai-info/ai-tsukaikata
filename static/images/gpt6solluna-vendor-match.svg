<rect class="bg" x="0" y="0" width="720" height="491"/>
<text class="t-strong" x="18" y="26">GPT-6 Sol と Claude Sonnet 5.5 は、入力・出力とも同額</text>
<text class="t-sm" x="18" y="45">薄い青＝入力、濃い青＝出力。各社の公式料金ページに載っている値だけを並べています。</text>
<text class="t-sm" x="18" y="64">上3行は各社の最上位モデル。下2行がこの記事のGPT-6 Solと、単価が一致したClaude Sonnet 5.5。</text>
<text class="t-sm" x="18" y="83">⚠️ これは値段の比較で、賢さの比較ではありません。測り方の違う性能テストは並べていません。</text>
