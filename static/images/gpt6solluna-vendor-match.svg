<text class="t-xs" x="244" y="130">入力</text>
<rect class="bar-in" x="288" y="118" width="60.8" height="16" rx="2"/>
<text class="t-sm" x="356.8" y="130">$10</text>
<text class="t-xs" x="244" y="151">出力</text>
<rect class="bar-out" x="288" y="139" width="304.0" height="16" rx="2"/>
