<text class="t-xs" x="18" y="461">※ Gemini は20万トークン以下のときの値。超えると入力 $4・出力 $18 に上がります。</text>
<text class="t-xs" x="18" y="479">※ 出典: 各社の公式料金ページ（OpenAI・Anthropic・Google／2026年9月28日に確認）。</text>
