<svg xmlns="http://www.w3.org/2000/svg" width="720" height="491" viewBox="0 0 720 491" role="img" aria-label="5つのモデルの単価を並べた横棒グラフ。100万トークンあたり、2026年9月28日時点。GPT-6 Astra（OpenAI・最上位）は入力10ドル・出力50ドル。Claude Fable 5.1（Anthropic・最上位）も入力10ドル・出力50ドルで同じ。Gemini 3.1 Pro Preview（Google・最上位）は入力2ドル・出力12ドル。GPT-6 Sol（OpenAI）は入力2ドル・出力10ドル。Claude Sonnet 5.5（Anthropic）も入力2ドル・出力10ドルで、GPT-6 Solと完全に一致する。各社の公式料金ページに載っている値だけを並べたもので、賢さの比較ではない。">
<style>
