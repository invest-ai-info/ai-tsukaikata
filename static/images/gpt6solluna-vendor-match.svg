<text class="t-sm" x="356.8" y="193">$10</text>
<text class="t-xs" x="244" y="214">出力</text>
<rect class="bar-out" x="288" y="202" width="304.0" height="16" rx="2"/>
<text class="t-sm" x="600.0" y="214">$50</text>
<text class="t" x="18" y="256">Gemini 3.1 Pro Preview（Google・最上位）</text>
<text class="t-xs" x="244" y="256">入力</text>
<rect class="bar-in" x="288" y="244" width="12.2" height="16" rx="2"/>
<text class="t-sm" x="308.2" y="256">$2</text>
<text class="t-xs" x="244" y="277">出力</text>
<rect class="bar-out" x="288" y="265" width="73.0" height="16" rx="2"/>
<text class="t-sm" x="369.0" y="277">$12</text>
<text class="t-accent" x="18" y="319">GPT-6 Sol（OpenAI）</text>
<text class="t-xs" x="244" y="319">入力</text>
<rect class="bar-in" x="288" y="307" width="12.2" height="16" rx="2"/>
<text class="t-sm" x="308.2" y="319">$2</text>
<text class="t-xs" x="244" y="340">出力</text>
<rect class="bar-out" x="288" y="328" width="60.8" height="16" rx="2"/>
<text class="t-sm" x="356.8" y="340">$10</text>
<text class="t-accent" x="18" y="382">Claude Sonnet 5.5（Anthropic）</text>
<text class="t-xs" x="244" y="382">入力</text>
<rect class="bar-in" x="288" y="370" width="12.2" height="16" rx="2"/>
<text class="t-sm" x="308.2" y="382">$2</text>
<text class="t-xs" x="244" y="403">出力</text>
