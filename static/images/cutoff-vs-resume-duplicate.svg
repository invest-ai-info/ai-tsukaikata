<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="自動処理の対象範囲を「時刻を基準」にするか「前回処理した続きから」にするかを、4通りの指示文で3回ずつ試した図。架空のセミナー申込みログ24件を使い、前回処理済みの14件と新着の10件を仕込んだ。時刻基準のみの版は重複件数が14件・14件・0件と3回とも割れた。前回位置のみの版は3回とも重複0件。時刻基準に実行が3時間遅れた事実を伝えた版は3回とも重複14件で、遅れを伝えても対象範囲は変わらなかったが3回とも同じ答えで安定した。前回位置に遅延の事実を伝えた版も3回とも重複0件。重複の真値は0件である。">
<style>
