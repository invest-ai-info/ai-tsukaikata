<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">「前回の続きから」は3回とも重複0。「時刻基準」は同じ指示文でも数字が割れた</text>
<text class="t-sm" x="18" y="45">架空のセミナー申込みログ24件（前回処理済みR-001〜014・新着R-015〜024）を1本のログのまま渡した。</text>
<text class="t-sm" x="18" y="64">振ったのは指示文だけ＝(a)(c)は「本日7時までに届いた分」、(b)(d)は「前回処理済みの最後のID」を基準にした。</text>
<text class="t-sm" x="18" y="83">(c)(d)は「本来7時の予定が実際は10時12分に実行された」という遅延も伝えている。4版×各3回＝12回、新規の会話ごと。</text>
<text class="t-sm" x="18" y="102">重複＝前回すでに処理済みの14件のうち、今回また対象に含めてしまった件数（真値0）。帯は3回の最小から最大まで。</text>
<text class="t-xs" x="266.0" y="138">← 真値は0件</text>
<path class="line" d="M260.0 146 L260.0 300" stroke-dasharray="4 3"/>
<text class="t" x="18" y="164">(a) 時刻基準のみ</text>
<rect class="bar-old" x="260.0" y="152" width="220.0" height="16" rx="3"/>
<path class="line" d="M260.0 151 L260.0 169" stroke-width="2.4"/>
<path class="line" d="M480.0 151 L480.0 169" stroke-width="2.4"/>
<text class="t-bad" x="490.0" y="164">14・14・0件</text>
<text class="t-sm" x="30" y="181">3回とも数字が割れた</text>
<text class="t" x="18" y="206">(b) 前回位置のみ</text>
<rect class="bar-old" x="260.0" y="194" width="2.0" height="16" rx="3"/>
<path class="line" d="M260.0 193 L260.0 211" stroke-width="2.4"/>
<text class="t-accent" x="490.0" y="206">0・0・0件</text>
<text class="t-sm" x="30" y="223">3回とも重複0</text>
<text class="t" x="18" y="248">(c) 時刻基準+遅れを伝える</text>
<rect class="bar-old" x="480.0" y="236" width="2.0" height="16" rx="3"/>
<path class="line" d="M480.0 235 L480.0 253" stroke-width="2.4"/>
<text class="t-bad" x="490.0" y="248">14・14・14件</text>
<text class="t-sm" x="30" y="265">3回一致・でも直らない</text>
<text class="t" x="18" y="290">(d) 前回位置+遅れを伝える</text>
<rect class="bar-old" x="260.0" y="278" width="2.0" height="16" rx="3"/>
<path class="line" d="M260.0 277 L260.0 295" stroke-width="2.4"/>
<text class="t-accent" x="490.0" y="290">0・0・0件</text>
<text class="t-sm" x="30" y="307">3回とも重複0</text>
<text class="t-bad" x="18" y="322">🚨 (a)は3回目だけ0件になった。ただし取りこぼしは逆に増えている（本文の表を参照）。0件は正解だからではない。</text>
<text class="t-sm" x="18" y="342">※ (c)は遅れを伝えても対象範囲は変わらなかった。ただし3回とも同じ答えになり、(a)より安定はした。</text>
<text class="t-xs" x="18" y="362">架空データでの実測（12回・新規の会話ごと）。生の回答は docs/evidence/ に全文置いてある。</text>
</svg>
