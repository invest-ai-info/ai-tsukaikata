<svg xmlns="http://www.w3.org/2000/svg" width="720" height="468" viewBox="0 0 720 468" role="img" aria-label="noteで1,000円の記事が3件売れたときの手取りを、率を貼らずに聞いた3回・料率表を貼って聞いた3回・料率表に加えて決まらない変数を挙げてと頼んだ3回で比較した図。真の幅は2,025円から2,295円で、決済手段6種類（クレジットカード・携帯キャリア・PayPay・Amazon Pay・noteポイント・PayPal）での計算結果の範囲を示す。率を貼らない3回は2,300円台から2,600円台の、真の幅と重ならないズレた独自の範囲を返した。料率表を貼った6回（版2・版3）は3回ずつとも真の幅と1円単位で一致した。">
