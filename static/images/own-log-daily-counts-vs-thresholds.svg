<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="架空の実行ログ21日分（材料A・2026-09-01〜09-21）の日次実行回数を21本の縦棒で示した図。09-01から09-09・09-14から09-21はすべて4〜8回の範囲に収まり、09-10〜09-13の4日間だけが0回（赤い棒）。横に2本の破線があり、上の線は名目24回の50%にあたる12回で、どの日の棒よりも高い位置にある。下の線は0件の4日間を除いた17日間の単純平均である約5.9回で、ふだんの棒のすぐ上を通り、0件の4本だけがこの線の下に来る。下の枠には、名目24回の基準はふだんの日もすべて下回ってしまいどの日も異常に見えてしまうこと、自分の記録から計算した目安は0件の4日間だけを正しく区別できることが書かれている。">
