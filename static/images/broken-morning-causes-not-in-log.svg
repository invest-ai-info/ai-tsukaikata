<svg xmlns="http://www.w3.org/2000/svg" width="720" height="467" viewBox="0 0 720 467" role="img" aria-label="自動実行が動かなかった朝に原因を聞いたとき、実行の記録に1語も出てこない原因語をいくつ挙げたかを、頼み方4通りで並べた横棒グラフ。架空の実行の記録3本、つまり今朝の行が無いもの、2時間遅れたもの、取得0件のものに、1つの頼み方につき材料3本かける各2回で6回ずつ、全部で24回通した。記録には通信、権限、制限、仕様変更など24語の原因語が1語も出てこないことを、走らせる前に検算してある。濃い棒は24語で数えた件数、薄い棒は記録の外にしか根拠が無い8語だけに絞って数えた件数。そのままなぜ動かなかったのか教えてと頼んだ6回は26件と16件。3択だけを渡した6回は10件と6件。どれにも当たらないならそう書いてくださいを足した6回は5件と3件。根拠になった行をそのままコピーしてくださいまで足した6回は、0件と0件だった。当て方を2通りに変えても並びは同じで、26が10、5、0と減り、16が6、3、0と減る。そのまま聞いた回では、記録に根拠が1行も無い原因が可能性の高い順として並ぶことがあり、その順位の根拠も記録には書かれていない。いちばん下の頼み方では、返り自身がなぜ取得が0件になったのかはこの記録には書かれていないので判断できませんと書いて止まった。">
<style>
