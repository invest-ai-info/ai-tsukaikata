<svg xmlns="http://www.w3.org/2000/svg" width="720" height="398" viewBox="0 0 720 398" role="img" aria-label="架空の発注書14項目と、違反を8件仕込んだ架空の原稿を突き合わせさせて、3通りの頼み方を比べた表。素朴に確認してと頼んだ場合、1項目ずつ飛ばさずに判定を付けさせた場合、さらに根拠として原稿の一文を引用させた場合の3つ。仕込んだ違反8件は、3通りとも8件すべて見つかり、誤って違反にしたものはどれも0件だった。違いは数字のほうに出た。素朴に頼んだ場合、自分が作った判定表にはNGが8件並んでいるのに、冒頭の要約では修正が必要な項目が7つと書いた。文字数の申告は約814字で、実測の823字と合わない。最長の文も47字と申告したが実測は46字だった。1項目ずつ順番に、項目を飛ばさないでくださいと頼むと、14項目すべてに判定が付き、件数の申告も8項目で正しく、文字数823字も最長の文46字も実測と一致した。さらに根拠として原稿の一文をそのまま引用させると、14項目のうち12項目に引用が付き、その12件はすべて原稿に実在した。残る2項目は引用できる箇所がないと明記された。なお、価格に触れたかどうかという曖昧な項目は、頼み方によって原稿からは判断できないと、違反の可能性が高いに割れた。">
