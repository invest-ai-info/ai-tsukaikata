</style>
<rect class="bg" x="0" y="0" width="720" height="398"/>
<text class="t-strong" x="18" y="26">発注書14項目との突き合わせ — 頼み方を3通り試した</text>
<text class="t-sm" x="18" y="45">架空の発注書14項目と、違反を8件仕込んだ架空の原稿。判定はすべて文字列照合。</text>
<text class="t-bad" x="240" y="78">「確認して」</text>
<text class="t-accent" x="380" y="78">1項目ずつ</text>
<text class="t-accent" x="520" y="78">＋根拠を引用</text>
<text class="t-xs" x="240" y="94">（素朴）</text>
<text class="t-xs" x="380" y="94">（飛ばさないで）</text>
<text class="t-xs" x="520" y="94">（原稿の一文）</text>
<text class="t" x="18" y="124">違反8件のうち見つけた数</text>
<text class="t-good" x="240" y="124">8/8</text>
<text class="t-good" x="380" y="124">8/8</text>
<text class="t-good" x="520" y="124">8/8</text>
<text class="t" x="18" y="150">誤って違反にした数</text>
<text class="t-good" x="240" y="150">0件</text>
<text class="t-good" x="380" y="150">0件</text>
<text class="t-good" x="520" y="150">0件</text>
<text class="t" x="18" y="176">14項目に判定が付いたか</text>
<text class="t-good" x="240" y="176">表で14項目</text>
<text class="t-good" x="380" y="176">14/14</text>
<text class="t-good" x="520" y="176">14/14</text>
<text class="t" x="18" y="202">本人が言った件数</text>
<text class="t-bad" x="240" y="202">「7つ」</text>
<text class="t-good" x="380" y="202">「8項目」</text>
<text class="t-sm" x="520" y="202">—</text>
<text class="t" x="18" y="228">文字数の申告（実測823字）</text>
<text class="t-bad" x="240" y="228">約814字</text>
<text class="t-good" x="380" y="228">823字</text>
<text class="t-good" x="520" y="228">823字</text>
<text class="t" x="18" y="254">最長の文（実測46字）</text>
<text class="t-bad" x="240" y="254">47字</text>
<text class="t-good" x="380" y="254">46字</text>
<text class="t-good" x="520" y="254">46字</text>
<text class="t" x="18" y="280">原稿の一文を引用したか</text>
<text class="t-good" x="240" y="280">指摘ごとに引用</text>
<text class="t-good" x="380" y="280">根拠として引用</text>
<text class="t-good" x="520" y="280">12/14に引用</text>
<text class="t" x="18" y="306">引用が原稿に実在したか</text>
<text class="t-sm" x="240" y="306">—</text>
<text class="t-sm" x="380" y="306">—</text>
<text class="t-good" x="520" y="306">12/12</text>
<text class="t-xs" x="18" y="334">※ どの頼み方でも、違反そのものは8件とも見つかっている。違いは「数字と件数が合うか」だけ。</text>
<text class="t-xs" x="18" y="354">※ 素朴版は、自分が作った表に8件のNGを並べておいて、冒頭の要約では「7つ」と書いた（読むのは要約のほう）。</text>
<text class="t-xs" x="18" y="374">※ 曖昧な項目（価格に触れたか）は、頼み方によって「判断できない」と「違反の可能性が高い」に割れた。</text>
</svg>
