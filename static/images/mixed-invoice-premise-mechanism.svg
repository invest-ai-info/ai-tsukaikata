<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="「項目2は対象外です」という誤った前提を指示文に書いたときと、前提の確認を先に頼んだときの違いを示す図。上段＝「項目2は対象外です」とだけ書く。見出しの結論は3回とも、誤った前提どおりの金額（1,128,530円）になった。正しい金額（1,057,060円）は「確認していただきたい点」という本文中盤の注記にしか現れなかった。下段＝「前提が制度上正しいか、計算の前に確認してください」を足す。見出しまたは冒頭が3回とも「項目2も対象です・説明は誤りです」という訂正になり、そのあとに正しい手取り額（1,057,060円）を示した。受け皿（訂正）自体は足す前から機能していたが、置き場所が結論の後ろだった。下の枠には、受け皿は足す前から3回とも本文のどこかにあったこと、結論の位置に置けるかどうかは一文があるかで決まったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">誤りは「分かっていない」ではなく「結論の位置」</text>
<text class="t-sm" x="18" y="45">どちらの版でも、本文のどこかには正しい金額が出ている。</text>
<text class="t-sm" x="18" y="64">違うのは、読者が最初に読む「結論」がどちらの数字かだけ。</text>
<rect class="box-bad" x="18" y="112" width="684" height="90" rx="6"/>
<text class="t-strong" x="34" y="134">「項目2は対象外です」とだけ書く</text>
<text class="t-bad" x="34" y="154">見出しの結論は3回とも、誤った前提どおりの金額（1,128,530円）になった。</text>
<text class="t-bad" x="34" y="172">正しい金額（1,057,060円）は「確認していただきたい点」という</text>
<text class="t-bad" x="34" y="190">本文中盤の注記にしか現れなかった。</text>
<rect class="box-good" x="18" y="212" width="684" height="90" rx="6"/>
<text class="t-strong" x="34" y="234">「前提が制度上正しいか、計算の前に確認してください」を足す</text>
<text class="t-good" x="34" y="254">見出しまたは冒頭が3回とも「項目2も対象です・説明は誤りです」という</text>
<text class="t-good" x="34" y="272">訂正になり、そのあとに正しい手取り額（1,057,060円）を示した。</text>
<text class="t-good" x="34" y="290">受け皿（訂正）自体は足す前から機能していたが、置き場所が結論の後ろだった。</text>
<rect class="box-accent" x="18" y="318" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="338">受け皿（正しい前提への訂正）は、足す前から3回とも本文のどこかにあった。</text>
<text class="t-accent" x="34" y="356">結論の位置に置けるかどうかは、「確認してから計算して」の一文があるかで決まった。</text>
</svg>
