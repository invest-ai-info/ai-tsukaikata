<svg xmlns="http://www.w3.org/2000/svg" width="720" height="254" viewBox="0 0 720 254" role="img" aria-label="動画ファイルを直接読み込めるかを3社で比べた表。Geminiは動画ファイルの直接入力ができる、動画の中を動的に探索する機能もある。Claude・GPTはどちらも公式ページに動画の記載がなく、動的に探索する機能もない。「記載なし」は機能が無いと明言されているわけではなく、公式ページに書かれていないという意味。Geminiの話はGemini 3.7 Flash・3.6 Flash・3.5 Flash-Lite（後日3.8 Flashも追加）についてで、Claude・GPTにも画像・音声を扱う機能はあるが、動画ファイルそのものを読み込む形式ではない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="254"/>
<text class="t-strong" x="18" y="26">動画ファイルを直接読み込めるのは、いまのところGeminiだけ</text>
<text class="t-sm" x="18" y="45">各社の公式ドキュメントが「対応する入力」として挙げている形式を確かめた結果。</text>
<text class="t-sm" x="18" y="64">Claude・GPTのページはどちらも「文章と画像に対応」とだけ書かれ、動画の記載がありません。</text>
<text class="t-sm" x="18" y="83">「記載なし」は、その機能が無いと明言されているわけではなく、公式ページに書かれていないという意味です。</text>
<text class="t-xs" x="18" y="106">見るところ</text>
<text class="t-xs" x="292" y="106">Gemini</text>
<text class="t-xs" x="428" y="106">Claude</text>
<text class="t-xs" x="566" y="106">GPT</text>
<text class="t" x="18" y="134">動画ファイルの直接入力</text>
<text class="t-good" x="292" y="134">できる</text>
<text class="t-bad" x="428" y="134">記載なし</text>
<text class="t-bad" x="566" y="134">記載なし</text>
<text class="t" x="18" y="164">動画の中を動的に探索</text>
<text class="t-good" x="292" y="164">ある</text>
<text class="t-bad" x="428" y="164">ない</text>
<text class="t-bad" x="566" y="164">ない</text>
<text class="t-xs" x="18" y="214">※ Geminiの列は Gemini 3.7 Flash・3.6 Flash・3.5 Flash-Lite（3.8 Flashも後日追加）の話です。</text>
<text class="t-xs" x="18" y="232">※ Claude・GPTにも画像・音声を扱う機能はありますが、動画ファイルそのものを読み込む形式ではありません。</text>
</svg>
