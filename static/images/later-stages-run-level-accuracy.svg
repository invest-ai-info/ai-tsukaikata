<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="工程3の期限欄の割れと、新しく足した工程4・5の run単位の完全正解率を比べた表。工程3で期限欄まで12件とも機能したrunは4本中1本、期限欄が機能しなかったrunは4本中3本で、新規2工程はこの3本も引き継いでいる。工程4（部署の振り分けが12件とも真値どおりだったrun）は4本中4本、工程5（集計表が4セルとも真値どおりだったrun）も4本中4本。下の枠には、工程4・5は期限欄が機能しなかった3本を引き継いでも48件・4表とも崩れなかったこと、部署の判定も集計も期限を使わないので工程3の欠けは伝わらず消えたこと、工程3が完全に0件で止まった場合は別の図で扱い、作り話での穴埋めは0件だったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">工程3で割れた期限欄も、使わない工程4・5では一度も崩れなかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-17。前の記事（2026-08-23）の工程3の出力4本を、そのまま工程4・5の入力にした。</text>
<text class="t-sm" x="18" y="64">行は run 単位（4通し）での完全正解。工程3は期限欄まで12件とも機能したかを見る。</text>
<text class="t-xs" x="528.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">工程3：期限欄まで12件とも機能した run</text>
<rect class="box" x="448" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="528.0" y="125" text-anchor="middle" style="font-weight:700">1/4</text>
<text class="t" x="18" y="157">工程3：期限欄が機能しなかった run（新規2工程はこれを引き継いだ）</text>
<rect class="box-bad" x="448" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="157" text-anchor="middle" style="font-weight:700">3/4</text>
<text class="t" x="18" y="189">工程4（新規）：部署の振り分けが12件とも真値どおりだった run</text>
<rect class="box-good" x="448" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="189" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="221">工程5（新規）：集計表が4セルとも真値どおりだった run</text>
<rect class="box-good" x="448" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="221" text-anchor="middle" style="font-weight:700">4/4</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">✅ 工程4・5は、期限欄が機能しなかった3本を引き継いでも、48件・4表とも崩れなかった。</text>
<text class="t-accent" x="34" y="276">🔑 部署の判定も集計も「期限」を使わないので、工程3の欠けはそのまま伝わらずに消えた。</text>
<text class="t-accent" x="34" y="294">🚨 工程3が完全に0件で止まった場合は別枠（もう1枚の図）。作り話での穴埋めは0件だった。</text>
</svg>
