<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="KDP原文を会話の1ターン目だけで貼って引用させた結果を示す表。すべて「正しい引用・4か国に到達した回数／試した回数」で、多いほど良い。資料を全部貼った版は4回中4回、関連部分だけ貼った版も4回中4回、無関係な情報を混ぜた版も3回中3回、いずれも正しい引用と4か国（日本・インド・メキシコ・ブラジル）に到達した。4行目・5行目は「資料に書かれていない範囲まで断定で広げた回」で、引用を求めずに聞いた3回中2回、引用を求めた11回のうち2回がこの誤りを起こした。下の枠には、資料を全部貼る・関連部分だけ貼る・無関係情報を混ぜる、どの版も合計11回とも正しい引用・4か国だったこと、これは既出記事が3ターン目に送って3回とも原文どおりだった結果と同じ正確さだったこと、違いが出たのは引用の有無のほうで引用を求めないと3回中2回、求めた11回中2回が範囲を断定で広げたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">1ターン目だけで貼っても、引用の正確さは変わらなかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-09。KDP原文を単発の1ターンで貼り、独立した新規の会話にそれぞれ試した。</text>
<text class="t-sm" x="18" y="64">4・5行目は「書かれていない範囲を断定で広げた回」で、少ないほど良い。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">資料を全部貼って引用させる→正しい引用・4か国</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="157">関連部分だけ貼って引用させる→正しい引用・4か国</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="189">無関係な情報を混ぜても引用させる→正しい引用・4か国</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">引用を求めずに聞く→書かれていない範囲を断定で広げた回</text>
<rect class="box-bad" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="221" text-anchor="middle" style="font-weight:700">2/3</text>
<text class="t" x="18" y="253">引用を求めた11回のうち、同じ誤りが出た回</text>
<rect class="box-bad" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="253" text-anchor="middle" style="font-weight:700">2/11</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">資料を全部貼る・関連部分だけ貼る・無関係情報を混ぜる、どの版も合計11回とも正しい引用・4か国だった。</text>
<text class="t-accent" x="34" y="308">既出記事が3ターン目（前提を積んだ後）に送って3回とも原文どおりだった結果と、同じ正確さだった。</text>
<text class="t-accent" x="34" y="326">違いが出たのは引用の有無のほう——引用を求めないと3回中2回、求めた11回中2回が範囲を断定で広げた。</text>
</svg>
