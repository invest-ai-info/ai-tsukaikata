<svg xmlns="http://www.w3.org/2000/svg" width="720" height="276" viewBox="0 0 720 276" role="img" aria-label="同じ10月5日（クレーム対応の連絡から17日後）について、素朴に聞いた場合と、経過日数とその後の依頼再開・平常提出を名指しで示した場合を比べた図。素朴に聞いた場合は2回とも不適切。経過日数（17日）とその後の好転を名指しした場合は3回とも適切に変わった。評価そのものではなく、経過日数と具体的な出来事を名指ししたことが効いた。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="276"/>
<text class="t-strong" x="18" y="24">古い懸念は自分では賞味期限切れにならない。日数と好転を名指しすると直る</text>
<text class="t-sm" x="18" y="43">同じ10/5（クレーム対応の連絡から17日後）に、素朴に聞いた場合と、</text>
<text class="t-sm" x="18" y="62">経過日数・その後の依頼再開・平常提出を名指しで示した場合を比べた。</text>
<text class="t" x="18" y="138">10/5をそのまま聞く（n=2）</text>
<rect class="box-bad" x="430" y="120" width="150" height="26" rx="4"/>
<text class="t-bad" x="471" y="138" style="font-size:12.5px">不適切　0/2</text>
<text class="t" x="18" y="184">＋「17日経って落ち着いたかも」を足す（n=3）</text>
<rect class="box-good" x="430" y="166" width="150" height="26" rx="4"/>
<text class="t-good" x="471" y="184" style="font-size:12.5px">適切　3/3</text>
<rect class="box-accent" x="18" y="212" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="232">「もう落ち着いたかもしれない」という評価そのものではなく、経過日数（17日）と</text>
<text class="t-accent" x="34" y="250">その後の具体的な出来事（依頼再開・平常提出）を名指ししたことが効いた。</text>
</svg>
