    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="448"/>
<text class="t-strong" x="18" y="26">6つの場面は、3つの別々の政策に分かれる</text>
<text class="t-sm" x="18" y="45">YouTubeのチャンネル収益化ポリシー（support.google.com/youtube/answer/1311392）2026-09-28確認。</text>
<text class="t-sm" x="18" y="64">「AI生成コンテンツ」の例は量産型のコンテンツの中にしかない。F・Dはそれぞれ別の政策の対象。</text>
<rect class="box-accent" x="18" y="100" width="684" height="80" rx="6"/>
<text class="t-strong" x="34" y="122">量産型のコンテンツ（旧称: 繰り返しの多いコンテンツ）</text>
<rect class="box-good" x="34.0" y="136.0" width="92" height="24" rx="4"/>
<text class="t-good" x="80.0" y="152.0" text-anchor="middle" style="font-weight:700">A 許可</text>
<rect class="box-good" x="136.0" y="136.0" width="92" height="24" rx="4"/>
<text class="t-good" x="182.0" y="152.0" text-anchor="middle" style="font-weight:700">B 許可</text>
<rect class="box-bad" x="238.0" y="136.0" width="92" height="24" rx="4"/>
<text class="t-bad" x="284.0" y="152.0" text-anchor="middle" style="font-weight:700">C 不許可</text>
<rect class="box-good" x="340.0" y="136.0" width="92" height="24" rx="4"/>
<text class="t-good" x="386.0" y="152.0" text-anchor="middle" style="font-weight:700">E 許可</text>
<rect class="box-accent" x="18" y="192" width="684" height="80" rx="6"/>
<text class="t-strong" x="34" y="214">再利用されたコンテンツ</text>
<rect class="box-bad" x="34.0" y="228.0" width="92" height="24" rx="4"/>
<text class="t-bad" x="80.0" y="244.0" text-anchor="middle" style="font-weight:700">F 不許可</text>
<rect class="box-quiet" x="18" y="284" width="684" height="80" rx="6"/>
<text class="t-strong" x="34" y="306">満足度の低い、または不快なコンテンツ（この記事では原文を見せていない）</text>
<rect class="box-bad" x="34.0" y="320.0" width="92" height="24" rx="4"/>
<text class="t-bad" x="80.0" y="336.0" text-anchor="middle" style="font-weight:700">D 不許可</text>
<rect class="box-accent" x="18" y="382" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="402">片方の政策の原文だけ見せると、対象外の場面までその政策の理屈で判定されやすい。</text>
<text class="t-accent" x="34" y="420">関連する政策を全部見せて、どの政策かを名指しさせると、正しく切り分けられた。</text>
</svg>
