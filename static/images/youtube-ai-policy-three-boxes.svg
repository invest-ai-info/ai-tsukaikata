<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" role="img" aria-label="YouTubeのチャンネル収益化ポリシーのうち、記事が扱った3つの政策と、6つの実験シナリオ（A〜F）がどこに属するかを示す図。1段目「量産型のコンテンツ（旧称: 繰り返しの多いコンテンツ）」には、Aオリジナルキャラクターの映像化（許可）、B台本編集・背景生成はAIでストーリーは自分で調査（許可）、C同テーマのAI生成動画をテンプレートで毎日投稿（不許可）、Eイントロ・エンディングは同じで中身は動画ごとに違う（許可）が属する。2段目「再利用されたコンテンツ」には、Fニュース記事をAIに読み上げさせるだけ（不許可）が属する。3段目「満足度の低い、または不快なコンテンツ（この記事では原文を見せていない）」には、D関連性の薄いAIクリップをつなぎ合わせるだけ（不許可）が属する。下の枠には、片方の政策の原文だけ見せると対象外の場面までその政策の理屈で判定されやすいこと、関連する政策を全部見せてどの政策かを名指しさせると正しく切り分けられたことが書かれている。">
<style>
