<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="2件同時の曖昧なキャンセルを仕込んだ実測結果を比べた図。計算式を明示して2件分の隠れた不足を見つけた回数は10/10、計算式を明示して正当なキャンセルを誤って不足扱いした回数は0/10、素朴に聞いて2件分の隠れた不足を見つけた回数は9/10、素朴に聞いて正当なキャンセルを誤って不足扱いした回数は0/10。下の枠には、計算式を明示する言い方は1件のときと同じ精度（見逃し0・誤判定0）を2件同時でも保ったこと、素朴に聞いた10回も9回は正しく見つけたが1回だけ同じ回答の中で不足額が2つの違う数字（誤答と正答）に割れたこと、単純に数えると「見つけた」側に入るがこの1回は本文で別に扱うことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">2件同時でも、計算式を明示すれば10回とも見つかる</text>
<text class="t-sm" x="18" y="45">実測2026-10-22。保守・運用代行の契約各12社に、2件分の曖昧なキャンセルを同時に仕込んだ1社を含めた。</text>
<text class="t-sm" x="18" y="64">計算式を明示した版・素朴に聞いた版を各10回（2種×5回）比べた。正当なキャンセルは誤判定が無いかも見た。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">計算式を明示して、2件分の隠れた不足を見つけた回数</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="157">計算式を明示して、正当なキャンセルを誤って不足扱いした回数</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">0/10</text>
<text class="t" x="18" y="189">素朴に聞いて、2件分の隠れた不足を見つけた回数</text>
<rect class="box" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="189" text-anchor="middle" style="font-weight:700">9/10</text>
<text class="t" x="18" y="221">素朴に聞いて、正当なキャンセルを誤って不足扱いした回数</text>
<rect class="box-good" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="221" text-anchor="middle" style="font-weight:700">0/10</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">✅ 計算式を明示する言い方は、1件のときと同じ精度（見逃し0・誤判定0）を2件同時でも保った。</text>
<text class="t-accent" x="34" y="276">📌 素朴に聞いた10回も9回は正しく見つけたが、1回だけ同じ回答の中で不足額が2つの違う数字（誤答と正答）に割れた。</text>
<text class="t-accent" x="34" y="294">⚠️ 単純に数えると「見つけた」側に入るが、本文ではこの1回を別に扱う。</text>
</svg>
