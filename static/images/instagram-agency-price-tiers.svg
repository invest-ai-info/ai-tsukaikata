</style>
<rect class="bg" x="0" y="0" width="720" height="314"/>
<text class="t-strong" x="18" y="26">57件の価格帯＝中央値30,000円・平均約32,772円（最小1,500円・最大100,000円）</text>
<text class="t-sm" x="18" y="45">ココナラで「インスタ運用代行」を検索した1ページ目60件から、note・Pinterest・X向け3件を除いた57件。</text>
<text class="t-sm" x="18" y="64">2026年11月12日に検索結果ページを取得して数えた。ランキング順の1ページ目だけで、全5,080件の相場ではない。</text>
<text class="t-xs" x="280" y="86">件数（57件中）</text>
<text class="t-strong" x="18" y="120">20,000円未満</text>
<rect class="bar-in" x="280" y="107" width="198" height="18" rx="3"/>
<text class="t-strong" x="486" y="120">16件</text>
<text class="t-strong" x="18" y="160">20,000〜49,999円</text>
<rect class="bar-in" x="280" y="147" width="310" height="18" rx="3"/>
<text class="t-strong" x="598" y="160">25件</text>
<text class="t-strong" x="18" y="200">50,000円以上（最大100,000円）</text>
<rect class="bar-in" x="280" y="187" width="198" height="18" rx="3"/>
<text class="t-strong" x="486" y="200">16件</text>
<rect class="box-accent" x="18" y="230" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="250">一覧の価格表示は出品者が付けた札で、そのまま1か月分の運用代金とは限らない（次の図）。</text>
<text class="t-accent" x="34" y="268">20,000〜49,999円が25件（44%）で最多。1,500円・100,000円のような極端な値は少数派。</text>
<text class="t-accent" x="34" y="286">何が含まれるかはプラン・出品者ごとに違う。価格帯だけで同じ作業量を期待できるわけではない。</text>
</svg>
