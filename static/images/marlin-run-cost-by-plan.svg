<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img" aria-label="Sakana Marlinのプランごとに、リサーチ1回あたりの実質金額を比べた横棒グラフ。従量課金（都度払い）は100クレジット×98円で9,800円/回。Pro（月15万円）は月2,000クレジット付与で20回ぶんに相当し7,500円/回。Team（月40万円）は月6,000クレジット付与で60回ぶんに相当し6,667円/回。1回あたりの円額は記事側の計算（月額÷月内に使い切れる回数）で、ページに直接の記載はない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="256"/>
<text class="t-strong" x="18" y="26">Sakana Marlinは、月極めプランほど1回あたりが安くなる</text>
<text class="t-sm" x="18" y="45">1回のリサーチは3プランとも100クレジットを使う。差はクレジット単価と月額の内訳。</text>
<text class="t-sm" x="18" y="64">月額の内訳（¥150,000÷20回・¥400,000÷60回）はページの数字からこの記事が計算した。</text>
<text class="t" x="18" y="112">従量課金（都度払い）</text>
<rect class="bar-old" x="268" y="96" width="348.0" height="20" rx="2"/>
<text class="t-sm" x="624.0" y="112">¥9,800/回</text>
<text class="t-xs" x="18" y="128">100クレジット×¥98/クレジット</text>
<text class="t" x="18" y="152">Pro（月¥150,000）</text>
<rect class="bar-new" x="268" y="136" width="266.3" height="20" rx="2"/>
<text class="t-sm" x="542.3" y="152">¥7,500/回</text>
<text class="t-xs" x="18" y="168">月2,000クレジット付与＝20回ぶん</text>
<text class="t" x="18" y="192">Team（月¥400,000）</text>
<rect class="bar-new" x="268" y="176" width="236.7" height="20" rx="2"/>
<text class="t-sm" x="512.7" y="192">¥6,667/回</text>
<text class="t-xs" x="18" y="208">月6,000クレジット付与＝60回ぶん</text>
<text class="t-xs" x="18" y="234">※ 出典: Sakana Marlin 料金ページ（sakana.ai/marlin/・2026年9月22日に確認）。</text>
<text class="t-xs" x="18" y="250">※ 1回あたりの円額はこの記事の計算（月額÷月内に使い切れる回数）。ページに直接の記載はない。</text>
</svg>
