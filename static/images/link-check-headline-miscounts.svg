<svg xmlns="http://www.w3.org/2000/svg" width="720" height="258" viewBox="0 0 720 258" role="img" aria-label="判断基準の渡し方を4版（HEADとGETを渡して素朴に聞く・GETも404の場合だけ切れていると数字の基準を渡す・確認できないリンクの受け皿を追加・名前を全部挙げたあとに件数を書く）に分け、見出しに書いた件数が実際の列挙件数と食い違い本文中で自己訂正した回数を示す横棒グラフ。素朴に聞いた版は4回中0回。数字の基準を渡した版は4回中4回。受け皿を追加した版は4回中2回に減ったが消えなかった。名前を全部挙げたあとに件数を書くよう指示を変えた版は4回中0回に戻った。4版とも、列挙したリンクのID自体は4回とも真値と完全に一致しており、分類そのものに誤りはなかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="258"/>
<text class="t-strong" x="18" y="24">見出しの件数は4回中最大4回ずれる。直るのは基準ではなく「件数を名前のあとに」</text>
<text class="t-sm" x="18" y="43">同じ架空リンク一覧（材料2本×各2回＝4回）に、判断基準の渡し方を4版試した。</text>
<text class="t-sm" x="18" y="62">縦軸は、見出しに書いた件数が実際の列挙件数と食い違い、本文中で自己訂正した回数。</text>
<text class="t-xs" x="18" y="81">4版とも、列挙したリンクのID自体は4回とも真値と完全一致していた（分類ミスは0）。</text>
<text class="t" x="18" y="123">HEADとGETを渡して素朴に聞く</text>
<rect class="box-quiet" x="330.0" y="112" width="3.0" height="16" rx="3"/>
<text class="t-good" x="642.0" y="123">0/4回</text>
<text class="t" x="18" y="153">GETも404の場合だけ、と数字の基準</text>
<rect class="box-bad" x="330.0" y="142" width="300.0" height="16" rx="3"/>
<text class="t-bad" x="642.0" y="153">4/4回</text>
<text class="t" x="18" y="183">＋確認できないリンクの受け皿を追加</text>
<rect class="box-bad" x="330.0" y="172" width="150.0" height="16" rx="3"/>
<text class="t-bad" x="642.0" y="183">2/4回</text>
<text class="t" x="18" y="213">名前を全部挙げたあとに件数を書く</text>
<rect class="box-quiet" x="330.0" y="202" width="3.0" height="16" rx="3"/>
<text class="t-good" x="642.0" y="213">0/4回</text>
<path class="line" d="M330.0 104 L330.0 216" stroke-dasharray="4 3"/>
</svg>
