<rect class="bg" x="0" y="0" width="720" height="462"/>
<text class="t-strong" x="18" y="26">公式が挙げた点数（Sonnet 5 → Sonnet 5.5）</text>
<text class="t-sm" x="18" y="45">灰色＝Sonnet 5、青＝Sonnet 5.5。目盛りは0〜100％で揃えてあります。</text>
<text class="t-sm" x="18" y="64">Sonnet 5.5 は既定（Medium効果）の値です。数値以外の点数（GDPval-AA等）は別表にしてあります。</text>
