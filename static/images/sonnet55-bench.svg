<svg xmlns="http://www.w3.org/2000/svg" width="720" height="462" viewBox="0 0 720 462" role="img" aria-label="Sonnet 5 と Sonnet 5.5 の点数を比べた横棒グラフ。Terminal-Bench 4.0 は10.3％から70.6％、FrontierCode 1.1（Max効果）は42.4％から46.2％、CursorBench 4.0 は34.1％から55.5％、Humanity’s Last Examの道具ありは54.9％から64.5％、OSWorld 2.1の部分点ありは57.0％から80.1％、Chartographyの道具なしは15.6％から61.6％。いずれもAnthropicが自社で測った値で、テストの中身も測り方も別々のため平均は取れない。">
<style>
