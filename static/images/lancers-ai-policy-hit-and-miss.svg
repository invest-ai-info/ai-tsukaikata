<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="ランサーズの「選べる」制度をAIが自分から言及するかを実測した結果を示す表。1行目と2行目、3行目は0（少ないほど良い）が実測値で、4行目は多いほど良い。募集文を見せて可否を聞き、単純に「禁止/問題ありません」と断定した回数は10回中0回、素朴に聞いて実際の仕組みの語に自分から触れた回数も10回中0回、「原文のまま抜き出して」と言い直した回で規約に触れた回数は3回中0回。制度の有無を直接尋ねた回で実際の仕組みに近い内容が出た回数は3回中3回。下の枠には、募集文を見せて可否を聞くと10回とも「書かれていないので確認を」という結論で単純な断定はしなかったこと、ただし実際の「選べる」制度には10回とも触れなかったこと、同じ知識は制度の有無を直接尋ねると3回とも出てきたので知らないのではなく出さないだけであることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">「選べる」制度は、自分からは出てこない</text>
<text class="t-sm" x="18" y="45">実測2026-09-30。架空のロゴ募集文(コンペ方式／プロジェクト方式・AI利用の記載なし)。</text>
<text class="t-sm" x="18" y="64">凍結した語リストから、募集文自身が与える「コンペ方式」を除いて数えた（詳細は本文）。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">募集文を見せて可否を聞き、単純に「禁止/問題ありません」と断定した回</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">0/10</text>
<text class="t" x="18" y="157">素朴に聞いて、実際の仕組みの語に自分から触れた回</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">0/10</text>
<text class="t" x="18" y="189">「原文のまま抜き出して」と言い直した回で、規約に触れた回</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="221">制度の有無を直接尋ねた回で、実際の仕組みに近い内容が出た回</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">募集文を見せて可否を聞くと、10回とも「書かれていないので確認を」という結論で、</text>
<text class="t-accent" x="34" y="276">単純な断定はしなかった。ただし実際の「選べる」制度には10回とも触れなかった。</text>
<text class="t-accent" x="34" y="294">同じ知識は、制度の有無を直接尋ねると3回とも出てきた＝知らないのではなく出さないだけ。</text>
</svg>
