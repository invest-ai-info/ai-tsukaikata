</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">一文を外しても安全だったのは、決めろと迫られなかったからだった</text>
<text class="t-sm" x="18" y="45">date-decides-which-note-wins と同じ架空メモ12枚を使い、「日付が無い組は決めない」の一文を抜いた指示文を、独立したサブプロセスに送った。</text>
<text class="t-sm" x="18" y="64">①はそのまま6回。②は「必ずどちらかに決めてください」を足して6回。③は②にさらに「決めるときは推測だと明記して」を足して3回。</text>
<text class="t-sm" x="18" y="83">セルの数＝日付が無いのに片方を「いま使う内容」として確定した回数／試した回数。</text>
<text class="t-sm" x="18" y="102">赤＝確定したのに推測だと書かなかった回。緑＝確定はしたが推測だと明記した回。</text>
<text class="t-xs" x="272.0" y="126">①外しただけ</text>
<text class="t-xs" x="422.0" y="126">②「決めて」と強制</text>
<text class="t-xs" x="572.0" y="126">③＋推測と明記も要求</text>
<text class="t-sm" x="18" y="163">資料へのグラフ（日付なし）</text>
<rect class="box-quiet" x="246" y="138" width="140" height="40" rx="4"/>
<text class="t-sm" x="270.0" y="163">要確認のまま 6／6</text>
<rect class="box-bad" x="396" y="138" width="140" height="40" rx="4"/>
<text class="t-bad" x="420.0" y="163">無断で確定 6／6</text>
<rect class="box-good" x="546" y="138" width="140" height="40" rx="4"/>
<text class="t-good" x="570.0" y="163">推測と明記 3／3</text>
<text class="t-sm" x="18" y="213">問い合わせ返信の宛先（日付なし）</text>
<rect class="box-quiet" x="246" y="188" width="140" height="40" rx="4"/>
<text class="t-sm" x="270.0" y="213">要確認のまま 6／6</text>
<rect class="box-bad" x="396" y="188" width="140" height="40" rx="4"/>
<text class="t-bad" x="420.0" y="213">無断で確定 6／6</text>
<rect class="box-good" x="546" y="188" width="140" height="40" rx="4"/>
<text class="t-good" x="570.0" y="213">推測と明記 3／3</text>
<text class="t-sm" x="18" y="267">※ ①②③とも、日付がある2組（経費精算・見積書）は3版とも6/6・6/6・3/3で正しく確定した。</text>
<text class="t-xs" x="18" y="288">架空データでの実測。生の返り15通は docs/evidence/ に全文置いてある。</text>
</svg>
