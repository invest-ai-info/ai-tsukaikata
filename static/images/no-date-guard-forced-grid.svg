<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="資料へのグラフ・問い合わせ返信の宛先という日付の無い2組について、3種類の指示文で日付が無いのに確定した回数を並べたマス目。①一文を外しただけ（6回）はどちらの組も0/6で要確認のまま残った。②「必ず決めてください」と強制した6回は、どちらの組も6/6で確定し、しかも推測だとは書かなかった。③②にさらに推測の明記を求めた3回は、どちらの組も3/3で確定しつつ、今度は推測であることを明記した。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
