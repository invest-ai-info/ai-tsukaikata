<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="誤訳・訳抜け（ライトPEの範囲）を直せた回数を示す表。「ライトポストエディットとして」は8回中8回、用語に範囲の説明を重ねた版は3回中3回、用語を使わず「誤訳や不自然な点があれば直して」は5回中5回、「フルポストエディットとして」は2回中2回、すべて100%直った。下の枠には、誤訳・訳抜けを見つけて直す力そのものは頼み方を変えても揺れなかったこと、変わるのは「それ以外に何を直すか」という範囲のほうだけだったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">誤訳・訳抜けの修正は、頼み方を変えても崩れなかった</text>
<text class="t-sm" x="18" y="45">実測2026-11-04。同じ架空のビジネスメール2本に仕込んだ、数字・日付の誤訳・訳抜け3件を数えた。</text>
<text class="t-sm" x="18" y="64">「ライトポストエディットとして」「用語なし」「フルPEとして」のどの頼み方でも100%直った。</text>
<text class="t-xs" x="498.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">「ライトポストエディットとして」（8回）</text>
<rect class="box-good" x="418" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="498.0" y="125" text-anchor="middle" style="font-weight:700">8/8</text>
<text class="t" x="18" y="157">用語＋範囲を言葉でも重ねた版（3回）</text>
<rect class="box-good" x="418" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="498.0" y="157" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="189">「誤訳や不自然な点があれば直して」（5回）</text>
<rect class="box-good" x="418" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="498.0" y="189" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="221">「フルポストエディットとして」（2回）</text>
<rect class="box-good" x="418" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="498.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">誤訳・訳抜けを見つけて直す力そのものは、頼み方を変えても揺れなかった。</text>
<text class="t-accent" x="34" y="276">変わるのは「それ以外に何を直すか」という範囲のほうだけだった。</text>
</svg>
