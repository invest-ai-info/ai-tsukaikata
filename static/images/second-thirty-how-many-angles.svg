<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" aria-label="30案の次にもう30案出させて合計60案にしたとき、その60案が切り口としては何通りだったかを並べた図。数えた案の数は60案で、1巡目30案と2巡目30案が20回とも数はぴったり返ってきた。ところが同じ会話でAI自身に、2巡目の30案のうち1巡目と発想が重なっているものを挙げさせると、4回の実測で19案から28案が重なると答えた。さらに60案を言い回しの近いものどうしでまとめさせると、13通りから16通りの切り口にしかならなかった。本当に新しい案として残ったのは、4回とも2案から11案である。この数はAI自身の判定で、機械で数えた完全一致は0件、言い回しの近さで数えても2件から9件にとどまる。重なっているかどうかは、文字列で数えるか発想で数えるかで答えが1桁変わる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="286"/>
<text class="t-strong" x="18" y="26">「30案＋30案＝60案」を、切り口の数で数え直すと</text>
<text class="t-sm" x="18" y="45">架空の発注書2本（パン屋の食パン／オンラインヨガ教室）。同じ会話の続きで、まとめさせた回と、重なりを挙げさせた回。</text>
<text class="t-sm" x="18" y="64">文字列としては重複ゼロに近いのに、切り口として数え直すと4分の1近くに減る。</text>
<rect class="box-good" x="18" y="96" width="216" height="96" rx="8"/>
<text class="t-sm" x="32" y="118">数えた案の数</text>
<text class="t-strong" x="32" y="146">60案</text>
<text class="t-xs" x="32" y="166">1巡目30案＋2巡目30案。</text>
<text class="t-xs" x="32" y="182">20回とも数はぴったり。</text>
<rect class="box-quiet" x="252" y="96" width="216" height="96" rx="8"/>
<text class="t-sm" x="266" y="118">AI自身が「重なる」と挙げた数</text>
<text class="t-strong" x="266" y="146">19〜28案</text>
<text class="t-xs" x="266" y="166">2巡目の30案のうち。</text>
<text class="t-xs" x="266" y="182">4回の実測（材料2本×各2回）。</text>
<rect class="box-bad" x="486" y="96" width="216" height="96" rx="8"/>
<text class="t-sm" x="500" y="118">まとめさせた後の切り口の数</text>
<text class="t-strong" x="500" y="146">13〜16通り</text>
<text class="t-xs" x="500" y="166">60案をまとめさせると。</text>
<text class="t-xs" x="500" y="182">4回の実測（同上）。</text>
<text class="t-accent" x="18" y="224">「本当に新しい案」として残ったのは、4回とも2〜11案だった（30案中）</text>
<text class="t-sm" x="18" y="246">※ この数はAI自身の判定。機械で数えた完全一致は0件、言い回しの近さで数えても2〜9件で、どちらもこれより小さい。</text>
<text class="t-sm" x="18" y="266">※ つまり「重なっているか」は、文字列で数えるか発想で数えるかで、答えが1桁変わる。</text>
</svg>
