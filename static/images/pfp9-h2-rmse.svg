<svg xmlns="http://www.w3.org/2000/svg" width="720" height="308" viewBox="0 0 720 308" role="img" aria-label="水素が燃える19本の素反応について、予測した反応熱と実験値のずれを比べた横棒グラフ。単位は kcal/mol で、短いほど正確。PFP v9 の r2SCAN モードが3.10、PFP v9 の PBE モードが7.88、MACE-MPA-0 が11.15。この数え方は走らせるたびに結果が変わらないと発表ページが説明しており、実験値は比較相手 MACE-MPA の論文の図から読み取ったものだと同じページに書かれている。MLIP Arena の順位づけには、この数え方は入っていない。発表ページは r2SCAN は PBE に対して誤差を56パーセント低減と書いている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="308"/>
<text class="t-strong" x="18" y="26">水素が燃える19本の反応。予測した熱と実験値のずれ（小さいほど正確）</text>
<text class="t-sm" x="18" y="45">単位は kcal/mol。この数え方は、走らせるたびに結果が変わらないと発表ページが説明しています。</text>
<text class="t-sm" x="18" y="64">実験値は、比較相手 MACE-MPA の論文の図から読み取ったものだと同じページに書かれています。</text>
<text class="t" x="18" y="127">PFP v9（r2SCAN モード）</text>
<rect class="bar-new" x="260" y="108" width="94.5" height="26" rx="2"/>
<text class="t-sm" x="364.5" y="127">3.10</text>
<text class="t" x="18" y="173">PFP v9（PBE モード）</text>
<rect class="bar-in" x="260" y="154" width="240.3" height="26" rx="2"/>
<text class="t-sm" x="510.3" y="173">7.88</text>
<text class="t" x="18" y="219">MACE-MPA-0</text>
<rect class="bar-old" x="260" y="200" width="340.0" height="26" rx="2"/>
<text class="t-sm" x="610.0" y="219">11.15</text>
<text class="t-xs" x="18" y="266">※ MLIP Arena の順位づけには、この数え方は入っていません。別に足した確認です。</text>
<text class="t-xs" x="18" y="285">※ 発表ページは「r2SCAN は PBE に対して誤差を56%低減」と書いています。</text>
</svg>
