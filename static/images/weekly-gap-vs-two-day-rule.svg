<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="横棒グラフ。P5の毎週の0件区間（6日間・正常版で8回繰り返す）と、本当の停止（0件20日間・停止版で1回）の長さを、『2日ルールの基準』を示す縦の点線と並べて示す。毎週の0件区間（6日）も本当の停止（20日）も、どちらも2日の基準線を大きく超えている。下の枠には、0件が2日続いたかどうかだけでは、健全な週と本当の停止を区別できないことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="310"/>
<text class="t-strong" x="18" y="24">健全な週の0件区間も、本当の停止も、どちらも「2日」を大きく超える</text>
<text class="t-sm" x="18" y="43">P5は週1回だけ動く処理。健全な週でも、実行した翌日から次の実行の前日まで6日間は0件になる。</text>
<text class="t-sm" x="18" y="62">「0件が2日以上続いたら必ず該当」という基準だけでは、この2本を区別できない。</text>
<text class="t-xs" x="530.0" y="94">日</text>
<line class="line" x1="283.3" y1="104" x2="283.3" y2="194" stroke-dasharray="3 3"/>
<text class="t-xs" x="283.3" y="100" text-anchor="middle">2日ルールの基準</text>
<text class="t" x="18" y="123.0">健全な週の0件区間</text>
<text class="t" x="18" y="139.0">（6日・8回繰り返す）</text>
<rect class="box-quiet" x="260.0" y="121.0" width="280.0" height="18" rx="3"/>
<rect class="bar-old" x="260.0" y="121.0" width="70.0" height="18" rx="3"/>
<text class="t-strong" x="550.0" y="134.0" style="font-weight:700">6日</text>
<text class="t" x="18" y="187.0">本当の停止</text>
<text class="t" x="18" y="203.0">（0件20日間・1回）</text>
<rect class="box-quiet" x="260.0" y="185.0" width="280.0" height="18" rx="3"/>
<rect class="bar-new" x="260.0" y="185.0" width="233.3" height="18" rx="3"/>
<text class="t-accent" x="550.0" y="198.0" style="font-weight:700">20日</text>
<rect class="box-accent" x="18" y="242" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="262">健全な週（6日）も本当の停止（20日）も、どちらも「2日」の基準線を大きく超えている。</text>
<text class="t-accent" x="34" y="280">日数だけでは区別できず、区別できたのは『処理ごとの頻度』まで考えた回だけだった。</text>
</svg>
