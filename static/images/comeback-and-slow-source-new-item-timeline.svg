<svg xmlns="http://www.w3.org/2000/svg" width="720" height="296" viewBox="0 0 720 296" role="img" aria-label="YとRについて、新着があった日（緑）と無かった日（グレー）を21日分並べたタイムライン図。Yは1・4日目に新着があり、5〜14日目の10日間は新着ゼロが続き、15・18・21日目に新着が復活する。Rは1日目と15日目だけ新着があり、16日目以降21日目まではずっと新着ゼロ。グラフには内側（点線・青枠）に「直近5回（点検17〜21）」、外側（破線・グレー枠）に「直近7回（点検15〜21）」の2つの枠が重ねられている。直近5回の枠にはYの新着（18・21日目）は入るが、Rの新着（15日目）は入らない。直近7回の枠にはYとRどちらの新着も入る。下の枠には、Yの新着ゼロが5〜14日目の10日間続くこと（『どこかでの10日連続ゼロ』がここを拾うこと）、Rの最後の新着が15日目で直近5回の枠の外にあること、直近7回に広げるとRも正しく『正常』に戻ることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="296"/>
<text class="t-strong" x="18" y="24">Rの最後の新着（15日目）は、直近5回の枠の外にある</text>
<text class="t-sm" x="18" y="43">YとRについて、新着があった日（緑）と無かった日（グレー）を21日分並べた。</text>
<text class="t-sm" x="18" y="62">内側の破線枠は「直近5回」（点検17〜21）、外側の破線枠は「直近7回」（点検15〜21）。</text>
<text class="t-sm" x="18" y="150">Y（過去に止まって復活した相手）</text>
