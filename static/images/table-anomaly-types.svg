<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-label="表に混ざる異常を6種類に分けた図。桁のミス（他の月の10倍の数字が1つ）、単位の混ざり（1つの行だけ円で他は千円）、符号（売上の列にマイナス）、空欄（1か月だけ何も入っていない）の4つは、数字そのものが目立つので目で見つかる。合計欄のズレ（合計欄と12か月の和が3,000違う）と行の重複（同じ数字の行が別の名前で2つある）の2つは、1つ1つの数字が正常に見えるため、足し直すまで見えない。この2つは探す種類として名指しするまで指摘に出てこない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="510"/>
<text class="t-strong" x="18" y="26">表に混ざる異常は6種類。後ろの2つは見た目が普通</text>
<text class="t-sm" x="18" y="45">上の4つは数字そのものが目立つ。下の2つは1つ1つの数字が正常に見える。</text>
<rect class="box-accent" x="18" y="84" width="140" height="52" rx="6"/>
<text class="t-accent" x="32" y="115">桁のミス</text>
<rect class="box-quiet" x="178" y="84" width="318" height="52" rx="6"/>
<text class="t" x="192" y="115">他の月の10倍の数字が1つだけ入っている</text>
<text class="t-sm" x="516" y="115">目で見つかる</text>
<rect class="box-accent" x="18" y="150" width="140" height="52" rx="6"/>
<text class="t-accent" x="32" y="181">単位の混ざり</text>
<rect class="box-quiet" x="178" y="150" width="318" height="52" rx="6"/>
<text class="t" x="192" y="181">1つの行だけ円、他の行は千円で入っている</text>
<text class="t-sm" x="516" y="181">目で見つかる</text>
<rect class="box-accent" x="18" y="216" width="140" height="52" rx="6"/>
<text class="t-accent" x="32" y="247">符号</text>
<rect class="box-quiet" x="178" y="216" width="318" height="52" rx="6"/>
<text class="t" x="192" y="247">売上の列にマイナスの数字が混ざっている</text>
<text class="t-sm" x="516" y="247">目で見つかる</text>
<rect class="box-accent" x="18" y="282" width="140" height="52" rx="6"/>
<text class="t-accent" x="32" y="313">空欄</text>
<rect class="box-quiet" x="178" y="282" width="318" height="52" rx="6"/>
<text class="t" x="192" y="313">1か月だけ何も入っていない</text>
<text class="t-sm" x="516" y="313">目で見つかる</text>
<rect class="box-bad" x="18" y="348" width="140" height="52" rx="6"/>
<text class="t-bad" x="32" y="379">合計欄のズレ</text>
<rect class="box-quiet" x="178" y="348" width="318" height="52" rx="6"/>
<text class="t" x="192" y="379">合計欄と12か月の和が3,000だけ違う</text>
<text class="t-bad" x="516" y="379">足し直すまで見えない</text>
<rect class="box-bad" x="18" y="414" width="140" height="52" rx="6"/>
<text class="t-bad" x="32" y="445">行の重複</text>
<rect class="box-quiet" x="178" y="414" width="318" height="52" rx="6"/>
<text class="t" x="192" y="445">同じ数字の行が別の名前で2つある</text>
<text class="t-bad" x="516" y="445">足し直すまで見えない</text>
<text class="t-xs" x="18" y="496">※ 下の2つは、セル1つだけを見ても異常に見えません。探す種類として名指しするまで出てきません。</text>
</svg>
