<svg xmlns="http://www.w3.org/2000/svg" width="720" height="268" viewBox="0 0 720 268" role="img" aria-label="GPT-Live・Realtime API・連結パイプラインという3つの音声アーキテクチャを比べた表。向いている場面＝GPT-Liveは全二重の会話+別モデルの頭脳、Realtime APIは音声・思考・道具を1セッションで完結、連結パイプラインは各段階を自分で検査・置換したい時。選ぶ理由＝GPT-Liveは既存の処理はそのまま頭脳だけ選べる、Realtime APIは1つのモデルが音声のまま応答、連結パイプラインは中間のテキストを検査・置換できる。出典はOpenAI公式ドキュメント「Voice agents」の比較表。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="268"/>
<text class="t-strong" x="18" y="26">GPT-Liveは「音声」と「頭脳」を分けた、3つ目の音声アーキテクチャ</text>
<text class="t-sm" x="18" y="45">OpenAI公式ドキュメント「Voice agents」の比較表に書かれている3つの選択肢を並べた。</text>
<text class="t-sm" x="18" y="64">GPT-Liveは会話を続けながら、頭脳役のモデルを独立して選べる点が他の2つと違う。</text>
<text class="t-accent" x="134.0" y="114">GPT-Live（新）</text>
<text class="t-accent" x="328.0" y="114">Realtime API</text>
<text class="t-accent" x="522.0" y="114">連結パイプライン</text>
<text class="t-sm" x="18" y="146.0">向いている場面</text>
<rect class="box-accent" x="126.0" y="128" width="188.0" height="48" rx="4"/>
<text class="t-accent" x="134.0" y="146">全二重の会話+</text>
<text class="t-accent" x="134.0" y="162">別モデルの頭脳</text>
<rect class="box-quiet" x="320.0" y="128" width="188.0" height="48" rx="4"/>
<text class="t-sm" x="328.0" y="146">音声・思考・道具を</text>
<text class="t-sm" x="328.0" y="162">1セッションで完結</text>
<rect class="box-quiet" x="514.0" y="128" width="188.0" height="48" rx="4"/>
<text class="t-sm" x="522.0" y="146">各段階を自分で</text>
<text class="t-sm" x="522.0" y="162">検査・置換したい時</text>
<text class="t-sm" x="18" y="204.0">選ぶ理由</text>
<rect class="box-accent" x="126.0" y="186" width="188.0" height="48" rx="4"/>
<text class="t-accent" x="134.0" y="204">既存の処理はそのまま</text>
<text class="t-accent" x="134.0" y="220">頭脳だけ選べる</text>
<rect class="box-quiet" x="320.0" y="186" width="188.0" height="48" rx="4"/>
<text class="t-sm" x="328.0" y="204">1つのモデルが</text>
<text class="t-sm" x="328.0" y="220">音声のまま応答</text>
<rect class="box-quiet" x="514.0" y="186" width="188.0" height="48" rx="4"/>
<text class="t-sm" x="522.0" y="204">中間のテキストを</text>
<text class="t-sm" x="522.0" y="220">検査・置換できる</text>
</svg>
