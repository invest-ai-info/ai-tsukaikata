</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">3段に増やしても、今回はすべて正しかった</text>
<text class="t-sm" x="18" y="45">実測2026-09-30。店舗別売上表・部門別経費表(いずれも店舗/担当者の小計→エリア/部署の中計→総合計)。</text>
<text class="t-sm" x="18" y="64">参考として、2段構造の既存実測（別記事・2026-09-23）の小計欄の的中率も最後に並べた。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">3段・自由記述で最下位(小計)欄が正しかった回（材料2種×5回）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="157">3段・自由記述で中間(中計)欄が正しかった回（材料2種×5回）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="189">3段・自由記述で総合計欄が正しかった回（材料2種×5回）</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="221">SUBTOTALを禁じても、3段すべてが正しかった回（材料A×5回）</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="253">参考：2段構造(別記事)で最下位(小計)欄が正しかった回</text>
<rect class="box" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-sm" x="558.0" y="253" text-anchor="middle" style="font-weight:700">3/10</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">3段に増やした自由記述10回・SUBTOTALを禁じた5回・注意書きを外した3回の、</text>
<text class="t-accent" x="34" y="308">合計18回すべてで、小計・中計・総合計の3段とも正しい数式になった。</text>
<text class="t-accent" x="34" y="326">＝この材料・この回数の範囲では、段数を増やしても最下位の段はさらに悪化しなかった（H26棄却）。</text>
</svg>
