<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="集計欄を3段にしても、いちばん下の段は崩れるかを実測した結果を示す表。すべて「当たった回数／聞いた回数」で、多いほど良い。3段・自由記述で最下位(小計)欄が正しかった回数は材料2種×5回の10回中10回、中間(中計)欄が正しかった回数も10回中10回、総合計欄が正しかった回数も10回中10回。SUBTOTALを禁じても3段すべてが正しかった回数は材料Aの5回中5回。参考として、2段構造の既存実測(別記事)で最下位(小計)欄が正しかった回数は10回中3回。下の枠には、3段に増やした自由記述10回・SUBTOTALを禁じた5回・注意書きを外した3回の合計18回すべてで小計・中計・総合計の3段とも正しい数式になったこと、この材料・この回数の範囲では段数を増やしても最下位の段はさらに悪化しなかったこと（H26棄却）が書かれている。">
<style>
