<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="禁止あり・禁止なしの2条件で、週3の体調不良・週4の残業・週5の待遇（ボーナス査定）が本文に漏れた回数を示す表。禁止ありは週3・週4・週5とも0/2で、6回とも漏れなかった。禁止なしは週3の体調が0/2で漏れなかったが、週4の残業は2/2、週5の待遇は2/2でどちらも「4. 相談したいこと」に漏れた。下の枠には、禁止の一文は4週・3つの話題に増えても漏れを0に抑えたこと、禁止が無いときの漏れやすさは話題で決まり、既存の見出しに当てはまる話題だけが漏れたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">禁止ありは4週・3対象とも漏れ0。禁止なしは話題によって割れる</text>
<text class="t-sm" x="18" y="45">週報ループを週2→週5の4週連鎖で2回ずつ試した。数字は「本文に漏れた回数／試した回数」。</text>
<text class="t-sm" x="18" y="64">禁止なしでも「体調」は0/2。残業・待遇だけが「4. 相談したいこと」に漏れた。</text>
<text class="t-xs" x="458.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">禁止あり・週3体調（頭痛・半休）</text>
<rect class="box-good" x="378" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="125" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="157">禁止あり・週4残業（残業時間の増加）</text>
<rect class="box-good" x="378" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="157" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="189">禁止あり・週5待遇（ボーナス査定）</text>
<rect class="box-good" x="378" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="189" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="221">禁止なし・週3体調（頭痛・半休）</text>
<rect class="box-good" x="378" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="221" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="253">禁止なし・週4残業（残業時間の増加）</text>
<rect class="box-bad" x="378" y="232" width="160" height="26" rx="4"/>
<text class="t-bad" x="458.0" y="253" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="285">禁止なし・週5待遇（ボーナス査定）</text>
<rect class="box-bad" x="378" y="264" width="160" height="26" rx="4"/>
<text class="t-bad" x="458.0" y="285" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="302" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="322">禁止の一文は、4週・3つの話題に増えても本文への漏れを6/6で0に抑えた。</text>
<text class="t-accent" x="34" y="340">禁止が無いときの漏れやすさは話題で決まる。既存の見出しに当てはまる話題だけが漏れた。</text>
</svg>
