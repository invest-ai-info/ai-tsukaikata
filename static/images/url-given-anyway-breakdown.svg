<svg xmlns="http://www.w3.org/2000/svg" width="720" height="566" viewBox="0 0 720 566" role="img" aria-label="出典URLを求めたとき、ヒントの有無に関わらず実際に出てきたURL番号7件の内訳を示す図。①answer/1311392(指示文1・ヒントなし)は実在し、量産型のコンテンツの規定が書かれている正しいページ。②answer/9890533(指示文1・ヒントなし)はURLが存在せず404。③answer/1311392(指示文1・ヒントなし・別回)は実在し①と同じ正しいページ。④answer/12267041(指示文1・ヒントなし)はURLが存在せず404。⑤answer/1311392(指示文2・ヒントあり)は実在し①③と同じ正しいページ。⑥answer/11160511(指示文2・ヒントあり)はURLが存在せず404。⑦answer/72851(指示文2・ヒントあり)は実在するがYPP参加資格の概要ページで無関係。下の枠には、7件のうち実在してかつ内容も一致していたのは3件(すべて同じURL)で、残り4件は404が3件・実在するが無関係なページが1件だったこと、ヒントは出すかどうかを減らすが出したときの正確さは変えていないことが書かれている。">
