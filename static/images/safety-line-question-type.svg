<svg xmlns="http://www.w3.org/2000/svg" width="720" height="374" viewBox="0 0 720 374" role="img" aria-label="質問の種類ごとに、逃げ道の一文の効き目を比べたグループ横棒グラフ。範囲を聞く質問（70%ロイヤリティの価格帯）は、逃げ道なしで6回中4回が具体的な数字を言い切ったが、逃げ道を末尾に足すと6回中0回、先頭に足しても6回中0回に下がった。金額を計算させる質問（500円のKindle本の印税）は、逃げ道なしで4回中4回が具体的な金額を出し、同じ逃げ道の一文を足しても4回中4回のまま変わらなかった。「計算例も出すな」まで名指しした一文を足して初めて4回中0回になった。下の枠には、同じ一文でも質問の型で効き目が変わること、計算をさせる質問には計算という行為そのものを止める一文が必要なことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="374"/>
<text class="t-strong" x="18" y="26">質問の種類で、同じ一文の効き目が変わった</text>
<text class="t-sm" x="18" y="45">バーは「具体的な数字を言い切った回数／聞いた回数」。短いほど逃げ道が効いている。</text>
<text class="t-sm" x="18" y="64">範囲を聞く質問は一文だけで0になったが、金額を計算させる質問は「計算例も禁止」しないと0にならない。</text>
<text class="t-sm" x="18" y="83">資料はどの回にも見せていない（AIの記憶だけでの回答）。</text>
<text class="t-strong" x="18" y="110">範囲を聞く質問</text>
<text class="t-xs" x="218" y="132" text-anchor="end">逃げ道なし</text>
<rect class="box-quiet" x="230" y="118" width="380" height="18" rx="3"/>
<rect class="box" x="230" y="118" width="253.3" height="18" rx="3"/>
<text class="t-sm" x="620" y="132">4／6</text>
<text class="t-xs" x="218" y="156" text-anchor="end">逃げ道を追加（末尾）</text>
<rect class="box-quiet" x="230" y="142" width="380" height="18" rx="3"/>
<text class="t-sm" x="620" y="156">0／6</text>
<text class="t-xs" x="218" y="180" text-anchor="end">逃げ道を追加（先頭）</text>
<rect class="box-quiet" x="230" y="166" width="380" height="18" rx="3"/>
<text class="t-sm" x="620" y="180">0／6</text>
<text class="t-strong" x="18" y="204">金額を計算させる質問</text>
<text class="t-xs" x="218" y="226" text-anchor="end">逃げ道なし</text>
<rect class="box-quiet" x="230" y="212" width="380" height="18" rx="3"/>
<rect class="box-bad" x="230" y="212" width="380.0" height="18" rx="3"/>
<text class="t-sm" x="620" y="226">4／4</text>
<text class="t-xs" x="218" y="250" text-anchor="end">逃げ道を追加</text>
<rect class="box-quiet" x="230" y="236" width="380" height="18" rx="3"/>
<rect class="box-bad" x="230" y="236" width="380.0" height="18" rx="3"/>
<text class="t-sm" x="620" y="250">4／4</text>
<text class="t-xs" x="218" y="274" text-anchor="end">＋計算例も禁止</text>
<rect class="box-quiet" x="230" y="260" width="380" height="18" rx="3"/>
<text class="t-sm" x="620" y="274">0／4</text>
<rect class="box-accent" x="18" y="310" width="684" height="44" rx="6"/>
<text class="t-accent" x="34" y="330">同じ一文（分からない場合は分からないと答えて）でも、質問の型で効き目が変わる。</text>
<text class="t-accent" x="34" y="348">計算をさせる質問には、「計算例も出すな」と計算という行為そのものを止める必要がある。</text>
</svg>
