<svg xmlns="http://www.w3.org/2000/svg" width="720" height="444" viewBox="0 0 720 444" role="img" aria-label="体調・残業・待遇の3つの話題について、4つの見出し（やったこと・進んでいないこと・来週やること・相談したいこと）のどれかが当てはまるかと、禁止なしでの結果を示す図。体調（頭痛・半休）は当てはまる見出しが無く、禁止なしでも自然に消えた（0/2）。残業（残業時間の増加）は「4. 相談したいこと」が当てはまり、禁止なしではそのまま書かれた（2/2）。待遇（ボーナス査定）も同様に「4. 相談したいこと」が当てはまり、禁止なしではそのまま書かれた（2/2）。下の枠には、見出しのどれにも当てはまらない話題は言われなくても自然に消えたこと、相談したいことに当てはまる話題だけが禁止しないと漏れたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="444"/>
<text class="t-strong" x="18" y="26">漏れるかどうかを決めていたのは、禁止の有無ではなく見出しとの相性だった</text>
<text class="t-sm" x="18" y="45">3つの話題それぞれに、4つの見出し（やったこと・進んでいないこと・来週やること・相談したいこと）のどれかが当てはまるかを見た。</text>
<text class="t-sm" x="18" y="64">禁止なしでの結果は、週3・週4・週5をそれぞれ2回ずつ試したもの。</text>
<text class="t-strong" x="18" y="114">体調（頭痛・半休）</text>
<text class="t-sm" x="34" y="143">当てはまる見出しがあるか</text>
<rect class="box-good" x="228" y="124" width="330" height="24" rx="4"/>
<text class="t-good" x="393.0" y="141" text-anchor="middle" style="font-weight:700">無い</text>
<text class="t-sm" x="34" y="173">禁止なしでの結果</text>
<rect class="box-good" x="228" y="154" width="330" height="24" rx="4"/>
<text class="t-good" x="393.0" y="171" text-anchor="middle" style="font-weight:700">自然に消えた（0/2）</text>
<text class="t-strong" x="18" y="202">残業（残業時間の増加）</text>
<text class="t-sm" x="34" y="231">当てはまる見出しがあるか</text>
<rect class="box-bad" x="228" y="212" width="330" height="24" rx="4"/>
<text class="t-bad" x="393.0" y="229" text-anchor="middle" style="font-weight:700">ある（4. 相談したいこと）</text>
<text class="t-sm" x="34" y="261">禁止なしでの結果</text>
<rect class="box-bad" x="228" y="242" width="330" height="24" rx="4"/>
<text class="t-bad" x="393.0" y="259" text-anchor="middle" style="font-weight:700">そのまま書かれた（2/2）</text>
<text class="t-strong" x="18" y="290">待遇（ボーナス査定）</text>
<text class="t-sm" x="34" y="319">当てはまる見出しがあるか</text>
<rect class="box-bad" x="228" y="300" width="330" height="24" rx="4"/>
<text class="t-bad" x="393.0" y="317" text-anchor="middle" style="font-weight:700">ある（4. 相談したいこと）</text>
<text class="t-sm" x="34" y="349">禁止なしでの結果</text>
<rect class="box-bad" x="228" y="330" width="330" height="24" rx="4"/>
<text class="t-bad" x="393.0" y="347" text-anchor="middle" style="font-weight:700">そのまま書かれた（2/2）</text>
<rect class="box-accent" x="18" y="372" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="392">見出しのどれにも当てはまらない話題は、言われなくても自然に消えた。</text>
<text class="t-accent" x="34" y="410">「相談したいこと」に当てはまる話題だけが、禁止しないと漏れた。</text>
</svg>
