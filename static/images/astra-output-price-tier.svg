    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="308"/>
<text class="t-strong" x="18" y="26">同じ GPT-6 Astra でも、出力の単価は 6 倍まで開く（100万トークンあたり）</text>
<text class="t-sm" x="18" y="45">モデルは1つでも、どの窓口を使うかと入力の長さで請求が変わります。</text>
<text class="t-sm" x="18" y="64">急ぎ（Fast mode）はふつうの2倍、まとめ処理は半額。長い入力はさらに上がります。</text>
<text class="t" x="18" y="112">まとめ処理（Batch / Flex）・短い入力</text>
<rect class="bar-old" x="268" y="96" width="58.0" height="20" rx="2"/>
<text class="t-sm" x="334.0" y="112">$25</text>
<text class="t" x="18" y="144">ふつう（Standard）・短い入力</text>
<rect class="bar-new" x="268" y="128" width="116.0" height="20" rx="2"/>
<text class="t-sm" x="392.0" y="144">$50</text>
<text class="t" x="18" y="176">ふつう（Standard）・長い入力</text>
<rect class="bar-old" x="268" y="160" width="174.0" height="20" rx="2"/>
<text class="t-sm" x="450.0" y="176">$75</text>
<text class="t" x="18" y="208">急ぎ（Fast mode）・短い入力</text>
<rect class="bar-old" x="268" y="192" width="232.0" height="20" rx="2"/>
<text class="t-sm" x="508.0" y="208">$100</text>
<text class="t" x="18" y="240">急ぎ（Fast mode）・長い入力</text>
<rect class="bar-old" x="268" y="224" width="348.0" height="20" rx="2"/>
<text class="t-sm" x="624.0" y="240">$150</text>
<text class="t-xs" x="18" y="278">※ 青＝いちばん基本の窓口（Standard・短い入力）。入力の単価も同じ比率で動きます。</text>
<text class="t-xs" x="18" y="296">※ 出典: OpenAI の料金ページ（developers.openai.com・2026年9月5日に確認）。EU のデータ所在地を指定すると急ぎは使えません。</text>
