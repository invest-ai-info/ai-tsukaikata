<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="未入金2回の位置を3パターン（非連続・隣り合う・両端）に分け、それぞれで2回分の両方と正しい不足額を言い当てた回数を比べた表。非連続（前作の配置・中間金1と中間金4、制作2と制作6）は材料2種×5回＝16回中16回が正解。隣り合う配置（中間金1・中間金2、制作2・制作3）は材料2種×5回＝10回中10回が正解。両端の配置（着手金・残金、企画料・納品金）も材料2種×5回＝10回中10回が正解。健全な11件を誤って未入金扱いした回数は、36回の合計で0回。下の枠には、未入金2回の位置を変えても単独の材料で聞く限りは正答率が崩れていないこと、合計36回を通じて誤判定は0回だったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">未入金2回の位置を変えても、単独材料での正答率は崩れなかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-21。内装リフォーム工事12件（6分割）・動画制作費12社（8分割）の架空データ。</text>
<text class="t-sm" x="18" y="64">「両方の回・正しい不足額を言い当てた回数」（多いほど良い）。最後の行だけ少ないほど良い。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">非連続の配置（前作・中間金1+4、制作2+6）が両方を正しく指摘した回数</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">16/16</text>
<text class="t" x="18" y="157">隣り合う配置（中間金1+2、制作2+3）が両方を正しく指摘した回数</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="189">両端の配置（着手金+残金、企画料+納品金）が両方を正しく指摘した回数</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="221">健全な11件を誤って未入金扱いした回数（36回の合計）</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">0/36</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">未入金2回の位置を変えても、単独の材料で聞く限りは正答率が崩れていない。</text>
<text class="t-accent" x="34" y="276">合計36回（非連続16・隣り合う10・両端10）を通じて、健全な契約を誤って未入金扱いした回は0回だった。</text>
</svg>
