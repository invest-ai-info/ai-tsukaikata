<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="判定は8回中7回、埋もれ・明瞭を正しく言い当てたことを示す表。Xのハッシュタグ埋没版は2回中1回のみ明確に疑義を示した（もう1回はグレー判定）。Xの冒頭明示版は2回中2回「問題なし」。note・ブログの長文埋没版は2回中2回「不十分」。note・ブログの冒頭明示版は2回中2回「問題なし」。下の枠には、note・ブログの長文埋没は2回とも「長文による表示」として正しく指摘されたこと、Xのハッシュタグ埋没だけ2回中1回は「大量のハッシュタグ」という文言の解釈でグレー判定になったこと、明瞭版は4回とも「問題なし」で揺れなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">判定は8回中7回、埋もれ・明瞭を正しく言い当てた</text>
<text class="t-sm" x="18" y="45">実測2026-11-01。X・note/ブログそれぞれに「埋没版」「明瞭版」を用意し、同じ判定基準で試した。</text>
<text class="t-sm" x="18" y="64">「正しい向き（埋没版は疑義・明瞭版は問題なし）で判定した回数／試した回数」。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">X：ハッシュタグ埋没版（2回）</text>
<rect class="box" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="125" text-anchor="middle" style="font-weight:700">1/2</text>
<text class="t" x="18" y="157">X：冒頭明示版（2回）</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="189">note・ブログ：長文埋没版（2回）</text>
<rect class="box-good" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="221">note・ブログ：冒頭明示版（2回）</text>
<rect class="box-good" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">note・ブログの長文埋没は2回とも「長文による表示」として正しく指摘された（運用基準キの文言どおり）。</text>
<text class="t-accent" x="34" y="276">Xのハッシュタグ埋没だけ、2回中1回は「大量のハッシュタグ」という文言の解釈でグレー判定になった。</text>
<text class="t-accent" x="34" y="294">明瞭版（冒頭に独立して明記）は、X・noteとも4回とも「問題なし」で揺れなかった。</text>
</svg>
