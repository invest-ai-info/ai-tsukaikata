<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" role="img" aria-label="ぞんざい口調で崩れた2つの症状への直しを比較した横棒グラフ。元のぞんざい版（3回）は指定フォーマットの遵守2/3・確認文言の付与2/3。フォーマット固定だけを足すと書式1/2・確認文言0/2で確認文言は直らない。確認文言の必須化だけを足すと書式2/2・確認文言2/2で両方とも直った。両方の直しを重ねても書式2/2・確認文言2/2で結果は同じだったが、別の項目（申請期限超過の判定）に副作用が出た。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="356"/>
<text class="t-strong" x="18" y="26">確認文言を縛る一文だけで、フォーマットも一緒に直った</text>
<text class="t-sm" x="18" y="45">薄い青＝指定フォーマット（3つの決まり文句）を守った回、濃い青＝規程が触れていない項目に確認文言を付けた回。</text>
<text class="t-sm" x="18" y="64">「フォーマット固定」だけでは確認文言まで直らない。「確認文言を必須化」の一文だけで</text>
<text class="t-sm" x="18" y="83">両方とも2回中2回直った（別の項目への副作用は本文参照）。</text>
<text class="t" x="18" y="118">ぞんざい（元）3回</text>
<text class="t-xs" x="270" y="118">書式</text>
<rect class="box-quiet" x="300" y="106" width="310" height="15" rx="3"/>
<rect class="bar-in" x="300" y="106" width="206.7" height="15" rx="3"/>
<text class="t-sm" x="620" y="118">2／3</text>
<text class="t-xs" x="270" y="138">確認</text>
<rect class="box-quiet" x="300" y="126" width="310" height="15" rx="3"/>
<rect class="bar-out" x="300" y="126" width="206.7" height="15" rx="3"/>
<text class="t-sm" x="620" y="138">2／3</text>
<text class="t" x="18" y="178">+フォーマット固定のみ 2回</text>
<text class="t-xs" x="270" y="178">書式</text>
<rect class="box-quiet" x="300" y="166" width="310" height="15" rx="3"/>
<rect class="bar-in" x="300" y="166" width="155.0" height="15" rx="3"/>
<text class="t-sm" x="620" y="178">1／2</text>
<text class="t-xs" x="270" y="198">確認</text>
<rect class="box-quiet" x="300" y="186" width="310" height="15" rx="3"/>
<rect class="bar-out" x="300" y="186" width="3.0" height="15" rx="3"/>
<text class="t-sm" x="620" y="198">0／2</text>
<text class="t" x="18" y="238">+確認文言を必須化のみ 2回</text>
<text class="t-xs" x="270" y="238">書式</text>
<rect class="box-quiet" x="300" y="226" width="310" height="15" rx="3"/>
<rect class="bar-in" x="300" y="226" width="310.0" height="15" rx="3"/>
<text class="t-sm" x="620" y="238">2／2</text>
<text class="t-xs" x="270" y="258">確認</text>
<rect class="box-quiet" x="300" y="246" width="310" height="15" rx="3"/>
<rect class="bar-out" x="300" y="246" width="310.0" height="15" rx="3"/>
<text class="t-sm" x="620" y="258">2／2</text>
<text class="t" x="18" y="298">+両方を重ねる 2回</text>
<text class="t-xs" x="270" y="298">書式</text>
<rect class="box-quiet" x="300" y="286" width="310" height="15" rx="3"/>
<rect class="bar-in" x="300" y="286" width="310.0" height="15" rx="3"/>
<text class="t-sm" x="620" y="298">2／2</text>
<text class="t-xs" x="270" y="318">確認</text>
<rect class="box-quiet" x="300" y="306" width="310" height="15" rx="3"/>
<rect class="bar-out" x="300" y="306" width="310.0" height="15" rx="3"/>
<text class="t-sm" x="620" y="318">2／2</text>
</svg>
