<svg xmlns="http://www.w3.org/2000/svg" width="720" height="303" viewBox="0 0 720 303" role="img" aria-label="GPT-6の3モデル（Astra・Sol・Luna）の単価と「none」設定への対応可否を示した横棒グラフ。100万トークンあたりのドル。GPT-6 Astra（最上位）は入力10ドル・出力50ドルで、none非対応。GPT-6 Sol（中位）は入力2ドル・出力10ドルで、none対応。GPT-6 Luna（下位）は入力0.1ドル・出力0.5ドルで、none対応。「none」は考えずに即答する設定で、公式ガイドはAstraが非対応・SolとLunaは対応と明記している。">
