<svg xmlns="http://www.w3.org/2000/svg" width="720" height="274" viewBox="0 0 720 274" role="img" aria-label="同じ「差を出してください」という開いた質問で、真の判別要因を検出し数値の根拠まで示した割合を、既存記事の字数と今回の日数・価格比で比べた図。既存記事（字数が真の要因）は4回中0回しか数えて検出できなかった。今回の日数（材料1）は5回中5回、価格比（材料2）は5回中5回、いずれも数値を1件ずつ書き出して正しく検出した。">
