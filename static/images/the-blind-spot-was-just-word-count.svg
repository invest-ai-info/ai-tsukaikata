<rect class="bg" x="0" y="0" width="720" height="274"/>
<text class="t-strong" x="18" y="24">要因が字数のときだけ0点。日数と価格比は満点だった</text>
<text class="t-sm" x="18" y="43">「通った提案と通らなかった提案の差を出してください」という同じ開いた質問で、真の判別要因を数えて検出できた割合。</text>
<text class="t-sm" x="18" y="62">既存記事は字数が真の要因だった回、材料1・2は今回、日数・価格比に差し替えた回。</text>
<text class="t-xs" x="18" y="81">字数だけを名指しして聞き直すと、字数についても2/2が数えてから否定した（本文の指示文4）。</text>
<text class="t-xs" x="460.0" y="112">満点</text>
<text class="t" x="18" y="136">既存記事：字数が要因</text>
<rect class="box-quiet" x="300.0" y="124" width="180.0" height="16" rx="3"/>
<rect class="box-bad" x="300.0" y="124" width="3.0" height="16" rx="3"/>
<text class="t-bad" x="492.0" y="136">0/4</text>
<text class="t" x="18" y="170">材料1：日数が要因</text>
<rect class="box-quiet" x="300.0" y="158" width="180.0" height="16" rx="3"/>
<rect class="box-good" x="300.0" y="158" width="180.0" height="16" rx="3"/>
<text class="t-accent" x="492.0" y="170">5/5</text>
<text class="t" x="18" y="204">材料2：価格比が要因</text>
<rect class="box-quiet" x="300.0" y="192" width="180.0" height="16" rx="3"/>
<rect class="box-good" x="300.0" y="192" width="180.0" height="16" rx="3"/>
<text class="t-accent" x="492.0" y="204">5/5</text>
<path class="line" d="M480.0 116 L480.0 206" stroke-dasharray="4 3"/>
<text class="t-sm" x="18" y="232">※ 点線は満点（100%）。既存記事だけが左端のままである。</text>
<text class="t-xs" x="18" y="251">架空データでの実測。生の返りはdocs/evidence/に全文置いてある。</text>
