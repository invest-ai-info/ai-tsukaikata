<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="返品・交換フォームという同じ監視項目を、言い直し前と言い直し後で比べた図。言い直し前の出力は「…お願いしたいのですが…」で終わり、含まれる質問は0件（交換したい、という事実で終わる）。文字数は63字で100字以内に収まっている。言い直し後の出力は「Mサイズ交換可否と返送料負担について」で、含まれる質問は2件（Mサイズへの交換可否、往復の配送料をどちらが負担するか）。文字数は53字で同じく100字以内。下の注記には、字数の制約はどちらも守られていて崩れているのは中身のほうだけであること、原文の質問はMサイズに交換できるかと往復の配送料はどちらが負担するかの2点であることが書かれている。">
