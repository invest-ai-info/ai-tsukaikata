<text class="t-bad" x="18" y="404">🚨 真ん中と右が、材料をまたぐと逆に動く。ニュース要約では空要約を「よくない」に入れて</text>
<text class="t-bad" x="18" y="425">   薄い3件を通し、問い合わせ日報では空要約を通して薄い3件を「よくない」に入れた。</text>
<text class="t-good" x="18" y="446">※ 左の列（誰が見ても不良の5件）は、8回とも 5/5。拾い漏れは1件も無い。</text>
<text class="t-good" x="18" y="467">※ ふつうの良品20件を「よくない」と呼んだ回は、8回で0件。</text>
<text class="t-xs" x="18" y="488">灰色は真値を決めていない列（材料0行の日に空の要約を出すことを不良と呼ぶかは、決める人の側の話）。</text>
