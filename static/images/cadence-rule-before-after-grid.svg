<svg xmlns="http://www.w3.org/2000/svg" width="720" height="434" viewBox="0 0 720 434" role="img" aria-label="ルール（①固定『2日ルール』・②頻度ごとに分けたルール）を列、材料（正常版・停止版）を行にした2行2列の表。正常版×①は1/2が結論で誤報（赤）、もう1/2は読み替えて該当なし。正常版×②は2/2が正しく『該当なし』（緑）。停止版×①・停止版×②はどちらも2/2が正しく本当の停止だけを該当として名指し（緑）。下の枠には、誤報が消えたのは正常版だけで、停止版ではどちらのルールでも本当の停止を2/2で正しく見つけていること、頻度ごとに基準を分けても本当の停止を見つける力は落ちなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="434"/>
<text class="t-strong" x="18" y="24">正常版の誤報は、頻度ごとに分けたルールに変えると0/2に消えた</text>
<text class="t-sm" x="18" y="43">①は「0件が2日以上続いたら必ず該当」（前作）。②はP1（毎日）とP5（週1回）の基準を分けた言い直し（今回）。</text>
<text class="t-sm" x="18" y="62">正常版＝P5に本当の停止なし。停止版＝P5が2回ぶん（21日間）動かなかった版。どちらも同じログ。</text>
<text class="t-accent" x="283.0" y="118.0" text-anchor="middle">①固定「2日ルール」</text>
<text class="t-accent" x="283.0" y="134.0" text-anchor="middle">（前作）</text>
<text class="t-accent" x="527.0" y="118.0" text-anchor="middle">②頻度ごとに分けた</text>
<text class="t-accent" x="527.0" y="134.0" text-anchor="middle">ルール（今回）</text>
<text class="t-sm" x="18" y="180.0">正常版</text>
<text class="t-sm" x="18" y="196.0">（本当の</text>
<text class="t-sm" x="18" y="212.0">停止なし）</text>
<rect class="box-bad" x="168.0" y="148.0" width="230.0" height="92" rx="6"/>
<text class="t-bad" x="283.0" y="162.0" text-anchor="middle">1/2が結論で</text>
<text class="t-bad" x="283.0" y="180.0" text-anchor="middle">誤報</text>
<text class="t-bad" x="283.0" y="198.0" text-anchor="middle">（もう1/2は</text>
<text class="t-bad" x="283.0" y="216.0" text-anchor="middle">読み替えて</text>
<text class="t-bad" x="283.0" y="234.0" text-anchor="middle">該当なし）</text>
<rect class="box-good" x="412.0" y="148.0" width="230.0" height="92" rx="6"/>
<text class="t-good" x="527.0" y="189.0" text-anchor="middle">2/2が正しく</text>
<text class="t-good" x="527.0" y="207.0" text-anchor="middle">「該当なし」</text>
<line class="line" x1="18" y1="247.0" x2="702" y2="247.0" stroke-dasharray="3 3"/>
<text class="t-sm" x="18" y="286.0">停止版</text>
<text class="t-sm" x="18" y="302.0">（P5に21日間</text>
<text class="t-sm" x="18" y="318.0">の停止）</text>
<rect class="box-good" x="168.0" y="254.0" width="230.0" height="92" rx="6"/>
<text class="t-good" x="283.0" y="277.0" text-anchor="middle">2/2が正しく</text>
<text class="t-good" x="283.0" y="295.0" text-anchor="middle">本当の停止</text>
<text class="t-good" x="283.0" y="313.0" text-anchor="middle">だけを該当</text>
<text class="t-good" x="283.0" y="331.0" text-anchor="middle">に挙げた</text>
<rect class="box-good" x="412.0" y="254.0" width="230.0" height="92" rx="6"/>
<text class="t-good" x="527.0" y="277.0" text-anchor="middle">2/2が正しく</text>
<text class="t-good" x="527.0" y="295.0" text-anchor="middle">本当の停止</text>
<text class="t-good" x="527.0" y="313.0" text-anchor="middle">だけを該当</text>
<text class="t-good" x="527.0" y="331.0" text-anchor="middle">に挙げた</text>
<rect class="box-accent" x="18" y="366" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="386">誤報が消えたのは正常版だけ。停止版では①②どちらも、本当の停止を2/2で正しく見つけている。</text>
<text class="t-accent" x="34" y="404">頻度ごとに基準を分けても、本当の停止を見つける力は落ちなかった。</text>
</svg>
