<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="同じ仕事をさせたときの費用を Fable 5 を100として比べた横棒グラフ。ふつうの使い方は Fable 5.1 で75（約25%減）、長く自動で作業させる使い方は55（最大で約45%減）。いずれも Anthropic が2026年8月の4週間の実際の利用から集計した比率で、読み直しが費用の大半を占める使い方ほど下がり幅が大きい。短い質問を1回ずつする使い方では読み直しがほとんど無いので、このようには下がらない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="260"/>
<text class="t-strong" x="18" y="26">同じ仕事をさせたときの費用（Fable 5 を 100 とする）</text>
<text class="t-sm" x="18" y="45">灰色＝Fable 5、青＝Fable 5.1。公式が発表ページに書いた比率を、そのまま棒の長さにしています。</text>
<text class="t-sm" x="18" y="64">読み直し（キャッシュ読み取り）が費用の大半を占める使い方ほど、下がり幅が大きくなります。</text>
<text class="t" x="18" y="95">ふつうの使い方</text>
<text class="t-xs" x="214" y="95">5</text>
<rect class="bar-old" x="250" y="82" width="370.0" height="16" rx="2"/>
<text class="t-sm" x="628.0" y="95">100</text>
<text class="t-xs" x="214" y="117">5.1</text>
<rect class="bar-new" x="250" y="104" width="277.5" height="16" rx="2"/>
<text class="t-sm" x="535.5" y="117">75（約25%減）</text>
<text class="t" x="18" y="159">長く自動で作業させる使い方</text>
<text class="t-xs" x="214" y="159">5</text>
<rect class="bar-old" x="250" y="146" width="370.0" height="16" rx="2"/>
<text class="t-sm" x="628.0" y="159">100</text>
<text class="t-xs" x="214" y="181">5.1</text>
<rect class="bar-new" x="250" y="168" width="203.5" height="16" rx="2"/>
<text class="t-sm" x="461.5" y="181">55（最大で約45%減）</text>
<text class="t-xs" x="18" y="230">※ 2026年8月の4週間の実際の利用（Claude Enterprise・Claude Code・API）を Anthropic が集計した値。</text>
<text class="t-xs" x="18" y="248">※ 短い質問を1回ずつする使い方は読み直しがほとんど無いので、この図のようには下がりません。</text>
</svg>
