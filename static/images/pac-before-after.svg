<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="従来のPrivate AI Computeと今回の発表を2列で比べた図。従来（2025年11月〜）＝処理が終わると記憶は消える、対象はPixel 10のMagic CueとRecorderアプリの文字起こし要約、端末をまたぐ会話の継続は無い。今回の発表（2026年9月23日）＝永続的な記憶の層を追加すると発表、暗号化した「金庫」にクラウド保存、鍵は利用者の端末だけが持つ、対象製品・提供時期は発表に無い。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">Private AI Computeは「消える記憶」から「残る記憶」へ</text>
<text class="t-sm" x="18" y="45">今回の発表は技術的な更新の説明で、対象の製品名や提供時期は書かれていない。</text>
<rect class="box-quiet" x="18" y="62" width="330" height="166" rx="6"/>
<rect class="box-accent" x="372" y="62" width="330" height="166" rx="6"/>
<text class="t-strong" x="32" y="82">従来（2025年11月〜）</text>
<text class="t-accent" x="386" y="82">今回の発表（2026年9月23日）</text>
<text class="t" x="32" y="114">処理が終わると記憶は消える</text>
<text class="t" x="32" y="148">対象はPixel 10のMagic Cue</text>
<text class="t" x="32" y="182">Recorderアプリの文字起こし要約</text>
<text class="t" x="32" y="216">端末をまたぐ会話の継続は無い</text>
<text class="t" x="386" y="114">永続的な記憶の層を追加すると発表</text>
<text class="t" x="386" y="148">暗号化した「金庫」にクラウド保存</text>
<text class="t" x="386" y="182">鍵は利用者の端末だけが持つ</text>
<text class="t" x="386" y="216">対象製品・提供時期は発表に無い</text>
<text class="t-xs" x="18" y="278">※ 出典: Google DeepMindの発表ページ（2026年9月23日）と、Private AI Compute初出の発表（2025年11月11日）。</text>
</svg>
