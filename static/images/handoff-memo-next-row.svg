<svg xmlns="http://www.w3.org/2000/svg" width="720" height="512" viewBox="0 0 720 512" role="img" aria-label="止まった日の引き継ぎメモだけを、1通ずつ別のまっさらな会話に渡して、次に手を付ける行を答えられるかを頼み方4通りで並べた表。待ち行列そのものも資料も渡していない。聞いたのは3つで、止まっている行はどれか、それぞれ次に何をすればよいか、まだ一度も手を付けていない行のうちいちばん上はどれか、である。3つ目には、メモから決まらないときはそう書いてくださいと添えてある。1つ目の質問は16回とも正解で、止まった2行を2行とも名指しした。3つ目の結果は、そのまま、その旨を書いてと頼んだメモが4回中2回、何が起きたか、何を試したか、次に何をすれば直るかを入れさせたメモが4回中1回、会話ではなくファイルにだけ書いてと足したメモが4回中2回で、合わせて12回中5回だった。残る7回はこのメモからは決まらないと答えている。ところが、答えのどこかに行の番号が出てくるかで数えると16回とも16回である。断った理由は返り自身が書いていて、その行が本当に未着手かはメモに書かれていない、というものだった。次はこの行からという1行を書かせた4回は、4回ともその1行を根拠に答えている。ただしその4回のうち1回は、AIがその1行に止まっている行のほうを書いてしまい、翌日は正しく決まらないと答えた。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="512"/>
<text class="t-strong" x="18" y="26">行の番号は16回とも書いてある。それでも半分は「決まらない」と答える</text>
<text class="t-sm" x="18" y="45">前の図と同じ16回で作らせたメモを、1通ずつ別のまっさらな会話に渡した（待ち行列も資料も渡していない）。</text>
<text class="t-sm" x="18" y="64">聞いたのは3つ。①止まっている行はどれか ②それぞれ次に何をすればよいか③まだ一度も手を付けて</text>
<text class="t-sm" x="18" y="83">いない行のうち、いちばん上はどれか。③は「メモから決まらないときはそう書いて」と添えてある。</text>
<text class="t-sm" x="18" y="102">①の答えは16回とも正解だった（止まった2行を2行とも名指し）。下は③の結果。</text>
<text class="t-xs" x="452" y="138" text-anchor="middle">答えの書き出しで</text>
<text class="t-xs" x="452" y="152" text-anchor="middle">行を名指しした</text>
<text class="t-xs" x="606" y="138" text-anchor="middle">答えのどこかに</text>
<text class="t-xs" x="606" y="152" text-anchor="middle">行の番号は出ている</text>
<text class="t" x="18" y="185">そのまま「その旨を書いて」</text>
<rect class="box-bad" x="426" y="171" width="52" height="19" rx="4"/>
<text class="t-bad" x="452" y="185" text-anchor="middle">2/4</text>
<rect class="box-quiet" x="580" y="171" width="52" height="19" rx="4"/>
<text class="t-sm" x="606" y="185" text-anchor="middle">4/4</text>
<text class="t" x="18" y="237">＋「何が起きたか・何を試したか・次に何を」</text>
<rect class="box-bad" x="426" y="223" width="52" height="19" rx="4"/>
<text class="t-bad" x="452" y="237" text-anchor="middle">1/4</text>
<rect class="box-quiet" x="580" y="223" width="52" height="19" rx="4"/>
<text class="t-sm" x="606" y="237" text-anchor="middle">4/4</text>
<text class="t" x="18" y="289">＋「会話ではなくファイルにだけ書いて」</text>
<rect class="box-bad" x="426" y="275" width="52" height="19" rx="4"/>
<text class="t-bad" x="452" y="289" text-anchor="middle">2/4</text>
<rect class="box-quiet" x="580" y="275" width="52" height="19" rx="4"/>
<text class="t-sm" x="606" y="289" text-anchor="middle">4/4</text>
<text class="t" x="18" y="341">＋「次はこの行から: 」を1行書かせる</text>
<rect class="box-good" x="426" y="327" width="52" height="19" rx="4"/>
<text class="t-good" x="452" y="341" text-anchor="middle">3/4</text>
<rect class="box-quiet" x="580" y="327" width="52" height="19" rx="4"/>
<text class="t-sm" x="606" y="341" text-anchor="middle">4/4</text>
<text class="t-bad" x="18" y="386">※ 上の3つを合わせると 5/12。残る7回は「このメモからは決まらない」と答えた。</text>
<text class="t-bad" x="18" y="407">　 ところが右の列のとおり、16回とも答えの中には行の番号が出てくる。</text>
<text class="t-bad" x="18" y="428">　 断った理由は返り自身が書いている——「その行が本当に未着手かはメモに書かれていない」。</text>
<text class="t-good" x="18" y="449">※ 「次はこの行から: 」を1行書かせた4回は、4回ともその1行を根拠に答えた。</text>
<text class="t-bad" x="18" y="470">※ ただし4回のうち1回は、AIがその1行に止まっている行を書いた。翌日は正しく「決まらない」と答えた。</text>
<text class="t-xs" x="18" y="491">架空データでの実測（メモ16通・各1回）。生の返りは docs/evidence/ に全文置いてある。</text>
</svg>
