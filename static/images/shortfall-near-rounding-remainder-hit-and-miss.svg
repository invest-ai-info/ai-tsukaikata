</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">端数とほぼ同じ不足額も、22回とも見逃さなかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-07。端数あり契約2本に、本当の不足額を端数の大きさまで縮めて仕込んだ。</text>
<text class="t-sm" x="18" y="64">すべて「端数の範囲内として片付けず、正しく検出した回数」（多いほど良い）。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">(1) 不足額＝端数と同じ大きさ（2円・3円）</text>
<rect class="box-good" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="125" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="157">(2) 不足額＝端数の目安である1円ちょうど</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="189">(3) 短い・曖昧な指示文で(1)を再確認</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-accent" x="18" y="206" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="226">本当の不足額を「一致」「端数の範囲内」として片付けた回は、22回を通じて0回だった。</text>
<text class="t-accent" x="34" y="244">不足額を端数の最小単位である1円ちょうどまで縮めても、見逃しは起きなかった。</text>
<text class="t-accent" x="34" y="262">1回だけ、冒頭の要約文と表の計算結果の金額が食い違ったが、最終的な結論は正しかった。</text>
</svg>
