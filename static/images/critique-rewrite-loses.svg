<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-label="「この下書きを添削してください」と頼んだときに下書きに起きたことを示した図。本文10行のうち、そのまま残ったのは宛名と名乗りの2行だけで、残り8行は消えた。消えた8行には「大幅にコストが下がります」という根拠のない断定が含まれるが、これは指摘されずに削除された。AIが申告した変更点は3件。仕込んだ欠陥10件のうち指摘として挙がったのは1件。原文に根拠のない記述が書き直し本文に5件足された。期限・連絡先・主管・工数といった、下書きに書かれていない欠陥が埋まったものは0件。書き直し本文には、下書きの持ち主が決めていない内容が5件入っていた。根拠のない断定は指摘ではなく削除で処理されるので、書いた本人は自分の断定に根拠が無かったことを知らないまま終わる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="372"/>
<text class="t-strong" x="18" y="26">「この下書きを添削してください」と頼んだとき、下書きに起きたこと</text>
<text class="t-sm" x="18" y="45">架空の社内メール（本文10行）。返ってきた書き直し本文に原文の行がそのまま残っているかを機械で数えた。</text>
<text class="t-xs" x="18" y="84">原文10行のうち、そのまま残った行（濃い枠）と、消えた行（赤い枠）</text>
<rect class="box-good" x="18.0" y="96" width="61.2" height="34" rx="4"/>
<rect class="box-good" x="85.2" y="96" width="61.2" height="34" rx="4"/>
<rect class="box-bad" x="152.4" y="96" width="61.2" height="34" rx="4"/>
<rect class="box-bad" x="219.6" y="96" width="61.2" height="34" rx="4"/>
<rect class="box-bad" x="286.8" y="96" width="61.2" height="34" rx="4"/>
<rect class="box-bad" x="354.0" y="96" width="61.2" height="34" rx="4"/>
<rect class="box-bad" x="421.2" y="96" width="61.2" height="34" rx="4"/>
<rect class="box-bad" x="488.4" y="96" width="61.2" height="34" rx="4"/>
<rect class="box-bad" x="555.6" y="96" width="61.2" height="34" rx="4"/>
<rect class="box-bad" x="622.8" y="96" width="61.2" height="34" rx="4"/>
<text class="t-good" x="18" y="148">残った2行＝宛名と名乗り</text>
<text class="t-bad" x="218" y="148">消えた8行。うち「大幅にコストが下がります」は指摘されずに削除された</text>
<rect class="box-quiet" x="18" y="176" width="666" height="30" rx="6"/>
<text class="t" x="30" y="196">AIが申告した変更点</text>
<text class="t-sm" x="600" y="196">3件</text>
<rect class="box-bad" x="18" y="216" width="666" height="30" rx="6"/>
<text class="t" x="30" y="236">指摘として挙がった欠陥（仕込み10件のうち）</text>
<text class="t-bad" x="600" y="236">1件</text>
<rect class="box-bad" x="18" y="256" width="666" height="30" rx="6"/>
<text class="t" x="30" y="276">原文に根拠のない記述が、書き直し本文に足された</text>
<text class="t-bad" x="600" y="276">5件</text>
<rect class="box-bad" x="18" y="296" width="666" height="30" rx="6"/>
<text class="t" x="30" y="316">書かれていない欠陥（期限・連絡先・主管・工数）が埋まった</text>
<text class="t-bad" x="600" y="316">0件</text>
<text class="t-xs" x="18" y="344">※ いちばん重いのは3行目。書き直し本文には、下書きの持ち主が決めていない内容が5件入っていた。</text>
<text class="t-xs" x="18" y="360">※ 根拠のない断定は「指摘」ではなく「削除」で処理されるので、書いた本人は自分の断定に根拠が無かったことを知らないまま終わる。</text>
</svg>
