<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" role="img" aria-label="旧設計と今回の設計の違いを示す図。旧設計＝工程1は「至急」などの語の有無だけで判定し、工程2に「本当に該当するか確認して」を足すと、健全な5件だけを渡した回でも4回中4回で正しい項目を1件誤って除外した。今回＝工程1の指示文に「語が無くても、締切の近さなら今日中に含める」を追加したところ、材料A（丁寧な長文）は7件中7件を回収し、工程2は確認なしの並べ替えだけでも4回とも0件除外で巻き添えが消えた。ただし材料B（口語）では「そろそろ始まる」という言い方の1件だけ、2回とも拾えなかった。下の枠には、基準を広げる効果は言い方の種類ごとに別々に確かめないと、抜けたまま気づかないと書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="384"/>
<text class="t-strong" x="18" y="26">直す場所を工程2から工程1へ移すと、巻き添えそのものが起きなくなる</text>
<text class="t-sm" x="18" y="45">2026-09-19の実測（旧設計）と、2026-09-20の実測（今回）を並べたもの。</text>
<rect class="box-bad" x="18" y="96" width="684" height="58" rx="6"/>
<text class="t-bad" x="34" y="118">旧設計：工程1は「至急」などの語の有無だけで判定し、基準は狭いまま</text>
<text class="t-bad" x="34" y="137">工程2に「本当に該当するか確認して」を足すと、健全な5件だけでも4/4で1件を誤って除外</text>
<text class="t-xs" x="360.0" y="176" text-anchor="middle">↓ 直す場所を工程2から工程1へ移す</text>
<rect class="box-good" x="18" y="196" width="684" height="58" rx="6"/>
<text class="t-good" x="34" y="218">今回：工程1に「語が無くても、締切の近さなら今日中に含める」を追加</text>
<text class="t-good" x="34" y="237">材料Aは7件中7件を回収。工程2は確認なしでも4回とも0件除外（巻き添え消失）</text>
<rect class="box-bad" x="18" y="266" width="684" height="58" rx="6"/>
<text class="t-bad" x="34" y="288">ただし材料B（口語）では「そろそろ始まる」という言い方だけ、2回とも拾えなかった</text>
<text class="t-bad" x="34" y="307">「明日の朝一」型の言い換えは拾えても、「まもなく」型の言い換えは言い方次第で抜ける</text>
<rect class="box-accent" x="18" y="336" width="684" height="28" rx="6"/>
<text class="t-accent" x="34" y="356">基準を広げる効果は、言い方の種類ごとに別々に確かめないと、抜けたまま気づかない。</text>
</svg>
