<svg xmlns="http://www.w3.org/2000/svg" width="720" height="462" viewBox="0 0 720 462" role="img" aria-label="6つのモデルの単価を比べた横棒グラフ。100万トークンあたりのドル。Claude Opus 5.5 は入力4ドル・出力20ドル、Claude Opus 5 は入力5ドル・出力25ドル、Claude Fable 5.1 は入力10ドル・出力50ドル、GPT-6 Astra は入力10ドル・出力50ドル、GPT-6 Sol は入力2ドル・出力10ドル、Gemini 3.1 Pro Preview は入力2ドル・出力12ドル。GPT と Gemini は短い入力のときの値段。会社ごとにトークンの数え方が違うため、単価の安さは支払額の安さを意味しない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="462"/>
<text class="t-strong" x="18" y="26">1トークンあたりの単価（100万トークンあたり・ドル）</text>
<text class="t-sm" x="18" y="45">入力＝薄い色 ／ 出力＝濃い色。GPT と Gemini は短い入力のときの値段です。</text>
<text class="t-sm" x="18" y="64">各社の公式料金ページの数字だけを並べています（2026年9月23日に確認）。</text>
<text class="t" x="18" y="94">Claude Opus 5.5</text>
<text class="t-xs" x="214" y="93">入力</text>
<rect class="bar-in" x="250" y="82" width="29.6" height="14" rx="2"/>
<text class="t-sm" x="287.6" y="93">$4</text>
<text class="t-xs" x="214" y="112">出力</text>
<rect class="bar-out" x="250" y="101" width="148.0" height="14" rx="2"/>
<text class="t-sm" x="406.0" y="112">$20</text>
