<text class="t-xs" x="214" y="203">入力</text>
<rect class="bar-in" x="250" y="192" width="74.0" height="14" rx="2"/>
<text class="t-sm" x="332.0" y="203">$10</text>
<text class="t-xs" x="214" y="222">出力</text>
<rect class="bar-out" x="250" y="211" width="370.0" height="14" rx="2"/>
<text class="t-sm" x="628.0" y="222">$50</text>
<text class="t" x="18" y="259">GPT-6 Astra</text>
<text class="t-xs" x="214" y="258">入力</text>
<rect class="bar-in" x="250" y="247" width="74.0" height="14" rx="2"/>
<text class="t-sm" x="332.0" y="258">$10</text>
<text class="t-xs" x="214" y="277">出力</text>
<rect class="bar-out" x="250" y="266" width="370.0" height="14" rx="2"/>
<text class="t-sm" x="628.0" y="277">$50</text>
<text class="t" x="18" y="314">GPT-6 Sol</text>
<text class="t-xs" x="214" y="313">入力</text>
<rect class="bar-in" x="250" y="302" width="14.8" height="14" rx="2"/>
<text class="t-sm" x="272.8" y="313">$2</text>
<text class="t-xs" x="214" y="332">出力</text>
<rect class="bar-out" x="250" y="321" width="74.0" height="14" rx="2"/>
<text class="t-sm" x="332.0" y="332">$10</text>
<text class="t" x="18" y="369">Gemini 3.1 Pro Preview</text>
<text class="t-xs" x="214" y="368">入力</text>
<rect class="bar-in" x="250" y="357" width="14.8" height="14" rx="2"/>
<text class="t-sm" x="272.8" y="368">$2</text>
<text class="t-xs" x="214" y="387">出力</text>
<rect class="bar-out" x="250" y="376" width="88.8" height="14" rx="2"/>
