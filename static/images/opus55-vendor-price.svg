<text class="t-xs" x="18" y="432">※ 単価が安い＝支払いが安い、ではありません。会社ごとにトークンの数え方が違います。</text>
<text class="t-xs" x="18" y="450">※ Gemini 3.1 Pro は試用版（Preview）の表示です。長く使うなら値段が変わりうると考えてください。</text>
