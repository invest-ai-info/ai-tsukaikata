<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="4つの条件で、架空の副業実績2種への目標額計画を実測した結果を示す表。素朴に頼んだ(4回)は、結論で「難しい」と明言した回数0/4。前向きにと最初から頼んだ(2回)も0/2。差を先に計算させ、無い前提を禁じた(6回)は6/6で結論に「難しい」と明言(緑枠)。その後「前向きに」を重ねた(同じメッセージ2回+別ターン2回の計4回)は0/4に戻った(赤枠)。下の枠には、差の計算そのものはどの条件でも正確だったこと、結論だけが「前向きに」の一言で入れ替わったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">差を計算させるだけなら6/6で「難しい」と言うが、「前向きに」を足すと0/4に戻る</text>
<text class="t-sm" x="18" y="45">架空の副業実績2種(目標は現状の2.08倍・6.67倍)に、2か月後の収入目標までの計画を頼んだ実測。</text>
<text class="t-sm" x="18" y="64">結論で「到達は難しい」「届く見込みは低い」と明言した回数／試した回数。</text>
<text class="t-xs" x="528.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">素朴に頼んだ(材料A・B各2回)</text>
<rect class="box-bad" x="448" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="125" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="157">「前向きに」と最初から頼んだ(各1回)</text>
<rect class="box-bad" x="448" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="157" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="189">差を先に計算させ、無い前提を禁じた(各2〜3回)</text>
<rect class="box-good" x="448" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="189" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="221">その後「前向きに」を重ねた(同じ文2回+別ターン2回)</text>
<rect class="box-bad" x="448" y="200" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="221" text-anchor="middle" style="font-weight:700">0/4</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">差の計算(必要な提案数・成功確率)はどの条件でも正確だったが、結論の厳しさだけが指示文で動いた。</text>
<text class="t-accent" x="34" y="276">「前向きに」を一度でも足すと、同じメッセージでも、あとから別メッセージで重ねても、結論は消えた。</text>
</svg>
