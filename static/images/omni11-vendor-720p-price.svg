<rect class="bar-old" x="208" y="238" width="103.0" height="22" rx="3"/>
<text class="t-bad" x="319.0" y="254.0">$0.10／秒（終了予定）</text>
<text class="t" x="18" y="291.0">Sora 2 Pro</text>
