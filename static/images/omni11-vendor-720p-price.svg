<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-label="720p・音声付き動画1秒あたりの価格を6モデルで比べた横棒グラフ。Gemini Omni 1.1 Flashは0.10ドル、Veo 3.1 Liteは0.05ドル、Veo 3.1 Fastは0.10ドル、Veo 3.1 Standardは0.40ドル、Sora 2は0.10ドル、Sora 2 Proは0.30ドル。Sora 2とSora 2 Proは、Videos APIごと2026年9月24日に提供終了と公式が告知しており、同ページに後継モデルの案内は無い。Anthropicは動画生成モデルを提供していない。">
<style>
