<rect class="bg" x="0" y="0" width="720" height="392"/>
<text class="t-strong" x="18" y="26">720pの動画1秒ぶんを、同じ条件で6モデル並べる</text>
<text class="t-sm" x="18" y="45">音声付き・720p出力のときの秒単価（ドル）。各社の公式料金ページに書かれている値。</text>
<text class="t-sm" x="18" y="64">Sora 2 系（赤字）はAPIが2026年9月24日に終了予定と公式が告知している。</text>
