<svg xmlns="http://www.w3.org/2000/svg" width="720" height="546" viewBox="0 0 720 546" role="img" aria-label="noteの『AI参照の対価還元』の対象・対象外・手続きを、note公式ブログ(2026年11月18日公表・2026年11月27日確認)の原文どおりに7行で並べた図。1行目＝対象コンテンツは誰でも読める無料記事のテキスト部分のみで緑。2行目＝対象外は有料記事の有料部分・メンバーシップ特典・画像音声動画で赤。3行目＝対象期間は2026年4月〜7月に公開しAIの回答に参照された実績がある記事。4行目＝申し込みは不要で対象者には個別にメールで連絡が来るため緑。5行目＝『生成AIの学習に拒否意向を示す』設定をオンにしていても、または『AI学習対価還元プログラム』に参加していなくても対象になる(学習と参照は別の仕組みのため)ため緑。6行目＝受け取り方法は銀行振込またはAmazonギフトカード、支払い時期は2026年12月中旬を予定。7行目＝noteが公表していないものは対価の総額・対象人数・noteの運営手数料の率で赤。下の枠には、対象かどうかは自分で判断できること、受け取れる金額は原文にも書かれておらずAIに聞いても計算式は出てこないことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
