</style>
<rect class="bg" x="0" y="0" width="720" height="436"/>
<text class="t-strong" x="18" y="26">検算を頼んでも、本物の指摘は1件も消えなかった</text>
<text class="t-sm" x="18" y="45">「重要です」を足しても見逃しは減らないの指示文4（数字の突合をまとめた指示）を</text>
<text class="t-sm" x="18" y="64">教材Aで2回試した過去の生の指摘結果（誤検知なし1回・誤検知1件あり1回）に、</text>
<text class="t-sm" x="18" y="83">「計算をやり直して」（具体的）と「もう一度確認して」（曖昧）の2通りの検算を</text>
<text class="t-sm" x="18" y="102">独立の新規会話でそれぞれ試した。本物の欠陥3件（割引率・過去日・条件抜け）の生存数。</text>
<text class="t-xs" x="18" y="121">生の回答は docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="190">計算をやり直して×誤検知なしの回</text>
<rect class="box-good" x="318" y="168" width="190" height="34" rx="4"/>
<text class="t-good" x="353.0" y="190">3/3 本物の指摘が生存</text>
<text class="t-sm" x="18" y="236">計算をやり直して×誤検知ありの回</text>
<rect class="box-good" x="318" y="214" width="190" height="34" rx="4"/>
<text class="t-good" x="353.0" y="236">3/3 本物の指摘が生存</text>
<text class="t-sm" x="18" y="282">もう一度確認して×誤検知なしの回</text>
<rect class="box-good" x="318" y="260" width="190" height="34" rx="4"/>
<text class="t-good" x="353.0" y="282">3/3 本物の指摘が生存</text>
<text class="t-sm" x="18" y="328">もう一度確認して×誤検知ありの回</text>
<rect class="box-good" x="318" y="306" width="190" height="34" rx="4"/>
<text class="t-good" x="353.0" y="328">3/3 本物の指摘が生存</text>
<rect class="box-quiet" x="18" y="356" width="678" height="56" rx="6"/>
<text class="t-strong" x="34" y="378">誤検知（1件）が含まれていた2回は、2回とも正しく取り下げられた。</text>
<text class="t-sm" x="34" y="396">検算の言い方（具体的・曖昧）による差は、この4回では出なかった。</text>
</svg>
