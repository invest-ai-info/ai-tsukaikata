<svg xmlns="http://www.w3.org/2000/svg" width="720" height="436" viewBox="0 0 720 436" role="img" aria-label="検算を頼んでも本物の指摘が消えなかったことを示すマス目。「重要です」を足しても見逃しは減らないの指示文4（数字の突合をまとめた指示）を架空のメルマガ下書き12件（教材A）で2回試した過去の生の指摘結果（1回目は誤検知なし、2回目は正しく10%オフだった号を誤って8.2%オフと指摘した誤検知が1件あり）に対して、「指摘した号だけ計算をやり直して確認して」という具体的な検算指示と、「指摘した号をもう一度確認して」という曖昧な検算指示を、それぞれ独立の新規会話で試した。本物の欠陥3件（割引率の食い違い・過去日・条件抜け）は、具体的×誤検知なし3/3、具体的×誤検知あり3/3、曖昧×誤検知なし3/3、曖昧×誤検知あり3/3と、4回とも1件も消えなかった。誤検知が含まれていた2回は、具体的・曖昧のどちらの検算でも正しく取り下げられ、検算の言い方による差はこの4回では見られなかった。">
<style>
