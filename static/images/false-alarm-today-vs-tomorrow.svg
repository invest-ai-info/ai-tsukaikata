<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" role="img" aria-label="毎朝の点検の誤報を1件だけ止めさせたあと、今日の記録と翌日の記録で結果がどう変わるかを、直し方3通りで並べた表。架空の点検5条と記録30行を2組作り、各条に本物の異常を2件ずつ合計10件と、第3条に当たってしまう無害な行を1件仕込んだ。手順は4段で、5条を当てる、誤報の1行だけ見せて直させる、同じ記録に当て直す、翌日の別の記録に当てる。1つの直し方につき記録2組かける各2回で4回ずつ、全12回。今日の記録では、3通りとも本物10件を10件とも検出し、巻き添えは0件だった。誤報の1行は12回とも止まり、条文が丸ごと消えた回も0回である。ところが翌日の記録では、そのまま直させた4回が桁落ち3件のうち7件しか拾えず、検査は消さないでこの1件だけを除く条件をと足した4回が8件、直す前に鳴っていた行が全部まだ鳴るか確かめてと足した4回が9件だった。合わせて36件のうち24件しか拾えず、12件を見落としている。しかも12回のうち11回が同じ1件を落としていて、それは誤報の種と同じ品目の桁落ちだった。除外がその品目ごと効くためである。なお7回は、頼んでいないのに、その行は除外に当たるので挙がっていませんと自分から書いた。">
<style>
