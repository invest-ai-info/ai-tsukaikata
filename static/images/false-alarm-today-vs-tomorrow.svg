</style>
<rect class="bg" x="0" y="0" width="720" height="438"/>
<text class="t-strong" x="18" y="26">誤報を1件止めても、今日は何も減らない。減るのは翌日から</text>
<text class="t-sm" x="18" y="45">架空の「毎朝の点検・5条」と記録30行を2組。各条に本物の異常を2件ずつ＝10件と、第3条に当たってしまう</text>
<text class="t-sm" x="18" y="64">無害な行を1件（誤報の種）仕込んだ。①5条を当てる →②誤報の1行だけ見せて直させる → ③同じ記録に当て直す</text>
<text class="t-sm" x="18" y="83">→ ④翌日の記録（別の20行）に当てる。1つの直し方につき、記録2組 × 各2回 ＝ 4回。</text>
<text class="t-sm" x="18" y="102">翌日の記録には、元の第3条なら拾えるはずの桁落ちを3件だけ入れてある（ほかの条の違反は0件）。</text>
<text class="t-xs" x="340" y="122" text-anchor="middle">今日の記録</text>
<text class="t-xs" x="340" y="135" text-anchor="middle">本物10件の検出</text>
<text class="t-xs" x="436" y="122" text-anchor="middle">今日の記録</text>
<text class="t-xs" x="436" y="135" text-anchor="middle">巻き添え</text>
<text class="t-xs" x="560" y="122" text-anchor="middle">翌日の記録</text>
<text class="t-xs" x="560" y="135" text-anchor="middle">桁落ち3件の検出</text>
<text class="t" x="18" y="168">そのまま「この誤検知が出ないように直して」</text>
<text class="t-xs" x="26" y="184">（4回）</text>
<rect class="box-good" x="310" y="154" width="60" height="19" rx="4"/>
<text class="t-good" x="340" y="168" text-anchor="middle">10/10</text>
<rect class="box-good" x="411" y="154" width="50" height="19" rx="4"/>
<text class="t-good" x="436" y="168" text-anchor="middle">0件</text>
<rect class="box-bad" x="530" y="154" width="60" height="19" rx="4"/>
<text class="t-bad" x="560" y="168" text-anchor="middle">7/12</text>
<text class="t" x="18" y="218">＋「検査は消さないで。この1件だけを除く条件を」</text>
<text class="t-xs" x="26" y="234">（4回）</text>
<rect class="box-good" x="310" y="204" width="60" height="19" rx="4"/>
<text class="t-good" x="340" y="218" text-anchor="middle">10/10</text>
<rect class="box-good" x="411" y="204" width="50" height="19" rx="4"/>
<text class="t-good" x="436" y="218" text-anchor="middle">0件</text>
<rect class="box-bad" x="530" y="204" width="60" height="19" rx="4"/>
<text class="t-bad" x="560" y="218" text-anchor="middle">8/12</text>
<text class="t" x="18" y="268">＋「直す前に鳴っていた行が全部まだ鳴るか確かめて」</text>
<text class="t-xs" x="26" y="284">（4回）</text>
<rect class="box-good" x="310" y="254" width="60" height="19" rx="4"/>
<text class="t-good" x="340" y="268" text-anchor="middle">10/10</text>
<rect class="box-good" x="411" y="254" width="50" height="19" rx="4"/>
<text class="t-good" x="436" y="268" text-anchor="middle">0件</text>
<rect class="box-bad" x="530" y="254" width="60" height="19" rx="4"/>
<text class="t-bad" x="560" y="268" text-anchor="middle">9/12</text>
<text class="t-good" x="18" y="312">※ 心配していた事故は今日の記録には出なかった＝12回とも、直す前に鳴っていた本物10件は全部まだ鳴る。</text>
<text class="t-good" x="18" y="333">　 誤報の1行は12回とも止まり、条文が丸ごと消えた回も0回（12回とも5条そろっている）。</text>
<text class="t-bad" x="18" y="354">※ 翌日の記録では、12回で合わせて12件を見落とした（3件 × 12回 ＝ 36件のうち24件しか拾えない）。</text>
<text class="t-bad" x="18" y="375">　 12回のうち11回が、同じ1件を落とした＝「誤報の種と同じ品目」の桁落ち。除外がその品目ごと効くため。</text>
<text class="t-good" x="18" y="396">※ 7/12回は、頼んでいないのに「その行は除外に当たるので挙がっていません」と自分から書いた。</text>
<text class="t-xs" x="18" y="417">架空データでの実測（全12回・各4段）。生の返りは docs/evidence/ に全文置いてある。</text>
</svg>
