<svg xmlns="http://www.w3.org/2000/svg" width="720" height="394" viewBox="0 0 720 394" role="img" aria-label="0件警告（毎日あるはずの種類が今日は1件も無いことの検出）が当たるかどうかを、列見出し「種類」がある記録（表形式・材料A）と見出しの無い記録（走り書き・材料B）の2群に分けて示す図。材料Aのグループでは、請求・納期の2項目をリストにした回も、納期だけの1項目のリストにした回も、どちらも0件を正しく検出した（緑）。材料Bのグループでは、在庫だけの1項目のリストを材料点検と統合した回も、単独の指示文で聞いた回も、どちらも在庫が0件であることを検出できなかった（赤）。一方、材料Bで実際にある種類（設備）を聞いた対照実験では、正しく「なし」と判定できた（緑）。各行は2回ずつ試し、2回とも同じ結果だった。下の枠には、崩れたのは0件になる種類を見出しの無い材料から確定するところだけで、材料Bでも実在する種類は正しく判定できていることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="394"/>
<text class="t-strong" x="18" y="26">0件警告が当たるかは、リストの項目数ではなく列見出しの有無で分かれた</text>
<text class="t-sm" x="18" y="45">同じ「毎日ある種類は今日は0件か」という問いを、材料A（表形式）・材料B（走り書き）に当てた。</text>
<text class="t-sm" x="18" y="64">材料Aは列見出し「種類」があり、材料Bには見出しが無い（[設備]のような角括弧のタグのみ）。</text>
<text class="t-sm" x="18" y="83">各行は2回ずつ試し、2回とも同じ結果だった行だけを1行で示す。</text>
<text class="t-strong" x="18" y="122">列見出し「種類」がある記録（表形式・材料A）</text>
<text class="t-sm" x="34" y="151">請求・納期（2項目のリスト）</text>
<rect class="box-good" x="318" y="132" width="190" height="24" rx="4"/>
<text class="t-good" x="413.0" y="149" text-anchor="middle" style="font-weight:700">0件を検出した</text>
<text class="t-sm" x="34" y="181">納期だけ（1項目のリスト）</text>
<rect class="box-good" x="318" y="162" width="190" height="24" rx="4"/>
<text class="t-good" x="413.0" y="179" text-anchor="middle" style="font-weight:700">0件を検出した</text>
<text class="t-strong" x="18" y="210">見出しの無い記録（走り書き・材料B）</text>
<text class="t-sm" x="34" y="239">在庫だけ（1項目・点検と統合）</text>
<rect class="box-bad" x="318" y="220" width="190" height="24" rx="4"/>
<text class="t-bad" x="413.0" y="237" text-anchor="middle" style="font-weight:700">検出できず</text>
<text class="t-sm" x="34" y="269">在庫だけ（1項目・単独の指示文）</text>
<rect class="box-bad" x="318" y="250" width="190" height="24" rx="4"/>
<text class="t-bad" x="413.0" y="267" text-anchor="middle" style="font-weight:700">検出できず</text>
<text class="t-sm" x="34" y="299">設備だけ（対照・実際にある種類）</text>
<rect class="box-good" x="318" y="280" width="190" height="24" rx="4"/>
<text class="t-good" x="413.0" y="297" text-anchor="middle" style="font-weight:700">正しく「なし」</text>
<rect class="box-accent" x="18" y="322" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="342">崩れたのは「0件になる種類を、見出しの無い材料から確定する」ところだけ。</text>
<text class="t-accent" x="34" y="360">材料Bでも、実在する種類（設備）は正しく判定できている。</text>
</svg>
