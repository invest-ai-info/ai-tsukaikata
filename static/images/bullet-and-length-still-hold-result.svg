<svg xmlns="http://www.w3.org/2000/svg" width="720" height="426" viewBox="0 0 720 426" role="img" aria-label="箇条書き禁止・100字以内の2書式を、対策の一文の有無で試した16回の結果を比べた横棒グラフ。材料2本に各条件を2回=4回ずつ実行した。箇条書き禁止・優先なしは4/4正解、100字以内・優先なしも4/4正解。優先指定を付けた箇条書き禁止・100字以内は、どちらも4回中3回は正解で、残り1回は数字の代わりに「今日の日付が食い違っています」という確認が返った（どちらも材料A・1回目）。数字で答えた14回は全部正解だった。">
