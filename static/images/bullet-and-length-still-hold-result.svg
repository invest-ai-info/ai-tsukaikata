<rect class="bg" x="0" y="0" width="720" height="426"/>
<text class="t-strong" x="18" y="26">数字で答えた14回は全部正解。優先指定の2回は確認が返った</text>
<text class="t-sm" x="18" y="45">材料2本に、対策の一文の有無×書式2種（箇条書き禁止・100字以内）を各2回=4回ずつ実行した（計16回）。</text>
<text class="t-sm" x="18" y="64">正しい答えは「新着0件」。緑＝数字で正解、青＝数字の代わりに日付の確認が返った回。</text>
<text class="t-xs" x="18" y="83">生の回答は docs/evidence/ に全文置いてある。</text>
