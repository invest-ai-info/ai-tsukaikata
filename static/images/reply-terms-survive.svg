<svg xmlns="http://www.w3.org/2000/svg" width="720" height="338" viewBox="0 0 720 338" role="img" aria-label="取引先への返事の文面を、頼み方を3通りに変えて機械で照合した図。先に自分で決めた条件8件を11の文字列に分解し、文面にそのまま残った数を数えた。あわせて、条件を緩めるぼかし語15語が何件出たかも数えている。角が立たないように書いてくださいと頼むと、残った条件は11のうち4件で、ぼかし語は8件だった。できるだけ丁寧に、相手の気分を害さないようにと足すと、残った条件は0件になり、ぼかし語は9件に増えた。48,000円も9月12日も修正2回も、文面から丸ごと消えている。私が決めた条件の数字と期日は一字一句そのまま文面に書いてください、言い換えやぼかしをしないでください、と足すと、11件すべてが残り、ぼかし語は0件になった。消えたのは、ページ追加1ページ15,000円、支払いは納品後7日以内、銀行振込、素材は8月29日まで、著作権の譲渡、打ち合わせは1回30分まで、などである。消えるだけでなく反転もしており、これより早くはできないという条件が、早められるよう進めてまいりますという文になった。ぼかし語15語は先に決めたもので、条件にも相手のメールにも1件も出てこない。つまり書く工程で入っている。どの返事も読むかぎり礼儀正しく、条件と並べるまで緩んだことに気づけない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="338"/>
<text class="t-strong" x="18" y="26">丁寧にするほど、自分が決めた条件が文面から消える</text>
<text class="t-sm" x="18" y="45">同じ材料（先に決めた条件8件＋相手のメール）。頼み方だけを変えた。</text>
<text class="t-xs" x="258" y="94">条件の11の文字列のうち、文面に残った数</text>
<text class="t-xs" x="608" y="94">ぼかし語</text>
<text class="t-sm" x="18" y="127">そのまま「角が立たないように」</text>
<rect class="bar-old" x="258" y="111" width="290" height="22" rx="3" opacity="0.35"/>
<rect class="bar-in" x="258" y="111" width="105" height="22" rx="3"/>
<text class="t-sm" x="373" y="127">4件</text>
<text class="t-bad" x="608" y="127">8件</text>
<text class="t-sm" x="18" y="183">「できるだけ丁寧に」を足す</text>
<rect class="bar-old" x="258" y="167" width="290" height="22" rx="3" opacity="0.35"/>
<text class="t-bad" x="268" y="183">0件</text>
<text class="t-bad" x="608" y="183">9件</text>
<text class="t-sm" x="18" y="239">「数字と期日は一字一句そのまま」</text>
<rect class="bar-old" x="258" y="223" width="290" height="22" rx="3" opacity="0.35"/>
<rect class="bar-new" x="258" y="223" width="290" height="22" rx="3"/>
<text class="t-accent" x="558" y="239">11件</text>
<text class="t-sm" x="608" y="239">0件</text>
<text class="t-xs" x="18" y="270">※ 消えたのは 15,000円・7日以内・銀行振込・8月29日・著作権の譲渡・30分まで、など。</text>
<text class="t-xs" x="18" y="288">※ 消えるだけでなく反転する。「これより早くはできない」が「早められるよう進めてまいります」になった。</text>
<text class="t-xs" x="18" y="306">※ ぼかし語15語は先に決めたもの。条件にも相手のメールにも1件も無い（書く工程で入っている）。</text>
<text class="t-xs" x="18" y="324">※ どの返事も、読むかぎり礼儀正しい。条件と並べるまで、緩んだことに気づけない。</text>
</svg>
