<rect class="bg" x="0" y="0" width="720" height="426"/>
<text class="t-strong" x="18" y="26">そのまま頼んだ4回は4回とも6件ちょうど。出す形を決めてから、件数が回ごとに割れた</text>
<text class="t-sm" x="18" y="45">架空の「送信済み30行」と「受信25行」を2本（会社の総務課／お祭りの事務局）。催促すべきは</text>
<text class="t-sm" x="18" y="64">6件（本当に未返信の5件＋同じ用件を2回送った1組）で、走らせる前にコードで確かめてある。</text>
<text class="t-sm" x="18" y="83">6版 × 材料2本 × 各2回 ＝ 全24回。帯は4回の最小から最大まで、縦棒はその4回の値。</text>
