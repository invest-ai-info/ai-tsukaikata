<text class="t-good" x="18" y="342">※ 本当に未返信の5件は、24回のうち23回で5件とも挙がった。落ちたのは②の1回だけ。</text>
<text class="t-bad" x="18" y="363">🚨 ①以外で増えたぶんは、返事の要らない送信（お礼・周知）と、返事が来ている相手。</text>
<text class="t-bad" x="18" y="384">   ②④⑤では、同じ指示文の2回が 11件と5件・8件と12件・6件と13件に割れた。</text>
