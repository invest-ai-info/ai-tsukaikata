<svg xmlns="http://www.w3.org/2000/svg" width="720" height="426" viewBox="0 0 720 426" role="img" aria-label="送信済み一覧と受信一覧から「返事が来ていないもの」を挙げさせたとき、催促の一覧に挙がった件数を6通りの頼み方で並べた図。架空の送信済み30行と受信25行を2本、会社の総務課とお祭りの事務局で用意した。催促すべきは6件で、本当に未返信の5件と、同じ用件を2回送った1組である。6版かける材料2本かける各2回で全24回。そのまま頼んだ版は4回とも6件ちょうど。出す形を決めた版は11件、5件、9件、7件。同じ用件を2回送ったら1行にまとめてを足した版は8件、11件、9件、9件。件名の一致で決めないでを足した版は8件、12件、14件、9件。決められないの欄を足した版は6件、13件、6件、9件。毎朝そのまま貼る保存版は7件、8件、8件、6件。本当に未返信の5件は24回のうち23回で5件とも挙がり、落ちたのは出す形を決めた版の1回だけである。増えたぶんは、返事の要らない送信と、返事が来ている相手だった。">
<style>
