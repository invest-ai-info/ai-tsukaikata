<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" role="img" aria-label="AIの「記憶」機能を、暗号化の説明・鍵の保管場所・現在使えるかで3社比べた表。暗号化の説明＝Googleはクラウド上でも暗号化すると説明、Anthropicは発表ページに暗号化方式の記載なし、OpenAIは確認できず。鍵の保管場所＝Googleは利用者の端末のみでGoogleは持たない、Anthropicは記載なし、OpenAIは確認できず。現在使えるか＝Googleは発表のみで提供時期は未定、AnthropicはTeam/Enterprise・Pro/Maxで提供中、OpenAIは確認できず。OpenAIの該当ページはbot判定の403でこの記事からは確認できなかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="356"/>
<text class="t-strong" x="18" y="26">「記憶」の暗号化を明言しているのは、3社のうちGoogleだけだった</text>
<text class="t-sm" x="18" y="45">各社の公式ページ（発表・ブログ）に書かれている範囲だけを並べた。</text>
<text class="t-sm" x="18" y="64">Anthropicの記憶機能は既に提供中だが、暗号化方式の記載は発表ページに無い。</text>
<text class="t-sm" x="18" y="83">OpenAIの該当ページはbot判定の403で、この記事からは確認できなかった。</text>
<text class="t-accent" x="134.0" y="124">Google</text>
<text class="t-accent" x="328.0" y="124">Anthropic</text>
<text class="t-accent" x="522.0" y="124">OpenAI</text>
<text class="t-sm" x="18" y="156">暗号化の説明</text>
<rect class="box-accent" x="126.0" y="138" width="188.0" height="48" rx="4"/>
<text class="t-accent" x="134.0" y="156">クラウド上でも</text>
<text class="t-accent" x="134.0" y="172">暗号化すると説明</text>
<rect class="box-quiet" x="320.0" y="138" width="188.0" height="48" rx="4"/>
<text class="t-sm" x="328.0" y="156">発表ページに</text>
<text class="t-sm" x="328.0" y="172">暗号化方式の記載なし</text>
<rect class="box-bad" x="514.0" y="138" width="188.0" height="48" rx="4"/>
<text class="t-bad" x="522.0" y="156">確認できず</text>
<text class="t-sm" x="18" y="214">鍵の保管場所</text>
<rect class="box-accent" x="126.0" y="196" width="188.0" height="48" rx="4"/>
<text class="t-accent" x="134.0" y="214">利用者の端末のみ</text>
<text class="t-accent" x="134.0" y="230">（Googleは持たない）</text>
<rect class="box-quiet" x="320.0" y="196" width="188.0" height="48" rx="4"/>
<text class="t-sm" x="328.0" y="214">記載なし</text>
<rect class="box-bad" x="514.0" y="196" width="188.0" height="48" rx="4"/>
<text class="t-bad" x="522.0" y="214">確認できず</text>
<text class="t-sm" x="18" y="272">現在使えるか</text>
<rect class="box-accent" x="126.0" y="254" width="188.0" height="48" rx="4"/>
<text class="t-accent" x="134.0" y="272">発表のみ</text>
<text class="t-accent" x="134.0" y="288">提供時期は未定</text>
<rect class="box-quiet" x="320.0" y="254" width="188.0" height="48" rx="4"/>
<text class="t-sm" x="328.0" y="272">Team/Enterprise・</text>
<text class="t-sm" x="328.0" y="288">Pro/Maxで提供中</text>
<rect class="box-bad" x="514.0" y="254" width="188.0" height="48" rx="4"/>
<text class="t-bad" x="522.0" y="272">確認できず</text>
<text class="t-xs" x="18" y="330">※「確認できず」「記載なし」は機能が無いと明言されているのではなく、公式ページに記載が見当たらなかった意味。</text>
</svg>
