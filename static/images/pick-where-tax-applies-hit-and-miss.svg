<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="消費税の当てはめ先を1つ指定したときの実測結果を示す表。上4行は主回答が5回とも同じ2つの金額で揃った回数で、材料1（段階制）の指定A・指定B、材料2（一律16.5%）の指定A・指定Bのいずれも5/5。下2行は聞いていない金額が追加で出た回数で、材料1（指定A・指定Bの合計10回）は0/10だったのに対し、材料2（同10回）は7/10だった。下の枠には、消費税の当てはめ先を1つ指定すると段階制の主回答は20回中20回とも同じ2つの金額に収まったこと、段階制は余計な数字が0/10だったが一律16.5%は同じ指定でも7/10に余計な数字が付いたこと、一律16.5%は対照のつもりで置いた材料だったが安定していても聞いていない数字は別に混入することが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">主回答はどちらの材料も安定したが、余計な数字は一律料率にだけ付いた</text>
<text class="t-sm" x="18" y="45">実測2026-10-01。前作と同じ材料・指示文に、消費税の当てはめ先を指定する一文を足した。</text>
<text class="t-sm" x="18" y="64">上4行は「主回答が5回とも同じ2つの金額で揃った回数」、下2行は「聞いていない金額が付いた回数」。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">材料1（段階制）・指定A：主回答の安定</text>
<rect class="box-good" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="125" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="157">材料1（段階制）・指定B：主回答の安定</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="189">材料2（一律16.5%）・指定A：主回答の安定</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="221">材料2（一律16.5%）・指定B：主回答の安定</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="253">材料1（段階制）：聞いていない数字が付いた回</text>
<rect class="box-good" x="438" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="253" text-anchor="middle" style="font-weight:700">0/10</text>
<text class="t" x="18" y="285">材料2（一律16.5%）：聞いていない数字が付いた回</text>
<rect class="box-bad" x="438" y="264" width="160" height="26" rx="4"/>
<text class="t-bad" x="518.0" y="285" text-anchor="middle" style="font-weight:700">7/10</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">消費税の当てはめ先を1つ指定すると、段階制の主回答は20回中20回とも同じ2つの金額に収まった。</text>
<text class="t-accent" x="34" y="340">段階制は余計な数字が0/10だったが、一律16.5%は同じ指定でも7/10に余計な数字が付いた。</text>
<text class="t-accent" x="34" y="358">一律16.5%は対照のつもりで置いた材料だったが、安定していても聞いていない数字は別に混入する。</text>
</svg>
