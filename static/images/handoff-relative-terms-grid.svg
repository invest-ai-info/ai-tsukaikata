<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="絶対日付に直す指示文4版で、触ってはいけない4項目が2回中何回誤変換されたかのマス目。先週号は版a・bで2回とも誤変換、版c・dでは2回中1回（もう1回は基準日不明の逃げ道）。先月比は版a・b・cで2回とも誤変換されたが、比較語を残す指示を足した版dでは2回とも0件。前年同月比は版a・bで2回中1回、版c・dでは0回。翌月初は版bで2回中1回のみ、他は0回。変換すべき12件は4版とも8回中8回、96件中96件が正解だった。">
