<rect class="bg" x="0" y="0" width="720" height="420"/>
<text class="t-strong" x="18" y="26">「先月比」だけは、版を変えても誤変換が消えなかった</text>
<text class="t-sm" x="18" y="45">引き継ぎメモ20行（変換すべき日付12件＋触ってはいけない語8件）に、指示文を4版・各2回＝8回、独立したプロセスに送った。</text>
<text class="t-sm" x="18" y="64">版a＝そのまま。版b＝＋「先週/来月まで/最近を禁止」（記事の推奨そのまま）。</text>
<text class="t-sm" x="18" y="83">版c＝＋基準日と〔基準日不明〕の逃げ道。版d＝＋「○○比は残せ」を明記。</text>
<text class="t-sm" x="18" y="102">セルの数＝誤って絶対日付に書き換えた回数（2回中）。0が誤変換なし。</text>
<text class="t-sm" x="18" y="121">※ 変換すべき12件は4版とも8回中8回、96／96件が正解だった（別枠）。</text>
