<svg xmlns="http://www.w3.org/2000/svg" width="720" height="376" viewBox="0 0 720 376" role="img" aria-label="出す形と、直すか直さないかの方針まで指示文に書いたうえで、同じ指示文を2回ずつ通し、1回目と2回目の違いを機械で突き合わせた横棒グラフ。見出しの名前と並び順、表の列は、どちらの文字起こしでも2回とも完全に一致した。整えたテキストの本文では、1本目は29行のうち違ったのが1行、2本目は31行のうち違った行が0行だった。違った1行は、つなぎ語のあー、が片方の回にだけ残ったもので、発言そのものの書き換えは2本とも0行だった。一方、要確認の表にはブレが残り、1本目は9行のうち1行が片方の回にしか出ず、消えたのは、稼働から6か月と書いてあったはずです、を音源で確かめる、という行だった。2本目は7行で行数も中身も一致したが、担当者名の行だけ、種類の欄が音源で確かめると話の中の食い違いに割れた。そろうのは本文のほうが先で、最後まで残るのは要確認の表のブレである。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="376"/>
<text class="t-strong" x="18" y="26">形も方針も固定したあとに、それでも残ったブレ</text>
<text class="t-sm" x="18" y="45">同じ指示文を2回ずつ通して、1回目と2回目を機械で突き合わせた（灰色＝全体、色つき＝違った数）。</text>
<text class="t-xs" x="296" y="78">見出しの名前・並び順・表の列は、どちらの本でも2回とも完全に一致した。</text>
<text class="t-accent" x="18" y="124">整えたテキスト（本文）</text>
<text class="t-sm" x="18" y="157">1本目・29行のうち違った行</text>
<rect class="bar-old" x="296" y="142" width="296" height="20" rx="3" opacity="0.35"/>
<rect class="bar-out" x="296" y="142" width="10.2" height="20" rx="3"/>
<text class="t-bad" x="604" y="157">1 / 29</text>
<text class="t-sm" x="18" y="193">2本目・31行のうち違った行</text>
<rect class="bar-old" x="296" y="178" width="296" height="20" rx="3" opacity="0.35"/>
<text class="t-good" x="604" y="193">0 / 31</text>
<text class="t-accent" x="18" y="226">要確認の表</text>
<text class="t-sm" x="18" y="259">1本目・片方にしか無かった行</text>
<rect class="bar-old" x="296" y="244" width="296" height="20" rx="3" opacity="0.35"/>
<rect class="bar-out" x="296" y="244" width="32.9" height="20" rx="3"/>
<text class="t-bad" x="604" y="259">1 / 9</text>
<text class="t-sm" x="18" y="295">2本目・種類の欄が食い違った行</text>
<rect class="bar-old" x="296" y="280" width="296" height="20" rx="3" opacity="0.35"/>
<rect class="bar-out" x="296" y="280" width="42.3" height="20" rx="3"/>
<text class="t-bad" x="604" y="295">1 / 7</text>
<text class="t-xs" x="18" y="330">※ 1本目で消えた1行＝「稼働から6か月と書いてあったはずです／音源で確かめる」。残り8行は2回とも同じだった。</text>
<text class="t-xs" x="18" y="348">※ 2本目は行数も中身も一致したが、担当者名の行だけ種類が「音源で確かめる」と「話の中の食い違い」に割れた。</text>
<text class="t-xs" x="18" y="366">※ 本文で違った1行は、つなぎ語の「あー、」が片方に残っただけ。発言そのものの書き換えは、2本とも0行。</text>
</svg>
