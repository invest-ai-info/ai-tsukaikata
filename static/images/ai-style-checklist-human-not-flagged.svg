<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img" aria-label="AI文体チェックリストで、人間の文章を「AIらしい」と誤判定した回数を示す表。単体で見せて根拠も書かせた場合は9回中0回、単体で一言だけ強制した場合は15回中0回、本物のAI文章と並べて比べた場合は14回中0回だった。下の枠には、箇条書き・誤字なしという表面的な特徴だけでは人間の文章は誤判定されなかったこと、材料は300字前後の短い業務報告4パターンで長文・創作的な文章では未確認であることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="272"/>
<text class="t-strong" x="18" y="26">人間の文章を「AIらしい」と誤判定した回数は、38回中0回だった</text>
<text class="t-sm" x="18" y="45">実測2026-11-04。架空の業務報告4本に、箇条書き・誤字なし・エピソード不足・定型の結びの4項目を当てた。</text>
<text class="t-sm" x="18" y="64">単体（根拠あり）・単体（一言強制）・2つを比べる、の3つの見せ方いずれでも誤判定は0回。</text>
<text class="t-xs" x="458.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">単体で見せて根拠も書かせた場合</text>
<rect class="box-good" x="378" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="125" text-anchor="middle" style="font-weight:700">0/9</text>
<text class="t" x="18" y="157">単体で見せて一言だけ強制した場合</text>
<rect class="box-good" x="378" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="157" text-anchor="middle" style="font-weight:700">0/15</text>
<text class="t" x="18" y="189">本物のAI文章と並べて比べた場合</text>
<rect class="box-good" x="378" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="189" text-anchor="middle" style="font-weight:700">0/14</text>
<rect class="box-accent" x="18" y="206" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="226">箇条書き・誤字なしという表面的な特徴だけでは、人間の文章は誤判定されなかった。</text>
<text class="t-accent" x="34" y="244">材料は300字前後の短い業務報告4パターン。長文・創作的な文章では未確認。</text>
</svg>
