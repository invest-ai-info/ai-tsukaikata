<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" role="img" aria-label="「判断の根拠にしたページのURLも書いて」と頼んだ2回の返りで出てきた、計5件のURLの内訳を示す図。①answer/72851(1回目)は実在するがYPP資格要件の概要ページで反復コンテンツの規定ではない。②answer/6162278(1回目)は実在するが広告掲載ガイドラインのページで無関係。③answer/9997383(2回目)はURLが存在せず404で、回答は「本件の直接の根拠」と説明していた。④answer/1311392(2回目)は実在し、実際に量産型のコンテンツの規定が書かれている正しいページ。⑤answer/6162278(2回目)は実在するが①②と同じ広告掲載ガイドラインのページで無関係。下の枠には、5件のうち実在してかつ内容も一致していたのは④の1件だけで、③は存在しないURL、①②⑤は実在するが別の話題のページだったことが書かれている。">
<style>
