</style>
<rect class="bg" x="0" y="0" width="720" height="448"/>
<text class="t-strong" x="18" y="26">出典URLを求めた2回・計5件のうち、内容まで合っていたのは1件</text>
<text class="t-sm" x="18" y="45">「理由と、判断の根拠にしたページのURLも書いて」に対する返り（架空チャンネルS2・原文なし）。</text>
<text class="t-sm" x="18" y="64">HTTPステータスは全件curlで確認。ステータスが200でも、書いてある内容が違う・存在しないURLがある。</text>
<text class="t-xs" x="18" y="83">実在するかどうかだけではリンク切れ検査は通ってしまう＝開いて中身を読むしかない。</text>
<rect class="box-bad" x="18" y="108" width="684" height="44" rx="6"/>
<text class="t-strong" x="34" y="128">① answer/72851（1回目の回答）</text>
<text class="t-bad" x="34" y="146">実在するが、YPP資格要件の概要ページ（反復コンテンツの規定ではない）</text>
<rect class="box-bad" x="18" y="162" width="684" height="44" rx="6"/>
<text class="t-strong" x="34" y="182">② answer/6162278（1回目の回答）</text>
<text class="t-bad" x="34" y="200">実在するが、広告掲載ガイドラインのページ（無関係）</text>
<rect class="box-bad" x="18" y="216" width="684" height="44" rx="6"/>
<text class="t-strong" x="34" y="236">③ answer/9997383（2回目の回答）</text>
<text class="t-bad" x="34" y="254">URLが存在しない（404）。「本件の直接の根拠」と説明していた</text>
<rect class="box-good" x="18" y="270" width="684" height="44" rx="6"/>
<text class="t-strong" x="34" y="290">④ answer/1311392（2回目の回答）</text>
<text class="t-good" x="34" y="308">実在し、実際に「量産型のコンテンツ」の規定が書かれている正しいページ</text>
<rect class="box-bad" x="18" y="324" width="684" height="44" rx="6"/>
<text class="t-strong" x="34" y="344">⑤ answer/6162278（2回目の回答）</text>
<text class="t-bad" x="34" y="362">実在するが、広告掲載ガイドラインのページ（①②と同じ無関係ページ）</text>
<rect class="box-accent" x="18" y="384" width="684" height="44" rx="6"/>
<text class="t-accent" x="34" y="404">5件のうち、実在してかつ内容も一致していたのは④の1件だけ。</text>
<text class="t-accent" x="34" y="422">③は存在しないURL、①②⑤は実在するが別の話題のページだった。</text>
</svg>
