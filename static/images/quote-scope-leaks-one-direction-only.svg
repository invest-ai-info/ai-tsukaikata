<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244" role="img" aria-label="見積書の含む作業・除外事項という対で、片方だけを聞いたときにもう片方へ触れた回数を、2つの向きで比べた図。「含まれる作業を挙げて」と聞いた6回のうち5回は、聞いていない除外事項に触れた。「含まれない作業（除外事項）を挙げて」と聞いた6回のうち、含む作業に触れたのは1回だけで、しかもその1回も全項目ではなく一部だけだった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="244"/>
<text class="t-strong" x="18" y="24">「含む」を聞くと漏れる。「除外」を聞いても漏れない</text>
<text class="t-sm" x="18" y="43">見積書の「含む作業」と「除外事項」という対で、片方だけを名指しして聞いたとき、もう片方に触れた回数（材料2本×各3回＝6回）。</text>
<text class="t-sm" x="18" y="62">「除外」を聞いた6回のうち触れたのは1回だけで、しかも5件中1件のみだった。</text>
<text class="t-xs" x="460.0" y="112">満点=6</text>
<text class="t" x="18" y="138">「含む」を聞く→除外に触れた</text>
<rect class="box-quiet" x="300.0" y="125" width="180.0" height="18" rx="3"/>
<rect class="box-bad" x="300.0" y="125" width="150.0" height="18" rx="3"/>
<text class="t-bad" x="492.0" y="138">5/6</text>
<text class="t" x="18" y="174">「除外」を聞く→含むに触れた</text>
<rect class="box-quiet" x="300.0" y="161" width="180.0" height="18" rx="3"/>
<rect class="box-good" x="300.0" y="161" width="30.0" height="18" rx="3"/>
<text class="t-accent" x="492.0" y="174">1/6</text>
<path class="line" d="M480.0 116 L480.0 176" stroke-dasharray="4 3"/>
<text class="t-sm" x="18" y="202">※ 対照（両方を名指しして聞く）は6回とも過不足なくそろった（本文）。</text>
<text class="t-xs" x="18" y="221">架空データでの実測。生の返りはdocs/evidence/に全文置いてある。</text>
</svg>
