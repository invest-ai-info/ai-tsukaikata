<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-label="受信箱の未読をAIに渡して3つに仕分ける図。A＝返信しないと相手が止まるもの（可否の回答待ち、実装が止まっている問い合わせ）。B＝返信は要らないが自分の作業があるもの（経費精算、回答期限つきの社内アンケート）。「返信が要るものだけ」と頼むとBが落ちる。C＝読むだけでよいもの（返信は不要ですと本文に書いてある周知、メールマガジン）。AとBの両方に当てはまる1通は、急ぐほうに入れてもう片方を同じ行に書かせる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="364"/>
<text class="t-strong" x="18" y="26">受信箱は「返信が要る／要らない」の2つでは仕分けられない</text>
<text class="t-sm" x="18" y="45">返信は不要でも締切のある作業は残ります。3つに分けると、そこが消えません。</text>
<rect class="box-quiet" x="18" y="169" width="168" height="70" rx="6"/>
<text class="t" x="34" y="197">受信箱の未読</text>
<text class="t-sm" x="34" y="219">まとめて貼って渡す</text>
<rect class="box-accent" x="300" y="90" width="402" height="64" rx="6"/>
<text class="t-accent" x="314" y="116">A 返信しないと相手が止まる</text>
<text class="t-sm" x="314" y="137">可否の回答待ち・実装が止まっている問い合わせ</text>
<line class="line" x1="194" y1="204" x2="286" y2="122"/>
<path d="M286 118 L293 122 L286 126 Z" fill="#8b949e"/>
<rect class="box-bad" x="300" y="172" width="402" height="64" rx="6"/>
<text class="t-bad" x="314" y="198">B 返信は要らないが、自分の作業がある</text>
<text class="t-sm" x="314" y="219">経費精算・回答期限つきの社内アンケート ← 2分類だとここが落ちる</text>
<line class="line" x1="194" y1="204" x2="286" y2="204"/>
<path d="M286 200 L293 204 L286 208 Z" fill="#8b949e"/>
<rect class="box-quiet" x="300" y="254" width="402" height="64" rx="6"/>
<text class="t" x="314" y="280">C 読むだけでよい</text>
<text class="t-sm" x="314" y="301">「返信は不要です」と本文に書いてある周知・メールマガジン</text>
<line class="line" x1="194" y1="204" x2="286" y2="286"/>
<path d="M286 282 L293 286 L286 290 Z" fill="#8b949e"/>
<text class="t-xs" x="18" y="352">※ どちらにも当てはまる1通があります（返信もするし、社内の登録変更も要る）。急ぐほうに入れて、もう片方を同じ行に書かせます。</text>
</svg>
