<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-label="毎日の追記を同じ指示文のまま50回転させた結果を示す横棒グラフ。架空の記録2本×各2回＝4系列×50回＝200回。形（区切り記号・日付のケタ・末尾の単位）が規定どおりだった回は200回中200回で、10回目でも50回目でも崩れていない。ところが「本日◯◯、所要◯分でした」のように走り書きが日付を書かない日だけ、追記された日付の値がファイルの続きの日ではなく、呼び出した実際の日（2026-10-09）に化けた。この「本日」の走り書きは46回あり、意図した日付になった回は直す前は46回中0回だった。指示文に「実際の今日の日付ではなく、ファイルの続きの日付を使ってください」と1行足すと、6回中6回とも意図した日付に直った。">
