<rect class="bg" x="0" y="0" width="720" height="440"/>
<text class="t-strong" x="18" y="26">形は50回転でも崩れない。でも「本日」と書いた日だけ、日付が実日付に化ける</text>
<text class="t-sm" x="18" y="45">毎日の追記を同じ指示文のまま50回転させた（架空の記録2本×各2回＝4系列×50回＝200回）。</text>
<text class="t-sm" x="18" y="64">区切り記号・日付のケタ・末尾の単位は200回とも規定どおり。ところが走り書きが</text>
<text class="t-sm" x="18" y="83">「本日◯◯、所要◯分でした」のように日付を書かない日だけ、追記された日付の値が</text>
<text class="t-sm" x="18" y="102">ファイルの続きの日ではなく、呼び出した実際の日（2026-10-09）になった。</text>
<text class="t" x="18" y="164">形（区切り・単位・日付の</text>
<text class="t" x="18" y="181">ケタ）が規定どおりだった回</text>
<rect class="bar-out" x="420" y="187" width="190" height="20" rx="3"/>
<text class="t-good" x="618" y="202">200/200回</text>
<text class="t" x="18" y="221">「本日」と書いた日の日付が、</text>
<text class="t" x="18" y="238">意図した日になった回（直す前）</text>
<rect class="box-bad" x="420" y="244" width="4" height="20" rx="3"/>
<text class="t-bad" x="432" y="259">0/46回</text>
<text class="t" x="18" y="278">同じ「本日」の回、</text>
<text class="t" x="18" y="295">指示文に1行足した後</text>
<rect class="bar-out" x="420" y="301" width="190" height="20" rx="3"/>
<text class="t-good" x="618" y="316">6/6回</text>
<text class="t-good" x="18" y="335">※ 形だけを見れば、10回目でも50回目でも何も崩れていない（200/200）。</text>
<text class="t-bad" x="18" y="356">🚨 だが日付の値は違う。「本日」という走り書きが46回あり、46回とも壁時計の実日付になった。</text>
<text class="t-bad" x="18" y="377">   ファイルの続きとしては2026-08-04や2026-09-18のはずの行が、すべて2026-10-09になった。</text>
<text class="t-good" x="18" y="398">※ 直し方＝「実際の今日の日付ではなく、ファイルの続きの日付を使ってください」を1行足すと6/6で直った。</text>
<text class="t-xs" x="18" y="419">架空データでの実測（追記200回＋単発確認6回＋言い直し後6回＝全212回）。生の返りは docs/evidence/ に置いてある。</text>
</svg>
