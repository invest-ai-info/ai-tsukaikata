<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="10分23秒の長尺材料で、4つの聞き方（素朴・前後分割・数値に注意・2段階リスト化）の前半8件・後半8件それぞれの検出数を並べた図。素朴は前半10/40(25%)・後半12/40(30%)。前後分割は前半13/24(54%)・後半8/24(33%)。数値に注意は前半15/24(62.5%)・後半12/24(50%)。2段階リスト化（今回）は前半9/24(37.5%)・後半7/24(29.2%)。下の枠には、2段階リスト化は前半25%→37.5%・後半30%→29.2%で前半だけ少し伸びるが分割や数値に注意には届かないこと、短尺材料の先行記事とほぼ同じ伸び幅で長さを変えても順位は変わらなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="450"/>
<text class="t-strong" x="18" y="26">2段階リスト化は、素朴より少し上がるが「数値に注意して」には届かない</text>
<text class="t-sm" x="18" y="45">同じ長尺材料（10分23秒・仕込み16件）で、4つの聞き方の前半8件・後半8件それぞれの検出数。</text>
<text class="t-sm" x="18" y="64">2段階リスト化（今回）は前半9/24・後半7/24。先行記事の素朴・分割・数値に注意と並べた。</text>
<text class="t-xs" x="378.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">素朴に通しで聞く・前半8件</text>
<rect class="box" x="298" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="378.0" y="125" text-anchor="middle" style="font-weight:700">10/40</text>
<text class="t" x="18" y="157">素朴に通しで聞く・後半8件</text>
<rect class="box" x="298" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="378.0" y="157" text-anchor="middle" style="font-weight:700">12/40</text>
<text class="t" x="18" y="189">前半だけ分けて聞く・前半8件</text>
<rect class="box" x="298" y="168" width="160" height="26" rx="4"/>
<text class="t-sm" x="378.0" y="189" text-anchor="middle" style="font-weight:700">13/24</text>
<text class="t" x="18" y="221">後半だけ分けて聞く・後半8件</text>
<rect class="box" x="298" y="200" width="160" height="26" rx="4"/>
<text class="t-sm" x="378.0" y="221" text-anchor="middle" style="font-weight:700">8/24</text>
<text class="t" x="18" y="253">通しで「数値に注意して」・前半8件</text>
<rect class="box" x="298" y="232" width="160" height="26" rx="4"/>
<text class="t-sm" x="378.0" y="253" text-anchor="middle" style="font-weight:700">15/24</text>
<text class="t" x="18" y="285">通しで「数値に注意して」・後半8件</text>
<rect class="box" x="298" y="264" width="160" height="26" rx="4"/>
<text class="t-sm" x="378.0" y="285" text-anchor="middle" style="font-weight:700">12/24</text>
<text class="t" x="18" y="317">2段階リスト化（今回）・前半8件</text>
<rect class="box" x="298" y="296" width="160" height="26" rx="4"/>
<text class="t-sm" x="378.0" y="317" text-anchor="middle" style="font-weight:700">9/24</text>
<text class="t" x="18" y="349">2段階リスト化（今回）・後半8件</text>
<rect class="box" x="298" y="328" width="160" height="26" rx="4"/>
<text class="t-sm" x="378.0" y="349" text-anchor="middle" style="font-weight:700">7/24</text>
<rect class="box-accent" x="18" y="366" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="386">2段階リスト化は前半25%→37.5%・後半30%→29.2%。前半だけ少し伸びる。</text>
<text class="t-accent" x="34" y="404">分割（54%）や数値に注意（62.5%）には届かない。</text>
<text class="t-accent" x="34" y="422">短尺材料の先行記事（28.75%→36.25%）とほぼ同じ伸び幅。長さを変えても順位は変わらなかった。</text>
</svg>
