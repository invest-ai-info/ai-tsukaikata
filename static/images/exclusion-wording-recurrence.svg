<svg xmlns="http://www.w3.org/2000/svg" width="720" height="343" viewBox="0 0 720 343" role="img" aria-label="除外の書き方によって、来年また起きた同種の誤報を鳴らしてしまうかどうかが分かれたことを示す図。系列A（一般化型の除外・取引先と商品で条件を書いた）は、金額だけ違う来年の同種注文を2回とも鳴らさなかった。系列B（行specific型の除外・受注ID・金額などの具体的な値を指定した）は、同じ来年の同種注文を2回ともまた異常として鳴らしてしまった。系列Bに「金額や日付が変わっても再発しないように」という一文を足して直させた版は、4回とも鳴らなかった。「鳴った」は誤報そのものが起きたのではなく、正当な注文がまた異常として報告されたことを意味する。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="343"/>
<text class="t-strong" x="18" y="26">除外の書き方で、来年また起きた同種の誤報を鳴らすかが分かれた</text>
<text class="t-sm" x="18" y="45">週4時点の最終ルールに、金額だけ違う「来年の同種注文」を当てた実測。</text>
<text class="t-sm" x="18" y="100">系列A（一般化型の除外）</text>
<rect class="box-good" x="18" y="112" width="400" height="34" rx="4"/>
<text class="t-good" x="30" y="134">来年の再発を鳴らした: 0/2回</text>
<text class="t-sm" x="18" y="160">系列B（行specific型の除外）</text>
<rect class="box-bad" x="18" y="172" width="400" height="34" rx="4"/>
<text class="t-bad" x="30" y="194">来年の再発を鳴らした: 2/2回</text>
<text class="t-sm" x="18" y="220">系列Bに「金額や日付が変わっても</text>
<text class="t-sm" x="18" y="235">再発しないように」を足した版</text>
<rect class="box-good" x="18" y="247" width="400" height="34" rx="4"/>
<text class="t-good" x="30" y="269">来年の再発を鳴らした: 0/4回</text>
<text class="t-xs" x="18" y="319">※「鳴った」は誤報が再発したのではなく、正当な注文がまた異常として報告されたこと。</text>
</svg>
