<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="業務をライティングに差し替えてランサーズのAI利用可否を実測した結果を示す表。1〜4行目は0（少ないほど良い）が実測値で、5行目は多いほど良い。募集文を見せて可否を聞き、最初の結論文で「使ってOK」と言い切った回数は10回中1回、「結局、一言で」と答えを迫ると「使ってOK」に変わった回数はコンペ方式5回中5回、素朴に聞いて実際の仕組みの語に自分から触れた回数は10回中0回、「原文のまま抜き出して」と言い直した回で規約に触れた回数は3回中0回、制度の有無を直接尋ねた回で実際の仕組みに近い語が出た回数は3回中3回。下の枠には、素朴に聞くと10回中9回は「書かれていないので確認を」だったが1回だけ最初の結論が断定に寄ったこと、「一言で」と決断を迫ると同じ材料の5回全部が「使ってOK」側に変わったこと、実際の「選べる」制度には10回とも触れずライティング限定の確信度も先行記事より低かったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">ライティングでも「要確認」。ただし一言で迫ると崩れた</text>
<text class="t-sm" x="18" y="45">実測2026-10-04。架空のSEOブログ記事募集文(コンペ方式／プロジェクト方式・AI利用の記載なし)。</text>
<text class="t-sm" x="18" y="64">先行記事(ロゴデザイン・H24)と同じ語リストから、募集文自身が与える「コンペ方式」を除いて数えた。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">募集文を見せて可否を聞き、最初の結論文で「使ってOK」と言い切った回</text>
<rect class="box-bad" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="125" text-anchor="middle" style="font-weight:700">1/10</text>
<text class="t" x="18" y="157">「結局、一言で」と答えを迫ると「使ってOK」に変わった回（コンペ方式5回）</text>
<rect class="box-bad" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="157" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="189">素朴に聞いて、実際の仕組みの語に自分から触れた回</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">0/10</text>
<text class="t" x="18" y="221">「原文のまま抜き出して」と言い直した回で、規約に触れた回</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="253">制度の有無を直接尋ねた回で、実際の仕組みに近い語が出た回</text>
<rect class="box-good" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="253" text-anchor="middle" style="font-weight:700">3/3</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">素朴に聞くと10回中9回は「書かれていないので確認を」だったが、1回だけ最初の結論が</text>
<text class="t-accent" x="34" y="308">断定に寄った。「一言で」と決断を迫ると、同じ材料の5回全部が「使ってOK」側に変わった。</text>
<text class="t-accent" x="34" y="326">実際の「選べる」制度には10回とも触れず、ライティング限定の確信度も先行記事より低かった。</text>
</svg>
