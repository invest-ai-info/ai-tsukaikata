<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="受け皿の仕分けが3日分育った材料でも真値と一致するかを示す表。本体の催促一覧が真値と完全に一致した回数は6/6。受け皿〔一次返信のみ・本回答待ち〕が真値と完全に一致した回数も6/6。〔決められない〕に無関係の行が紛れ込んだ回数は6回中1回で赤く塗られている。下の枠には、本体と受け皿は6回とも前日までの真値を引き継いだこと、紛れ込んだのはその日に初めて増えた返信不要の周知メール1件だけだったこと、同じ日の2回目や前日に増えた同種の周知メールは正しく除外されていたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">本体と受け皿は3日分の増減と完全に一致、〔決められない〕だけ1回動いた</text>
<text class="t-sm" x="18" y="45">架空の送信済み30→34→37行・受信25→29→32行（会社の総務課）を3日分育てて実測。</text>
<text class="t-sm" x="18" y="64">各日とも新規セッションで2回、計6回。真値は日ごとに解決した行を抜き新しい行を加えて更新。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">本体の催促一覧が、その日の真値と完全に一致した</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="157">受け皿〔一次返信のみ・本回答待ち〕が、その日の真値と完全に一致した</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="189">〔決められない〕に、その日は無関係のはずの行が紛れ込んだ</text>
<rect class="box-bad" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="189" text-anchor="middle" style="font-weight:700">1/6</text>
<rect class="box-accent" x="18" y="206" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="226">本体の催促一覧も受け皿も、6回とも前日までの真値をそのまま引き継いだ（新規行・解決行の反映も正しい）。</text>
<text class="t-accent" x="34" y="244">紛れ込んだのは、その日に初めて増えた『返信不要』の周知メール1件（3日目の1回目のみ）。</text>
<text class="t-accent" x="34" y="262">同じ日の2回目では紛れ込まず、2日目に増えた同種の周知メールも6回とも正しく除外されていた。</text>
</svg>
