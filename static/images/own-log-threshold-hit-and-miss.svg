<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" role="img" aria-label="3つの指示文それぞれについて、材料A（真に4日間停止）の停止を見逃した回数と、材料B（対照・何も起きていない）を誤って異常と判定した回数を、2回中の件数で示した横棒グラフ。①名目24回を基準にした版は、材料Aの見逃しが2/2、材料Bの誤報も2/2で、どちらも赤い棒。②基準を渡さず自由記述で聞いた版は、見逃し0/2・誤報0/2。③自分の記録から目安を計算させた版も、見逃し0/2・誤報0/2で、どちらも緑の棒。下の枠には、①は材料A・Bどちらでも『ほぼ全日が異常』という同じ形の答えを返し真の停止日を名指しできなかったこと、②③は答えの中身が材料によって変わり本当に止まった4日間だけを正しく区別したことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="432"/>
<text class="t-strong" x="18" y="24">名目24回を基準にした版だけが、見逃しも誤報も2回中2回だった</text>
<text class="t-sm" x="18" y="43">架空の実行ログ2本（材料A＝真に4日間停止／材料B＝対照・何も起きていない）に</text>
<text class="t-sm" x="18" y="62">3つの指示文を各2回・計12回試した。縦軸は2回中の件数。</text>
<text class="t-xs" x="18" y="81">見逃し＝材料Aの停止日を名指しできなかった回数。誤報＝材料Bを異常と判定した回数。</text>
<text class="t-strong" x="18" y="132">①名目24回が基準</text>
<text class="t" x="28" y="164">材料Aの見逃し</text>
<rect class="box-quiet" x="300.0" y="154" width="160.0" height="14" rx="3"/>
<rect class="box-bad" x="300.0" y="154" width="160.0" height="14" rx="3"/>
<text class="t-bad" x="472.0" y="164">2/2</text>
<text class="t" x="28" y="188">材料Bの誤報</text>
<rect class="box-quiet" x="300.0" y="178" width="160.0" height="14" rx="3"/>
<rect class="box-bad" x="300.0" y="178" width="160.0" height="14" rx="3"/>
<text class="t-bad" x="472.0" y="188">2/2</text>
<text class="t-strong" x="18" y="208">②基準を渡さない</text>
<text class="t" x="28" y="240">材料Aの見逃し</text>
<rect class="box-quiet" x="300.0" y="230" width="160.0" height="14" rx="3"/>
<rect class="box-good" x="300.0" y="230" width="3.0" height="14" rx="3"/>
<text class="t-accent" x="472.0" y="240">0/2</text>
<text class="t" x="28" y="264">材料Bの誤報</text>
<rect class="box-quiet" x="300.0" y="254" width="160.0" height="14" rx="3"/>
<rect class="box-good" x="300.0" y="254" width="3.0" height="14" rx="3"/>
<text class="t-accent" x="472.0" y="264">0/2</text>
<text class="t-strong" x="18" y="284">③自分の記録から目安を計算</text>
<text class="t" x="28" y="316">材料Aの見逃し</text>
<rect class="box-quiet" x="300.0" y="306" width="160.0" height="14" rx="3"/>
<rect class="box-good" x="300.0" y="306" width="3.0" height="14" rx="3"/>
<text class="t-accent" x="472.0" y="316">0/2</text>
<text class="t" x="28" y="340">材料Bの誤報</text>
<rect class="box-quiet" x="300.0" y="330" width="160.0" height="14" rx="3"/>
<rect class="box-good" x="300.0" y="330" width="3.0" height="14" rx="3"/>
<text class="t-accent" x="472.0" y="340">0/2</text>
<path class="line" d="M300.0 122.0 L300.0 354.0" stroke-dasharray="4 3"/>
<rect class="box-accent" x="18" y="368" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="388">①は材料A・Bどちらでも「ほぼ全日が異常」という同じ形の答えを返し、真の停止日を名指しできなかった。</text>
<text class="t-accent" x="34" y="406">②③は答えの中身が材料によって変わり、本当に止まった4日間だけを正しく区別した。</text>
</svg>
