<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" role="img" aria-label="校正で申告された変更件数と、実際の差分を比べた図。AIが「直した箇所」として申告したのは7件だったが、原文と突き合わせると実際には13件が変わっていた。申告に載らなかった6件は、行って下さい、本件、別紙、稟議、期限厳守。、お問い合わせいただけますよう、で、守りたかった社内用語と体言止めがすべてここに入っていた。一覧に出るのは直したと自覚したものだけで、良くしたつもりの書き換えは申告に出てこない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="432"/>
<text class="t-strong" x="18" y="26">「直した箇所」の申告は7件。実際に変わっていたのは13件</text>
<text class="t-sm" x="18" y="45">同じ1回の校正について、申告した一覧と、原文との差分を突き合わせた。</text>
<text class="t-sm" x="18" y="119">AIの申告</text>
<rect class="box-accent" x="150" y="92" width="238" height="44" rx="6"/>
<text class="t-accent" x="398" y="119">7件</text>
<text class="t-sm" x="18" y="181">実際の差分</text>
<rect class="box-bad" x="150" y="154" width="442" height="44" rx="6"/>
<text class="t-bad" x="602" y="181">13件</text>
<text class="t-bad" x="18" y="218">申告に載らなかった6件（守りたかった語がここに入っていた）</text>
<text class="t-sm" x="34" y="244">・行って下さい</text>
<text class="t-sm" x="34" y="270">・本件</text>
<text class="t-sm" x="34" y="296">・別紙</text>
<text class="t-sm" x="34" y="322">・稟議</text>
<text class="t-sm" x="34" y="348">・期限厳守。</text>
<text class="t-sm" x="34" y="374">・お問い合わせいただけますよう</text>
<text class="t-xs" x="18" y="418">※ 一覧に出るのは「直した」と自覚したものだけ。良くしたつもりの書き換えは、本人の申告に出てこない。</text>
</svg>
