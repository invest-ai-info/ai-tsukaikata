<svg xmlns="http://www.w3.org/2000/svg" width="720" height="454" viewBox="0 0 720 454" role="img" aria-label="材料点検・0件警告・種類の内訳の3つの役目が、各条件で何回中何回正しく出たかを示す表。材料点検（5項目）が崩れなかったかは統合後の材料A・B合計4回中4回。0件警告が当たったかは、材料Aの2項目のリストで2回中2回、材料Bの統合版で2回中0回、材料Bの単独の指示文でも2回中0回。素朴な言い直し後の材料Bでは0件警告が2回中2回で直ったが、種類の内訳が消えずに出たかは2回中0回に落ちた。数えた種類に限らず全種類をもれなく挙げ直す一文を足した最終形では、0件警告と内訳が両方残ったかが材料A・B合計4回中4回。下の枠には、材料点検は統合しても崩れなかったこと、0件警告は見出しのある材料では常に当たり見出しの無い材料では外れたこと、素朴な言い直しは0件警告を直したが内訳を消したこと、両方を残すには全種類をもれなく挙げ直す一文が要ったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="454"/>
<text class="t-strong" x="18" y="26">材料点検は崩れなかった。0件警告だけが材料Bで外れ、言い直すと内訳が消えた</text>
<text class="t-sm" x="18" y="45">実測2026-10-06。材料点検（5項目）・0件警告・種類の内訳の3役を、まとめた指示文と単独の指示文で比べた。</text>
<text class="t-sm" x="18" y="64">各行は「正しく出た回数／試した回数」。最後の2行は、素朴な言い直しで0件警告を直した後の結果。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">材料点検（5項目）が崩れなかったか（統合後・A/B計4回）</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="157">0件警告が当たったか（材料A・2項目のリスト）</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="189">0件警告が当たったか（材料B・統合版）</text>
<rect class="box-bad" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="189" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="221">0件警告が当たったか（材料B・単独の指示文）</text>
<rect class="box-bad" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="221" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="253">0件警告が当たったか（素朴な言い直し後・材料B）</text>
<rect class="box-good" x="398" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="253" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="285">種類の内訳が消えずに出たか（素朴な言い直し後・材料B）</text>
<rect class="box-bad" x="398" y="264" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="285" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="317">0件警告と内訳が両方残ったか（最終形・A/B計4回）</text>
<rect class="box-good" x="398" y="296" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="317" text-anchor="middle" style="font-weight:700">4/4</text>
<rect class="box-accent" x="18" y="334" width="684" height="100" rx="6"/>
<text class="t-accent" x="34" y="354">材料点検（5項目）は、統合しても材料A・Bどちらでも崩れなかった（8/8）。</text>
<text class="t-accent" x="34" y="372">0件警告は、見出しのある材料Aでは常に当たり、見出しの無い材料Bでは</text>
<text class="t-accent" x="34" y="390">統合・単独を問わず外れた。素朴な言い直しは0件警告を直したが、</text>
<text class="t-accent" x="34" y="408">代わりに種類の内訳を消した。両方を残すには、数えた種類に限らず</text>
<text class="t-accent" x="34" y="426">全種類をもれなく挙げ直す一文が要った（最終形）。</text>
</svg>
