<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="提案文が募集文に書かれた本当の狙いを拾うかどうかを、狙いの置き方（地の文に織り込む／本題と無関係な追記として切り離す）で比べた表。すべて提案文の本体で本音の語に触れた回数で、多いほど拾えている。材料1（サイトリニューアル）は、狙いが無い対照で0/4、地の文に織り込むと6/6、切り離した追記にすると0/6、切り離した追記に「依頼主が本当に困っていそうなことも考えて」を足すと6/6に戻った。材料2（動画ナレーション）は、対照で0/4、織り込みで4/4、切り離しで3/4、一文を足すと4/4だった。下の枠には、地の文に織り込むと素朴に頼むだけで2つの材料とも満点で拾ったこと、本題と無関係な追記に切り離すと材料1は0/6まで落ちたが材料2は3/4で落ち方は材料によること、一文を足すと切り離した版でも両方とも満点に戻ったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="450"/>
<text class="t-strong" x="18" y="26">本音を拾うかは、拾えるかではなく「置き方」で決まった</text>
<text class="t-sm" x="18" y="45">実測2026-09-22。同じ狙いの一文を、地の文に混ぜるか／切り離した追記にするかだけを振った。</text>
<text class="t-sm" x="18" y="64">すべて「提案文の本体で、本音の語に触れた回数」（多いほど拾えている）。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">材料1：狙いが無い（対照）・素朴に頼む</text>
<rect class="box-bad" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="125" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="157">材料1：狙いを地の文に織り込む・素朴に頼む</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="189">材料1：狙いを切り離した追記にする・素朴に頼む</text>
<rect class="box-bad" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="189" text-anchor="middle" style="font-weight:700">0/6</text>
<text class="t" x="18" y="221">材料1：切り離した追記＋「困っていそうなことも考えて」</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="253">材料2：狙いが無い（対照）・素朴に頼む</text>
<rect class="box-bad" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="253" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="285">材料2：狙いを地の文に織り込む・素朴に頼む</text>
<rect class="box-good" x="478" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="285" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="317">材料2：狙いを切り離した追記にする・素朴に頼む</text>
<rect class="box" x="478" y="296" width="160" height="26" rx="4"/>
<text class="t-sm" x="558.0" y="317" text-anchor="middle" style="font-weight:700">3/4</text>
<text class="t" x="18" y="349">材料2：切り離した追記＋「困っていそうなことも考えて」</text>
<rect class="box-good" x="478" y="328" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="349" text-anchor="middle" style="font-weight:700">4/4</text>
<rect class="box-accent" x="18" y="366" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="386">地の文に織り込むと、素朴に頼むだけで2つの材料とも満点（6/6・4/4）で拾った。</text>
<text class="t-accent" x="34" y="404">本題と無関係な追記に切り離すと、材料1は0/6まで落ちた（材料2は3/4で、落ち方は材料による）。</text>
<text class="t-accent" x="34" y="422">「依頼主が本当に困っていそうなことも考えて」を足すと、切り離した版でも両方とも満点に戻った。</text>
</svg>
