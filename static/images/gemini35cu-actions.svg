<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="3社の画面操作ツールで、1回に呼べる操作の種類の数を比べた横棒グラフ。Geminiのブラウザ環境が20個、Geminiのデスクトップ環境が17個、Anthropicのデスクトップ専用ツールが17個、Geminiのモバイル環境が10個、OpenAIのgpt-5.6のcomputerツールが9個。OpenAIのclickはボタン（左・右・中央）を引数で渡す形なので、右クリックや中央クリックは別の操作として数えていない。Anthropicは画面操作とは別にブラウザ専用のbrowser use toolを持つが、この図には含めていない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="330"/>
<text class="t-strong" x="18" y="26">同じ「画面操作」でも、1回に呼べる操作の数は会社ごとに違う</text>
<text class="t-sm" x="18" y="45">各社のドキュメントに列挙されている操作（クリック・型・スクロール等）の総数です。</text>
<text class="t" x="18" y="104">Gemini（ブラウザ環境）</text>
<rect class="bar-new" x="288" y="88" width="362.0" height="22" rx="3"/>
<text class="t-sm" x="658.0" y="104">20個</text>
<text class="t" x="18" y="140">Gemini（デスクトップ環境）</text>
<rect class="bar-new" x="288" y="124" width="307.7" height="22" rx="3"/>
<text class="t-sm" x="603.7" y="140">17個</text>
<text class="t" x="18" y="176">Anthropic（デスクトップのみ）</text>
<rect class="bar-in" x="288" y="160" width="307.7" height="22" rx="3"/>
<text class="t-sm" x="603.7" y="176">17個</text>
<text class="t" x="18" y="212">Gemini（モバイル環境）</text>
<rect class="bar-new" x="288" y="196" width="181.0" height="22" rx="3"/>
<text class="t-sm" x="477.0" y="212">10個</text>
<text class="t" x="18" y="248">OpenAI（gpt-5.6のcomputerツール）</text>
<rect class="bar-old" x="288" y="232" width="162.9" height="22" rx="3"/>
<text class="t-sm" x="458.9" y="248">9個</text>
<text class="t-xs" x="18" y="284">※ OpenAIのclickは1つの操作にボタン（左/右/中央）を渡す形なので、右クリックや中央クリックのぶんは別の操作として数えていません。</text>
<text class="t-xs" x="18" y="302">※ Anthropicは画面操作（デスクトップ）とは別に、ブラウザ専用の「browser use tool」を別立てで用意しています（この図には含めていません）。</text>
<text class="t-xs" x="18" y="320">※ 操作の粒度が違うので、数が多いほど高性能というわけではありません。</text>
</svg>
