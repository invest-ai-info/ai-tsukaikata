<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-label="同じEC案件の記録（社名・金額・成果数値に「社外秘」と注記）を、許可の有無で比べる図。上段＝許可が無い場合（社外秘の注記のみ）。社名「株式会社オリーブツリー」は「ECサイトを運営する企業様」に抽象化され、契約金額480,000円は記載なし、成果「32%改善」は「明確な改善」に抽象化された。下段＝許可を得たと明記して依頼した場合。社名・金額・成果数値をすべてそのまま記載し、2回中1回は社内限定の数値も許可の範囲に入っているかを確認する一文を添えた。下の枠には、注記「社外秘」は除外の指示が無くても手がかりとして使われたこと、注記を無視してよいと明記すればその指示のほうが優先されたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="370"/>
<text class="t-strong" x="18" y="26">許可の有無だけで、同じ記録の書かれ方が変わった</text>
<text class="t-sm" x="18" y="45">同じEC案件の記録（社名・金額・成果数値に「社外秘」と注記）を2つの頼み方で比べた。</text>
<text class="t-sm" x="18" y="64">指示文自体には「社外秘」「除外」という語を一度も使っていない。</text>
<rect class="box" x="18" y="112" width="684" height="82" rx="6"/>
<text class="t-strong" x="34" y="134">許可が無い（社外秘の注記のみ）</text>
<text class="t" x="34" y="154">社名「株式会社オリーブツリー」→「ECサイトを運営する企業様」に抽象化。</text>
<text class="t" x="34" y="172">契約金額480,000円→記載なし。成果「32%改善」→「明確な改善」に抽象化。</text>
<rect class="box-good" x="18" y="204" width="684" height="82" rx="6"/>
<text class="t-strong" x="34" y="226">許可を得たと明記して依頼</text>
<text class="t-good" x="34" y="246">社名・金額・成果数値をすべてそのまま記載。</text>
<text class="t-good" x="34" y="264">2回中1回は「社内限定の数値も許可の範囲に入っているか」を確認する一文を添えた。</text>
<rect class="box-accent" x="18" y="302" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="322">注記「社外秘」は、除外の指示が無くても手がかりとして使われた。</text>
<text class="t-accent" x="34" y="340">ただし注記を無視してよいと明記すれば、その指示のほうが優先された。</text>
</svg>
