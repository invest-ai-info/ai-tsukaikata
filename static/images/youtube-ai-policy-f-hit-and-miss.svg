<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="Fシナリオ（ニュース記事をAIに読み上げさせるだけの動画）の根拠政策を、正しく「再利用されたコンテンツ」と言い当てた回数を4条件で比べた図。バーは「言い当てた回数／聞いた回数」。6問をまとめて原文なしで聞いた条件は3回中1回。量産型のコンテンツの原文だけを貼った条件は3回中0回で、対象外のFまでその政策の理屈に押し込めて『収益化できない』と判定した。量産型と再利用、両方の原文を貼ってどちらの政策かを名指しさせた条件は3回中3回で正解した。Fだけを単独で、原文なしで『分からなくてよい』と添えて聞いた条件は2回中2回正解した。下の枠には、片方の原文だけ貼ると対象外のFまでその理屈に押し込めて判定したこと、両方の原文を貼ってどちらの政策かを名指しさせると正しく切り分けられたこと、資料を見せなくてもFだけ単独で聞くと正解率が上がったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">Fの根拠を「再利用されたコンテンツ」と正しく言い当てた回数</text>
<text class="t-sm" x="18" y="45">実測2026-09-28。Fは「ニュース記事をAIに読み上げさせるだけ」という場面。</text>
<text class="t-sm" x="18" y="64">量産型のコンテンツ（AI生成の量産）とは別の政策が根拠になる。</text>
<text class="t-xs" x="398.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">6問まとめて・原文なし</text>
<rect class="box" x="318" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="398.0" y="125" text-anchor="middle" style="font-weight:700">1/3</text>
<text class="t" x="18" y="157">量産型の原文だけ貼る</text>
<rect class="box-bad" x="318" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="398.0" y="157" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="189">量産型＋再利用、両方貼る</text>
<rect class="box-good" x="318" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="398.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">Fだけ単独・原文なし・保留可</text>
<rect class="box-good" x="318" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="398.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">片方の原文だけ貼ると、対象外のFまでその理屈に押し込めて『不可』と判定した（0/3）。</text>
<text class="t-accent" x="34" y="276">両方の原文を貼って『どちらの政策か』と名指しさせると、3/3で正しく切り分けられた。</text>
<text class="t-accent" x="34" y="294">資料を見せなくても、Fだけ単独で『分からなくてよい』と添えると2/2で正解した。</text>
</svg>
