<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="Google が自社のモデルカードで比較相手に選んだ4モデルの単価を比べた横棒グラフ。100万トークンあたりのドル。Gemini 3.7 Flash は入力0.75ドル・出力3.75ドル、Claude Sonnet 5 は入力2.00ドル・出力10.00ドル、GPT-5.6 Terra は入力2.00ドル・出力12.00ドル、Muse Spark 1.2 は入力1.25ドル・出力4.25ドル。ただし Gemini の値は2026年12月31日までの導入価格で、2027年1月1日から1.50ドルと7.50ドルになる。GPT-5.6 Terra は短い入力のときの値段。Muse Spark 1.2 だけ提供元の公式ページを確認できていない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">Google が比較相手に選んだ4モデルの単価</text>
<text class="t-sm" x="18" y="45">入力＝薄い色 ／ 出力＝濃い色。100万トークンあたりのドル。</text>
<text class="t" x="18" y="78">Gemini 3.7 Flash</text>
<text class="t-xs" x="178" y="77">入力</text>
<rect class="bar-in" x="210" y="66" width="25.6" height="15" rx="2"/>
<text class="t-sm" x="243.6" y="78">$0.75</text>
<text class="t-xs" x="178" y="97">出力</text>
<rect class="bar-out" x="210" y="86" width="128.1" height="15" rx="2"/>
<text class="t-sm" x="346.1" y="98">$3.75</text>
<text class="t" x="18" y="133">Claude Sonnet 5</text>
<text class="t-xs" x="178" y="132">入力</text>
<rect class="bar-in" x="210" y="121" width="68.3" height="15" rx="2"/>
<text class="t-sm" x="286.3" y="133">$2.00</text>
<text class="t-xs" x="178" y="152">出力</text>
<rect class="bar-out" x="210" y="141" width="341.7" height="15" rx="2"/>
<text class="t-sm" x="559.7" y="153">$10.00</text>
<text class="t" x="18" y="188">GPT-5.6 Terra</text>
<text class="t-xs" x="178" y="187">入力</text>
<rect class="bar-in" x="210" y="176" width="68.3" height="15" rx="2"/>
<text class="t-sm" x="286.3" y="188">$2.00</text>
<text class="t-xs" x="178" y="207">出力</text>
<rect class="bar-out" x="210" y="196" width="410.0" height="15" rx="2"/>
<text class="t-sm" x="628.0" y="208">$12.00</text>
<text class="t" x="18" y="243">Muse Spark 1.2</text>
<text class="t-xs" x="178" y="242">入力</text>
<rect class="bar-in" x="210" y="231" width="42.7" height="15" rx="2"/>
<text class="t-sm" x="260.7" y="243">$1.25</text>
<text class="t-xs" x="178" y="262">出力</text>
<rect class="bar-out" x="210" y="251" width="145.2" height="15" rx="2"/>
<text class="t-sm" x="363.2" y="263">$4.25</text>
<text class="t-xs" x="18" y="306">※ Gemini の $0.75 ／ $3.75 は導入価格です。2027年1月1日から $1.50 ／ $7.50 になります。</text>
<text class="t-xs" x="18" y="324">※ GPT-5.6 Terra は「短い入力」のときの値段です。境目のトークン数は公表されていません。</text>
<text class="t-xs" x="18" y="342">※ Muse Spark 1.2 だけ、提供元の公式ページをこの記事では確認できていません。</text>
</svg>
