<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="長い見本を使った6つの条件で、硬い（のである調）の文末比率を示す表。見本1本（くだけた）だけで書かせた場合は22文中0文（0%）、見本1本（硬い）だけで書かせた場合は20文中17文（85%）、2本同時・くだけた→硬いの順で曖昧に依頼した場合は19文中14文（74%）、2本同時・硬い→くだけたの順で曖昧に依頼した場合は21文中17文（81%）、2本同時で明示的に1つ目（くだけた）だけを使うよう指示した場合は13文中0文（0%）、2本同時で明示的に2つ目（硬い）だけを使うよう指示した場合は14文中11文（79%）。下の枠には、曖昧に頼んだ2条件（74%・81%）は順番を入れ替えても硬い側に近いままであること、くだけた側に寄った回は0回で半分ずつ混ざることは6条件・計112文のどこにも起きなかったこと、見本1本だけの条件どうしでも対称な結果になったことが書かれている。">
