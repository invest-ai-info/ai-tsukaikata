<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">2本同時に渡し「この文体で」と頼むと、常に硬い側に偏る</text>
<text class="t-sm" x="18" y="45">実測2026-10-23。長い見本（約850字）1本・2本同時（曖昧／明示）の6条件。claude -pの独立実行。</text>
<text class="t-sm" x="18" y="64">硬い（のである調）の文末比率。0%の2行は、くだけた見本だけを使った条件。</text>
<text class="t-xs" x="538.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">見本1本（くだけた）だけで書かせた（3回・22文）</text>
<rect class="box-bad" x="458" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="538.0" y="125" text-anchor="middle" style="font-weight:700">0/22</text>
<text class="t" x="18" y="157">見本1本（硬い）だけで書かせた（3回・20文）</text>
<rect class="box" x="458" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="538.0" y="157" text-anchor="middle" style="font-weight:700">17/20</text>
<text class="t" x="18" y="189">2本同時・くだけた→硬いの順・曖昧に依頼（3回・19文）</text>
<rect class="box" x="458" y="168" width="160" height="26" rx="4"/>
<text class="t-sm" x="538.0" y="189" text-anchor="middle" style="font-weight:700">14/19</text>
<text class="t" x="18" y="221">2本同時・硬い→くだけたの順・曖昧に依頼（3回・21文）</text>
<rect class="box" x="458" y="200" width="160" height="26" rx="4"/>
<text class="t-sm" x="538.0" y="221" text-anchor="middle" style="font-weight:700">17/21</text>
<text class="t" x="18" y="253">2本同時・明示で「1つ目だけ」＝くだけた（2回・13文）</text>
<rect class="box-bad" x="458" y="232" width="160" height="26" rx="4"/>
<text class="t-bad" x="538.0" y="253" text-anchor="middle" style="font-weight:700">0/13</text>
<text class="t" x="18" y="285">2本同時・明示で「2つ目だけ」＝硬い（2回・14文）</text>
<rect class="box" x="458" y="264" width="160" height="26" rx="4"/>
<text class="t-sm" x="538.0" y="285" text-anchor="middle" style="font-weight:700">11/14</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">曖昧に頼んだ2条件（74%・81%）は、順番を入れ替えても硬い側（単体85%・明示79%）に近いまま。</text>
<text class="t-accent" x="34" y="340">くだけた側に寄った回は0回。「半分ずつ混ざる」は6条件・計112文のどこにも起きなかった。</text>
<text class="t-accent" x="34" y="358">見本を1本だけ渡した条件どうしでも、くだけたは0%（くだけたのみ）・硬いは85%（硬いのみ）で対称。</text>
</svg>
