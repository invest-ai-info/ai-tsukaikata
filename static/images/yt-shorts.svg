<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Shortsの判定条件の図。60秒以下という判定では取りこぼす。Shortsは最長180秒まで伸びたため、90秒以下ならほぼ確実にShorts、180秒以下でタイトルにハッシュタグが3個以上ならShortsの可能性が高い、タイトルや説明文にshortsのマーカーがあればShorts、の3段で見る。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .box-warn { fill: #fdf6e8; stroke: #d4a72c; stroke-width: 1.3; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13.5px; font-weight: 700; }
  .t-bad { fill: #b02020; font-size: 13px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 13px; font-weight: 700; }
  .t-warn { fill: #8a6100; font-size: 12px; }
  .mono { fill: #1f2328; font-size: 13px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .mono-big { fill: #1f2328; font-size: 21px; font-weight: 700; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .mono-sm { fill: #616b76; font-size: 11px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .line { stroke: #8b949e; stroke-width: 1.4; fill: none; }
  .line-quiet { stroke: #d5dae0; stroke-width: 1; fill: none; }
  .head { fill: #8b949e; }
  .bar { fill: #c8d1da; }
  .bar-hot { fill: #d92b2b; }
  .bar-pick { fill: #1a56b8; }
  .dot-ok { fill: #1a7f37; }
  .dot-skip { fill: #d92b2b; }
  .dot-idle { fill: #c8d1da; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .box-warn { fill: #2b2415; stroke: #a68321; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .t-warn { fill: #e0b644; }
    .mono { fill: #e6e9ec; }
    .mono-big { fill: #e6e9ec; }
    .mono-sm { fill: #9aa4ae; }
    .line { stroke: #6e7781; }
    .line-quiet { stroke: #363c43; }
    .head { fill: #6e7781; }
    .bar { fill: #3a424a; }
    .bar-hot { fill: #f07a7a; }
    .bar-pick { fill: #7ab0ff; }
    .dot-ok { fill: #57ab68; }
    .dot-skip { fill: #f07a7a; }
    .dot-idle { fill: #3a424a; }
  }
</style>

<rect class="bg" x="0" y="0" width="720" height="260" rx="8"/>

<text class="t-strong" x="24" y="34">Shorts を「60秒以下」で判定すると外れる</text>
<text class="t-bad" x="24" y="56">Shorts は最長180秒まで伸びました。60秒で切ると素通りします。</text>

<path class="line-quiet" d="M40 106 H688"/>
<rect class="bar-pick" x="40" y="94" width="140" height="12" rx="2"/>
<rect class="bar" x="180" y="94" width="140" height="12" rx="2"/>
<rect class="box-quiet" x="320" y="94" width="368" height="12" rx="2"/>
<text class="mono-sm" x="36" y="126">0秒</text>
<text class="mono-sm" x="160" y="126">90秒</text>
<text class="mono-sm" x="298" y="126">180秒</text>
<text class="mono-sm" x="640" y="126">それ以上</text>
<text class="t-xs" x="60" y="88">ほぼ確実にShorts</text>
<text class="t-xs" x="196" y="88">条件つきでShorts</text>
<text class="t-xs" x="470" y="88">通常の動画</text>

<rect class="box" x="24" y="144" width="216" height="96" rx="7"/>
<text class="t-strong" x="40" y="168">① 90秒以下</text>
<text class="t-sm" x="40" y="192">ほぼ確実にShorts</text>
<text class="t-sm" x="40" y="214">再生時間はData APIの</text>
<text class="mono-sm" x="40" y="232">contentDetails.duration</text>

<rect class="box" x="252" y="144" width="216" height="96" rx="7"/>
<text class="t-strong" x="268" y="168">② 180秒以下</text>
<text class="t-sm" x="268" y="192">かつタイトルの</text>
<text class="t-sm" x="268" y="214">ハッシュタグが3個以上</text>
<text class="t-sm" x="268" y="234">→ Shortsの可能性が高い</text>

<rect class="box" x="480" y="144" width="216" height="96" rx="7"/>
<text class="t-strong" x="496" y="168">③ マーカー</text>
<text class="t-sm" x="496" y="192">タイトルや説明文に</text>
<text class="mono-sm" x="496" y="214">#shorts</text>
<text class="t-sm" x="556" y="214">などがある</text>
<text class="t-bad" x="496" y="234">※RSSでは尺が取れない</text>
</svg>
