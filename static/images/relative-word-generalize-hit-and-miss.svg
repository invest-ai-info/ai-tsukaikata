<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="素朴な一般化と、意味で分けた一般化の正答率を比べた表。素朴な一般化で今日・さっき・先ほど・午前中にの4語を合わせて数えると8回中8回で緑、同じ素朴な一般化で昨日だけを数えると2回中1回で黄色。意味で分けた一般化に変えると、昨日を含む5語とも8回中8回で緑。下の枠には、素朴な一般化は今日型の4語には効くが昨日だけ2回中1回しか直らなかったこと、意味で区別する言い方に変えると5語とも8回とも正しくなったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">素朴な一般化は「前日を指す語」だけ2回中1回しか直らなかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-30。架空の作業記録1本に、今日・さっき・先ほど・午前中に・昨日の5語で走り書きを渡した。</text>
<text class="t-sm" x="18" y="64">claude --safe-mode --tools "" の独立プロセスに、2つの一般化した指示文を試した。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">素朴な一般化／今日・さっき・先ほど・午前中に（4語×2回）</text>
<rect class="box-good" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="125" text-anchor="middle" style="font-weight:700">8/8</text>
<text class="t" x="18" y="157">素朴な一般化／昨日（2回）</text>
<rect class="box" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="157" text-anchor="middle" style="font-weight:700">1/2</text>
<text class="t" x="18" y="189">意味で分けた一般化／5語（今日・さっき・先ほど・午前中に・昨日、計8回）</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">8/8</text>
<rect class="box-accent" x="18" y="206" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="226">素朴な一般化（語を列挙せず「相対的な言葉なら続きの日付」）は、今日型の4語は8回とも正しかった。</text>
<text class="t-accent" x="34" y="244">同じ素朴な一般化で「昨日」だけ数えると、2回中1回は他の語と同じ続きの日付になり、前日にならなかった。</text>
<text class="t-accent" x="34" y="262">「今日にあたる語」と「前日にあたる語」を意味で区別する言い方に変えると、昨日を含む5語とも8回中8回で正しくなった。</text>
</svg>
