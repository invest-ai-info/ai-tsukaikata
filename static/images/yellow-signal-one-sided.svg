<svg xmlns="http://www.w3.org/2000/svg" width="720" height="274" viewBox="0 0 720 274" role="img" aria-label="黄信号の受け皿が片側版では拾えず両側版だと正しく拾うことを示す数直線の図。横軸は経過日数マイナス基準日数で、0が基準そのもの。片側版の帯は、マイナス3未満が正常、マイナス3から0未満が黄信号、0以上が異常。系統14（基準を1日だけ超えた境界ケース、真値は正常）はプラス1の位置にあり、片側版では0以上の異常の帯に入ってしまう。両側版の帯は、マイナス3未満が正常、マイナス3からプラス3までが黄信号、プラス3超が異常で、系統14のプラス1の位置は黄信号の帯の中に正しく入る。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="274"/>
<text class="t-strong" x="18" y="26">「黄信号」は片側版では拾えず、両側版だと正しく拾う</text>
<text class="t-sm" x="18" y="45">横軸＝経過日数−基準日数（0が基準そのもの）。系統⑭は基準を+1日だけ超えた、真値が正常の境界ケース。</text>
<text class="t-sm" x="18" y="64">片側版は「基準まであと3日以内」だけを黄信号にするため、超えた側は素通りして異常のままになる。</text>
<text class="t-sm" x="18" y="128.0">片側版</text>
<text class="t-sm" x="18" y="142.0">(基準まで3日以内のみ黄)</text>
<rect class="box-good" x="138.0" y="120" width="122.5" height="28" rx="3"/>
<text class="t-xs" x="199.2" y="138" text-anchor="middle">正常</text>
<rect class="box-accent" x="260.5" y="120" width="122.5" height="28" rx="3"/>
<text class="t-xs" x="321.8" y="138" text-anchor="middle">黄信号</text>
<rect class="box-bad" x="383.0" y="120" width="245.0" height="28" rx="3"/>
<text class="t-xs" x="505.5" y="138" text-anchor="middle">異常</text>
<line class="line" x1="383.0" y1="116" x2="383.0" y2="152"/>
<line class="line" x1="423.8" y1="104" x2="423.8" y2="152"/>
<circle cx="423.8" cy="134.0" r="4.5" fill="#1a56b8"/>
<text class="t-accent" x="423.8" y="100" text-anchor="middle" style="font-size:11px">⑭(+1)</text>
<text class="t-sm" x="18" y="212.0">両側版</text>
<text class="t-sm" x="18" y="226.0">(差が±3日以内は黄)</text>
<rect class="box-good" x="138.0" y="204" width="122.5" height="28" rx="3"/>
<text class="t-xs" x="199.2" y="222" text-anchor="middle">正常</text>
<rect class="box-accent" x="260.5" y="204" width="245.0" height="28" rx="3"/>
<text class="t-xs" x="383.0" y="222" text-anchor="middle">黄信号</text>
<rect class="box-bad" x="505.5" y="204" width="122.5" height="28" rx="3"/>
<text class="t-xs" x="566.8" y="222" text-anchor="middle">異常</text>
<line class="line" x1="383.0" y1="200" x2="383.0" y2="236"/>
<line class="line" x1="423.8" y1="188" x2="423.8" y2="236"/>
<circle cx="423.8" cy="218.0" r="4.5" fill="#1a56b8"/>
<text class="t-accent" x="423.8" y="184" text-anchor="middle" style="font-size:11px">⑭(+1)</text>
<text class="t-xs" x="383.0" y="250" text-anchor="middle">基準(0)</text>
</svg>
