<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="横棒の一覧表。カナリア（わざと仕込む偽の異常）の検知率を、仕込み方ごとに比べる。①②素朴に表へ直接追加した場合（説明あり・圧縮通知の計8機会）は検知できた回数が8/8で緑。③④監視対象リストで絞っているのにカナリアをリストに登録し忘れた場合（説明あり・圧縮通知の計8機会）は検知できた回数が0/8で赤。⑥未登録のまま自己診断を一言だけに強制した場合（4機会）も0/4で赤。⑤表と監視対象リストの両方にカナリアを登録した正しい仕込み方（4機会）は4/4で緑に戻る。下の枠には、監視対象リストでIDを絞る設計ではデータの表に行を足すだけではカナリアが判定の対象に入らないこと、表とリストの両方に登録すれば4回とも正しく検知されたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">表に足しただけでは検知されない。監視対象リストにも登録すると検知される</text>
<text class="t-sm" x="18" y="45">実測2026-11-24。架空の監視ログ2種に、カナリアの仕込み方を変えた指示文を各2回試した（1仕込み方・材料2本×2回＝4機会）。</text>
<text class="t-sm" x="18" y="64">監視対象リスト＝設定ファイルに登録された、実際に判定が読みに行くIDの一覧。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">①②素朴に表へ直接追加（説明あり・圧縮通知、計8機会）：検知できた回数</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">8/8</text>
<text class="t" x="18" y="157">③④監視対象リストで絞り・カナリアは未登録（説明あり・圧縮通知、計8機会）：検知できた回数</text>
<rect class="box-bad" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="157" text-anchor="middle" style="font-weight:700">0/8</text>
<text class="t" x="18" y="189">⑥未登録・自己診断を一言だけに強制（4機会）：検知できた回数</text>
<rect class="box-bad" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="189" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="221">⑤表とリストの両方に登録＝正しい仕込み方（4機会）：検知できた回数</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">4/4</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">監視対象リストでIDを絞る設計では、データの表に行を足すだけではカナリアが判定の対象に入らない。</text>
<text class="t-accent" x="34" y="276">表とリストの両方に登録すれば、4回とも正しく検知された。仕込み場所を両方揃えることが条件。</text>
</svg>
