<svg xmlns="http://www.w3.org/2000/svg" width="720" height="426" viewBox="0 0 720 426" role="img" aria-label="AIに渡せる作業の4つの型を並べた図。繰り返し＝毎週おなじ手順でやっている（曜日や締切で思い出す作業）。転記＝AからBへ写している（コピペが5回以上）。下書き＝ゼロから書き始めている（白紙を埋める時間が長い）。チェック＝抜けや誤りを目で探している（見落としが怖い作業）。どれにも入らない作業は判断が主役なので、人が持ったままでよい。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="426"/>
<text class="t-strong" x="18" y="26">AIに渡せる作業は、だいたい4つの型に入る</text>
<text class="t-sm" x="18" y="45">自分の1週間を思い出して、当てはまるものを探すのが速い。</text>
<rect class="box-accent" x="18" y="84" width="200" height="62" rx="6"/>
<text class="t-accent" x="34" y="120">繰り返し</text>
<rect class="box-quiet" x="240" y="84" width="236" height="62" rx="6"/>
<text class="t" x="254" y="120">毎週おなじ手順でやっている</text>
<text class="t-sm" x="498" y="120">曜日や締切で思い出す作業はここ</text>
<rect class="box-accent" x="18" y="164" width="200" height="62" rx="6"/>
<text class="t-accent" x="34" y="200">転記</text>
<rect class="box-quiet" x="240" y="164" width="236" height="62" rx="6"/>
<text class="t" x="254" y="200">AからBへ写している</text>
<text class="t-sm" x="498" y="200">コピペが5回以上出てきたらここ</text>
<rect class="box-accent" x="18" y="244" width="200" height="62" rx="6"/>
<text class="t-accent" x="34" y="280">下書き</text>
<rect class="box-quiet" x="240" y="244" width="236" height="62" rx="6"/>
<text class="t" x="254" y="280">ゼロから書き始めている</text>
<text class="t-sm" x="498" y="280">白紙を埋める時間が長いならここ</text>
<rect class="box-accent" x="18" y="324" width="200" height="62" rx="6"/>
<text class="t-accent" x="34" y="360">チェック</text>
<rect class="box-quiet" x="240" y="324" width="236" height="62" rx="6"/>
<text class="t" x="254" y="360">抜けや誤りを目で探している</text>
<text class="t-sm" x="498" y="360">見落としが怖い作業はここ</text>
<text class="t-xs" x="18" y="414">※ どれにも入らない作業は、たいてい判断が主役です。そこは人が持ったままでかまいません。</text>
</svg>
