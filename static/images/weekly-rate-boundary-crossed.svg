<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" role="img" aria-label="週次の時給レポート8週分を見せて「何週連続で下がっているか」を尋ねた実測で、第3・6週が欠測でもっとも数えにくいP社サイトについて、答えが「制作と修正のみ」の週と「全部含める」の週をまたいだかどうかを示す図。そのまま頼んだ版aは3回中3回ともまたいでいた。「線引きが違う週は比べないでください」を足した版bは3回中0回、「比べた週と線引きを書いてください」を足した版cも3回中0回で、またがなかった。版aは3回とも、線引きが変わったこと自体は文中で言及していたが、答えの数字には反映されていなかった。表に行が無い週を0円として扱った回は9回を通じて0回だった。版aの答えの1つを、別の独立した回答に「境界をまたいだ案件がないか点検して」と貼ったところ、またいだ3案件を1回で正しく指摘できた。">
<style>
