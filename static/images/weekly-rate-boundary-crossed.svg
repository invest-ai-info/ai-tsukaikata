</style>
<rect class="bg" x="0" y="0" width="720" height="342"/>
<text class="t-strong" x="18" y="26">「何週連続で下がっているか」は、P社サイトで境界をまたいだか</text>
<text class="t-sm" x="18" y="45">P社サイトは第3週と第6週が欠測で、線引きが変わる第4週の前後をまたぎやすい案件。3版×各3回＝9回。</text>
<text class="t-sm" x="18" y="64">×＝「制作と修正のみ」の週（第1〜3週）と「全部含める」の週（第5〜8週）を同じ「連続」に数えた（赤）。○＝またいでいない（緑）。</text>
<text class="t" x="18" y="136">そのまま頼む</text>
<text class="t-xs" x="208" y="136">版a</text>
<rect class="box-bad" x="300" y="118" width="34" height="28" rx="4"/>
<text class="t-bad" x="317.0" y="138" text-anchor="middle" style="font-size:15px;font-weight:700">×</text>
<rect class="box-bad" x="346" y="118" width="34" height="28" rx="4"/>
<text class="t-bad" x="363.0" y="138" text-anchor="middle" style="font-size:15px;font-weight:700">×</text>
<rect class="box-bad" x="392" y="118" width="34" height="28" rx="4"/>
<text class="t-bad" x="409.0" y="138" text-anchor="middle" style="font-size:15px;font-weight:700">×</text>
<text class="t-bad" x="452" y="136">3/3</text>
<text class="t" x="18" y="182">＋「線引きが違う週は比べない」</text>
<text class="t-xs" x="208" y="182">版b</text>
<rect class="box-good" x="300" y="164" width="34" height="28" rx="4"/>
<text class="t-good" x="317.0" y="184" text-anchor="middle" style="font-size:15px;font-weight:700">○</text>
<rect class="box-good" x="346" y="164" width="34" height="28" rx="4"/>
<text class="t-good" x="363.0" y="184" text-anchor="middle" style="font-size:15px;font-weight:700">○</text>
<rect class="box-good" x="392" y="164" width="34" height="28" rx="4"/>
<text class="t-good" x="409.0" y="184" text-anchor="middle" style="font-size:15px;font-weight:700">○</text>
<text class="t-good" x="452" y="182">0/3</text>
<text class="t" x="18" y="228">＋「比べた週と線引きを書く」</text>
<text class="t-xs" x="208" y="228">版c</text>
<rect class="box-good" x="300" y="210" width="34" height="28" rx="4"/>
<text class="t-good" x="317.0" y="230" text-anchor="middle" style="font-size:15px;font-weight:700">○</text>
<rect class="box-good" x="346" y="210" width="34" height="28" rx="4"/>
<text class="t-good" x="363.0" y="230" text-anchor="middle" style="font-size:15px;font-weight:700">○</text>
<rect class="box-good" x="392" y="210" width="34" height="28" rx="4"/>
<text class="t-good" x="409.0" y="230" text-anchor="middle" style="font-size:15px;font-weight:700">○</text>
<text class="t-good" x="452" y="228">0/3</text>
<text class="t-xs" x="18" y="276">※ 版aは3回とも、それとは別に「線引きが変わった」こと自体は文中で自分から書いていた。気づいてはいたが、答えの数字には反映されなかった。</text>
<text class="t-xs" x="18" y="296">※ 表に行が無い週（第3・4・6週）を0円として扱った回は、9回を通じて0回だった。</text>
<text class="t-xs" x="18" y="316">※ 版aの答えの1つを、別の独立した回答に「境界をまたいだ案件がないか点検して」と貼ったところ、またいだ3案件を1回で正しく指摘できた。</text>
</svg>
