<svg xmlns="http://www.w3.org/2000/svg" width="720" height="371" viewBox="0 0 720 371" role="img" aria-label="毎日1件ずつ処理する待ち行列で、どうしても処理できない行が2回転目にどうなったかを頼み方4通りで並べた表。1つの頼み方につき4系列ある。そのまま済の印を付けてと頼んだ4系列は、4系列ともできない印が付いた。印を固定してほかの行は1文字も変えないでと縛った4系列は、できない印が付いたのは1系列だけで、残る3系列は行き先が無くそのまま残った。できない行はハイフン角かっこびっくりにして理由を書くと足した4系列は、4系列とも印が付いた。できない行はいちばん下に移すと足した4系列は、4系列とも待ち行列のいちばん下へ移った。縛りを足したほうだけで、できない行の行き先が消えている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="371"/>
<text class="t-strong" x="18" y="26">縛りを足したほうで、「処理できない行」の行き先が消えた</text>
<text class="t-sm" x="18" y="45">架空の待ち行列12行（済4・前回できなかった2・未処理6）を作り、1回転目の返りをそのまま2回転目に渡した。</text>
<text class="t-sm" x="18" y="64">未処理の2番目は、資料が取れていなくてどうしても処理できない行にしてある。1つの頼み方につき4系列。</text>
<text class="t-xs" x="362" y="92" text-anchor="middle">できない印が</text>
<text class="t-xs" x="362" y="105" text-anchor="middle">付いた</text>
<text class="t-xs" x="478" y="92" text-anchor="middle">行き先が無い</text>
<text class="t-xs" x="478" y="105" text-anchor="middle">（そのまま）</text>
<text class="t-xs" x="598" y="92" text-anchor="middle">いちばん下へ</text>
<text class="t-xs" x="598" y="105" text-anchor="middle">移った</text>
<text class="t" x="18" y="136">そのまま「済の印を付けて」</text>
<rect class="box-good" x="336" y="122" width="52" height="19" rx="4"/>
<text class="t-good" x="362" y="136" text-anchor="middle">4 / 4</text>
<line class="line" x1="470" y1="131" x2="486" y2="131"/>
<line class="line" x1="590" y1="131" x2="606" y2="131"/>
<text class="t" x="18" y="170">＋印を固定・ほかの行は1文字も変えない</text>
<rect class="box-good" x="336" y="156" width="52" height="19" rx="4"/>
<text class="t-good" x="362" y="170" text-anchor="middle">1 / 4</text>
<rect class="box-bad" x="452" y="156" width="52" height="19" rx="4"/>
<text class="t-bad" x="478" y="170" text-anchor="middle">3 / 4</text>
<line class="line" x1="590" y1="165" x2="606" y2="165"/>
<text class="t" x="18" y="204">＋「できない行は - [!] にして理由を書く」</text>
<rect class="box-good" x="336" y="190" width="52" height="19" rx="4"/>
<text class="t-good" x="362" y="204" text-anchor="middle">4 / 4</text>
<line class="line" x1="470" y1="199" x2="486" y2="199"/>
<line class="line" x1="590" y1="199" x2="606" y2="199"/>
<text class="t" x="18" y="238">＋「できない行はいちばん下に移す」</text>
<rect class="box-good" x="336" y="224" width="52" height="19" rx="4"/>
<text class="t-good" x="362" y="238" text-anchor="middle">1 / 4</text>
<line class="line" x1="470" y1="233" x2="486" y2="233"/>
<rect class="box-good" x="572" y="224" width="52" height="19" rx="4"/>
<text class="t-good" x="598" y="238" text-anchor="middle">4 / 4</text>
<text class="t-bad" x="18" y="266">※ 2行目だけが事故。印を固定して「ほかの行は1文字も変えないで」と縛ると、</text>
<text class="t-bad" x="18" y="287">　 できない行は - [ ] のまま同じ位置に残り、明日もまた先頭で引っかかる。</text>
<text class="t-good" x="18" y="308">※ 1行目は、指示文で - [!] と言っていないのに4系列とも付けた。</text>
<text class="t-good" x="18" y="329">　 待ち行列にもとから - [!] の行が2件あり、それに倣っている。</text>
<text class="t-xs" x="18" y="350">架空データでの実測（全32回）。生の返りは docs/evidence/ に置いてある。</text>
</svg>
