<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" role="img" aria-label="見本行を実データにするかダミーにするかで、記録ファイルへの2日目の追記が正しい形式だった回数を並べた横棒グラフ。独立のサブエージェントで材料2本（副業の作業記録・家計の買い物メモ）×見本2版（実データ由来・ダミーのプレースホルダー）×各4回=16回試した。指示文はどの回も同じ文字列。副業の作業記録で実データの見本行を使った場合だけ0/4で、走り書きが一切変換されずそのまま最後の行に貼られていた。副業の記録でダミーの見本行を使った場合は4/4、家計の買い物メモでは実データ・ダミーどちらの見本行でも4/4で正しい形式だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="424"/>
<text class="t-strong" x="18" y="26">2日目の追記が正しい形式だった回数——副業の記録だけ、実データの見本が0/4</text>
<text class="t-sm" x="18" y="45">独立のサブエージェントで材料2本×見本2版×各4回=16回。指示文はどの回も同じ文字列。</text>
<text class="t-sm" x="18" y="64">崩れた4回は、走り書きが一切変換されずそのまま最後の行に貼られていた。</text>
<text class="t-xs" x="18" y="83">生の返りは docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="142">実データの見本行（副業の作業記録）</text>
<rect class="box" x="300" y="150" width="340" height="40" rx="4"/>
<text class="t-bad" x="654" y="175">0/4</text>
<text class="t-sm" x="18" y="212">ダミーの見本行（副業の作業記録）</text>
<rect class="box" x="300" y="220" width="340" height="40" rx="4"/>
<rect class="box-good" x="300" y="220" width="340.0" height="40" rx="4"/>
<text class="t-good" x="654" y="245">4/4</text>
<text class="t-sm" x="18" y="282">実データの見本行（家計の買い物メモ）</text>
<rect class="box" x="300" y="290" width="340" height="40" rx="4"/>
<rect class="box-good" x="300" y="290" width="340.0" height="40" rx="4"/>
<text class="t-good" x="654" y="315">4/4</text>
<text class="t-sm" x="18" y="352">ダミーの見本行（家計の買い物メモ）</text>
<rect class="box" x="300" y="360" width="340" height="40" rx="4"/>
<rect class="box-good" x="300" y="360" width="340.0" height="40" rx="4"/>
<text class="t-good" x="654" y="385">4/4</text>
</svg>
