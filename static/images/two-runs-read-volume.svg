<rect class="bg" x="0" y="0" width="720" height="538"/>
<text class="t-strong" x="18" y="26">返ってくる件数は頼み方で3倍変わる。仕込んだ5件は、どの頼み方でも全部出た</text>
<text class="t-sm" x="18" y="45">架空の自動処理の出力を2組（表形式・箇条書き）用意し、毎回そろっていないと困る違いを5件ずつ仕込んだ。</text>
<text class="t-sm" x="18" y="64">1つの頼み方につき、材料2本 × 各2回 = 4回。棒1本が1回ぶん。</text>
<text class="t-xs" x="274" y="92">濃い部分＝仕込んだ5件　薄い部分＝毎回変わって当然の差</text>
<text class="t" x="18" y="126">そのまま「違うところを教えて」</text>
