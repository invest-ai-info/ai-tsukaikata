<svg xmlns="http://www.w3.org/2000/svg" width="720" height="538" viewBox="0 0 720 538" role="img" aria-label="自動処理の出力2回ぶんを見比べさせたとき、返ってきた項目の件数を頼み方5通りで並べた横棒グラフ。1つの頼み方につき4回ぶんの棒がある。そのまま違うところを教えてと頼んだ4回は8件・8件・9件・10件。違うところだけ1行1件でと頼んだ4回は17件・18件・14件・14件。毎回変わってよい3つを先に宣言した4回は5件・6件・7件・5件。置いてよい・直す・判断できないの3択を付けさせた4回は11件・7件・9件・8件。宣言を残したまま短くした版は5件・5件・6件・7件。どの頼み方でも、仕込んだ5件は4回とも全部挙がっている。違うのは、そこに混ざってくる「毎回変わって当然の差」の量で、いちばん多い回で13件、宣言をした回は0件から2件だった。">
