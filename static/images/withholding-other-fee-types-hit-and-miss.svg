</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">講演料・翻訳料・著作権使用料も、同じ式で正しく引かれた</text>
<text class="t-sm" x="18" y="45">実測2026-10-09。法人が個人へ直接支払う架空の業務委託契約5種、各3回。</text>
<text class="t-sm" x="18" y="64">すべて「正しい結論に到達した回数／試した回数」で、多いほど良い。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">講演料45万円・明記あり（正解404,055円）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="157">翻訳料120万円・100万円の段階を跨ぐ（正解1,057,060円）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="189">著作権使用料28万円・明記あり（正解251,412円）</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">講演料45万円・語も204条も書かない（正解404,055円）</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="253">システム開発45万円・対象外（源泉徴収なし450,000円）</text>
<rect class="box-good" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="253" text-anchor="middle" style="font-weight:700">3/3</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">講演料・翻訳料・著作権使用料も、12回とも100万円以下10.21%・超える部分20.42%を正しく適用した。</text>
<text class="t-accent" x="34" y="308">「講演料」という語も204条も書かない契約でも、3回とも業務内容だけで同じ結論に届いた。</text>
<text class="t-accent" x="34" y="326">システム開発（204条の対象外）では、3回とも「源泉徴収は不要」と正しく踏みとどまった。</text>
</svg>
