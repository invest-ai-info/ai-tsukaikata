<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="講演料・翻訳料・著作権使用料・ラベルを伏せた講演料・システム開発の5種類の架空契約で、AIが源泉徴収を正しく計算できるかを実測した結果を示す表。すべて「正しい結論に到達した回数／試した回数」で、多いほど良い。講演料45万円・明記ありの版は3回中3回、翻訳料120万円・100万円の段階を跨ぐ版も3回中3回、著作権使用料28万円の版も3回中3回、講演料という語も204条も書かない版も3回中3回、システム開発45万円・204条の対象外の版も3回中3回、いずれも正しい結論（源泉徴収後の手取り額、またはシステム開発では源泉徴収なしの450,000円）に到達した。下の枠には、講演料・翻訳料・著作権使用料も12回とも100万円以下10.21%・超える部分20.42%を正しく適用したこと、講演料という語も204条も書かない契約でも3回とも業務内容だけで同じ結論に届いたこと、システム開発では3回とも源泉徴収は不要と正しく踏みとどまったことが書かれている。">
<style>
