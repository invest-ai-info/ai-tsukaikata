<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="process=P1〜P4の4本を1本のログに混ぜ、どれか1本だけを4日間止める総当たり4パターンと、全処理が正常な構成の計5構成を、同じ指示文で各2回試した結果を示す表。P1・P2・P3・P4のどれを止めた場合も2/2で停止4日間を正しく名指しできた。全処理が正常な構成も2/2で誤報なく『該当なし』と答えた。下の枠には、止めたのがP1〜P4のどれでも2回とも完全に名指しできたこと、正常な処理を誤って異常と報告した回は10回を通じて0件だったこと、全処理正常でも2回とも誤報が無かったことが書かれている。">
