<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">処理が4本・頻度差17倍でも、止めた処理は2回とも正しく名指しできた</text>
<text class="t-sm" x="18" y="45">実測2026-10-31。P1(1〜2回/日)〜P4(20〜30回/日)を1本のログに混ぜ、「処理ごとに計算して」を試した。</text>
<text class="t-sm" x="18" y="64">止めた処理1本ずつの総当たり4パターンと、全処理正常（誤報の確認）を各2回。</text>
<text class="t-xs" x="418.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">P1(最少)だけ4日間停止</text>
<rect class="box-good" x="338" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="418.0" y="125" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="157">P2だけ4日間停止</text>
<rect class="box-good" x="338" y="136" width="160" height="26" rx="4"/>
