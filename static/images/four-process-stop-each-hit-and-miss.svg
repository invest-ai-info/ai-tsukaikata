<text class="t" x="18" y="189">P3だけ4日間停止</text>
<rect class="box-good" x="338" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="418.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="221">P4(最多)だけ4日間停止</text>
<rect class="box-good" x="338" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="418.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="253">全処理が正常（誤報ゼロの確認）</text>
<rect class="box-good" x="338" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="418.0" y="253" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">止めたのがP1〜P4のどれでも、4日間を2回とも完全に名指しできた（計8/8）。</text>
<text class="t-accent" x="34" y="308">正常な処理を誤って異常と報告した回は、10回を通じて0件だった。</text>
<text class="t-accent" x="34" y="326">全処理が正常なログでも、2回とも誤報なく『該当なし』と答えた。</text>
