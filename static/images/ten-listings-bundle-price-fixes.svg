<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="崩れた1件（30,000円・3ヶ月パック・一括支払い）について、聞き方を変えた結果を示す表。価格だけで「月額でない」可能性に触れた回数は2回中0回。10件の本文に混ぜて判定しこの1件が正解だった回数は6回中4回。「1か月あたりに直して」の一文を足した2回は2回とも正解。この1件だけを取り出して単独で聞いた2回も2回とも正解。下の枠には、価格だけでは月額でない可能性に触れなかったこと、10件に混ぜると6回中4回は正解だが崩れた2回は月額と誤判定したこと、一文を足すか単独で聞くとどちらも2回とも正解したこと、他の9件と並べて聞くこと自体が崩れる一因になりうることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="340"/>
<text class="t-strong" x="18" y="26">「1か月あたりに直して」か、単独で聞くと、2回とも直る</text>
<text class="t-sm" x="18" y="45">実測2026-11-15。崩れた1件（30,000円・3ヶ月パック・一括支払い）に聞き方だけを変えた。</text>
<text class="t-sm" x="18" y="64">価格だけで聞く／10件に混ぜて聞く／直し方2種（一括換算の一文／単独で聞く）を比較。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">価格だけで「月額でない」可能性に触れた（2回）</text>
<rect class="box-bad" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="518.0" y="125" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="157">10件に混ぜて判定し、この1件が正解だった回（6回）</text>
<rect class="box" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="157" text-anchor="middle" style="font-weight:700">4/6</text>
<text class="t" x="18" y="189">「1か月あたりに直して」を足す（2回）</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="221">この1件だけを取り出して単独で聞く（2回）</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="82" rx="6"/>
<text class="t-accent" x="34" y="258">価格だけ（本文なし）で聞いた2回は、どちらも「月額でないかもしれない」に触れなかった。</text>
<text class="t-accent" x="34" y="276">10件の本文を渡して混ぜて聞くと、6回中4回は正解。崩れた2回はいずれも「月額」と誤判定。</text>
<text class="t-accent" x="34" y="294">「複数月ぶんの価格は1か月あたりに直して」を足すか、この1件だけを取り出して聞くと、</text>
<text class="t-accent" x="34" y="312">どちらも2回とも正解した。他の9件と並べて聞くこと自体が、崩れる一因になりうる。</text>
</svg>
