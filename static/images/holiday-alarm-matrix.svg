<text class="t-strong" x="18" y="26">休業日を教えると、0件アラームはどう動いたか</text>
<text class="t-sm" x="18" y="45">架空の14営業日ぶんの受付ログ（表形式・手書きメモ）。休業日2日・本当の異常1日を仕込んだ。</text>
<text class="t-sm" x="18" y="64">「休業日を教える」版では、次の日付だけを休業日として伝えた：2026-08-13、2026-08-14。</text>
<text class="t-sm" x="18" y="83">分母はその条件を走らせた回数。同じ指示文・同じ材料で、割れた回はそのまま数えている。</text>
