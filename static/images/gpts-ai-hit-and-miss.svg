<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="ChatGPTのGPTsについてAIに聞いた結果を並べた表。上4行は原文と一致した回数で、個人プランでは新しく作れないと述べた回数が0/9で赤、廃止・停止の日付（9月25日・12月11日）を挙げた回数が0/9で赤、原文を貼って聞いた回に「今からは収入を得られない」と答えた回数が3/3で緑、材料に無い金額を作らなかった回数が3/3で緑。下2行は原文と逆のことを言った回数で、「廃止・終了の予定は出ていない」と述べた回数が3/9、「Plus以上の有料プランなら作れる」と述べた回数が3/9、いずれも赤。下の枠には、素朴に聞いた9回は収益化プログラムを米国限定・招待制の試験と説明したが（7/9）、「もう作れない」「12月に止まる」には1回も触れず、廃止予定を聞いた3回は「予定は無い」と答えたこと、AIが知っている昔の条件を今の条件として読まず、予定は原文で確かめるという結論が書かれている。">
<style>
