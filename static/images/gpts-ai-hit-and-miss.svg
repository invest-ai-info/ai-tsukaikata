<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">「作れない」「止まる」は9回とも出ず、3回は逆を言った</text>
<text class="t-sm" x="18" y="45">実測2026-09-18。ウェブ検索を切ったAI（独立実行）に、素朴・収益化プログラム・廃止予定の3通りを各3回。</text>
<text class="t-sm" x="18" y="64">上4行＝原文と一致した回数（多いほど良い）。下2行＝原文と逆・原文に無いことを言った回数（少ないほど良い）。</text>
<text class="t-xs" x="528.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">個人プランでは新しく作れない、と述べた</text>
<rect class="box-bad" x="448" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="125" text-anchor="middle" style="font-weight:700">0/9</text>
<text class="t" x="18" y="157">廃止・停止の日付（9/25・12/11）を挙げた</text>
<rect class="box-bad" x="448" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="157" text-anchor="middle" style="font-weight:700">0/9</text>
<text class="t" x="18" y="189">材料を貼った回：「今からは収入を得られない」と答えた</text>
<rect class="box-good" x="448" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">材料を貼った回：材料に無い金額を作らなかった</text>
<rect class="box-good" x="448" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="253">「廃止・終了の予定は出ていない」と述べた（原文と逆）</text>
<rect class="box-bad" x="448" y="232" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="253" text-anchor="middle" style="font-weight:700">3/9</text>
<text class="t" x="18" y="285">「Plus以上の有料プランなら作れる」と述べた（原文と逆）</text>
<rect class="box-bad" x="448" y="264" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="285" text-anchor="middle" style="font-weight:700">3/9</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">素朴に聞いた9回は、収益化プログラムを「米国限定・招待制の試験」と丁寧に説明した（7/9）。</text>
<text class="t-accent" x="34" y="340">「もう作れない」「12月に止まる」には1回も触れず、廃止予定を聞いた3回は「予定は無い」と答えた。</text>
<text class="t-accent" x="34" y="358">＝AIが知っている「昔の条件」を、今の条件として読まないこと。予定は原文で確かめる。</text>
</svg>
