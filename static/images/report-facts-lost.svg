<svg xmlns="http://www.w3.org/2000/svg" width="720" height="469" viewBox="0 0 720 469" role="img" aria-label="週報を作らせたときに、今週のメモにあった事実がいくつ残ったかを比べた図。走り書きのメモにあった報告すべき事実9件のうち、「先週のこの形式で書いて」と頼んだ場合は2件しか残らなかった。型だけ使わせてメモとの対応表を出させると9件すべてが残った。消えた7件は、返事がまだ来ていない、止まっている理由が担当の出張であること、△△工業は今週動きなし、研修が延期になった、延期は先方都合、事務作業で2日つぶれた、値引きの可否を相談したい、の7つ。どれも進んでいないことを伝える情報で、報告書としてはいちばん伝えなければいけないところ。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="469"/>
<text class="t-strong" x="18" y="26">先週の形に合わせると、今週の事実が消える</text>
<text class="t-sm" x="18" y="45">走り書きのメモにあった「報告すべき事実」9件が、週報にいくつ残ったか。</text>
<text class="t-sm" x="18" y="124">「先週のこの形式で」</text>
<rect class="box-quiet" x="214" y="96" width="378" height="46" rx="6"/>
<rect class="box-bad" x="214" y="96" width="84" height="46" rx="6"/>
<text class="t-bad" x="602" y="124">2／9</text>
<text class="t-sm" x="18" y="190">型だけ使わせ、対応表を出させる</text>
<rect class="box-quiet" x="214" y="162" width="378" height="46" rx="6"/>
<rect class="box-good" x="214" y="162" width="378" height="46" rx="6"/>
<text class="t-good" x="602" y="190">9／9</text>
<text class="t-bad" x="18" y="242">消えた7件（上ほど困るもの）</text>
<text class="t-sm" x="34" y="262">・返事がまだ来ていない</text>
<text class="t-sm" x="34" y="287">・止まっている理由（担当が出張）</text>
<text class="t-sm" x="34" y="312">・△△工業は今週動きなし</text>
<text class="t-sm" x="34" y="337">・研修が延期になった</text>
<text class="t-sm" x="34" y="362">・延期は先方都合</text>
<text class="t-sm" x="34" y="387">・事務作業で2日つぶれた</text>
<text class="t-sm" x="34" y="412">・値引きの可否を相談したい</text>
<text class="t-xs" x="18" y="455">※ 消えた7件は、どれも「進んでいない」ことを伝える情報。報告書としては、いちばん伝えなければいけないところ。</text>
</svg>
