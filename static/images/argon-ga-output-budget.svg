<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Gemini 3.1 Pro Previewの出力上限65,536トークン、Gemini 4 Argonの既定（同期呼び出し）の出力上限65,536トークン、Gemini 4 Argonのlong decode利用時の出力上限1,048,576トークンを比べた横棒グラフ。long decode利用時は既定の16倍（この記事の計算）。既定のままでは前のモデルと変わらない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="260"/>
<text class="t-strong" x="18" y="26">既定の出力上限は、前のモデルと同じ65,536のまま</text>
<text class="t-sm" x="18" y="45">「業界最高水準の100万トークン」はlong decodeという別機能を使った場合の値。</text>
<text class="t-sm" x="18" y="64">何もしなければ、1回の応答で生成できるトークン数は前のモデルから変わらない。</text>
<text class="t" x="18" y="112">Gemini 3.1 Pro Preview（前のモデル）</text>
<rect class="bar-old" x="272" y="96" width="21.1" height="22" rx="3"/>
<text class="t-sm" x="301.1" y="112">65,536</text>
<text class="t" x="18" y="154">Gemini 4 Argon（既定・同期呼び出し）</text>
<rect class="bar-old" x="272" y="138" width="21.1" height="22" rx="3"/>
<text class="t-sm" x="301.1" y="154">65,536</text>
<text class="t" x="18" y="196">Gemini 4 Argon（long decode利用時・最大）</text>
<rect class="bar-new" x="272" y="180" width="338.0" height="22" rx="3"/>
<text class="t-sm" x="618.0" y="196">1,048,576</text>
<text class="t-xs" x="18" y="238">※ 16倍はこの記事の計算（1,048,576 ÷ 65,536）。出典: Gemini API公式モデルページ。</text>
<text class="t-xs" x="18" y="254">※ long decodeを使うほど、入力に使える枠は減る（1,048,576は入出力の合計）。</text>
</svg>
