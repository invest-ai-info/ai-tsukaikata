<svg xmlns="http://www.w3.org/2000/svg" width="720" height="258" viewBox="0 0 720 258" role="img" aria-label="文末表現の3回以上連続が、素朴な『人間らしく書き直して』という指示だけでどれだけ解消したかを、先行記事とこの記事で比べた表。先行記事（禁止語13種を含む材料・18回試行）は3回以上連続が残った回0件。この記事（禁止語を含まない材料・15回試行）も残った回0件だった。下の枠には、先行記事は禁止語を含む材料で18回とも残らなかったこと、この記事は禁止語を含まない材料でも15回とも残らず同じ天井を再現したこと、「禁止語が無いと機械的ルールの効果が見える」という見立てはこれで棄却されたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="258"/>
<text class="t-strong" x="18" y="26">禁止語があってもなくても、文末の繰り返しは素朴な指示だけで消えた</text>
<text class="t-sm" x="18" y="45">実測2026-10-11。先行記事（禁止語13種を含む材料）とこの記事（禁止語を含まない材料）の比較。</text>
<text class="t-sm" x="18" y="64">「3回以上残った回」が0に近いほど、素朴な指示だけで文末の繰り返しが解消したことを示す。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">先行記事：禁止語13種を含む材料（18回）</text>
<rect class="box-good" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="125" text-anchor="middle" style="font-weight:700">0/18</text>
<text class="t" x="18" y="157">この記事：禁止語を含まない材料（15回）</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">0/15</text>
<rect class="box-accent" x="18" y="174" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="194">先行記事は禁止語13種を含む材料で18回とも文末の3回以上連続が残らなかった。</text>
<text class="t-accent" x="34" y="212">この記事は禁止語を含まない材料でも15回とも残らず、同じ天井（0件）を再現した。</text>
<text class="t-accent" x="34" y="230">「禁止語が無いと機械的ルールの効果が見える」という見立ては、これで棄却された。</text>
</svg>
