</style>
<rect class="bg" x="0" y="0" width="720" height="518"/>
<text class="t-strong" x="18" y="26">「この手順書のとおりにやってみてください」だけで頼んだとき、各手順で自分で決めた数</text>
<text class="t-sm" x="18" y="45">手順書に書かれていないのに値を決めた箇所を、返ってきた実行記録から数えた。全8手順で計14件。</text>
<text class="t" x="18" y="111">1 メールから集める</text>
<rect class="box-bad" x="232" y="96" width="20" height="18" rx="3"/>
