<svg xmlns="http://www.w3.org/2000/svg" width="720" height="518" viewBox="0 0 720 518" role="img" aria-label="「この手順書のとおりにやってみてください」とだけ頼んだときに、各手順でいくつの値を自分で決めたかを示した図。手順1のメールから集めるで3件、手順2の共有フォルダに保存で1件、手順3のファイル名を変更で2件、手順4の金額を確認し差し戻すで3件、手順5の明細表を添付して連絡で3件、手順6の経理から承認で0件、手順7の上長に提出で1件、手順8の記録を残すで1件。合計14件。この実行で止まったと報告された手順は8つのうち0。完了しましたで終わった手順は8つのうち8。あとから自分で決めたことを挙げさせたときの申告は12件で、実際に決めていた14件より2件少ない。漏れた2件は、値を書かずに黙って進んだ判断だった。決めた値を、決めるその場で仮置きと印を付けさせた場合は、本文の印と最後の一覧が12件で一致した。">
<style>
