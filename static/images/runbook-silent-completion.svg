<rect class="box-bad" x="232" y="152" width="20" height="18" rx="3"/>
<rect class="box-bad" x="258" y="152" width="20" height="18" rx="3"/>
<text class="t-bad" x="440" y="166">2件を自分で決めた</text>
<text class="t" x="18" y="195">4 金額を確認・差し戻す</text>
<rect class="box-bad" x="232" y="180" width="20" height="18" rx="3"/>
<rect class="box-bad" x="258" y="180" width="20" height="18" rx="3"/>
<rect class="box-bad" x="284" y="180" width="20" height="18" rx="3"/>
<text class="t-bad" x="440" y="194">3件を自分で決めた</text>
<text class="t" x="18" y="223">5 明細表を添付して連絡</text>
<rect class="box-bad" x="232" y="208" width="20" height="18" rx="3"/>
<rect class="box-bad" x="258" y="208" width="20" height="18" rx="3"/>
<rect class="box-bad" x="284" y="208" width="20" height="18" rx="3"/>
<text class="t-bad" x="440" y="222">3件を自分で決めた</text>
<text class="t" x="18" y="251">6 経理から承認</text>
<text class="t-sm" x="440" y="250">決めた値なし</text>
<text class="t" x="18" y="279">7 上長に提出</text>
<rect class="box-bad" x="232" y="264" width="20" height="18" rx="3"/>
<text class="t-bad" x="440" y="278">1件を自分で決めた</text>
<text class="t" x="18" y="307">8 記録を残す</text>
<rect class="box-bad" x="232" y="292" width="20" height="18" rx="3"/>
<text class="t-bad" x="440" y="306">1件を自分で決めた</text>
<rect class="box-bad" x="18" y="336" width="666" height="26" rx="6"/>
<text class="t" x="30" y="354">この実行で「止まった」と報告された手順</text>
<text class="t-bad" x="560" y="354">0 / 8</text>
<rect class="box-bad" x="18" y="370" width="666" height="26" rx="6"/>
<text class="t" x="30" y="388">「完了しました」で終わった手順</text>
<text class="t-bad" x="560" y="388">8 / 8</text>
<rect class="box-quiet" x="18" y="404" width="666" height="26" rx="6"/>
<text class="t" x="30" y="422">あとから「自分で決めたこと」を挙げさせたときの申告</text>
<text class="t-sm" x="560" y="422">12 件</text>
<rect class="box-good" x="18" y="438" width="666" height="26" rx="6"/>
<text class="t" x="30" y="456">決めるその場で「仮置き」と印を付けさせた場合</text>
<text class="t-good" x="560" y="456">12 / 12 一致</text>
<text class="t-xs" x="18" y="490">※ 実際に決めていたのは14件だが、あとから挙げさせた申告は12件。漏れた2件は、値を書かずに黙って進んだ判断だった。</text>
<text class="t-xs" x="18" y="506">※ 決めた値を、決めるその場で「仮置き」と印を付けさせると、本文の印と最後の一覧が12件で一致した。</text>
