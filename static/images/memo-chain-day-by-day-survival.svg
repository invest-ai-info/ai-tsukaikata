<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">winning指示文は、2日目から識別子が崩れはじめる</text>
<text class="t-sm" x="18" y="45">実測2026-11-06。同じ行が同じ理由で3日連続止まる架空の待ち行列で、前日のメモだけを渡して今日のメモを書かせた。</text>
<text class="t-sm" x="18" y="64">base＝素朴な「その旨を書いて」。winning＝前作が効いた「言い換えずにコピー」＋「次はこの行から」相当の指示。</text>
