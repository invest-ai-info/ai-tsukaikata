<text class="t-accent" x="34" y="322">⚠️ 数字は「崩れた識別子の数」。0なら緑（崩れなし）、1以上なら赤（崩れあり）。</text>
<text class="t-accent" x="34" y="340">base条件は3日間とも崩れ0件。winning条件だけ、2日目・3日目に崩れが出た（材料Aの3本中2本）。</text>
