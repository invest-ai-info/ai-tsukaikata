<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="引き継ぎメモの識別子3個（行の文字列・資料のファイル名・画面の手がかり）が、1日目から3日目までどれだけ崩れたかを、崩れた数／全識別子数で示す表。1日目はbase条件12個中0個・winning条件15個中0個で、どちらも崩れなし（緑）。2日目はbase条件12個中0個で崩れなし（緑）だが、winning条件は15個中1個が崩れた（赤）。3日目はbase条件12個中0個で崩れなし（緑）だが、winning条件は15個中2個が崩れた（赤）。下の枠には、数字は崩れた識別子の数で0なら崩れなし・1以上なら崩れありという意味であること、base条件は3日間とも崩れ0件でwinning条件だけ2日目・3日目に崩れが出たこと（材料Aの3本のチェーンのうち2本）が書かれている。">
<style>
