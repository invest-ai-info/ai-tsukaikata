<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="Gemini 3.6 Flash と 3.7 Flash の点数を比べた横棒グラフ。FrontierCode 1.1 は34.4％から43.6％、DeepSWE v1.1 は48.6％から65.3％、Terminal-bench 2.1 は78.0％から85.8％、AutomationBench は17.0％から30.4％、GDP.pdf は22.0％から34.0％へ上がった。いっぽう CharXiv（道具なし）だけは85.2％から84.5％へ下がっている。いずれも Google のモデルカードに載っている値で、テストの中身も測り方も別々のため平均は取れない。">
