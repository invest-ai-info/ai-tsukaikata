<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="ランサーズの生成AI「使用許可・制限」を選べる制度に、AIが自分から触れた回数を4つの聞き方で比べた表。すべて実際の選択・ラベル制度を示す語に触れた回数で、募集文自身にある「コンペ方式」という文字列だけの言及は除いている。コンペ方式の募集文で「使ってよいか」と素朴に聞いた5回は0/5、プロジェクト方式の募集文で同じ質問をした5回も0/5、素朴な質問に「ランサーズの規定を踏まえて」と足した3回も0/3。募集文を見せず、制度の有無だけを直接聞いた3回は3/3で、実在する使用許可・使用制限を選べる機能と【AIで生成】ラベルにほぼ正しく触れた（1回は確信が無いと留保）。下の枠には、募集文の可否を判断させる形ではどの回も実在する制度に触れなかったこと、同じ知識は制度の有無だけを直接聞くと3回とも出てきたこと、知識が無いのではなく判断という作業の中では引き出されないという結論が書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">実在する「選べる」制度に、AIは直接聞くと答えるが自分からは触れない</text>
<text class="t-sm" x="18" y="45">実測2026-09-26。架空のロゴデザイン募集文（コンペ方式／プロジェクト方式）でAgentツールに独立に質問。</text>
<text class="t-sm" x="18" y="64">すべて、実際の選択・ラベル制度を示す語に触れた回数（材料自身の「コンペ方式」という文字列の言及は除く）。</text>
<text class="t-xs" x="528.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">コンペ方式の募集文で「使ってよいか」と素朴に聞いた5回</text>
<rect class="box-bad" x="448" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="125" text-anchor="middle" style="font-weight:700">0/5</text>
<text class="t" x="18" y="157">プロジェクト方式の募集文で同じ質問をした5回</text>
<rect class="box-bad" x="448" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="157" text-anchor="middle" style="font-weight:700">0/5</text>
<text class="t" x="18" y="189">素朴な質問に「ランサーズの規定を踏まえて」と足した3回</text>
<rect class="box-bad" x="448" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="189" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="221">募集文を見せず、制度の有無だけを直接聞いた3回</text>
<rect class="box-good" x="448" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">募集文の可否を判断させる形では、5回・5回・3回のどれも実在する制度に触れなかった。</text>
<text class="t-accent" x="34" y="276">同じ知識は、制度の有無だけを直接聞くと3回とも出てきた（1回は「確信が無い」と留保付き）。</text>
<text class="t-accent" x="34" y="294">＝知識が無いのではなく、判断という作業の中では引き出されない。</text>
</svg>
