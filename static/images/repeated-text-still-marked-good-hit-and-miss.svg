<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="良品20件に他の日の文章をそのまま複製した行を4件仕込み、3件抜き取り＋提案の指示文と、全30件を1行ずつ判定させる指示文のどちらが拾うかを比べた結果を示す表。すべて「当たった回数／聞いた回数」で、多いほど良い。3件抜き取り＋提案の指示文で、本文のどこかで複製4件が名指しされた数は16回中16回（材料2本×各2回×4件）。全30件判定の指示文で、判定欄が「よくない」になった数は、材料Aの2回ぶんでは8回中8回だったが、材料Bの2回ぶんでは8回中0回だった。ただし材料Bでは、判定欄が「良い」のままでも本文のどこかで複製に触れた回が2回中2回あった。下の枠には、3件しか見せない指示文でも全30件を読んでから選ぶため複製4件は4回とも全部名指しされたこと、全30件を判定させる指示文は材料Aでは判定欄が2回とも複製を正しく拾ったが材料Bでは2回とも「良い」に分類され気づいていても欄には出なかったことが書かれている。">
