<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">全件判定の「良い／よくない」欄は、材料によって複製を見逃した</text>
<text class="t-sm" x="18" y="45">実測2026-10-01。three-samples-and-the-pass-line の材料に、良品4件を他の日の文章と</text>
<text class="t-sm" x="18" y="64">同文へ差し替えて仕込んだ（材料2本×各2回＝8回。新しい仕込みは1回あたり4件）。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">①3件抜き取り＋提案：本文のどこかで複製4件が名指しされた数</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">16/16</text>
<text class="t" x="18" y="157">⑤全30件判定：判定欄で「よくない」になった数（材料A・2回ぶん）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">8/8</text>
<text class="t" x="18" y="189">⑤全30件判定：判定欄で「よくない」になった数（材料B・2回ぶん）</text>
<rect class="box-bad" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="189" text-anchor="middle" style="font-weight:700">0/8</text>
<text class="t" x="18" y="221">⑤全30件判定：判定欄は「良い」でも本文中で複製に触れた回（材料B）</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">3件しか見せない①でも、全30件を読んでから選ぶため複製4件は4回とも全部名指しされた。</text>
<text class="t-accent" x="34" y="276">全30件を判定させる⑤は、材料Aでは判定欄が2回とも複製を正しく拾ったが、</text>
<text class="t-accent" x="34" y="294">材料Bでは2回とも「良い」に分類＝気づいていても欄には出なかった（本文の説明では触れていた）。</text>
