<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="4条件（基準緩和版・引用指定版×6件条件・7件条件）それぞれで4回ずつ実行し、健全な項目を巻き込まず該当項目だけを正しく除外できた回数を比べた表。基準緩和版（引用なし）・6件条件は4回中4回。引用指定版・6件条件は4回中4回。既存の誤りも同時に混在させた7件条件は、基準緩和版・引用指定版ともに4回中4回。合計16条件・16回すべてで、健全な5件の巻き添えも、紛れ語・既存の誤りの見逃しも起きなかった。">
