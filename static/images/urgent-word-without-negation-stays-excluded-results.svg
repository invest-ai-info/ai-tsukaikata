<text class="t-strong" x="18" y="26">否定語なしの紛れ語も、16回中16回正しく除外された</text>
<text class="t-sm" x="18" y="45">実測2026-10-23。「至急…来週分の定期メンテナンスで」のように、緊急語と先送り理由が</text>
<text class="t-sm" x="18" y="64">否定語なしで同じ1文に混在する依頼を、健全5件・6件（＋既存の誤り1件）に混ぜて試した。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">基準緩和版（引用なし）・6件条件</text>
