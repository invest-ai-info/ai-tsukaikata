<text class="t-accent" x="34" y="258">健全5件は16回とも巻き添えゼロ。新しい紛れ語（HD-2230／HD-3330）は16回とも正しく除外された。</text>
<text class="t-accent" x="34" y="276">7件条件で同時に混ぜた既存の誤り（HD-2211／HD-3311）も、8回とも正しく除外された。</text>
<text class="t-accent" x="34" y="294">「至急」「今すぐ」という語が本文に実在しても、除外の判断はその語だけで決まらなかった。</text>
