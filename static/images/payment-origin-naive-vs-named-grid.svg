<rect class="bg" x="0" y="0" width="720" height="325"/>
<text class="t-strong" x="18" y="26">矛盾そのものには4回とも気づいたが、結論の日付は3通りに割れた</text>
<text class="t-sm" x="18" y="45">架空の「基本契約書＋個別発注書」2組（検収完了と納品日で支払の基準が揃わない）に、「入金予定日はいつですか」と素朴に聞いた（4回）。</text>
<text class="t-sm" x="18" y="64">同じ2組に、「発注書の記述だけを起点に」と名指しして聞いた回（4回）も試した。</text>
<text class="t-sm" x="18" y="83">材料や仮説を知らない新規の会話に、毎回同じ指示文を送った実測。</text>
<text class="t-xs" x="18" y="106">結論として最初に示した日付</text>
<text class="t-xs" x="237.0" y="138">材料A・1回目</text>
<text class="t-xs" x="357.0" y="138">材料A・2回目</text>
<text class="t-xs" x="477.0" y="138">材料B・1回目</text>
<text class="t-xs" x="597.0" y="138">材料B・2回目</text>
<text class="t-sm" x="18" y="170">素朴に聞く（4回）</text>
<rect class="box-accent" x="210" y="150" width="110" height="32" rx="4"/>
<text class="t-accent" x="237.0" y="170">10/31</text>
<rect class="box-bad" x="330" y="150" width="110" height="32" rx="4"/>
<text class="t-bad" x="357.0" y="170">11/30</text>
<rect class="box-quiet" x="450" y="150" width="110" height="32" rx="4"/>
<text class="t-sm" x="493.8" y="170">未定</text>
<rect class="box-accent" x="570" y="150" width="110" height="32" rx="4"/>
<text class="t-accent" x="597.0" y="170">10/31</text>
<text class="t-sm" x="18" y="212">起点を名指し（4回）</text>
<rect class="box-good" x="210" y="192" width="110" height="32" rx="4"/>
<text class="t-good" x="237.0" y="212">10/31</text>
<rect class="box-good" x="330" y="192" width="110" height="32" rx="4"/>
<text class="t-good" x="357.0" y="212">10/31</text>
<rect class="box-good" x="450" y="192" width="110" height="32" rx="4"/>
<text class="t-good" x="477.0" y="212">10/31</text>
<rect class="box-good" x="570" y="192" width="110" height="32" rx="4"/>
<text class="t-good" x="597.0" y="212">10/31</text>
<text class="t-xs" x="18" y="267">※ 素朴に聞いた回は、4回とも2つの文書の基準が違うこと自体には触れていた（内訳＝10/31が2回・11/30が1回・未定が1回）。</text>
<text class="t-xs" x="18" y="288">※ 起点を名指しした回は、結論の日付が4回とも一致した（ただし4回中3回は、使わないよう頼んだ基本契約の矛盾を補足として書き足した）。</text>
<text class="t-xs" x="18" y="309">架空データでの実測。生の返り12回は docs/evidence/ に全文置いてある。</text>
</svg>
