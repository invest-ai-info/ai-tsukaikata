<svg xmlns="http://www.w3.org/2000/svg" width="720" height="325" viewBox="0 0 720 325" role="img" aria-label="素朴に「入金予定日はいつですか」と聞いた回（4回）と、「発注書の記述だけを起点に」と名指しして聞いた回（4回）で、結論として最初に示した日付を並べたマス目。素朴に聞いた回は、材料Aの1回目が10/31、2回目が11/30、材料Bの1回目が未定（両方の可能性を対等に提示）、2回目が10/31で、3通りに割れた。起点を名指しした回は、材料A・Bとも1回目・2回目すべてで10/31に一致した。下の枠には、素朴に聞いた回は4回とも2つの文書の基準が違うこと自体には触れていたこと、起点を名指しした回は結論の日付が4回とも一致したが4回中3回は使わないよう頼んだ基本契約の矛盾を補足として書き足したことが書かれている。">
