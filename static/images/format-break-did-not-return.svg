<rect class="bg" x="0" y="0" width="720" height="544"/>
<text class="t-strong" x="18" y="26">前回崩れた条件も、別日の再実行では崩れなかった</text>
<text class="t-sm" x="18" y="45">同じ材料2本（過去分100件）に、6条件を各2回=4回ずつ実行した（計24回）。</text>
<text class="t-sm" x="18" y="64">正しい答えは「新着0件」。前回（2026-09-22）0/4だった条件が、今回は4/4だった。</text>
