<svg xmlns="http://www.w3.org/2000/svg" width="720" height="318" viewBox="0 0 720 318" role="img" aria-label="Gemini 3.1 Flash Live Preview（旧世代・プレビュー版）と Gemini 3.8 Live / 3.8 Live Extended Thinking（新世代・正式版）の、テキストの単価を比べた横棒グラフ。100万トークンあたりのドル。どちらも入力0.75ドル・出力4.50ドルで、バーの長さは2つとも同じ。料金ページでは3つのモデルIDが同じ価格の行にまとめられている。音声の単価も分あたり換算（入力0.005ドル・出力0.018ドル毎分）で同額。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="318"/>
<text class="t-strong" x="18" y="26">プレビュー版から正式版になっても、テキストの単価は変わっていない</text>
<text class="t-sm" x="18" y="45">薄い青＝入力、濃い青＝出力。100万トークンあたりのドル（テキストの標準単価）。</text>
<text class="t-sm" x="18" y="64">料金ページでは3モデルIDが同じ価格の行にまとめられており、バーの長さは2つとも同じ。</text>
<text class="t" x="18" y="122">旧世代</text>
<text class="t" x="18" y="137">Gemini 3.1 Flash Live Preview（プレビュー版）</text>
<text class="t-xs" x="214" y="138">入力</text>
<rect class="bar-in" x="250" y="125" width="60.0" height="16" rx="2"/>
<text class="t-sm" x="318.0" y="138">$0.75</text>
<text class="t-xs" x="214" y="159">出力</text>
<rect class="bar-out" x="250" y="146" width="360.0" height="16" rx="2"/>
<text class="t-sm" x="618.0" y="159">$4.50</text>
<text class="t" x="18" y="189">新世代</text>
<text class="t" x="18" y="204">Gemini 3.8 Live / 3.8 Live Extended Thinking（正式版）</text>
<text class="t-xs" x="214" y="205">入力</text>
<rect class="bar-in" x="250" y="192" width="60.0" height="16" rx="2"/>
<text class="t-sm" x="318.0" y="205">$0.75</text>
<text class="t-xs" x="214" y="226">出力</text>
<rect class="bar-out" x="250" y="213" width="360.0" height="16" rx="2"/>
<text class="t-sm" x="618.0" y="226">$4.50</text>
<text class="t-xs" x="18" y="284">※ 出典: Gemini API 料金ページ（ai.google.dev・2026年9月15日に確認）。</text>
<text class="t-xs" x="18" y="302">※ 音声の単価も分あたり換算で公式に併記されており、こちらも入力$0.005/分・出力$0.018/分で同額。</text>
</svg>
