<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="ダブルブッキング検出を、時刻の表記だけを振って試した結果を示す表。材料A（3者の予定・5候補）の24時間表記で統一した版は3/3、表記を午前10時等に混在させた版も3/3。材料B（隙間のない2件の境界をまたぐ候補）の統一表記は3/3、表記混在も3/3。4行すべて真値と完全一致。下の枠には、どちらの材料も表記を混ぜた3回とも判定が統一表記と完全に一致したこと、境界をまたぐ候補も表記混在の3回とも両方の重複を正しく指摘したことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">表記がクライアントごとに違っても、判定は崩れなかった</text>
<text class="t-sm" x="18" y="45">実測2026-11-10。既存記事と同じ材料A（3者の予定・5候補）・材料B（境界をまたぐ候補）に、時刻の書き方だけを振った。</text>
<text class="t-sm" x="18" y="64">24時間表記で統一した版と、「午前10時」等を混ぜた版を、新規の会話で各3回試した。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">材料A（3者の予定・5候補）・24時間表記で統一</text>
<rect class="box-good" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="125" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="157">材料A（3者の予定・5候補）・表記を混在</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="189">材料B（境界をまたぐ候補）・24時間表記で統一</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">材料B（境界をまたぐ候補）・表記を混在</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">どちらの材料も、表記を混ぜた3回とも、判定（空いている候補・重なる予定）は統一表記と完全に一致した。</text>
<text class="t-accent" x="34" y="276">境界をまたぐ候補（2件の予定の両方と重なる形）も、表記混在の3回とも両方の重複を正しく指摘した。</text>
</svg>
