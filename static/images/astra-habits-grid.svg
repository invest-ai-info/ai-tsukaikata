<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" role="img" aria-label="GPT-6 Astra の癖と対処を2列で並べた図。左＝そのまま頼むと起きること、右＝OpenAI 公式ガイドが勧める言い足し。聞き返して止まる、には「読み取って最後までやる」と先に書く。指示書の細部に引っかかる、には「利用者の指示を最優先」と順位を書く。箇条書きと表を多用する、には「段落で書く」と型を指定する。手分けを控えめにする、にはどこを並行させるかを書く。小さな用でも確認を厚くする、には確認の範囲を先に決めて渡す。5つとも OpenAI が公式ガイドに明記しているもの。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="342"/>
<text class="t-strong" x="18" y="26">OpenAI が公式ガイドに挙げている「Astra の癖」と、その直し方</text>
<text class="t-sm" x="18" y="45">5つとも「賢くなった副作用」として公式が明記しているもの。使う側が指示文で調整する前提で書かれています。</text>
<text class="t-sm" x="18" y="64">左＝そのまま頼んだときに起きること。右＝公式が勧めている言い足し。</text>
<rect class="box-bad" x="18" y="70" width="328" height="188" rx="6"/>
<rect class="box-good" x="366" y="70" width="328" height="188" rx="6"/>
<text class="t-bad" x="32" y="94">そのまま頼むと</text>
<text class="t-good" x="380" y="94">公式が勧める言い足し</text>
<text class="t" x="32" y="124">聞き返して止まる</text>
<text class="t" x="380" y="124">「読み取って最後までやる」と先に書く</text>
<text class="t" x="32" y="156">指示書の細部に引っかかる</text>
<text class="t" x="380" y="156">「利用者の指示を最優先」と順位を書く</text>
<text class="t" x="32" y="188">箇条書きと表を多用する</text>
<text class="t" x="380" y="188">「段落で書く」と型を指定する</text>
<text class="t" x="32" y="220">手分けを控えめにする</text>
<text class="t" x="380" y="220">どこを並行させるかを書く</text>
<text class="t" x="32" y="252">小さな用でも確認を厚くする</text>
<text class="t" x="380" y="252">確認の範囲を先に決めて渡す</text>
<text class="t-xs" x="18" y="312">※ 出典: OpenAI「Using GPT-6 Astra」（developers.openai.com・2026年9月5日に確認）。</text>
<text class="t-xs" x="18" y="330">※ 実際に使った感想ではなく、公式ガイドに書かれている内容です。</text>
</svg>
