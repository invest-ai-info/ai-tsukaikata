<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="理由を片側だけに書いても、重大4件が軽い4件より先に並ぶ割合が崩れないことを示す表形式の図。4行とも「重大4件が先だった組数／全体の組数」（16組の比較×材料2本×各2回＝64組）。「全部に理由あり（この記事で再検証）」は64／64（100%）。「重大4件だけ理由あり・軽い4件はラベルのみ」も64／64（100%）。「軽い4件だけ理由あり・重大4件はラベルのみ」も64／64（100%）。参考行「両方ともラベルのみ（前記事・中間12件もラベル）」だけが0／64（0%）で赤く表示されている。下の注記には、中間12件の理由文を残したままなら、重大4件と軽い4件のどちらか片方だけラベルにしても並び順は崩れなかったこと（192組中、逆転0）、崩れたのは前記事のとおり全員がラベルだけになったときだけだったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">理由を片側だけに書いても、重大4件が先に並ぶ割合は変わらない</text>
<text class="t-sm" x="18" y="45">材料A・B（各20件）で、重大4件・軽い4件のどちらか一方だけを理由文からラベルに置き換えた。中間12件は常に理由文のまま。</text>
<text class="t-sm" x="18" y="64">数字は「重大4件が軽い4件より先だった組数／全体の組数」（16組×2回×2材料＝64組）。</text>
<text class="t-xs" x="528.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">全部に理由あり（この記事で再検証）</text>
<rect class="box-good" x="448" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="125" text-anchor="middle" style="font-weight:700">64/64</text>
<text class="t" x="18" y="157">重大4件だけ理由あり・軽い4件はラベルのみ</text>
<rect class="box-good" x="448" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="157" text-anchor="middle" style="font-weight:700">64/64</text>
<text class="t" x="18" y="189">軽い4件だけ理由あり・重大4件はラベルのみ</text>
<rect class="box-good" x="448" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="189" text-anchor="middle" style="font-weight:700">64/64</text>
<text class="t" x="18" y="221">参考: 両方ともラベルのみ（前記事・中間12件もラベル）</text>
<rect class="box-bad" x="448" y="200" width="160" height="26" rx="4"/>
<text class="t-bad" x="528.0" y="221" text-anchor="middle" style="font-weight:700">0/64</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">中間12件の理由文を残したままなら、重大4件と軽い4件のどちらか片方だけラベルにしても、</text>
<text class="t-accent" x="34" y="276">並び順は崩れなかった（192組中、逆転0）。崩れたのは前記事のとおり、全員がラベルだけになったときだけ。</text>
</svg>
