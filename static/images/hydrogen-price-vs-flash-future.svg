<rect class="bg" x="0" y="0" width="720" height="293"/>
<text class="t-strong" x="18" y="26">Hydrogenの発表価格は、3.8 Flashの値上げ後と同じ金額</text>
<text class="t-sm" x="18" y="45">薄い色＝入力、濃い色＝出力。100万トークンあたりのドル。</text>
<text class="t-sm" x="18" y="64">3.8 Flashは2027年1月1日に価格が2倍になる予定。Hydrogenはその金額から始まる。</text>
