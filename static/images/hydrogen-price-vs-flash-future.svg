<svg xmlns="http://www.w3.org/2000/svg" width="720" height="293" viewBox="0 0 720 293" role="img" aria-label="Gemini 3.8 Flash（〜2026年12月31日・入力0.75ドル出力3.75ドル）、Gemini 3.8 Flash（2027年1月1日から・入力1.50ドル出力7.50ドル）、Gemini 4 Hydrogen（発表時点・入力1.50ドル出力7.50ドル）を比べた横棒グラフ。100万トークンあたりのドル。HydrogenはFlashが値上げしたあとの金額から始まっており、Hydrogen自身の発表には値上がりの予告が書かれていない。">
