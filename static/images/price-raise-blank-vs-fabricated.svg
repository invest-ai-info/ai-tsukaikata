<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img" aria-label="金額を渡さなかったときの回数を示す表。具体的な数字を作り話した回数は3回中0回で、空欄のまま返した回数は3回中3回だった。理由の候補を角括弧で提示した回数は3回中3回だった。下の枠には、角括弧のままコピーして空欄だけ埋めると自分で決めていない理由が本文に残ること、単価・適用日・理由はAIに聞く前に自分で決めてから渡すほうが安全なことが書かれている。">
<style>
