<text class="t" x="18" y="157">空欄のまま返した回数</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="189">理由の候補を角括弧で提示した回数</text>
<rect class="box-good" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<rect class="box-accent" x="18" y="206" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="226">角括弧のままコピーして空欄だけ埋めると、自分で決めていない理由が本文に残る。</text>
<text class="t-accent" x="34" y="244">単価・適用日・理由は、AIに聞く前に自分で決めてから渡すほうが安全。</text>
