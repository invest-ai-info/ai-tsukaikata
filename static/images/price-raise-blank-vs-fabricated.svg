<rect class="bg" x="0" y="0" width="720" height="272"/>
<text class="t-strong" x="18" y="26">金額は作り話にならない。理由の候補は角括弧で出てくる</text>
<text class="t-sm" x="18" y="45">実測2026-11-04。単価・適用日を渡さずに、値上げの連絡メールをAIに作らせた（3回）。</text>
<text class="t-sm" x="18" y="64">具体的な数字を作り話した回数は0回。かわりに理由の候補を角括弧で提案してきた。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">具体的な数字を作り話した回数</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
