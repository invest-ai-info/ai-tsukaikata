<svg xmlns="http://www.w3.org/2000/svg" width="720" height="314" viewBox="0 0 720 314" role="img" aria-label="WeatherNext 2とWeatherNext 3の解像度・更新頻度を比べた表。気温・水分（地表）は25kmから5kmへ、その他の地表変数（風など）は25kmから10kmへ改善した。いっぽう大気の変数（上空の風速など）は25kmのままで変わっていない。更新頻度は6時間ごとから1時間ごとになった。Googleは「全体でおよそ5倍鮮明」と説明しているが、内訳を見ると変数によって改善の度合いが違う。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="314"/>
<text class="t-strong" x="18" y="26">「5倍鮮明」の中身は変数によって違う。大気の変数は25kmのまま</text>
<text class="t-sm" x="18" y="45">Googleは「全体で前の世代のおよそ5倍鮮明」と説明しているが、上がったのは気温・水分と地表変数だけ。</text>
<text class="t-sm" x="18" y="64">上空の風速などの「大気の変数」は、前の世代WeatherNext 2と同じ25kmのまま。</text>
<text class="t-xs" x="18" y="96">項目</text>
<text class="t-xs" x="380" y="96">WeatherNext 2</text>
<text class="t-xs" x="540" y="96">WeatherNext 3</text>
<text class="t" x="18" y="126">気温・水分（地表）</text>
<text class="t-sm" x="380" y="126">25km</text>
<text class="t-good" x="540" y="126">5km</text>
<text class="t" x="18" y="158">その他の地表変数（風など）</text>
<text class="t-sm" x="380" y="158">25km</text>
<text class="t-good" x="540" y="158">10km</text>
<text class="t" x="18" y="190">大気の変数（上空の風速など）</text>
<text class="t-sm" x="380" y="190">25km</text>
<text class="t-bad" x="540" y="190">25km（変わらず）</text>
<text class="t" x="18" y="222">更新頻度</text>
<text class="t-sm" x="380" y="222">6時間ごと</text>
<text class="t-good" x="540" y="222">1時間ごと</text>
<text class="t-xs" x="18" y="274">※ 数値はGoogleの発表ページに書かれている値。「5倍」は全体をならした値で、変数ごとの倍率ではない。</text>
<text class="t-xs" x="18" y="292">※ WeatherNext 2は25kmグリッド・6時間ごとの更新だったと発表ページに明記されている。</text>
</svg>
