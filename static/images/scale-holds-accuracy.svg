<svg xmlns="http://www.w3.org/2000/svg" width="720" height="326" viewBox="0 0 720 326" role="img" aria-label="相手が3から12・20系統に増えても、明確な異常・正常の判定は崩れなかったことを示す表。行は12系統・順序1（2回）、12系統・順序2（並び替え・2回）、20系統・二値判定（2回）。列は真の異常の見逃しと真の正常の誤検知。見逃しは3行とも0（0/8・0/8・0/14）。誤検知も12系統の2条件は0（0/16・0/16）だが、20系統だけ2/26で、これは同じ1系統（基準を4日だけ超えた境界ケース）が2回とも異常側に出たものだと注記されている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="326"/>
<text class="t-strong" x="18" y="26">相手が3→12→20系統に増えても、明確な異常・正常の判定は崩れなかった</text>
<text class="t-sm" x="18" y="45">架空の更新履歴12〜20系統に、相手ごとに基準を計算する同じ指示文を当てた（並び順を変えた版も含む）。</text>
<text class="t-sm" x="18" y="64">見逃し＝真の異常を正常と判定した回数（のべ）。誤検知＝真の正常を異常と判定した回数（のべ）。</text>
<text class="t-sm" x="18" y="83">誤検知2件は、同じ1系統（基準を+4日だけ超えた境界ケース）が2回とも異常側に出たもの。</text>
<text class="t-accent" x="216.0" y="102">真の異常の見逃し</text>
<text class="t-accent" x="468.0" y="102">真の正常の誤検知</text>
<text class="t-sm" x="18" y="133">12系統・順序1</text>
<text class="t-sm" x="18" y="147">(2回)</text>
<rect class="box-good" x="208.0" y="118" width="242.0" height="32" rx="4"/>
<text class="t-good" x="329.0" y="139" text-anchor="middle" style="font-size:14px">0/8</text>
<rect class="box-good" x="460.0" y="118" width="242.0" height="32" rx="4"/>
<text class="t-good" x="581.0" y="139" text-anchor="middle" style="font-size:14px">0/16</text>
<text class="t-sm" x="18" y="191">12系統・順序2</text>
<text class="t-sm" x="18" y="205">(並び替え・2回)</text>
<rect class="box-good" x="208.0" y="176" width="242.0" height="32" rx="4"/>
<text class="t-good" x="329.0" y="197" text-anchor="middle" style="font-size:14px">0/8</text>
<rect class="box-good" x="460.0" y="176" width="242.0" height="32" rx="4"/>
<text class="t-good" x="581.0" y="197" text-anchor="middle" style="font-size:14px">0/16</text>
<text class="t-sm" x="18" y="249">20系統・二値判定</text>
<text class="t-sm" x="18" y="263">(2回)</text>
<rect class="box-good" x="208.0" y="234" width="242.0" height="32" rx="4"/>
<text class="t-good" x="329.0" y="255" text-anchor="middle" style="font-size:14px">0/14</text>
<rect class="box-bad" x="460.0" y="234" width="242.0" height="32" rx="4"/>
<text class="t-bad" x="581.0" y="255" text-anchor="middle" style="font-size:14px">2/26</text>
<text class="t-xs" x="18" y="306">※ 20系統の誤検知2件（同一系統・2回）は「黄信号」を両側（超えたかどうかを問わない）にすると正しく動いた（本文参照）。</text>
</svg>
