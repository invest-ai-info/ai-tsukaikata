<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="同じ3件同時の曖昧なキャンセルを、計算手順を明示した場合と素朴に聞いた場合で比べる図。三日月印刷は基本月額52,000円からオプションA2,000円・オプションB1,500円・オプションC2,500円の3件を引くと確定額46,000円、入金42,000円との差額4,000円が正解。計算手順を明示した5回は全て3件を正しく引いて4,000円に到達。素朴に聞いた5回のうち1回は、オプションCの2,500円を見落として48,500円を確定額とし、不足額を誤って6,500円と計算した。下の枠には、キャンセルの件数が増えるほど、計算の手順を書かない聞き方は見落としや引き算の誤りが起きやすくなること、手順を明示する言い方は何件のキャンセルが重なっても同じ式を繰り返すだけなので件数が増えても崩れにくいことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">素朴な聞き方は、3件のうち1件を見落とすことがあった</text>
<text class="t-sm" x="18" y="45">三日月印刷（基本月額52,000円・3件のキャンセル計6,000円・入金42,000円）を例に比べた（実測はdocs/evidence参照）。</text>
<text class="t-strong" x="18" y="110">①計算手順を明示（5回とも同じ結果）</text>
<rect class="box-quiet" x="18" y="120" width="684" height="28" rx="5"/>
<text class="t" x="34" y="139">52,000円 − 2,000円 − 1,500円 − 2,500円 = 確定額46,000円</text>
<rect class="box-good" x="18" y="152" width="684" height="28" rx="5"/>
<text class="t-good" x="34" y="171">46,000円 − 入金42,000円 = 不足4,000円（正解）</text>
<text class="t-strong" x="18" y="208">②素朴に聞く（5回中1回、3件目を見落とした）</text>
<rect class="box-bad" x="18" y="218" width="684" height="28" rx="5"/>
<text class="t-bad" x="34" y="237">52,000円 − 2,000円 − 1,500円 = 48,500円（オプションC 2,500円を見落とし）</text>
<rect class="box-bad" x="18" y="250" width="684" height="28" rx="5"/>
<text class="t-bad" x="34" y="269">48,500円 − 入金42,000円 = 不足6,500円（誤り）</text>
<rect class="box-accent" x="18" y="288" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="308">⚠️ キャンセルの件数が増えるほど、手順を書かない聞き方は見落としや引き算の誤りが起きやすい</text>
<text class="t-accent" x="34" y="326">✅ 手順を明示する言い方は、何件のキャンセルが重なっても同じ式を繰り返すだけで崩れにくい</text>
</svg>
