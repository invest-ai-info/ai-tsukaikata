<svg xmlns="http://www.w3.org/2000/svg" width="720" height="338" viewBox="0 0 720 338" role="img" aria-label="同じ文字起こし28行を2通りの頼み方で整えさせて、仕込んだ誤りがどうなったかを並べた比較表。仕込みは、文脈から確定できる誤変換5件、文脈から確定できない食い違い2組（40台と50台、加藤と佐藤）、変えてはいけない言い切りの度合い4件。「読みやすく整えてください」と頼むと、誤変換は5件とも直り、食い違いも自発的に指摘されたが、発言の言い回しは28行中12行が元の発言に無い語へ置き換わり（うちの、が弊社に、たぶん、がおそらくに）、言い切りの度合いは4件とも書き換わって、遅れたはずです、が、遅れました、という断定に変わった。直した箇所の申告は誤変換5件だけで、実際に変わった25行に対して大きく足りない。一方、取り除いてよい種類と変えてはいけない種類を並べて渡すと、誤変換の修正5件と食い違いの発見は同じまま、言い回しの置き換えは0行になり、言い切りの度合い4件は原文のまま残り、食い違いには要確認の印が付いて両方残った。どちらの頼み方でも、真値が音源にしか無い、4日、の聞き間違いは見つからない。">
<style>
