    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="338"/>
<text class="t-strong" x="18" y="26">同じ文字起こし28行を、2通りの頼み方で整えさせた結果</text>
<text class="t-sm" x="18" y="45">架空の電話打ち合わせ。誤変換5件・食い違い2組・言い切りの度合い4件を先に仕込んだ。</text>
<text class="t-bad" x="268" y="74">「読みやすく整えて」</text>
<text class="t-accent" x="496" y="74">種類を並べて渡す</text>
<text class="t" x="18" y="108">誤変換5件（人事移動・決済など）</text>
<text class="t-good" x="268" y="108">5/5 直った</text>
<text class="t-good" x="496" y="108">5/5 直った</text>
<text class="t" x="18" y="138">40台/50台・加藤/佐藤の食い違い</text>
<text class="t-good" x="268" y="138">自発的に指摘した</text>
<text class="t-good" x="496" y="138">〔要確認〕を付けて両方残した</text>
<text class="t" x="18" y="168">発言の言い回し（28行）</text>
<text class="t-bad" x="268" y="168">12行が別の語に置き換わった</text>
<text class="t-xs" x="268" y="184">（うちの→弊社・たぶん→おそらく）</text>
<text class="t-good" x="496" y="168">置き換え 0行</text>
<text class="t" x="18" y="214">「たぶん」「はず」など確度4件</text>
<text class="t-bad" x="268" y="214">4件とも書き換わった</text>
<text class="t-xs" x="268" y="230">「遅れたはず」→「遅れました」</text>
<text class="t-good" x="496" y="214">4件とも原文のまま</text>
<text class="t" x="18" y="260">直した箇所の申告</text>
<text class="t-bad" x="268" y="260">誤変換5件だけ</text>
<text class="t-xs" x="268" y="276">（実際に変わったのは25行）</text>
<text class="t-good" x="496" y="260">直した種類を自分から明記</text>
<text class="t-xs" x="18" y="312">※ どちらの頼み方でも修正と発見は同じだけ働く。違いは「発言がその人の言葉のまま残るか」。</text>
<text class="t-xs" x="18" y="328">※ 判定はすべて行差分の機械照合。真値が音源にしか無い「4日」は、どちらの頼み方でも見つからない。</text>
</svg>
