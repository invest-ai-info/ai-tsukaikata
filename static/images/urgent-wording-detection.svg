<svg xmlns="http://www.w3.org/2000/svg" width="720" height="568" viewBox="0 0 720 568" role="img" aria-label="「重要です・見逃すと困ります・よく確認してください」という念押しの一文を足しても、検出できた件数は1つも変わらなかったことを示す図。架空のメルマガ下書き12件・セミナー案内下書き12件の2種に、件名と本文で割引率や参加費が食い違う号・配信や開催の日付が過去になっている号・決まり文句の条件が一部だけ抜けた号を3件ずつ仕込み、材料2本×各2回＝8回を念押しなし・ありの2版で比較した。件名と本文の数字の食い違いは念押しなし4／4・あり4／4、過去日は念押しなし4／4・あり4／4で、どちらも満点かつ念押しの有無で差が無かった。決まり文句の条件が一部だけ抜けた号は念押しなし2／4・あり2／4で、これも念押しの有無では変わらなかった。差が出たのは材料の作り方のほうで、決まり文句の一文をまるごと削った号（セミナー案内）は4／4で気づけたのに対し、条件の一部（金額の下限）だけを削った号（メルマガ）は0／4で気づけなかった。このメルマガに絞って直し方を比べると、念押しなし・ありはどちらも0／2のまま、「似たような文言は他の号と一言一句そろっているか比べて」という一文を足すと1／2、件名と本文の数字を突き合わせ・決まり文句の一致・配信日を本日と比べることをまとめた本番用の指示にすると2／2まで戻った。ただしこの本番用の指示は、正しく10%オフだった号の割引計算を1回だけ誤って指摘するという、新しい誤検知を生んだ。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="568"/>
<text class="t-strong" x="18" y="26">念押しの一文を足しても、検出できた数はどの組も変わらなかった</text>
<text class="t-sm" x="18" y="45">架空のメルマガ下書き12件・セミナー案内下書き12件の2種に、割引率や参加費の食い違い・</text>
<text class="t-sm" x="18" y="64">過去日・決まり文句の条件抜けを3件ずつ仕込んだ。材料2本×各2回＝8回を、念押しの</text>
<text class="t-xs" x="18" y="83">有無で比較した。数字は「検出できた回数／試した回数」（材料2本×各2回＝4回ずつ）。</text>
<text class="t-xs" x="403.0" y="112" text-anchor="middle">念押しなし</text>
<text class="t-xs" x="573.0" y="112" text-anchor="middle">念押しあり</text>
<text class="t" x="18" y="147">件名と本文で数字が食い違う号</text>
<rect class="box-good" x="333" y="126" width="140" height="30" rx="4"/>
<text class="t-good" x="403.0" y="147" text-anchor="middle" style="font-weight:700">4／4</text>
<rect class="box-good" x="503" y="126" width="140" height="30" rx="4"/>
<text class="t-good" x="573.0" y="147" text-anchor="middle" style="font-weight:700">4／4</text>
<text class="t" x="18" y="185">配信・開催日が過去になっている号</text>
<rect class="box-good" x="333" y="164" width="140" height="30" rx="4"/>
<text class="t-good" x="403.0" y="185" text-anchor="middle" style="font-weight:700">4／4</text>
<rect class="box-good" x="503" y="164" width="140" height="30" rx="4"/>
<text class="t-good" x="573.0" y="185" text-anchor="middle" style="font-weight:700">4／4</text>
<text class="t" x="18" y="223">決まり文句の条件が一部だけ抜けた号</text>
<rect class="box-bad" x="333" y="202" width="140" height="30" rx="4"/>
<text class="t-bad" x="403.0" y="223" text-anchor="middle" style="font-weight:700">2／4</text>
<rect class="box-bad" x="503" y="202" width="140" height="30" rx="4"/>
<text class="t-bad" x="573.0" y="223" text-anchor="middle" style="font-weight:700">2／4</text>
<rect class="box-accent" x="18" y="248" width="678" height="50" rx="6"/>
<text class="t-accent" x="34" y="268">3種とも、念押しの有無でびた一つ変わらなかった（4／4と4／4、2／4と2／4）。</text>
<text class="t-accent" x="34" y="286">差が出たのは材料のほう。文をまるごと削った号は4／4、条件だけを削った号は0／4だった。</text>
<text class="t-strong" x="18" y="322">条件が一部だけ抜けた号（メルマガ）に絞ると、直し方で差が出た</text>
<text class="t-sm" x="18" y="362">念押しなし</text>
<rect class="box-bad" x="418" y="342" width="202" height="28" rx="4"/>
<text class="t-bad" x="519.0" y="362" text-anchor="middle" style="font-weight:700">0／2</text>
<text class="t-sm" x="18" y="398">念押しあり</text>
<rect class="box-bad" x="418" y="378" width="202" height="28" rx="4"/>
<text class="t-bad" x="519.0" y="398" text-anchor="middle" style="font-weight:700">0／2</text>
<text class="t-sm" x="18" y="434">「一言一句比べて」と一文足す</text>
<rect class="box-bad" x="418" y="414" width="202" height="28" rx="4"/>
<text class="t-bad" x="519.0" y="434" text-anchor="middle" style="font-weight:700">1／2</text>
<text class="t-sm" x="18" y="470">数字の突合・文言比較・日付確認（本番用）</text>
<rect class="box-good" x="418" y="450" width="202" height="28" rx="4"/>
<text class="t-good" x="519.0" y="470" text-anchor="middle" style="font-weight:700">2／2</text>
<rect class="box-quiet" x="18" y="494" width="678" height="50" rx="6"/>
<text class="t-strong" x="34" y="514">「比べて」の一文は1／2しか戻らなかった。本番用の指示は2／2に戻ったが、</text>
<text class="t-sm" x="34" y="532">正しい号（10%オフ）の割引計算を1回だけ誤って指摘した（新しい誤検知）。</text>
</svg>
