<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="クラウドワークスで納品した記事の著作権がいま誰のものかをAIに実測した結果を示す表。すべて「当たった回数／聞いた回数」で、多いほど良い。素朴に聞いて既定を正しく言えた回数は、プラットフォーム名を出さない4回と「分からなければ」を足した2回を合わせた6回中0回。規約第18条を貼って聞いて正しく言えた回数は4回中4回。あとから「確認済みか推測か」と聞くと、推測だったと認めた回数は2回中2回。下の枠には、素朴に聞いた6回は6回とも規約第18条とは逆方向の説明をしたこと、規約の原文を貼った4回は4回とも正しく答えたこと、最初の回答には推測と事実の境目が無く、聞き直せば2回とも自分から認めたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">規約の中身は、貼らなければ逆に答える</text>
<text class="t-sm" x="18" y="45">実測2026-10-17。クラウドワークス利用規約第18条（著作権は譲渡が無い限りワーカーに帰属）。</text>
<text class="t-sm" x="18" y="64">新規の会話ごとに独立して試した（記憶の共有なし）。合計12回。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">素朴に聞いて、既定（譲渡が無い限りワーカー帰属）を正しく言えた回（6回）</text>
<rect class="box-bad" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="125" text-anchor="middle" style="font-weight:700">0/6</text>
<text class="t" x="18" y="157">規約第18条を貼って聞いて、既定を正しく言えた回（4回）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="189">あとから「確認済みか推測か」と聞くと、推測だったと認めた回（2回）</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="206" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="226">素朴に聞いた6回は、6回とも「検収で著作権が譲渡されるのが一般的」という、</text>
<text class="t-accent" x="34" y="244">規約第18条とは逆方向の説明をした。規約の原文を貼った4回は、4回とも正しく答えた。</text>
<text class="t-accent" x="34" y="262">最初の回答には推測と事実の境目が無かった。聞き直せば2回とも自分から認めた。</text>
</svg>
