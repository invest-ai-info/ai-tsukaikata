<svg xmlns="http://www.w3.org/2000/svg" width="720" height="436" viewBox="0 0 720 436" role="img" aria-label="YouTubeについてAIに聞いた各質問の結果を並べた表。上5行は真値と一致した回数（3回中）で、ウォッチページ広告＝55%が3/3、Shorts広告＝45%が2/3、メンバーシップ等＝70%が3/3、振込の最低額＝8,000円が3/3、しきい値は5段階（真値）と答えた回数は0/3で赤。下2行は誤り・作り話をした回数（少ないほど良い）で、Shorts＝55%と長尺の55%を混同して誤答した回数が1/3、現行の公式ページに無い「登録者500人」条件を書いた回数が1/3、いずれも赤。下の枠には、料率と最低額は3回中2〜3回正確に当たったこと、段階数を聞くと3回とも2段階どまりで公式の表の5行には届かなかったこと、率と最低額は聞いてよいが「これで全部か」は原文の表を自分で見る、という結論が書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="436"/>
<text class="t-strong" x="18" y="26">枠組みと料率は当たる。「何段階あるか」は外れる</text>
<text class="t-sm" x="18" y="45">実測2026-08-30。ウェブ検索を切ったAI（claude -p・独立プロセス）に、各質問を3回ずつ。</text>
<text class="t-sm" x="18" y="64">上5行＝真値と一致した回数（多いほど良い）。下2行＝誤り・作り話をした回数（少ないほど良い）。</text>
<text class="t-xs" x="448.0" y="108" text-anchor="middle">3回中</text>
<text class="t" x="18" y="143">ウォッチページ広告＝55%が正解</text>
<rect class="box-good" x="348" y="122" width="200" height="26" rx="4"/>
<text class="t-good" x="448.0" y="143" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="175">Shorts広告＝45%が正解</text>
<rect class="box" x="348" y="154" width="200" height="26" rx="4"/>
<text class="t-sm" x="448.0" y="175" text-anchor="middle" style="font-weight:700">2/3</text>
<text class="t" x="18" y="207">メンバーシップ等＝70%が正解</text>
<rect class="box-good" x="348" y="186" width="200" height="26" rx="4"/>
<text class="t-good" x="448.0" y="207" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="239">振込の最低額＝8,000円が正解</text>
<rect class="box-good" x="348" y="218" width="200" height="26" rx="4"/>
<text class="t-good" x="448.0" y="239" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="271">しきい値は5段階（真値）と答えた</text>
<rect class="box-bad" x="348" y="250" width="200" height="26" rx="4"/>
<text class="t-bad" x="448.0" y="271" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="303">Shorts＝55%と誤答（長尺と混同）</text>
<rect class="box-bad" x="348" y="282" width="200" height="26" rx="4"/>
<text class="t-bad" x="448.0" y="303" text-anchor="middle" style="font-weight:700">1/3</text>
<text class="t" x="18" y="335">現行に無い「登録者500人」条件</text>
<rect class="box-bad" x="348" y="314" width="200" height="26" rx="4"/>
<text class="t-bad" x="448.0" y="335" text-anchor="middle" style="font-weight:700">1/3</text>
<rect class="box-accent" x="18" y="352" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="372">料率と最低額は3回中2〜3回、正確に当たった（Shortsの45%だけ1回が長尺と同じ55%に化けた）。</text>
<text class="t-accent" x="34" y="390">「段階数」を聞くと3回とも2段階どまりで、公式の表にある5行には届かなかった。</text>
<text class="t-accent" x="34" y="408">＝率と最低額は聞いてよい。「これで全部か」は原文の表を自分で見る。</text>
</svg>
