<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" role="img" aria-label="材料が壊れた日に、返りが異常を指摘したかどうかを4つの異常と3つの頼み方で並べた表。中身が完全に同じ行が3組ある件は、そのまま頼んだ4回で4回、自動実行の形に短くした4回で2回、点検の欄を作った4回で4回。途中で切れている行も同じく4回・2回・4回。日付が1日古いことは、そのまま頼んだ4回で0回、短くした4回でも0回、今日の日付をこちらから渡した3回では3回とも指摘した。毎日ある種類が今日は0件だったことは、そのまま頼んだ4回で0回、短くした4回でも0回、毎日ある種類の名前をこちらから渡した2回では2回とも指摘した。下の2つは材料の中を読んでも決まらないもので、今日が何日か、普段は何件かという情報をAIは持っていない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="448"/>
<text class="t-strong" x="18" y="26">材料が壊れた日に、返りがそれを言ってくるか</text>
<text class="t-sm" x="18" y="45">架空の日次の記録2本（表形式・走り書き）に、同じ4つの異常を仕込んで走らせた。</text>
<text class="t-sm" x="18" y="64">分母は走らせた回数。③は、その項目を点検の欄に入れた回だけを数えている。</text>
<rect class="box-quiet" x="300" y="92" width="132" height="46" rx="3"/>
<text class="t-strong" x="308" y="112" style="font-size:12px">① そのまま頼む</text>
<text class="t-xs" x="308" y="128">毎朝の集計を頼むだけ</text>
<rect class="box-quiet" x="438" y="92" width="132" height="46" rx="3"/>
<text class="t-strong" x="446" y="112" style="font-size:12px">② 自動実行の形に短く</text>
<text class="t-xs" x="446" y="128">「この2つ以外は書かない」</text>
<rect class="box-quiet" x="576" y="92" width="132" height="46" rx="3"/>
<text class="t-strong" x="584" y="112" style="font-size:12px">③ 点検の欄を作る</text>
<text class="t-xs" x="584" y="128">数と日付を先に書かせる</text>
<text class="t" x="18" y="173">中身が完全に同じ行（3組）</text>
<rect class="box-good" x="300" y="144" width="132" height="48" rx="3"/>
<text class="t-good" x="350" y="173">4/4</text>
<rect class="box-accent" x="438" y="144" width="132" height="48" rx="3"/>
<text class="t-accent" x="488" y="173">2/4</text>
<rect class="box-good" x="576" y="144" width="132" height="48" rx="3"/>
<text class="t-good" x="626" y="173">4/4</text>
<text class="t" x="18" y="227">途中で切れている行（1行）</text>
<rect class="box-good" x="300" y="198" width="132" height="48" rx="3"/>
<text class="t-good" x="350" y="227">4/4</text>
<rect class="box-accent" x="438" y="198" width="132" height="48" rx="3"/>
<text class="t-accent" x="488" y="227">2/4</text>
<rect class="box-good" x="576" y="198" width="132" height="48" rx="3"/>
<text class="t-good" x="626" y="227">4/4</text>
<text class="t" x="18" y="281">日付が1日古い（昨日ぶんではない）</text>
<rect class="box-bad" x="300" y="252" width="132" height="48" rx="3"/>
<text class="t-bad" x="350" y="281">0/4</text>
<rect class="box-bad" x="438" y="252" width="132" height="48" rx="3"/>
<text class="t-bad" x="488" y="281">0/4</text>
<rect class="box-good" x="576" y="252" width="132" height="48" rx="3"/>
<text class="t-good" x="626" y="281">3/3</text>
<text class="t" x="18" y="335">毎日ある種類が、今日は0件</text>
<rect class="box-bad" x="300" y="306" width="132" height="48" rx="3"/>
<text class="t-bad" x="350" y="335">0/4</text>
<rect class="box-bad" x="438" y="306" width="132" height="48" rx="3"/>
<text class="t-bad" x="488" y="335">0/4</text>
<rect class="box-good" x="576" y="306" width="132" height="48" rx="3"/>
<text class="t-good" x="626" y="335">2/2</text>
<text class="t-bad" x="18" y="380">※ 下の2行は、材料の中を読んでも決まらない。今日が何日か・普段は何件かをAIは持っていない。</text>
<text class="t-xs" x="18" y="402">※ ②で 2/4 になったのは、表形式の材料2回で警告が丸ごと消えたため（走り書きの材料2回では残った）。</text>
<text class="t-xs" x="18" y="424">架空データでの実測。指示文ごとの生の返りは docs/evidence/ に置いてある。</text>
</svg>
