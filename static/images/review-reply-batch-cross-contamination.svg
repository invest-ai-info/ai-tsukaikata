<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="3件まとめて処理したときに別の口コミの情報として取り違える「混線」が起きた割合を示す横棒グラフ。素朴な一括依頼は6回中2回(33.3%)で混線が起きた。「個人情報には触れないでください」を足すと6回中0回(0%)に消えた。">
<style>
