<rect class="bg" x="0" y="0" width="720" height="280"/>
<text class="t-strong" x="18" y="26">別の口コミの情報として取り違える「混線」は、まとめ処理だけで起きた</text>
<text class="t-sm" x="18" y="45">口コミ1件ずつ処理した前作には存在しなかった失敗モード。3件まとめた6回中2回で、スタッフ名が別の口コミの説明として書かれた。</text>
