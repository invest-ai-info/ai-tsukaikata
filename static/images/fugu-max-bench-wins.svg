<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Sakana AI が発表ページに載せた比較グラフで、Fugu Max が最高値だった項目の数を示した図。10項目のうち6項目で最高、残り4項目は他のモデルのほうが上だった。上だった例として、HLE(text)はFugu Maxの44.7に対しKimi K3が46.9、DeepSWEは70.8に対しGemini 3.8 Flashが73.7、CharXiv Reasoning（道具なし）は88.1に対しQwen3.8-maxが88.4、Chartographyは37.0に対しGemini 3.8 Flashが40.9。表を作ったのはSakana AIであり、相手の会社が同じ条件で測った値ではない。">
