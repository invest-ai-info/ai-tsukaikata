<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-label="3つの検査と、それぞれが捕まえる壊れ方の対応表。HTTPステータスが200かはページが落ちたことを、中身のサイズが一定以上かは生成が途中で切れたことを、ページに書かれた更新日が今日かは更新が止まったことを捕まえる。3つ目だけが静かな故障を捕まえられる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .box-warn { fill: #fdf6e8; stroke: #d4a72c; stroke-width: 1.3; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13.5px; font-weight: 700; }
  .t-bad { fill: #b02020; font-size: 13px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 13px; font-weight: 700; }
  .t-warn { fill: #8a6100; font-size: 12px; }
  .mono { fill: #1f2328; font-size: 13px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .mono-big { fill: #1f2328; font-size: 21px; font-weight: 700; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .mono-sm { fill: #616b76; font-size: 11px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .line { stroke: #8b949e; stroke-width: 1.4; fill: none; }
  .line-quiet { stroke: #d5dae0; stroke-width: 1; fill: none; }
  .head { fill: #8b949e; }
  .bar { fill: #c8d1da; }
  .bar-hot { fill: #d92b2b; }
  .bar-pick { fill: #1a56b8; }
  .dot-ok { fill: #1a7f37; }
  .dot-skip { fill: #d92b2b; }
  .dot-idle { fill: #c8d1da; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .box-warn { fill: #2b2415; stroke: #a68321; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .t-warn { fill: #e0b644; }
    .mono { fill: #e6e9ec; }
    .mono-big { fill: #e6e9ec; }
    .mono-sm { fill: #9aa4ae; }
    .line { stroke: #6e7781; }
    .line-quiet { stroke: #363c43; }
    .head { fill: #6e7781; }
    .bar { fill: #3a424a; }
    .bar-hot { fill: #f07a7a; }
    .bar-pick { fill: #7ab0ff; }
    .dot-ok { fill: #57ab68; }
    .dot-skip { fill: #f07a7a; }
    .dot-idle { fill: #3a424a; }
  }
</style>

<rect class="bg" x="0" y="0" width="720" height="250" rx="8"/>

<text class="t-strong" x="24" y="34">「正常」を外から測れる形に言い換える</text>

<rect class="box" x="24" y="54" width="216" height="118" rx="7"/>
<text class="t-strong" x="40" y="80">① HTTP 200 か</text>
<text class="t-sm" x="40" y="106">捕まえるもの</text>
<text class="t" x="40" y="128">ページが落ちた</text>
<text class="t-xs" x="40" y="156">派手に壊れるので自分で気づく</text>

<rect class="box" x="252" y="54" width="216" height="118" rx="7"/>
<text class="t-strong" x="268" y="80">② サイズが十分か</text>
<text class="t-sm" x="268" y="106">捕まえるもの</text>
<text class="t" x="268" y="128">生成が途中で切れた</text>
<text class="t-xs" x="268" y="156">5000バイト未満なら異常、など</text>

<rect class="box-accent" x="480" y="54" width="216" height="118" rx="7"/>
<text class="t-accent" x="496" y="80">③ 更新日が今日か</text>
<text class="t-sm" x="496" y="106">捕まえるもの</text>
<text class="t-accent" x="496" y="128">更新が止まった</text>
<text class="t-xs" x="496" y="156">これだけが静かな故障を捕まえる</text>

<rect class="box-warn" x="24" y="188" width="672" height="46" rx="7"/>
<text class="t-warn" x="42" y="210">まず③だけ作れば、静かな故障の大半は捕まります。</text>
<text class="t-warn" x="42" y="230">完璧を目指して作らずに終わるより、今日動かすほうがずっと有効です。</text>
</svg>
