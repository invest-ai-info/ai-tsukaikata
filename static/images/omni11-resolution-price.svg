<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" role="img" aria-label="Gemini Omni 1.1 Flash の解像度別・動画1秒あたりの価格を示した横棒グラフ。360p（下書き）は0.03ドル、720p（標準）は0.10ドル、1080pは0.15ドル、4Kは0.30ドル。360pから4Kまでで価格は10倍になる。価格は発表ページに埋め込まれた表の画像から読み取ったもので、本文のテキストではない。40秒のフル尺を作ると360pなら1.20ドル、4Kなら12ドルになる（この記事の計算）。トークン単位の課金では、720pは秒あたり約0.10ドル相当と公式ドキュメントが説明している。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="342"/>
<text class="t-strong" x="18" y="26">解像度が上がるほど、秒あたりの値段は上がる</text>
<text class="t-sm" x="18" y="45">Gemini Omni 1.1 Flash の動画1秒あたりの価格（ドル）。</text>
<text class="t-sm" x="18" y="64">360pの下書きと4Kの本番出力では、同じ長さでも10倍の差になる。</text>
<text class="t" x="18" y="96.0">360p（下書き）</text>
<rect class="bar-in" x="210" y="78" width="41.0" height="26" rx="3"/>
<text class="t-sm" x="259.0" y="96.0">$0.03／秒</text>
<text class="t" x="18" y="142.0">720p（標準）</text>
<rect class="bar-in" x="210" y="124" width="136.7" height="26" rx="3"/>
<text class="t-sm" x="354.7" y="142.0">$0.10／秒</text>
<text class="t" x="18" y="188.0">1080p</text>
<rect class="bar-in" x="210" y="170" width="205.0" height="26" rx="3"/>
<text class="t-sm" x="423.0" y="188.0">$0.15／秒</text>
<text class="t" x="18" y="234.0">4K</text>
<rect class="bar-new" x="210" y="216" width="410.0" height="26" rx="3"/>
<text class="t-sm" x="628.0" y="234.0">$0.30／秒</text>
<text class="t-xs" x="18" y="286">※ 価格は発表ページに埋め込まれた表の画像から読み取った（本文のテキストではない）。</text>
<text class="t-xs" x="18" y="304">※ 40秒のフル尺を作ると、360pなら$1.20、4Kなら$12になる（この記事の計算）。</text>
<text class="t-xs" x="18" y="322">※ トークン単位の課金では、720pは秒あたり約$0.10相当と公式ドキュメントが説明している。</text>
</svg>
