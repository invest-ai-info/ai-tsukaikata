<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-label="材料A(Webサイト保守契約・つばさ商会)は、2件分のキャンセルを別々の文に分けて書いている。「6月12日、オプションA(3,500円)をキャンセルされたとの連絡があり、返金対応済みです。6月28日、別件でオプションB(2,500円)もキャンセルされたとの連絡があり、合わせて返金対応済みです。」材料B(SNS運用代行契約・はるか美容室)は、2件分を別の段(改行で分離)に書いている。「ストーリーズ投稿オプション(4,500円)のキャンセル連絡があり、返金対応済みです。(空行)後日、ハイライト編集オプション(1,500円)についても別途キャンセルの連絡があり、返金対応済みです。」下の枠には、どちらも26回とも2件分を正しく両方引いて4,000円・3,000円に到達したこと、1件だけ引く崩れ方は出なかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="372"/>
<text class="t-strong" x="18" y="26">2件分のキャンセル額を、どう分散させたか</text>
<text class="t-sm" x="18" y="45">前の記事（二・三件同時のキャンセル実測）は、2〜3件分を同じ1文の中に書いていた。</text>
<rect class="box-good" x="18" y="96" width="684" height="100" rx="6"/>
<text class="t-strong" x="34" y="118">材料A（Webサイト保守契約・つばさ商会）＝別々の文</text>
<text class="t-good" x="34" y="138">「6月12日、オプションA（3,500円）をキャンセルされたとの連絡があり、返金対応済みです。</text>
<text class="t-good" x="34" y="157">6月28日、別件でオプションB（2,500円）もキャンセルされたとの連絡があり、合わせて返金対応済みです。」</text>
<rect class="box-good" x="18" y="210" width="684" height="100" rx="6"/>
<text class="t-strong" x="34" y="232">材料B（SNS運用代行契約・はるか美容室）＝別の段（改行で分離）</text>
<text class="t-good" x="34" y="252">「ストーリーズ投稿オプション（4,500円）のキャンセル連絡があり、返金対応済みです。</text>
<text class="t-good" x="34" y="271">（空行）後日、ハイライト編集オプション（1,500円）についても別途キャンセルの連絡があり、返金対応済みです。」</text>
<rect class="box-accent" x="18" y="324" width="684" height="28" rx="6"/>
<text class="t-accent" x="34" y="344">どちらも、26回とも2件分を正しく両方引いた（4,000円・3,000円）。1件だけ引く崩れ方は出なかった。</text>
</svg>
