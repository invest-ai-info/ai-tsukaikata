<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="月数の記載が無い一括価格の出品を、10件の中に混ぜて判定させた実測結果を示す表。元記事（3ヶ月パック・月数を明記した版、6回）は4回正解で黄、材料M（SNS運用代行・月数の記載なし、3回）は3回正解で緑、材料Mの並べ替え版（1番目に提示、3回）も3回正解で緑、材料N（別業種・ライティング代行・月数の記載なし、3回）も3回正解で緑、単独で聞いた4回（材料M・N各1件）も4回正解で緑。下の枠には、月数を書かない版は10件に混ぜても並べ替えても単独で聞いても13回中13回正しく判定したこと、これは月数を明記した元記事の版より崩れなかったこと、「複数回分をまとめて」という言葉だけで気づいていたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">月数を書かなくても、まとめ割・セット料金の言葉だけで気づいた</text>
<text class="t-sm" x="18" y="45">実測2026-11-18。「3ヶ月パック」のように月数を書かず、「まとめ割」「セット料金」とだけ書いた。</text>
<text class="t-sm" x="18" y="64">元記事（月数明記あり・6回）と比べると、月数を書かない版（8回）のほうが崩れなかった。</text>
<text class="t-xs" x="538.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">元記事（3ヶ月パック・月数を明記、6回）</text>
<rect class="box" x="458" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="538.0" y="125" text-anchor="middle" style="font-weight:700">4/6</text>
<text class="t" x="18" y="157">材料M（SNS運用代行・月数の記載なし、3回）</text>
<rect class="box-good" x="458" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="157" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="189">材料M・並べ替え（1番目に提示、3回）</text>
<rect class="box-good" x="458" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">材料N（別業種・ライティング代行・月数の記載なし、3回）</text>
<rect class="box-good" x="458" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="253">単独で聞く（材料M・N各1件、計4回）</text>
<rect class="box-good" x="458" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="253" text-anchor="middle" style="font-weight:700">4/4</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">月数を書かず「まとめ割」「セット料金」とだけ書いた版は、10件に混ぜても並べ替えても</text>
<text class="t-accent" x="34" y="308">単独で聞いても、13回中13回正しく「月額ではない」と判定した。月数を明記した元記事の</text>
<text class="t-accent" x="34" y="326">版（4/6）より崩れなかった。「複数回分をまとめて」という言葉だけで気づいていた。</text>
</svg>
