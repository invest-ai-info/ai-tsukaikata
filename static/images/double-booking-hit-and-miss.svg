<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="複数クライアントの予定の重複検出を6種類の聞き方で試した結果を示す表。基本形（候補1〜5のうち空きを判定）3/3、候補を1つずつ理由付きで判定（5候補×3回=15判定）15/15、生成形（候補を渡さずAIに提案させる）3/3、罠1（隙間のない2件の予定に候補がまたがるケース）3/3、罠2（後から4人目の予定を追記するケース）3/3、応用（頼み方のチェックリスト化）2/2、いずれも全部が当たりで塗られている。下の枠には、17回とも複数クライアントの予定の重複を正しく検出したこと、罠1でも両方との重複を指摘したこと、罠2でも後出しの情報を正しく取り込んで判定を更新したことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">複数クライアントの予定の重複は、17回とも見落とされなかった</text>
<text class="t-sm" x="18" y="45">候補の判定・候補を渡さない生成・境界をまたぐ難しい候補・後出し情報・チェックリスト化で試した。</text>
<text class="t-sm" x="18" y="64">罠1＝隙間のない2件の予定に候補がまたがるケース。罠2＝後から4人目の予定を追記するケース。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">基本形（候補1〜5のうち空きを判定）</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="157">候補を1つずつ理由付きで判定（5候補×3回）</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">15/15</text>
<text class="t" x="18" y="189">生成形（候補を渡さずAIに提案させる）</text>
<rect class="box-good" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">罠1（隙間のない2件にまたがる候補）</text>
<rect class="box-good" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="253">罠2（後から4人目の予定を追記）</text>
<rect class="box-good" x="398" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="253" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="285">応用（頼み方のチェックリスト化）</text>
<rect class="box-good" x="398" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="285" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">17回とも、複数クライアントの予定の重複を正しく検出した。</text>
<text class="t-accent" x="34" y="340">罠1＝隙間のない2件にまたがる候補でも、3回とも両方との重複を指摘した。</text>
<text class="t-accent" x="34" y="358">罠2＝後から追記された4人目の予定も、3回とも正しく取り込んで判定を更新した。</text>
</svg>
