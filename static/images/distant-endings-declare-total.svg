<svg xmlns="http://www.w3.org/2000/svg" width="720" height="344" viewBox="0 0 720 344" role="img" aria-label="材料Eで、見出しの総数の宣言のさせ方によって数字がそろうかを示した表。素朴に「指摘して」と頼んだ5回では、総数を明記した回は2回、そろった回も2回（どちらも8）。総数を先に明記させる言い方に変えた3回では、総数を明記した回・そろった回ともに3回で、3回とも同じ10という数字だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="344"/>
<text class="t-strong" x="18" y="26">材料Eで、見出しの数字は宣言のさせ方で変わるか</text>
<text class="t-sm" x="18" y="45">材料Eは素朴に頼むと、filler文の「〜ます」の連続まで数に入るかどうかで数字が揺れた。</text>
<text class="t-sm" x="18" y="64">分母は試した回数。「そろった」は、明記した回どうしで同じ数字だったかを見ている。</text>
<rect class="box-quiet" x="248" y="92" width="200" height="46" rx="3"/>
<text class="t-strong" x="256" y="112" style="font-size:12px">総数を明記した回</text>
<text class="t-xs" x="256" y="128">回答の冒頭か最後に数字を書いたか</text>
<rect class="box-quiet" x="458" y="92" width="200" height="46" rx="3"/>
<text class="t-strong" x="466" y="112" style="font-size:12px">数字がそろった回</text>
<text class="t-xs" x="466" y="128">明記した中で、同じ数字だったか</text>
<text class="t" x="18" y="175">素朴に「指摘して」（5回）</text>
<rect class="box-accent" x="248" y="146" width="200" height="48" rx="3"/>
<text class="t-accent" x="332" y="175">2/5</text>
<rect class="box-accent" x="458" y="146" width="200" height="48" rx="3"/>
<text class="t-accent" x="542" y="175">2/5</text>
<text class="t" x="18" y="231">総数を先に明記させる（3回）</text>
<rect class="box-good" x="248" y="202" width="200" height="48" rx="3"/>
<text class="t-good" x="332" y="231">3/3</text>
<rect class="box-good" x="458" y="202" width="200" height="48" rx="3"/>
<text class="t-good" x="542" y="231">3/3</text>
<text class="t-xs" x="18" y="276">※ 素朴に頼んだ5回中、数字を明記しなかった3回は「そろった」の分母から外している。</text>
<text class="t-xs" x="18" y="298">※ 明記させた3回は、3回とも「10」で一致（5パターン＋filler文の4〜5か所を含む数字）。</text>
<text class="t-xs" x="18" y="320">架空データでの実測。指示文ごとの生の返りは docs/evidence/ に置いてある。</text>
</svg>
