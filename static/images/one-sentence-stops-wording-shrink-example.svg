</style>
<rect class="bg" x="0" y="0" width="720" height="366"/>
<text class="t-strong" x="18" y="26">数字を5つ含む約230字の1文でも、2回とも一字一句そのまま残った</text>
<text class="t-sm" x="18" y="45">材料F（契約条件の打ち合わせメモ）。初回ロット数・単価・納期・指摘件数・支払期日の5つの数字を含む。</text>
<rect class="box-quiet" x="18" y="100" width="684" height="40" rx="5"/>
<text class="t" x="32" y="125" style="font-size:11.5px">入力「初回ロットは5,000個、単価は1個あたり128円、納期は発注から45日後…」（約230字）</text>
<rect class="box-good" x="18" y="150" width="684" height="40" rx="5"/>
<text class="t-good" x="32" y="175" style="font-size:11.5px">1回目の出力＝入力と1字一句一致（5,000個・128円・45日後・3件・30日以内、すべて保持）</text>
<rect class="box-good" x="18" y="200" width="684" height="40" rx="5"/>
<text class="t-good" x="32" y="225" style="font-size:11.5px">2回目の出力＝入力と1字一句一致（同上）</text>
<rect class="box-quiet" x="18" y="250" width="684" height="40" rx="5"/>
<text class="t" x="32" y="275" style="font-size:11.5px">日付＝2026-06-04（2回とも正しい。前作から数えて記録最後の行の翌日）</text>
<rect class="box-accent" x="18" y="300" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="320">📌 長い1文・複数の数字を含む材料でも、一字一句保持の一文があれば2回とも短縮されなかった。</text>
<text class="t-accent" x="34" y="338">⚠️ この記事が実測したのは1種類の長文のみ。もっと長い資料や表形式には別の確認が要る。</text>
