<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-label="理由文をどちらに寄せても、重大4件と軽い4件の順位帯が同じ位置に留まることを示す図。材料A・『優先順位をつけて』だけの指示・1回目の並べ替え結果を3条件で比べた。横軸は並べ替え結果の順位（1〜20位）。『全部に理由あり』は、重大4件（TB1・TB2・TB3・TB4）が7位・8位・9位・10位、軽い4件（TA1・TA2・TA3・TA4）が17位・18位・19位・20位。『重大4件だけ理由あり』は、重大4件が5位・6位・7位・8位、軽い4件が17位・18位・19位・20位。『軽い4件だけ理由あり』は、重大4件が8位・9位・10位・11位、軽い4件が17位・18位・19位・20位。3条件とも、重大4件は5位から11位の帯に、軽い4件は17位から20位の帯に収まり、理由文をどちらに寄せても順位帯そのものは入れ替わらなかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="352"/>
<text class="t-strong" x="18" y="26">理由文をどちらに寄せても、重大4件・軽い4件の順位帯は同じ位置</text>
<text class="t-sm" x="18" y="45">材料A・「優先順位をつけて」だけの指示・1回目の並べ替え結果を、3条件で比べた。</text>
<text class="t-sm" x="18" y="64">中間12件はどの条件でも理由文のまま。動かしたのは重大4件・軽い4件のどちらにラベルを使うかだけ。</text>
<text class="t-xs" x="18" y="83">横軸は並べ替え結果の順位（1〜20位）。青＝重大4件（TB1〜TB4）・灰＝軽い4件（TA1〜TA4）。</text>
