<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="300件のログを材料2本（SNS監視・問い合わせ監視）×分け方2通り×各2回、合計16回試した結果を示す表。すべて「境界の新着を正しく拾えた件数／仕込んだ件数」で、多いほど良い。素朴な指示文・100件ごと3分割（境界の上）は8件中8件、素朴な指示文・150件ごと2分割（中ほど）も8件中8件、チャンクごとに都度判定してから最後に聞き直す進め方の3分割（境界の上）も8件中8件、同じ進め方の2分割（中ほど）も8件中8件で、いずれも仕込んだ新着を取りこぼさなかった。下の枠には、境界の真上でも中ほどでも合計32件の仕込みを見逃した回は0件、誤検知も0件だったこと、何ターンも前のチャンクの新着も最後にまとめて聞くと正しく拾えていたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">境界の上でも、新着2件は32件中32件とも見逃されなかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-05。300件のログを材料2本（SNS監視・問い合わせ監視）×分け方2通り×各2回＝16回試した。</text>
<text class="t-sm" x="18" y="64">すべて「境界の新着を正しく拾えた件数／仕込んだ件数」で、多いほど良い（誤検知は16回とも0件）。</text>
<text class="t-xs" x="538.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">素朴な指示文・100件ごと3分割（境界の上）</text>
<rect class="box-good" x="458" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="125" text-anchor="middle" style="font-weight:700">8/8</text>
<text class="t" x="18" y="157">素朴な指示文・150件ごと2分割（中ほど）</text>
<rect class="box-good" x="458" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="157" text-anchor="middle" style="font-weight:700">8/8</text>
<text class="t" x="18" y="189">チャンクごとに都度判定→最後に聞き直す・3分割（境界の上）</text>
<rect class="box-good" x="458" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="189" text-anchor="middle" style="font-weight:700">8/8</text>
<text class="t" x="18" y="221">チャンクごとに都度判定→最後に聞き直す・2分割（中ほど）</text>
<rect class="box-good" x="458" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="538.0" y="221" text-anchor="middle" style="font-weight:700">8/8</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">境界の真上に乗る分け方（3分割）でも、チャンクの中ほどに収まる分け方（2分割）でも、</text>
<text class="t-accent" x="34" y="276">合計32件の仕込みを見逃した回は0件、無関係な行を新着に数えた誤検知も0件だった。</text>
<text class="t-accent" x="34" y="294">何ターンも前のチャンクに入っていた新着も、最後にまとめて聞くと正しく拾えていた。</text>
</svg>
