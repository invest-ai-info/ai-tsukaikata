<svg xmlns="http://www.w3.org/2000/svg" width="720" height="434" viewBox="0 0 720 434" role="img" aria-label="集計欄をデータのすぐ下・同じ列に置いた架空の表2本（経費精算・倉庫入出庫）に、行が増えても直さなくていい数式を頼んだ結果を示す図。経費精算は1回目・2回目は気づかず、3回目は気づいた。倉庫入出庫は3回とも気づかなかった。6回のうち、集計行自身が範囲に含まれる問題に自分から気づいたのは1回だけ(17%)。気づかなかった数式を実際にExcelへ入れると、①数式のセル自身が参照範囲に含まれるため循環参照の警告が出る、②合計行の部署名・倉庫名が検索条件と一致し、合計に自分自身が混入する、のどちらかが起き、正しい合計にはならない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="434"/>
<text class="t-strong" x="18" y="26">集計欄をデータの真下・同じ列に置くと、6回中5回すり抜けた</text>
<text class="t-sm" x="18" y="45">「行が増えても直さなくていい形にしてください」と頼んだ。集計行自身が参照範囲に</text>
<text class="t-sm" x="18" y="64">含まれる問題（循環参照・二重計上）に、AIが自分から触れたかを○×で示す。</text>
<text class="t-xs" x="18" y="83">材料2本（経費精算・倉庫入出庫）×各3回=6回。前の記事ではこの注意を4回とも自分から言えていた。</text>
<text class="t-xs" x="263.0" y="116" text-anchor="middle">1回目</text>
<text class="t-xs" x="413.0" y="116" text-anchor="middle">2回目</text>
<text class="t-xs" x="563.0" y="116" text-anchor="middle">3回目</text>
<text class="t" x="18" y="152">経費精算（部署ごと）</text>
<rect class="box-bad" x="198" y="130" width="130" height="32" rx="4"/>
<text class="t-bad" x="263.0" y="152" text-anchor="middle" style="font-weight:700">気づかず</text>
<rect class="box-bad" x="348" y="130" width="130" height="32" rx="4"/>
<text class="t-bad" x="413.0" y="152" text-anchor="middle" style="font-weight:700">気づかず</text>
<rect class="box-good" x="498" y="130" width="130" height="32" rx="4"/>
<text class="t-good" x="563.0" y="152" text-anchor="middle" style="font-weight:700">気づいた</text>
<text class="t" x="18" y="194">倉庫入出庫（倉庫ごと）</text>
<rect class="box-bad" x="198" y="172" width="130" height="32" rx="4"/>
<text class="t-bad" x="263.0" y="194" text-anchor="middle" style="font-weight:700">気づかず</text>
<rect class="box-bad" x="348" y="172" width="130" height="32" rx="4"/>
<text class="t-bad" x="413.0" y="194" text-anchor="middle" style="font-weight:700">気づかず</text>
<rect class="box-bad" x="498" y="172" width="130" height="32" rx="4"/>
<text class="t-bad" x="563.0" y="194" text-anchor="middle" style="font-weight:700">気づかず</text>
<rect class="box-accent" x="18" y="226" width="678" height="60" rx="6"/>
<text class="t-accent" x="34" y="250" style="font-weight:700">6回のうち、自分から気づいたのは1回だけ（17%）</text>
<text class="t-sm" x="34" y="270">残り5回は列全体参照の数式をそのまま返した。</text>
<text class="t-strong" x="18" y="310">気づかなかった数式を、実際にExcelへ入れると</text>
<rect class="box-bad" x="18" y="332" width="678" height="78" rx="6"/>
<text class="t-bad" x="34" y="354" style="font-weight:700">①循環参照の警告が出る（数式のセル自身が参照範囲に含まれるため）</text>
<text class="t-bad" x="34" y="376" style="font-weight:700">②合計行の部署名・倉庫名が検索条件と一致し、合計に自分自身が混入する</text>
<text class="t-sm" x="34" y="396">どちらの場合も、正しい合計（例: 営業部54,700円）にはならない。</text>
</svg>
