<svg xmlns="http://www.w3.org/2000/svg" width="720" height="512" viewBox="0 0 720 512" role="img" aria-label="素朴に「要約してください」と頼んだときに、何が残って何が落ちたかを並べた図。教材は架空の社内通知で、落としてはいけない情報を14件、先に決めてある。残ったのは4件で、9月1日に新システム稼働、8月28日18時が締切、45時間超は事前申請、交通費の上限35,000円。落ちたのは10件で、ただし書きが3件（残業申請は9月4日まで、管理職1名なら承認1名、新幹線通勤は据え置き）、条件が1件（スマホ打刻は社内Wi-Fiのみ）、禁止が1件（移行3日間は打刻しない）、対象外が1件（警備担当の契約社員12名）、自分の作業が1件（3日以内にパスワード変更）、結果が1件（未変更は9月8日に停止）、期限が1件（旧データは2027年3月に削除）、窓口が1件（電話では受け付けない）。残ったのは主語が大きい話ばかりで、誰に効くか・いつまでかは落ちている。原文54文のうち、ただし書き・禁止・対象外を含む文は10文あったが、そのうち要約に残ったものは0文だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="512"/>
<text class="t-strong" x="18" y="26">「次の文書を要約してください」だけで頼んだとき、何が残ったか</text>
<text class="t-sm" x="18" y="45">落としてはいけない情報14件を先に決めてから要約させ、機械で1件ずつ照合した。</text>
<text class="t-good" x="18" y="82">残った　4件</text>
<text class="t-bad" x="372" y="82">落ちた　10件</text>
<rect class="box-good" x="18" y="96" width="330" height="30" rx="6"/>
<text class="t-good" x="30" y="116">9月1日に新システム稼働</text>
<rect class="box-good" x="18" y="134" width="330" height="30" rx="6"/>
<text class="t-good" x="30" y="154">8月28日18:00が締切</text>
<rect class="box-good" x="18" y="172" width="330" height="30" rx="6"/>
<text class="t-good" x="30" y="192">45時間超は事前申請</text>
<rect class="box-good" x="18" y="210" width="330" height="30" rx="6"/>
<text class="t-good" x="30" y="230">交通費の上限35,000円</text>
<text class="t-xs" x="18" y="260">残ったのは、文書の主語が大きい話ばかり。</text>
<text class="t-xs" x="18" y="278">「誰に効くか」「いつまでか」は右へ移った。</text>
<rect class="box-bad" x="372" y="96" width="330" height="30" rx="6"/>
<text class="t-xs" x="384" y="116">ただし書き</text>
<text class="t-bad" x="450" y="116">残業申請は9月4日まで</text>
<rect class="box-bad" x="372" y="134" width="330" height="30" rx="6"/>
<text class="t-xs" x="384" y="154">ただし書き</text>
<text class="t-bad" x="450" y="154">管理職1名なら承認1名</text>
<rect class="box-bad" x="372" y="172" width="330" height="30" rx="6"/>
<text class="t-xs" x="384" y="192">ただし書き</text>
<text class="t-bad" x="450" y="192">新幹線通勤は据え置き</text>
<rect class="box-bad" x="372" y="210" width="330" height="30" rx="6"/>
<text class="t-xs" x="384" y="230">条件</text>
<text class="t-bad" x="450" y="230">スマホ打刻は社内Wi-Fiのみ</text>
<rect class="box-bad" x="372" y="248" width="330" height="30" rx="6"/>
<text class="t-xs" x="384" y="268">禁止</text>
<text class="t-bad" x="450" y="268">移行3日間は打刻しない</text>
<rect class="box-bad" x="372" y="286" width="330" height="30" rx="6"/>
<text class="t-xs" x="384" y="306">対象外</text>
<text class="t-bad" x="450" y="306">警備担当の契約社員12名</text>
<rect class="box-bad" x="372" y="324" width="330" height="30" rx="6"/>
<text class="t-xs" x="384" y="344">作業</text>
<text class="t-bad" x="450" y="344">3日以内にパスワード変更</text>
<rect class="box-bad" x="372" y="362" width="330" height="30" rx="6"/>
<text class="t-xs" x="384" y="382">結果</text>
<text class="t-bad" x="450" y="382">未変更は9月8日に停止</text>
<rect class="box-bad" x="372" y="400" width="330" height="30" rx="6"/>
<text class="t-xs" x="384" y="420">期限</text>
<text class="t-bad" x="450" y="420">旧データは2027年3月に削除</text>
<rect class="box-bad" x="372" y="438" width="330" height="30" rx="6"/>
<text class="t-xs" x="384" y="458">窓口</text>
<text class="t-bad" x="450" y="458">電話では受け付けない</text>
<text class="t-xs" x="18" y="498">※ 原文54文のうち、ただし書き・禁止・対象外を含む文は10文。そのうち要約に残ったのは0文だった。</text>
</svg>
