<svg xmlns="http://www.w3.org/2000/svg" width="720" height="503" viewBox="0 0 720 503" role="img" aria-label="前の世代 Qwen3.7-Max と Qwen3.8-Max の点数を比べた横棒グラフ。DeepSWE 1.1 は21.6から56.6、PaperBench は64.8から93.0、Terminal Bench 2.1 は74.5から86.6、JobBench は31.3から53.4、SWE-bench Pro は60.6から67.7、IFBench は79.1から82.8、HLE は41.4から43.6へ上がった。モデルカードで数字が出ている30項目すべてで上がっており、下がった項目は1つもない。モデルカードには単位の記載がなく、テストの中身も測り方も別々のため平均は取れない。">
<style>
