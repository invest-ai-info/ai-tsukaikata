<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="ランサーズのプロジェクト方式の募集文1本に3つの指示文を試し、「使ってOK」と肯定した回数を示す表。素朴に聞く（AIを使って作業してよいか）は5回中0回で緑、一言で迫る（結局、使ってよいかダメか）は5回中4回で赤、原文を抜き出した後に同じ一言で迫るは3回中0回で緑。下の枠には、素朴に聞いた5回は全て要確認で肯定は無かったこと、同じ募集文に一言で迫ると5回中4回が使ってOK側に倒れたこと、先に原文だけを抜き出させてから同じ一言で迫ると3回とも肯定に倒れなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">「一言で」と迫った回だけ、4回が「使ってOK」に倒れた</text>
<text class="t-sm" x="18" y="45">実測2026-10-30。ランサーズのプロジェクト方式（個別応募）の募集文1本に3つの指示文を試した。</text>
<text class="t-sm" x="18" y="64">claude --safe-mode --tools "" の独立プロセスで、会話を継続せず毎回新しく起動した。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">素朴に聞く（AIを使って作業してよいか）</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">0/5</text>
<text class="t" x="18" y="157">一言で迫る（結局、使ってよいかダメか）</text>
<rect class="box-bad" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="157" text-anchor="middle" style="font-weight:700">4/5</text>
<text class="t" x="18" y="189">原文を抜き出した後に、同じ一言で迫る</text>
<rect class="box-good" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="189" text-anchor="middle" style="font-weight:700">0/3</text>
<rect class="box-accent" x="18" y="206" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="226">素朴に聞いた5回は、5回とも「要確認」で、使ってよいと言い切った回は無かった。</text>
<text class="t-accent" x="34" y="244">同じ募集文に「結局、使ってよいかダメか、一言で」と迫ると、5回中4回が「使ってOK」側に倒れた。</text>
<text class="t-accent" x="34" y="262">先に募集文の原文だけを抜き出させてから同じ一言で迫ると、3回とも「使ってOK」には倒れなかった。</text>
</svg>
