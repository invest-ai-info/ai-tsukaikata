<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="process=P1〜P4を1本のログに混ぜ、4本同時停止（正常な基準点が記録に無い構成）とP1だけ停止（3本が正常に残る構成）の2パターンに、単数形「いちばん異常な処理はどれですか」と複数形「処理ごとに計算して」を各2回試した結果を示す表。4本同時停止での単数形は0/2で、2回とも停止そのものを理由にせず、別の小さな特徴を代わりに答えた（1回目はP3、2回目はP1で、2回の答えが一致しなかった）。4本同時停止での複数形は2/2で、4本すべてを正しく「該当あり」にできた。P1だけ停止では、単数形も複数形も2/2でP1を正しく名指しできた。下の枠には、4本同時停止では単数形が2回とも「複数の処理が同時に止まった状態は1処理の異常ではない」と自分で理由をつけて除外し、別の小さな特徴を代わりに答えたこと、その答えは2回で違う処理だったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
