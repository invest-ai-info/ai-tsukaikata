  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">基準点が無いと、単数形は停止そのものを答えから自分で除外した</text>
<text class="t-sm" x="18" y="45">実測2026-11-13。4本同時停止（正常な処理が記録に無い）と、P1だけ停止（3本が正常）の2構成。</text>
<text class="t-sm" x="18" y="64">単数形「いちばん異常な処理は」と、複数形「処理ごとに計算して」を各2回試した。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">4本同時停止：単数形が停止そのものを理由に答えたか</text>
<rect class="box-bad" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="518.0" y="125" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="157">4本同時停止：複数形が4本を漏れなく「該当あり」にできたか</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="189">P1だけ停止：単数形がP1を正しく名指しできたか</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="221">P1だけ停止：複数形がP1だけを正しく「該当あり」にできたか</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">4本同時停止では、単数形は2回とも「複数の処理が同時に止まった状態は、1処理の異常ではない」と</text>
<text class="t-accent" x="34" y="276">自分で理由をつけて除外し、別の小さな特徴（P3→P1）を代わりに答えた。答えは2回で違う処理だった。</text>
</svg>
