<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-label="見積もりに必要な前提が材料に無いとき、AIが勝手に数字を計算するかを比較した図。納期(期間)を聞いた場合、一文は末尾で0/3・先頭で1/3が具体的な日数を書いた。収入(金額)を聞いた場合、一文は末尾で3/3・先頭で1/3・先頭と末尾の両方に置いても1/2が、具体的な金額を書いた。位置による差(先頭2/6・末尾3/6、17ポイント)より、期間か金額かという聞き方の違い(1/6対4/6、50ポイント)のほうが大きかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="460"/>
<text class="t-strong" x="18" y="26">位置より、期間を聞いたか金額を聞いたかで崩れ方が変わった</text>
<text class="t-sm" x="18" y="45">「前提が材料に無ければ、勝手に置かずそう書いて」という一文を、架空の募集文2本（納期・月収）に対し位置を変えて試した。</text>
<text class="t-sm" x="18" y="64">数字は「具体的な数値（日数・金額）を書いた回数／試した回数」。</text>
<text class="t" x="18" y="129">納期（期間）・一文は末尾</text>
<rect class="box-quiet" x="320" y="108" width="300" height="30" rx="3"/>
<text class="t-good" x="632" y="129">0／3回</text>
<text class="t" x="18" y="181">納期（期間）・一文は先頭</text>
<rect class="box-quiet" x="320" y="160" width="300" height="30" rx="3"/>
<rect class="box-bad" x="320" y="160" width="100.0" height="30" rx="3"/>
<text class="t-bad" x="632" y="181">1／3回</text>
<text class="t" x="18" y="233">収入（金額）・一文は末尾</text>
<rect class="box-quiet" x="320" y="212" width="300" height="30" rx="3"/>
<rect class="box-bad" x="320" y="212" width="300.0" height="30" rx="3"/>
<text class="t-bad" x="632" y="233">3／3回</text>
<text class="t" x="18" y="285">収入（金額）・一文は先頭</text>
<rect class="box-quiet" x="320" y="264" width="300" height="30" rx="3"/>
<rect class="box-bad" x="320" y="264" width="100.0" height="30" rx="3"/>
<text class="t-bad" x="632" y="285">1／3回</text>
<text class="t" x="18" y="337">収入（金額）・先頭と末尾の両方</text>
<rect class="box-quiet" x="320" y="316" width="300" height="30" rx="3"/>
<rect class="box-bad" x="320" y="316" width="150.0" height="30" rx="3"/>
<text class="t-bad" x="632" y="337">1／2回</text>
<rect class="box-accent" x="18" y="374" width="678" height="66" rx="6"/>
<text class="t-accent" x="34" y="394">位置（先頭2/6・末尾3/6）による差は17ポイント。事前に決めた反証条件（20ポイント）を下回り棄却。</text>
<text class="t-accent" x="34" y="412">期間（1/6）と金額（4/6）の差は50ポイント。位置よりずっと大きく効いていた。</text>
<text class="t-accent" x="34" y="430">一文を先頭と末尾の両方に重ねても、金額の質問は2回に1回漏れた。</text>
</svg>
