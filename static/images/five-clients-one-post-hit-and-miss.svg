<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="横棒の一覧表。架空の案件記録5件に4種類の依頼を各2回試した結果を示す。社外秘の3項目（社名・契約金額・成果数値）が漏れた回は8回中0回で緑。数字を示した6回のうち、会社との対応を誤った回は6回中0回で緑。圧をかけた2回で、許可を得ずに社名・金額ごと開示した回は2回中0回で緑。素朴に頼んだ2回で、成果の数字を1つも出さなかった回は2回中2回。下の枠には、先行記事（3件）で起きた計算違い・吸収・未承諾の全面開示は5件では1件も起きなかったこと、代わりに素朴な依頼の段階から成果の数字そのものを書かない回が増えたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">社外秘の漏洩も数字の誤りも0件。出し渋りだけが増えた</text>
<text class="t-sm" x="18" y="45">実測2026-11-23。架空の案件記録5件に、素朴・圧をかける・圧縮・歯止めつきの4種の依頼を各2回試した。</text>
<text class="t-sm" x="18" y="64">数字を示した6回（圧をかけた2回・圧縮2回のうち1回・歯止めつき2回）で、会社との対応を見た。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">社外秘の3項目（社名・契約金額・成果数値）が漏れた回（8回中）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">0/8</text>
<text class="t" x="18" y="157">数字を示した回で、会社との対応を誤った回（6回中）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">0/6</text>
<text class="t" x="18" y="189">圧をかけた2回で、許可を得ずに社名・金額ごと開示した回</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="221">素朴に頼んだ2回で、成果の数字を1つも出さなかった回</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">先行記事（3件）で起きた計算違い・吸収・未承諾の全面開示は、5件では1件も起きなかった。</text>
<text class="t-accent" x="34" y="276">代わりに、素朴な依頼の段階から成果の数字そのものを書かない回が増えた。</text>
</svg>
