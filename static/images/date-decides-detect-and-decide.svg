<text class="t-sm" x="18" y="337">※ 版bの1回だけ、問い合わせ返信の宛先という組自体に触れなかった（18回中1回）。</text>
<text class="t-good" x="18" y="358">※ 日付がある2組を古い方の値で確定した回は、版b・cとも12回中0回。</text>
<text class="t-xs" x="18" y="379">架空データでの実測。生の返り18通は docs/evidence/ に全文置いてある。</text>
