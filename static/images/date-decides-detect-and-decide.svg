<rect class="bg" x="0" y="0" width="720" height="395"/>
<text class="t-strong" x="18" y="26">確定できるのは日付がある組だけ。日付が無い組は、どの版でも確定しない</text>
<text class="t-sm" x="18" y="45">架空のメモ12枚に矛盾4組（うち2組は各メモに絶対日付あり）を仕込み、指示文を3版・各6回＝全18回、独立したサブプロセスに送った。</text>
<text class="t-sm" x="18" y="64">セルの数＝「要確認」と書かずに片方を『いま使う内容』として確定できた回数（6回中）。</text>
<text class="t-sm" x="18" y="83">版b＝「日付が新しいほうを採る。日付が無い組は決めない」を追加。版c＝版bのあと同じ会話で、決めた内容を実際の経費一覧に使わせた。</text>
<text class="t-xs" x="278.0" y="120">版a：そのまま</text>
<text class="t-xs" x="420.0" y="120">版b：＋日付ルール</text>
<text class="t-xs" x="562.0" y="120">版c：＋下流課題</text>
