<svg xmlns="http://www.w3.org/2000/svg" width="720" height="395" viewBox="0 0 720 395" role="img" aria-label="4組の矛盾を版ごとに確定できた回数で並べたマス目。行は経費精算の承認ライン（日付あり）・見積書を送る順番（日付あり）・資料へのグラフ（日付なし）・問い合わせ返信の宛先（日付なし）。列は版a（そのまま）・版b（日付ルールを追加）・版c（同じ会話で下流課題）。日付がある2組は版aで6回中0回しか確定せず要確認のままだったが、版bと版cでは6回とも確定した。日付が無い2組は3版とも6回中0回で、確定せず要確認のままだった。日付がある2組を古い方の値で確定した回は版b・cとも12回中0回だった。">
