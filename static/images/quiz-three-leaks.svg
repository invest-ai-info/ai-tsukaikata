<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-label="出題させたときに起きる3つの漏れと、それぞれを止める一言をまとめた図。1つ目は「出ない」＝後ろの条から1問も出ないので、「条ごとに最低1問ずつ出して」と足す。2つ目は「無い話」＝教材に無い言葉で出題するので、「書いてあることだけから出して」と足す。3つ目は「理由違い」＝正解だが根拠が別の条なので、「根拠の一文をそのまま引用して」と足す。3つ目は答えが合っているため、読んでも気づけない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="352"/>
<text class="t-strong" x="18" y="26">出題させると漏れは3種類。どれも一言で止まる</text>
<text class="t-sm" x="18" y="45">架空の規程で実際に出題させて出たもの。3つとも原文と突き合わせて確かめた。</text>
<text class="t-xs" x="144" y="78">何が起きるか</text>
<text class="t-xs" x="414" y="78">足す一言</text>
<rect class="box-bad" x="18" y="88" width="108" height="62" rx="6"/>
<text class="t-bad" x="32" y="124">出ない</text>
<rect class="box-quiet" x="144" y="88" width="252" height="62" rx="6"/>
<text class="t" x="158" y="124">後ろの条から1問も出ない</text>
<rect class="box-good" x="414" y="88" width="288" height="62" rx="6"/>
<text class="t-good" x="428" y="124">条ごとに最低1問ずつ出して</text>
<rect class="box-bad" x="18" y="166" width="108" height="62" rx="6"/>
<text class="t-bad" x="32" y="202">無い話</text>
<rect class="box-quiet" x="144" y="166" width="252" height="62" rx="6"/>
<text class="t" x="158" y="202">教材に無い言葉で出題する</text>
<rect class="box-good" x="414" y="166" width="288" height="62" rx="6"/>
<text class="t-good" x="428" y="202">書いてあることだけから出して</text>
<rect class="box-bad" x="18" y="244" width="108" height="62" rx="6"/>
<text class="t-bad" x="32" y="280">理由違い</text>
<rect class="box-quiet" x="144" y="244" width="252" height="62" rx="6"/>
<text class="t" x="158" y="280">正解だが根拠が別の条</text>
<rect class="box-good" x="414" y="244" width="288" height="62" rx="6"/>
<text class="t-good" x="428" y="280">根拠の一文をそのまま引用して</text>
<text class="t-xs" x="18" y="338">※ 3つ目がいちばん見つけにくい。答えが合っているので、読んでも気づけない。</text>
</svg>
