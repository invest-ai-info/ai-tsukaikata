<svg xmlns="http://www.w3.org/2000/svg" width="720" height="276" viewBox="0 0 720 276" role="img" aria-label="WeatherNext 3の降水予報の精度改善を、比較対象別に示した横棒グラフ。衛星観測（IMERG）との比較では最大60%改善、レーダー観測網（MRMS）との比較では最大30%改善、雨量計の観測との比較では最大10%改善。いずれも中期予報の早い予報時間でのCRPS（正解との近さを測る指標）の改善幅で、Google発表の「最大」の値。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="276"/>
<text class="t-strong" x="18" y="26">降水の予報精度は、何と比べるかで改善幅が違う</text>
<text class="t-sm" x="18" y="45">Googleが発表ページで挙げた、中期予報でのCRPS（正解との近さを測る指標）の改善幅。比較対象によって60%・30%・10%と差がある。</text>
<text class="t-sm" x="18" y="64">早い予報時間（early lead times）での値で、いずれも「最大」の数字。</text>
<text class="t" x="18" y="114">衛星観測（IMERG）との比較</text>
<rect class="bar-new" x="280" y="96" width="222.0" height="24" rx="3"/>
<text class="t-sm" x="510.0" y="114">最大60%改善</text>
<text class="t" x="18" y="154">レーダー観測網（MRMS）との比較</text>
<rect class="bar-in" x="280" y="136" width="111.0" height="24" rx="3"/>
<text class="t-sm" x="399.0" y="154">最大30%改善</text>
<text class="t" x="18" y="194">雨量計の観測との比較</text>
<rect class="bar-old" x="280" y="176" width="37.0" height="24" rx="3"/>
<text class="t-sm" x="325.0" y="194">最大10%改善</text>
<text class="t-xs" x="18" y="236">※ CRPSは値が小さいほど正確という指標。「改善」はCRPSが小さくなったという意味です。</text>
<text class="t-xs" x="18" y="256">※ 3つの数字は同じ地域・同じ予報時間で同時に出た値とは限りません。</text>
</svg>
