<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="経費規程の該当条文を3回ずつ判定させた結果を、カテゴリ別に示した横棒グラフ。素直に1条へ当たる申請20件は20件とも3回そろって正解、隣接条・除外条項と紛らわしい申請12件も12件とも正解、規程のどこにも無い申請16件も16件とも正解で、3種類とも100%だった。判定はのべ144件で、3回の答えが割れた項目・真値と食い違った項目はどちらも0件。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="320"/>
<text class="t-strong" x="18" y="26">3回そろって正解した件数（材料A・Bあわせて48件）</text>
<text class="t-sm" x="18" y="45">架空の経費規程7条に照らして、申請一覧24件×2本を、新規の会話で3回ずつ判定させた。</text>
<text class="t-sm" x="18" y="64">3回の答えが割れた項目、真値と食い違った項目は、どちらも0件だった。</text>
<text class="t-sm" x="18" y="83">「紛らわしい」12件には、除外条項に当たる5件・上限超過でも条文自体は該当する1件を含む。</text>
<text class="t" x="18" y="130">素直に1条へ当たる申請（20件）</text>
<rect class="box-quiet" x="300" y="108" width="320" height="32" rx="3"/>
<rect class="box-good" x="300" y="108" width="320.0" height="32" rx="3"/>
<text class="t-good" x="632" y="130">20 / 20件</text>
<text class="t" x="18" y="192">隣接条・除外条項と紛らわしい申請（12件）</text>
<rect class="box-quiet" x="300" y="170" width="320" height="32" rx="3"/>
<rect class="box-good" x="300" y="170" width="320.0" height="32" rx="3"/>
<text class="t-good" x="632" y="192">12 / 12件</text>
<text class="t" x="18" y="254">規程のどこにも無い申請（16件）</text>
<rect class="box-quiet" x="300" y="232" width="320" height="32" rx="3"/>
<rect class="box-good" x="300" y="232" width="320.0" height="32" rx="3"/>
<text class="t-good" x="632" y="254">16 / 16件</text>
<text class="t-xs" x="18" y="306">※ 判定はのべ144件（24件×2材料×3回）。生の回答は docs/evidence/ に全文置いてある。</text>
</svg>
