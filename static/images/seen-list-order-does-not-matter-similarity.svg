<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-label="既読リストの並び順3条件が、投稿一覧の時系列順とどれだけ一致していたかを示す横棒グラフ。元の順は定義上100%。近い順(一部だけ入れ替え)は平均33.8%。シャッフル(全くのランダム)は平均3.2%。一致度がここまで違っても、新着の見逃し・誤検知はどの条件も0/18だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="372"/>
<text class="t-strong" x="18" y="26">並びの一致度は3%から100%まで大きく違うが、見逃しはどれも0件</text>
<text class="t-sm" x="18" y="45">一致度＝既読ID一覧の各位置のIDが、時系列順(投稿一覧と同じ順)の一覧と同じ位置に来ていた割合。</text>
<text class="t-sm" x="18" y="64">系列A・B・C（計3本）の平均値。シャッフルは一致度3.2%とほぼ無関係な並びだった。</text>
<text class="t-sm" x="18" y="83">それでも新着の見逃し・誤検知は、元の順・近い順・シャッフルのどの条件も0/18だった（上の表）。</text>
<line class="line" x1="190.0" y1="142" x2="190.0" y2="148"/>
<text class="t-xs" x="190.0" y="136" text-anchor="middle">0%</text>
<line class="line" x1="300.0" y1="142" x2="300.0" y2="148"/>
<text class="t-xs" x="300.0" y="136" text-anchor="middle">25%</text>
<line class="line" x1="410.0" y1="142" x2="410.0" y2="148"/>
<text class="t-xs" x="410.0" y="136" text-anchor="middle">50%</text>
<line class="line" x1="520.0" y1="142" x2="520.0" y2="148"/>
<text class="t-xs" x="520.0" y="136" text-anchor="middle">75%</text>
<line class="line" x1="630.0" y1="142" x2="630.0" y2="148"/>
<text class="t-xs" x="630.0" y="136" text-anchor="middle">100%</text>
<line class="line" x1="190.0" y1="145" x2="630.0" y2="145"/>
<text class="t" x="18" y="166">元の順</text>
<text class="t-xs" x="18" y="180">(時系列のまま)</text>
<rect class="box" x="190.0" y="161.0" width="440.0" height="22"/>
<rect class="bar-old" x="190.0" y="161.0" width="440.0" height="22"/>
<text class="t-strong" x="638.0" y="177" style="font-size:12.5px">100.0%</text>
<text class="t" x="18" y="240">近い順</text>
<text class="t-xs" x="18" y="254">(一部だけ入れ替え)</text>
<rect class="box" x="190.0" y="235.0" width="440.0" height="22"/>
<rect class="bar-new" x="190.0" y="235.0" width="148.7" height="22"/>
<text class="t-strong" x="346.7" y="251" style="font-size:12.5px">33.8%</text>
<text class="t" x="18" y="314">シャッフル</text>
<text class="t-xs" x="18" y="328">(全くのランダム)</text>
<rect class="box" x="190.0" y="309.0" width="440.0" height="22"/>
<rect class="bar-new" x="190.0" y="309.0" width="14.1" height="22"/>
<text class="t-strong" x="212.1" y="325" style="font-size:12.5px">3.2%</text>
</svg>
