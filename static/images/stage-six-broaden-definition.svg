<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" role="img" aria-label="工程6の指示文に「『今週中』等の言い回しも期限が分かっているに含める」を足した前後を比べる横棒グラフ。材料A-2は元の指示（日付のみ）で12件中3件、言い直し後は12件中12件に回復した。材料B-1（記載なしのみ）は言い直し後も0件で変わらず安全だった。材料B-2（記載なしに加え希望する利用日『9月5日・6日』という罠を含む）は言い直し後に0件から1件へ変化し、希望日を期限として誤って拾う結果になった。いずれも2回とも同じ値だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="284"/>
<text class="t-strong" x="18" y="24">「今週中」を救うと、材料B-2では希望日が期限に化ける</text>
<text class="t-sm" x="18" y="43">工程6の指示文に「日付だけでなく『今週中』等の言い回しも含める」を足して、再度各2回試した。</text>
<text class="t-sm" x="18" y="62">縦軸は「期限が分かっている」と判定された件数（12件中）。値は2回とも同じだった。</text>
<text class="t-xs" x="18" y="81">材料A-2は3→12件に回復。材料B-1（記載なしのみ）は0件のまま変わらず安全だった。</text>
<text class="t-xs" x="18" y="100">材料B-2は0→1件に変化し、希望する利用日「9月5日・6日」を期限として誤って拾った（2/2）。</text>
<text class="t" x="18" y="133">材料A-2　元の指示（日付のみ）</text>
<rect class="box-bad" x="330.0" y="122" width="75.0" height="14" rx="3"/>
<text class="t-bad" x="642.0" y="133">3／12件</text>
<text class="t" x="18" y="167">材料A-2　言い直し後（今週中も含む）</text>
<rect class="box-good" x="330.0" y="156" width="300.0" height="14" rx="3"/>
<text class="t-good" x="642.0" y="167">12／12件</text>
<text class="t" x="18" y="201">材料B-1　言い直し後（記載なし12件）</text>
<rect class="box-quiet" x="330.0" y="190" width="3.0" height="14" rx="3"/>
<text class="t-good" x="642.0" y="201">0／12件</text>
<text class="t" x="18" y="235">材料B-2　言い直し後（希望日の罠あり）</text>
<rect class="box-bad" x="330.0" y="224" width="25.0" height="14" rx="3"/>
<text class="t-bad" x="642.0" y="235">1／12件</text>
<path class="line" d="M330.0 114 L330.0 236" stroke-dasharray="4 3"/>
</svg>
