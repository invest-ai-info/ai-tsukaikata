<rect class="bg" x="0" y="0" width="720" height="352"/>
<text class="t-strong" x="18" y="26">条ごとに誤報を4週重ねても、条5（未変更）は4週とも5/5検出・巻き添え0件</text>
<text class="t-sm" x="18" y="45">架空の受注ログ点検5条・材料32行×2系列。週ごとに条1→条2→条3→条4の順で誤報を1つ除外。</text>
<text class="t-sm" x="18" y="64">本物の異常5件（条5の担当者欄空欄を含む）と、既に除外した誤報の再混入を、週末ごとに機械で確認した。</text>
