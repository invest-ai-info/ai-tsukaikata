<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-label="条ごとに誤報の除外を4週積み重ねても、他の条が巻き添えにならないことを示す表。行は週0（基準）から週4（条4除外）まで、列は系列A（一般化型の除外）と系列B（行specific型の除外）。すべての行・列で「5/5検出・巻き添え0件」。条5（担当者欄空欄）は週1〜4のどの週も一度も編集していない対照条件だが、それでも5/5検出・巻き添え0件のまま変わらなかった。">
<style>
