<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="毎朝の受入検品で、全数確認と抜き取り3件の「見た項目に対する判定」の正しさを比べた表。全数確認4回・不良20件中、正しく不合格にした数は20/20。全数確認4回・良品60件中、誤って不合格にした数は0/60。抜き取り3件で選ばれた不良3件中、正しく不合格にした数は3/3。抜き取り3件で選ばれた良品3件中、誤って不合格にした数は0/3。下の枠には、見た項目に対する判定は6回とも外れなかったこと（見逃しゼロ・誤検知ゼロ）、抜き取り3件の問題は判定の精度ではなく20件中17件をそもそも見ていないことという結論が書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">見た項目の判定は、全数確認でも抜き取りでも外れなかった</text>
<text class="t-sm" x="18" y="45">実測2026-09-26。納品記録20件に境界線上の不良5件（重量差1〜2g・期限差1〜6日・型番1文字）を仕込んだ。</text>
<text class="t-sm" x="18" y="64">全数確認4回（B・C）と抜き取り3件2回（A）。「/」の右が確認できた件数、左が正しく判定できた件数。</text>
<text class="t-xs" x="378.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">全数確認4回・不良20件中、正しく不合格にした数</text>
<rect class="box-good" x="298" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="378.0" y="125" text-anchor="middle" style="font-weight:700">20/20</text>
<text class="t" x="18" y="157">全数確認4回・良品60件中、誤って不合格にした数</text>
<rect class="box-good" x="298" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="378.0" y="157" text-anchor="middle" style="font-weight:700">0/60</text>
<text class="t" x="18" y="189">抜き取り3件で選ばれた不良3件中、正しく不合格にした数</text>
<rect class="box-good" x="298" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="378.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">抜き取り3件で選ばれた良品3件中、誤って不合格にした数</text>
<rect class="box-good" x="298" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="378.0" y="221" text-anchor="middle" style="font-weight:700">0/3</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">見た項目に対する判定は、6回とも外れなかった（見逃しゼロ・誤検知ゼロ）。</text>
<text class="t-accent" x="34" y="276">抜き取り3件の問題は判定の精度ではなく、20件中17件をそもそも見ていないこと。</text>
</svg>
