<svg xmlns="http://www.w3.org/2000/svg" width="720" height="326" viewBox="0 0 720 326" role="img" aria-label="チャンネルでの作業とDMで、請求先と上限がどう分かれるかを示した図。チャンネルでの作業は、組織の使用残高（usage balance）に請求され、上限は管理者が決めるspend limit。Teamプランは残高を入金するまで反応しない。DM（個人チャット）は、送った本人のシートに請求され、上限はそのシートのふだんの利用上限で、組織のspend limitとは無関係。下の警告枠には、Teamは残高を入金するまでチャンネルで一切返信しないこと、Enterprise（請求書払い）は自分で上限を決めない限り上限が無いことが書かれている。注釈として、spend limitは定価で数えるため値引き契約があっても上限には反映されず請求時にだけ反映されること、DMは組織のspend limitを消費せず送った本人のふだんの利用上限だけが働くことが添えられている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="326"/>
<text class="t-strong" x="18" y="26">請求先は、チャンネル作業とDMで別の財布に分かれる</text>
<text class="t-sm" x="18" y="45">公式ドキュメント「Set a spend limit」に書かれている請求の仕組みをそのまま並べた。</text>
<text class="t-sm" x="18" y="64">上限を決めていない場合、何が起きるかは2つの財布で違う。</text>
<rect class="box-accent" x="18.0" y="96" width="332.0" height="100" rx="6"/>
<text class="t-accent" x="34.0" y="120" style="font-weight:700">チャンネルでの作業</text>
<text class="t-sm" x="34.0" y="142">請求先＝組織の使用残高（usage balance）</text>
<text class="t-sm" x="34.0" y="161">上限＝管理者が決めた spend limit</text>
<text class="t-sm" x="34.0" y="180">Team は残高を入金するまで反応しない</text>
<rect class="box-quiet" x="370.0" y="96" width="332.0" height="100" rx="6"/>
<text class="t" x="386.0" y="120" style="font-weight:700">DM（個人チャット）</text>
<text class="t-sm" x="386.0" y="142">請求先＝送った本人のシート</text>
<text class="t-sm" x="386.0" y="161">上限＝そのシートのふだんの利用上限</text>
<text class="t-sm" x="386.0" y="180">組織の spend limit とは無関係</text>
<rect class="box-bad" x="18" y="212" width="684" height="58" rx="6"/>
<text class="t-bad" x="34" y="234">Team は残高を入金するまで、チャンネルで一切返信しない。</text>
<text class="t-bad" x="34" y="254">Enterprise（請求書払い）は、自分で上限を決めない限り、上限が無い。</text>
<text class="t-xs" x="18" y="282">※ spend limit は「定価」で数える。値引き契約があっても、上限には反映されず請求時にだけ反映される（同ページ）。</text>
<text class="t-xs" x="18" y="300">※ DMは組織の spend limit を消費しない。消費するのは、送った本人のふだんの利用上限だけ。</text>
</svg>
