<svg xmlns="http://www.w3.org/2000/svg" width="720" height="276" viewBox="0 0 720 276" role="img" aria-label="エージェント型の動画理解に切り替えたときの3つの変化を示した横棒グラフ。トークン消費は最大88%減、コストは最大66%減、精度（品質）は最大7%向上。いずれもGoogleが発表ページで挙げた「標準的なベンチマークでの最大値」で、個々のベンチマーク名や中間の数値は公表されていない。対象はGemini 3.7 Flash・3.6 Flash・3.5 Flash-Liteで、効果は長尺の動画ほど大きい。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="276"/>
<text class="t-strong" x="18" y="26">エージェント型に切り替えると、トークンは最大88%減る</text>
<text class="t-sm" x="18" y="45">Googleが発表ページで挙げた3つの数字。標準的な動画分析ベンチマークで、静的処理（1FPSで一律に読む）と比べた「最大」の値です。</text>
<text class="t-sm" x="18" y="64">個々のベンチマーク名や中間の数値は公表されていません。</text>
<text class="t" x="18" y="114">トークン消費</text>
<rect class="bar-new" x="160" y="96" width="431.2" height="24" rx="3"/>
<text class="t-sm" x="599.2" y="114">最大88%減</text>
<text class="t" x="18" y="154">コスト</text>
<rect class="bar-in" x="160" y="136" width="323.4" height="24" rx="3"/>
<text class="t-sm" x="491.4" y="154">最大66%減</text>
<text class="t" x="18" y="194">精度（品質）</text>
<rect class="bar-old" x="160" y="176" width="34.3" height="24" rx="3"/>
<text class="t-sm" x="202.3" y="194">最大7%向上</text>
<text class="t-xs" x="18" y="236">※ 「最大」なので、動画の長さや内容によってはここまで変わりません。3つの数字は同じ1本の動画で同時に出た値とは限りません。</text>
<text class="t-xs" x="18" y="256">※ 対象は Gemini 3.7 Flash・3.6 Flash・3.5 Flash-Lite。効果が最も大きいのは長尺の動画です。</text>
</svg>
