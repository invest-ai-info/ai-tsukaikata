<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" role="img" aria-label="文末パターンを5つに増やしたときに、見出しの文が宣言する数字が実際の5と一致した回数を示す表。材料A（清掃当番メモ）は素朴に「指摘して」と頼んだ5回とも5か所と一致した。材料B（備品発注引き継ぎメモ）は素朴に頼むと5回中2回しか一致せず、総数を先に明記させると3回とも一致し、総数を最後に明記させた1回も一致した。材料Aで総数を先に明記させた確認の1回も一致した。下の枠には、材料Aは4パターン時と同じく崩れなかったこと、材料Bは新しい5つ目「ということになります」が既存の「次第です」と1つの項目にまとめられ見出しが4か所になったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="336"/>
<text class="t-strong" x="18" y="26">5パターンに増やしても材料Aは崩れない。材料Bは新しい崩れ方で5回中2回しか一致しない</text>
<text class="t-sm" x="18" y="45">「文末表現が不自然に連続している箇所を指摘して」に対し、見出しの数字が実際の5と一致した回数。</text>
<text class="t-sm" x="18" y="64">材料Bだけ食い違う。総数を先または最後に明記させると、材料Bも3/3・1/1で一致した。</text>
<text class="t-xs" x="458.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">材料A・素朴に「指摘して」(5パターン)</text>
<rect class="box-good" x="378" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="125" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="157">材料B・素朴に「指摘して」(5パターン)</text>
<rect class="box" x="378" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="458.0" y="157" text-anchor="middle" style="font-weight:700">2/5</text>
<text class="t" x="18" y="189">材料B・総数を先に明記</text>
<rect class="box-good" x="378" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">材料B・総数を最後に明記</text>
<rect class="box-good" x="378" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="221" text-anchor="middle" style="font-weight:700">1/1</text>
<text class="t" x="18" y="253">材料A・総数を先に明記(確認)</text>
<rect class="box-good" x="378" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="253" text-anchor="middle" style="font-weight:700">1/1</text>
<rect class="box-accent" x="18" y="270" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="290">材料Aは4パターン時と同じく崩れなかった。5パターンでも本文の列挙は5回とも5グループ同格だった。</text>
<text class="t-accent" x="34" y="308">材料Bは5回中3回、新しい5つ目「ということになります」が「次第です」と1項目にまとめられ、見出しが「4か所」になった。</text>
</svg>
