<svg xmlns="http://www.w3.org/2000/svg" width="720" height="496" viewBox="0 0 720 496" role="img" aria-label="アンケート自由記述の集計で、条件付きの意見が別のグループに紛れた件数を、素朴に頼んだときと一文を足したときで比較した図。架空の勤怠アプリ満足度アンケート20件（材料A）・研修感想アンケート22件（材料B）に、無条件の賛成/満足・条件付きの賛成/満足（「〜すれば」）・理由の違う複数の反対/不満を仕込んだ。素朴に「似た意見をまとめて件数を教えて」と頼むと、材料Aは条件付きの意見（各2回・計8件）が8件とも正しく別グループに分かれたが、材料Bは8件中5件が、近いテーマの無条件の賛成や、別の理由の不満に紛れ込んだ。件数の合計はどちらの材料も元の総数（20件・22件）のまま合っていて、崩れたのは中身の振り分けだけだった。「条件付きの意見は無条件の意見と別のグループにしてください」という一文を足すと、材料A・材料Bとも0／8件に戻り、価格や操作性の条件付き意見と理由付きの不満が紛らわしく重なる材料C（10件）でも0／8件のままだった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="496"/>
<text class="t-strong" x="18" y="26">「条件付きの意見は別グループに」の一文で、紛れ込みが消えた</text>
<text class="t-sm" x="18" y="45">架空の勤怠アプリ満足度アンケート20件（材料A）・研修感想アンケート22件（材料B）に、</text>
<text class="t-sm" x="18" y="64">無条件の賛成/満足・条件付きの賛成/満足・理由の違う複数の不満を仕込んだ。数字は</text>
<text class="t-xs" x="18" y="83">「条件付きの意見が別の意見に紛れた件数／条件付きの意見の件数」（材料ごと各2回・計8件）。</text>
<text class="t-strong" x="18" y="112">素朴に「似た意見をまとめて」と頼んだとき</text>
<text class="t" x="18" y="153">材料A（勤怠アプリ・20件）</text>
<rect class="box-good" x="358" y="132" width="344" height="30" rx="4"/>
<text class="t-good" x="530.0" y="153" text-anchor="middle" style="font-weight:700">0／8</text>
<text class="t" x="18" y="191">材料B（研修感想・22件）</text>
<rect class="box-bad" x="358" y="170" width="344" height="30" rx="4"/>
<text class="t-bad" x="530.0" y="191" text-anchor="middle" style="font-weight:700">5／8</text>
<rect class="box-bad" x="18" y="214" width="684" height="46" rx="6"/>
<text class="t-bad" x="34" y="233" style="font-weight:700">材料Bだけ、条件付きの意見が近いテーマの別グループに5／8件紛れ込んだ。</text>
<text class="t-sm" x="34" y="251">件数の合計はどちらの材料も22件のまま合っていた——崩れたのは中身の振り分けだけ。</text>
<text class="t-strong" x="18" y="290">「条件付きの意見は無条件の意見と別のグループに」を足したとき</text>
<text class="t" x="18" y="331">材料A（勤怠アプリ・20件）</text>
<rect class="box-good" x="358" y="310" width="344" height="30" rx="4"/>
<text class="t-good" x="530.0" y="331" text-anchor="middle" style="font-weight:700">0／8</text>
<text class="t" x="18" y="369">材料B（研修感想・22件）</text>
<rect class="box-good" x="358" y="348" width="344" height="30" rx="4"/>
<text class="t-good" x="530.0" y="369" text-anchor="middle" style="font-weight:700">0／8</text>
<text class="t" x="18" y="407">材料C（価格・操作性が紛らわしい10件）</text>
<rect class="box-good" x="358" y="386" width="344" height="30" rx="4"/>
<text class="t-good" x="530.0" y="407" text-anchor="middle" style="font-weight:700">0／8</text>
<rect class="box-accent" x="18" y="430" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="449">一文を足すと3本の材料とも0／8件に戻った。理由別の反対/不満は指示していなくても</text>
<text class="t-accent" x="34" y="467">元から分かれていたので、効いていたのは「条件付きを分けて」の一文だけだった。</text>
</svg>
