<text class="t-xs" x="533.7" y="96" text-anchor="middle">15</text>
<line class="line" x1="666.7" y1="100" x2="666.7" y2="104"/>
<text class="t-xs" x="666.7" y="96" text-anchor="middle">20</text>
<line class="line" x1="148.0" y1="104" x2="680.0" y2="104"/>
<text class="t-strong" x="18" y="132">理由の一文あり</text>
<text class="t-xs" x="18" y="152">重大4件</text>
<circle class="bar-out" cx="161.3" cy="148" r="6.5"/>
<circle class="bar-out" cx="214.5" cy="148" r="6.5"/>
<circle class="bar-out" cx="241.1" cy="148" r="6.5"/>
<circle class="bar-out" cx="267.7" cy="148" r="6.5"/>
<text class="t-xs" x="18" y="174">軽い4件</text>
<circle class="box-bad" stroke-width="1.5" cx="586.9" cy="170" r="6.5"/>
<circle class="box-bad" stroke-width="1.5" cx="613.5" cy="170" r="6.5"/>
<circle class="box-bad" stroke-width="1.5" cx="640.1" cy="170" r="6.5"/>
<circle class="box-bad" stroke-width="1.5" cx="666.7" cy="170" r="6.5"/>
<text class="t-strong" x="18" y="206">ラベルのみ</text>
<text class="t-xs" x="18" y="226">重大4件</text>
<circle class="bar-out" cx="453.9" cy="222" r="6.5"/>
<circle class="bar-out" cx="480.5" cy="222" r="6.5"/>
<circle class="bar-out" cx="533.7" cy="222" r="6.5"/>
<circle class="bar-out" cx="560.3" cy="222" r="6.5"/>
