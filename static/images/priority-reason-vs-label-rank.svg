<svg xmlns="http://www.w3.org/2000/svg" width="720" height="278" viewBox="0 0 720 278" role="img" aria-label="理由の一文がある材料とラベルだけの材料で、重大4件と軽い4件の順位帯がまるごと入れ替わることを示す図。同じ20件・同じ締切・同じ指示文（「優先順位をつけて」だけ・1回目）を、理由の一文がある材料版とラベルだけの材料版で並べ替えた。理由の一文がある版は、重大4件（TB1・TB2・TB3・TB4）が1位・3位・4位・5位に集まり、軽い4件（TA1・TA2・TA3・TA4）は17位・18位・19位・20位に集まった。ラベルだけの版は、軽い4件が1位・2位・3位・6位に集まり、重大4件は12位・13位・15位・16位に下がった。同じタスク・同じ締切・同じ指示文でも、材料に理由の一文があるかどうかで、上位に来る4件と下位に来る4件がまるごと入れ替わった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="278"/>
<text class="t-strong" x="18" y="26">重大4件（TB）と軽い4件（TA）の順位帯が、材料の書き方で入れ替わる</text>
<text class="t-sm" x="18" y="45">同じ20件・同じ締切・同じ指示文（「優先順位をつけて」だけ・1回目）を、</text>
<text class="t-sm" x="18" y="64">理由の一文がある材料版と、ラベルだけの材料版で並べ替えた結果を比べた。</text>
<text class="t-xs" x="18" y="83">横軸は並べ替え結果の順位（1〜20位）。青＝重大4件（TB1〜TB4）・灰＝軽い4件（TA1〜TA4）。</text>
<line class="line" x1="161.3" y1="100" x2="161.3" y2="104"/>
<text class="t-xs" x="161.3" y="96" text-anchor="middle">1</text>
<line class="line" x1="267.7" y1="100" x2="267.7" y2="104"/>
<text class="t-xs" x="267.7" y="96" text-anchor="middle">5</text>
