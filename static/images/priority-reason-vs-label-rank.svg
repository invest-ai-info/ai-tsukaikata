<circle class="box-bad" stroke-width="1.5" cx="161.3" cy="244" r="6.5"/>
<circle class="box-bad" stroke-width="1.5" cx="187.9" cy="244" r="6.5"/>
<circle class="box-bad" stroke-width="1.5" cx="214.5" cy="244" r="6.5"/>
