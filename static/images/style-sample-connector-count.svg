<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396" role="img" aria-label="見本あり・言葉だけ・見本なしの3条件で、対象の接続詞を1回のレビューに平均何回使ったかを示す横棒グラフ。犬レビューの「ちなみに」は、見本なし0.0回・見本あり2.0回・言葉だけ2.0回で、縦の点線（見本の実物2回）にどちらも一致している。万年筆の「そもそも」は、見本なし0.0回・見本あり2.0回・言葉だけ3.25回で、見本ありは点線（実物2回）に一致するが、言葉だけは点線を超えている。下の枠には、犬レビューの「ちなみに」はどちらの条件も実物どおり2回で揃ったこと、万年筆の「そもそも」は見本ありが実物どおり2回だが言葉だけは平均3.25回で1.6倍に増えたこと、見本を渡すと特徴の量まで実物に合わせて再現されるが言葉だけだと量が盛られやすいことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
