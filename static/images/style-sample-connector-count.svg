    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="396"/>
<text class="t-strong" x="18" y="26">「ちなみに」は実物どおり。「そもそも」は言葉だけ版が実物を超える</text>
<text class="t-sm" x="18" y="45">実測2026-10-14。見本の実物は、犬レビューの「ちなみに」も万年筆の「そもそも」も2回。</text>
<text class="t-sm" x="18" y="64">棒は4回（見本なしは2回）の平均回数。縦の点線は、見本の実物に書かれている回数（2回）。</text>
<path class="line" d="M470.0 106 L470.0 274" stroke-dasharray="4 3"/>
<text class="t-xs" x="434.0" y="100">実物＝2回</text>
<text class="t-sm" x="18" y="124">犬レビュー「ちなみに」：見本なし（2回）</text>
<rect class="bar-old" x="280" y="111" width="2.0" height="18" rx="3"/>
<text class="t-sm" x="290.0" y="124">0.00回</text>
<text class="t-sm" x="18" y="152">犬レビュー「ちなみに」：見本あり（4回）</text>
<rect class="bar-new" x="280" y="139" width="190.0" height="18" rx="3"/>
<text class="t-sm" x="478.0" y="152">2.00回</text>
<text class="t-sm" x="18" y="180">犬レビュー「ちなみに」：言葉だけ（4回）</text>
<rect class="bar-new" x="280" y="167" width="190.0" height="18" rx="3"/>
<text class="t-sm" x="478.0" y="180">2.00回</text>
<text class="t-sm" x="18" y="208">万年筆「そもそも」：見本なし（2回）</text>
<rect class="bar-old" x="280" y="195" width="2.0" height="18" rx="3"/>
<text class="t-sm" x="290.0" y="208">0.00回</text>
<text class="t-sm" x="18" y="236">万年筆「そもそも」：見本あり（4回）</text>
<rect class="bar-new" x="280" y="223" width="190.0" height="18" rx="3"/>
<text class="t-sm" x="478.0" y="236">2.00回</text>
<text class="t-sm" x="18" y="264">万年筆「そもそも」：言葉だけ（4回）</text>
<rect class="bar-new" x="280" y="251" width="308.8" height="18" rx="3"/>
<text class="t-sm" x="596.8" y="264">3.25回</text>
<path class="line" d="M280 286 L660.0 286"/>
<path class="line" d="M280.0 286 L280.0 291"/>
<text class="t-xs" x="276.0" y="306">0回</text>
<path class="line" d="M375.0 286 L375.0 291"/>
<text class="t-xs" x="371.0" y="306">1回</text>
<path class="line" d="M470.0 286 L470.0 291"/>
<text class="t-xs" x="466.0" y="306">2回</text>
<path class="line" d="M565.0 286 L565.0 291"/>
<text class="t-xs" x="561.0" y="306">3回</text>
<path class="line" d="M660.0 286 L660.0 291"/>
<text class="t-xs" x="656.0" y="306">4回</text>
<rect class="box-accent" x="18" y="318" width="684" height="66" rx="6"/>
<text class="t-accent" x="34" y="338">犬レビューの「ちなみに」は、見本あり・言葉だけのどちらも実物どおり2回で揃った。</text>
<text class="t-accent" x="34" y="356">万年筆の「そもそも」は、見本ありは実物どおり2回だが、言葉だけは平均3.25回——1.6倍に増えた。</text>
<text class="t-accent" x="34" y="374">見本を渡すと、特徴の「量」まで実物に合わせて再現される。言葉だけだと量が盛られやすい。</text>
</svg>
