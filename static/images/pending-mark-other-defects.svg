<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="〔保留〕マークに関わる、位置以外の3種類の崩れを示す一覧図。すべて「出た回数／全26回」で、少ないほど良い。対象の行が丸ごと落ちた回は0回、同一用件が2行に割れた回は1回（指示文①の1回のみ）、一覧の前に余計な文章が付いた回は1回（同じく①の1回のみ）、保留の対象外の行に〔保留〕が付いた回は1回（指示文④の1回のみ）。下の枠には、印を付けるべき行の見落としは26回・52行で0件だったこと、重複・前置き・過剰適用はそれぞれ1回しか出ておらず対応する一文を足した後の16回では0回だったこと、どれも少ない回数なので直ったではなくこの実測では再発しなかったと見るべきであることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">印の対象はほぼ崩れない。稀に出たのは3種類の別の崩れ</text>
<text class="t-sm" x="18" y="45">実測2026-10-10・全26回・対象2行×26回＝52行をチェック。</text>
<text class="t-sm" x="18" y="64">すべて「出た回数／全26回」で、少ないほど良い。対応する一文を足した後の16回（③④⑤⑥）では3つとも0回。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">対象の行が丸ごと落ちた（印も行自体も無い）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">0/26</text>
<text class="t" x="18" y="157">同一用件が2行に割れた（①の1回のみ）</text>
<rect class="box-bad" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="157" text-anchor="middle" style="font-weight:700">1/26</text>
<text class="t" x="18" y="189">一覧の前に余計な文章が付いた（①の1回のみ）</text>
<rect class="box-bad" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="189" text-anchor="middle" style="font-weight:700">1/26</text>
<text class="t" x="18" y="221">保留の対象外の行に〔保留〕が付いた（④の1回のみ）</text>
<rect class="box-bad" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="221" text-anchor="middle" style="font-weight:700">1/26</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">印を付けるべき行の見落としは26回・52行で0件。崩れるのは位置か、ごく稀な別の種類。</text>
<text class="t-accent" x="34" y="276">重複・前置き・過剰適用は、それぞれ1回しか出ていない。対応する一文を足した後の16回では0回。</text>
<text class="t-accent" x="34" y="294">⚠️ どれも少ない回数なので「直った」ではなく「この実測では再発しなかった」と見るべき数字。</text>
</svg>
