<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img" aria-label="待ち行列を10日間延ばした連鎖で、確定済みの行が書き換わらなかったかを示す表。印で残す版は112件の突き合わせで不一致0件、いちばん下へ移す版は105件の突き合わせで不一致0件、どちらも緑。3段目は、育った山に「直近3日の新着だけ」を正しく挙げられるかを新規セッションに6回聞いた結果で、正しく絞れたのは6回中1回。下の枠には、印そのものが書き換わる心配は10日間・217件とも起きなかったこと、日付の記録がないと新旧の区別はAIにも難しく、でっち上げた回は0件だが正しく絞れたのは1回だけだったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="272"/>
<text class="t-strong" x="18" y="26">10日間・217件の突き合わせで、確定済みの行は0件も書き換わらなかった</text>
<text class="t-sm" x="18" y="45">印で残す版・いちばん下へ移す版それぞれの10日分の全文を、前日と1行ずつ突き合わせた（確定済み行のみ）。</text>
<text class="t-sm" x="18" y="64">3段目は、育った山に「直近3日の新着だけ」を正しく挙げられるかを、新規セッションに6回聞いた別の実測。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">印で残す版・確定済み行の突き合わせ（10日間）</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">112/112</text>
<text class="t" x="18" y="157">いちばん下へ移す版・確定済み行の突き合わせ（10日間）</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">105/105</text>
<text class="t" x="18" y="189">「直近3日の新着だけ」を正しく挙げられたか（6回）</text>
<rect class="box" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="189" text-anchor="middle" style="font-weight:700">1/6</text>
<rect class="box-accent" x="18" y="206" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="226">上2段＝印そのものが書き換わる心配は、10日間・217件とも起きなかった。</text>
<text class="t-accent" x="34" y="244">3段目＝日付の記録がないと、新旧の区別はAIにも難しい。でっち上げた回は0件だが、正しく絞れたのは1回だけ。</text>
</svg>
