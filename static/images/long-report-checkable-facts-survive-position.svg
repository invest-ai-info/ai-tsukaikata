<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396" role="img" aria-label="架空の業務報告書2本（月次業務報告書2,624字・イベント運営報告書2,345字）に、原稿内で照合できる仕込みを冒頭・中央・末尾へ2個ずつ計6個仕込み、2材料×5回＝60回判定した結果を示す図。冒頭20/20（100%）、中央20/20（100%）、末尾20/20（100%）で、位置による検出率の差は無かった。一方、対照として中央ゾーンに置いた「照合できない単発の数字」（会場面積480→460平方メートルへの書き換え）は検出0/5（0%）で、原稿の他の記述と照合する手がかりが無いため見落とされた。同じ中央ゾーンでも、照合できる数字（スタッフ人数18→17名、12+6=18と食い違う）に差し替えると5/5で検出された。見落としを決めているのは仕込んだ位置ではなく、原稿の中に答え合わせできる手がかりがあるかどうかだった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="396"/>
<text class="t-strong" x="18" y="26">位置による差は無かった。見落としたのは「照合できない数字」だけ</text>
<text class="t-sm" x="18" y="45">架空の業務報告書2本（2,624字・2,345字）に、原稿内で照合できる仕込みを冒頭・中央・末尾へ2個ずつ計6個。2材料×5回＝60回判定。</text>
<text class="t-sm" x="18" y="64">「検品してください」と素朴に頼んだだけで、位置による見落としの差は出なかった。</text>
<text class="t" x="18" y="132">冒頭</text>
<rect class="box-quiet" x="140" y="108" width="420" height="34" rx="3"/>
<rect class="box-good" x="140" y="108" width="420.0" height="34" rx="3"/>
<text class="t-good" x="570" y="132">20/20（100%）</text>
<text class="t" x="18" y="188">中央</text>
<rect class="box-quiet" x="140" y="164" width="420" height="34" rx="3"/>
<rect class="box-good" x="140" y="164" width="420.0" height="34" rx="3"/>
<text class="t-good" x="570" y="188">20/20（100%）</text>
<text class="t" x="18" y="244">末尾</text>
<rect class="box-quiet" x="140" y="220" width="420" height="34" rx="3"/>
<rect class="box-good" x="140" y="220" width="420.0" height="34" rx="3"/>
<text class="t-good" x="570" y="244">20/20（100%）</text>
<rect class="box-bad" x="18" y="280" width="678" height="92" rx="6"/>
<text class="t-bad" x="34" y="302">対照：中央ゾーンに置いた「照合できない単発の数字」（会場面積480→460平方メートル）</text>
<text class="t-bad" x="34" y="322">検出 0／5件（0%）——原稿の他の記述と足し算・引き算しても、正誤を判定する手がかりが無い</text>
<text class="t-sm" x="34" y="344">同じ中央ゾーンでも、照合できる数字（スタッフ18→17名。12+6=18と食い違う）に差し替えると5／5で検出された。</text>
<text class="t-sm" x="34" y="362">見落としを決めているのは位置ではなく、原稿の中に答え合わせできる手がかりがあるかどうか。</text>
</svg>
