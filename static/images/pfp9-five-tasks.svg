<svg xmlns="http://www.w3.org/2000/svg" width="720" height="406" viewBox="0 0 720 406" role="img" aria-label="MLIP Arena の5種目それぞれの順位を、PFP v9 と MACE-MPA で並べた表。二原子分子のなめらかさ（diatomics）は PFP v9 が1位、MACE-MPA が2位。状態方程式（eos_bulk）も PFP v9 が1位、MACE-MPA が2位。エネルギーと体積（wbm_ev）は PFP v9 が5位、MACE-MPA が2位。高温・圧縮での安定性（stability）は PFP v9 が1位、MACE-MPA が4位。水素の燃焼（combustion）は PFP v9 が4位、MACE-MPA が2位。合計点はどちらも12点で同率1位だが、点の取り方はまったく違う。燃焼の値は5回走らせた平均だと発表ページに書かれている。5種目は中身も測り方も別々なので、順位を足した合計点に精度の意味はない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="406"/>
<text class="t-strong" x="18" y="26">同率1位でも、種目ごとに見ると3種目が1位・2種目は4位と5位です</text>
<text class="t-sm" x="18" y="45">数字は種目ごとの順位。緑＝その種目で1位、灰色＝2位以下。</text>
<text class="t-sm" x="18" y="64">合計点はどちらも12点で並びますが、点の取り方はまったく違います。</text>
<text class="t-accent" x="410" y="96">PFP v9</text>
<text class="t-accent" x="570" y="96">MACE-MPA</text>
<text class="t" x="18" y="140">二原子分子のなめらかさ</text>
<text class="t-xs" x="18" y="156">diatomics</text>
<rect class="box-good" x="400" y="122" width="130" height="32" rx="4"/>
<text class="t-good" x="452" y="143">1位</text>
<rect class="box-quiet" x="560" y="122" width="130" height="32" rx="4"/>
<text class="t-sm" x="612" y="143">2位</text>
<text class="t" x="18" y="184">状態方程式</text>
<text class="t-xs" x="18" y="200">eos_bulk</text>
<rect class="box-good" x="400" y="166" width="130" height="32" rx="4"/>
<text class="t-good" x="452" y="187">1位</text>
<rect class="box-quiet" x="560" y="166" width="130" height="32" rx="4"/>
<text class="t-sm" x="612" y="187">2位</text>
<text class="t" x="18" y="228">エネルギーと体積</text>
<text class="t-xs" x="18" y="244">wbm_ev</text>
<rect class="box-quiet" x="400" y="210" width="130" height="32" rx="4"/>
<text class="t-sm" x="452" y="231">5位</text>
<rect class="box-quiet" x="560" y="210" width="130" height="32" rx="4"/>
<text class="t-sm" x="612" y="231">2位</text>
<text class="t" x="18" y="272">高温・圧縮での安定性</text>
<text class="t-xs" x="18" y="288">stability</text>
<rect class="box-good" x="400" y="254" width="130" height="32" rx="4"/>
<text class="t-good" x="452" y="275">1位</text>
<rect class="box-quiet" x="560" y="254" width="130" height="32" rx="4"/>
<text class="t-sm" x="612" y="275">4位</text>
<text class="t" x="18" y="316">水素の燃焼</text>
<text class="t-xs" x="18" y="332">combustion</text>
<rect class="box-quiet" x="400" y="298" width="130" height="32" rx="4"/>
<text class="t-sm" x="452" y="319">4位</text>
<rect class="box-quiet" x="560" y="298" width="130" height="32" rx="4"/>
<text class="t-sm" x="612" y="319">2位</text>
<text class="t-xs" x="18" y="364">※ 燃焼の値は、5回走らせた平均だと発表ページに書かれています。</text>
<text class="t-xs" x="18" y="383">※ 5種目の中身も測り方も別々です。順位を足した合計点に、精度の意味はありません。</text>
</svg>
