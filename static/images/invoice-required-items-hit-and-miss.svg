<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="登録番号の欄が出た回数と、税率ごとの消費税額が明記された回数を示す表。登録番号の欄は、単一税率で渡さない場合3回中0回、税率2種混在で渡さない場合3回中1回、「不明なら明記して」を追加した場合4回中4回。税率ごとの消費税額は、単一税率で渡さない場合3回中1回、税率2種混在で渡さない場合3回中3回、情報をすべて渡した場合8回中8回。下の枠には、登録番号を渡さなかった6回のうちでっち上げた回は0回だったこと、税率が2種類混ざる材料のほうが単一税率より残りやすかったこと、「不明なら明記して」を足すと登録番号は4回とも正しく「不明」と書かれたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">登録番号は言われないと消える。税率が混ざるほうが内訳は残る</text>
<text class="t-sm" x="18" y="45">実測2026-10-23。claude -pの独立実行。登録番号を渡さずに「請求書を作って」と頼んだ場合。</text>
<text class="t-sm" x="18" y="64">上3行＝登録番号の欄が出た回数。下3行＝税率ごとの消費税額が明記された回数。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">登録番号の欄：単一税率・渡さない</text>
<rect class="box-bad" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="518.0" y="125" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="157">登録番号の欄：税率2種混在・渡さない</text>
<rect class="box" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="157" text-anchor="middle" style="font-weight:700">1/3</text>
<text class="t" x="18" y="189">登録番号の欄：「不明なら明記して」を追加</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="221">税率ごとの消費税額：単一税率・渡さない</text>
<rect class="box" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="221" text-anchor="middle" style="font-weight:700">1/3</text>
<text class="t" x="18" y="253">税率ごとの消費税額：税率2種混在・渡さない</text>
<rect class="box-good" x="438" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="253" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="285">税率ごとの消費税額：情報をすべて渡した場合</text>
<rect class="box-good" x="438" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="285" text-anchor="middle" style="font-weight:700">8/8</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">登録番号を渡さなかった6回のうち、架空の番号をでっち上げた回は0回だった。</text>
<text class="t-accent" x="34" y="340">税率が2種類混ざる材料のほうが、単一税率より登録番号・内訳とも残りやすかった。</text>
<text class="t-accent" x="34" y="358">「分からなければ明記して」を足すと、登録番号は4回とも正しく「不明」と書かれた。</text>
</svg>
