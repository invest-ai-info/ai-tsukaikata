<svg xmlns="http://www.w3.org/2000/svg" width="720" height="468" viewBox="0 0 720 468" role="img" aria-label="noteの「AI参照」対価還元プログラムについて、note公式ブログ本文(2026年11月18日公開)で確認できた5つの事実を上から並べた図。①対象期間＝2026年4月〜7月に公開していた記事(これから書く記事は対象外)。②対象コンテンツ＝だれでも読める無料記事のテキスト部分のみ(有料部分・メンバーシップ特典・画像・音声・動画は対象外)。③申し込み＝不要。対象者にはnoteから個別にメールで連絡が届く(緑で強調)。④分配の考え方＝AI事業者からの対価からnoteの運営手数料を引いた残りを、参照の実績などに応じて分配。⑤受け取り＝銀行振込またはAmazonギフトカード、支払いは2026年12月中旬を予定。下の枠には、還元総額・対象人数・noteの運営手数料の割合は2026-11-27確認時点で非公表のままであること、2026年11月にnote記事を公開しても今回の対象(4〜7月公開分)には入らないこと、受け取りの辞退も可能であることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
