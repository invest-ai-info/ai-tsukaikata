</style>
<rect class="bg" x="0" y="0" width="720" height="468"/>
<text class="t-strong" x="18" y="26">noteのAI参照対価還元、確認できたことは5つ</text>
<text class="t-sm" x="18" y="45">note公式ブログ本文（2026年11月18日公開・2026-11-27取得）の記載を、原文どおりに並べた。</text>
<text class="t-sm" x="18" y="64">ヘルプページ（help-note.com）はこのクラウドから経路遮断で未確認。詳細手続きはそちら。</text>
<rect class="box-quiet" x="18" y="96" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="116">対象期間</text>
<text class="t" x="34" y="136">2026年4月〜7月に公開していた記事（これから書く記事は対象外）</text>
<rect class="box-quiet" x="18" y="156" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="176">対象コンテンツ</text>
<text class="t" x="34" y="196">無料記事のテキスト部分のみ（有料部分・画像・音声・動画は対象外）</text>
<rect class="box-good" x="18" y="216" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="236">申し込み</text>
<text class="t-good" x="34" y="256">不要。対象者にはnoteから個別にメールで連絡が届く</text>
<rect class="box-quiet" x="18" y="276" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="296">分配の考え方</text>
<text class="t" x="34" y="316">AI事業者からの対価からnoteの運営手数料を引いた残りを、参照の実績などに応じて分配</text>
<rect class="box-quiet" x="18" y="336" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="356">受け取り</text>
<text class="t" x="34" y="376">銀行振込またはAmazonギフトカード。支払いは2026年12月中旬を予定</text>
<rect class="box-accent" x="18" y="402" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="422">非公表のまま＝還元総額・対象人数・noteの運営手数料の割合（2026-11-27確認時点）。</text>
<text class="t-accent" x="34" y="440">2026年11月にnote記事を公開しても、今回の対象（4〜7月公開分）には入らない。受け取りの辞退も可能。</text>
</svg>
