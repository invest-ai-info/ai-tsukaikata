<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-label="頼み方を4通りに変えて、案件ごとの提案文の字数を何件ぶん書いたかを並べた図。分母は12件で、真値は材料そのものから数えたもの。そのまま「差を出して」と頼んだ4回は、材料Aの1回目も2回目も、材料Bの1回目も2回目も、すべて0件で、字数を1件も書いていない。「言えること／言えないことに分けてください」と頼むと、材料Aの1回目が3件、2回目が0件、材料Bの1回目が5件、2回目が0件で、書いた回と書かない回に割れた。しかも材料Aの1回目に書いた3件は、3件とも真値とずれていた。「差や理由は書かないでください。記録に書いてあることだけを表にしてください」と頼むと、材料Aも材料Bも12件すべてを書き、24マス全部が真値と一致した。出す形を固定した保存版では、材料Aの1回目が12件、2回目が0件、材料Bの1回目が12件、2回目が6件で割れた。形は4回ともそろっているのに、2回目だけ字数が消えて「長短だけでは分かれていない」という言葉に置き換わっている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="410"/>
<text class="t-strong" x="18" y="26">案件ごとの字数を、何件ぶん数えて書いたか（真値と一致した数）</text>
<text class="t-sm" x="18" y="45">分母は12件。真値は材料そのものから数えたもの。1件でもずれたら不一致として数えた。</text>
<text class="t-sm" x="18" y="64">「記録にあることだけ表に」は材料2本を各1回なので、右2列は空欄。</text>
<text class="t-xs" x="280" y="110">A 1回目</text>
<text class="t-xs" x="384" y="110">A 2回目</text>
<text class="t-xs" x="488" y="110">B 1回目</text>
<text class="t-xs" x="592" y="110">B 2回目</text>
<text class="t" x="18" y="150" style="font-size:12px">そのまま「差を出して」</text>
<rect class="box-bad" x="270" y="124" width="96" height="42" rx="3"/>
<text class="t-bad" x="290" y="150" style="font-size:12.5px">0/12</text>
<rect class="box-bad" x="374" y="124" width="96" height="42" rx="3"/>
<text class="t-bad" x="394" y="150" style="font-size:12.5px">0/12</text>
<rect class="box-bad" x="478" y="124" width="96" height="42" rx="3"/>
<text class="t-bad" x="498" y="150" style="font-size:12.5px">0/12</text>
<rect class="box-bad" x="582" y="124" width="96" height="42" rx="3"/>
<text class="t-bad" x="602" y="150" style="font-size:12.5px">0/12</text>
<text class="t" x="18" y="200" style="font-size:12px">「言えること／言えないこと」に分ける</text>
<rect class="box" x="270" y="174" width="96" height="42" rx="3"/>
<text class="t" x="290" y="200" style="font-size:12.5px">3/12</text>
<rect class="box-bad" x="374" y="174" width="96" height="42" rx="3"/>
<text class="t-bad" x="394" y="200" style="font-size:12.5px">0/12</text>
<rect class="box" x="478" y="174" width="96" height="42" rx="3"/>
<text class="t" x="498" y="200" style="font-size:12.5px">5/12</text>
<rect class="box-bad" x="582" y="174" width="96" height="42" rx="3"/>
<text class="t-bad" x="602" y="200" style="font-size:12.5px">0/12</text>
<text class="t" x="18" y="250" style="font-size:12px">「記録にあることだけ表に」（各1回）</text>
<rect class="box-good" x="270" y="224" width="96" height="42" rx="3"/>
<text class="t-good" x="290" y="250" style="font-size:12.5px">12/12</text>
<rect class="box-good" x="374" y="224" width="96" height="42" rx="3"/>
<text class="t-good" x="394" y="250" style="font-size:12.5px">12/12</text>
<rect class="box-quiet" x="478" y="224" width="96" height="42" rx="3"/>
<text class="t-sm" x="498" y="250" style="font-size:12.5px">—</text>
<rect class="box-quiet" x="582" y="224" width="96" height="42" rx="3"/>
<text class="t-sm" x="602" y="250" style="font-size:12.5px">—</text>
<text class="t" x="18" y="300" style="font-size:12px">保存版（形を固定）</text>
<rect class="box-good" x="270" y="274" width="96" height="42" rx="3"/>
<text class="t-good" x="290" y="300" style="font-size:12.5px">12/12</text>
<rect class="box-bad" x="374" y="274" width="96" height="42" rx="3"/>
<text class="t-bad" x="394" y="300" style="font-size:12.5px">0/12</text>
<rect class="box-good" x="478" y="274" width="96" height="42" rx="3"/>
<text class="t-good" x="498" y="300" style="font-size:12.5px">12/12</text>
<rect class="box" x="582" y="274" width="96" height="42" rx="3"/>
<text class="t" x="602" y="300" style="font-size:12.5px">6/12</text>
<text class="t-good" x="18" y="342">※ 「差や理由は書かないでください。記録に書いてあることだけを表にしてください」＝24マス全部が真値と一致した。</text>
<text class="t-bad" x="18" y="364">※ 保存版は形が4回ともそろっているのに、2回目だけ字数が消えて「長短だけでは分かれていない」という言葉に変わった。</text>
<text class="t-xs" x="18" y="386">架空データでの実測。回ごとの生の返りは docs/evidence/ に全文置いてある。</text>
