<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Udemyの講座1本が、誰が客を連れてきたかで講師の取り分が97%と37%に割れることを、3,000円の講座が月に100本売れた場合（前提）で並べた図。講師のクーポン・紹介リンク経由なら講師97%で300,000円×0.97＝291,000円／月（緑）、Udemyの検索・広告経由（紹介リンクなし）なら講師37%で111,000円／月。率が掛かるのはNet Amount（税やアプリ手数料を引いた後の額）で、iOS・Androidアプリ経由の販売は先に30%が引かれる。3段目はUdemy Business（法人向け定額）で見られた場合で、1本いくらではなく月の定額収入の15%を講師全体のプールにして視聴された分数の割合で按分する。下の枠には、差は月180,000円で2.6倍、講座の中身は同じで変わったのは誰が客を連れてきたかだけであること、作って置く型は置いた後の集客をどちらがするかで同じ本数でも取り分が割れること、本数は前提で何本売れるかの出典は無いことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="400"/>
<text class="t-strong" x="18" y="26">同じ講座が、誰が客を連れてきたかで 97% と 37% に割れる</text>
<text class="t-sm" x="18" y="45">Udemy ヘルプ「Instructor revenue share」の率を、3,000円の講座が月に100本売れた場合（前提）に当てはめた。2026-09-18確認。</text>
<text class="t-sm" x="18" y="64">率が掛かるのは Net Amount（税やアプリ手数料を引いた後の額）。iOS・Androidアプリ経由の販売は先に30%が引かれる。</text>
<rect class="box-good" x="18" y="96" width="684" height="62" rx="6"/>
<text class="t-strong" x="34" y="120">講師のクーポン・紹介リンク経由（instructor promotions）</text>
<text class="t-good" x="34" y="144" style="font-weight:700">講師 97% ＝ 300,000円 × 0.97 ＝ 291,000円／月（前提: 3,000円×100本）</text>
<rect class="box" x="18" y="168" width="684" height="62" rx="6"/>
<text class="t-strong" x="34" y="192">Udemyの検索・広告経由（紹介リンクなし）</text>
<text class="t" x="34" y="216" style="font-weight:700">講師 37% ＝ 300,000円 × 0.37 ＝ 111,000円／月（前提: 3,000円×100本）</text>
<rect class="box-quiet" x="18" y="240" width="684" height="62" rx="6"/>
<text class="t-strong" x="34" y="264">Udemy Business（法人向け定額）で見られた場合</text>
<text class="t" x="34" y="288">1本いくらではない。月の定額収入の15%を講師全体のプールにし、視聴された分数の割合で按分</text>
<rect class="box-accent" x="18" y="316" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="336">差は 180,000円／月＝2.6倍。講座の中身は同じで、変わったのは「誰が客を連れてきたか」だけ。</text>
<text class="t-accent" x="34" y="354">講座を「作って置く」型は、置いた後の集客をどちらがするかで、同じ本数でも取り分が割れる。</text>
<text class="t-accent" x="34" y="372">本数（100本）は前提。原文に載っているのは率だけで、何本売れるかの出典は無い。</text>
</svg>
