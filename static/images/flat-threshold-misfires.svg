</style>
<rect class="bg" x="0" y="0" width="720" height="341"/>
<text class="t-strong" x="18" y="24">「間隔から計算」も「固定14日」も、正常な相手を2回中2回とも誤検知した</text>
<text class="t-sm" x="18" y="43">架空の更新履歴3系統（①週次・変動小さい8日以内 ②月次・変動大きい28〜34日</text>
<text class="t-sm" x="18" y="62">③実際に65日停止）を1回にまとめ、5通りの頼み方を各2回＝10回試した。</text>
<text class="t-xs" x="18" y="81">縦軸は正常なはずの①②を誤って「異常」と判定した回数（2回中）。見逃し（③を正常と誤判定）は5版10回とも0回だった。</text>
<text class="t" x="18" y="164">① 無指定（丸投げ）</text>
<rect class="box-quiet" x="260.0" y="153" width="170.0" height="15" rx="3"/>
<rect class="box-good" x="260.0" y="153" width="3.0" height="15" rx="3"/>
<text class="t-accent" x="442.0" y="164">0/2</text>
<text class="t" x="18" y="192">② 直近6回の間隔から計算</text>
<rect class="box-quiet" x="260.0" y="181" width="170.0" height="15" rx="3"/>
<rect class="box-bad" x="260.0" y="181" width="170.0" height="15" rx="3"/>
<text class="t-bad" x="442.0" y="192">2/2</text>
<text class="t" x="18" y="220">③ 固定14日をどの相手にも使う</text>
<rect class="box-quiet" x="260.0" y="209" width="170.0" height="15" rx="3"/>
<rect class="box-bad" x="260.0" y="209" width="170.0" height="15" rx="3"/>
<text class="t-bad" x="442.0" y="220">2/2</text>
<text class="t" x="18" y="248">④ 固定35日をどの相手にも使う</text>
<rect class="box-quiet" x="260.0" y="237" width="170.0" height="15" rx="3"/>
<rect class="box-good" x="260.0" y="237" width="3.0" height="15" rx="3"/>
<text class="t-accent" x="442.0" y="248">0/2</text>
<text class="t" x="18" y="276">⑤ 相手ごとに最大間隔＋バッファ</text>
<rect class="box-quiet" x="260.0" y="265" width="170.0" height="15" rx="3"/>
<rect class="box-good" x="260.0" y="265" width="3.0" height="15" rx="3"/>
<text class="t-accent" x="442.0" y="276">0/2</text>
<path class="line" d="M260.0 145 L260.0 278" stroke-dasharray="4 3"/>
<text class="t-sm" x="18" y="299">※ ②は週次（変動±1日）を「基準からわずかにはみ出た」と判定、③は月次（28〜34日）を「14日を超えた」と機械的に判定した。</text>
<text class="t-xs" x="18" y="318">架空データでの実測（5版×各2回＝10回）。生の回答はdocs/evidence/ に全文置いてある。</text>
</svg>
