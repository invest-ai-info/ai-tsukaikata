<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-label="架空の更新履歴3系統（①週次で変動が8日以内に収まる相手、②月次で28〜34日と変動が大きい相手、③実際に65日間更新が止まっている相手）をまとめて、異常判定の基準を決める5通りの頼み方を各2回・計10回試した図。縦軸は、正常なはずの①②を誤って「異常」と判定した回数を2回中で示す。無指定で丸投げした版は0/2、直近6回の間隔から平均+2標準偏差で計算させた版は、変動の小さい①だけを2回とも誤って異常と判定し2/2、固定14日をどの相手にも使った版は、変動の大きい②だけを2回とも誤って異常と判定し2/2、固定35日をどの相手にも使った版は0/2、相手ごとに過去の最大間隔にバッファを足す推奨の言い方は0/2だった。本当に止まっている③を見逃した回は、5版10回を通じて0回だった。">
<style>
