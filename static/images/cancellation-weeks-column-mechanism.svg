<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-label="材料A(Webサイト保守契約・ことり建設)は、3件分のキャンセルを日付が約6週間離れた3つの文に分けて書いている。「9月3日、オプションA(2,000円)をキャンセル…。9月24日、オプションB(1,800円)も…。10月15日、オプションC(2,200円)も…」。同じ備考欄の中で日付だけが約6週間に渡っている。材料B(SNS運用代行契約・れんげ接客代行)は、備考列にはキャンセルと無関係な事務連絡(来月から請求書の送付先が変更になります)だけを書き、キャンセル額は備考とは別の「キャンセル履歴」列(8/20 投稿作成3,000円・9/10 コメント対応2,000円・10/2 分析2,500円)に分けて書いている。下の枠には、どちらも26回とも3件分を正しく引いて4,000円・3,500円に到達したこと、1件だけ引く崩れ方は出なかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="372"/>
<text class="t-strong" x="18" y="26">3件分のキャンセルを、日付と列でさらに分散させた</text>
<text class="t-sm" x="18" y="45">前の3本（2件・3件同時／別々の文・段）は、同じ列の中に収まっていた。</text>
<rect class="box-good" x="18" y="96" width="684" height="100" rx="6"/>
<text class="t-strong" x="34" y="118">材料A（Webサイト保守契約・ことり建設）＝日付が約6週間離れた3つの文</text>
<text class="t-good" x="34" y="138">「9月3日、オプションA(2,000円)をキャンセル…。9月24日、オプションB(1,800円)も…。</text>
<text class="t-good" x="34" y="157">10月15日、オプションC(2,200円)も…」。同じ備考欄の中で、日付だけが約6週間に渡っている。</text>
<rect class="box-good" x="18" y="210" width="684" height="100" rx="6"/>
<text class="t-strong" x="34" y="232">材料B（SNS運用代行契約・れんげ接客代行）＝備考とは別の「キャンセル履歴」列</text>
<text class="t-good" x="34" y="252">備考列＝「来月から請求書の送付先が変更になります」（キャンセルと無関係な事務連絡）。</text>
<text class="t-good" x="34" y="271">キャンセル履歴列＝「8/20 投稿作成(3,000円)。9/10 コメント対応(2,000円)。10/2 分析(2,500円)」。</text>
<rect class="box-accent" x="18" y="324" width="684" height="28" rx="6"/>
<text class="t-accent" x="34" y="344">どちらも、26回とも3件分を正しく引いた（4,000円・3,500円）。1件だけ引く崩れ方は出なかった。</text>
</svg>
