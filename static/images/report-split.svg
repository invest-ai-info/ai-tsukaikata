<svg xmlns="http://www.w3.org/2000/svg" width="720" height="378" viewBox="0 0 720 378" role="img" aria-label="AIの報告を、確かめたかどうかで3つに分けた対応表。「実装しました」は確認済みで、実行したコマンドと出力を添えさせる。「おそらく正常に動作します」は未確認で、まだ一度も動かしていない。「こちらのURLから取得できます」は開けなかったもので、実際に開くと404だった。3行ともそのまま読めば「できました」に見えるため、分けさせるまでどれが未確認かは出てこない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="378"/>
<text class="t-strong" x="18" y="26">「できました」を、確かめたかどうかで分けさせる</text>
<text class="t-sm" x="18" y="45">同じ1回の報告を3つに分けたものです。分けるまで、どれが未確認かは出てきません。</text>
<text class="t-sm" x="18" y="64">URL・ファイル名・設定項目・オプション名は、とくに作られやすい4つです。</text>
<text class="t-xs" x="18" y="84">AIの報告（そのまま）</text>
<text class="t-xs" x="340" y="84">分けさせると、その場で見えるもの</text>
<rect class="box-quiet" x="18" y="96" width="282" height="68" rx="6"/>
<text class="t" x="32" y="136">実装しました</text>
<rect class="box-good" x="340" y="96" width="362" height="68" rx="6"/>
<text class="t-good" x="354" y="122">確認済み</text>
<text class="t-sm" x="354" y="146">実行したコマンドと出力を添える</text>
<line class="line" x1="308" y1="130" x2="326" y2="130"/>
<path d="M326 126 L333 130 L326 134 Z" fill="#8b949e"/>
<rect class="box-quiet" x="18" y="180" width="282" height="68" rx="6"/>
<text class="t" x="32" y="220">おそらく正常に動作します</text>
<rect class="box-quiet" x="340" y="180" width="362" height="68" rx="6"/>
<text class="t-sm" x="354" y="206">未確認</text>
<text class="t-sm" x="354" y="230">まだ一度も動かしていない</text>
<line class="line" x1="308" y1="214" x2="326" y2="214"/>
<path d="M326 210 L333 214 L326 218 Z" fill="#8b949e"/>
<rect class="box-quiet" x="18" y="264" width="282" height="68" rx="6"/>
<text class="t" x="32" y="304">こちらのURLから取得できます</text>
<rect class="box-bad" x="340" y="264" width="362" height="68" rx="6"/>
<text class="t-bad" x="354" y="290">開けなかった</text>
<text class="t-sm" x="354" y="314">実際に開くと404だった</text>
<line class="line" x1="308" y1="298" x2="326" y2="298"/>
<path d="M326 294 L333 298 L326 302 Z" fill="#8b949e"/>
<text class="t-xs" x="18" y="366">※ 3行ともそのまま読めば「できました」に見えます。だから分けさせます。</text>
</svg>
