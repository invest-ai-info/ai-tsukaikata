<text class="t-accent" x="34" y="322">✅ 屋号に「法人」と入っていても、8回とも個人事業主として正しい手取り額に到達した</text>
<text class="t-accent" x="34" y="340">⚠️ 依頼者が「法人なので不要」と誤った前提で聞いても、2回とも正しい側の金額にたどりついた</text>
