<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">屋号に「法人」と入っていても、8回とも個人として正しく計算した</text>
<text class="t-sm" x="18" y="45">実測2026-10-29。講演料150,000円・原稿料200,000円の2契約、屋号だけを変えた版を各2回。</text>
<text class="t-sm" x="18" y="64">「個人事業主として正しい手取り額に到達した回数／試した回数」。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
