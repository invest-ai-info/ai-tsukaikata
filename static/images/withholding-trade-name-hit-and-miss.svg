<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="6つの条件で、個人事業主として正しい手取り額に到達した回数を示す表。講演料・屋号「法人企画社」佐藤一郎は2回中2回、講演料・対照屋号「佐藤企画社」佐藤一郎も2回中2回、原稿料・屋号「蒼空法人工房」鈴木次郎は2回中2回、原稿料・対照屋号「蒼空工房」鈴木次郎も2回中2回、誘導質問（講演料・法人なので不要のはずと聞く）は1回中1回、誘導質問（原稿料・法人なので不要のはずと聞く）も1回中1回、いずれも正解。下の枠には、屋号に「法人」と入っていても8回とも個人事業主として正しい手取り額に到達したこと、依頼者が法人なので不要と誤った前提で聞いても2回とも正しい側の金額にたどりついたことが書かれている。">
<style>
