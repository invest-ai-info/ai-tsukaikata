<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-label="前回の出来上がりを今週の型として渡す形で週報を3週ぶん連鎖させ、メモにも第1週の週報にも1度も出てこない4つの言葉が、どの回の週報に出たかを並べた表。窓口という語は、第2週の1回目、第3週の1回目と2回目、第4週の1回目に出た。働きかけという語は、第2週の1回目、第3週の1回目と2回目に出た。業務量の配分という語は第4週の1回目と2回目、未回答という語は第4週の1回目に出た。窓口と働きかけは第2週の1回目に生まれ、その回の週報を第3週に渡したため、第3週は2回とも出ている。第2週の2回目は4語とも0件だったので、生まれるかどうかは回によるが、生まれた回を次の週に渡すかどうかは書き手が決めている。前回の出来上がりを渡さず空の見出しだけを渡した側は、12回すべてで4語とも0件だった。窓口が定まっていません、という文はメモに無く、元のメモは情シスの担当が誰か確定してない、だけである。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
