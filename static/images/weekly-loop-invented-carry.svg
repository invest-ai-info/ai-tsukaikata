<text class="t-xs" x="18" y="290">※「窓口」「働きかけ」は第2週の1回目に生まれた。その回の週報を第3週に渡したので、第3週は2回とも出ている。</text>
<text class="t-xs" x="18" y="308">※ 第2週の2回目は0件だった＝生まれるかどうかは回による。生まれた回を次に渡すかどうかは、こちらが決めている。</text>
<text class="t-xs" x="18" y="326">※ 前回の出来上がりを渡さず空の見出しだけにした側は、12回すべてで4語とも0件だった。</text>
<text class="t-xs" x="18" y="344">※「窓口が定まっていません」はメモに無い。元のメモは「情シスの担当が誰か確定してない」だけである。</text>
