<svg xmlns="http://www.w3.org/2000/svg" width="720" height="248" viewBox="0 0 720 248" role="img" aria-label="Gemini Omni 1.1 FlashとGemini Omni 1.2 Flashの、1回の生成で作れる動画の最大の長さを比べた横棒グラフ。1.1 Flashは最大10秒、1.2 Flashは最大15秒。1.2 Flashは3秒から15秒まで1秒刻みで長さを指定できると発表ページに明記されている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="248"/>
<text class="t-strong" x="18" y="26">ネイティブに作れる長さが、10秒から15秒に伸びた</text>
<text class="t-sm" x="18" y="45">1回の生成で作れる動画の最大の長さ（秒）。続きを足す編集機能とは別の数字。</text>
<text class="t-sm" x="18" y="64">1.2 Flashは3秒から15秒まで、1秒刻みで長さを指定できると発表ページに明記されている。</text>
<text class="t" x="18" y="106.0">Gemini Omni 1.1 Flash</text>
<rect class="bar-old" x="230" y="86" width="246.7" height="28" rx="3"/>
<text class="t-sm" x="484.7" y="106.0">最大10秒</text>
<text class="t" x="18" y="160.0">Gemini Omni 1.2 Flash</text>
<rect class="bar-new" x="230" y="140" width="370.0" height="28" rx="3"/>
<text class="t-sm" x="608.0" y="160.0">最大15秒</text>
<text class="t-xs" x="18" y="234">※ 出典: Gemini Omni 1.2 Flash発表ページ（blog.google・2026年11月5日）。</text>
