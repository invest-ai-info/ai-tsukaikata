<svg xmlns="http://www.w3.org/2000/svg" width="720" height="508" viewBox="0 0 720 508" role="img" aria-label="毎朝の自動処理が止まった日に書かせた引き継ぎメモについて、メモの字数と、翌日が必要とする値がメモに残った数を、頼み方4通りで並べた横棒グラフ。架空の待ち行列10行を2本作り、上から3行を処理させ、そのうち2行が別々の理由で止まるように仕込んだ。理由は、資料が404で取得できないことと、資料の中身が別案件のものだったこと。止まった2行について、行の名前、資料のファイル名、画面に出た文言の3つ、合わせて6個の文字列がメモに一字一句そのまま残ったかを数えた。1つの頼み方につき材料2本かける各2回で4回ずつ、全16回である。そのまま、その旨を書いてと頼んだ4回は、メモの平均が1004字で、値は24個中20個残った。何が起きたか、何を試したか、次に何をすれば直るかの3つを入れてと足した4回は、1254字で21個。さらに、次に読む人は会話を見られないので会話ではなくファイルにだけ書いてと足した4回は、1721字で21個。行の文字列とファイル名と出た文言をそのままコピーしてと足した4回は、2316字で24個全部が残った。つまりメモは2.3倍に伸びたのに、残る値は上の3つではほとんど動かない。落ちるものは決まっていて、調べものの材料では品目コード KX-2200 が6回とも落ち、請求書の材料ではファイル名 seikyu-shinonome-06.txt が6回中4回落ちた。どちらもメモの中では会社名や品名に言い換えられていた。4つ目のそのままコピーさせる頼み方だけが24個中24個で、落ちた値は0個だった。">
