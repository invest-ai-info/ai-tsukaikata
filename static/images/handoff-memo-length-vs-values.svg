<rect class="bg" x="0" y="0" width="720" height="508"/>
<text class="t-strong" x="18" y="26">メモは2.3倍に伸びた。翌日が要る値の数は、ほとんど動かない</text>
<text class="t-sm" x="18" y="45">架空の待ち行列10行を2本（調べもの／請求書の突き合わせ）。上から3行を毎朝処理させ、そのうち</text>
<text class="t-sm" x="18" y="64">2行が別々の理由で止まるように仕込んだ（資料が404／中身が別案件のもの）。止まった2行について</text>
<text class="t-sm" x="18" y="83">「行の名前・資料のファイル名・出た文言」の3つ＝計6個が、メモに一字一句そのまま残ったかを数えた。</text>
<text class="t-sm" x="18" y="102">1つの頼み方につき、材料2本 × 各2回 ＝ 4回。全16回。</text>
<text class="t-xs" x="405" y="112" text-anchor="middle">メモの字数</text>
<text class="t-xs" x="405" y="126" text-anchor="middle">（4回の平均）</text>
<text class="t-xs" x="587" y="112" text-anchor="middle">翌日が要る6個の値</text>
<text class="t-xs" x="587" y="126" text-anchor="middle">（4回で24個中）</text>
<text class="t" x="18" y="164">そのまま「その旨を書いて」</text>
<rect class="bar-old" x="330" y="149" width="63" height="22" rx="3"/>
<text class="t-sm" x="399" y="164">1004字</text>
<rect class="bar-in" x="512" y="149" width="125" height="22" rx="3"/>
<text class="t-sm" x="643" y="164">20/24</text>
<text class="t" x="18" y="220">＋「何が起きたか・何を試したか・次に何を」</text>
<rect class="bar-old" x="330" y="205" width="78" height="22" rx="3"/>
<text class="t-sm" x="414" y="220">1254字</text>
<rect class="bar-in" x="512" y="205" width="131" height="22" rx="3"/>
<text class="t-sm" x="649" y="220">21/24</text>
<text class="t" x="18" y="276">＋「会話ではなくファイルにだけ書いて」</text>
<rect class="bar-old" x="330" y="261" width="108" height="22" rx="3"/>
<text class="t-sm" x="444" y="276">1721字</text>
<rect class="bar-in" x="512" y="261" width="131" height="22" rx="3"/>
<text class="t-sm" x="649" y="276">21/24</text>
<text class="t" x="18" y="332">＋「行・ファイル名・出た文言をそのままコピー」</text>
<rect class="bar-old" x="330" y="317" width="145" height="22" rx="3"/>
<text class="t-sm" x="481" y="332">2316字</text>
<rect class="bar-new" x="512" y="317" width="150" height="22" rx="3"/>
<text class="t-good" x="668" y="332">24/24</text>
<text class="t-bad" x="18" y="382">※ 上の3つは 20・21・21 でほとんど同じ。メモが1.7倍になっても、残る値は1個しか増えない。</text>
<text class="t-bad" x="18" y="403">　 落ちるものは決まっている＝調べものでは品目コード KX-2200 が6回とも、</text>
<text class="t-bad" x="18" y="424">　 請求書ではファイル名 seikyu-shinonome-06.txt が6回中4回。どちらも会社名や品名に言い換えられていた。</text>
<text class="t-good" x="18" y="445">※ 4つ目（そのままコピーさせる）だけが 24/24。落ちた値は0個だった。</text>
<text class="t-xs" x="18" y="466">架空データでの実測（全16回）。当て方を2通り（完全一致／ゆるい正規表現）試したが、16回とも同じ数だった。</text>
<text class="t-xs" x="18" y="487">生の返り16通は docs/evidence/memo-that-names-the-next-row.md に全文置いてある。</text>
