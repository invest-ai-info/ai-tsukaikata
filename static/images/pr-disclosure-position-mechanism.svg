<svg xmlns="http://www.w3.org/2000/svg" width="720" height="484" viewBox="0 0 720 484" role="img" aria-label="同じ投稿文の構造を2パターンで比べる図。上段＝PR表記も入れてとだけ頼んだ場合。本文（4〜5行）の後に空行、その後にハッシュタグの列が続き、その列の中に#PRが混ざっている。読者は本文を読み終えたあとハッシュタグまで読まないと気づけない。下段＝本文の最初の1行に独立して書くよう頼んだ場合。投稿の一番上に【PR】の行が独立してあり、その後に本文、最後にPRを含まないハッシュタグの列が続く。読者は本文を読み始める前に気づける。下の枠には、ハッシュタグの列はSNSで折りたたまれたり省略されたりすることがあるため、その中に埋もれた表示は読者の目に入らないことがあること、消費者庁の運用基準第3-1-(2)-クが大量のハッシュタグの中に表示を埋もれさせる場合を判別困難な例として挙げていることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="484"/>
<text class="t-strong" x="18" y="26">PR表記の位置で、読者が気づくタイミングが変わる</text>
<text class="t-sm" x="18" y="45">同じ商品紹介文の構造を2パターンで比べた（実測はdocs/evidence参照）。</text>
<text class="t-sm" x="18" y="64">上＝「PR表記も入れて」とだけ頼んだ場合。下＝「本文の最初の1行に」と位置を指定した場合。</text>
<text class="t-strong" x="18" y="110">①「PR表記も入れて」（位置の指定なし）</text>
<rect class="box-quiet" x="18" y="122" width="684" height="34" rx="6"/>
<text class="t" x="34" y="144">本文（商品の特徴・4〜5行）</text>
<rect class="box-bad" x="18" y="162" width="684" height="34" rx="6"/>
<text class="t-bad" x="34" y="184">#商品名 #便利グッズ … #PR ←ここに埋もれる</text>
<text class="t-sm" x="18" y="216">→ 読者は本文を読み終え、ハッシュタグまで読まないと気づけない</text>
<text class="t-strong" x="18" y="252">②本文の最初の1行に、独立して書くよう指定</text>
<rect class="box-good" x="18" y="264" width="684" height="34" rx="6"/>
<text class="t-good" x="34" y="286" style="font-weight:700">【PR】商品名のご紹介です　←投稿の一番上</text>
<rect class="box-quiet" x="18" y="304" width="684" height="34" rx="6"/>
<text class="t" x="34" y="326">本文（商品の特徴・4〜5行）</text>
<rect class="box-quiet" x="18" y="344" width="684" height="34" rx="6"/>
<text class="t-sm" x="34" y="366">#商品名 #便利グッズ （PRは含まない）</text>
<text class="t-sm" x="18" y="398">→ 読者は本文を読み始める前に気づける</text>
<rect class="box-accent" x="18" y="418" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="438">✅ ハッシュタグの列はSNSで折りたたまれたり省略されたりすることがある</text>
<text class="t-accent" x="34" y="456">⚠️ 消費者庁の運用基準第3-1-(2)-クは「大量のハッシュタグの中に表示を埋もれさせる場合」を判別困難な例として挙げている</text>
</svg>
