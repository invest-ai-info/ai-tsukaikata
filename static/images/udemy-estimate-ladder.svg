<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="Udemyで3,000円の講座が月に何本売れたかを前提として置き、講師の取り分を2つの経路で並べた横棒グラフ。10本なら紹介リンク経由（97%）で29,100円・Udemy経由（37%）で11,100円、30本なら87,300円と33,300円、100本なら291,000円と111,000円。率は原文で本数はこちらが置いた前提、税やアプリ手数料は考えないと注記。下の枠には、同じ100本でも自分で集客すれば準本業帯（291,000円）でUdemy任せなら副業帯（111,000円）であること、実際は2つの経路が混ざり自分の紹介リンク経由の割合がそのまま取り分の割合を決めること、支払いはPayPalまたはPayoneer（米国外）で最低額と時期は今回の出典に無いので書いていないことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="380"/>
<text class="t-strong" x="18" y="26">推定＝3,000円 × 本数 × 97%（自分の集客）または 37%（Udemyの集客）</text>
<text class="t-sm" x="18" y="45">率は原文（2026-09-18確認）。本数はこちらが置いた前提で、何本売れるかの出典は無い。税・アプリ手数料は考えない。</text>
<text class="t-sm" x="18" y="64">濃い棒＝紹介リンク・クーポン経由（97%）、薄い棒＝Udemyの検索経由（37%）。月の取り分（円）。</text>
<text class="t-strong" x="18" y="126">10本（前提）</text>
<rect class="bar-out" x="150" y="112" width="30" height="18" rx="3"/>
<text class="t-strong" x="188" y="126">29,100円（97%）</text>
<rect class="bar-old" x="150" y="136" width="11" height="18" rx="3"/>
<text class="t" x="169" y="150">11,100円（37%）</text>
<text class="t-strong" x="18" y="186">30本（前提）</text>
<rect class="bar-out" x="150" y="172" width="90" height="18" rx="3"/>
<text class="t-strong" x="248" y="186">87,300円（97%）</text>
<rect class="bar-old" x="150" y="196" width="34" height="18" rx="3"/>
<text class="t" x="192" y="210">33,300円（37%）</text>
<text class="t-strong" x="18" y="246">100本（前提）</text>
<rect class="bar-out" x="150" y="232" width="300" height="18" rx="3"/>
<text class="t-strong" x="458" y="246">291,000円（97%）</text>
<rect class="bar-old" x="150" y="256" width="114" height="18" rx="3"/>
<text class="t" x="272" y="270">111,000円（37%）</text>
<rect class="box-accent" x="18" y="296" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="316">同じ100本でも、自分で集客すれば準本業帯（291,000円）、Udemy任せなら副業帯（111,000円）。</text>
<text class="t-accent" x="34" y="334">実際は2つの経路が混ざる。自分の紹介リンク経由の割合が、そのまま取り分の割合を決める。</text>
<text class="t-accent" x="34" y="352">支払いは PayPal／Payoneer（米国外）。最低額と時期は今回の出典に無いので書いていない。</text>
</svg>
