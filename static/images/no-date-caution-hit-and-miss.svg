<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="情報システム部お知らせ（既読リストの無い新規対象）の新着件数が0件になった回数を、軽い注意の有無で比べた表。軽い注意なしは0/2で、2回とも取得した8件全部を新着として報告した。軽い注意ありは2/2で、2回とも0件に戻り、既読リストが無いことを「過去の記録を新着に含めない」理由として正しく扱った。下の枠には、軽い注意が無いと2回とも8件全部を新着として報告したこと、軽い注意を足すと2回とも0件に戻り理由も正しく書いたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="240"/>
<text class="t-strong" x="18" y="26">日付が無くても、軽い注意で新着0件に戻った（2/2）</text>
<text class="t-sm" x="18" y="45">社内お知らせ掲示板4本の監視に、日付を一切持たない5本目の対象を追加する場面で実測。</text>
<text class="t-sm" x="18" y="64">「既読リストが無い対象も、過去の記録まで新着に含めないよう注意」の有無だけを振った。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">軽い注意なし（情報システム部が0件になった回）</text>
<rect class="box-bad" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="125" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="157">軽い注意あり（情報システム部が0件になった回）</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="174" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="194">軽い注意が無いと、2回とも取得した8件全部を「新着」として報告した。</text>
<text class="t-accent" x="34" y="212">軽い注意を足すと、2回とも0件に戻り、理由も「既読の基準として扱った」と正しく書いた。</text>
</svg>
