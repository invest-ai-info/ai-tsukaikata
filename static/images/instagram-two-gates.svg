<svg xmlns="http://www.w3.org/2000/svg" width="720" height="422" viewBox="0 0 720 422" role="img" aria-label="Instagramの収益化の門を2つ並べた図。門①ギフトはフォロワー500人以上で、スター1個＝US$0.01をクリエイターに提供し、アプリ内購入の手数料は通常30%が購入時にかかる。門②サブスクリプションはフォロワー10,000人以上かつ18歳以上で、プロアカウントが必要、対象国に日本があり、ギフトも同じ。その下の枠は門の先の関所（米国以外の支払い）で、電信送金は残高US$100以上で月1回、他の支払い方法は残高US$25以上で月1回、毎月21日ごろに支払われ、支払いアカウント無しで貯められるのは1ツール最大US$500で、6か月以内に追加しないと権利を喪失する。ボーナス（招待制）は原文を開いていないので含めていないと注記。いちばん下の赤い枠は収益化ポリシーで禁止されているフォーマットで、動きの乏しい動画、静止画像を使ったアンケート、画像のスライドショー、ループ動画、主にテキストを組み合わせたコンテンツ、埋め込み広告が並び、禁止カテゴリに「オリジナルでないコンテンツ」があると書かれている。公式ヘルプ4ページの記載を2026年9月18日に確認して写したもので、4ページとも更新日の記載が無い。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="422"/>
<text class="t-strong" x="18" y="26">Instagramの収益化は、門が2つある</text>
<text class="t-sm" x="18" y="45">公式ヘルプ4ページ（サブスク要件・ギフト・支払い・コンテンツ収益化ポリシー）の記載をそのまま写した（2026-09-18確認）。</text>
<text class="t-sm" x="18" y="64">4ページとも更新日の記載が無い。人数・単価・最低額は変わるので、使う前に開くこと。</text>
<rect class="box-accent" x="18" y="96" width="336" height="118" rx="6"/>
<text class="t-strong" x="32" y="120">門①ギフト</text>
<text class="t-accent" x="32" y="146">フォロワー 500人以上</text>
<text class="t" x="32" y="172">スター1個＝US$0.01 をクリエイターに</text>
<text class="t-sm" x="32" y="194">アプリ内購入の手数料は通常30%（購入時）</text>
<rect class="box-accent" x="366" y="96" width="336" height="118" rx="6"/>
<text class="t-strong" x="380" y="120">門②サブスクリプション</text>
<text class="t-accent" x="380" y="146">フォロワー 10,000人以上＋18歳以上</text>
<text class="t" x="380" y="172">プロアカウントが必要</text>
<text class="t-sm" x="380" y="194">対象国に日本あり（ギフトも同じ）</text>
<rect class="box" x="18" y="228" width="684" height="92" rx="6"/>
<text class="t-strong" x="34" y="250">門の先の関所（米国以外の支払い）</text>
<text class="t" x="34" y="272">電信送金＝残高 US$100 以上で月1回／他の支払い方法＝残高 US$25 以上で月1回／毎月21日ごろ</text>
<text class="t" x="34" y="292">支払いアカウント無しで貯められるのは1ツール最大 US$500。6か月以内に追加しないと権利を喪失</text>
<text class="t-sm" x="34" y="310">ボーナス（招待制）は原文を今回開いていないので、この図には含めていない。</text>
<rect class="box-bad" x="18" y="332" width="684" height="70" rx="6"/>
<text class="t-bad" x="34" y="354">収益化ポリシーで「禁止されているフォーマット」（AIの語は1つも無い）</text>
<text class="t" x="34" y="376">動きの乏しい動画／静止画像を使ったアンケート／画像のスライドショー／ループ動画</text>
<text class="t" x="34" y="394">主にテキストを組み合わせたコンテンツ／埋め込み広告。禁止カテゴリに「オリジナルでないコンテンツ」</text>
</svg>
