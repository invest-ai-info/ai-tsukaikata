<svg xmlns="http://www.w3.org/2000/svg" width="720" height="378" viewBox="0 0 720 378" role="img" aria-label="無関係な資料を混ぜた本数（0〜4本）を横棒で示し、その右に答えに紛れ込んだ件数を試行回数分の分数で示した図。関係する3本だけの版・献立表を1本足した版・無関係4本を混ぜた版・使わないでと明記した版・使った資料を書かせた版の5つとも、混入は0/2で、10回通しても0/10だった。先月ログには今日の基準に当てはめると該当しそうに見える5件をわざと仕込んだが、10回とも1件も答えに出てこなかった。5版とも該当5件は10回とも一致し、旧い判定基準を使ってしまった回も0回だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="378"/>
<text class="t-strong" x="18" y="26">無関係な資料を4本まで増やしても、混入は0のままだった</text>
<text class="t-sm" x="18" y="45">当日の受付ログ・連絡メモ・判定基準の3点に、無関係な資料を0〜4本混ぜた5つの版を、各2回・計10回試した。</text>
<text class="t-sm" x="18" y="64">棒＝混ぜた無関係資料の本数。右の分数＝答えに紛れ込んだ件数／試行回数。</text>
<text class="t-bad" x="18" y="86">※ 先月ログには、今日の基準に当てはめると該当しそうに見える5件を仕込んだが、10回とも1件も出てこなかった。</text>
<path class="line" d="M268.0 124 L268.0 308" stroke-dasharray="3 4"/>
<text class="t-xs" x="268.0" y="118" text-anchor="middle">0本</text>
<path class="line" d="M333.0 124 L333.0 308" stroke-dasharray="3 4"/>
<text class="t-xs" x="333.0" y="118" text-anchor="middle">1本</text>
<path class="line" d="M398.0 124 L398.0 308" stroke-dasharray="3 4"/>
<text class="t-xs" x="398.0" y="118" text-anchor="middle">2本</text>
<path class="line" d="M463.0 124 L463.0 308" stroke-dasharray="3 4"/>
<text class="t-xs" x="463.0" y="118" text-anchor="middle">3本</text>
<path class="line" d="M528.0 124 L528.0 308" stroke-dasharray="3 4"/>
<text class="t-xs" x="528.0" y="118" text-anchor="middle">4本</text>
<text class="t" x="18" y="149">(a) 関係する3本だけ</text>
<rect class="bar-old" x="268.0" y="133" width="2.0" height="16" rx="2"/>
<text class="t-good" x="542.0" y="146">混入 0/2</text>
<text class="t" x="18" y="189">(b) ＋献立表を1本</text>
<rect class="bar-old" x="268.0" y="173" width="65.0" height="16" rx="2"/>
<text class="t-good" x="542.0" y="186">混入 0/2</text>
<text class="t" x="18" y="229">(c) ＋無関係4本を混ぜる</text>
<rect class="bar-old" x="268.0" y="213" width="260.0" height="16" rx="2"/>
<text class="t-good" x="542.0" y="226">混入 0/2</text>
<text class="t" x="18" y="269">(d) (c)＋「使わないで」を明記</text>
<rect class="bar-old" x="268.0" y="253" width="260.0" height="16" rx="2"/>
<text class="t-good" x="542.0" y="266">混入 0/2</text>
<text class="t" x="18" y="309">(e) (c)＋「使った資料を書いて」</text>
<rect class="bar-old" x="268.0" y="293" width="260.0" height="16" rx="2"/>
<text class="t-good" x="542.0" y="306">混入 0/2</text>
<text class="t-xs" x="18" y="334">5版とも、該当5件（S-2601・S-2606・S-2607・S-2609・S-2611）は10回とも一致した。</text>
<text class="t-xs" x="18" y="353">旧い判定基準（2か所だけ新基準と違う）を使ってしまった回も、10回中0回だった。</text>
</svg>
