<svg xmlns="http://www.w3.org/2000/svg" width="720" height="258" viewBox="0 0 720 258" role="img" aria-label="前の記事（文末1種類のみ）と、この記事（文末2種類を別々の箇所に仕込む）の解消率を比べる表。前の記事は15回中15回が解消。この記事は10回中10回が両方解消。下の枠には、前の記事は文末1種類・連続4〜6回で15回とも解消したこと、この記事は文末2種類を別々の箇所に・各3〜4回連続で10回とも両方解消したこと、文末の種類を1つから2つに増やしても素朴な指示の天井は変わらなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="258"/>
<text class="t-strong" x="18" y="26">文末を2種類に増やしても、解消する回数は変わらなかった</text>
<text class="t-sm" x="18" y="45">前の記事（2026-10-22実測・文末1種類のみを仕込んだ場合）と、この記事を比べた。</text>
<text class="t-sm" x="18" y="64">「3回以上連続が解消した回数／試した回数」。両方とも全回で解消している。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">前の記事：文末1種類のみを仕込んだ場合（15回）</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">15/15</text>
<text class="t" x="18" y="157">この記事：2種類を別々の箇所に仕込んだ場合（10回）</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">10/10</text>
<rect class="box-accent" x="18" y="174" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="194">前の記事（文末1種類・連続4〜6回）は15回とも解消した。</text>
<text class="t-accent" x="34" y="212">この記事（文末2種類を別々の箇所に・各3〜4回連続）も10回とも両方解消した。</text>
<text class="t-accent" x="34" y="230">文末の種類を1つから2つに増やしても、素朴な「人間らしく書き直して」の天井は変わらなかった。</text>
</svg>
