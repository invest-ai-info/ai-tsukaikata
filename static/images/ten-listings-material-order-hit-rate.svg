</style>
<rect class="bg" x="0" y="0" width="720" height="340"/>
<text class="t-strong" x="18" y="26">崩れたのは、どちらの並べ方でも同じ1件だけだった</text>
<text class="t-sm" x="18" y="45">実測2026-11-15。出品10件（既存5件＋新規5件）の本文を渡し、月額か別物かを判定させた。</text>
<text class="t-sm" x="18" y="64">材料I＝価格の安い順／材料J＝検索結果のランキング順。各3回・計6回、10件すべてを判定。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">10件全問正解（材料I・価格順3回）</text>
<rect class="box" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="125" text-anchor="middle" style="font-weight:700">2/3</text>
<text class="t" x="18" y="157">10件全問正解（材料J・検索順3回）</text>
<rect class="box" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="157" text-anchor="middle" style="font-weight:700">2/3</text>
<text class="t" x="18" y="189">他の9件が正解だった回（6回分）</text>
<rect class="box-good" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="189" text-anchor="middle" style="font-weight:700">54/54</text>
<text class="t" x="18" y="221">崩れた1件（30,000円・3ヶ月パック）が正解だった回</text>
<rect class="box" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="221" text-anchor="middle" style="font-weight:700">4/6</text>
<rect class="box-accent" x="18" y="238" width="684" height="82" rx="6"/>
<text class="t-accent" x="34" y="258">崩れた回はいずれも同じ1件（30,000円・3ヶ月パック・一括支払い）を「月額」と誤判定した。</text>
<text class="t-accent" x="34" y="276">他の9件（1,500円〜60,000円の残り）は、材料I・Jあわせて6回とも全部正解（54/54）。</text>
<text class="t-accent" x="34" y="294">並べ方（価格順か検索順か）による差は見られなかった。「1か月あたりに直して」の一文を</text>
<text class="t-accent" x="34" y="312">足すと、この1件も2回とも正解した。</text>
</svg>
