<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="ココナラの出品10件（既存5件＋新規5件）を材料I（価格順）・材料J（検索順）の2通りの並べ方で渡し、価格が1か月分の運用代金かどうかを各3回判定させた結果の表。材料Iは3回中2回が10件全問正解・1回が9件正解。材料Jも3回中2回が10件全問正解・1回が9件正解。他の9件が正解だった回は6回とも全部（54/54）。崩れた1件（30,000円・3ヶ月パック）が正解だった回は6回中4回。下の枠には、崩れた回はいずれも同じ1件を月額と誤判定したこと、他の9件は6回とも全部正解であったこと、並べ方による差は見られなかったこと、「1か月あたりに直して」の一文を足すとこの1件も2回とも正解したことが書かれている。">
<style>
