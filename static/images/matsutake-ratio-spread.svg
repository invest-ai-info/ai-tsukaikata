<svg xmlns="http://www.w3.org/2000/svg" width="720" height="458" viewBox="0 0 720 458" role="img" aria-label="見積もりを3段階で出す実測で、標準/安い・高い/標準の比率を8回分示す表。材料A（記事執筆代行）は1回目1.94倍/1.80倍、2回目2.00倍/1.67倍、3回目1.88倍/1.67倍。材料B（名刺デザイン）は1回目1.88倍/1.87倍、2回目1.88倍/1.67倍、3回目は3.00倍/2.33倍に跳ねて赤で強調されている。比率を1.5倍・1.5倍に指定した版は材料A・材料Bとも1.50倍・1.50倍で緑で強調。下の枠には、6回のうち5回は標準/安いが1.88〜2.00倍、高い/標準が1.67〜1.87倍という狭い範囲に収まったこと、材料Bの3回目だけ3.00倍・2.33倍に跳ねたこと、比率を指定した2回は材料が違っても指定どおり1.50倍・1.50倍で揃ったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="458"/>
<text class="t-strong" x="18" y="26">素朴に頼むと6回中1回だけ、比率が1.6倍近く跳ねた</text>
<text class="t-sm" x="18" y="45">架空の案件2本（記事執筆代行・名刺デザイン）に「安い/標準/高い」の3段階見積もりを各3回頼んだ。</text>
<text class="t-sm" x="18" y="64">下2行は「標準は安いの1.5倍、高いは標準の1.5倍にして」と比率を指定した版（各1回）。</text>
<text class="t-xs" x="373.0" y="98" text-anchor="middle">標準／安い</text>
<text class="t-xs" x="547.0" y="98" text-anchor="middle">高い／標準</text>
<text class="t" x="18" y="133">材料A・記事執筆代行 1回目</text>
<rect class="box" x="298" y="112" width="150" height="26" rx="4"/>
<text class="t" x="373.0" y="133" text-anchor="middle" style="font-weight:700">1.94倍</text>
<rect class="box" x="472" y="112" width="150" height="26" rx="4"/>
<text class="t" x="547.0" y="133" text-anchor="middle" style="font-weight:700">1.80倍</text>
<text class="t" x="18" y="165">材料A・記事執筆代行 2回目</text>
<rect class="box" x="298" y="144" width="150" height="26" rx="4"/>
<text class="t" x="373.0" y="165" text-anchor="middle" style="font-weight:700">2.00倍</text>
<rect class="box" x="472" y="144" width="150" height="26" rx="4"/>
<text class="t" x="547.0" y="165" text-anchor="middle" style="font-weight:700">1.67倍</text>
<text class="t" x="18" y="197">材料A・記事執筆代行 3回目</text>
<rect class="box" x="298" y="176" width="150" height="26" rx="4"/>
<text class="t" x="373.0" y="197" text-anchor="middle" style="font-weight:700">1.88倍</text>
<rect class="box" x="472" y="176" width="150" height="26" rx="4"/>
<text class="t" x="547.0" y="197" text-anchor="middle" style="font-weight:700">1.67倍</text>
<text class="t" x="18" y="229">材料B・名刺デザイン 1回目</text>
<rect class="box" x="298" y="208" width="150" height="26" rx="4"/>
<text class="t" x="373.0" y="229" text-anchor="middle" style="font-weight:700">1.88倍</text>
<rect class="box" x="472" y="208" width="150" height="26" rx="4"/>
<text class="t" x="547.0" y="229" text-anchor="middle" style="font-weight:700">1.87倍</text>
<text class="t" x="18" y="261">材料B・名刺デザイン 2回目</text>
<rect class="box" x="298" y="240" width="150" height="26" rx="4"/>
<text class="t" x="373.0" y="261" text-anchor="middle" style="font-weight:700">1.88倍</text>
<rect class="box" x="472" y="240" width="150" height="26" rx="4"/>
<text class="t" x="547.0" y="261" text-anchor="middle" style="font-weight:700">1.67倍</text>
<text class="t" x="18" y="293">材料B・名刺デザイン 3回目</text>
<rect class="box-bad" x="298" y="272" width="150" height="26" rx="4"/>
<text class="t-bad" x="373.0" y="293" text-anchor="middle" style="font-weight:700">3.00倍</text>
<rect class="box-bad" x="472" y="272" width="150" height="26" rx="4"/>
<text class="t-bad" x="547.0" y="293" text-anchor="middle" style="font-weight:700">2.33倍</text>
<text class="t" x="18" y="325">材料A・比率を1.5倍/1.5倍に指定</text>
<rect class="box-good" x="298" y="304" width="150" height="26" rx="4"/>
<text class="t-good" x="373.0" y="325" text-anchor="middle" style="font-weight:700">1.50倍</text>
<rect class="box-good" x="472" y="304" width="150" height="26" rx="4"/>
<text class="t-good" x="547.0" y="325" text-anchor="middle" style="font-weight:700">1.50倍</text>
<text class="t" x="18" y="357">材料B・比率を1.5倍/1.5倍に指定</text>
<rect class="box-good" x="298" y="336" width="150" height="26" rx="4"/>
<text class="t-good" x="373.0" y="357" text-anchor="middle" style="font-weight:700">1.50倍</text>
<rect class="box-good" x="472" y="336" width="150" height="26" rx="4"/>
<text class="t-good" x="547.0" y="357" text-anchor="middle" style="font-weight:700">1.50倍</text>
<rect class="box-accent" x="18" y="374" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="394">6回のうち5回は標準/安いが1.88〜2.00倍、高い/標準が1.67〜1.87倍という狭い範囲に収まった。</text>
<text class="t-accent" x="34" y="412">材料Bの3回目だけ、標準/安いが3.00倍・高い/標準が2.33倍に跳ねた（同じ指示文・同じ案件）。</text>
<text class="t-accent" x="34" y="430">「1.5倍にして」と比率を指定した2回は、材料が違っても指定どおり1.50倍・1.50倍で揃った。</text>
</svg>
