<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">8/8</text>
<text class="t" x="18" y="221">②開始の近さを名指し：巻き添え（2回分・4機会）</text>
<rect class="box-bad" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="221" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="253">③②＋「今日より先は除く」：そろそろ型4件の回収（2回分・8機会）</text>
<rect class="box-good" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="253" text-anchor="middle" style="font-weight:700">8/8</text>
<text class="t" x="18" y="285">③②＋「今日より先は除く」：巻き添え（2回分・4機会）</text>
<rect class="box-good" x="478" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="285" text-anchor="middle" style="font-weight:700">0/4</text>
<rect class="box-accent" x="18" y="302" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="322">①は2回のうち1回だけ全4件を拾い、もう1回は4件とも拾わなかった（運次第）。</text>
<text class="t-accent" x="34" y="340">②は毎回拾えたが、来月・契約更新の話まで毎回誤って含めた。③はどちらも2回とも揃った。</text>
