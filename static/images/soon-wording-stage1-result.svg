<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="横棒の一覧表。「そろそろ」「まもなく」「もうすぐ」「あと少しで」型の至急4件を含む16件の材料に、3版の指示文を各2回試した結果を示す。①現行の一文のみは、そろそろ型4件の回収が2回分8機会中4機会（2回のうち1回は全4件・もう1回は0件という運次第の結果）で黄、巻き添えは0/4で緑。②開始の近さを名指しすると、そろそろ型4件の回収は8/8で緑に上がるが、巻き添え（来月の研修・契約更新の話に『そろそろ』『まもなく』が使われている2件）も4/4で赤に増える。③②に『今日より先の出来事は含めない』という一文を足すと、そろそろ型4件の回収は8/8の緑を保ったまま、巻き添えは0/4の緑に戻る。下の枠には、①は2回のうち1回だけ全4件を拾い、もう1回は4件とも拾わなかったこと、②は毎回拾えたが来月・契約更新の話まで毎回誤って含めたこと、③はどちらも2回とも揃ったことが書かれている。">
<style>
