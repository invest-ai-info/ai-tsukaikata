</style>
<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">開始の近さを名指しすると拾えるが、巻き添えも増える。「今日より先は除く」まで足すと両方揃う</text>
<text class="t-sm" x="18" y="45">実測2026-11-23。「そろそろ」「まもなく」「もうすぐ」「あと少しで」型の至急4件を含む16件に、3版の指示文を各2回試した。</text>
<text class="t-sm" x="18" y="64">巻き添え＝来月の研修・契約更新の話にも「そろそろ」「まもなく」が使われている2件（4408・4409）。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
