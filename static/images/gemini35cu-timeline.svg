<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-label="Gemini の画面操作機能の年表。2026年5月19日にGemini 3.5 Flashを発表（この時点では画面操作は搭載されていない）。その36日後の6月24日、画面操作をGemini API・Gemini Enterprise Agent Platform経由で標準搭載。さらに50日後の8月13日にGemini 3.7 Flashを発表し、公式ドキュメントの推奨モデルが3.7 Flashに交代した。8月26日（この記事の確認時点）でもドキュメントは3.5 Flashを「Previous stable model」と説明している。日数はいずれも暦日の単純な引き算。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="332"/>
<text class="t-strong" x="18" y="26">画面操作が標準搭載されてから、推奨モデルが交代するまで50日</text>
<text class="t-sm" x="18" y="45">Gemini 3.5 Flash に画面操作が載ったのは発表の36日後。そこから50日で、公式ドキュメントの推奨モデルは次の世代に移りました。</text>
<text class="t-sm" x="18" y="64">日数はいずれも暦日の引き算です（この記事で計算）。</text>
<line class="line" x1="26" y1="96" x2="26" y2="276"/>
<circle class="box-quiet" cx="26" cy="96" r="7"/>
<text class="t-xs" x="50" y="88">2026年5月19日</text>
<text class="t-strong" x="50" y="106">Gemini 3.5 Flash を発表</text>
<text class="t-sm" x="50" y="123">この時点では、画面操作（Computer Use）は搭載されていない</text>
<circle class="box-accent" cx="26" cy="156" r="7"/>
<text class="t-xs" x="50" y="148">2026年6月24日（36日後）</text>
<text class="t-strong" x="50" y="166">画面操作を標準搭載</text>
<text class="t-sm" x="50" y="183">Gemini API・Gemini Enterprise Agent Platform ですぐ使える</text>
<circle class="box-accent" cx="26" cy="216" r="7"/>
<text class="t-xs" x="50" y="208">2026年8月13日（+50日）</text>
<text class="t-strong" x="50" y="226">Gemini 3.7 Flash を発表</text>
<text class="t-sm" x="50" y="243">ドキュメントの「推奨モデル」が3.7 Flashに交代</text>
<circle class="box-quiet" cx="26" cy="276" r="7"/>
<text class="t-xs" x="50" y="268">2026年8月26日（この記事の確認時点）</text>
<text class="t-strong" x="50" y="286">ドキュメント最終更新</text>
<text class="t-sm" x="50" y="303">3.5 Flashは「Previous stable model」と説明されている</text>
<text class="t-xs" x="18" y="298">※ 「推奨モデル」はドキュメントの Model versions 節の記載です。3.5 Flash 自体が使えなくなったわけではありません。</text>
<text class="t-xs" x="18" y="316">※ 3.6 Flash・3.5 Flash-Lite も画面操作に対応していますが、この図では日付が確認できた3点だけを示しています。</text>
</svg>
