<text class="t-good" x="458.0" y="151" text-anchor="middle" style="font-weight:700">○</text>
<rect class="box-bad" x="510" y="130" width="72" height="30" rx="4"/>
<text class="t-bad" x="546.0" y="151" text-anchor="middle" style="font-weight:700">×</text>
<rect class="box-bad" x="598" y="130" width="72" height="30" rx="4"/>
<text class="t-bad" x="634.0" y="151" text-anchor="middle" style="font-weight:700">×</text>
<text class="t" x="18" y="189">学習塾・2段（小計+総合計）</text>
<rect class="box-bad" x="246" y="168" width="72" height="30" rx="4"/>
<text class="t-bad" x="282.0" y="189" text-anchor="middle" style="font-weight:700">×</text>
<rect class="box-bad" x="334" y="168" width="72" height="30" rx="4"/>
<text class="t-bad" x="370.0" y="189" text-anchor="middle" style="font-weight:700">×</text>
<rect class="box-bad" x="422" y="168" width="72" height="30" rx="4"/>
<text class="t-bad" x="458.0" y="189" text-anchor="middle" style="font-weight:700">×</text>
<rect class="box-bad" x="510" y="168" width="72" height="30" rx="4"/>
<text class="t-bad" x="546.0" y="189" text-anchor="middle" style="font-weight:700">×</text>
<rect class="box-bad" x="598" y="168" width="72" height="30" rx="4"/>
<text class="t-bad" x="634.0" y="189" text-anchor="middle" style="font-weight:700">×</text>
<text class="t" x="18" y="227">カフェ・1段（小計のみ）</text>
<rect class="box-good" x="246" y="206" width="72" height="30" rx="4"/>
<text class="t-good" x="282.0" y="227" text-anchor="middle" style="font-weight:700">○</text>
<rect class="box-bad" x="334" y="206" width="72" height="30" rx="4"/>
<text class="t-bad" x="370.0" y="227" text-anchor="middle" style="font-weight:700">×</text>
<rect class="box-good" x="422" y="206" width="72" height="30" rx="4"/>
<text class="t-good" x="458.0" y="227" text-anchor="middle" style="font-weight:700">○</text>
<rect class="box-bad" x="510" y="206" width="72" height="30" rx="4"/>
<text class="t-bad" x="546.0" y="227" text-anchor="middle" style="font-weight:700">×</text>
<rect class="box-good" x="598" y="206" width="72" height="30" rx="4"/>
<text class="t-good" x="634.0" y="227" text-anchor="middle" style="font-weight:700">○</text>
<text class="t" x="18" y="265">カフェ・2段（小計+総合計）</text>
<rect class="box-good" x="246" y="244" width="72" height="30" rx="4"/>
<text class="t-good" x="282.0" y="265" text-anchor="middle" style="font-weight:700">○</text>
<rect class="box-bad" x="334" y="244" width="72" height="30" rx="4"/>
<text class="t-bad" x="370.0" y="265" text-anchor="middle" style="font-weight:700">×</text>
<rect class="box-good" x="422" y="244" width="72" height="30" rx="4"/>
<text class="t-good" x="458.0" y="265" text-anchor="middle" style="font-weight:700">○</text>
<rect class="box-bad" x="510" y="244" width="72" height="30" rx="4"/>
<text class="t-bad" x="546.0" y="265" text-anchor="middle" style="font-weight:700">×</text>
<rect class="box-good" x="598" y="244" width="72" height="30" rx="4"/>
<text class="t-good" x="634.0" y="265" text-anchor="middle" style="font-weight:700">○</text>
<rect class="box-accent" x="18" y="292" width="678" height="56" rx="6"/>
<text class="t-accent" x="34" y="314" style="font-weight:700">学習塾は2/5→0/5に落ちたが、カフェは3/5→3/5で変わらず</text>
<text class="t-sm" x="34" y="334">材料によって崩れ方が違う＝「2段だから悪化する」と一括りにはできない。</text>
</svg>
