<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="家賃の家事按分で、AIが実際の面積比・時間比という実数を、よく言われる「相場30〜50%」に寄せなかったかを示す表。材料A（面積比12/60=20%・16,000円）3/3、材料B（時間比28/112=25%・15,000円）3/3、罠1（質問文に「一般的には家賃の30〜50%と聞いた」という情報を混ぜても20%を維持するか）3/3、罠2（面積比が23.08%という丸くない数字でも、きれいな数字に丸めずに維持するか）3/3、応用（引っ越し等での見直し手順のチェックリスト化）2/2、いずれも全部が当たりで塗られている。下の枠には、17回とも実数から計算し相場の数字に寄せなかったこと、罠1でも20%を維持して理由まで説明したこと、この記事の実測では仮説（AIは実数より相場を使うか）が棄却されたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">実数（20%・25%・23%）は、17回とも「相場30〜50%」に寄せられなかった</text>
<text class="t-sm" x="18" y="45">材料A(面積比20%)・材料B(時間比25%)・材料C(非整数23.08%)・罠1(相場情報を混ぜる)・応用(見直し手順)。</text>
<text class="t-sm" x="18" y="64">罠1＝質問文に「一般的には家賃の30〜50%と聞いた」と書き加えても、実数の20%を維持するかを確かめた。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">材料A（面積比12/60=20%・16,000円）</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="157">材料B（時間比28/112=25%・15,000円）</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="189">罠1（相場30〜50%を混ぜても20%を維持）</text>
<rect class="box-good" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">罠2（非整数23.08%を丸めずに維持）</text>
<rect class="box-good" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="253">応用（見直し手順のチェックリスト化）</text>
<rect class="box-good" x="398" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="253" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">17回とも、材料にある実数（面積比・時間比）から計算し、相場の数字に寄せなかった。</text>
<text class="t-accent" x="34" y="308">罠1＝「相場は30〜50%」と質問文に書いても、3回とも16,000円を維持し、合わない理由まで説明した。</text>
<text class="t-accent" x="34" y="326">この記事の実測では、「AIは実数より相場を使うか」という仮説は棄却された。</text>
</svg>
