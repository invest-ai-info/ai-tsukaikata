<svg xmlns="http://www.w3.org/2000/svg" width="720" height="344" viewBox="0 0 720 344" role="img" aria-label="追記の話題の近さ（近い／遠い／遠い＋一文）ごとに、提案文が追記に触れた回数を材料別に比べたグループ横棒グラフ。材料1（サイトリニューアル）は、近い話題（フォームの不具合）で6/6、遠い話題（展示会の案内係）で0/6、一文を足すと5/6。材料2（動画ナレーション）は、近い話題（動画の字幕）で6/6、遠い話題（展示会の受付）で3/6、一文を足すと6/6。下の枠には、同じ追記の一文でも本題とどれだけ話題が近いかで拾われ方が変わること、確実に拾わせたいなら話題を近づけるより名指しで頼むほうが安定することが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="344"/>
<text class="t-strong" x="18" y="26">話題が近いだけで拾い、遠いだけで拾わない</text>
<text class="t-sm" x="18" y="45">バーは「提案文の本体で追記の話題に触れた回数／試した回数」。追記の位置と長さはどの版も揃えた。</text>
<text class="t-sm" x="18" y="64">遠い話題の落ち方は材料によって強さが違う（材料1は0/6、材料2は3/6）。</text>
<text class="t-sm" x="18" y="83">「困っていそうなことも考えて」を足すと、遠い話題でもどちらの材料も5/6・6/6に戻った。</text>
<text class="t-strong" x="18" y="102">材料1：サイトリニューアル</text>
<text class="t-xs" x="288" y="122" text-anchor="end">近い話題（フォームの不具合）</text>
<rect class="box-quiet" x="300" y="110" width="310" height="16" rx="3"/>
<rect class="box-good" x="300" y="110" width="310.0" height="16" rx="3"/>
<text class="t-sm" x="620" y="122">6／6</text>
<text class="t-xs" x="288" y="143" text-anchor="end">遠い話題（展示会の案内係）</text>
<rect class="box-quiet" x="300" y="131" width="310" height="16" rx="3"/>
<text class="t-sm" x="620" y="143">0／6</text>
<text class="t-xs" x="288" y="164" text-anchor="end">遠い話題＋「困っていそうなことも考えて」</text>
<rect class="box-quiet" x="300" y="152" width="310" height="16" rx="3"/>
<rect class="box" x="300" y="152" width="258.3" height="16" rx="3"/>
<text class="t-sm" x="620" y="164">5／6</text>
<text class="t-strong" x="18" y="185">材料2：動画ナレーション</text>
<text class="t-xs" x="288" y="205" text-anchor="end">近い話題（動画の字幕）</text>
<rect class="box-quiet" x="300" y="193" width="310" height="16" rx="3"/>
<rect class="box-good" x="300" y="193" width="310.0" height="16" rx="3"/>
<text class="t-sm" x="620" y="205">6／6</text>
<text class="t-xs" x="288" y="226" text-anchor="end">遠い話題（展示会の受付）</text>
<rect class="box-quiet" x="300" y="214" width="310" height="16" rx="3"/>
<rect class="box" x="300" y="214" width="155.0" height="16" rx="3"/>
<text class="t-sm" x="620" y="226">3／6</text>
<text class="t-xs" x="288" y="247" text-anchor="end">遠い話題＋「困っていそうなことも考えて」</text>
<rect class="box-quiet" x="300" y="235" width="310" height="16" rx="3"/>
<rect class="box-good" x="300" y="235" width="310.0" height="16" rx="3"/>
<text class="t-sm" x="620" y="247">6／6</text>
<rect class="box-accent" x="18" y="280" width="684" height="44" rx="6"/>
<text class="t-accent" x="34" y="300">同じ追記の一文でも、本題とどれだけ話題が近いかで拾われ方が変わる。</text>
<text class="t-accent" x="34" y="318">確実に拾わせたいなら、話題を近づけるより名指しで頼むほうが安定する。</text>
</svg>
