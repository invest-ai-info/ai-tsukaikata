<rect class="bg" x="0" y="0" width="720" height="376"/>
<text class="t-strong" x="18" y="26">Fugu Max の出力単価は Sonnet 5 より安いが、Gemini 3.8 Flash より高い</text>
<text class="t-sm" x="18" y="45">入力＝薄い色 ／ 出力＝濃い色。100万トークンあたりのドル。</text>
<text class="t-sm" x="18" y="64">Sonnet 5・GPT 5.6 Terra は Sakana 自身が比較に挙げた相手。Gemini はこの記事で足した。</text>
