<svg xmlns="http://www.w3.org/2000/svg" width="720" height="376" viewBox="0 0 720 376" role="img" aria-label="Fugu Max・Gemini 3.8 Flash・Claude Sonnet 5・GPT 5.6 Terra の単価を比べた横棒グラフ。100万トークンあたりのドル。Fugu Max は入力2ドル・出力6ドル、Gemini 3.8 Flash は入力0.75ドル・出力3.75ドル、Claude Sonnet 5 は入力2ドル・出力10ドル、GPT 5.6 Terra（入力が短いとき）は入力2ドル・出力12ドル。GPT 5.6 Terra は入力が長いと入力4ドル・出力18ドルに上がる。Gemini 3.8 Flashの価格は2026年12月31日までの導入価格で、2027年1月1日から1.50ドルと7.50ドルになる。">
<style>
