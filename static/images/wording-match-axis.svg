<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="検算や確認で健全な項目を巻き添えにするかどうかを、3本の記事の実測値で比べた表。計算の検算（recheck-removes-only-the-miscalc・号ごとに正しい/誤りを書かせた版）は、本物の指摘が消えた回が4回中0回で緑。文言一致の検算（この記事・教材A・教材Bの検算4回）も、本物の指摘が消えた回が4回中0回で緑。主観的な判断の確認（doubt-fixes-added-not-dropped・健全な5件だけを渡した版）は、健全な項目を巻き添えにした回が4回中4回で赤。下の枠には、計算の検算と文言一致の検算はどちらも本物の指摘を1件も消さなかったこと、主観的な判断の確認は健全なときほど正しい項目を巻き添えにしたこと、分かれ目は計算かどうかではなく答えが1つに決まるかどうからしいことが書かれている。">
<style>
