</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">巻き添えが出ないのは「計算」ではなく「答えが1つに決まる」側</text>
<text class="t-sm" x="18" y="45">実測2026-11-16。3本の記事の検算・確認の結果を、本物の指摘が消えた／健全な項目が巻き添えになった回数で並べた。</text>
<text class="t-sm" x="18" y="64">軸の両端＝計算（決定的）と主観的な判断（答えが割れる）。文言一致はどちらに近いかを見る。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">計算の検算で、本物の指摘が消えた回（recheck-removes-only-the-miscalc）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="157">文言一致の検算で、本物の指摘が消えた回（この記事・教材A・B）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="189">主観的な判断の確認で、健全な項目を巻き添えにした回（doubt-fixes-added-not-dropped）</text>
<rect class="box-bad" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="189" text-anchor="middle" style="font-weight:700">4/4</text>
<rect class="box-accent" x="18" y="206" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="226">計算の検算と文言一致の検算は、どちらも本物の指摘を1件も消さなかった（0/4・0/4）。</text>
<text class="t-accent" x="34" y="244">主観的な判断（本当に至急か）の確認は、健全なときほど正しい項目を巻き添えにした（4/4）。</text>
<text class="t-accent" x="34" y="262">分かれ目は「計算かどうか」ではなく、答えが1つに決まるかどうからしい。</text>
</svg>
