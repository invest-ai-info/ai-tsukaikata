<svg xmlns="http://www.w3.org/2000/svg" width="720" height="366" viewBox="0 0 720 366" role="img" aria-label="頼み方を3通りに変えて、返りの長さと、受ける・断るの言い切りの語数を並べた図。材料は2本、それぞれ2回ずつ通した。そのまま「この依頼、受けられますか」と聞くと、材料Aの1回目が2,520字で言い切り2語、2回目が3,241字で3語、材料Bの1回目が2,308字で1語、2回目が1,974字で3語だった。「受けるかどうかは私が決めます。計算だけしてください」にすると、612字・521字・338字・349字となり、言い切りは4回とも0語になった。出す形を6行に固定した保存版では、103字・103字・259字・276字で、言い切りはやはり4回とも0語。材料Aの2回は1文字も違わなかった。引き算の4つの数は、どの頼み方でも材料から計算した真値どおりだった。変わったのは判断が付くかどうかと、返りの長さだけである。ただし保存版の材料Bでは、こちらが決めた最後の行の様式が事実と合わず、2回とも様式のほうを変えて注記が付いた。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="366"/>
<text class="t-strong" x="18" y="26">判断をやめさせると、言い切りも長さも同時に落ちた</text>
<text class="t-sm" x="18" y="45">材料2本（A＝きつい側／B＝余裕がある側）を各2回。数字は「返りの字数 / 受ける・断るの言い切りの語数」。</text>
<text class="t-sm" x="18" y="64">引き算の4つの数は、どの頼み方でも真値どおりだった。変わったのは判断と長さだけ。</text>
<text class="t-xs" x="238" y="108">A 1回目</text>
<text class="t-xs" x="358" y="108">A 2回目</text>
<text class="t-xs" x="478" y="108">B 1回目</text>
<text class="t-xs" x="598" y="108">B 2回目</text>
<text class="t" x="18" y="149" style="font-size:12px">そのまま「受けられますか」</text>
<rect class="box-bad" x="226" y="122" width="112" height="44" rx="3"/>
<text class="t-bad" x="234" y="149" style="font-size:11.5px">2,520字 / 2語</text>
<rect class="box-bad" x="346" y="122" width="112" height="44" rx="3"/>
<text class="t-bad" x="354" y="149" style="font-size:11.5px">3,241字 / 3語</text>
<rect class="box-bad" x="466" y="122" width="112" height="44" rx="3"/>
<text class="t-bad" x="474" y="149" style="font-size:11.5px">2,308字 / 1語</text>
<rect class="box-bad" x="586" y="122" width="112" height="44" rx="3"/>
<text class="t-bad" x="594" y="149" style="font-size:11.5px">1,974字 / 3語</text>
<text class="t" x="18" y="202" style="font-size:12px">「計算だけしてください」</text>
<rect class="box-good" x="226" y="175" width="112" height="44" rx="3"/>
<text class="t-good" x="234" y="202" style="font-size:11.5px">612字 / 0語</text>
<rect class="box-good" x="346" y="175" width="112" height="44" rx="3"/>
<text class="t-good" x="354" y="202" style="font-size:11.5px">521字 / 0語</text>
<rect class="box-good" x="466" y="175" width="112" height="44" rx="3"/>
<text class="t-good" x="474" y="202" style="font-size:11.5px">338字 / 0語</text>
<rect class="box-good" x="586" y="175" width="112" height="44" rx="3"/>
<text class="t-good" x="594" y="202" style="font-size:11.5px">349字 / 0語</text>
<text class="t" x="18" y="255" style="font-size:12px">保存版（6行に固定）</text>
<rect class="box-good" x="226" y="228" width="112" height="44" rx="3"/>
<text class="t-good" x="234" y="255" style="font-size:11.5px">103字 / 0語</text>
<rect class="box-good" x="346" y="228" width="112" height="44" rx="3"/>
<text class="t-good" x="354" y="255" style="font-size:11.5px">103字 / 0語</text>
<rect class="box-good" x="466" y="228" width="112" height="44" rx="3"/>
<text class="t-good" x="474" y="255" style="font-size:11.5px">259字 / 0語</text>
<rect class="box-good" x="586" y="228" width="112" height="44" rx="3"/>
<text class="t-good" x="594" y="255" style="font-size:11.5px">276字 / 0語</text>
<text class="t-bad" x="18" y="298">※ 保存版の材料Bでは、こちらが決めた最後の行の様式（「上限なら◯分足りない」）が</text>
<text class="t-bad" x="18" y="320">　 事実と合わず、2回とも様式のほうを変えて注記が付いた。</text>
<text class="t-xs" x="18" y="342">架空データでの実測。回ごとの生の返りは docs/evidence/ に全文置いてある。</text>
</svg>
