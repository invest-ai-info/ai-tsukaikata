<svg xmlns="http://www.w3.org/2000/svg" width="720" height="492" viewBox="0 0 720 492" role="img" aria-label="AIに聞いた6回の結果を、項目ごとに「① 素朴に聞く」「② 金額を直接聞く」の2列で並べた表。各欄は3回中の回数。過去3か月・500万回・フォロワー500人が3/3と3/3、Stripe経由で受け取ることが3/3と3/3、プレミアム加入にお金がかかることが3/3と3/3、最小入金額の金額（10ドル）が0/3と3/3、ベーシックでは申請できないことが0/3と3/3、フォロワーの「認証済み」という限定が0/3と0/3、プレミアムの料金を金額で書いたが0/3と3/3、その金額が合っていた（月980円）が0/3と0/3。副題に、真値は公式ページの値（日本・ウェブ購入で月980円・認証済みフォロワー500人以上）だと書かれている。最下段の注記は3行で、②が出した値が1,380円・1,380円・1,000円前後であること、真値980円と一致した回は6回中0回であること（①は料金を金額で書かないので、外す以前に出ない）、枠組みは聞いてよいが料金と条件の限定語は原文を見る、という結論。">
