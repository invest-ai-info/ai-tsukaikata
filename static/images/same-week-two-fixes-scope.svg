<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="1回の依頼で2条の誤報を同時に直したとき、どの条が変わりどの条が不変だったかを示す図。条1（金額超過）と条3（数量異常）は除外の条件が追記されて変わり、条2（ID重複）・条4（日付未来）・条5（担当者欄空欄）は不変。系列C・系列Dそれぞれ2回転、合計4回の独立呼び出しすべてで同じ変化・不変のパターンが再現された。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">変わったのは頼んだ2条だけ。他の3条は4回とも1文字も変わらなかった</text>
<text class="t-sm" x="18" y="45">条1・条3の誤報を1回の依頼で同時に直した後、5条の文章を直す前と機械で比較した。</text>
<text class="t-sm" x="18" y="128">条1（金額超過）</text>
<rect class="box-accent" x="178" y="108" width="506.0" height="30" rx="4"/>
<text class="t-accent" x="188" y="128">除外が追記された</text>
<text class="t-sm" x="18" y="170">条2（ID重複）</text>
<rect class="box-quiet" x="178" y="150" width="506.0" height="30" rx="4"/>
<text class="t-sm" x="188" y="170">4回とも1文字も不変</text>
<text class="t-sm" x="18" y="212">条3（数量異常）</text>
<rect class="box-accent" x="178" y="192" width="506.0" height="30" rx="4"/>
<text class="t-accent" x="188" y="212">除外が追記された</text>
<text class="t-sm" x="18" y="254">条4（日付未来）</text>
<rect class="box-quiet" x="178" y="234" width="506.0" height="30" rx="4"/>
<text class="t-sm" x="188" y="254">4回とも1文字も不変</text>
<text class="t-sm" x="18" y="296">条5（担当者欄空欄）</text>
<rect class="box-quiet" x="178" y="276" width="506.0" height="30" rx="4"/>
<text class="t-sm" x="188" y="296">4回とも1文字も不変</text>
<text class="t-xs" x="18" y="330">※ 系列C・系列D×2回転＝4回とも同じパターン。割れた回は無かった。</text>
</svg>
