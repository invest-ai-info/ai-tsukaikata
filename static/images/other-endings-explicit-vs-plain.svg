<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-label="6回連続という最も極端な材料で、素朴な指示と「3回以上禁止」を明記した指示の結果を比べた図。素朴な指示（3回試行）は3回以上連続が残った回0件。禁止を明記した指示（3回試行）も0件。下の枠には、最も極端な6回連続の材料でも禁止の一文を足すかどうかで結果は変わらなかったこと、前の記事（4回連続まで）と同じ天井が連続回数を増やしても再現したことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="352"/>
<text class="t-strong" x="18" y="26">6回連続でも、禁止の一文を足すかどうかで結果は変わらなかった</text>
<text class="t-sm" x="18" y="45">忘年会の案内文（「〜ください」が6回連続）を材料に、同じ文章で指示文だけを変えて各3回試した。</text>
<text class="t-sm" x="18" y="64">前の記事は連続4回までしか試しておらず、「連続が多いと禁止の一文が効くかもしれない」という宿題を残していた。</text>
<rect class="box" x="18" y="96" width="684" height="82" rx="6"/>
<text class="t-strong" x="34" y="118">素朴な指示</text>
<text class="t-sm" x="34" y="138">次の文章を、AIが書いたような文章ではなく人間らしい文章に書き直してください。</text>
<text class="t-good" x="34" y="160">3回以上連続が残った回数：0/3</text>
<rect class="box" x="18" y="188" width="684" height="82" rx="6"/>
<text class="t-strong" x="34" y="210">禁止を明記した指示</text>
<text class="t-sm" x="34" y="230">上に加えて「同じ文末表現を3回以上連続で使わないでください」を追加</text>
<text class="t-good" x="34" y="252">3回以上連続が残った回数：0/3</text>
<rect class="box-accent" x="18" y="286" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="306">前の記事（連続4回まで）と同じ天井（0件）が、連続6回でも再現した。</text>
<text class="t-accent" x="34" y="324">＝連続回数が増えるほど禁止の一文が効いてくる、という見立ては今回も支持されなかった。</text>
</svg>
