<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" role="img" aria-label="文末パターンを4つに増やしたときに、見出しの文が宣言する数字が実際の4と食い違った回数を示す表。参考として前作の3パターン時は5回中3回食い違った。今回の4パターンは、材料A（清掃当番メモ）では5回中1回、材料B（備品発注引き継ぎメモ）では5回中3回食い違った。総数を先に明記させる言い方では材料A・B計8回とも一致し、最後に明記させる言い方でも材料Bの3回とも一致した。下の枠には、材料Aでは前作と同じ本文のリストが3項目に減る崩れ方が5回中1回だけ再発したこと、材料Bでは本文のリストは5回とも4つ同格なのに見出しの文の数字だけが5回中3回「3」と誤ったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="336"/>
<text class="t-strong" x="18" y="26">4パターンに増やしても、見出しの数字の食い違いは悪化しない。ただし材料による</text>
<text class="t-sm" x="18" y="45">「文末表現が不自然に連続している箇所を指摘して」に対し、見出しの数字が実際の4と食い違った回数。</text>
<text class="t-sm" x="18" y="64">材料Bでだけ食い違いが出た。総数を先または最後に明記させると、11回とも一致した。</text>
<text class="t-xs" x="458.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">（参考）3パターン時・前作の実測</text>
<rect class="box-bad" x="378" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="458.0" y="125" text-anchor="middle" style="font-weight:700">3/5</text>
<text class="t" x="18" y="157">4パターン・材料A（清掃当番）</text>
<rect class="box-bad" x="378" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="458.0" y="157" text-anchor="middle" style="font-weight:700">1/5</text>
<text class="t" x="18" y="189">4パターン・材料B（備品発注）</text>
<rect class="box-bad" x="378" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="458.0" y="189" text-anchor="middle" style="font-weight:700">3/5</text>
<text class="t" x="18" y="221">総数を先に明記（材料A+B・計8回）</text>
<rect class="box-good" x="378" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="221" text-anchor="middle" style="font-weight:700">0/8</text>
<text class="t" x="18" y="253">総数を最後に明記（材料B・3回）</text>
<rect class="box-good" x="378" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="253" text-anchor="middle" style="font-weight:700">0/3</text>
<rect class="box-accent" x="18" y="270" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="290">材料Aでは前作と同じ「本文のリストが3項目に減る」崩れ方が5回中1回だけ再発した。</text>
<text class="t-accent" x="34" y="308">材料Bは本文のリストは5回とも4つ同格だが、見出しの文の数字だけが5回中3回「3」と誤った。</text>
</svg>
