<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img" aria-label="横棒の一覧表。カナリアが監視対象リストに未登録で検知できなかった12回について、自己診断に理由の説明が入っていたかを比べる。③④説明を許した版（計8機会）は理由が入っていた回数が8/8で緑。⑥自己診断を一言だけに強制した版（4機会）は0/4で赤。⑦検知できない場合だけ理由を一文添えるよう言い直した版（4機会）は4/4で緑に戻る。下の枠には、自己診断の文言そのものは24回ともウソをつかなかったが一言だけに縛ると理由の説明が消えたこと、条件分岐で簡潔さと診断情報が両立したことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="272"/>
<text class="t-strong" x="18" y="26">一言だけに縛ると、検知できなかった理由の説明が消える</text>
<text class="t-sm" x="18" y="45">実測2026-11-24。カナリアが監視対象リストに未登録で検知できなかった12回について、自己診断に理由の説明が入っていたかを確認した。</text>
<text class="t-sm" x="18" y="64">⑦は「検知できない場合だけ理由を一文」と条件分岐した言い直し版。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">③④説明を許した版（計8機会）：理由の説明が入っていた回数</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">8/8</text>
<text class="t" x="18" y="157">⑥一言だけに強制した版（4機会）：理由の説明が入っていた回数</text>
<rect class="box-bad" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="157" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="189">⑦言い直し：検知できない場合だけ理由を一文（4機会）：理由の説明が入っていた回数</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">4/4</text>
<rect class="box-accent" x="18" y="206" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="226">自己診断の文言そのものは24回ともウソをつかなかったが、一言だけに縛ると理由の説明が消えた。</text>
<text class="t-accent" x="34" y="244">「検知できない場合だけ理由を一文」と条件分岐すると、簡潔さと診断情報が両立した。</text>
</svg>
