<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="横棒の一覧表。正常版ログに対する誤報の回数を、①固定『2日ルール』（前作）と②頻度ごとに分けたルール（今回）で比べる。①は2回中1回が誤報で赤。②は2回中0回で緑。下の枠には、この結果は1種類の週次処理・各2回に限ること、停止版では両方のルールとも2/2で正しく検出できており誤報の減少と検出力が両立していることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="240"/>
<text class="t-strong" x="18" y="26">正常版での誤報は、①1/2回から②0/2回に減った</text>
<text class="t-sm" x="18" y="45">実測2026-11-20。同じ正常版ログ（P5に本当の停止なし）に、①固定『2日ルール』と②頻度ごとに分けたルールを各2回試した。</text>
<text class="t-sm" x="18" y="64">①は前作（weekly-cadence-trips-the-two-day-rule）の実測。②は今回、同じログに新しい言い直しを当てた結果。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">①固定「2日ルール」のみ（前作・正常版の誤報）</text>
<rect class="box-bad" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="518.0" y="125" text-anchor="middle" style="font-weight:700">1/2</text>
<text class="t" x="18" y="157">②頻度ごとに分けたルール（今回・正常版の誤報）</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">0/2</text>
<rect class="box-accent" x="18" y="174" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="194">誤報は0件になったが、これは「この1種類の週次処理・各2回」での結果。</text>
<text class="t-accent" x="34" y="212">停止版（本当の停止あり）では、①②とも2/2で正しく検出できている（誤報の減少と検出力は両立）。</text>
</svg>
