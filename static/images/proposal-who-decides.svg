    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="328"/>
<text class="t-strong" x="18" y="26">素材に書いていない決め事を、誰が決めたか</text>
<text class="t-sm" x="18" y="45">同じ募集要項・同じ素材で、頼み方だけを4通りに変えた。素材にはこの5件がどれも書かれていない。</text>
<text class="t-bad" x="216" y="80">素朴に頼む</text>
<text class="t-xs" x="216" y="97">（そのまま）</text>
<text class="t-bad" x="356" y="80">「書くな」だけ</text>
<text class="t-xs" x="356" y="97">（禁止のみ）</text>
<text class="t-sm" x="476" y="80">〔素材に無い〕</text>
<text class="t-xs" x="476" y="97">（空けさせる）</text>
<text class="t-accent" x="596" y="80">〔私が決める〕</text>
<text class="t-xs" x="596" y="97">（印を残す）</text>
<text class="t" x="18" y="128">1週間に対応できる本数</text>
<text class="t-bad" x="216" y="128">「週1本」</text>
<text class="t-bad" x="356" y="128">「週1本」</text>
<text class="t-sm" x="476" y="128">空欄</text>
<text class="t-good" x="596" y="128">私が決める欄</text>
<text class="t" x="18" y="158">単価8,000円を受けるか</text>
<text class="t-sm" x="216" y="158">出てこない</text>
<text class="t-sm" x="356" y="158">出てこない</text>
<text class="t-sm" x="476" y="158">空欄</text>
<text class="t-good" x="596" y="158">私が決める欄</text>
<text class="t" x="18" y="188">サンプルを出すか</text>
<text class="t-bad" x="216" y="188">無償で書くと申し出</text>
<text class="t-sm" x="356" y="188">出てこない</text>
<text class="t-sm" x="476" y="188">相談と書いた</text>
<text class="t-good" x="596" y="188">私が決める欄</text>
<text class="t" x="18" y="218">画像差し替えの2回目以降</text>
<text class="t-bad" x="216" y="218">「自分で進めます」</text>
<text class="t-sm" x="356" y="218">出てこない</text>
<text class="t-sm" x="476" y="218">出てこない</text>
<text class="t-sm" x="596" y="218">出てこない</text>
<text class="t" x="18" y="248">週2本への増加</text>
<text class="t-bad" x="216" y="248">相談を約束</text>
<text class="t-bad" x="356" y="248">相談を約束</text>
<text class="t-sm" x="476" y="248">出てこない</text>
<text class="t-sm" x="596" y="248">出てこない</text>
<text class="t-xs" x="18" y="284">※ 募集要項は「1週間に対応できる本数」を書くよう求めている。禁止だけを渡すと、この必須の欄が空欄になった。</text>
<text class="t-xs" x="18" y="304">※ どの頼み方でも、素材にある事実（7本・記名なし・SEO未学習）は書き換わっていない。動くのは決め事のほうだけ。</text>
</svg>
