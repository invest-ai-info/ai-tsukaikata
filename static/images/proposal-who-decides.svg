<svg xmlns="http://www.w3.org/2000/svg" width="720" height="328" viewBox="0 0 720 328" role="img" aria-label="同じ架空の募集要項と素材で頼み方だけを4通りに変えて、素材に書いていない決め事5件を誰が決めたかを比べた表。1つ目は素朴に頼む、2つ目は素材に書いていないことは書かないでくださいという禁止だけ、3つ目は書けない箇所を素材に無いと書いて空けさせる、4つ目は私が決めると印を残させる、の4通り。1週間に対応できる本数は、素朴に頼むとAIが週1本と決め、禁止だけでも週1本と決めた。空けさせると空欄になり、私が決めると印を残させたときだけ私が決める欄として残った。単価8,000円を受けるかは、素朴でも禁止だけでも出てこず、空けさせると空欄、印を残させたときだけ私が決める欄になった。サンプルを出すかは、素朴に頼むと無償で書くと申し出て、禁止だけでは出てこず、空けさせると相談と書き、印を残させたときは私が決める欄になった。画像差し替えの2回目以降は、素朴に頼んだときだけ自分で進めますと約束し、ほかの3通りでは出てこなかった。週2本への増加は、素朴でも禁止だけでも相談を約束し、ほかの2通りでは出てこなかった。募集要項は1週間に対応できる本数を書くよう求めているので、禁止だけを渡すとこの必須の欄が空欄になる。どの頼み方でも、素材にある事実である7本、記名なし、SEO未学習は書き換わっていない。動くのは決め事のほうだけである。">
<style>
