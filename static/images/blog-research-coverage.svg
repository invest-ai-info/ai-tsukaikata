<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="架空の上位6本の記事の見出し32件を貼って論点の一覧を出させ、貼った見出しのうち何件が一覧に残ったかを頼み方ごとに並べた横棒グラフ。表の形で、まとめた言い方に置き換えないでください、1本にしか出てこない論点も省かずに全部載せてください、の2行を付けて頼むと、32件中32件が一覧に出た。返りは26行。毎朝の自動実行に載せるために前置きを禁じて行の形だけを決め、その2行を落とすと、1回目は32件中22件で22行、同じ指示文の2回目は32件中19件で16行しか出ず、10件以上が消えた。落とさせない一文を足し直すと、1回目は32件中29件で27行、2回目は32件中32件で26行まで戻った。短くしたときに落としたのは、まとめた言い方に置き換えないで、と、1本だけの論点も省かずに、の2行だけである。同じ指示文を2回走らせて論点名が完全に一致した数は、短くしただけの場合が4件、落とさせない一文を付けた場合が21件だった。なお引用の捏造は5回の実測すべてで0件、記事番号と引用の食い違いも0件で、起きているのは作り話ではなく静かな欠落のほうだけだった。">
