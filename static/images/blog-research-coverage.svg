<text class="t-xs" x="18" y="336">※ 短くしたときに落としたのは「まとめた言い方に置き換えないで」「1本だけの論点も省かずに」の2行だけ。</text>
<text class="t-xs" x="18" y="354">※ 同じ指示文を2回走らせて論点名が完全一致した数＝短くしただけ 4件 ／ 落とさせない一文つき 21件。</text>
<text class="t-xs" x="18" y="372">※ 引用の捏造は5回とも0件、記事番号と引用の食い違いも0件。消えるほうだけが起きている。</text>
