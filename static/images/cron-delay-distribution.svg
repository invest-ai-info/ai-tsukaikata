<svg xmlns="http://www.w3.org/2000/svg" width="720" height="358" viewBox="0 0 720 358" role="img" aria-label="GitHub Actionsで毎時実行の設計になっているこのサイト自身のニューストラッカーの、実際の実行間隔を測った棒グラフ。状態ファイルへのコミット276件・間隔275個が対象。70分以内（ほぼ定刻）が135件で49%、70分から3時間が87件で32%、3時間から6時間が33件で12%、6時間超が20件で7%。中央値は76分、最長は25.0時間（8月9日07:49から8月10日08:49）。設計どおりなら275回とも70分以内のはずが、半分にとどかない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="358"/>
<text class="t-strong" x="18" y="26">毎時の設計に対し、実際の間隔は「70分以内」が半分にとどかない</text>
<text class="t-sm" x="18" y="45">このサイト自身のニューストラッカー（毎時実行の設計）が状態ファイルを書き戻したコミット276件、間隔275個を実測。</text>
<text class="t-sm" x="18" y="64">外向き通信は使わず、手元のgit履歴の日時だけで数えられる。中央値は76分・最長は25.0時間（8/9 07:49→8/10 08:49）。</text>
<text class="t-sm" x="18" y="83">GitHub Actionsのスケジュール実行は「その時刻ちょうどに動く」ことを保証しない（GitHub公式の注記どおり）。</text>
<text class="t" x="18" y="154">70分以内(ほぼ定刻)</text>
<rect class="bar-new" x="182.0" y="132.0" width="400.0" height="18" rx="3"/>
<text class="t-accent" x="590.0" y="154">135件（49%）</text>
<text class="t" x="18" y="198">70分〜3時間</text>
<rect class="bar-old" x="182.0" y="176.0" width="257.8" height="18" rx="3"/>
<text class="t-accent" x="447.8" y="198">87件（32%）</text>
<text class="t" x="18" y="242">3〜6時間</text>
<rect class="bar-old" x="182.0" y="220.0" width="97.8" height="18" rx="3"/>
<text class="t-accent" x="287.8" y="242">33件（12%）</text>
<text class="t" x="18" y="286">6時間超</text>
<rect class="bar-old" x="182.0" y="264.0" width="59.3" height="18" rx="3"/>
<text class="t-accent" x="249.3" y="286">20件（7%）</text>
<text class="t-xs" x="18" y="314">縦軸4区分・横軸は件数（全275間隔中）。</text>
<text class="t-xs" x="18" y="334">設計は「毎時」なので本来は275回とも70分以内のはずの値。</text>
</svg>
