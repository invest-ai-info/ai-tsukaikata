<svg xmlns="http://www.w3.org/2000/svg" width="720" height="346" viewBox="0 0 720 346" role="img" aria-label="4つの基準で、9情報源（P・Q・R・S・T・U・V・W・Y）の判定が何件中何件正解したかを比べた横棒グラフ。「①どこかで10日以上連続0」は7件中7件のうち2件（YとR）を誤判定し7/9。「②直近5回（点検17〜21）」はYは直ったがRはまだ誤判定で8/9。「③あいまい（判定してください）」は9/9。「④直近7回（点検15〜21、相対表現『表の末尾7行』でも同じ）」は9/9。下の枠には、①は2回ともYとRの両方を誤判定し、②は2回ともYは直ったがRはまだ誤判定し、③と④は2回とも9/9でどちらも誤判定しなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="346"/>
<text class="t-strong" x="18" y="24">窓を「直近5回」に絞るとYは直るが、Rは新たに誤判定される</text>
<text class="t-sm" x="18" y="43">9情報源（P・Q・R・S・T・U・V・W・Y）に、同じ基準の書き方を2回ずつ当てた正解数。</text>
<text class="t-sm" x="18" y="62">Yは「過去に止まって今は復活した」相手、Rは「更新間隔がもともと長い健全な」相手。</text>
<text class="t" x="18" y="138">①どこかで10日以上連続0</text>
<rect class="box-quiet" x="300.0" y="128" width="320.0" height="16" rx="3"/>
<rect class="box-bad" x="300.0" y="128" width="248.9" height="16" rx="3"/>
<text class="t-bad" x="632.0" y="138">7/9</text>
<text class="t" x="18" y="170">②直近5回（点検17〜21）</text>
<rect class="box-quiet" x="300.0" y="160" width="320.0" height="16" rx="3"/>
<rect class="box-bad" x="300.0" y="160" width="284.4" height="16" rx="3"/>
<text class="t-bad" x="632.0" y="170">8/9</text>
<text class="t" x="18" y="202">③あいまい（判定してください）</text>
<rect class="box-quiet" x="300.0" y="192" width="320.0" height="16" rx="3"/>
<rect class="box-good" x="300.0" y="192" width="320.0" height="16" rx="3"/>
<text class="t-accent" x="632.0" y="202">9/9</text>
<text class="t" x="18" y="234">④直近7回（点検15〜21・相対でも同じ）</text>
<rect class="box-quiet" x="300.0" y="224" width="320.0" height="16" rx="3"/>
<rect class="box-good" x="300.0" y="224" width="320.0" height="16" rx="3"/>
<text class="t-accent" x="632.0" y="234">9/9</text>
<path class="line" d="M300.0 108.0 L300.0 240.0" stroke-dasharray="4 3"/>
<rect class="box-accent" x="18" y="264" width="684" height="66" rx="6"/>
<text class="t-accent" x="34" y="284">①は2回ともYとRの両方を「停止」と誤判定した（7/9）。</text>
<text class="t-accent" x="34" y="302">②は2回ともYは直ったが、Rはまだ「停止」と誤判定した（8/9）。</text>
<text class="t-accent" x="34" y="320">③と④は2回とも9/9で、YとRのどちらも誤判定しなかった。</text>
</svg>
