<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">3C・SWOTの逆パターンでも、空欄は作り話で埋まらなかった</text>
<text class="t-sm" x="18" y="45">実測2026-11-18。美容サロンの架空案件で、3C（競合・顧客なし）とSWOT逆パターン（強み・弱みなし）を試した。</text>
<text class="t-sm" x="18" y="64">「要確認と書いて」の指定ありなしにかかわらず、4条件とも作り話は0件だった。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">3C・素朴（競合・顧客を渡さない、3回）</text>
<rect class="box-good" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="125" text-anchor="middle" style="font-weight:700">3/3</text>
