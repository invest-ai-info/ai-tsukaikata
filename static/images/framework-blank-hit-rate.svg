<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="美容サロンの架空案件で3C分析（競合・顧客を渡さない）とSWOT逆パターン（強み・弱みを渡さない）を試した実測結果を示す表。3C・素朴（3回）は3回とも作り話なしで緑、3C・「要確認」を指定（3回）も3回とも作り話なしで緑、SWOT逆パターン・素朴（3回）も3回とも作り話なしで緑、SWOT逆パターン・「要確認」を指定（3回）も3回とも作り話なしで緑。下の枠には、4条件・計12回とも渡していない項目に具体的な競合名・顧客属性・数値を作り話で埋めた回は0回だったこと、「要確認」の指定がない素朴な頼み方でも同じ結果だったことが書かれている。">
<style>
