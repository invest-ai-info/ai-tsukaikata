<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" role="img" aria-label="返信本文自体に個人情報相当の文字列が漏れた割合を条件別に示す横棒グラフ。素朴に頼んだ場合は6回中2回(33%)で漏れた。「具体的に、心のこもった返信を」と念押しした場合は4回中4回(100%)すべてで漏れた。「個人情報には触れないでください」という一言を足した場合と、伏せる項目を名前で指定した場合は、どちらも漏れが0件だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="448"/>
<text class="t-strong" x="18" y="26">「具体的に」と念押しすると、返信本文自体の個人情報漏えいが2/6→4/4に跳ね上がる</text>
<text class="t-sm" x="18" y="45">架空の口コミ2種（同伴者名・個室や座席の番号・スタッフ実名を仕込み）で、返信文を4条件・計20回実測。</text>
<text class="t-sm" x="18" y="64">「個人情報には触れないで」の一言、または伏せる項目を名前で指定すると、どちらも本文の漏えいは0件。</text>
<line class="line" x1="280.0" y1="142" x2="280.0" y2="148"/>
<text class="t-xs" x="280.0" y="136" text-anchor="middle">0%</text>
<line class="line" x1="367.5" y1="142" x2="367.5" y2="148"/>
<text class="t-xs" x="367.5" y="136" text-anchor="middle">25%</text>
<line class="line" x1="455.0" y1="142" x2="455.0" y2="148"/>
<text class="t-xs" x="455.0" y="136" text-anchor="middle">50%</text>
<line class="line" x1="542.5" y1="142" x2="542.5" y2="148"/>
<text class="t-xs" x="542.5" y="136" text-anchor="middle">75%</text>
<line class="line" x1="630.0" y1="142" x2="630.0" y2="148"/>
<text class="t-xs" x="630.0" y="136" text-anchor="middle">100%</text>
<line class="line" x1="280.0" y1="145" x2="630.0" y2="145"/>
<text class="t" x="18" y="165">素朴に頼む</text>
<text class="t-xs" x="18" y="180">(ガードなし)</text>
<rect class="box" x="280.0" y="161.0" width="350.0" height="24"/>
<rect class="bar-old" x="280.0" y="161.0" width="116.5" height="24"/>
<text class="t" x="404.5" y="178" style="font-size:12.5px">2/6回</text>
<text class="t" x="18" y="241">「具体的に、心のこもった返信を」</text>
<text class="t-xs" x="18" y="256">と念押しする</text>
<rect class="box" x="280.0" y="237.0" width="350.0" height="24"/>
<rect class="box-bad" x="280.0" y="237.0" width="350.0" height="24"/>
<text class="t-bad" x="638.0" y="254" style="font-size:12.5px">4/4回</text>
<text class="t" x="18" y="317">＋「個人情報には触れないで」</text>
<rect class="box" x="280.0" y="313.0" width="350.0" height="24"/>
<text class="t-good" x="288.0" y="330" style="font-size:12.5px">0/6回</text>
<text class="t" x="18" y="393">＋伏せる項目を名前で指定する</text>
<rect class="box" x="280.0" y="389.0" width="350.0" height="24"/>
<text class="t-good" x="288.0" y="406" style="font-size:12.5px">0/4回</text>
</svg>
