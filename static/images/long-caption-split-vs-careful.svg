<text class="t-sm" x="528.0" y="253" text-anchor="middle" style="font-weight:700">15/24</text>
<text class="t" x="18" y="285">通しで「数値に注意して」と頼み、後半8件を見つけた回数</text>
<rect class="box" x="448" y="264" width="160" height="26" rx="4"/>
<text class="t-sm" x="528.0" y="285" text-anchor="middle" style="font-weight:700">12/24</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">✅ 通しで素朴に聞くと、前半8件の見逃しが目立った（10/40＝25%）。後半は12/40＝30%。</text>
<text class="t-accent" x="34" y="340">✅ 前半だけを分けて聞くと13/24＝54%に上がった。後半だけを分けても8/24＝33%で大差なし。</text>
<text class="t-accent" x="34" y="358">🔑 分けずに「数値に注意して」と頼むだけでも、前半15/24＝62.5%・後半12/24＝50%まで上がった。</text>
