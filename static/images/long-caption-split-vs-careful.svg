<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">前半の見逃しは、分けるか「数値に注意して」で大きく減る</text>
<text class="t-sm" x="18" y="45">実測2026-10-22。架空の10分23秒レビュー動画に前半8件・後半8件、計16件の誤りを仕込んだ。</text>
<text class="t-sm" x="18" y="64">素朴に通しで聞く・前半後半に分けて聞く・「数値に注意して」と頼む、の3条件を比べた。</text>
