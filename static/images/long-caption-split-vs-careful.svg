<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="10分23秒の架空レビュー動画に仕込んだ16件の誤りについて、3つの聞き方を比べた図。通しで素朴に聞いて前半8件を見つけた回数は10/40、後半8件は12/40。前半だけ分けて聞いて前半8件を見つけた回数は13/24、後半だけ分けて聞いて後半8件を見つけた回数は8/24。通しで「数値に注意して」と頼み前半8件を見つけた回数は15/24、後半8件は12/24。下の枠には、通しで素朴に聞くと前半8件の見逃しが目立ったこと（25%）、前半だけを分けて聞くと54%に上がるが後半だけを分けても33%で大差ないこと、分けずに「数値に注意して」と頼むだけでも前半62.5%・後半50%まで上がったことが書かれている。">
