<rect class="box" x="448" y="168" width="160" height="26" rx="4"/>
<text class="t-sm" x="528.0" y="189" text-anchor="middle" style="font-weight:700">13/24</text>
<text class="t" x="18" y="221">後半だけ分けて聞いて、後半8件を見つけた回数</text>
<rect class="box" x="448" y="200" width="160" height="26" rx="4"/>
<text class="t-sm" x="528.0" y="221" text-anchor="middle" style="font-weight:700">8/24</text>
