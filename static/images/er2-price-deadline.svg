<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="Gemini Robotics ER 2の単価を示した横棒グラフ。100万トークンあたりのドル。導入価格（2026年12月31日まで）は入力1ドル・出力5ドル、標準価格（2027年1月1日から）は入力2ドル・出力10ドルで、どちらも2倍になる。キャッシュ済み入力はどちらの期間も入力価格の10%。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="240"/>
<text class="t-strong" x="18" y="26">ER 2.0の単価も、年明けに2倍になる</text>
<text class="t-sm" x="18" y="45">薄い色＝入力、濃い色＝出力。金額はVertex AIの公式料金ページの数字（100万トークンあたり）。</text>
<text class="t-sm" x="18" y="64">キャッシュ済み入力はどちらの期間も入力価格の10%（90%引き）。</text>
<text class="t" x="18" y="94">導入価格（〜2026年12月31日）</text>
<text class="t-xs" x="226" y="93">入力</text>
<rect class="bar-in" x="262" y="82" width="35.8" height="14" rx="2"/>
<text class="t-sm" x="305.8" y="93">$1</text>
<text class="t-xs" x="226" y="112">出力</text>
<rect class="bar-out" x="262" y="101" width="179.0" height="14" rx="2"/>
<text class="t-sm" x="449.0" y="112">$5</text>
<text class="t" x="18" y="149">標準価格（2027年1月1日から）</text>
<text class="t-xs" x="226" y="148">入力</text>
<rect class="bar-in" x="262" y="137" width="71.6" height="14" rx="2"/>
<text class="t-sm" x="341.6" y="148">$2</text>
<text class="t-xs" x="226" y="167">出力</text>
<rect class="bar-out" x="262" y="156" width="358.0" height="14" rx="2"/>
<text class="t-sm" x="628.0" y="167">$10</text>
<text class="t-xs" x="18" y="212">※ Gemini Enterprise Agent Platform経由はプライベートプレビューで、価格は別途。</text>
<text class="t-xs" x="18" y="230">※ 出典: Vertex AI 公式料金ページ（2026年11月2日確認）。</text>
</svg>
