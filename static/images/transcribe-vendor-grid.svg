<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="文字起こし機能を3社で比べた表。文字起こし専用モデル＝Geminiはあり（2機種）、GPTはあり（4機種＋Whisper）、Claudeは記載なし。対応言語数＝Geminiは85言語以上、GPTは記載なし、Claudeは—。話者分離＝Geminiは最大3人（3人超は試験的）、GPTはdiarize版のみ対応で上限は記載なし、Claudeは—。「記載なし」「—」は機能が無いと明言されているのではなく、公式ページに書かれていない意味。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">文字起こし専用モデルを持たないのは、3社のうちAnthropicだけ</text>
<text class="t-sm" x="18" y="45">各社の公式ページ（料金・モデル一覧）に書かれている範囲だけを並べた。</text>
<text class="t-sm" x="18" y="64">「記載なし」「—」は、機能が無いと明言されているわけではなく、公式ページに書かれていない意味。</text>
<text class="t-accent" x="134.0" y="114">Gemini（Google）</text>
<text class="t-accent" x="328.0" y="114">GPT（OpenAI）</text>
<text class="t-accent" x="522.0" y="114">Claude（Anthropic）</text>
<text class="t-sm" x="18" y="151.0">文字起こし専用モデル</text>
<rect class="box-accent" x="126.0" y="128" width="188.0" height="36" rx="4"/>
<text class="t-accent" x="134.0" y="151.0">あり（2機種）</text>
<rect class="box-quiet" x="320.0" y="128" width="188.0" height="36" rx="4"/>
<text class="t-sm" x="328.0" y="151.0">あり（4機種＋Whisper）</text>
<rect class="box-bad" x="514.0" y="128" width="188.0" height="36" rx="4"/>
<text class="t-bad" x="522.0" y="151.0">記載なし</text>
<text class="t-sm" x="18" y="197.0">対応言語数</text>
<rect class="box-accent" x="126.0" y="174" width="188.0" height="36" rx="4"/>
<text class="t-accent" x="134.0" y="197.0">85言語以上</text>
<rect class="box-quiet" x="320.0" y="174" width="188.0" height="36" rx="4"/>
<text class="t-sm" x="328.0" y="197.0">記載なし</text>
<rect class="box-bad" x="514.0" y="174" width="188.0" height="36" rx="4"/>
<text class="t-bad" x="522.0" y="197.0">—</text>
<text class="t-sm" x="18" y="243.0">話者分離</text>
<rect class="box-accent" x="126.0" y="220" width="188.0" height="36" rx="4"/>
<text class="t-accent" x="134.0" y="243.0">最大3人（3人超は試験的）</text>
<rect class="box-quiet" x="320.0" y="220" width="188.0" height="36" rx="4"/>
<text class="t-sm" x="328.0" y="243.0">diarize版のみ対応・上限は記載なし</text>
<rect class="box-bad" x="514.0" y="220" width="188.0" height="36" rx="4"/>
<text class="t-bad" x="522.0" y="243.0">—</text>
</svg>
