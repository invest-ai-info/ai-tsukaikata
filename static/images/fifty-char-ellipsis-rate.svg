<svg xmlns="http://www.w3.org/2000/svg" width="720" height="296" viewBox="0 0 720 296" role="img" aria-label="字数の上限を100字から50字に縮めたときの「…」出現率を、問い合わせ監視・SNS監視の長い一覧(12件)で比べた横棒グラフ。問い合わせ監視は、前の記事の100字条件で4回中2回「…」が出たが、この記事の50字条件(言い直し前・後の計8回)では0回だった。SNS監視は100字でも50字でも0回のまま変化していない。下の注記には、縮めて消えたのは見た目の崩れだけで中身が保たれたかは別の図で確かめていることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="296"/>
<text class="t-strong" x="18" y="24">字数を100字から50字に縮めても、「…」が出た回数は増えなかった</text>
<text class="t-sm" x="18" y="43">縦軸は2系統（問い合わせ監視・SNS監視）の長い一覧（12件）。横軸は、要約を試した回のうち「…」で文が切れた割合。</text>
<text class="t-sm" x="18" y="62">薄い色＝前の記事の100字条件（自分自身の実測）。濃い色＝この記事の50字条件（言い直し前・後の計8回）。</text>
<text class="t-xs" x="18" y="81">問い合わせ監視は100字で2/4回に「…」が出たが、50字では8回中0回だった。</text>
<text class="t" x="18" y="116.5">問い合わせ監視・長い一覧</text>
<text class="t-xs" x="186" y="107.0" text-anchor="end">100字(前の記事)</text>
<rect class="bar-old" x="300" y="96.0" width="160.0" height="14" rx="2"/>
<text class="t-sm" x="468.0" y="107.0">2/4回</text>
<text class="t-xs" x="186" y="126.0" text-anchor="end">50字(今回)</text>
<rect class="bar-new" x="300" y="115.0" width="2.0" height="14" rx="2"/>
<text class="t-sm" x="310.0" y="126.0">0/4回</text>
<text class="t" x="18" y="179.5">SNS監視・長い一覧</text>
<text class="t-xs" x="186" y="170.0" text-anchor="end">100字(前の記事)</text>
<rect class="bar-old" x="300" y="159.0" width="2.0" height="14" rx="2"/>
<text class="t-sm" x="310.0" y="170.0">0/4回</text>
<text class="t-xs" x="186" y="189.0" text-anchor="end">50字(今回)</text>
<rect class="bar-new" x="300" y="178.0" width="2.0" height="14" rx="2"/>
<text class="t-sm" x="310.0" y="189.0">0/4回</text>
<rect class="box-accent" x="18" y="228" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="248">SNSは100字でも「…」が0回なので、この記事（50字）でも変化を確かめられていない。</text>
<text class="t-accent" x="34" y="266">縮めて消えたのは「…」という見た目の崩れだけで、中身が保たれたかは別に確かめている（下の図）。</text>
</svg>
