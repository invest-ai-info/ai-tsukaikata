<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262" role="img" aria-label="件数を書かせたとき、見出しの数字が実際に列挙した件数と食い違った割合を示す横棒グラフ。確認できないリンクを4種に分けて件数も書かせた版は、件数を書いた3回のうち2回（67%）で食い違った。「件数は名前のあとに」を足した版は4回中0回。500番台を切れている側に含めるよう基準を変えても、名前を先に書く指示があれば4回中0回だった。ところが優先順位付けという別の作業を追加し、名前を先に書く指示を省くと、件数を書いた2回のうち1回（50%）でまた食い違いが出た。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="262"/>
<text class="t-strong" x="18" y="24">見出しの件数のズレは、直してもその指示を省くとまた出た</text>
<text class="t-sm" x="18" y="43">分類の誤りは0回だったが、件数を書かせた回だけを見ると、食い違いの率はこう変わった。</text>
<text class="t-sm" x="18" y="62">「件数は名前のあとに」を外すと、別の作業を追加しただけで食い違いが戻った。</text>
<text class="t" x="18" y="123">4種に分けて件数も書く（指示なし）</text>
<rect class="box-bad" x="320.0" y="112" width="207.7" height="16" rx="3"/>
<text class="t-bad" x="642.0" y="123">2/3回</text>
<text class="t" x="18" y="155">＋件数は名前のあとに</text>
<rect class="box-good" x="320.0" y="144" width="3.0" height="16" rx="3"/>
<text class="t-good" x="642.0" y="155">0/4回</text>
<text class="t" x="18" y="187">500番台を切れている側に（名前が先）</text>
<rect class="box-good" x="320.0" y="176" width="3.0" height="16" rx="3"/>
<text class="t-good" x="642.0" y="187">0/4回</text>
<text class="t" x="18" y="219">＋優先順位も聞く（名前の指示を省く）</text>
<rect class="box-bad" x="320.0" y="208" width="155.0" height="16" rx="3"/>
<text class="t-bad" x="642.0" y="219">1/2回</text>
<path class="line" d="M320.0 104 L320.0 222" stroke-dasharray="4 3"/>
</svg>
