<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-label="初めての発注元の見積もりで、返りが合計として書いた分数を頼み方6通りで並べた横棒グラフ。濃い部分が作業記録から計算した分、薄い部分が記録に無い分。作業記録3本から出る目安は3,000字あたり415分で、そこに点線を引いてある。そのまま何時間かかりますかと聞いた1回目は、記録から360分、推測で140分から240分を足して合計500分から600分。2回目は記録から430分、推測で100分から170分を足してやはり合計500分から600分。記録に対応する行が無い工程は数字を出さずに記録なしと書いてくださいを足した2回は、合計405分と408分で、記録から出る目安のままだった。3つの欄に分ける保存版も430分で、記録に無い工程には時間を書いていない。初回だけ発生する4件の時間を利用者が自分で決めて渡した回は、記録から405分と、決めた165分を別の行にしたまま足して570分になった。つまり合計が1.4倍に伸びるかどうかは、記録ではなく、記録に無い分を誰がどう埋めるかで決まっている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="410"/>
<text class="t-strong" x="18" y="26">合計は1.4倍に伸びる。伸びたぶんは、記録ではなく推測から来ている</text>
<text class="t-sm" x="18" y="45">架空の作業記録3本（すべて4件目・5件目・3件目＝続けている発注元の仕事）に、「この発注元は初めてです」の1行だけを足した。</text>
<text class="t-sm" x="18" y="64">棒の長さ＝返りが合計として書いた分数。幅で答えた回は上限を採った。</text>
<text class="t-xs" x="266" y="104">濃い部分＝作業記録から計算した分　薄い部分＝記録に無い分</text>
<line class="line" x1="432.0" y1="110" x2="432.0" y2="292" stroke-dasharray="3 3"/>
<text class="t-xs" x="438.0" y="102">↑ 記録3本から出る目安 415分</text>
<text class="t" x="18" y="129">そのまま「何時間かかりますか」1回目</text>
<rect class="bar-old" x="266" y="116" width="144.0" height="18" rx="2"/>
<rect class="bar-new" x="410.0" y="116" width="96.0" height="18" rx="2"/>
<text class="t-bad" x="514.0" y="129">500〜600分（うち推測 140〜240分）</text>
<text class="t" x="18" y="159">そのまま「何時間かかりますか」2回目</text>
<rect class="bar-old" x="266" y="146" width="172.0" height="18" rx="2"/>
<rect class="bar-new" x="438.0" y="146" width="68.0" height="18" rx="2"/>
<text class="t-bad" x="514.0" y="159">500〜600分（うち推測 100〜170分）</text>
<text class="t" x="18" y="189">＋「記録なしと書いて」1回目</text>
<rect class="bar-old" x="266" y="176" width="162.0" height="18" rx="2"/>
<text class="t-good" x="436.0" y="189">405分</text>
<text class="t" x="18" y="219">＋「記録なしと書いて」2回目</text>
<rect class="bar-old" x="266" y="206" width="163.2" height="18" rx="2"/>
<text class="t-good" x="437.2" y="219">408分</text>
<text class="t" x="18" y="249">保存版（3つの欄に分ける）</text>
<rect class="bar-old" x="266" y="236" width="172.0" height="18" rx="2"/>
<text class="t-good" x="446.0" y="249">430分</text>
<text class="t" x="18" y="279">初回4件の分を、私が決めて渡す</text>
<rect class="bar-old" x="266" y="266" width="162.0" height="18" rx="2"/>
<rect class="bar-new" x="428.0" y="266" width="66.0" height="18" rx="2"/>
<text class="t-bad" x="502.0" y="279">570分（うち私が決めた 165分）</text>
<text class="t-bad" x="18" y="310">※ そのまま聞いた2回は、初回だけの工程を自分から挙げたうえで、</text>
<text class="t-bad" x="18" y="330">　 その分数を推測で作り、合計に混ぜた（返り自身が「当て推量です」と書いている）。</text>
<text class="t-good" x="18" y="350">※「記録に対応する行が無い工程は、数字を出さずに記録なしと書いて」を足した2回は、</text>
<text class="t-good" x="18" y="370">　 合計が記録どおりの405分・408分にとどまった。</text>
<text class="t-xs" x="18" y="390">架空データでの実測。指示文ごとの生の返りは docs/evidence/ に置いてある。</text>
</svg>
