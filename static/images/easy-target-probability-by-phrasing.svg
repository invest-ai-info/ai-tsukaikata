<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="2つの言い回しで、成功確率(約57〜79%)を自分から計算したかを比べた表。「前向きに、達成できる計画を」を足した4回は、4/4とも確率の数字を計算した。「希望を持てる言い方で」を足した4回は、1/4だけ確率を計算し、残り3回のうち1回は「五分五分程度」という大まかな言葉だけ、2回は確率にまったく触れなかった。下の枠には、同じ「受け皿+前向きな一言」という形でも、言い回しを変えると崩れる場所が違うことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="240"/>
<text class="t-strong" x="18" y="26">成功確率の数字は、「前向きに」では残り、「希望を持てる」では消えやすかった</text>
<text class="t-sm" x="18" y="45">受け皿の指示文に足した言い回し別に、成功確率(約57〜79%)を自分から計算したかを比べた。</text>
<text class="t-sm" x="18" y="64">計算の手順は指示文に書かせていない。AIが自分から確率を出したかどうかだけを見た。</text>
<text class="t-xs" x="528.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">「前向きに、達成できる計画を」を足した(計4回)</text>
<rect class="box-good" x="448" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="125" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="157">「希望を持てる言い方で」を足した(計4回)</text>
<rect class="box" x="448" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="528.0" y="157" text-anchor="middle" style="font-weight:700">1/4</text>
<rect class="box-accent" x="18" y="174" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="194">「前向きに」は、成功確率の計算を一度も落とさなかった。</text>
<text class="t-accent" x="34" y="212">「希望を持てる言い方で」は、4回中3回、確率の計算を落とした(1回は「五分五分程度」のみ)。</text>
</svg>
