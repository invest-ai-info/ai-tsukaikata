<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="Gemini 4 Carbon（導入価格・入力2ドル出力10ドル）、Gemini 4 Argon（現在の価格・入力2ドル出力10ドルで同額）、Claude Opus 5.5（入力4ドル出力20ドル）、GPT-6 Astra（短い入力・入力10ドル出力50ドル）を比べた横棒グラフ。100万トークンあたりのドル。Carbonはまだ一部のサイバー防御担当者しか使えない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="350"/>
<text class="t-strong" x="18" y="26">Carbonの導入価格は、他社の最上位より安く見える</text>
<text class="t-sm" x="18" y="45">薄い色＝入力、濃い色＝出力。単価は各社の公式ページの数字（100万トークンあたり）。</text>
<text class="t-sm" x="18" y="64">2026年10月29日に確認。会社ごとにトークンの数え方が違うため、単価の安さは支払額の安さを意味しない。</text>
<text class="t" x="18" y="94">Gemini 4 Carbon（導入価格）</text>
<text class="t-xs" x="226" y="93">入力</text>
<rect class="bar-in" x="262" y="82" width="14.3" height="14" rx="2"/>
<text class="t-sm" x="284.3" y="93">$2</text>
<text class="t-xs" x="226" y="112">出力</text>
<rect class="bar-out" x="262" y="101" width="71.6" height="14" rx="2"/>
<text class="t-sm" x="341.6" y="112">$10</text>
<text class="t" x="18" y="149">Gemini 4 Argon（現在の価格・同額）</text>
<text class="t-xs" x="226" y="148">入力</text>
<rect class="bar-in" x="262" y="137" width="14.3" height="14" rx="2"/>
<text class="t-sm" x="284.3" y="148">$2</text>
<text class="t-xs" x="226" y="167">出力</text>
<rect class="bar-out" x="262" y="156" width="71.6" height="14" rx="2"/>
<text class="t-sm" x="341.6" y="167">$10</text>
<text class="t" x="18" y="204">Claude Opus 5.5（Anthropic最上位）</text>
<text class="t-xs" x="226" y="203">入力</text>
<rect class="bar-in" x="262" y="192" width="28.6" height="14" rx="2"/>
<text class="t-sm" x="298.6" y="203">$4</text>
<text class="t-xs" x="226" y="222">出力</text>
<rect class="bar-out" x="262" y="211" width="143.2" height="14" rx="2"/>
<text class="t-sm" x="413.2" y="222">$20</text>
<text class="t" x="18" y="259">GPT-6 Astra（OpenAI最上位・短い入力）</text>
<text class="t-xs" x="226" y="258">入力</text>
<rect class="bar-in" x="262" y="247" width="71.6" height="14" rx="2"/>
<text class="t-sm" x="341.6" y="258">$10</text>
<text class="t-xs" x="226" y="277">出力</text>
<rect class="bar-out" x="262" y="266" width="358.0" height="14" rx="2"/>
<text class="t-sm" x="628.0" y="277">$50</text>
<text class="t-xs" x="18" y="322">※ CarbonはFairwind Program経由のサイバー防御担当者のみ。今日からは使えない。</text>
<text class="t-xs" x="18" y="340">※ 出典: Carbonは発表ページ、他2社は各社の公式料金ページ。</text>
</svg>
