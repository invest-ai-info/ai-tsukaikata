<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="Gemini 4 Argonの出力トークン上限を、前のモデルGemini 3.1 Pro Previewと比べた横棒グラフ。Gemini 3.1 Pro Previewは65,536トークン、Gemini 4 Argonは1,000,000トークンで、約15.3倍に広がった（この記事の計算）。出力トークン上限が増えても、入力側の上限が同じとは限らない（Argonの入力上限は発表に記載がなく未公表）。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="220"/>
<text class="t-strong" x="18" y="26">出力の上限が、前のモデルの約15.3倍に広がった</text>
<text class="t-sm" x="18" y="45">一度の応答で生成できるトークン数（出力トークン上限）。入力側の上限は発表に記載がない。</text>
<text class="t-sm" x="18" y="64">Argonの「100万」は発表ページの表記。3.1 Proの65,536は公式モデルページの実測値。</text>
<text class="t" x="18" y="112">Gemini 3.1 Pro Preview（前のモデル）</text>
<rect class="bar-old" x="268" y="96" width="22.8" height="22" rx="3"/>
<text class="t-sm" x="298.8" y="112">65,536</text>
<text class="t-xs" x="18" y="130">出典: Gemini API 公式モデルページ</text>
<text class="t" x="18" y="154">Gemini 4 Argon</text>
<rect class="bar-new" x="268" y="138" width="348.0" height="22" rx="3"/>
<text class="t-sm" x="624.0" y="154">1,000,000</text>
<text class="t-xs" x="18" y="172">出典: 発表ページ（blog.google）</text>
<text class="t-xs" x="18" y="198">※ 15.3倍はこの記事の計算（1,000,000 ÷ 65,536）。発表ページに倍率の記載はない。</text>
<text class="t-xs" x="18" y="214">※ 出力トークン上限が増えても、一度に読み込める入力の上限が同じとは限らない（未公表）。</text>
</svg>
