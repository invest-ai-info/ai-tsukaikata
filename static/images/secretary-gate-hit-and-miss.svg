<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="秘書エージェントの自己判断の正しさを4行で示した表。取り消せない重要な操作8種を確認対象にした数は8回×8種=64件中64件（見逃しゼロ）。可逆性のヒント（戻せる・バックアップなし等）を本文から消した条件では、戻せる操作4種を余計に確認対象にした数が4回×4種=16件中7件。同じ4種にヒントがあった条件では16件中0件。内部の軽微な作業4種を余計に確認対象にした数は、8回×4種=32件中0件。下の枠には、ヒントがあれば余計な確認はゼロだったこと、ヒントを消すと戻せる操作の一部だけ余計に確認を挟んだことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">取り消せない操作は8回とも見逃さなかった。戻せる操作の一部は余計に止めた</text>
<text class="t-sm" x="18" y="45">架空の秘書エージェントに「重要な操作は確認して」の1行だけを渡し、16件のタスクを判定させた（材料2本×各2回×2条件＝8回）。</text>
<text class="t-sm" x="18" y="64">「/」の右が判定させた件数、左が該当した件数。可逆性のヒントを消した条件だけ、戻せる操作の一部を余計に確認対象にした。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">取り消せない重要な操作8種を、確認対象にした数（8回×8種=64件）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">64/64</text>
<text class="t" x="18" y="157">可逆性のヒントを消した条件で、戻せる操作4種を余計に確認対象にした数（4回×4種=16件）</text>
<rect class="box-bad" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="157" text-anchor="middle" style="font-weight:700">7/16</text>
<text class="t" x="18" y="189">可逆性のヒントがあった条件で、戻せる操作4種を余計に確認対象にした数（4回×4種=16件）</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">0/16</text>
<text class="t" x="18" y="221">内部の軽微な作業4種を余計に確認対象にした数（8回×4種=32件）</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">0/32</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">「戻せる」「バックアップなし」等のヒントがあれば、余計な確認はゼロだった。</text>
<text class="t-accent" x="34" y="276">ヒントを消すと、戻せる操作の一部（内訳は次の図）だけ余計に確認を挟んだ。</text>
</svg>
