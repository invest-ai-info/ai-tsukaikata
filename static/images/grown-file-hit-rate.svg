<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="見本が100行に増えても書式の的中は4本に3本どまりだったことを示す表。すべて「規定の書式になった回数／試した回数」。クリーンな100行に書式を指示せず追記させた場合は4本中3本、同じクリーンな100行で「ファイルに合わせて」と明示した場合は4本中4本。1行だけ区切り記号の違う行を混ぜた100行に書式を指示せず追記させた1日目は4本中1本。その同じ系列が2日目も1日目と同じ結果（そろうかそろわないか）を続けた数は4系列中4系列。点検専用の別会話に乱れた行を探させると、3系列中3系列で乱れた行をすべて名指しし、誤検知は無かった。下の枠には、書式を指示せず100行の見本を渡しても的中は4本中3本どまりでお手本1行だけだった元記事の12/12より低いこと、1行だけ区切り記号の違う行を混ぜると的中はさらに4本中1本へ落ちたこと、そろった系列・崩れた系列とも2日目は1日目と同じ結果を続けたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">見本が100行に増えても、書式の的中は4本に3本どまりだった</text>
<text class="t-sm" x="18" y="45">実測2026-10-02。daily-append-same-shape と同じ2材料に、100行ぶんの記録を積んでから追記させた。</text>
<text class="t-sm" x="18" y="64">書式を1文字も書かない指示文では、お手本1行だけだった元記事の12/12より的中が下がった。</text>
<text class="t-xs" x="528.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">クリーンな100行・書式の指示なし（C1）</text>
<rect class="box" x="448" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="528.0" y="125" text-anchor="middle" style="font-weight:700">3/4</text>
<text class="t" x="18" y="157">クリーンな100行・「ファイルに合わせて」と明示（C3）</text>
<rect class="box-good" x="448" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="157" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="189">1行だけ乱れた100行・書式の指示なし・1日目（C2）</text>
<rect class="box" x="448" y="168" width="160" height="26" rx="4"/>
<text class="t-sm" x="528.0" y="189" text-anchor="middle" style="font-weight:700">1/4</text>
<text class="t" x="18" y="221">C2の2日目も、1日目と同じ系列が同じ結果を継続</text>
<rect class="box-good" x="448" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="221" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="253">点検専用の別会話が、乱れた行をすべて名指し</text>
<rect class="box-good" x="448" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="253" text-anchor="middle" style="font-weight:700">3/3</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">書式を指示せず100行の見本を渡しても、的中は4本中3本どまり（元記事はお手本1行で12/12）。</text>
<text class="t-accent" x="34" y="308">1行だけ区切り記号の違う行を混ぜると、的中はさらに4本中1本へ落ちた。</text>
<text class="t-accent" x="34" y="326">そろった系列・崩れた系列とも、2日目は1日目と同じ結果をそのまま続けた（4系列とも）。</text>
</svg>
