<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img" aria-label="いま使える機能と、まだ来ていない機能を対比した図。いま使える（ベータ）のは、設定のreflect on your usageからレポートを作成できること、過去1・3・6・12ヶ月の振り返り、quiet hoursの設定と休憩の通知（nudge）。まだ来ていない（soon）のは、使った時間（time spent）の表示と、Coworkの会話の振り返りの2点で、本文にそう明記されている。下の警告枠には、発表ページにTeam・Enterpriseプランについての記載がないことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="272"/>
<text class="t-strong" x="18" y="26">「使った時間」と「Coworkの振り返り」は、まだ来ていない</text>
<text class="t-sm" x="18" y="45">発表ページの本文で、公式が「soon」と書いている2つを分けて並べた。</text>
<text class="t-sm" x="18" y="64">ベータ版なので、いま見えている画面がそのまま完成形ではない。</text>
<rect class="box-good" x="18.0" y="96" width="332.0" height="100" rx="6"/>
<text class="t-good" x="34.0" y="120" style="font-weight:700">いま使える（ベータ）</text>
<text class="t-sm" x="34.0" y="142">設定＞reflect on your usageでレポート作成</text>
<text class="t-sm" x="34.0" y="161">過去1・3・6・12ヶ月の振り返り</text>
<text class="t-sm" x="34.0" y="180">quiet hoursの設定・休憩の通知(nudge)</text>
<rect class="box-quiet" x="370.0" y="96" width="332.0" height="100" rx="6"/>
<text class="t" x="386.0" y="120" style="font-weight:700">まだ来ていない（soon）</text>
<text class="t-sm" x="386.0" y="142">使った時間（time spent）の表示</text>
<text class="t-sm" x="386.0" y="161">Coworkの会話の振り返り</text>
<text class="t-sm" x="386.0" y="180">（本文に明記された2点のみ）</text>
<rect class="box-bad" x="18" y="212" width="684" height="40" rx="6"/>
<text class="t-bad" x="34" y="237">発表ページに、Team・Enterpriseプランについての記載はない。</text>
</svg>
