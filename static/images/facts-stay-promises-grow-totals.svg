<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="架空の応募文5回・謝罪文5回、合計10回で「読みやすく整えて」を試したとき、何かが足された回数を場所ごとに並べた横棒グラフ。事実欄に新しい文が足された回は0回。約束欄に語句だけ補われた回（「配送」等）は3回（いずれも謝罪文）。約束欄に新しい文がまるごと足された回は1回。書類の外側にあいさつ文が足された回も1回。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="310"/>
<text class="t-strong" x="18" y="26">10回のうち、何かが足された回数は場所によって偏る</text>
<text class="t-sm" x="18" y="45">同じ10回（応募文5・謝罪文5）を、足された場所で数え直した。</text>
<text class="t-sm" x="18" y="64">事実欄（実績・経緯）に新しい文が足された回は0回。書類の外側に定型のあいさつ文が足されたのは1回だけ。</text>
<text class="t-xs" x="358" y="106" text-anchor="middle">0</text>
<text class="t-xs" x="508" y="106" text-anchor="middle">5</text>
<text class="t-xs" x="658" y="106" text-anchor="middle">10回</text>
<text class="t" x="18" y="133">事実欄に新しい文</text>
<rect class="box-quiet" x="358.0" y="118" width="300" height="20" rx="2"/>
<rect class="bar-in" x="358.0" y="118" width="2.0" height="20" rx="2"/>
<text class="t" x="366.0" y="133">0回</text>
<text class="t" x="18" y="167">約束欄に語句だけ補われる（「配送」等）</text>
<rect class="box-quiet" x="358.0" y="152" width="300" height="20" rx="2"/>
<rect class="bar-old" x="358.0" y="152" width="90.0" height="20" rx="2"/>
<text class="t" x="456.0" y="167">3回</text>
<text class="t" x="18" y="201">約束欄に新しい文まるごと</text>
<rect class="box-quiet" x="358.0" y="186" width="300" height="20" rx="2"/>
<rect class="bar-out" x="358.0" y="186" width="30.0" height="20" rx="2"/>
<text class="t" x="396.0" y="201">1回</text>
<text class="t" x="18" y="235">書類の外側にあいさつ文が足される</text>
<rect class="box-quiet" x="358.0" y="220" width="300" height="20" rx="2"/>
<rect class="bar-out" x="358.0" y="220" width="30.0" height="20" rx="2"/>
<text class="t" x="396.0" y="235">1回</text>
<text class="t-xs" x="18" y="268">※ 「語句だけ補われる」は文まるごとの追加ではなく、既存の1文に単語を挟んだもの（謝罪文のみ）。</text>
<text class="t-xs" x="18" y="289">架空データでの実測（全10回）。生の返りは docs/evidence/ に全文置いてある。</text>
</svg>
