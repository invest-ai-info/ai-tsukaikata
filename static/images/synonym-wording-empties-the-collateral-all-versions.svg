<svg xmlns="http://www.w3.org/2000/svg" width="720" height="566" viewBox="0 0 720 566" role="img" aria-label="健全5件・誤り混入6件・紛らわしい語混入6件・その複合7件・引用の指定を足した誤り混入6件・引用の指定を足した紛らわしい語混入6件の6条件それぞれで、材料2本×各2回=4回ずつ実行し、正しく処理できた回数を比べた横棒グラフ。健全5件は4回とも巻き添えゼロ（HD-2206を含め5件とも残った）。誤り混入6件・紛らわしい語混入6件・両方を混ぜた複合7件は、いずれも4回とも該当項目だけを正しく除外し、健全5件は全部残った。引用の指定を足した2条件も4回とも正しく除外し、除外の根拠として引用された語句は本文と一致していた。6条件24回すべてで、健全な項目の巻き込みも、除外すべき項目の見逃しも起きなかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="566"/>
<text class="t-strong" x="18" y="26">6条件×材料2本×各2回=24回。全部が正しく処理できた</text>
<text class="t-sm" x="18" y="45">指示文はどれも、除外の基準に「類義語・言い換えも含める」を足した1本がもと。</text>
<text class="t-sm" x="18" y="64">健全5件・誤り混入6件・紛らわしい語混入6件・その複合・引用の指定を足した版で試した。</text>
<text class="t-xs" x="18" y="83">生の回答は docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="160">1. 健全5件</text>
<rect class="box" x="330" y="168" width="310" height="34" rx="4"/>
<rect class="box-good" x="330" y="168" width="310.0" height="34" rx="4"/>
<text class="t-good" x="654" y="190">4/4</text>
<text class="t-xs" x="330" y="217">巻き添えゼロ。HD-2206も含め5件とも残った</text>
<text class="t-sm" x="18" y="226">2. 誤り混入6件</text>
<rect class="box" x="330" y="234" width="310" height="34" rx="4"/>
<rect class="box-good" x="330" y="234" width="310.0" height="34" rx="4"/>
<text class="t-good" x="654" y="256">4/4</text>
<text class="t-xs" x="330" y="283">挿入した誤りだけを正しく除外</text>
<text class="t-sm" x="18" y="292">3. 紛らわしい語混入6件</text>
<rect class="box" x="330" y="300" width="310" height="34" rx="4"/>
<rect class="box-good" x="330" y="300" width="310.0" height="34" rx="4"/>
<text class="t-good" x="654" y="322">4/4</text>
<text class="t-xs" x="330" y="349">至急の語が無い依頼も正しく除外</text>
<text class="t-sm" x="18" y="358">4. 誤り＋紛らわしい語の複合7件</text>
<rect class="box" x="330" y="366" width="310" height="34" rx="4"/>
<rect class="box-good" x="330" y="366" width="310.0" height="34" rx="4"/>
<text class="t-good" x="654" y="388">4/4</text>
<text class="t-xs" x="330" y="415">2件とも正しく除外、健全5件は全部残った</text>
<text class="t-sm" x="18" y="424">5. 引用の指定＋誤り混入6件</text>
<rect class="box" x="330" y="432" width="310" height="34" rx="4"/>
<rect class="box-good" x="330" y="432" width="310.0" height="34" rx="4"/>
<text class="t-good" x="654" y="454">4/4</text>
<text class="t-xs" x="330" y="481">根拠の引用も4回とも本文と一致</text>
<text class="t-sm" x="18" y="490">6. 引用の指定＋紛らわしい語混入6件</text>
<rect class="box" x="330" y="498" width="310" height="34" rx="4"/>
<rect class="box-good" x="330" y="498" width="310.0" height="34" rx="4"/>
<text class="t-good" x="654" y="520">4/4</text>
<text class="t-xs" x="330" y="547">根拠の引用も4回とも本文と一致</text>
</svg>
