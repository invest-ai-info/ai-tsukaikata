<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262" role="img" aria-label="正しい平均（記録のある日数で割った値）を100%としたとき、欠番の日を0件として暦日全体で割った場合に平均が何%になるかを示す横棒グラフ。材料A（18日分・記録のある15日で割ると6.33件/日）は、欠番3日を0件として18日で割ると83%（5.28件/日）に下がる。材料B（21日分・記録のある17日で割ると98.65件/日）は、欠番4日を0件として21日で割ると81%（79.86件/日）に下がる。実測ではこの低い値が20回中0回だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="262"/>
<text class="t-strong" x="18" y="24">もし欠番を0件に混ぜていたら、平均は17〜19%低く出ていたはずだった</text>
<text class="t-sm" x="18" y="43">正しい平均（記録のある日数で割った値）を100%としたときの、参考値の割合。</text>
<text class="t-sm" x="18" y="62">実測でこの低い値が返ってきたことは一度もない（20回とも正しい割り方だった）。</text>
<text class="t" x="18" y="123">材料A・記録のある15日で割る</text>
<rect class="box-good" x="300.0" y="112" width="330.0" height="16" rx="3"/>
<text class="t-good" x="642.0" y="123">100%</text>
<text class="t" x="18" y="155">材料A・欠番を0件として18日で割る</text>
<rect class="box-bad" x="300.0" y="144" width="273.9" height="16" rx="3"/>
<text class="t-bad" x="642.0" y="155">83%</text>
<text class="t" x="18" y="187">材料B・記録のある17日で割る</text>
<rect class="box-good" x="300.0" y="176" width="330.0" height="16" rx="3"/>
<text class="t-good" x="642.0" y="187">100%</text>
<text class="t" x="18" y="219">材料B・欠番を0件として21日で割る</text>
<rect class="box-bad" x="300.0" y="208" width="267.3" height="16" rx="3"/>
<text class="t-bad" x="642.0" y="219">81%</text>
<path class="line" d="M300.0 104 L300.0 222" stroke-dasharray="4 3"/>
</svg>
