<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="3つの条件×2つの材料で、正しい不足額に到達し健全な契約を誤判定しなかった回数を示す表。計算手順を明示した言い方はWebサイト保守契約5回中5回・SNS運用代行契約5回中5回。計算手順を省いた素朴な聞き方はWebサイト保守契約5回中3回・SNS運用代行契約5回中4回。説明が合っているか確認してという軽い言い方はWebサイト保守契約3回中2回・SNS運用代行契約3回中2回。下の枠には、計算手順を明示した言い方は10回とも3件すべてを引いて正解に到達し健全な契約への誤判定も0回だったこと、素朴な聞き方・軽い言い方は合わせて16回中6回、見落とし・結論行と本文の食い違い・引き算の誤り・完全な見逃しという崩れ方をしたことが書かれている。">
