<svg xmlns="http://www.w3.org/2000/svg" width="720" height="258" viewBox="0 0 720 258" role="img" aria-label="消えた行を「メモと週報を並べて、どこにも無い行を挙げて」という指示文で見つけられるかを実測した結果を示す表。週3の「体調不良」を正しく挙げられたかは2回中2回、週4の「残業」を正しく挙げられたかも2回中2回で、どちらも全部成功した。下の枠には、禁止だけの指示文で消えた行は、別の会話でメモと週報を並べて聞き直すと4回とも過不足なく1件だけ見つかったこと、消えたことに気づく手段はあるが自分から使わない限り気づけないことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="258"/>
<text class="t-strong" x="18" y="26">消えた行は、メモと週報を並べ直すと4回とも見つかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-05。禁止だけ・行き先なしの指示文で消えた週3・週4の禁句を、それぞれ2回ずつ確認。</text>
<text class="t-sm" x="18" y="64">「メモにあるのに週報のどこにも無い行」を正しく1件だけ挙げられた回数／試した回数。</text>
<text class="t-xs" x="458.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">週3「体調不良」を挙げられたか</text>
<rect class="box-good" x="378" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="125" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="157">週4「残業」を挙げられたか</text>
<rect class="box-good" x="378" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="157" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="174" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="194">禁止だけの指示文で消えた行は、別の会話で「メモと週報を並べて、どこにも無い行を</text>
<text class="t-accent" x="34" y="212">挙げて」と聞き直すと、4回とも過不足なく1件だけ見つかった。消えたことに気づく</text>
<text class="t-accent" x="34" y="230">手段はあるが、その手段を自分から使わない限り、消えたことにも気づけない。</text>
</svg>
