<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="「100個出して」と「言い換え禁止・無理に埋めないで」を比べた図。「100個出して」は出てきた件数100件に対し実質の種類数は35〜36件（密度35〜36%）。「言い換え禁止・正直に打ち切ってよい」は出てきた件数が22〜23件に減る代わりに、実質の種類数は20〜22件（密度87〜100%）に上がる。数を求めると埋め草が増え、正直さを求めると出てくる件数そのものは減るというのが、この記事の比較の軸。note記事テーマは23件中20件（87%）、Kindle本テーマは22件中22件（100%）が実質の種類数だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="320"/>
<text class="t-strong" x="18" y="26">件数を減らして正直に打ち切ると、密度はほぼ100%に近づく</text>
<text class="t-sm" x="18" y="45">同じ2テーマ（note記事・Kindle本）。「言い換え禁止・無理に埋めない」を足した版は、新規クラスタが尽きたら打ち切ってよいとした。</text>
<text class="t-sm" x="18" y="64">出てきた件数は100件→22〜23件に減るが、実質の種類数はほとんど減らない。</text>
<rect class="box-bad" x="18" y="96" width="216" height="150" rx="8"/>
<text class="t-sm" x="32" y="118">「100個出して」</text>
<text class="t-strong" x="32" y="154">35〜36件</text>
<text class="t-xs" x="32" y="176">出てきた件数は100件。</text>
<text class="t-xs" x="32" y="192">実質の種類数はこれだけ（100件中）。</text>
<rect class="box-good" x="252" y="96" width="216" height="150" rx="8"/>
<text class="t-sm" x="266" y="118">言い換え禁止＋</text>
<text class="t-sm" x="266" y="134">正直に打ち切ってよい</text>
<text class="t-strong" x="266" y="170">20〜22件</text>
<text class="t-xs" x="266" y="192">出てきた件数は22〜23件。</text>
<text class="t-xs" x="266" y="208">ほぼ全件が実質の種類数。</text>
<rect class="box-quiet" x="486" y="96" width="216" height="150" rx="8"/>
<text class="t-sm" x="500" y="118">密度（実質÷出てきた件数）</text>
<text class="t-strong" x="500" y="154">35〜36%</text>
<text class="t-strong" x="500" y="174">→ 87〜100%</text>
<text class="t-xs" x="500" y="196">出てきた件数に占める、</text>
<text class="t-xs" x="500" y="212">実質の種類の割合。</text>
<text class="t-accent" x="18" y="278">数を求めると埋め草が増え、正直さを求めると数は減る——この記事はこの線引きの話。</text>
<text class="t-sm" x="18" y="300">※ note記事テーマは23件中20件（87%）、Kindle本テーマは22件中22件（100%）が実質の種類数。</text>
</svg>
