<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="GPT-6 Astra と GPT-5.6 Sol の単価を比べた横棒グラフ。100万トークンあたり、ふつうの窓口で入力が短いときの値。入力は Sol が4ドルで Astra が10ドル、読み直し（キャッシュ読み取り）は Sol が0.4ドルで Astra が1ドル、出力は Sol が20ドルで Astra が50ドル。3つとも2.5倍。公式は出力の量が減るので1件あたりは安くなると書いているが、その数字は公開されていない。GPT-5.6 Sol の値段は少なくとも2026年11月21日までの販促価格と明記されている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">1つ前の主力（GPT-5.6 Sol）と比べると、単価はどれも 2.5 倍</text>
<text class="t-sm" x="18" y="45">100万トークンあたり。ふつうの窓口（Standard）で、入力が短いときの値です。</text>
<text class="t-sm" x="18" y="64">灰色＝GPT-5.6 Sol、青＝GPT-6 Astra。入力・読み直し・出力の3つとも同じ倍率です。</text>
<text class="t-sm" x="18" y="83">ただし公式は「出力の量が減るので1件あたりは安くなる」と書いています（数字は非公開）。</text>
<text class="t" x="18" y="119">入力</text>
<text class="t-xs" x="244" y="119">Sol</text>
<rect class="bar-old" x="288" y="106" width="24.3" height="17" rx="2"/>
<text class="t-sm" x="320.3" y="119">$4</text>
<text class="t-xs" x="244" y="142">Astra</text>
<rect class="bar-new" x="288" y="129" width="60.8" height="17" rx="2"/>
<text class="t-sm" x="356.8" y="142">$10</text>
<text class="t" x="18" y="187">読み直し（キャッシュ読み取り）</text>
<text class="t-xs" x="244" y="187">Sol</text>
<rect class="bar-old" x="288" y="174" width="2.4" height="17" rx="2"/>
<text class="t-sm" x="298.4" y="187">$0.4</text>
<text class="t-xs" x="244" y="210">Astra</text>
<rect class="bar-new" x="288" y="197" width="6.1" height="17" rx="2"/>
<text class="t-sm" x="302.1" y="210">$1</text>
<text class="t" x="18" y="255">出力</text>
<text class="t-xs" x="244" y="255">Sol</text>
<rect class="bar-old" x="288" y="242" width="121.6" height="17" rx="2"/>
<text class="t-sm" x="417.6" y="255">$20</text>
<text class="t-xs" x="244" y="278">Astra</text>
<rect class="bar-new" x="288" y="265" width="304.0" height="17" rx="2"/>
<text class="t-sm" x="600.0" y="278">$50</text>
<text class="t-xs" x="18" y="338">※ 出典: OpenAI の料金ページ（developers.openai.com・2026年9月5日に確認）。</text>
<text class="t-xs" x="18" y="356">※ GPT-5.6 Sol の値段は「少なくとも2026年11月21日までの販促価格」と書かれています。</text>
</svg>
