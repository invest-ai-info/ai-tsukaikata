<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-label="見つけにくかった埋め草のもとの代表例「5段階で点数をつけてください」を、頼み方5通りでいくつ見つけたかを並べた横棒グラフ。そのまま開いて聞くと6回中0回、「下限だけ挙げて」と絞ると6回中1回、＋書くことが無い日に何が出るかを足しても6回中1回しか見つからなかった。一度に「全部見直して」まで含めて新規の会話で頼んでも3回中0回。ところが、最初に開いて聞いた同じ会話に、あとから「もう一度全部見直して」と重ねて聞くと、3回中3回とも見つけた。近くにあった「無ければ空欄でよい」という逃げ道は、実は隣の指定にかかっていて、この指定自身には届いていなかったことが分かった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="372"/>
<text class="t-strong" x="18" y="26">「5段階で点数をつけてください」は、聞き方でこれだけ変わる</text>
<text class="t-sm" x="18" y="45">見つけにくかった8個中の1つを取り出した図。上4つは新規の会話、いちばん下だけは同じ会話への重ね聞き。</text>
<text class="t-sm" x="18" y="64">近くにある「無ければ空欄でよい」という逃げ道は、実は隣の指定にかかっていて、この指定自身には届いていなかった。</text>
<path class="line" d="M268.0 124 L268.0 308" stroke-dasharray="3 4"/>
<text class="t-xs" x="268.0" y="118" text-anchor="middle">0回</text>
<path class="line" d="M408.0 124 L408.0 308" stroke-dasharray="3 4"/>
<text class="t-xs" x="408.0" y="118" text-anchor="middle">3回</text>
<path class="line" d="M548.0 124 L548.0 308" stroke-dasharray="3 4"/>
<text class="t-xs" x="548.0" y="118" text-anchor="middle">6回</text>
<text class="t" x="18" y="149">そのまま開いて聞く</text>
<rect class="box-bad" x="268.0" y="133" width="2.0" height="17" rx="2"/>
<text class="t-bad" x="278.0" y="147">0/6</text>
<text class="t" x="18" y="189">「下限だけ挙げて」と絞る</text>
<rect class="bar-old" x="268.0" y="173" width="46.7" height="17" rx="2"/>
<text class="t" x="322.7" y="187">1/6</text>
<text class="t" x="18" y="229">＋書くことが無い日に何が出るか</text>
<rect class="bar-old" x="268.0" y="213" width="46.7" height="17" rx="2"/>
<text class="t" x="322.7" y="227">1/6</text>
<text class="t" x="18" y="269">一度に「全部見直して」まで頼む</text>
<rect class="box-bad" x="268.0" y="253" width="2.0" height="17" rx="2"/>
<text class="t-bad" x="278.0" y="267">0/3</text>
<text class="t" x="18" y="309">あとから「もう一度全部見直して」</text>
<rect class="box-good" x="268.0" y="293" width="140.0" height="17" rx="2"/>
<text class="t-good" x="416.0" y="307">3/3</text>
<text class="t-good" x="18" y="334">※ 一番下だけ緑＝あとから同じ会話に重ねて聞くと、3つの会話とも見つけた。</text>
<text class="t-xs" x="18" y="353">生の返り（5通り・21回ぶん）は docs/evidence/ に全文置いてある。</text>
</svg>
