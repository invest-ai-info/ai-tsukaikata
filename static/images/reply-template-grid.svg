<text class="t-strong" x="18" y="26">18回すべての結果。青＝正しく空欄にした／赤＝誤って固定した</text>
<text class="t-sm" x="18" y="45">A＝副業ライターの返信12通、B＝ハンドメイド作家の返信12通。それぞれ独立した新規セッションに送った。</text>
<text class="t-sm" x="18" y="64">誤って固定した＝その種類の4通中3通にしか出ない結びの一文を「毎回同じ文」として型に残した。</text>
<text class="t-sm" x="18" y="83">各セルは1回ぶんの返り。同じ版でも6回すべてを別々に数えている（まとめていない）。</text>
<text class="t-xs" x="218.0" y="108">A-1</text>
