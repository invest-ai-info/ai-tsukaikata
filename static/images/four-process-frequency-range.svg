<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="process=P1〜P4の4つの処理について、ふだんの1日あたり実行回数の範囲を横棒で示した図。P1は1〜2回/日、P2は4〜8回/日、P3は10〜15回/日、P4は20〜30回/日で、最も少ないP1と最も多いP4では約17倍の差がある。下の枠には、P4はP1の約17倍の頻度で先行記事の約5倍から差を広げたこと、処理数も2本から4本に増やしたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="340"/>
<text class="t-strong" x="18" y="24">P1〜P4のふだんの1日あたり回数は、最大で約17倍違う</text>
<text class="t-sm" x="18" y="43">架空の定期実行ログ（2026-09-01〜09-21・21日分）。P1は1〜2回/日、P4は20〜30回/日。</text>
<text class="t-sm" x="18" y="62">先行記事の頻度差（4〜8回 対 1〜2回＝約5倍・2処理）より、差も処理数も広げた。</text>
<text class="t" x="18" y="122">process=P1</text>
<rect class="bar-new" x="242.0" y="108" width="12.0" height="16" rx="3"/>
<text class="t-sm" x="262.0" y="121.0">1〜2回/日</text>
<text class="t" x="18" y="156">process=P2</text>
<rect class="bar-new" x="278.0" y="142" width="48.0" height="16" rx="3"/>
<text class="t-sm" x="334.0" y="155.0">4〜8回/日</text>
<text class="t" x="18" y="190">process=P3</text>
<rect class="bar-new" x="350.0" y="176" width="60.0" height="16" rx="3"/>
<text class="t-sm" x="418.0" y="189.0">10〜15回/日</text>
<text class="t" x="18" y="224">process=P4</text>
<rect class="bar-new" x="470.0" y="210" width="120.0" height="16" rx="3"/>
<text class="t-sm" x="598.0" y="223.0">20〜30回/日</text>
<line class="line" x1="230" y1="248" x2="590" y2="248"/>
<text class="t-xs" x="230.0" y="264" text-anchor="middle">0</text>
<text class="t-xs" x="350.0" y="264" text-anchor="middle">10</text>
<text class="t-xs" x="470.0" y="264" text-anchor="middle">20</text>
<text class="t-xs" x="590.0" y="264" text-anchor="middle">30</text>
<rect class="box-accent" x="18" y="278" width="684" height="52" rx="6"/>
<text class="t-accent" x="34" y="300">P4(20〜30回/日)はP1(1〜2回/日)の約17倍の頻度。先行記事の約5倍から差を広げた。</text>
<text class="t-accent" x="34" y="318">処理数も2本→4本に増やし、どの処理が止まっても見つけられるかを確かめた。</text>
</svg>
