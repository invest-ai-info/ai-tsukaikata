<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="「◯◯風で」という依頼文を、著作権の問題にならないよう固有名詞を使わずに書き直させた実測結果を示す表。ジブリ風の生き物と女の子の依頼（3回試行）は1回で元のキャラクターが分かった。ポケモン風の黄色い生き物の依頼（3回試行）は2回で元のキャラクターが分かった。アナ雪風の女の子の依頼（3回試行）は0回だった。下の枠には、ジブリの1回は書き直した文に「ジブリ風の」という固有名詞がそのまま残っていたこと、ポケモンの2回は固有名詞は消えたが頬の丸い模様やしっぽの形まで書かれ特定できたこと、アナ雪は元の依頼自体が青いドレス・氷の城という一般的な見た目だったため0回だったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">名前を消す指示でも、9回中3回はキャラが分かる手がかりが残った</text>
<text class="t-sm" x="18" y="45">実測2026-10-11。3種類の依頼文に、同じ書き直し指示文を独立した新規の会話で各3回試した。</text>
<text class="t-sm" x="18" y="64">「分かった」は、固有名詞そのものか、特徴の組み合わせから元のキャラクターを特定できた回。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">ジブリ風の生き物と女の子の依頼（3回）</text>
<rect class="box-bad" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="125" text-anchor="middle" style="font-weight:700">1/3</text>
<text class="t" x="18" y="157">ポケモン風の黄色い生き物の依頼（3回）</text>
<rect class="box-bad" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="157" text-anchor="middle" style="font-weight:700">2/3</text>
<text class="t" x="18" y="189">アナ雪風の女の子の依頼（3回）</text>
<rect class="box-good" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="189" text-anchor="middle" style="font-weight:700">0/3</text>
<rect class="box-accent" x="18" y="206" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="226">分かった1回は、書き直した文にも「ジブリ風の」という固有名詞がそのまま残っていた。</text>
<text class="t-accent" x="34" y="244">ポケモンの2回は固有名詞は消えたが、頬の丸い模様やしっぽの形まで書かれ特定できた。</text>
<text class="t-accent" x="34" y="262">アナ雪の依頼は、元の依頼自体が青いドレス・氷の城という一般的な見た目だったため0回。</text>
</svg>
