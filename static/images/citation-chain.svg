<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-label="出典の確認が3段階あることを示した図。1つ目は出典URLが付いているか（見ればすぐ分かる）、2つ目はそのページが開けるか（押せば分かる）、3つ目はその数字がページに書いてあるか。3つ目だけはページを開いて文字を探す必要があるため飛ばされやすく、そこが抜け道になる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="230"/>
<text class="t-strong" x="18" y="26">出典が付いているほど、確認されなくなります</text>
<text class="t-sm" x="18" y="45">3つ目だけ、ページを開いて文字を探さないと確かめられません。</text>
<text class="t-sm" x="18" y="64">手間がかかるので飛ばされます。そこが抜け道になります。</text>
<rect class="box" x="22" y="92" width="200" height="92" rx="6"/>
<text class="t-strong" x="36" y="122">出典URLが付いている</text>
<text class="t-good" x="36" y="168">見ればすぐ分かる</text>
<path class="line" d="M230 138.0 L248 138.0"/>
<rect class="box" x="256" y="92" width="200" height="92" rx="6"/>
<text class="t-strong" x="270" y="122">そのページが開ける</text>
<text class="t-good" x="270" y="168">押せば分かる</text>
<path class="line" d="M464 138.0 L482 138.0"/>
<rect class="box-bad" x="490" y="92" width="200" height="92" rx="6"/>
<text class="t-strong" x="504" y="122">その数字がページに</text>
<text class="t-strong" x="504" y="142">書いてある</text>
<text class="t-bad" x="504" y="168">ここだけ誰も見ない</text>
<text class="t-xs" x="18" y="216">※ だから「その数字が書いてある部分を、周りの文ごと引用して」と頼みます。</text>
</svg>
