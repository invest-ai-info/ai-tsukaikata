<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="掃除機の仕様書から、仕込み誤りのある吸引力と保証期間の2項目を外して、同じ指示文を3回試した結果を示す表。仕様書に残した6項目（3回×6件）は18/18が不一致と判定された。仕様書から外した「吸引力」は3回中0回、「保証期間」も3回中0回しか不一致と判定されなかった。下の枠には、仕様書に残した6項目は3回とも全件そのまま不一致と判定されたこと、外した2項目は3回とも『仕様書に記載がないため照合できません』で止まったこと、間違っているのに一致と誤判定された回は0件で見つからないだけで誤りはしないことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">仕様書から外した2項目は、見つからず「保留」のままだった</text>
<text class="t-sm" x="18" y="45">実測2026-10-20。掃除機の仕様書から、仕込み誤りのある吸引力・保証期間を外して3回試した。</text>
<text class="t-sm" x="18" y="64">「正しく拾えた回」ではなく「不一致と判定できた回」を数えている（外した2項目は0回）。</text>
<text class="t-xs" x="458.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">仕様書に残した6項目（3回×6件）</text>
<rect class="box-good" x="378" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="125" text-anchor="middle" style="font-weight:700">18/18</text>
<text class="t" x="18" y="157">仕様書から外した「吸引力」（3回）</text>
<rect class="box-bad" x="378" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="458.0" y="157" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="189">仕様書から外した「保証期間」（3回）</text>
<rect class="box-bad" x="378" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="458.0" y="189" text-anchor="middle" style="font-weight:700">0/3</text>
<rect class="box-accent" x="18" y="206" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="226">仕様書に残した6項目は、3回とも全件そのまま不一致と判定された（18/18）。</text>
<text class="t-accent" x="34" y="244">外した2項目は、3回とも『仕様書に記載がないため照合できません』で止まった。</text>
<text class="t-accent" x="34" y="262">間違っているのに『一致』と誤判定された回は0件。見つからないだけで、誤りはしない。</text>
</svg>
