<svg xmlns="http://www.w3.org/2000/svg" width="720" height="514" viewBox="0 0 720 514" role="img" aria-label="EmbeddingGemma（2025年9月発表）からEmbeddingGemma 2（2026年10月6日発表）への変化を示した表。モダリティはテキストのみからテキスト・画像・動画・音声へ拡大。テキスト専用の構成のパラメータ数は3.00億から2.70億へ減少。読める長さ（コンテキスト）は2,048トークンから8,192トークンへ4倍に拡大。MTEBコード（NDCG@10）は68.76から78.68（+9.92点）に上昇。MTEB多言語（v2・平均）は61.15から61.36。ライセンスは、使用制限のあるGemma利用規約から、制限条項のないApache 2.0に変わった。テキスト専用の構成はモジュール式の読み込みで、画像用(1.7億パラメータ)・音声用(3.0億パラメータ)のエンコーダーは必要なときだけ追加する。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="514"/>
<text class="t-strong" x="18" y="26">1→2で増えたのはモダリティ、減ったのはテキスト専用時の重さ</text>
<text class="t-sm" x="18" y="45">灰色＝EmbeddingGemma（2025年9月発表）、青＝EmbeddingGemma 2（2026年10月6日発表）。</text>
<text class="t-sm" x="18" y="64">出典はいずれもGoogleのモデルカード。テキスト専用の構成では前世代より軽くなっている。</text>
<text class="t-sm" x="18" y="83">MTEBコードはGoogle自身の測定（NDCG@10）。ライセンスも独自規約からApache 2.0に変わった。</text>
<text class="t-sm" x="191.0" y="126">EmbeddingGemma</text>
<text class="t-accent" x="454.5" y="126">EmbeddingGemma 2</text>
<text class="t-sm" x="18" y="158">モダリティ</text>
<rect class="box-quiet" x="183.0" y="140" width="255.5" height="46" rx="4"/>
<text class="t" x="193.0" y="158">テキストのみ</text>
<rect class="box-accent" x="446.5" y="140" width="255.5" height="46" rx="4"/>
<text class="t-accent" x="456.5" y="158">テキスト・画像・</text>
<text class="t-accent" x="456.5" y="174">動画・音声</text>
<text class="t-sm" x="18" y="214">テキスト専用の構成</text>
<text class="t-sm" x="18" y="230">（パラメータ数）</text>
<rect class="box-quiet" x="183.0" y="196" width="255.5" height="46" rx="4"/>
<text class="t" x="193.0" y="214">3.00億</text>
<rect class="box-accent" x="446.5" y="196" width="255.5" height="46" rx="4"/>
<text class="t-accent" x="456.5" y="214">2.70億</text>
<text class="t-sm" x="18" y="270">読める長さ</text>
<text class="t-sm" x="18" y="286">（コンテキスト）</text>
<rect class="box-quiet" x="183.0" y="252" width="255.5" height="46" rx="4"/>
<text class="t" x="193.0" y="270">2,048</text>
<text class="t" x="193.0" y="286">トークン</text>
<rect class="box-accent" x="446.5" y="252" width="255.5" height="46" rx="4"/>
<text class="t-accent" x="456.5" y="270">8,192トークン</text>
<text class="t-accent" x="456.5" y="286">（4倍）</text>
<text class="t-sm" x="18" y="326">MTEBコード</text>
<text class="t-sm" x="18" y="342">（NDCG@10）</text>
<rect class="box-quiet" x="183.0" y="308" width="255.5" height="46" rx="4"/>
<text class="t" x="193.0" y="326">68.76</text>
<rect class="box-accent" x="446.5" y="308" width="255.5" height="46" rx="4"/>
<text class="t-accent" x="456.5" y="326">78.68</text>
<text class="t-accent" x="456.5" y="342">（+9.92点）</text>
<text class="t-sm" x="18" y="382">MTEB多言語</text>
<text class="t-sm" x="18" y="398">（v2・平均）</text>
<rect class="box-quiet" x="183.0" y="364" width="255.5" height="46" rx="4"/>
<text class="t" x="193.0" y="382">61.15</text>
<rect class="box-accent" x="446.5" y="364" width="255.5" height="46" rx="4"/>
<text class="t-accent" x="456.5" y="382">61.36</text>
<text class="t-sm" x="18" y="438">ライセンス</text>
<rect class="box-quiet" x="183.0" y="420" width="255.5" height="46" rx="4"/>
<text class="t" x="193.0" y="438">Gemma利用規約</text>
<text class="t" x="193.0" y="454">（使用制限あり）</text>
<rect class="box-accent" x="446.5" y="420" width="255.5" height="46" rx="4"/>
<text class="t-accent" x="456.5" y="438">Apache 2.0</text>
<text class="t-accent" x="456.5" y="454">（制限条項なし）</text>
<text class="t-xs" x="18" y="492">※ テキスト専用の構成はモジュール式で、画像用(1.7億)・音声用(3.0億)は必要なときだけ追加する。</text>
</svg>
