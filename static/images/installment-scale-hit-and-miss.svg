<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="予約件数を3倍にしても入金照合の誤判定が増えるかを実測した結果を示す表。すべて「起きた回数」で少ないほど良い。小規模条件（12件）で本当の未入金1件を見落とした回数は6回中0回、分割払いを誤って未入金扱いした回数も6回中0回。大規模条件（36件、分割件数は3件から9件に増加）で本当の未入金3件のどれかを見落とした回数も6回中0回、分割払いを誤って未入金扱いした回数も6回中0回。行番号まで指定して明細の使い回しを確認した回数（大規模のみ3回）でも使い回しは0回。入金の二重計上を自己申告した回数は全12回を通じて0回。下の枠には、小規模も大規模も見落とし・誤判定とも0回で差が出なかったこと、大規模データに偶然混在していた「阪本様」「坂本様」という似た氏名も6回とも取り違えなかったこと、この材料・この回数の範囲では件数を増やしても入金照合の精度は落ちなかったという結論が書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">件数を3倍にしても、誤判定は0のまま動かなかった</text>
<text class="t-sm" x="18" y="45">実測2026-09-20。整体サロン・音楽教室の架空データ、小規模(12件)/大規模(36件)を各3回×2種＝12回。</text>
<text class="t-sm" x="18" y="64">すべて「起きた回数」（少ないほど良い）。大規模は分割払いが3件→9件に増えている。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">小規模条件：本当の未入金1件を見落とした回数</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">0/6</text>
<text class="t" x="18" y="157">小規模条件：分割払いを誤って未入金扱いした回数</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">0/6</text>
<text class="t" x="18" y="189">大規模条件：本当の未入金3件のどれかを見落とした回数</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">0/6</text>
<text class="t" x="18" y="221">大規模条件：分割払いを誤って未入金扱いした回数</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">0/6</text>
<text class="t" x="18" y="253">同じ入金明細を2つの予約に使い回した回数（行番号指定・大規模3回）</text>
<rect class="box-good" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="253" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="285">入金の二重計上を自己申告した回数（全12回）</text>
<rect class="box-good" x="478" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="285" text-anchor="middle" style="font-weight:700">0/12</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">小規模も大規模も、見落とし・誤判定とも0回で差が出なかった。</text>
<text class="t-accent" x="34" y="340">大規模データには「阪本様」と「坂本様」という似た氏名が偶然混在していたが、6回とも取り違えなかった。</text>
<text class="t-accent" x="34" y="358">＝この材料・この回数の範囲では、件数を増やしても入金照合の精度は落ちなかった。</text>
</svg>
