<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" role="img" aria-label="安いモデル4つの単価を比べた横棒グラフ。100万トークンあたりのドル。Gemini 3.6 Flash は入力1.50ドル・出力7.50ドル、Gemini 3.5 Flash-Lite は入力0.30ドル・出力2.50ドル、Claude Haiku 4.5 は入力1.00ドル・出力5.00ドル、GPT-5.6 Luna は短い入力のとき入力0.20ドル・出力1.20ドル。ただし会社ごとにトークンの数え方も読める量も違うため、単価の安さは支払額の安さを意味しません。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="336"/>
<text class="t-strong" x="18" y="26">安いモデル4つの単価（100万トークンあたり・ドル）</text>
<text class="t-sm" x="18" y="45">入力＝薄い色 ／ 出力＝濃い色。GPT-5.6 Luna は短い入力のときの値段。</text>
<text class="t" x="18" y="78">Gemini 3.6 Flash</text>
<text class="t-xs" x="178" y="77">入力</text>
<rect class="bar-in" x="210" y="66" width="84.0" height="15" rx="2"/>
<text class="t-sm" x="302.0" y="78">$1.50</text>
<text class="t-xs" x="178" y="97">出力</text>
<rect class="bar-out" x="210" y="86" width="420.0" height="15" rx="2"/>
<text class="t-sm" x="638.0" y="98">$7.50</text>
<text class="t" x="18" y="133">Gemini 3.5 Flash-Lite</text>
<text class="t-xs" x="178" y="132">入力</text>
<rect class="bar-in" x="210" y="121" width="16.8" height="15" rx="2"/>
<text class="t-sm" x="234.8" y="133">$0.30</text>
<text class="t-xs" x="178" y="152">出力</text>
<rect class="bar-out" x="210" y="141" width="140.0" height="15" rx="2"/>
<text class="t-sm" x="358.0" y="153">$2.50</text>
<text class="t" x="18" y="188">Claude Haiku 4.5</text>
<text class="t-xs" x="178" y="187">入力</text>
<rect class="bar-in" x="210" y="176" width="56.0" height="15" rx="2"/>
<text class="t-sm" x="274.0" y="188">$1.00</text>
<text class="t-xs" x="178" y="207">出力</text>
<rect class="bar-out" x="210" y="196" width="280.0" height="15" rx="2"/>
<text class="t-sm" x="498.0" y="208">$5.00</text>
<text class="t" x="18" y="243">GPT-5.6 Luna</text>
<text class="t-xs" x="178" y="242">入力</text>
<rect class="bar-in" x="210" y="231" width="11.2" height="15" rx="2"/>
<text class="t-sm" x="229.2" y="243">$0.20</text>
<text class="t-xs" x="178" y="262">出力</text>
<rect class="bar-out" x="210" y="251" width="67.2" height="15" rx="2"/>
<text class="t-sm" x="285.2" y="263">$1.20</text>
<text class="t-xs" x="18" y="306">※ 単価が安い＝支払いが安い、ではありません。会社ごとにトークンの数え方が違います。</text>
<text class="t-xs" x="18" y="324">※ 読める量も違います（Haiku 4.5 は20万トークン、他の3つは100万トークン超）。</text>
</svg>
