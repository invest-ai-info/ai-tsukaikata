<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-label="読める長さ（コンテキスト）と埋め込みの次元を3社の公式ページの数字で比べた横棒グラフ。読める長さ＝EmbeddingGemma 2は8,192トークン、text-embedding-3-large（OpenAI）も同じ8,192トークン、voyage-multimodal-3.5（Anthropicが紹介）は32,000トークンで最大。埋め込みの次元（既定値）＝EmbeddingGemma 2は768次元、text-embedding-3-largeは3,072次元、voyage-multimodal-3.5は1,024次元。いずれも各社公式ページに書かれている仕様の数字で、自社測定の性能テストの点数ではない。3モデルとも、MRL（Matryoshka Representation Learning）で実行時に次元を切り詰められる仕組みを持つ。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="364"/>
<text class="t-strong" x="18" y="26">読める長さはOpenAIと同じ8,192トークン、次元はOpenAIの4分の1</text>
<text class="t-sm" x="18" y="45">数値は各社の公式ページに書かれている仕様（性能テストの点数ではない）。</text>
<text class="t-sm" x="18" y="64">voyage-multimodal-3.5は、Anthropicが公式ドキュメントで紹介している埋め込みモデル。</text>
<text class="t-accent" x="18" y="96">読める長さ（コンテキスト・トークン）</text>
<text class="t-sm" x="18" y="129">EmbeddingGemma 2</text>
<rect class="box-accent" x="228" y="116" width="85.0" height="16" rx="2"/>
<text class="t-sm" x="321.0" y="129">8,192トークン</text>
<text class="t-sm" x="18" y="157">text-embedding-3-large</text>
<rect class="box-quiet" x="228" y="144" width="85.0" height="16" rx="2"/>
<text class="t-sm" x="321.0" y="157">8,192トークン</text>
<text class="t-sm" x="18" y="185">voyage-multimodal-3.5</text>
<rect class="box-quiet" x="228" y="172" width="332.0" height="16" rx="2"/>
<text class="t-sm" x="568.0" y="185">32,000トークン</text>
<text class="t-accent" x="18" y="220">埋め込みの次元（既定値）</text>
<text class="t-sm" x="18" y="253">EmbeddingGemma 2</text>
<rect class="box-accent" x="228" y="240" width="83.0" height="16" rx="2"/>
<text class="t-sm" x="319.0" y="253">768次元</text>
<text class="t-sm" x="18" y="281">text-embedding-3-large</text>
<rect class="box-quiet" x="228" y="268" width="332.0" height="16" rx="2"/>
<text class="t-sm" x="568.0" y="281">3,072次元</text>
<text class="t-sm" x="18" y="309">voyage-multimodal-3.5</text>
<rect class="box-quiet" x="228" y="296" width="110.7" height="16" rx="2"/>
<text class="t-sm" x="346.7" y="309">1,024次元</text>
<text class="t-xs" x="18" y="340">※ 3モデルとも、MRL（Matryoshka）で実行時に次元を切り詰められる仕組みを持つ。</text>
</svg>
