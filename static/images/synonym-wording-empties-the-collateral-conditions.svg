<svg xmlns="http://www.w3.org/2000/svg" width="720" height="444" viewBox="0 0 720 444" role="img" aria-label="工程2の確認指示に足す対策の言い方を変えたとき、健全な5件だけの条件・誤りを1件混ぜた6件の条件・紛らわしい語を1件混ぜた6件の条件で、正しく処理できた回数を比べたマス目。前の記事の「除外の基準を固定する（語そのものの有無）」対策は、健全5件で材料2本×各2回=4回中0回しか正しく処理できなかった。今回、同じ対策を「〜に限らず、同じ意味を持つ表現（類義語・言い換え）も含めて」に言い換えると、健全5件は4回中4回に上がった。誤り混入6件は前の記事も今回も4回中4回のまま。今回新しく試した、急ぎではない依頼を紛らわしい語で混ぜた6件でも4回中4回で、言い換えが緩みすぎて余計なものまで拾う様子は無かった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="444"/>
<text class="t-strong" x="18" y="26">言い換えると、健全5件の巻き添えが0/4→4/4に変わった</text>
<text class="t-sm" x="18" y="45">架空の問い合わせを2本、独立したAIの新規プロセスで各2回ずつ実行した（材料2本×各2回=4回）。</text>
<text class="t-sm" x="18" y="64">変えたのは「〜のように」を「〜に限らず、同じ意味を持つ表現も含めて」に言い換えた一点だけ。</text>
<text class="t-xs" x="18" y="83">数字は、正しい項目を1件も巻き込まず・見逃さず処理できた回数。生の回答は docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="171">前の記事＝基準を固定（健全5件）</text>
<rect class="box-bad" x="288" y="150" width="170" height="32" rx="4"/>
<text class="t-bad" x="328.0" y="171">0/4 正しく処理</text>
<text class="t-sm" x="18" y="213">今回＝類義語も含める（健全5件）</text>
<rect class="box-good" x="288" y="192" width="170" height="32" rx="4"/>
<text class="t-good" x="328.0" y="213">4/4 正しく処理</text>
<text class="t-sm" x="18" y="255">前の記事＝基準を固定（誤り混入6件）</text>
<rect class="box-good" x="288" y="234" width="170" height="32" rx="4"/>
<text class="t-good" x="328.0" y="255">4/4 正しく処理</text>
<text class="t-sm" x="18" y="297">今回＝類義語も含める（誤り混入6件）</text>
<rect class="box-good" x="288" y="276" width="170" height="32" rx="4"/>
<text class="t-good" x="328.0" y="297">4/4 正しく処理</text>
<text class="t-sm" x="18" y="339">今回＝類義語も含める（紛らわしい語混入6件）</text>
<rect class="box-good" x="288" y="318" width="170" height="32" rx="4"/>
<text class="t-good" x="328.0" y="339">4/4 正しく処理</text>
<rect class="box-quiet" x="18" y="364" width="678" height="56" rx="6"/>
<text class="t-strong" x="34" y="386">巻き添えが消えたのは、基準を狭めたからではなく緩めたから。</text>
<text class="t-sm" x="34" y="404">誤り検出と、新しく試した紛らわしい語の除外は、どちらも崩れなかった。</text>
</svg>
