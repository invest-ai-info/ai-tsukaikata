<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="長文・創作的な文章でAI文体チェックリストを使ったとき、人間の文章を誤って「AIらしい」と判定した回数を示す表。単体で見せた場合は4回中0回、本物のAI文章と比べた場合は4回中0回、人間どうしを比べた場合は2回中1回、「無理に選ばなくてよい」を足した場合は2回中0回だった。下の枠には、AI文章が材料に無いときでも2択で比べさせると誤って一方を選ぶことがあること、一文を足すと誤判定が消えたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">人間どうしを比べさせると、AI文章が無くても誤判定が出た</text>
<text class="t-sm" x="18" y="45">実測2026-11-19。長文の架空エッセイ2本（人間執筆）とAIが書いた長文1本にチェックリストを当てた。</text>
<text class="t-sm" x="18" y="64">単体・本物のAI文と比べた場合は誤判定0回。人間どうしの比較だけ2回中1回、一方を誤って選んだ。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">単体で見せた場合（人間の文章4回）</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="157">本物のAI文章と比べた場合（人間側4回）</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="189">人間どうしを比べた場合（AI文章なし）</text>
<rect class="box-bad" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="189" text-anchor="middle" style="font-weight:700">1/2</text>
<text class="t" x="18" y="221">人間どうしの比較＋「無理に選ばなくてよい」</text>
<rect class="box-good" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="221" text-anchor="middle" style="font-weight:700">0/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">AI文章が材料に無いときでも、2択で比べさせると一方を「よりAIらしい」と誤って選ぶことがある。</text>
<text class="t-accent" x="34" y="276">「どちらも人間の可能性がある場合は無理に選ばないでください」と一文足すと誤判定は消えた。</text>
</svg>
