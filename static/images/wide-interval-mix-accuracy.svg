<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="窓の幅を変えても、正解はいつも5件中3件のままであることを示す横棒グラフ。窓＝直近10回は3/5、窓＝直近20回は3/5、窓＝直近35回は3/5。数字を使わず「判定してください」と頼んだ版は1回目5/5・2回目2/5。下の枠には、固定窓は3種類とも5件中3件で変わらず5件全部が正解になる幅は見つからなかったこと、あいまいに判定してくださいと頼む版は同じ指示文のまま1回目5/5・2回目2/5と結果が割れたこと、2回目はどの固定窓よりも正解数が少なかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">窓の幅を変えても、正解はいつも5件中3件のまま</text>
<text class="t-sm" x="18" y="45">更新間隔1日・15日・30日の相手5件を混ぜた架空ログ（60日分）で、5種の頼み方を比べた。</text>
<text class="t-sm" x="18" y="64">固定の窓は幅を10・20・35回のどれにしても3/5。あいまいに頼むと1回目5/5・2回目2/5と割れた。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">窓＝直近10回（点検51〜60）</text>
<rect class="box" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="125" text-anchor="middle" style="font-weight:700">3/5</text>
<text class="t" x="18" y="157">窓＝直近20回（点検41〜60）</text>
<rect class="box" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="157" text-anchor="middle" style="font-weight:700">3/5</text>
<text class="t" x="18" y="189">窓＝直近35回（点検26〜60）</text>
<rect class="box" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="189" text-anchor="middle" style="font-weight:700">3/5</text>
<text class="t" x="18" y="221">数字を使わず「判定してください」（1回目）</text>
<rect class="box-good" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="221" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="253">数字を使わず「判定してください」（2回目）</text>
<rect class="box" x="398" y="232" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="253" text-anchor="middle" style="font-weight:700">2/5</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">固定窓は3種類とも5件中3件で変わらず、5件全部が正解になる幅は見つからなかった。</text>
<text class="t-accent" x="34" y="308">あいまいに判定してくださいと頼む版は、同じ指示文のまま1回目5/5・2回目2/5と結果が割れた。</text>
<text class="t-accent" x="34" y="326">2回目は、どの固定窓よりも正解数が少なかった（2/5＜3/5）。</text>
</svg>
