<svg xmlns="http://www.w3.org/2000/svg" width="720" height="478" viewBox="0 0 720 478" role="img" aria-label="出題された条を、頼み方2種類で比べた図。「10問作って」と頼むと、第1条2問・第2条3問・第3条2問・第4条2問・第5条1問と前半に集まり、第6条（差戻し）と第7条（私的利用）は0問で出題されなかった。「条ごとに最低1問ずつ」と指定すると、第1条から第7条まですべて1問ずつ出題された。落ちた2条は差し戻し後の再申請期限と私的利用が混ざったときの扱いで、実務で一番困る側から落ちている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="478"/>
<text class="t-strong" x="18" y="26">「10問作って」だと、後ろの2条から1問も出なかった</text>
<text class="t-sm" x="18" y="45">架空の規程7条に対する実測。同じ教材・同じ相手で、頼み方だけを変えた。</text>
<text class="t-xs" x="184" y="80">「10問作って」</text>
<text class="t-xs" x="382" y="80">「条ごとに最低1問ずつ」</text>
<text class="t-sm" x="18" y="117">第1条 申請期限</text>
<rect class="box-quiet" x="184" y="92" width="68" height="40" rx="6"/>
<text class="t" x="210" y="117">2</text>
<rect class="box-good" x="382" y="92" width="34" height="40" rx="6"/>
<text class="t-good" x="391" y="117">1</text>
<text class="t-sm" x="18" y="167">第2条 領収書</text>
<rect class="box-quiet" x="184" y="142" width="102" height="40" rx="6"/>
<text class="t" x="227" y="167">3</text>
<rect class="box-good" x="382" y="142" width="34" height="40" rx="6"/>
<text class="t-good" x="391" y="167">1</text>
<text class="t-sm" x="18" y="217">第3条 会議費</text>
<rect class="box-quiet" x="184" y="192" width="68" height="40" rx="6"/>
<text class="t" x="210" y="217">2</text>
<rect class="box-good" x="382" y="192" width="34" height="40" rx="6"/>
<text class="t-good" x="391" y="217">1</text>
<text class="t-sm" x="18" y="267">第4条 出張日当</text>
<rect class="box-quiet" x="184" y="242" width="68" height="40" rx="6"/>
<text class="t" x="210" y="267">2</text>
<rect class="box-good" x="382" y="242" width="34" height="40" rx="6"/>
<text class="t-good" x="391" y="267">1</text>
<text class="t-sm" x="18" y="317">第5条 前払金</text>
<rect class="box-quiet" x="184" y="292" width="34" height="40" rx="6"/>
<text class="t" x="193" y="317">1</text>
<rect class="box-good" x="382" y="292" width="34" height="40" rx="6"/>
<text class="t-good" x="391" y="317">1</text>
<text class="t-sm" x="18" y="367">第6条 差戻し</text>
<rect class="box-bad" x="184" y="342" width="102" height="40" rx="6"/>
<text class="t-bad" x="198" y="367">0問（出題なし）</text>
<rect class="box-good" x="382" y="342" width="34" height="40" rx="6"/>
<text class="t-good" x="391" y="367">1</text>
<text class="t-sm" x="18" y="417">第7条 私的利用</text>
<rect class="box-bad" x="184" y="392" width="102" height="40" rx="6"/>
<text class="t-bad" x="198" y="417">0問（出題なし）</text>
<rect class="box-good" x="382" y="392" width="34" height="40" rx="6"/>
<text class="t-good" x="391" y="417">1</text>
<text class="t-xs" x="18" y="464">※ 落ちた2条は、差し戻し後の再申請期限と、私的利用が混ざったときの扱い。実務で一番困る側から落ちている。</text>
</svg>
