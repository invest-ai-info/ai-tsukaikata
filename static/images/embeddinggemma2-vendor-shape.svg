<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="埋め込みモデルの提供形態を3社で比べた表。提供形態＝Googleは重みを無料公開して自分の環境で動かす、OpenAIは有料のAPI（従量課金）、Anthropicは自社モデルが無くVoyage AIを紹介。テキストの単価（100万トークン）＝Googleは無料（計算は自己負担）、OpenAIは$0.02〜$0.13、Anthropic（Voyage AI）は確認できず（経路遮断）。対応モダリティ＝Googleはテキスト・画像・動画・音声、OpenAIはテキストのみ、Anthropic（Voyage AI）はテキスト・画像・動画（音声には対応していない）。Voyage AI自身の料金ページは、この記事を書いた環境からは経路遮断（CONNECT tunnel failed）で到達できなかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">無料の重みと、2種類の有料APIが並ぶ——単価の土台がそもそも違う</text>
<text class="t-sm" x="18" y="45">各社の公式ページ（発表・ドキュメント・料金ページ）に書かれている範囲だけを並べた。</text>
<text class="t-sm" x="18" y="64">AnthropicはEmbeddingsページで「自社の埋め込みモデルは無い」と明記し、Voyage AIを紹介している。</text>
<text class="t-sm" x="18" y="83">Voyage AI自身の料金ページは、この記事を書いた環境からは経路遮断で到達できなかった。</text>
<text class="t-accent" x="171.0" y="136">Google</text>
<text class="t-accent" x="352.7" y="136">OpenAI</text>
<text class="t-accent" x="534.3" y="136">Anthropic</text>
<text class="t-sm" x="18" y="168">提供形態</text>
<rect class="box-accent" x="163.0" y="150" width="175.7" height="46" rx="4"/>
<text class="t-accent" x="171.0" y="168">重みを無料公開</text>
<text class="t-accent" x="171.0" y="184">自分の環境で動かす</text>
<rect class="box-quiet" x="344.7" y="150" width="175.7" height="46" rx="4"/>
<text class="t-sm" x="352.7" y="168">有料のAPI</text>
<text class="t-sm" x="352.7" y="184">（従量課金）</text>
<rect class="box-quiet" x="526.3" y="150" width="175.7" height="46" rx="4"/>
<text class="t-sm" x="534.3" y="168">自社モデルなし</text>
<text class="t-sm" x="534.3" y="184">Voyage AIを紹介</text>
<text class="t-sm" x="18" y="226">テキストの単価</text>
<text class="t-sm" x="18" y="242">（100万トークン）</text>
<rect class="box-accent" x="163.0" y="208" width="175.7" height="46" rx="4"/>
<text class="t-accent" x="171.0" y="226">無料</text>
<text class="t-accent" x="171.0" y="242">（計算は自己負担）</text>
<rect class="box-quiet" x="344.7" y="208" width="175.7" height="46" rx="4"/>
<text class="t-sm" x="352.7" y="226">$0.02〜$0.13</text>
<rect class="box-quiet" x="526.3" y="208" width="175.7" height="46" rx="4"/>
<text class="t-sm" x="534.3" y="226">確認できず</text>
<text class="t-sm" x="534.3" y="242">（経路遮断）</text>
<text class="t-sm" x="18" y="284">対応モダリティ</text>
<rect class="box-accent" x="163.0" y="266" width="175.7" height="46" rx="4"/>
<text class="t-accent" x="171.0" y="284">テキスト・画像・</text>
<text class="t-accent" x="171.0" y="300">動画・音声</text>
<rect class="box-quiet" x="344.7" y="266" width="175.7" height="46" rx="4"/>
<text class="t-sm" x="352.7" y="284">テキストのみ</text>
<rect class="box-quiet" x="526.3" y="266" width="175.7" height="46" rx="4"/>
<text class="t-sm" x="534.3" y="284">テキスト・画像・</text>
<text class="t-sm" x="534.3" y="300">動画（音声なし）</text>
<text class="t-xs" x="18" y="342">※「確認できず」は機能や価格が無いのではなく、公式の料金ページに到達できなかった意味。</text>
</svg>
