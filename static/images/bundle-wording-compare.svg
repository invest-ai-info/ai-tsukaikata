<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" role="img" aria-label="崩れた元記事の出品文言と、崩れなかった材料M・Nの出品文言を並べた図。元記事（6回中2回・月額と誤判定）は「運用代行3ヶ月パック（一括支払い・月あたり10,000円相当）」で赤、材料M（3回中0回・誤判定なし）は「まとめ割プラン（一括支払い）。複数回分をまとめてご依頼いただくと、通常よりお得に」で緑、材料N（3回中0回・誤判定なし）は「セット料金。記事4本分をまとめてご依頼いただけます（まとめてご依頼いただくとお得です）」で緑。下の枠には、月数そのものは書かなくても「まとめて」という言葉だけで複数の意味は伝わっていたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="336"/>
<text class="t-strong" x="18" y="26">「月あたり◯円相当」という数字が、むしろ月額と混同されやすかった</text>
<text class="t-sm" x="18" y="45">崩れた元記事の文言と、崩れなかった材料M・Nの文言を並べた（いずれも価格は本文内の一部）。</text>
<text class="t-sm" x="18" y="64">共通点は「複数回分をまとめて」という言葉。元記事だけに「月あたり10,000円相当」という数字がある。</text>
<rect class="box-bad" x="18" y="96" width="684" height="48" rx="6"/>
<text class="t-strong" x="34" y="116">元記事（6回中2回・月額と誤判定）</text>
<text class="t-bad" x="34" y="136">「運用代行3ヶ月パック（一括支払い・月あたり10,000円相当）」</text>
<rect class="box-good" x="18" y="154" width="684" height="48" rx="6"/>
<text class="t-strong" x="34" y="174">材料M（3回中0回・誤判定なし）</text>
<text class="t-good" x="34" y="194">「まとめ割プラン（一括支払い）。複数回分をまとめてご依頼いただくと、通常よりお得に」</text>
<rect class="box-good" x="18" y="212" width="684" height="48" rx="6"/>
<text class="t-strong" x="34" y="232">材料N（3回中0回・誤判定なし）</text>
<text class="t-good" x="34" y="252">「セット料金。記事4本分をまとめてご依頼いただけます（まとめてご依頼いただくとお得です）」</text>
<rect class="box-accent" x="18" y="276" width="684" height="40" rx="6"/>
<text class="t-accent" x="34" y="301">月数そのものは書かなくても、「まとめて」という言葉だけで複数の意味は伝わっていた。</text>
</svg>
