<svg xmlns="http://www.w3.org/2000/svg" width="720" height="326" viewBox="0 0 720 326" role="img" aria-label="SWOTの4マスのうち、材料にあるのは強み・弱みの2マスだけであることを示す図。左列（内部要因・材料あり）は、強み＝創業52年・地元産ゆず最中餡・実演販売で週末完売（緑）、弱み＝30代以下の認知65%が未認知・自社EC無し（緑）。右列（外部要因・材料なし）は、機会と脅威のどちらも材料が無く、素朴に頼むと作り話で埋まり、要確認と指定すると「要確認」のまま扱われる（グレー）。下の枠には、右側の2マスは同じ材料が無い状態なのに頼み方しだいで中身がまったく変わったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="326"/>
<text class="t-strong" x="18" y="26">SWOTの4マスのうち、材料にあるのは「強み」「弱み」の2マスだけ</text>
<text class="t-sm" x="18" y="45">「機会」「脅威」は、架空の案件文に一切データを入れていない。</text>
<text class="t-xs" x="18" y="96">内部要因（材料あり）</text>
<text class="t-xs" x="368.0" y="96">外部要因（材料なし）</text>
<rect class="box-good" x="18" y="110" width="334.0" height="70" rx="6"/>
<text class="t-strong" x="32" y="130">強み（S）</text>
<text class="t-good" x="32" y="150" style="font-size:11.5px">創業52年・地元産ゆず最中餡・実演販売で週末完売</text>
<rect class="box-quiet" x="368.0" y="110" width="334.0" height="70" rx="6"/>
<text class="t-strong" x="382.0" y="130">機会（O）</text>
<text class="t" x="382.0" y="150" style="font-size:11.5px">材料なし → 素朴は作り話／指定ありは「要確認」</text>
<rect class="box-good" x="18" y="190" width="334.0" height="70" rx="6"/>
<text class="t-strong" x="32" y="210">弱み（W）</text>
<text class="t-good" x="32" y="230" style="font-size:11.5px">30代以下の認知65%が未認知・自社EC無し</text>
<rect class="box-quiet" x="368.0" y="190" width="334.0" height="70" rx="6"/>
<text class="t-strong" x="382.0" y="210">脅威（T）</text>
<text class="t" x="382.0" y="230" style="font-size:11.5px">材料なし → 素朴は作り話／指定ありは「要確認」</text>
<rect class="box-accent" x="18" y="278" width="684" height="28" rx="6"/>
<text class="t-accent" x="34" y="298">右側の2マスは、同じ「材料が無い」状態なのに、頼み方しだいで中身がまったく変わった。</text>
</svg>
