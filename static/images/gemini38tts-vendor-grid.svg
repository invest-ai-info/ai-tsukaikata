<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="音声合成（TTS）モデルを3社で比べた表。専用のTTSモデル＝Geminiは2機種（Flash TTS / Flash-Lite TTS）、GPTは1機種（GPT-4o Mini TTS）、Claudeは記載なし。自分の声を複製＝Geminiは誰でも申請なしで使える（要30秒の同意録音）、GPTは限定顧客のみで要営業への問い合わせ、Claudeは—。対応言語＝Geminiは130言語（Flash-Liteは101言語）、GPTは明記なし（声は英語向けに最適化）、Claudeは—。出力の単価（100万トークンあたり）＝Geminiは6.00〜9.00ドルで2027年に2倍、GPTは12.00ドルで期限の記載なし、Claudeは—。「記載なし」「—」は機能が無いと明言されているのではなく、公式ページに書かれていない意味。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="400"/>
<text class="t-strong" x="18" y="26">声の複製が申請なしで使えるのは、3社のうちGeminiだけ</text>
<text class="t-sm" x="18" y="45">各社の公式ページ（発表・モデル一覧・料金・ガイド）に書かれている範囲だけを並べた。</text>
<text class="t-sm" x="18" y="64">「記載なし」「—」は機能が無いと明言されているのではなく、公式ページに書かれていない意味。</text>
<text class="t-accent" x="134.0" y="114">Gemini（Google）</text>
<text class="t-accent" x="328.0" y="114">GPT（OpenAI）</text>
<text class="t-accent" x="522.0" y="114">Claude（Anthropic）</text>
<text class="t-sm" x="18" y="148.0">専用のTTSモデル</text>
<rect class="box-accent" x="126.0" y="128" width="188.0" height="52" rx="4"/>
<text class="t-accent" x="134.0" y="148">2機種</text>
<text class="t-accent" x="134.0" y="164">Flash TTS / Flash-Lite TTS</text>
<rect class="box-quiet" x="320.0" y="128" width="188.0" height="52" rx="4"/>
<text class="t-sm" x="328.0" y="148">1機種</text>
<text class="t-sm" x="328.0" y="164">GPT-4o Mini TTS</text>
<rect class="box-bad" x="514.0" y="128" width="188.0" height="52" rx="4"/>
<text class="t-bad" x="522.0" y="148">記載なし</text>
<text class="t-sm" x="18" y="210.0">自分の声を複製</text>
<rect class="box-accent" x="126.0" y="190" width="188.0" height="52" rx="4"/>
<text class="t-accent" x="134.0" y="210">誰でも申請なしで使える</text>
<text class="t-accent" x="134.0" y="226">（要30秒の同意録音）</text>
<rect class="box-quiet" x="320.0" y="190" width="188.0" height="52" rx="4"/>
<text class="t-sm" x="328.0" y="210">限定顧客のみ</text>
<text class="t-sm" x="328.0" y="226">（要営業への問い合わせ）</text>
<rect class="box-bad" x="514.0" y="190" width="188.0" height="52" rx="4"/>
<text class="t-bad" x="522.0" y="210">—</text>
<text class="t-sm" x="18" y="272.0">対応言語</text>
<rect class="box-accent" x="126.0" y="252" width="188.0" height="52" rx="4"/>
<text class="t-accent" x="134.0" y="272">130言語</text>
<text class="t-accent" x="134.0" y="288">Flash-Liteは101言語</text>
<rect class="box-quiet" x="320.0" y="252" width="188.0" height="52" rx="4"/>
<text class="t-sm" x="328.0" y="272">明記なし</text>
<text class="t-sm" x="328.0" y="288">（声は英語向けに最適化）</text>
<rect class="box-bad" x="514.0" y="252" width="188.0" height="52" rx="4"/>
<text class="t-bad" x="522.0" y="272">—</text>
<text class="t-sm" x="18" y="334.0">出力の単価</text>
<text class="t-sm" x="18" y="349.0">（100万トークン）</text>
<rect class="box-accent" x="126.0" y="314" width="188.0" height="52" rx="4"/>
<text class="t-accent" x="134.0" y="334">$6.00〜$9.00</text>
<text class="t-accent" x="134.0" y="350">（2027年に2倍）</text>
<rect class="box-quiet" x="320.0" y="314" width="188.0" height="52" rx="4"/>
<text class="t-sm" x="328.0" y="334">$12.00</text>
<text class="t-sm" x="328.0" y="350">（期限の記載なし）</text>
<rect class="box-bad" x="514.0" y="314" width="188.0" height="52" rx="4"/>
<text class="t-bad" x="522.0" y="334">—</text>
</svg>
