<svg xmlns="http://www.w3.org/2000/svg" width="720" height="444" viewBox="0 0 720 444" role="img" aria-label="4つのAIツールについて、2026年8月10日に各社の公式ページで確認した範囲で、1社しか書いていなかった機能を並べた図。ChatGPT は会議やメモを録音してそのまま要約させること（公式ヘルプに ChatGPT Record の項目がある）。Claude は手元のパソコンのファイルを直接書き換えさせること（ターミナル・VS Code・Slack から動く Claude Code）。Gemini は音楽をつくることと、Gmail やドライブの中身を読ませること（公式のできること一覧に音楽生成と Workspace 連携が並ぶ）。Grok は X（旧Twitter）でいま起きていることを読ませること（同じ会社が X を持っている）。これは他社にできないという意味ではなく、書いていないだけかもしれず、来月には並ぶ。4社とも文章・画像・ウェブ検索・音声はどれもできる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="444"/>
<text class="t-strong" x="18" y="26">4社のうち、1社しか書いていなかったこと</text>
<text class="t-sm" x="18" y="45">2026年8月10日に、各社の公式ページで確認できた範囲です。</text>
<text class="t-sm" x="18" y="64">「他社にはできない」ではありません。書いていないだけかもしれず、来月には並びます。</text>
<rect class="box-accent" x="18" y="96" width="684" height="64" rx="6"/>
<text class="t-strong" x="32" y="122">ChatGPT</text>
<text class="t" x="190" y="122">会議やメモを録音して、そのまま要約させる</text>
<text class="t-sm" x="190" y="144">公式ヘルプに「ChatGPT Record」の項目がある</text>
<rect class="box-accent" x="18" y="172" width="684" height="64" rx="6"/>
<text class="t-strong" x="32" y="198">Claude</text>
<text class="t" x="190" y="198">手元のパソコンのファイルを直接書き換えさせる</text>
<text class="t-sm" x="190" y="220">ターミナル・VS Code・Slack から動く（Claude Code）</text>
<rect class="box-accent" x="18" y="248" width="684" height="64" rx="6"/>
<text class="t-strong" x="32" y="274">Gemini</text>
<text class="t" x="190" y="274">音楽をつくる／Gmail やドライブの中身を読ませる</text>
<text class="t-sm" x="190" y="296">公式の「できること」に音楽生成と Workspace 連携が並ぶ</text>
<rect class="box-accent" x="18" y="324" width="684" height="64" rx="6"/>
<text class="t-strong" x="32" y="350">Grok</text>
<text class="t" x="190" y="350">X（旧Twitter）で、いま起きていることを読ませる</text>
<text class="t-sm" x="190" y="372">同じ会社が X を持っている</text>
<text class="t-xs" x="18" y="432">※ 4社とも、文章・画像・ウェブ検索・音声はどれもできます。違いはその外側に出ます。</text>
</svg>
