</style>
<rect class="bg" x="0" y="0" width="720" height="284"/>
<text class="t-strong" x="18" y="26">AA Index v5.0（総合指標）はCarbonが1位——ただしGoogle自身の表</text>
<text class="t-sm" x="18" y="45">目盛りは0〜100。この比較表を作ったのはGoogleで、他社が自社で測った値ではない。</text>
<text class="t" x="18" y="97">Gemini 4 Carbon</text>
<rect class="bar-new" x="272" y="82" width="205.3" height="20" rx="3"/>
<text class="t-sm" x="485.3" y="97">59</text>
<text class="t" x="18" y="129">Claude Opus 5.5</text>
<rect class="bar-new" x="272" y="114" width="201.8" height="20" rx="3"/>
<text class="t-sm" x="481.8" y="129">58</text>
<text class="t" x="18" y="161">GPT-6 Astra</text>
<rect class="bar-new" x="272" y="146" width="198.4" height="20" rx="3"/>
<text class="t-sm" x="478.4" y="161">57</text>
<text class="t" x="18" y="193">Gemini 4 Argon</text>
