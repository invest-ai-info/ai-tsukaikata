<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" role="img" aria-label="AA Index v5.0（Artificial Analysis Intelligence Index v5.0・総合指標）を5モデルで比べた横棒グラフ。目盛りは0〜100。Gemini 4 Carbonが59で最高、Claude Opus 5.5が58、GPT-6 Astraが57、Gemini 4 Argonが50、Claude Fable 5.1が49。この表を作ったのはGoogleで、他社が自社で測った値ではない。">
<style>
