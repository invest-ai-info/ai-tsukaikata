<text class="t-sm" x="454.0" y="193">50</text>
<text class="t" x="18" y="225">Claude Fable 5.1</text>
<rect class="bar-new" x="272" y="210" width="170.5" height="20" rx="3"/>
<text class="t-sm" x="450.5" y="225">49</text>
<text class="t-xs" x="18" y="260">※ 出典: Gemini 4 Carbon モデルカード（2026年11月10日公開）。</text>
