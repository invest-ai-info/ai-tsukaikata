<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-label="OpenAI と直接契約したときと Amazon Bedrock 経由のときで、同じモデルの単価を比べた横棒グラフ。100万トークンあたりのドル。Daybreak Red の入力は直接12.50ドルに対し AWS 経由が13.75ドル、出力は直接75.00ドルに対し AWS 経由が82.50ドル。Daybreak Blue の入力は直接4.00ドルに対し AWS 経由が5.50ドル、出力は直接20.00ドルに対し AWS 経由が33.00ドル。Red は 1.1倍だが、Blue は入力が 1.375倍・出力が 1.65倍で、上げ幅が揃っていない。倍率は記事側の割り算で、上げ幅が揃わない理由はどちらのページにも書かれていない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="390"/>
<text class="t-strong" x="18" y="26">同じモデルでも、AWS 経由のほうが高くなっています</text>
<text class="t-sm" x="18" y="45">灰色＝OpenAI と直接契約したとき ／ 青＝Amazon Bedrock 経由のとき。</text>
<text class="t-sm" x="18" y="64">100万トークンあたりのドル。どちらも標準（Standard）の値です。</text>
<text class="t-sm" x="18" y="83">Red は短い入力だけ、Blue も短い入力（27.2万トークンまで）の行で揃えています。</text>
<text class="t" x="18" y="108">Daybreak Red の入力</text>
<text class="t-xs" x="228" y="107">直接</text>
<rect class="bar-old" x="262" y="96" width="52.1" height="15" rx="2"/>
<text class="t-sm" x="322.1" y="108">$12.50</text>
<text class="t-xs" x="228" y="127">AWS</text>
<rect class="bar-new" x="262" y="116" width="57.3" height="15" rx="2"/>
<text class="t-sm" x="327.3" y="128">$13.75</text>
<text class="t" x="18" y="165">Daybreak Red の出力</text>
<text class="t-xs" x="228" y="164">直接</text>
<rect class="bar-old" x="262" y="153" width="312.7" height="15" rx="2"/>
<text class="t-sm" x="582.7" y="165">$75.00</text>
<text class="t-xs" x="228" y="184">AWS</text>
<rect class="bar-new" x="262" y="173" width="344.0" height="15" rx="2"/>
<text class="t-sm" x="614.0" y="185">$82.50</text>
<text class="t" x="18" y="222">Daybreak Blue の入力</text>
<text class="t-xs" x="228" y="221">直接</text>
<rect class="bar-old" x="262" y="210" width="16.7" height="15" rx="2"/>
<text class="t-sm" x="286.7" y="222">$4.00</text>
<text class="t-xs" x="228" y="241">AWS</text>
<rect class="bar-new" x="262" y="230" width="22.9" height="15" rx="2"/>
<text class="t-sm" x="292.9" y="242">$5.50</text>
<text class="t" x="18" y="279">Daybreak Blue の出力</text>
<text class="t-xs" x="228" y="278">直接</text>
<rect class="bar-old" x="262" y="267" width="83.4" height="15" rx="2"/>
<text class="t-sm" x="353.4" y="279">$20.00</text>
<text class="t-xs" x="228" y="298">AWS</text>
<rect class="bar-new" x="262" y="287" width="137.6" height="15" rx="2"/>
<text class="t-sm" x="407.6" y="299">$33.00</text>
<text class="t-xs" x="18" y="336">※ Red は 1.1倍。Blue は入力が 1.375倍・出力が 1.65倍。倍率はこの記事の割り算です。</text>
<text class="t-xs" x="18" y="354">※ OpenAI の料金ページには「Sol の割引価格は少なくとも2026年11月21日まで」とあります。</text>
<text class="t-xs" x="18" y="372">※ 上げ幅がなぜ揃っていないのかは、どちらのページにも書かれていません。</text>
</svg>
