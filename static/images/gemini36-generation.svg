<svg xmlns="http://www.w3.org/2000/svg" width="720" height="344" viewBox="0 0 720 344" role="img" aria-label="世代交代で単価がどう動いたかを比べた横棒グラフ。100万トークンあたりのドル。Flash の入力は 3.5 Flash の1.50ドルから 3.6 Flash も1.50ドルで据え置き。Flash の出力は9.00ドルから7.50ドルへ下がった。Flash-Lite の入力（テキスト）は 3.1 Flash-Lite の0.25ドルから 3.5 Flash-Lite の0.30ドルへ上がり、出力は1.50ドルから2.50ドルへ上がった。世代が新しいほど安いとは限らない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="344"/>
<text class="t-strong" x="18" y="26">世代が上がって、下がった単価と上がった単価</text>
<text class="t-sm" x="18" y="45">灰色＝前の世代（3.5 Flash / 3.1 Flash-Lite）、青＝新しい世代。</text>
<text class="t-sm" x="18" y="64">100万トークンあたりのドル。Flash-Lite の入力はテキストの値。</text>
<text class="t" x="18" y="94">Flash の入力</text>
<text class="t-xs" x="180" y="93">前</text>
<rect class="bar-old" x="210" y="82" width="65.0" height="14" rx="2"/>
<text class="t-sm" x="283.0" y="93">$1.50</text>
<text class="t-xs" x="180" y="112">新</text>
<rect class="bar-new" x="210" y="101" width="65.0" height="14" rx="2"/>
<text class="t-sm" x="283.0" y="112">$1.50</text>
<text class="t" x="18" y="147">Flash の出力</text>
<text class="t-xs" x="180" y="146">前</text>
<rect class="bar-old" x="210" y="135" width="390.0" height="14" rx="2"/>
<text class="t-sm" x="608.0" y="146">$9.00</text>
<text class="t-xs" x="180" y="165">新</text>
<rect class="bar-new" x="210" y="154" width="325.0" height="14" rx="2"/>
<text class="t-sm" x="543.0" y="165">$7.50</text>
<text class="t" x="18" y="200">Flash-Lite の入力</text>
<text class="t-xs" x="180" y="199">前</text>
<rect class="bar-old" x="210" y="188" width="10.8" height="14" rx="2"/>
<text class="t-sm" x="228.8" y="199">$0.25</text>
<text class="t-xs" x="180" y="218">新</text>
<rect class="bar-new" x="210" y="207" width="13.0" height="14" rx="2"/>
<text class="t-sm" x="231.0" y="218">$0.30</text>
<text class="t" x="18" y="253">Flash-Lite の出力</text>
<text class="t-xs" x="180" y="252">前</text>
<rect class="bar-old" x="210" y="241" width="65.0" height="14" rx="2"/>
<text class="t-sm" x="283.0" y="252">$1.50</text>
<text class="t-xs" x="180" y="271">新</text>
<rect class="bar-new" x="210" y="260" width="108.3" height="14" rx="2"/>
<text class="t-sm" x="326.3" y="271">$2.50</text>
<text class="t-xs" x="18" y="314">※ Flash は出力が安くなりました。Flash-Lite は入力も出力も高くなっています。</text>
<text class="t-xs" x="18" y="332">※ 世代が新しいほど安い、とは限りません。乗り換える前に自分の使い方で計算してください。</text>
</svg>
