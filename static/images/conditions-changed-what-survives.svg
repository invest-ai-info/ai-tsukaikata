<rect class="bg" x="0" y="0" width="720" height="389"/>
<text class="t-strong" x="18" y="26">取り消した数字は残らない。残るのは「変更があった」という出来事のほう</text>
<text class="t-sm" x="18" y="45">架空の発注書8条件を2本作り、作業計画を出させたあと、2往復目で3件（分量・納期・修正回数）を取り消して差し替えた。</text>
<text class="t-sm" x="18" y="64">そのあと条件に一切触れない依頼を3往復はさんでから、もう一度おなじ作業計画を作らせている。</text>
<text class="t-sm" x="18" y="83">1つの版につき、材料2本 × 各2回 ＝ 4会話。左と中の分母は 3項目 × 4回 ＝ 12。</text>
<text class="t-sm" x="18" y="102">※ 材料には金額・単価・報酬の記載が1文字もない（走らせる前にコードで確認）。</text>
<text class="t-xs" x="406" y="102" text-anchor="middle">取り消した値が</text>
<text class="t-xs" x="406" y="115" text-anchor="middle">残った</text>
<text class="t-xs" x="528" y="102" text-anchor="middle">新しい値が</text>
<text class="t-xs" x="528" y="115" text-anchor="middle">入った</text>
<text class="t-xs" x="650" y="102" text-anchor="middle">頼んでいない</text>
<text class="t-xs" x="650" y="115" text-anchor="middle">金額の話</text>
<text class="t" x="18" y="146">変更をそのまま伝えて作り直させる</text>
<rect class="box-good" x="369" y="132" width="74" height="19" rx="4"/>
<text class="t-good" x="406" y="146" text-anchor="middle">0 / 12</text>
<rect class="box-good" x="491" y="132" width="74" height="19" rx="4"/>
<text class="t-good" x="528" y="146" text-anchor="middle">12 / 12</text>
<rect class="box-bad" x="613" y="132" width="74" height="19" rx="4"/>
<text class="t-bad" x="650" y="146" text-anchor="middle">9 行</text>
<text class="t" x="18" y="182">＋「古い条件は使わないでください」</text>
<rect class="box-good" x="369" y="168" width="74" height="19" rx="4"/>
<text class="t-good" x="406" y="182" text-anchor="middle">0 / 12</text>
<rect class="box-good" x="491" y="168" width="74" height="19" rx="4"/>
<text class="t-good" x="528" y="182" text-anchor="middle">12 / 12</text>
<rect class="box-bad" x="613" y="168" width="74" height="19" rx="4"/>
<text class="t-bad" x="650" y="182" text-anchor="middle">5 行</text>
<text class="t" x="18" y="218">＋作り直す前に、いまの条件を書き出させる</text>
<rect class="box-good" x="369" y="204" width="74" height="19" rx="4"/>
<text class="t-good" x="406" y="218" text-anchor="middle">0 / 12</text>
<rect class="box-good" x="491" y="204" width="74" height="19" rx="4"/>
<text class="t-good" x="528" y="218" text-anchor="middle">12 / 12</text>
<rect class="box-good" x="613" y="204" width="74" height="19" rx="4"/>
<text class="t-good" x="650" y="218" text-anchor="middle">0 行</text>
<text class="t" x="18" y="254">新しい会話に、書き換えた条件表を貼り直す</text>
<rect class="box-good" x="369" y="240" width="74" height="19" rx="4"/>
<text class="t-good" x="406" y="254" text-anchor="middle">0 / 12</text>
<rect class="box-good" x="491" y="240" width="74" height="19" rx="4"/>
<text class="t-good" x="528" y="254" text-anchor="middle">12 / 12</text>
<rect class="box-good" x="613" y="240" width="74" height="19" rx="4"/>
<text class="t-good" x="650" y="254" text-anchor="middle">0 行</text>
<text class="t-good" x="18" y="284">※ 左は16会話・48項目とも0。変更の直後でも0/36。触っていない5条件も79/80そのまま残った。</text>
<text class="t-bad" x="18" y="305">※ 右は「金額の語」と「決めてください・ご提示ください」が同じ行にある数。材料に金額は無い。</text>
<text class="t-bad" x="18" y="326">　 1行目には「条件変更を受け入れた直後は、交渉がいちばん通りやすいタイミングです」まで入る。</text>
<text class="t-good" x="18" y="347">※ 会話を新しくすると0行。値のためではなく、変更というできごとを持ち越さないために効く。</text>
<text class="t-xs" x="18" y="368">架空データでの実測（16会話・のべ76ターン）。生の返りと判定コードは docs/evidence/ に全文置いてある。</text>
</svg>
