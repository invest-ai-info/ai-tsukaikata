<svg xmlns="http://www.w3.org/2000/svg" width="720" height="389" viewBox="0 0 720 389" role="img" aria-label="副業案件の条件を会話の途中で取り消して差し替えたあと、何が残り何が増えるかを、頼み方4通りで並べた表。架空の発注書8条件を2本作り、まず作業計画を出させ、2往復目で分量・納期・修正回数の3件を取り消して新しい値に差し替え、そのあと条件に一切触れない依頼を3往復はさんでから、もう一度おなじ作業計画を作らせた。1つの版につき材料2本かける各2回で4会話ずつ。左の列は、取り消した3件が今使う値として成果物に残った項目数で、分母は3項目かける4回の12。中の列は、新しい値が入った項目数。右の列は、材料に1文字も書かれていない金額の話が、決めてくださいという依頼つきで出た行の数で、4会話の合計。変更をそのまま伝えて作り直させた版は、取り消した値が0、新しい値が12、金額の話が9行。古い条件は使わないでくださいと足した版は、0と12と5行。作り直す前に今の条件を書き出させた版は、0と12と0行。新しい会話に書き換えた条件表を貼り直した版は、0と12と0行。つまり、取り消した数字が残る事故は4版とも一度も起きず、版によって変わったのは、頼んでいない金額の話が付くかどうかだけだった。">
<style>
