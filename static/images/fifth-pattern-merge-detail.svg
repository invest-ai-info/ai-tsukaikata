<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-label="材料Bの素朴な頼み方の1回目と2回目を並べた図。1回目は見出しが「文末表現が不自然に連続している箇所は5か所です」と正しく宣言し、本文も①②③④⑤の5項目に分かれていて、④次第です・⑤ということになります も別の項目になっている（緑）。2回目は見出しが「不自然な文末の連続は、以下の4か所です」となり、本文は①②③の3項目に、④として「次第です」「ということになります」の2つの文末表現を1項目にまとめている（赤）。どちらの回も15文はすべて本文のどこかに入っているが、2回目は項目の数として4つに減って見える。下の枠には、この統合は2つの文末表現が『これから〜することが決まっている』という同じ告知の言い回しだから起きたこと、文章そのものは消えておらず見出しの数字と項目の数だけがまとめた分だけ減っていることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="364"/>
<text class="t-strong" x="18" y="26">同じ材料・同じ指示文でも、2つの項目がまとまる回がある</text>
<text class="t-sm" x="18" y="45">左（1回目）は5グループを別々に数えた。右（2回目）は④で2つの文末表現をまとめた。</text>
<text class="t-strong" x="18" y="114">1回目</text>
<text class="t-strong" x="368.0" y="114">2回目</text>
<rect class="box-good" x="18" y="122" width="334.0" height="48" rx="5"/>
<text class="t-good" x="32" y="142" style="font-size:11.5px">見出し「5か所です」と正しく宣言</text>
<rect class="box-bad" x="368.0" y="122" width="334.0" height="48" rx="5"/>
<text class="t-bad" x="382.0" y="142" style="font-size:11.5px">見出し「以下の4か所です」</text>
<rect class="box-good" x="18" y="178" width="334.0" height="48" rx="5"/>
<text class="t-good" x="32" y="198" style="font-size:11.5px">①〜⑤の5項目。④⑤は別々のまま</text>
<rect class="box-bad" x="368.0" y="178" width="334.0" height="48" rx="5"/>
<text class="t-bad" x="382.0" y="198" style="font-size:11.5px">①〜③の3項目。④に2表現を統合</text>
<rect class="box-good" x="18" y="234" width="334.0" height="48" rx="5"/>
<text class="t-good" x="32" y="254" style="font-size:11.5px">15文は5項目のどれかに入る</text>
<rect class="box-bad" x="368.0" y="234" width="334.0" height="48" rx="5"/>
<text class="t-bad" x="382.0" y="254" style="font-size:11.5px">15文は残るが項目は4つに減る</text>
<rect class="box-accent" x="18" y="298" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="318">⚠️ 右の統合は、2つの文末表現が『これから〜することが決まっている』という同じ告知の言い回しだから起きた。</text>
<text class="t-accent" x="34" y="336">⚠️ 文章そのものは消えていない。見出しの数字と項目の数だけが、まとめた分だけ減っている。</text>
</svg>
