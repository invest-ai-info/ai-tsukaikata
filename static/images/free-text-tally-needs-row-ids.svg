  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="554"/>
<text class="t-strong" x="18" y="26">同じ24件を、頼み方を変えて分類すると件数がこう動く</text>
<text class="t-sm" x="18" y="45">材料は使いやすさ・価格・精度・サポート対応・機能要望に触れる回答20件＋空欄や意見なしの回答4件（うち1件は本当の空欄）。</text>
<text class="t-sm" x="18" y="64">価格と精度の両方に触れる回答が2件あり、複数カテゴリを許す版ではその2件を両方に数えている。</text>
<text class="t-xs" x="212" y="126">IDなし</text>
<text class="t-xs" x="212" y="139">素朴</text>
<text class="t-xs" x="338" y="126">ID付き</text>
<text class="t-xs" x="338" y="139">素朴</text>
<text class="t-xs" x="464" y="126">ID付き+分類不能可</text>
<text class="t-xs" x="590" y="126">強制1つ+自己検算</text>
<text class="t" x="18" y="165" style="font-size:12px">使いやすさ</text>
