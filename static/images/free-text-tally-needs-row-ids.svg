<text class="t-bad" x="18" y="472">※ IDなし・素朴は、本当に空欄の1件が貼った時点で消えて23件になった（2回とも再現）。</text>
<text class="t-bad" x="18" y="492">※ 強制1つ+自己検算は、合計こそ24件できれいに合うが、空欄など4件が「使いやすさ」に紛れたまま。</text>
<text class="t-xs" x="18" y="512">※ 24件※＝複数カテゴリの2件を両方に数えると延べ26件（24件の内訳として正しく数え直せる）。</text>
<text class="t-xs" x="18" y="532">架空のアンケート自由記述24件での実測。生の返りは docs/evidence/ に全文置いてある。</text>
