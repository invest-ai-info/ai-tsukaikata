<svg xmlns="http://www.w3.org/2000/svg" width="720" height="554" viewBox="0 0 720 554" role="img" aria-label="アンケート自由記述24件を4通りの頼み方で分類したときの、分類ごとの件数を比べた図。IDを付けずに素朴に分類を頼むと、本当の空欄1件が貼った時点で消えて入力が23件になった。IDを付けて同じ素朴な頼み方をすると24件全部が数えられ、使いやすさ4・価格6・精度6・サポート対応3・機能要望3・分類対象外4で、2回とも同じ結果だった。IDを付けて複数カテゴリと分類不能を許す頼み方でも同じ内訳になり、延べ26件（価格と精度の両方に触れる2件を含む）が24件の内訳として正しく数え直せる形で出た。必ずどれか1つに分類し自己検算させる頼み方では、合計はきれいに24件に合うが、本当は分類対象外の4件が使いやすさに紛れ込んだままで、使いやすさが8件、分類対象外が0件になった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
