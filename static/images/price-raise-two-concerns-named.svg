<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="独立した2つの悪材料のうち1つだけを名指しして解消したと伝えたときの結果を示す表。名指しした懸念（材料A・Bあわせて計10回）は毎回解消扱いになった。材料A（支払い遅延という具体的で確認可能な事実）は、名指ししなかったほうが誤って解消扱いになった回数が5回中0回。材料B（締め日変更の相談という、記録に決着が書かれていない事務的な懸念）は、名指ししなかったほうが誤って解消扱いになった回数が5回中4回だった。両方を名指しして解消したと伝えた対照では、材料A・Bあわせて計10回とも解消扱いになった。下の枠には、材料Aは支払いが届いたかという事実で記録に解消の証拠が無いので5回とも未解決のまま残ったこと、材料Bは相談にどう応じたかが記録に無く5回中4回は自分から『問題ない』と前向きに解釈したことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">名指しした懸念は毎回解消扱いになる。名指ししなかった方は材料で分かれる</text>
<text class="t-sm" x="18" y="45">実測2026-11-05。独立した2つの悪材料を仕込み、片方だけを「解消した」と伝えて各5回試した。</text>
<text class="t-sm" x="18" y="64">具体的で確認可能な事実（材料A）は誤認0回。決着が記録に無い相談（材料B）は誤認4回。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">名指しした懸念が解消扱いになった回数（材料A+B・計10回）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="157">材料A：支払い遅延も誤って解消扱いになった回数</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">0/5</text>
<text class="t" x="18" y="189">材料B：締め日変更も誤って解消扱いになった回数</text>
<rect class="box-bad" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="189" text-anchor="middle" style="font-weight:700">4/5</text>
<text class="t" x="18" y="221">両方を名指しして解消と伝えた回（対照・材料A+B・計10回）</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">10/10</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">材料Aは「支払いが届いたか」という事実。記録に解消の証拠が無いので5回とも未解決のまま残った。</text>
<text class="t-accent" x="34" y="276">材料Bは「相談にどう応じたか」が記録に無い。5回中4回は自分から『問題ない』と前向きに解釈した。</text>
</svg>
