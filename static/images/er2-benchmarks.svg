<svg xmlns="http://www.w3.org/2000/svg" width="720" height="242" viewBox="0 0 720 242" role="img" aria-label="Gemini Robotics ER 2の発表ページが挙げた点数2つを並べた横棒グラフ。進捗の分類（5段階に完了度を当てる）は57.4%、決定的な瞬間の検出（重要な瞬間のフレームを当てる）は91.3%。いずれもGoogle自身の測定で、前のモデルや他社モデルを同じ条件で測った数値は発表に無い。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="242"/>
<text class="t-strong" x="18" y="26">発表ページが挙げた点数は、どれもGoogle自身の測定</text>
<text class="t-sm" x="18" y="45">「前のモデル（ER 1.6）を上回った」とは書かれているが、ER 1.6自身の点数は数値として書かれていない。</text>
<text class="t-sm" x="18" y="64">他社にロボット向けの同種モデルは無く、横並びの比較はできない。</text>
<text class="t" x="18" y="115">進捗の分類（5段階・Continuous progress classification）</text>
<rect class="bar-new" x="272" y="100" width="199.8" height="20" rx="3"/>
<text class="t-sm" x="479.8" y="115">57.4%</text>
<text class="t-xs" x="18" y="132">動画の各場面が完了度0〜100%のどの段階かを当てる</text>
<text class="t" x="18" y="163">決定的な瞬間の検出（Precision moment-finding）</text>
<rect class="bar-new" x="272" y="148" width="317.7" height="20" rx="3"/>
<text class="t-sm" x="597.7" y="163">91.3%</text>
<text class="t-xs" x="18" y="180">注ぐのを止めるタイミング等、重要な瞬間のフレームを当てる</text>
<text class="t-xs" x="18" y="214">※ 決定的な瞬間の検出は、平均絶対誤差0.96秒・前世代比4倍の速さとも発表されている（別の単位のため棒には含めない）。</text>
<text class="t-bad" x="18" y="234">※ 比較相手（前のモデル・他社）の同条件の点数は発表に数値として無い。鵜呑みにしない。</text>
</svg>
