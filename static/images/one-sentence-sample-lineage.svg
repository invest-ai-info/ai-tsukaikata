<text class="t-sm" x="18" y="160">2文見本・単純（先行記事）</text>
<rect class="bar-old" x="300" y="147" width="104.4" height="18" rx="3"/>
<text class="t-sm" x="412.4" y="160">29%</text>
<text class="t-sm" x="18" y="190">1文見本・単純（今回）</text>
