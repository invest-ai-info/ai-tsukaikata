<text class="t-sm" x="412.4" y="190">29%</text>
<text class="t-sm" x="18" y="220">2文見本＋比率指定（先行記事）</text>
<rect class="bar-old" x="300" y="207" width="262.8" height="18" rx="3"/>
<text class="t-sm" x="570.8" y="220">73%</text>
<text class="t-sm" x="18" y="250">1文見本＋比率指定（今回）</text>
