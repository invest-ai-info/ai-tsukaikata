<rect class="bg" x="0" y="0" width="720" height="378"/>
<text class="t-strong" x="18" y="26">見本を2文から1文に削っても、比率はもう下がらなかった</text>
<text class="t-sm" x="18" y="45">犬・万年筆2種の合計（件数を足し上げた比率）。フル見本2026-10-14・2文見本2026-10-20・1文見本2026-11-01の実測。</text>
<text class="t-sm" x="18" y="64">単純版は素朴に見本を渡して書かせた比率、比率指定版は「8文中6〜7文」のように数字を足した比率。</text>
