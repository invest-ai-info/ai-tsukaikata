<svg xmlns="http://www.w3.org/2000/svg" width="720" height="378" viewBox="0 0 720 378" role="img" aria-label="見本の長さを7〜9文のフル見本から2文、1文と削っていったときの、文末パターンの再現比率を示す横棒グラフ。フル見本に単純に書かせた比率は87%（先行記事）。2文見本に単純に書かせた比率は29%（先行記事）、1文見本に単純に書かせた比率も29%（今回）で同じだった。2文見本に比率を数字で指定した比率は73%（先行記事）、1文見本に比率を数字で指定した比率も73%（今回）で同じだった。下の枠には、単純版は見本を2文から1文に削っても29%のまま変わらなかったこと、比率指定版も73%のまま変わらなかったこと、比率が下がる場所はフル見本から短い見本に削った段階にすでにあり、2文から1文の間では下がらないことが書かれている。">
<style>
