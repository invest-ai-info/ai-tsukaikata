<rect class="box-accent" x="18" y="276" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="296">📌 単純に書かせた比率は、見本を2文→1文に削っても29%のまま変わらなかった。</text>
<text class="t-accent" x="34" y="314">📌 比率を数字で指定した場合も、2文→1文で73%のまま変わらなかった。</text>
<text class="t-accent" x="34" y="332">⚠️ 下がる場所は「フル見本→短い見本」の間にすでにあり、2文→1文では下がらない。</text>
