<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="集計表を327行・367行に増やしても数式が正しい値に届くかを示した表。すべて「正解した箇所数／集計欄の総数」で、多いほど良い。店舗売上表でSUMIFS方式を選んだ回は47か所すべて正解を4回繰り返して188/188、SUBTOTAL方式を選んだ回は47か所中46か所の正解（1回）、部門経費表でSUMIFS方式を選んだ回は67か所すべて正解を3回繰り返して201/201、SUBTOTAL方式を選んだ回は67か所中132か所の正解（2回・134か所中）。下の枠には、SUMIFS方式は合計7回・569か所すべてで正しい値に届いたこと、SUBTOTAL方式は3回とも必ず1か所だけ外したこと、外れたのは毎回、直前の塊の個数が他と違う階層（地域ブロック大計・事業部大計）の2つ目だったことが書かれている。">
<style>
