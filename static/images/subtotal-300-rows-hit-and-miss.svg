  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">300行を超えても、SUMIFS方式は47か所・67か所とも正解</text>
<text class="t-sm" x="18" y="45">実測2026-10-08。店舗別売上表（327行・47か所）・部門別経費表（367行・67か所）を各5回。</text>
<text class="t-sm" x="18" y="64">返ってきた数式をコピーし直して全箇所を再計算。崩れたのはSUBTOTAL方式を選んだ回だけ。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">店舗売上表でSUMIFS方式を選んだ回・47か所すべて正解（4回）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">188/188</text>
<text class="t" x="18" y="157">店舗売上表でSUBTOTAL方式を選んだ回・47か所中の正解数（1回）</text>
<rect class="box" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="558.0" y="157" text-anchor="middle" style="font-weight:700">46/47</text>
<text class="t" x="18" y="189">部門経費表でSUMIFS方式を選んだ回・67か所すべて正解（3回）</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">201/201</text>
<text class="t" x="18" y="221">部門経費表でSUBTOTAL方式を選んだ回・67か所中の正解数（2回）</text>
<rect class="box" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-sm" x="558.0" y="221" text-anchor="middle" style="font-weight:700">132/134</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">SUMIFS方式（ラベルの文字列で絞り込む）は、合計7回・569か所すべてで正しい値に届いた。</text>
<text class="t-accent" x="34" y="276">SUBTOTAL方式（位置で範囲を切る）は、3回とも必ず1か所だけ外した——</text>
<text class="t-accent" x="34" y="294">外れたのは毎回、直前の塊の個数が他と違う階層（地域ブロック大計／事業部大計）の2つ目だった。</text>
</svg>
