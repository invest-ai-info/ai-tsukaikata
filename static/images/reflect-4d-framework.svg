<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396" role="img" aria-label="Reflectのレポートが軸にする4つの観点を示した図。①委任（Delegation）＝目標を決め、AIにどう関わるか・そもそも関わるかを判断すること。②説明（Description）＝AIから役に立つ働きを引き出せるよう、目標を的確に言葉にすること。③識別（Discernment）＝AIの出力がどれだけ役に立つかを、正確に見極めること。④勤勉（Diligence）＝AIを使って行ったことに、自分で責任を持つこと。下の枠には、4つとも使い方の質の観点であり、性能や料金の比較軸ではないことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="396"/>
<text class="t-strong" x="18" y="26">レポートは「AI Fluency Framework」の4つの観点で振り返る</text>
<text class="t-sm" x="18" y="45">発表ページが挙げている4つの観点をそのまま並べた。英語表記が公式の名称。</text>
<text class="t-sm" x="18" y="64">Reflectの説明は、この4つの軸でAIとの関わり方を振り返れるとしている。</text>
<rect class="box-quiet" x="18" y="96" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="116">① 委任（Delegation）</text>
<text class="t-sm" x="34" y="134">目標を決め、AIにどう関わるか・そもそも関わるかを判断すること</text>
<rect class="box-quiet" x="18" y="154" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="174">② 説明（Description）</text>
<text class="t-sm" x="34" y="192">AIから役に立つ働きを引き出せるよう、目標を的確に言葉にすること</text>
<rect class="box-quiet" x="18" y="212" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="232">③ 識別（Discernment）</text>
<text class="t-sm" x="34" y="250">AIの出力がどれだけ役に立つかを、正確に見極めること</text>
<rect class="box-quiet" x="18" y="270" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="290">④ 勤勉（Diligence）</text>
<text class="t-sm" x="34" y="308">AIを使って行ったことに、自分で責任を持つこと</text>
<rect class="box-accent" x="18" y="336" width="684" height="40" rx="6"/>
<text class="t-accent" x="34" y="361">4つとも「使い方の質」の観点で、性能や料金の比較軸ではない。</text>
</svg>
