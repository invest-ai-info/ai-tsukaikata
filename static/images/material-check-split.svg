<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" role="img" aria-label="同じ指示文を2回走らせて、返りの3つの部分を並べた図。毎日ある種類が0件だという警告は、1回目も2回目も請求0件・納期0件で同じ。まだ対応が終わっていない一覧も、1回目も2回目も3行で文字列まで一致。ところが種類ごとの件数だけが、1回目は仕様2・返品2・その他2、2回目は仕様3・返品3・その他3に割れた。材料から計算した真値は3・3・3なので、1回目のほうが間違っている。警告も一覧も合っているため、件数が間違っていることに画面からは気づけない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="404"/>
<text class="t-strong" x="18" y="26">点検の欄はそろった。その下の集計だけが、2回で割れた</text>
<text class="t-sm" x="18" y="45">同じ指示文を2回。どちらの回も「中身が完全に同じ行は、1件として数えてください」入り。</text>
<text class="t-sm" x="18" y="64">0件の警告も、未対応の一覧も、2回とも1文字も違わない。違ったのは件数だけ。</text>
<text class="t-xs" x="244" y="106">1回目</text>
<text class="t-xs" x="470" y="106">2回目</text>
<text class="t" x="18" y="144">毎日ある種類の 0件 の警告</text>
<text class="t-xs" x="18" y="164">2回とも同じ</text>
<rect class="box-good" x="244" y="120" width="218" height="58" rx="3"/>
<text class="t-good" x="256" y="154" style="font-size:12px">請求 0件 / 納期 0件</text>
<rect class="box-good" x="470" y="120" width="218" height="58" rx="3"/>
<text class="t-good" x="482" y="154" style="font-size:12px">請求 0件 / 納期 0件</text>
<text class="t" x="18" y="210">種類ごとの件数</text>
<text class="t-xs" x="18" y="230">真値は 3・3・3</text>
<rect class="box-bad" x="244" y="186" width="218" height="58" rx="3"/>
<text class="t-bad" x="256" y="220" style="font-size:12px">仕様2・返品2・その他2</text>
<rect class="box-good" x="470" y="186" width="218" height="58" rx="3"/>
<text class="t-good" x="482" y="220" style="font-size:12px">仕様3・返品3・その他3</text>
<text class="t" x="18" y="276">まだ対応が終わっていない一覧</text>
<text class="t-xs" x="18" y="296">2回とも同じ</text>
<rect class="box-good" x="244" y="252" width="218" height="58" rx="3"/>
<text class="t-good" x="256" y="286" style="font-size:12px">3行（文字列まで一致）</text>
<rect class="box-good" x="470" y="252" width="218" height="58" rx="3"/>
<text class="t-good" x="482" y="286" style="font-size:12px">3行（文字列まで一致）</text>
<text class="t-bad" x="18" y="336">※ 1回目の件数は、材料から計算した真値と合っていない。一覧が合っているので、表だけでは気づけない。</text>
<text class="t-xs" x="18" y="358">※ 点検の欄（行数・最新の日付・重複の組数・崩れた行）は、10回とも真値と一致した。</text>
<text class="t-xs" x="18" y="380">架空データでの実測。指示文ごとの生の返りは docs/evidence/ に置いてある。</text>
</svg>
