</style>
<rect class="bg" x="0" y="0" width="720" height="418"/>
<text class="t-strong" x="18" y="26">4段に増やしても、今回はすべて正しい数式だった</text>
<text class="t-sm" x="18" y="45">実測2026-10-05。店舗別売上表(地域ブロック→エリア→店舗)・部門別経費表(事業部→部署→担当者)。</text>
<text class="t-sm" x="18" y="64">いずれも既存の3段実測に1段足した材料。中間の2段は、新設の大計欄を指す。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">4段・自由記述で最下位(小計)欄が正しかった回（材料2種×5回）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="157">4段・自由記述で中間1(中計)欄が正しかった回</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="189">4段・自由記述で新設の中間2(大計)欄が正しかった回</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="221">4段・自由記述で総合計欄が正しかった回</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="253">SUBTOTALを禁じても、4段すべてが正しかった回（材料B×2回）</text>
<rect class="box-good" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="253" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="285">注意書きを外しても、4段すべてが正しかった回（材料B×2回）</text>
<rect class="box-good" x="478" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="285" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="317">参考：3段構造(別記事)で最下位(小計)欄が正しかった回</text>
<rect class="box-good" x="478" y="296" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="317" text-anchor="middle" style="font-weight:700">10/10</text>
<rect class="box-accent" x="18" y="334" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="354">4段に増やした自由記述10回・SUBTOTALを禁じた2回・注意書きを外した2回の、</text>
<text class="t-accent" x="34" y="372">合計14回すべてで、小計・中計・大計・総合計の4段とも正しい数式になった。</text>
<text class="t-accent" x="34" y="390">＝この材料・この回数の範囲では、3段→4段に増やしても最下位の段はさらに悪化しなかった（H35棄却）。</text>
</svg>
