<svg xmlns="http://www.w3.org/2000/svg" width="720" height="418" viewBox="0 0 720 418" role="img" aria-label="集計欄を4段にしても、いちばん下の段は崩れるかを実測した結果を示す表。すべて「当たった回数／聞いた回数」で、多いほど良い。4段・自由記述で最下位(小計)欄が正しかった回数は材料2種×5回の10回中10回、中間1(中計)欄が正しかった回数も10回中10回、新設の中間2(大計)欄が正しかった回数も10回中10回、総合計欄が正しかった回数も10回中10回。SUBTOTALを禁じても4段すべてが正しかった回数は材料Bの2回中2回。注意書きを外しても4段すべてが正しかった回数も材料Bの2回中2回。参考として、3段構造(別記事)で最下位(小計)欄が正しかった回数は10回中10回。下の枠には、4段に増やした自由記述10回・SUBTOTALを禁じた2回・注意書きを外した2回の合計14回すべてで小計・中計・大計・総合計の4段とも正しい数式になったこと、この材料・この回数の範囲では3段から4段に増やしても最下位の段はさらに悪化しなかったこと（H35棄却）が書かれている。">
<style>
