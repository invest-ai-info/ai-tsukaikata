<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="分割の割合が割り切れず端数が出ても、AIの入金照合は崩れるかを実測した結果を示す表。すべて「正しく判定した回数／試した回数」で、多いほど良い。全額入金済みを正しく「一致」と判定した回数は、端数の位置2種×各5回の10回中10回。本当に500円不足した回を正しく検出した回数は、端数の構造2種×各3回の6回中6回。「端数は問題ない」と伝えても500円の不足を見逃さなかった回数は4回中4回。下の枠には、端数を最終回に寄せても初回に寄せても全額入金済みは10回とも正しく一致と判定したこと、本当に500円不足させた6回も端数で非丸い数字が並ぶ材料のまま全部正しく検出したこと、端数は正常と明示しても本当の不足を見逃した回は0/4だったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">端数のある分割でも、入金照合は崩れなかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-04。業務委託契約(総額100,001円を3等分・端数1円を最終回／初回に寄せた2版)。</text>
<text class="t-sm" x="18" y="64">すべて「正しく判定した回数／試した回数」で、多いほど良い。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">全額入金済みを正しく「一致」と判定した回（端数の位置2種×各5回）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">10/10</text>
<text class="t" x="18" y="157">本当に500円不足した回を正しく検出した回（端数の構造2種×各3回）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="189">「端数は問題ない」と伝えても、500円の不足を見逃さなかった回</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">4/4</text>
<rect class="box-accent" x="18" y="206" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="226">端数(1円)を最終回に寄せても初回に寄せても、全額入金済みは10回とも正しく「一致」。</text>
<text class="t-accent" x="34" y="244">本当に500円不足させた6回も、端数で非丸い数字が並ぶ材料のまま全部正しく検出した。</text>
<text class="t-accent" x="34" y="262">「端数は正常」と明示しても、本当の不足を正常の範囲に丸め込んで見逃した回は0/4だった。</text>
</svg>
