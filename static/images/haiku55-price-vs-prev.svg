<svg xmlns="http://www.w3.org/2000/svg" width="720" height="382" viewBox="0 0 720 382" role="img" aria-label="Claude Haiku 4.5 から Haiku 5.5 への単価の変化を示す横棒グラフ（prompt 10万トークン以下）。100万トークンあたりのドル。薄い灰＝Haiku 4.5、濃い青＝Haiku 5.5。入力は1.00ドルから0.10ドルへ90%減、出力は5.00ドルから0.50ドルへ90%減、読み直し（キャッシュ読み取り）は0.10ドルから0.01ドルへ90%減、キャッシュ書き込み（5分）は1.25ドルから0.125ドルへ90%減。10万トークンを超える分の下げ幅は50%で、これより小さい。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="382"/>
<text class="t-strong" x="18" y="26">Haiku 4.5 → Haiku 5.5、10万トークン以下はどれも90%減</text>
<text class="t-sm" x="18" y="45">薄い灰＝Haiku 4.5、濃い青＝Haiku 5.5。100万トークンあたりのドル。</text>
<text class="t-sm" x="18" y="64">10万トークンを超える分の下げ幅は50%で、これより小さい（本文に表あり）。</text>
<text class="t" x="18" y="102">入力</text>
<text class="t-xs" x="18" y="118">90%減</text>
<text class="t-xs" x="206" y="101" text-anchor="end">4.5</text>
<rect class="bar-old" x="230" y="90" width="66.0" height="14" rx="2"/>
<text class="t-sm" x="304.0" y="101">$1.00</text>
<text class="t-xs" x="206" y="120" text-anchor="end">5.5</text>
<rect class="bar-new" x="230" y="109" width="6.6" height="14" rx="2"/>
<text class="t-sm" x="244.6" y="120">$0.10</text>
<text class="t" x="18" y="165">出力</text>
<text class="t-xs" x="18" y="181">90%減</text>
<text class="t-xs" x="206" y="164" text-anchor="end">4.5</text>
<rect class="bar-old" x="230" y="153" width="330.0" height="14" rx="2"/>
<text class="t-sm" x="568.0" y="164">$5.00</text>
<text class="t-xs" x="206" y="183" text-anchor="end">5.5</text>
<rect class="bar-new" x="230" y="172" width="33.0" height="14" rx="2"/>
<text class="t-sm" x="271.0" y="183">$0.50</text>
<text class="t" x="18" y="228">読み直し（キャッシュ読み取り）</text>
<text class="t-xs" x="18" y="244">90%減</text>
<text class="t-xs" x="206" y="227" text-anchor="end">4.5</text>
<rect class="bar-old" x="230" y="216" width="6.6" height="14" rx="2"/>
<text class="t-sm" x="244.6" y="227">$0.10</text>
<text class="t-xs" x="206" y="246" text-anchor="end">5.5</text>
<rect class="bar-new" x="230" y="235" width="2.0" height="14" rx="2"/>
<text class="t-sm" x="240.0" y="246">$0.01</text>
<text class="t" x="18" y="291">キャッシュ書き込み（5分）</text>
<text class="t-xs" x="18" y="307">90%減</text>
<text class="t-xs" x="206" y="290" text-anchor="end">4.5</text>
<rect class="bar-old" x="230" y="279" width="82.5" height="14" rx="2"/>
<text class="t-sm" x="320.5" y="290">$1.25</text>
<text class="t-xs" x="206" y="309" text-anchor="end">5.5</text>
<rect class="bar-new" x="230" y="298" width="8.2" height="14" rx="2"/>
<text class="t-sm" x="246.2" y="309">$0.125</text>
<text class="t-xs" x="18" y="370">※ 出典: platform.claude.com のモデルのページ（2026年10月8日に確認）。</text>
</svg>
