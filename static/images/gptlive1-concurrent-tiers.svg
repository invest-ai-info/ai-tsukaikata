<svg xmlns="http://www.w3.org/2000/svg" width="720" height="308" viewBox="0 0 720 308" role="img" aria-label="GPT-Live 1の同時セッション数を契約Tierごとに比べた横棒グラフ。Tier 1は25セッション、Tier 2は50セッション、Tier 3は200セッション、Tier 4は300セッション、Tier 5は500セッションで、上位ほど枠が広がる。Freeプランはそもそも利用できない。バックエンド（頭脳役）のモデル呼び出しはこれとは別のレート制限に従う。">
<style>
