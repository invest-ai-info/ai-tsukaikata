<rect class="bg" x="0" y="0" width="720" height="308"/>
<text class="t-strong" x="18" y="26">GPT-Live 1の同時通話数は、契約Tierで25から500まで20倍広がる</text>
<text class="t-sm" x="18" y="45">同時に開けるライブセッションの数（Concurrent sessions）。上のTierほど枠が広い。</text>
<text class="t-sm" x="18" y="64">Freeプランはそもそも利用できない（Unsupported usage tiers: Free）。</text>
