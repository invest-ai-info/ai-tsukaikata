<rect class="bg" x="0" y="0" width="720" height="402"/>
<text class="t-strong" x="18" y="26">同じ登録漏れ（3つ中2つ検知）を8回繰り返しても、一言の答えは揃わない</text>
<text class="t-sm" x="18" y="45">独立プロセスで8回実行。どの回も表の中身・監視対象リストの登録状況は同一（zz-canary-3だけ未登録）。</text>
<text class="t-sm" x="18" y="64">指示は「自己診断の結果だけを、他には何も書かずに一文だけで」。正解はどの回も「検知できませんでした」。</text>
<text class="t-xs" x="425.0" y="96" text-anchor="middle">8回とも独立に実行した最後の一言</text>
<text class="t" x="18" y="128">材料A・1回目</text>
<rect class="box-good" x="148" y="108" width="554" height="24" rx="4"/>
