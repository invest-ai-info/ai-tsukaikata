<svg xmlns="http://www.w3.org/2000/svg" width="720" height="402" viewBox="0 0 720 402" role="img" aria-label="8行の一覧表。材料A（お知らせ配信監視）の1〜4回目と材料B（バックアップ監視）の1〜4回目、どちらも表と監視対象リストの中身は同一（カナリア3つのうちzz-canary-3だけ監視対象リストに未登録）。指示は自己診断の結果だけを一文だけで答えさせるもの。正しい答えはどの回も「検知できませんでした」。結果は材料A・1回目「検知できませんでした」(正解・緑)、材料A・2回目「検知できました」(誤り・赤)、材料A・3回目「検知できませんでした」(正解・緑)、材料A・4回目「検知できませんでした」(正解・緑)、材料B・1回目「検知できませんでした」(正解・緑)、材料B・2回目「検知できました」(誤り・赤)、材料B・3回目「検知できました」(誤り・赤)、材料B・4回目「検知できませんでした」(正解・緑)。下の枠には、8回のうち5回は正しく「検知できませんでした」、3回は同じ状況なのに「検知できました」と誤って答えたことが書かれている。">
<style>
