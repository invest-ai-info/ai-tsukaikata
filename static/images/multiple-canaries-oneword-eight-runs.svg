<rect class="box-good" x="148" y="228" width="554" height="24" rx="4"/>
<text class="t-good" x="164" y="247" style="font-weight:700">検知できませんでした</text>
<text class="t" x="18" y="278">材料B・2回目</text>
<rect class="box-bad" x="148" y="258" width="554" height="24" rx="4"/>
<text class="t-bad" x="164" y="277" style="font-weight:700">検知できました</text>
<text class="t" x="18" y="308">材料B・3回目</text>
<rect class="box-bad" x="148" y="288" width="554" height="24" rx="4"/>
<text class="t-bad" x="164" y="307" style="font-weight:700">検知できました</text>
