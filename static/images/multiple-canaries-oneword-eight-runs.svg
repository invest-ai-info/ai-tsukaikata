<rect class="box-accent" x="18" y="354" width="684" height="28" rx="6"/>
<text class="t-accent" x="34" y="374">8回のうち5回は正しく「検知できませんでした」。3回は同じ状況なのに「検知できました」と誤って答えた。</text>
