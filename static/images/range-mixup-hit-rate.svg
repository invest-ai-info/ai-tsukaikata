<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="文字数・件数が範囲表記の案件を2〜3件同時に渡して両端の値を計算させた実測の結果を示す表。材料K（離れた2範囲・文字単価）は3回中3回正解、材料L（別業種・件数単価の2範囲）も3回中3回正解、材料M（近い値の2範囲）も3回中3回正解、材料Mの並べ替え版も2回中2回正解、材料N（3範囲を同時に）も2回中2回正解で、すべて緑。下の枠には、離れた値・近い値・順番を変えた版・3範囲同時のどれでも取り違えや計算漏れは合計15回のうち0回だったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">範囲が2つ・3つ同時にあっても、取り違えは0件だった</text>
<text class="t-sm" x="18" y="45">実測2026-11-18。文字数・件数が範囲表記の案件を2〜3件同時に渡し、両端の値を計算させた。</text>
<text class="t-sm" x="18" y="64">材料K・L＝離れた値の2範囲／材料M＝近い値の2範囲（並べ替え含む）／材料N＝3範囲を同時に。</text>
<text class="t-xs" x="458.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">材料K（離れた2範囲・文字単価、3回）</text>
<rect class="box-good" x="378" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="125" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="157">材料L（別業種・件数単価の2範囲、3回）</text>
<rect class="box-good" x="378" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="157" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="189">材料M（近い値の2範囲、3回）</text>
<rect class="box-good" x="378" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">材料M・並べ替え（2回）</text>
<rect class="box-good" x="378" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="253">材料N（3範囲を同時に、2回）</text>
<rect class="box-good" x="378" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="458.0" y="253" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">離れた値の範囲・近い値の範囲・順番を変えた版・3範囲を同時に渡した版のどれでも、</text>
<text class="t-accent" x="34" y="308">どちらの範囲がどの案件のものか取り違えた回や、両端のどちらかを計算し忘れた回は</text>
<text class="t-accent" x="34" y="326">合計15回のうち0回だった。</text>
</svg>
