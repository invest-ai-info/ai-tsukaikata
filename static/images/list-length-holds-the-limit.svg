<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="行ごとの達成率を示す表形式の図。短い一覧(3件)は12行中12行が100字以内に収まり、長い一覧(12件)は48行中48行が100字以内に収まった。一方、要約が必要だった12回の実行のうち3回は文中を「…」で切って終えており、言い直し後の長い一覧8回ではこの「…」が0回に減った。下の注記には、一覧の長さ自体は100字制限を破らなかったこと、「…」で切れた3回はいずれも具体的な質問の内容がまだ出ていない場所で切れていたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">監視対象を3件→12件に増やしても、100字以内という制約自体は破れなかった</text>
<text class="t-sm" x="18" y="45">短い一覧(3件)・長い一覧(12件)とも、2系統×各2回で得た行の文字数を数えた。</text>
<text class="t-sm" x="18" y="64">ただし、要約が必要だった項目のうち一定の割合は、文中を「…」で切って終えていた。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">短い一覧(3件)・100字以内で収まった行</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">12/12</text>
<text class="t" x="18" y="157">長い一覧(12件)・100字以内で収まった行</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">48/48</text>
<text class="t" x="18" y="189">要約が必要だった12回中、「…」で切れた回数</text>
<rect class="box-bad" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="189" text-anchor="middle" style="font-weight:700">3/12</text>
<text class="t" x="18" y="221">言い直し後・長い一覧の要約対象8回中の回数</text>
<rect class="box-good" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="221" text-anchor="middle" style="font-weight:700">0/8</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">一覧の長さそのものは、1行100字という制約を破らなかった（60行中0行が超過）。</text>
<text class="t-accent" x="34" y="276">「…」で切れた3回は、どれも具体的な質問の内容がまだ出ていない場所で切れていた。</text>
</svg>
