<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" aria-label="先送り先を書いた依頼（前作・来週分の定期メンテナンスで）と、先送り先を書かない依頼（今回・他の作業が立て込んでいれば）を並べた図。どちらも「至急」「今すぐ」という緊急語を本文に含んでいる。下の枠には、広い基準の指示文はどちらも8回中8回正しく除外したこと、先送り先の書き方の違いはこの基準を崩す条件にならなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="286"/>
<text class="t-strong" x="18" y="26">先送り先を書いたか書かないかは、判断の決め手ではなかった</text>
<text class="t-sm" x="18" y="45">どちらの依頼も「至急」「今すぐ」という緊急語を本文に含んでいる。</text>
<text class="t-sm" x="18" y="64">広い基準の指示文は、語の有無ではなく文全体が指す対応時期で、どちらも正しく除外した。</text>
<rect class="box-good" x="18" y="100" width="684" height="44" rx="6"/>
<text class="t-strong" x="34" y="120">先送り先あり（前作・例）</text>
<text class="t-good" x="34" y="140">「来週分の定期メンテナンスで」</text>
<rect class="box-good" x="18" y="154" width="684" height="44" rx="6"/>
<text class="t-strong" x="34" y="174">先送り先なし（今回・例）</text>
<text class="t-good" x="34" y="194">「他の作業が立て込んでいれば」</text>
<rect class="box-accent" x="18" y="214" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="234">どちらも「至急」「今すぐ」という語を含んでいたが、広い基準は8回中8回正しく除外した。</text>
<text class="t-accent" x="34" y="252">先送り先の書き方の違いは、この基準にとって崩す条件にならなかった。</text>
</svg>
