<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="2件分のキャンセル額を別々の文・別の段に分けた場合に、3種類の聞き方で正しい不足額に到達した回数を示す表。計算手順を明示した言い方は材料A(別々の文・5回)・材料B(別の段・5回)とも5/5。素朴な聞き方も材料A・B各5回とも5/5。「説明が合っているか確認して」という軽い言い方も材料A・B各3回とも3/3。下の枠には、26回とも正しい不足額(材料A=4,000円・材料B=3,000円)に到達したこと、1件分を見落とす・結論の数字が食い違うといった崩れ方は1件も起きなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">別々の文・別の段に分けても、3種類の聞き方は26回とも崩れなかった</text>
<text class="t-sm" x="18" y="45">2件分のキャンセル額を別々の文(材料A)・別の段(材料B)に分けた場合の実測。</text>
<text class="t-sm" x="18" y="64">正しい不足額(材料A=4,000円・材料B=3,000円)に到達した回数／試した回数。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">計算手順を明示（材料A・別々の文、5回）</text>
<rect class="box-good" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="125" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="157">計算手順を明示（材料B・別の段、5回）</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="189">素朴な聞き方（材料A、5回）</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="221">素朴な聞き方（材料B、5回）</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="253">「説明が合っているか確認して」（材料A、3回）</text>
<rect class="box-good" x="438" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="253" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="285">「説明が合っているか確認して」（材料B、3回）</text>
<rect class="box-good" x="438" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="285" text-anchor="middle" style="font-weight:700">3/3</text>
<rect class="box-accent" x="18" y="302" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="322">2件同時のキャンセルを同じ文に書いた前の記事と、26回とも同じ精度（見逃し0・誤判定0）だった。</text>
<text class="t-accent" x="34" y="340">別々の文・別の段に分けても、1件だけ引く・足し間違える・結論の数字が食い違うといった崩れ方は出なかった。</text>
</svg>
