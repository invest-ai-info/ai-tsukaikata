<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="文章の文末表現（「〜のです」「〜ください」など）が4回以上連続するよう仕込んだ、禁止語を含まない3種類の材料（地の文2種・箇条書き1種）に、「人間らしく書き直して」という指示を試した結果を示す表。材料①在宅勤務・素朴な指示（3回試行）は3回以上の連続が残った回0件。同じ材料で3回以上禁止を明記した指示（3回試行）も0件。材料②観葉植物・素朴な指示（3回試行）も0件。同じ材料で禁止を明記した指示（3回試行）も0件。材料③箇条書き・素朴な指示（3回試行）も0件。下の枠には、禁止語を含まない材料でも素朴な指示だけで文末の3回以上連続が15回とも消えたこと、3回以上禁止を明記しても結果は同じで上乗せ効果は確認できなかったこと、地の文だけでなく箇条書き形式でも同じ結果だったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">文末の3回以上連続は、15回試しても一度も残らなかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-11。禁止語を含まない3種類の材料（地の文2種・箇条書き1種）で確認。</text>
<text class="t-sm" x="18" y="64">「残った」は書き直し後も同じ文末表現が3回以上連続した回。多いほど問題（0が理想）。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">材料①在宅勤務・素朴な指示（3回）</text>
<rect class="box-good" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="125" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="157">材料①在宅勤務・3回以上禁止を明記（3回）</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="189">材料②観葉植物・素朴な指示（3回）</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="221">材料②観葉植物・3回以上禁止を明記（3回）</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="253">材料③箇条書き・素朴な指示（3回）</text>
<rect class="box-good" x="438" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="253" text-anchor="middle" style="font-weight:700">0/3</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">禁止語を1つも含まない材料でも、素朴な指示だけで文末の3回以上連続は15回とも消えた。</text>
<text class="t-accent" x="34" y="308">「3回以上禁止」を明記しても結果は同じ（0件）で、上乗せ効果は確認できなかった。</text>
<text class="t-accent" x="34" y="326">地の文だけでなく、番号付きの箇条書き形式でも同じ結果だった。</text>
</svg>
