<svg xmlns="http://www.w3.org/2000/svg" width="720" height="232" viewBox="0 0 720 232" role="img" aria-label="図にする前の5段階を示した図。あなたが説明文を渡す、AIが関係を一覧にして根拠の一文も付ける、AIが一覧の言葉が根拠の一文に実在するか確認する、AIが一覧の言葉だけで図の構成案を作る、AIが図と一覧の過不足を突き合わせる、の5段階。AIが担当するのは後の4つで、人がやるのは最初に説明文を渡すところだけ。一覧なら行ごとに照合できるが、図そのものは照合できない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="232"/>
<text class="t-strong" x="18" y="26">図にする前に、一覧と出典で関係を確かめてから描かせます</text>
<text class="t-sm" x="18" y="45">青がAIの担当。最初に説明文を渡すところだけ、あなたがやります。</text>
<text class="t-sm" x="18" y="64">一覧なら行ごとに照合できますが、図そのものは照合できません。</text>
<rect class="box" x="22" y="92" width="124" height="96" rx="6"/>
<text class="t-strong" x="34" y="124">説明文を渡す</text>
<text class="t-xs" x="34" y="150">整理していない原文のまま</text>
<text class="t-xs" x="34" y="174">あなた</text>
<path class="line" d="M150 140.0 L162 140.0"/>
<rect class="box-accent" x="166" y="92" width="124" height="96" rx="6"/>
<text class="t-accent" x="178" y="124">一覧＋出典</text>
<text class="t-xs" x="178" y="150">1行ごとに根拠つき</text>
<text class="t-xs" x="178" y="174">AI</text>
<path class="line" d="M294 140.0 L306 140.0"/>
<rect class="box-accent" x="310" y="92" width="124" height="96" rx="6"/>
<text class="t-accent" x="322" y="124">言葉を確認</text>
<text class="t-xs" x="322" y="150">一文の中に実在するか照合</text>
<text class="t-xs" x="322" y="174">AI</text>
<path class="line" d="M438 140.0 L450 140.0"/>
<rect class="box-accent" x="454" y="92" width="124" height="96" rx="6"/>
<text class="t-accent" x="466" y="124">図の構成案</text>
<text class="t-xs" x="466" y="150">一覧の言葉だけで作らせる</text>
<text class="t-xs" x="466" y="174">AI</text>
<path class="line" d="M582 140.0 L594 140.0"/>
<rect class="box-accent" x="598" y="92" width="124" height="96" rx="6"/>
<text class="t-accent" x="610" y="124">突き合わせ</text>
<text class="t-xs" x="610" y="150">図と一覧の過不足を確認</text>
<text class="t-xs" x="610" y="174">AI</text>
<text class="t-xs" x="18" y="218">※ 「言葉を確認」で引っかかった行は、直せる言葉があれば直し、無ければ消してから次に進みます。</text>
</svg>
