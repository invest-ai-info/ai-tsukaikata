<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="材料A（trial3）と材料B（trial1）を並べた図。材料Aは見出しが「不自然な連続が3箇所あります」と言い、本文のリストも①でしょう②のです③次第です の3項目しか無く、4つ目（と思います）は別の文で「3箇所より目立たない」と格下げされている。材料Bは見出しが「以下の3箇所で…不自然です」と言うが、本文のリストは①②③④の4項目が4パターンとも同格に並んでおり、格下げは無い。下の枠には、材料Aは前作（3パターン時）と同じ本文のリストそのものが減る崩れ方であること、材料Bは本文は無傷で要約の数字だけが誤る、今回新しく見つかった崩れ方であることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="340"/>
<text class="t-strong" x="18" y="26">同じ「数字の食い違い」でも、崩れ方は2種類あった</text>
<text class="t-sm" x="18" y="45">左（材料A）は本文のリストごと減る。右（材料B）は本文は無傷で見出しの数字だけ誤る。</text>
<text class="t-strong" x="18" y="114">材料A・trial3</text>
<text class="t-strong" x="368.0" y="114">材料B・trial1</text>
<rect class="box-bad" x="18" y="122" width="334.0" height="40" rx="5"/>
<text class="t-bad" x="32" y="139" style="font-size:11.5px">見出し「不自然な連続が3箇所あります」</text>
<rect class="box-bad" x="368.0" y="122" width="334.0" height="40" rx="5"/>
<text class="t-bad" x="382.0" y="139" style="font-size:11.5px">見出し「以下の3箇所で…不自然です」</text>
<rect class="box-bad" x="18" y="170" width="334.0" height="40" rx="5"/>
<text class="t-bad" x="32" y="187" style="font-size:11.5px">本文のリスト＝①でしょう②のです③次第です（3項目）</text>
<rect class="box-good" x="368.0" y="170" width="334.0" height="40" rx="5"/>
<text class="t-good" x="382.0" y="187" style="font-size:11.5px">本文のリスト＝①②③④（4項目・4パターンとも同格）</text>
<rect class="box-bad" x="18" y="218" width="334.0" height="40" rx="5"/>
<text class="t-bad" x="32" y="235" style="font-size:11.5px">「と思います」は別の文で「3箇所より目立たない」と格下げ</text>
<rect class="box-good" x="368.0" y="218" width="334.0" height="40" rx="5"/>
<text class="t-good" x="382.0" y="235" style="font-size:11.5px">4つ目（次第です）も他と同じ書式で本文に並ぶ。格下げなし</text>
<rect class="box-accent" x="18" y="274" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="294">⚠️ 左は前作（3パターン時）と同じ崩れ方＝本文のリストそのものが減る。</text>
<text class="t-accent" x="34" y="312">⚠️ 右は今回材料Bで新しく見つかった崩れ方＝本文は無傷で、要約の数字だけが誤る。</text>
</svg>
