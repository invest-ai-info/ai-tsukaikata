<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="ココナラで作った自動化を売るときの推定を3段で並べた横棒グラフ。式は1件27,500円（1ページ目60件の中央値）×月の件数×0.78で、0.78はココナラの販売時の手数料22%を引いた残り。月1件なら21,450円で副業帯の入口、月3件なら64,350円で副業帯（JILPTの副業者の中央値50,000円/月に近い）、月15件なら321,750円で準本業帯（副業で月20万円以上は10.8%・JILPT 2022年調査）。1件を作る時間や何件売れるかの出典は無く、件数はこちらが置いた前提だと注記。下の枠には、月15件は1件に丸1日かけるなら平日のほとんどを使う量で準本業帯は作業量の前提と一緒にしか書けないこと、価格を10,000円に置けば同じ件数で7,800円・23,400円・117,000円となり価格の前提で帯が1つ下がること、売れる方法はこの記事に無く式の部品だけを確かめられる形にしてあることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="350"/>
<text class="t-strong" x="18" y="26">推定＝27,500円 × 月の件数 × 0.78（件数は前提・価格は1ページ目の中央値）</text>
<text class="t-sm" x="18" y="45">0.78＝ココナラの販売時の手数料22%を引いた残り（2026年9月18日確認）。1件を作る時間の出典は無い。</text>
<text class="t-sm" x="18" y="64">何件売れるかの出典も無い。3段の件数はこちらが置いた前提で、ご自身の件数に置き換えること。</text>
<text class="t-xs" x="200" y="86">月の売上金（円・振込手数料を引く前）</text>
<text class="t-strong" x="18" y="122">月1件（前提）</text>
<rect class="bar-in" x="200" y="107" width="22" height="20" rx="3"/>
<text class="t-strong" x="230" y="122">21,450円</text>
<text class="t-xs" x="200" y="140">副業帯の入口（1件あたりの売上金）</text>
<text class="t-strong" x="18" y="174">月3件（前提）</text>
<rect class="bar-in" x="200" y="159" width="66" height="20" rx="3"/>
<text class="t-strong" x="274" y="174">64,350円</text>
<text class="t-xs" x="200" y="192">副業帯（JILPT 副業者の中央値 50,000円/月 に近い）</text>
<text class="t-strong" x="18" y="226">月15件（前提）</text>
<rect class="bar-in" x="200" y="211" width="330" height="20" rx="3"/>
<text class="t-strong" x="538" y="226">321,750円</text>
<text class="t-xs" x="200" y="244">準本業帯（副業で月20万円以上は10.8%・JILPT 2022年調査）</text>
<rect class="box-accent" x="18" y="266" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="286">月15件は、1件に丸1日かけるなら平日のほとんどを使う量。準本業帯は「作業量の前提」と一緒にしか書けない。</text>
<text class="t-accent" x="34" y="304">価格を10,000円に置けば同じ件数で 7,800円／23,400円／117,000円。価格の前提で帯が1つ下がる。</text>
<text class="t-accent" x="34" y="322">売れる方法はこの記事に無い。式の部品（中央値・22%）だけを原文と一覧で確かめられる形にしてある。</text>
</svg>
