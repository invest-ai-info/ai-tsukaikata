<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">文末の種類を変えても、6回連続でも、残った回は0件</text>
<text class="t-sm" x="18" y="45">実測2026-10-22。新しい文末2種（4回連続）・既出の文末2種（5回・6回連続）を各3回試した。</text>
<text class="t-sm" x="18" y="64">「3回以上連続を使わない」という3回以上連続が残った回数（少ないほど良い）を比べた。</text>
<text class="t-xs" x="528.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">「〜でしょう」4回連続・素朴な指示で3回以上連続が残った回数</text>
