<text class="t-good" x="528.0" y="157" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="189">「〜のです」5回連続・素朴な指示で3回以上連続が残った回数</text>
<rect class="box-good" x="448" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="189" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="221">「〜ください」6回連続・素朴な指示で3回以上連続が残った回数</text>
<rect class="box-good" x="448" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="221" text-anchor="middle" style="font-weight:700">0/3</text>
<text class="t" x="18" y="253">「〜ください」6回連続・禁止を明記した指示で3回以上連続が残った回数</text>
<rect class="box-good" x="448" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="528.0" y="253" text-anchor="middle" style="font-weight:700">0/3</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">✅ 文末表現の種類を変えても（「〜でしょう」「〜と思います」）、素朴な指示だけで3回以上連続は12回とも消えた。</text>
<text class="t-accent" x="34" y="308">✅ 連続回数を5回・6回に増やしても、同じ素朴な指示だけで3回以上連続は残らなかった。</text>
<text class="t-accent" x="34" y="326">📌 前の記事（文末2種・連続4回まで）と同じ天井（0件）が、より広い条件でも再現した。</text>
