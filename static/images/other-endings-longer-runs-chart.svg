<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="文末表現の種類と連続回数を変えた4材料に、「人間らしく書き直して」という指示を試した結果を比べた図。「〜でしょう」4回連続・素朴な指示で3回以上連続が残った回数は0/3、「〜と思います」4回連続・素朴な指示で0/3、「〜のです」5回連続・素朴な指示で0/3、「〜ください」6回連続・素朴な指示で0/3、「〜ください」6回連続・禁止を明記した指示で0/3。下の枠には、文末表現の種類を変えても素朴な指示だけで3回以上連続は12回とも消えたこと、連続回数を5回・6回に増やしても同じ素朴な指示だけで3回以上連続は残らなかったこと、前の記事（文末2種・連続4回まで）と同じ天井（0件）がより広い条件でも再現したことが書かれている。">
