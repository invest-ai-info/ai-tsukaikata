<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-label="Gemini 3.8 Flash の自動安全評価が、3.7 Flash と比べて何ポイント動いたかを示す図。Text to Text Safety はマイナス0.4ポイントで改善、Multilingual Safety はプラス5.4ポイントで悪化（この項目は下がるほど良いため）、Image to Text Safety は変化なし、Tone はプラス0.2ポイントで改善（この項目は上がるほど良いため）、Unjustified-refusals はプラス1.1ポイントで悪化（この項目は下がるほど良いため）。モデルカードに記載された自動評価の値で、人手のレッドチーム評価ではない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="372"/>
<text class="t-strong" x="18" y="26">自動安全評価は、3.7 Flash とほぼ同じ——ただし多言語だけ悪化</text>
<text class="t-sm" x="18" y="45">モデルカードに載っている、3.7 Flash との差（ポイント）。緑＝改善、赤＝悪化。</text>
<text class="t-sm" x="18" y="64">「良い方向」は項目ごとに違います（下がるほど良い項目と、上がるほど良い項目が混在）。</text>
<text class="t-sm" x="18" y="83">自動評価であり、人手のレッドチーム評価ではありません。</text>
<text class="t" x="18" y="128">Text to Text Safety</text>
<rect class="box-good" x="250" y="112" width="22.6" height="22" rx="3"/>
<text class="t-good" x="571" y="128">-0.4pp（改善）</text>
<text class="t" x="18" y="170">Multilingual Safety</text>
<rect class="box-bad" x="250" y="154" width="305.0" height="22" rx="3"/>
<text class="t-bad" x="571" y="170">+5.4pp（悪化）</text>
<text class="t" x="18" y="212">Image to Text Safety</text>
<rect class="box-quiet" x="250" y="196" width="3.0" height="22" rx="3"/>
<text class="t-sm" x="571" y="212">0.0pp（同じ）</text>
<text class="t" x="18" y="254">Tone</text>
<rect class="box-good" x="250" y="238" width="11.3" height="22" rx="3"/>
<text class="t-good" x="571" y="254">+0.2pp（改善）</text>
<text class="t" x="18" y="296">Unjustified-refusals</text>
<rect class="box-bad" x="250" y="280" width="62.1" height="22" rx="3"/>
<text class="t-bad" x="571" y="296">+1.1pp（悪化）</text>
<text class="t-xs" x="18" y="342">※ 出典: Gemini 3.8 Flash モデルカード（deepmind.google・2026年9月2日公開分）。</text>
<text class="t-xs" x="18" y="360">※ Text to Text／Multilingual／Image to Text／Unjustified-refusalsは下がるほど良く、Toneは上がるほど良いとカードに明記。</text>
</svg>
