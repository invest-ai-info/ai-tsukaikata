<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="材料D・E・Fそれぞれについて、古い42日の1日あたりの目安（灰の棒）と直近14日の目安（青の棒）を並べた横棒グラフ。材料Dは古い42日が約5.17件/日・直近14日が4.5件/日（差10.0%）、材料Eは古い42日が約5.33件/日・直近14日が4.0件/日（差20.0%）、材料Fは古い42日が5.5件/日・直近14日が3.5件/日（差30.0%）。56日全体の目安はどの材料も5.0件/日にそろえてあり、直近14日だけが材料ごとに低くなっている。下の枠には、直近14日の落ち込みが大きいほど判定が『大きく違う』で安定したことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="380"/>
<text class="t-strong" x="18" y="24">直近14日だけを動かして、差をちょうど10%・20%・30%にそろえた</text>
<text class="t-sm" x="18" y="43">材料D・E・Fはどれも56日全体の目安を5.0件/日にそろえ、直近14日の目安だけを4.5→4.0→3.5件/日と動かした。</text>
<text class="t-sm" x="18" y="62">古い42日の目安（灰）は材料ごとに約5.17→5.33→5.5件/日と、直近14日（青）から離れていく。</text>
<text class="t-xs" x="516.0" y="78">件/日</text>
<text class="t" x="18" y="106">材料D（差10.0%） ― 古い42日</text>
<rect class="box-quiet" x="300.0" y="95" width="230.0" height="15" rx="3"/>
<rect class="bar-old" x="300.0" y="95" width="198.1" height="15" rx="3"/>
<text class="t-strong" x="544.0" y="106">5.17件/日</text>
<text class="t" x="18" y="138">　　　　　　　　  直近14日</text>
<rect class="box-quiet" x="300.0" y="127" width="230.0" height="15" rx="3"/>
<rect class="bar-new" x="300.0" y="127" width="172.5" height="15" rx="3"/>
<text class="t-strong" x="544.0" y="138">4.50件/日</text>
<line class="line" x1="18" y1="150.0" x2="684" y2="150.0" stroke-dasharray="3 3"/>
<text class="t" x="18" y="180">材料E（差20.0%） ― 古い42日</text>
<rect class="box-quiet" x="300.0" y="169" width="230.0" height="15" rx="3"/>
<rect class="bar-old" x="300.0" y="169" width="204.4" height="15" rx="3"/>
<text class="t-strong" x="544.0" y="180">5.33件/日</text>
<text class="t" x="18" y="212">　　　　　　　　  直近14日</text>
<rect class="box-quiet" x="300.0" y="201" width="230.0" height="15" rx="3"/>
<rect class="bar-new" x="300.0" y="201" width="153.3" height="15" rx="3"/>
<text class="t-strong" x="544.0" y="212">4.00件/日</text>
<line class="line" x1="18" y1="224.0" x2="684" y2="224.0" stroke-dasharray="3 3"/>
<text class="t" x="18" y="254">材料F（差30.0%） ― 古い42日</text>
<rect class="box-quiet" x="300.0" y="243" width="230.0" height="15" rx="3"/>
<rect class="bar-old" x="300.0" y="243" width="210.8" height="15" rx="3"/>
<text class="t-strong" x="544.0" y="254">5.50件/日</text>
<text class="t" x="18" y="286">　　　　　　　　  直近14日</text>
<rect class="box-quiet" x="300.0" y="275" width="230.0" height="15" rx="3"/>
<rect class="bar-new" x="300.0" y="275" width="134.2" height="15" rx="3"/>
<text class="t-strong" x="544.0" y="286">3.50件/日</text>
<rect class="box-accent" x="18" y="312" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="332">材料Dは差10.0%、材料Eは差20.0%、材料Fは差30.0%（いずれも56日の目安5.0件/日に対する差）。</text>
<text class="t-accent" x="34" y="350">直近14日の落ち込みが大きいほど、判定は『大きく違う』で安定した（本文のAIへの頼み方を参照）。</text>
</svg>
