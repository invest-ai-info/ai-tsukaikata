<text class="t-good" x="18" y="318">※ 6回とも、要確認に挙げた金額は35,000円と40,000円の2件でそろった。</text>
<text class="t-xs" x="18" y="339">架空データでの実測。生の返り6通は docs/evidence/ に全文置いてある。</text>
