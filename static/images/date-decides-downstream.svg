<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="決まったルールを同じ会話の次の作業に使わせた6回の結果を並べた横棒グラフ。経費一覧8件のうち、古い基準（1万円以上）のままなら6件、更新後の基準（3万円以上）なら2件が要確認に挙がる作りにしてある。c-1回目からc-6回目まで、6回ともきっちり2件が挙がり、古い基準の6件になった回は1回も無かった。挙げた金額も6回とも35,000円と40,000円の2件でそろっていた。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
