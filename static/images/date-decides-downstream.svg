    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">決まったルールは、同じ会話の次の作業でも6回とも正しく使われた</text>
<text class="t-sm" x="18" y="45">版bのやり取りに続けて、同じ会話で「このルールを使って、次の経費一覧から要確認を挙げて」と頼んだ（全6回）。</text>
<text class="t-sm" x="18" y="64">経費一覧は8件。古い基準（1万円）のままなら6件、更新後の基準（3万円）なら2件が挙がる作り。</text>
