<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">3つ目のパターンは、本文には出てくるが見出しの数には入らない</text>
<text class="t-sm" x="18" y="45">材料では「でしょう」「と思います」「のです」がそれぞれ3文連続（実測はdocs/evidence参照）。</text>
<text class="t-strong" x="18" y="110">材料の実際の並び（9〜11文目・3文は連続していて、間に他の文は無い）</text>
<rect class="box-good" x="18" y="120" width="684" height="28" rx="5"/>
<text class="t-good" x="34" y="139">①でしょう（2〜4文目・3文連続）</text>
<rect class="box-good" x="18" y="152" width="684" height="28" rx="5"/>
<text class="t-good" x="34" y="171">②と思います（9〜11文目・3文連続）</text>
<rect class="box-good" x="18" y="184" width="684" height="28" rx="5"/>
<text class="t-good" x="34" y="203">③のです（16〜18文目・3文連続）</text>
<text class="t-strong" x="18" y="240">トライアル5の見出しと言い分（5回中3回、この型になった）</text>
<rect class="box-bad" x="18" y="250" width="684" height="28" rx="5"/>
<text class="t-bad" x="34" y="269">見出し「文末表現が不自然に連続している箇所を2か所指摘します」</text>
<rect class="box-bad" x="18" y="282" width="684" height="28" rx="5"/>
<text class="t-bad" x="34" y="301">本文「〜と思います〜間に他の文が挟まっているため上記2箇所より目立ちません」</text>
<rect class="box-accent" x="18" y="320" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="340">⚠️ 「間に他の文が挟まっている」は誤り。②は材料の中で3文とも連続しており、挟まる文は無い</text>
<text class="t-accent" x="34" y="358">✅ 本文には②も出てくる。消えるのは「見出しの数」と「同格の扱い」のほうだけ</text>
</svg>
