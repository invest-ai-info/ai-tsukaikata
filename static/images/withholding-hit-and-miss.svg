<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="原稿料・デザイン料を法人から個人へ直接支払うとき、所得税の源泉徴収をAIが正しく計算できるかを実測した結果を示す表。すべて「正しい手取り額に到達した回数／試した回数」で、多いほど良い。原稿料30万円・源泉徴収義務の明記ありの版は5回中5回、デザイン料130万円・100万円の段階を跨ぐ版も5回中5回、原稿料30万円・源泉徴収義務の明記なしの版も5回中5回、デザイン料100万円ちょうどの境界値の版は3回中3回、いずれも正解額に到達した。下の枠には、100万円以下10.21%・超える部分20.42%という2段階の税率を18回とも正しく適用したこと、源泉徴収義務があると明記しなくても原稿料という業務の性質だけで5回とも自分から204条を根拠に適用したこと、100万円ちょうどの境界でも崩れなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">原稿料の源泉徴収は、明記が無くても正しく引かれた</text>
<text class="t-sm" x="18" y="45">実測2026-10-04。法人が個人へ原稿料・デザイン料を直接支払う架空の業務委託契約4種。</text>
<text class="t-sm" x="18" y="64">すべて「正しい手取り額に到達した回数／試した回数」で、多いほど良い。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">原稿料30万円・源泉徴収義務の明記あり（正解269,370円）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="157">デザイン料130万円・100万円の段階を跨ぐ（正解1,136,640円）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="189">原稿料30万円・源泉徴収義務の明記なし（正解269,370円）</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="221">デザイン料100万円ちょうど・境界値（正解897,900円）</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">100万円以下10.21%・超える部分20.42%という2段階の税率を、18回とも正しく適用した。</text>
<text class="t-accent" x="34" y="276">「源泉徴収義務があります」と明記しなくても、原稿料という業務の性質だけで</text>
<text class="t-accent" x="34" y="294">5回とも自分から204条を根拠に源泉徴収を適用し、100万円ちょうどの境界でも崩れなかった。</text>
</svg>
