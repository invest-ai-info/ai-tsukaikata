<svg xmlns="http://www.w3.org/2000/svg" width="720" height="416" viewBox="0 0 720 416" role="img" aria-label="見る場所を絞った2つの頼み方について、仕込んだ5件のうち何件を見分けられたかを8回ぶん並べた横棒グラフ。見出しの名前と順番だけを並べさせた形では、表形式の材料の1回目が5件中3件（指定した欄に2件、AIが自分から付けた補足に1件）、2回目が5件中5件（欄に2件、補足に3件）と割れた。同じ形を箇条書きの材料に当てると、2回とも5件中2件で、行の書き方・末尾の注記・合計行の3つは出てこない。4つの欄を数えて並べさせた形では、表形式の材料は2回とも5件中4件で全部が指定した欄の中に出たが、点検の項目が1つ消えたことは2回とも写らなかった。箇条書きの材料では5件中3件と4件に割れ、そのうち1件と3件はAIが自分から付けた補足にだけ出ている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="416"/>
<text class="t-strong" x="18" y="26">見る場所を絞ると、絞った外は「その回に補足が付いたかどうか」で決まる</text>
<text class="t-sm" x="18" y="45">仕込みは材料ごとに5件。棒は、見分けられる値が返りに出た数。</text>
<text class="t-sm" x="18" y="64">濃い部分＝こちらが指定した欄の中に出た　薄い部分＝AIが自分から付けた補足にだけ出た</text>
<text class="t-xs" x="349" y="92">0</text>
<text class="t-xs" x="395" y="92">1</text>
<text class="t-xs" x="441" y="92">2</text>
<text class="t-xs" x="487" y="92">3</text>
<text class="t-xs" x="533" y="92">4</text>
<text class="t-xs" x="579" y="92">5</text>
<text class="t" x="18" y="115">見出しの名前と順番だけ</text>
<text class="t-xs" x="234" y="115">表形式の材料・1回目</text>
<rect class="box-quiet" x="352" y="100" width="230" height="22" rx="2"/>
<rect class="bar-new" x="352" y="100" width="92" height="22" rx="2"/>
<rect class="bar-in" x="444" y="100" width="46" height="22" rx="2"/>
<text class="t-bad" x="592" y="116">3/5</text>
<text class="t-xs" x="234" y="144">表形式の材料・2回目</text>
<rect class="box-quiet" x="352" y="129" width="230" height="22" rx="2"/>
<rect class="bar-new" x="352" y="129" width="92" height="22" rx="2"/>
<rect class="bar-in" x="444" y="129" width="138" height="22" rx="2"/>
<text class="t-good" x="592" y="145">5/5</text>
<text class="t-xs" x="234" y="173">箇条書きの材料・1回目</text>
<rect class="box-quiet" x="352" y="158" width="230" height="22" rx="2"/>
<rect class="bar-new" x="352" y="158" width="92" height="22" rx="2"/>
<text class="t-bad" x="592" y="174">2/5</text>
<text class="t-xs" x="234" y="202">箇条書きの材料・2回目</text>
<rect class="box-quiet" x="352" y="187" width="230" height="22" rx="2"/>
<rect class="bar-new" x="352" y="187" width="92" height="22" rx="2"/>
<text class="t-bad" x="592" y="203">2/5</text>
<text class="t" x="18" y="231">4つの欄を数えて並べさせる</text>
<text class="t-xs" x="234" y="231">表形式の材料・1回目</text>
<rect class="box-quiet" x="352" y="216" width="230" height="22" rx="2"/>
<rect class="bar-new" x="352" y="216" width="184" height="22" rx="2"/>
<text class="t-good" x="592" y="232">4/5</text>
<text class="t-xs" x="234" y="260">表形式の材料・2回目</text>
<rect class="box-quiet" x="352" y="245" width="230" height="22" rx="2"/>
<rect class="bar-new" x="352" y="245" width="184" height="22" rx="2"/>
<text class="t-good" x="592" y="261">4/5</text>
<text class="t-xs" x="234" y="289">箇条書きの材料・1回目</text>
<rect class="box-quiet" x="352" y="274" width="230" height="22" rx="2"/>
<rect class="bar-new" x="352" y="274" width="92" height="22" rx="2"/>
<rect class="bar-in" x="444" y="274" width="46" height="22" rx="2"/>
<text class="t-bad" x="592" y="290">3/5</text>
<text class="t-xs" x="234" y="318">箇条書きの材料・2回目</text>
<rect class="box-quiet" x="352" y="303" width="230" height="22" rx="2"/>
<rect class="bar-new" x="352" y="303" width="46" height="22" rx="2"/>
<rect class="bar-in" x="398" y="303" width="138" height="22" rx="2"/>
<text class="t-good" x="592" y="319">4/5</text>
<text class="t-bad" x="18" y="350">※ 同じ指示文の2回で 3/5 と 5/5 に割れた。増えた2件は、AIが自分から付けた補足に出たもの。</text>
<text class="t-bad" x="18" y="372">※ 4つの欄を数えさせた形では、欄に無い違い（点検の項目が1つ消えた・行の書き方が変わった）は写らない。</text>
<text class="t-xs" x="18" y="394">架空データでの実測。指示文ごとの生の返りは docs/evidence/ に置いてある。</text>
</svg>
