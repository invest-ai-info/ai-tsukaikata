<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="直近14日と56日全体の差（%）を横軸にした数直線に、先行記事とこの記事の判定済みの点を重ねた図。先行記事までは、差10%で『同じ』、差20%で『大きく違う』という2点しか分かっておらず、間の10ポイント（10%〜20%）が未知区間だった（上の灰色の帯）。この記事は差13%・15%・18%のどれも『大きく違う』を確かめ、未知区間を10%〜13%の3ポイントまで狭めた（下の青い帯）。下の数直線には10%・13%・15%・18%・20%の5点が、『同じ』は灰色、『大きく違う』は青の点で示されている。下の枠には、残り3ポイントのどこで切り替わるかはこの記事でも1点に絞れていないことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="330"/>
<text class="t-strong" x="18" y="26">分からない区間が、10ポイントから3ポイントへ狭まった</text>
<text class="t-sm" x="18" y="45">先行記事までは『同じ』10%〜『大きく違う』20%の間（10ポイント）が未知だった。</text>
<text class="t-sm" x="18" y="64">この記事の材料I・G・H（13%・15%・18%）で、未知区間は『同じ』10%〜『大きく違う』13%の3ポイントに絞り込めた。</text>
<line class="line" x1="70" y1="180" x2="660" y2="180"/>
<line class="line" x1="70.0" y1="180" x2="70.0" y2="188"/>
<text class="t-xs" x="70.0" y="202" text-anchor="middle">0%</text>
<line class="line" x1="338.2" y1="180" x2="338.2" y2="188"/>
<text class="t-xs" x="338.2" y="202" text-anchor="middle">10%</text>
<line class="line" x1="418.6" y1="180" x2="418.6" y2="188"/>
<text class="t-xs" x="418.6" y="202" text-anchor="middle">13%</text>
<line class="line" x1="472.3" y1="180" x2="472.3" y2="188"/>
<text class="t-xs" x="472.3" y="202" text-anchor="middle">15%</text>
<line class="line" x1="552.7" y1="180" x2="552.7" y2="188"/>
<text class="t-xs" x="552.7" y="202" text-anchor="middle">18%</text>
<line class="line" x1="606.4" y1="180" x2="606.4" y2="188"/>
<text class="t-xs" x="606.4" y="202" text-anchor="middle">20%</text>
<line class="line" x1="660.0" y1="180" x2="660.0" y2="188"/>
<text class="t-xs" x="660.0" y="202" text-anchor="middle">22%</text>
<rect class="bar-old" x="338.2" y="110" width="268.2" height="22" rx="4"/>
<text class="t" x="18" y="126">先行記事まで</text>
<text class="t-sm" x="472.3" y="102" text-anchor="middle">未知＝10ポイント（10%〜20%）</text>
<rect class="bar-new" x="338.2" y="150" width="80.5" height="22" rx="4"/>
<text class="t" x="18" y="166">この記事まで</text>
<text class="t-accent" x="378.4" y="142" text-anchor="middle" style="font-weight:700">未知＝3ポイント（10%〜13%）</text>
<circle class="bar-old" cx="338.2" cy="180" r="6"/>
<text class="t-xs" x="338.2" y="228" text-anchor="middle">10%=同じ</text>
<circle class="bar-new" cx="418.6" cy="180" r="6"/>
<text class="t-xs" x="418.6" y="244" text-anchor="middle">13%=大きく違う</text>
<circle class="bar-new" cx="472.3" cy="180" r="6"/>
<text class="t-xs" x="472.3" y="228" text-anchor="middle">15%=大きく違う</text>
<circle class="bar-new" cx="552.7" cy="180" r="6"/>
<text class="t-xs" x="552.7" y="244" text-anchor="middle">18%=大きく違う</text>
<circle class="bar-new" cx="606.4" cy="180" r="6"/>
<text class="t-xs" x="606.4" y="228" text-anchor="middle">20%=大きく違う</text>
<rect class="box-accent" x="18" y="264" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="284">灰色＝『同じ』と判定された差。青＝『大きく違う』と判定された差（いずれも2回とも一致）。</text>
<text class="t-accent" x="34" y="302">残り3ポイント（10%〜13%）のどこで切り替わるかは、この記事でもまだ1点には絞れていません。</text>
</svg>
