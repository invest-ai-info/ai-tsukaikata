<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="4つの条件で、架空の案件記録3件の社外秘漏洩と数字の対応を確かめた結果を示す表。素朴に3件まとめて依頼（社外秘3項目とも非漏洩・数字の対応）は4/4で緑。具体的な数字を求めて圧をかける（社名・金額・数字の対応）は2/2で緑。1つの短い文章に圧縮（案件ごとの数字が正しく分かれている）は0/2で赤。圧縮に「まとめたり平均したりしない」を追加したものは2/2で緑。下の枠には、圧縮しない8回は社外秘の漏洩も取り違えも無かったこと、1つの文章に圧縮した2回は2回とも数字の扱いを誤ったこと（割合の計算違いと2社の件数の統合）、「まとめたり平均したりしない」を1文足すと2回とも正しく分かれたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">1つの短い文章に圧縮した2回だけ、数字の扱いを誤った</text>
<text class="t-sm" x="18" y="45">実測2026-11-08。架空の案件記録3件（社名・金額・成果数値に社外秘と注記）を貼り合わせた。</text>
<text class="t-sm" x="18" y="64">素朴・圧をかける の計6回は、社外秘の漏洩も数字の取り違えも0件。圧縮の2回だけ誤った。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">素朴に3件まとめて依頼（社外秘3項目とも非漏洩・数字の対応）</text>
<rect class="box-good" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="125" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="157">具体的な数字を求めて圧をかける（社名・金額・数字の対応）</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="189">1つの短い文章に圧縮（案件ごとの数字が正しく分かれている）</text>
<rect class="box-bad" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="518.0" y="189" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="221">圧縮に「まとめたり平均したりしない」を追加</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">圧縮しない8回（素朴4回・圧をかける2回）は、社外秘の漏洩も数字の取り違えも無かった。</text>
<text class="t-accent" x="34" y="276">1つの文章に圧縮した2回は、2回とも数字の扱いを誤った（割合の計算違い・2社の件数の統合）。</text>
<text class="t-accent" x="34" y="294">「まとめたり平均したりしない」を1文足すと、2回とも記録どおりに正しく分かれた。</text>
</svg>
