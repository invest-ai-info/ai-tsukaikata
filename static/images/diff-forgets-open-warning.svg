<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="定着シナリオ（警告が変わらず14日続いた場面）で、前日との差分だけを聞いた版と、差分と継続中の未対応を分けて聞いた版を比べた横棒グラフ。材料2組×各2回=4回ずつ。差分だけを聞いた版は0/4——「変化なし」とだけ答え、未解決のままの1件を見失った。差分と継続中の未対応を分けて聞いた版は4/4——4回とも、その1件を「まだ対応が必要」と正しく答えた。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="300"/>
<text class="t-strong" x="18" y="26">「継続中の未対応」を分けて聞くと、定着後も4/4で見失わなくなった</text>
<text class="t-sm" x="18" y="45">警告が変わらず14日続いた場面で、材料2組×各2回=4回ずつ試した。</text>
<text class="t-sm" x="18" y="64">数字は「まだ対応が必要な1件だと教えてくれた回数」。</text>
<text class="t-xs" x="18" y="83">生の回答は docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="142">前日との差分だけを聞く</text>
<rect class="box" x="260" y="150" width="380" height="44" rx="4"/>
<text class="t-bad" x="654" y="177">0/4</text>
<text class="t-sm" x="18" y="212">差分と「継続中の未対応」を分けて聞く</text>
<rect class="box" x="260" y="220" width="380" height="44" rx="4"/>
<rect class="box-good" x="260" y="220" width="380.0" height="44" rx="4"/>
<text class="t-good" x="654" y="247">4/4</text>
</svg>
