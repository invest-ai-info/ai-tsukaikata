<svg xmlns="http://www.w3.org/2000/svg" width="720" height="328" viewBox="0 0 720 328" role="img" aria-label="同じ8週間ぶんの問い合わせ受信件数の記録から、渡す長さだけを変えて「ふだんの目安」をAI自身に計算させた結果を3本の横棒で比べた図。直近2週間（14日）だけを渡すと目安は6.1件/日で、本日34件はその約5.5〜5.6倍。直近4週間（28日）を渡すと目安は5.6件/日で、本日はその約6.0倍。8週間（56日）全部を渡すと目安は4.5件/日まで下がり、本日はその約7.6倍になる。指示文は3条件とも一字一句同じで、渡したログの長さだけが違う。下の枠には、AIの自己申告した目安がどの条件でも真値（単純平均）と一致したこと（12/12）、変わったのは計算の正確さではなく「どこまでをふだんとみなすか」そのものであることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="328"/>
<text class="t-strong" x="18" y="24">同じ8週間の記録でも、見せる長さで「ふだん」の数字が変わる</text>
<text class="t-sm" x="18" y="43">問い合わせフォームの受信件数（緩やかな増加傾向あり）を2週/4週/8週に切り分け、同じ指示文でAI自身に目安を計算させた。</text>
<text class="t-sm" x="18" y="62">横棒は、AIが自分で計算した「ふだんの1日あたりの目安」（件/日）。本日の件数は3条件とも同じ34件。</text>
<text class="t-xs" x="18" y="81">渡した記録が短いほど、直近の高い週だけを拾って目安が上がり、本日の倍率は小さく出る。</text>
<text class="t-xs" x="426.0" y="120">件/日</text>
<text class="t" x="18" y="144">直近2週間（14日）ぶんだけ渡す</text>
<rect class="box-quiet" x="280.0" y="132" width="160.0" height="16" rx="3"/>
<rect class="bar-new" x="280.0" y="132" width="139.4" height="16" rx="3"/>
<text class="t-strong" x="454.0" y="144">6.1件/日</text>
<text class="t-accent" x="544.0" y="144">本日の約約5.5〜5.6倍</text>
<text class="t" x="18" y="178">直近4週間（28日）ぶんを渡す</text>
<rect class="box-quiet" x="280.0" y="166" width="160.0" height="16" rx="3"/>
<rect class="bar-new" x="280.0" y="166" width="128.0" height="16" rx="3"/>
<text class="t-strong" x="454.0" y="178">5.6件/日</text>
<text class="t-accent" x="544.0" y="178">本日の約約6.0倍</text>
<text class="t" x="18" y="212">8週間（56日）全部を渡す</text>
<rect class="box-quiet" x="280.0" y="200" width="160.0" height="16" rx="3"/>
<rect class="bar-new" x="280.0" y="200" width="102.9" height="16" rx="3"/>
<text class="t-strong" x="454.0" y="212">4.5件/日</text>
<text class="t-accent" x="544.0" y="212">本日の約約7.6倍</text>
<rect class="box-accent" x="18" y="242" width="684" height="66" rx="6"/>
<text class="t-accent" x="34" y="262">※ 指示文は3条件とも一字一句同じ。「渡すログの長さ」だけを変えた（各2回）。</text>
<text class="t-accent" x="34" y="280">AIの自己申告した目安は、どの条件でも真値（単純平均）と一致した（12/12）。</text>
<text class="t-accent" x="34" y="298">変わったのは計算の正確さではなく、「どこまでを“ふだん”とみなすか」そのもの。</text>
</svg>
