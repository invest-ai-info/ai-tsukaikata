    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="342"/>
<text class="t-strong" x="18" y="26">崩れたのはルールではなく、形式だった</text>
<text class="t-sm" x="18" y="45">毎朝の日報作成に8ルールを渡し、材料2本×2回＝4試行を独立したプロセスに送った。</text>
<text class="t-sm" x="18" y="64">版a＝会話を切らずに続ける。版b＝「引き継ぎメモを作って」に応じた返りだけを新しい会話に貼る。</text>
<text class="t-sm" x="18" y="83">版c＝対照版。8ルールの原文をそのまま新しい会話に貼りなおす。</text>
<text class="t-sm" x="18" y="102">セルの数＝4試行中に崩れた回数。0が崩れなし。</text>
<text class="t-sm" x="18" y="121">※ ①②④⑤⑥⑦・とくに1回も出番の無かった⑧（保留処理）は、どの版も4試行24／24件で崩れなかった（別枠）。</text>
<text class="t-xs" x="288.8" y="138">版a 続ける</text>
<text class="t-xs" x="427.2" y="138">版b 要約して貼る</text>
<text class="t-xs" x="578.4" y="138">版c 貼りなおす</text>
<text class="t-sm" x="18" y="172">見出しが12字を超えた</text>
<rect class="box-good" x="238" y="150" width="140" height="34" rx="4"/>
<text class="t-good" x="291.8" y="172">0／4</text>
<rect class="box-bad" x="386" y="150" width="140" height="34" rx="4"/>
<text class="t-bad" x="439.8" y="172">2／4</text>
<rect class="box-good" x="534" y="150" width="140" height="34" rx="4"/>
<text class="t-good" x="587.8" y="172">0／4</text>
<text class="t-sm" x="18" y="214">IDの通し番号を落とした</text>
<rect class="box-good" x="238" y="192" width="140" height="34" rx="4"/>
<text class="t-good" x="291.8" y="214">0／4</text>
<rect class="box-bad" x="386" y="192" width="140" height="34" rx="4"/>
<text class="t-bad" x="439.8" y="214">1／4</text>
<rect class="box-good" x="534" y="192" width="140" height="34" rx="4"/>
<text class="t-good" x="587.8" y="214">0／4</text>
<text class="t-sm" x="18" y="256">合計の後に新しい話題を足した</text>
<rect class="box-bad" x="238" y="234" width="140" height="34" rx="4"/>
<text class="t-bad" x="291.8" y="256">1／4</text>
<rect class="box-bad" x="386" y="234" width="140" height="34" rx="4"/>
<text class="t-bad" x="439.8" y="256">3／4</text>
<rect class="box-good" x="534" y="234" width="140" height="34" rx="4"/>
<text class="t-good" x="587.8" y="256">0／4</text>
<text class="t-bad" x="18" y="305">※「見出しが12字を超えた」の2回は39字・21字——上限の2〜3倍だった。</text>
<text class="t-xs" x="18" y="326">架空データでの実測。生の返り16通は docs/evidence/ に全文置いてある。</text>
</svg>
