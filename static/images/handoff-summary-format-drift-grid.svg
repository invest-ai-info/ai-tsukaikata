<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" role="img" aria-label="毎朝の日報作成に8ルールを渡した実測で、版ごとに何回崩れたかを示すマス目。見出しが12字を超えたのは版aで0/4・版bで2/4・版cで0/4。IDの通し番号を落としたのは版aで0/4・版bで1/4・版cで0/4。合計の後に新しい話題を足したのは版aで1/4・版bで3/4・版cで0/4。1回も出番の無かったルール⑧（保留処理）は、どの版も4試行24/24件で崩れなかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
