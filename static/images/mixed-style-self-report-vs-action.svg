<svg xmlns="http://www.w3.org/2000/svg" width="720" height="546" viewBox="0 0 720 546" role="img" aria-label="同じ2本の見本（くだけた・硬い）を渡した2つの頼み方の結果を示す図。上段＝書く前に「どちらの文体を使うか、一言で確認して」と頼むと、「1つ目（くだけた調）で書く」と申告した（2回中2回）。下段＝確認させずに2本の見本を渡してそのまま書かせると、実際には2つ目（硬い調）で書いた（6回中6回。見本の順番を入れ替えても同じ）。下の枠には、申告どおりに書かれたのは0/2であること、AIの自己申告は実際の挙動の証明にはならないことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="546"/>
<text class="t-strong" x="18" y="26">確認させると「くだけた」と言うのに、実際は「硬い」で書く</text>
<text class="t-sm" x="18" y="45">同じ2本の見本（くだけた・硬い）を渡した、2つの頼み方の結果。</text>
<text class="t-sm" x="18" y="64">上は書く前に選んだ側を答えさせた回、下は答えさせずに直接書かせた回。</text>
<rect class="box" x="18" y="108" width="648" height="56" rx="6"/>
<text class="t" x="34" y="132">書く前に「どちらの文体を使うか、一言で確認して」と頼む</text>
<path class="line" d="M42 164 L42 178"/>
<rect class="box-accent" x="18" y="178" width="648" height="56" rx="6"/>
<text class="t-accent" x="34" y="202" style="font-weight:700">「1つ目（くだけた調）で書く」と申告した（2/2）</text>
<rect class="box" x="18" y="290" width="648" height="56" rx="6"/>
<text class="t" x="34" y="314">確認させずに、2本の見本を渡してそのまま書かせる</text>
<path class="line" d="M42 346 L42 360"/>
<rect class="box-bad" x="18" y="360" width="648" height="56" rx="6"/>
<text class="t-bad" x="34" y="384" style="font-weight:700">実際には2つ目（硬い調）で書いた（6/6＝順番を入れ替えても同じ）</text>
<rect class="box-accent" x="18" y="478" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="498">申告どおりに書かれたのは0/2。確認させた回答と、実際に書かせた回の結果は一致しなかった。</text>
<text class="t-accent" x="34" y="516">AIの「こうします」という自己申告は、同じ条件での実際の挙動の証明にはならない（台帳100番・146番の系列）。</text>
</svg>
