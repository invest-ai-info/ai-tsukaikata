<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" role="img" aria-label="Kindleダイレクトパブリッシングで、4つの作業パターンについて申告が必要か不要かをAIに4通りの聞き方（率を貼らずに聞く2回・原文を貼って聞く2回）で聞いた結果の格子図。AIに本文を書かせて自分で大幅に編集した場合は申告が必要、自分で本文を書きAIには校正だけしてもらった場合は申告不要、AIにアイデア出しを手伝ってもらい最終的な文章はすべて自分で書いた場合は申告不要、表紙の画像をAIで生成した場合は申告が必要というのが原文の線であり、4通りの聞き方すべてで、4つの場面すべての判定が原文の線と一致した。合計16判定中16判定が一致。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="336"/>
<text class="t-strong" x="18" y="26">4つの場面×4通りの聞き方＝16判定。全16判定が原文の線と一致</text>
<text class="t-sm" x="18" y="45">真値（KDPコンテンツガイドライン・2026-08-25確認）＝①要申告 ②不要 ③不要 ④要申告。</text>
<text class="t-sm" x="18" y="64">「大幅に編集した」①も、4回とも正しく「要申告」側に判定した。</text>
<text class="t-xs" x="267" y="98" text-anchor="middle">① </text>
