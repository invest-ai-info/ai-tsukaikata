<text class="t-strong" x="18" y="26">そろうかどうかは、費目が「メモの中で決まるか」で分かれた</text>
<text class="t-sm" x="18" y="45">3か月とも1文字も同じ文字列で出てくる行を、材料2本に5件ずつ仕込んだ。◆の数＝2回のうち、3か月とも同じ費目に入った回の数。</text>
<text class="t-sm" x="18" y="64">青い見出しの2行は、メモを読めば費目が決まる行。黒い3行は、決めるのが自分しかいない行。</text>
