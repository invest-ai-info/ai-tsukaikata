<svg xmlns="http://www.w3.org/2000/svg" width="720" height="528" viewBox="0 0 720 528" role="img" aria-label="3か月とも同じ文字列で出てくる10件の行が、4通りの頼み方でどれだけ月をまたいで同じ費目に入ったかを並べた表。ひとつの枠の◆の数が、2回のうち3か月ともそろった回の数を表す。電気料金・ガス・交通系ICのチャージという、メモを読めば費目が決まる4行は、そのまま頼んだ回でも8回中8回そろった。コピー代・文庫本・のど飴とマスク・収納ケース・子どもの上履き・カフェでの作業という6行は、そのまま頼むと12回中11回がずれた。費目の一覧を固定すると多くがそろいはじめ、こちらが対応表を渡した列では10行すべてが2回とも3か月そろっている。そろうかどうかを分けたのは、費目がメモの中で決まるか、決めるのが自分しかいないかだった。">
