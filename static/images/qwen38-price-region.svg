<text class="t-xs" x="178" y="187">入力</text>
<rect class="bar-in" x="210" y="176" width="104.1" height="15" rx="2"/>
<text class="t-sm" x="322.1" y="188">12元</text>
<text class="t-xs" x="178" y="207">出力</text>
<rect class="bar-out" x="210" y="196" width="312.2" height="15" rx="2"/>
<text class="t-sm" x="530.2" y="208">36元</text>
<text class="t" x="18" y="243">バージニア</text>
<text class="t-xs" x="178" y="242">入力</text>
<rect class="bar-in" x="210" y="231" width="104.1" height="15" rx="2"/>
<text class="t-sm" x="322.1" y="243">12元</text>
<text class="t-xs" x="178" y="262">出力</text>
<rect class="bar-out" x="210" y="251" width="312.2" height="15" rx="2"/>
<text class="t-sm" x="530.2" y="263">36元</text>
<text class="t" x="18" y="298">シンガポール</text>
<text class="t-xs" x="178" y="297">入力</text>
<rect class="bar-in" x="210" y="286" width="130.0" height="15" rx="2"/>
<text class="t-sm" x="348.0" y="298">14.988元</text>
<text class="t-xs" x="178" y="317">出力</text>
<rect class="bar-out" x="210" y="306" width="390.0" height="15" rx="2"/>
<text class="t-sm" x="608.0" y="318">44.965元</text>
<text class="t-xs" x="18" y="361">※ シンガポールだけ表の「服务部署范围」が国际で、ほかの4か所は全球と書かれています。</text>
<text class="t-xs" x="18" y="379">※ 前の世代 qwen3.7-max は、同じ表で原価12元に「限时5折」が付いています。</text>
<text class="t-xs" x="18" y="397">※ 元とドルは、出典のどこにも換算レートが書かれていないので換算していません。</text>
