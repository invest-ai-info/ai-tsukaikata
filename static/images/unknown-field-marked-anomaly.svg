<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" role="img" aria-label="あとから足した監視項目の列が無い古い記録を、AIが誤って「異常」に分類した件数を、指示文の版ごとに12本の横棒で示した図。無指定のまま頼った版は、材料Aの1・2回目と材料Bの1回目は0件だったが、材料Bの2回目だけ、列が無い5件の全部を「異常」に分類した（4回中1回）。無指定に「判定の根拠も一言添えて」を足した版は、材料Aの1・2回目と材料Bの2回目の3回で5件全部を「異常」に分類し、材料Bの1回目だけ0件だった（4回中3回に悪化）。「記録が無い項目はまだ分からないとして分けて」と明示した版は、材料A・材料Bとも1・2回目すべてで0件だった。誤って「正常」に含めた件数は、12回を通じて0件だった。真値は0件である。">
