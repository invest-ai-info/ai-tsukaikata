<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="IT導入支援事業者に個人事業主が単独で登録できるかをAIに3回聞いた結果を並べた表。上5行は原文と一致した回数で、単独登録はできない（法人のみ）と述べたのが3/3、コンソーシアムの構成員なら関われると述べたのが3/3、補助を受ける側（申請者）にはなれると述べたのが3/3、申請代行は不正扱いに触れたのが3/3、登録要領で確認をと断ったのが3/3で、いずれも緑。下1行は開いた原文に無い細目（gBizID・決算書など）を足した回数で3/3の赤。下の枠には、構造は3/3で原文と一致したこと、3回とも細目を足したが担当が開いた2ページには無く正しいかは登録要領で確かめること、関われるかはAIに聞いてよいが何が要るかは年度の登録要領を開くことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">「個人で単独登録は不可・構成員なら可」は3回とも当たった。細目は原文で確かめていない</text>
<text class="t-sm" x="18" y="45">実測2026-09-18。ウェブ検索を切ったAI（独立実行）に「個人事業主として単独で登録できますか」と3回。原文は支援事業者ページ。</text>
<text class="t-sm" x="18" y="64">上5行＝原文と一致した回数（多いほど良い）。下1行＝開いた原文には無い細目を足した回数（少ないほど良い）。</text>
<text class="t-xs" x="498.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">単独登録＝できない（法人のみ）と述べた</text>
<rect class="box-good" x="418" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="498.0" y="125" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="157">コンソーシアムの構成員なら関われると述べた</text>
<rect class="box-good" x="418" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="498.0" y="157" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="189">補助を受ける側（申請者）にはなれると述べた</text>
<rect class="box-good" x="418" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="498.0" y="189" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="221">「申請代行は不正扱い」に触れた</text>
<rect class="box-good" x="418" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="498.0" y="221" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="253">「登録要領で確認を」と断った</text>
<rect class="box-good" x="418" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="498.0" y="253" text-anchor="middle" style="font-weight:700">3/3</text>
<text class="t" x="18" y="285">開いた原文に無い細目（gBizID・決算書など）を足した</text>
<rect class="box-bad" x="418" y="264" width="160" height="26" rx="4"/>
<text class="t-bad" x="498.0" y="285" text-anchor="middle" style="font-weight:700">3/3</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">構造（単独不可・構成員のみ）は3/3。ここはAIに聞いても原文と一致した。</text>
<text class="t-accent" x="34" y="340">ただし3回とも gBizID や決算書などの細目を足した。開いた2ページには無く、正しいかは登録要領で確かめる。</text>
<text class="t-accent" x="34" y="358">「関われるか」はAIに聞いてよい。「何が要るか」は年度の登録要領を開く。</text>
</svg>
