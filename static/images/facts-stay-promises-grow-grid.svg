<rect class="bg" x="0" y="0" width="720" height="576"/>
<text class="t-strong" x="18" y="26">増えたのは10回中1回だけ。しかも増えたのは約束欄だった</text>
<text class="t-sm" x="18" y="45">架空の応募文（実績欄・抱負欄）と架空の謝罪文（経緯欄・今後の対応欄）に、独立した10回で「読みやすく整えて」とだけ頼んだ。</text>
<text class="t-sm" x="18" y="64">元の数字（6年3か月・75回・32社・47件など）は10回とも1つも欠けず、新しい数字も1つも出てこなかった。</text>
<text class="t-sm" x="18" y="83">変化が起きたのは謝罪文の5回目だけ。「このたびの事態を重く受け止め、」が今後の対応欄に足された。</text>
<text class="t-xs" x="130.0" y="118">事実欄に新しい記述</text>
<text class="t-xs" x="313.0" y="118">約束欄に新しい記述</text>
<text class="t-xs" x="496.0" y="118">元の数字はすべて残ったか</text>
