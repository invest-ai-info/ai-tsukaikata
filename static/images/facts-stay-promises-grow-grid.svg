<svg xmlns="http://www.w3.org/2000/svg" width="720" height="576" viewBox="0 0 720 576" role="img" aria-label="架空の応募文5回・架空の謝罪文5回、合計10回に「読みやすく整えて」とだけ頼み、事実欄への追加・約束欄への追加・元の数字が全部残ったかを回ごとに並べたマス目。事実欄への新しい記述は10回とも0件で、元の数字も10回とも4個または4個すべて残った。約束欄への新しい記述は、謝罪文の5回目だけ1件だった。">
<style>
