<svg xmlns="http://www.w3.org/2000/svg" width="720" height="348" viewBox="0 0 720 348" role="img" aria-label="リアルタイム音声モデルの有無・動画アバター出力・独自アバターの作りやすさを3社で比べた表。リアルタイム音声モデル＝Geminiは3.8 Live / 3.8 Live Extended Thinkingあり、GPTはGPT-Live 1あり（頭脳は別モデル）、Claudeは記載なし。動画のアバター出力＝Geminiはあり（Live Avatar・Gemini Enterprise限定）、GPTは記載なし（音声の入出力のみ）、Claudeは—。独自アバターを作れるか＝Geminiは企業の許可制（アローリスト経由のみ）、GPTは—、Claudeは—。「記載なし」「—」は機能が無いと明言されているのではなく、公式ページに書かれていない意味。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="348"/>
<text class="t-strong" x="18" y="26">動画のアバターを出せるのは、3社のうちGeminiだけ</text>
<text class="t-sm" x="18" y="45">各社の公式ページ（発表・料金・モデル一覧）に書かれている範囲だけを並べた。</text>
<text class="t-sm" x="18" y="64">Geminiの動画アバターも、使えるのはGemini Enterprise経由に限られる。</text>
<text class="t-sm" x="18" y="83">「記載なし」「—」は機能が無いと明言されているのではなく、公式ページに書かれていない意味。</text>
<text class="t-accent" x="134.0" y="124">Gemini（Google）</text>
<text class="t-accent" x="328.0" y="124">GPT（OpenAI）</text>
<text class="t-accent" x="522.0" y="124">Claude（Anthropic）</text>
<text class="t-sm" x="18" y="158.0">リアルタイム
音声モデ</text>
<text class="t-sm" x="18" y="173.0">ル</text>
<rect class="box-accent" x="126.0" y="138" width="188.0" height="52" rx="4"/>
<text class="t-accent" x="134.0" y="158">3.8 Live / 3.8 Live</text>
<text class="t-accent" x="134.0" y="174">Extended Thinking</text>
<rect class="box-quiet" x="320.0" y="138" width="188.0" height="52" rx="4"/>
<text class="t-sm" x="328.0" y="158">GPT-Live 1</text>
<text class="t-sm" x="328.0" y="174">（頭脳は別モデル）</text>
<rect class="box-bad" x="514.0" y="138" width="188.0" height="52" rx="4"/>
<text class="t-bad" x="522.0" y="158">記載なし</text>
<text class="t-sm" x="18" y="220.0">動画のアバター出力</text>
<rect class="box-accent" x="126.0" y="200" width="188.0" height="52" rx="4"/>
<text class="t-accent" x="134.0" y="220">あり（Live Avatar）</text>
<text class="t-accent" x="134.0" y="236">Gemini Enterprise限定</text>
<rect class="box-quiet" x="320.0" y="200" width="188.0" height="52" rx="4"/>
<text class="t-sm" x="328.0" y="220">記載なし</text>
<text class="t-sm" x="328.0" y="236">（音声の入出力のみ）</text>
<rect class="box-bad" x="514.0" y="200" width="188.0" height="52" rx="4"/>
<text class="t-bad" x="522.0" y="220">—</text>
<text class="t-sm" x="18" y="282.0">独自アバターを作れるか</text>
<rect class="box-accent" x="126.0" y="262" width="188.0" height="52" rx="4"/>
<text class="t-accent" x="134.0" y="282">企業の許可制</text>
<text class="t-accent" x="134.0" y="298">（アローリスト経由のみ）</text>
<rect class="box-quiet" x="320.0" y="262" width="188.0" height="52" rx="4"/>
<text class="t-sm" x="328.0" y="282">—</text>
<rect class="box-bad" x="514.0" y="262" width="188.0" height="52" rx="4"/>
<text class="t-bad" x="522.0" y="282">—</text>
</svg>
