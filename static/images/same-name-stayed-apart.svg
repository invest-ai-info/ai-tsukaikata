<rect class="bg" x="0" y="0" width="720" height="302"/>
<text class="t-strong" x="18" y="24">似た項目を1つに畳んでしまった回数は、38回を通じて0回だった</text>
<text class="t-sm" x="18" y="43">架空の在庫アラート・取引先請求一覧で、名前や文言は同じでも別々に扱うべき組み合わせ（店舗違い・別会社）を仕込んだ。</text>
<text class="t-sm" x="18" y="62">縦軸は、その組み合わせを1つに畳んでしまった回数（真値0）。「まとめて」と頼んでも、指示していなくても畳まれなかった。</text>
<text class="t-xs" x="18" y="81">①は店舗コード×商品名、または取引先名×住所のように、区別できる情報が全部の行に書かれている場合。</text>
<text class="t-xs" x="18" y="100">②③は取引先名の名寄せで、住所という決め手が一部または全部の行に無い場合。</text>
<text class="t" x="18" y="146">① 区別できる手がかりが全部の行にある（店舗コード・住所など）</text>
<rect class="box-quiet" x="400.0" y="134" width="120.0" height="16" rx="3"/>
<text class="t-accent" x="532.0" y="146">0/30</text>
<text class="t" x="18" y="186">② 手がかりが一部の行だけ無い（住所不明1件を混入）</text>
<rect class="box-quiet" x="400.0" y="174" width="120.0" height="16" rx="3"/>
<text class="t-accent" x="532.0" y="186">0/4</text>
<text class="t" x="18" y="226">③ 手がかりが全部の行で無い（住所欄そのものが無い一覧）</text>
<rect class="box-quiet" x="400.0" y="214" width="120.0" height="16" rx="3"/>
<text class="t-accent" x="532.0" y="226">0/4</text>
<path class="line" d="M400.0 126 L400.0 228" stroke-dasharray="4 3"/>
<text class="t-sm" x="18" y="260">※ 帯はすべて0〜3回の目盛り。3行とも右端まで空欄のまま。</text>
<text class="t-xs" x="18" y="279">架空データでの実測（①②③あわせて材料6本・のべ38回）。生の回答はdocs/evidence/ に全文置いてある。</text>
</svg>
