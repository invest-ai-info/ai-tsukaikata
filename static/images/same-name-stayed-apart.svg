<svg xmlns="http://www.w3.org/2000/svg" width="720" height="302" viewBox="0 0 720 302" role="img" aria-label="似た名前・似た文言の項目を、AIが誤って1つに畳んでしまった回数を、難易度別に3本の横棒で示した図。①区別できる手がかり（店舗コード・住所など）が全部の行にある場合は、店舗コード×商品名の実験16回と取引先名×住所の実験14回をあわせた30回のうち0回。②取引先名の名寄せで住所欄が1件だけ無い場合は4回のうち0回。③住所欄がまるごと無い一覧でも4回のうち0回。3本とも右端まで空欄で、38回を通じて誤って畳んだ回数は0回だった。">
<style>
