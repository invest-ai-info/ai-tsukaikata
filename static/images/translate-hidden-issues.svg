<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" role="img" aria-label="訳したあとに残る問題を5種類に分けた図。用語の揺れ（workspace と work area が別の日本語になる）、足された助言（原文に無い「おすすめします」が1文増える）、日付の断定（3/4/2026 を確認せずに1つの日付に決める）、時差の換算（9:00 AM PT の換算が1時間ずれる）の4つは、訳文だけを読んでも見えない。文体の混在（です・ます体と体言止めが混ざる）だけは読めば気づく。上の4つは訳文だけが手元にある人には見つけられず、原文を持っている人が確かめる作業になる。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="404"/>
<text class="t-strong" x="18" y="26">訳したあとに残るものは、5つのうち4つが訳文からは見えない</text>
<text class="t-sm" x="18" y="45">日本語として読みやすいかを確かめても素通りします。原文と並べないと出てきません。</text>
<rect class="box-bad" x="18" y="84" width="132" height="46" rx="6"/>
<text class="t-bad" x="32" y="112">用語の揺れ</text>
<rect class="box-quiet" x="166" y="84" width="330" height="46" rx="6"/>
<text class="t" x="180" y="112">workspace と work area が別の日本語になる</text>
<text class="t-bad" x="512" y="112">訳文からは見えない</text>
<rect class="box-bad" x="18" y="142" width="132" height="46" rx="6"/>
<text class="t-bad" x="32" y="170">足された助言</text>
<rect class="box-quiet" x="166" y="142" width="330" height="46" rx="6"/>
<text class="t" x="180" y="170">原文に無い「おすすめします」が1文増える</text>
<text class="t-bad" x="512" y="170">訳文からは見えない</text>
<rect class="box-bad" x="18" y="200" width="132" height="46" rx="6"/>
<text class="t-bad" x="32" y="228">日付の断定</text>
<rect class="box-quiet" x="166" y="200" width="330" height="46" rx="6"/>
<text class="t" x="180" y="228">3/4/2026 を確認せずに1つの日付に決める</text>
<text class="t-bad" x="512" y="228">訳文からは見えない</text>
<rect class="box-bad" x="18" y="258" width="132" height="46" rx="6"/>
<text class="t-bad" x="32" y="286">時差の換算</text>
<rect class="box-quiet" x="166" y="258" width="330" height="46" rx="6"/>
<text class="t" x="180" y="286">9:00 AM PT の換算が1時間ずれる</text>
<text class="t-bad" x="512" y="286">訳文からは見えない</text>
<rect class="box-accent" x="18" y="316" width="132" height="46" rx="6"/>
<text class="t-accent" x="32" y="344">文体の混在</text>
<rect class="box-quiet" x="166" y="316" width="330" height="46" rx="6"/>
<text class="t" x="180" y="344">です・ます体と体言止めが混ざる</text>
<text class="t-sm" x="512" y="344">読めば気づく</text>
<text class="t-xs" x="18" y="390">※ 上の4つは、訳文だけが手元にある人には見つけられません。原文を持っている人が確かめる作業です。</text>
</svg>
