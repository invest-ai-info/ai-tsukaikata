<svg xmlns="http://www.w3.org/2000/svg" width="720" height="572" viewBox="0 0 720 572" role="img" aria-label="Opus 5 と Opus 5.5 の点数を比べた横棒グラフ。Terminal-Bench 4.0 は52.3％から66.4％、FrontierCode v1.1 は48.0％から54.4％、CursorBench 4.0 は46.6％から57.8％、AutomationBench は26.9％から40.0％、Humanity’s Last Exam の道具ありは63.6％から67.7％、Terminal-Bench-Science 0.1 は29.0％から58.7％、OSWorld 2.0 の部分点ありは74.0％から81.8％、Chartography の道具ありは83.4％から89.0％。AutomationBench は Zapier が、それ以外は Anthropic が自社で測った値で、テストの中身も測り方も別々のため平均は取れない。">
<style>
