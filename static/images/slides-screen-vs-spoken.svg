<svg xmlns="http://www.w3.org/2000/svg" width="720" height="394" viewBox="0 0 720 394" role="img" aria-label="スライドの骨子を作らせた実測の比較図。素材は箇条書き14件の発表メモで、持ち時間は15分。「15分の発表用に構成を作って」とだけ頼むと、枚数は18枚、画面に出る文字は平均63字、40字を超えた枚が18枚中15枚、口で言うことは画面と分かれておらず、裏を取れていない他社の話も画面に載った。枚数と画面の字数と口頭の分離を指定すると、枚数は9枚、画面の文字は平均17字、40字超は9枚中0枚、口で言うことは画面の3.9倍になり、裏を取れていない話は画面から外れた。発表は書いてあることを読むものではないので、口で言うことのほうが多くなるのが正しい。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="394"/>
<text class="t-strong" x="18" y="26">同じ素材・同じ15分。頼み方だけを変えて測った</text>
<text class="t-sm" x="18" y="45">素材は箇条書き14件の発表メモ。判定はすべて機械（文字数と枚数を数えた）。</text>
<text class="t-xs" x="210" y="88">「15分の発表用に構成を作って」</text>
<text class="t-xs" x="400" y="88">枚数・字数・口頭を指定</text>
<text class="t-sm" x="18" y="125">枚数（15分）</text>
<rect class="box-quiet" x="202" y="100" width="168" height="40" rx="6"/>
<text class="t-bad" x="214" y="125">18枚</text>
<rect class="box-good" x="392" y="100" width="168" height="40" rx="6"/>
<text class="t-good" x="404" y="125">9枚</text>
<text class="t-sm" x="18" y="177">画面に出る字（平均）</text>
<rect class="box-quiet" x="202" y="152" width="168" height="40" rx="6"/>
<text class="t-bad" x="214" y="177">63字</text>
<rect class="box-good" x="392" y="152" width="168" height="40" rx="6"/>
<text class="t-good" x="404" y="177">17字</text>
<text class="t-sm" x="18" y="229">40字を超えた枚</text>
<rect class="box-quiet" x="202" y="204" width="168" height="40" rx="6"/>
<text class="t-bad" x="214" y="229">18枚中15枚</text>
<rect class="box-good" x="392" y="204" width="168" height="40" rx="6"/>
<text class="t-good" x="404" y="229">9枚中0枚</text>
<text class="t-sm" x="18" y="281">口で言うこと</text>
<rect class="box-quiet" x="202" y="256" width="168" height="40" rx="6"/>
<text class="t-bad" x="214" y="281">分かれていない</text>
<rect class="box-good" x="392" y="256" width="168" height="40" rx="6"/>
<text class="t-good" x="404" y="281">画面の3.9倍</text>
<text class="t-sm" x="18" y="333">裏を取れていない話</text>
<rect class="box-quiet" x="202" y="308" width="168" height="40" rx="6"/>
<text class="t-bad" x="214" y="333">画面に載る</text>
<rect class="box-good" x="392" y="308" width="168" height="40" rx="6"/>
<text class="t-good" x="404" y="333">画面から外す</text>
<text class="t-xs" x="18" y="380">※ 口で言うことが画面の3.9倍。発表は「書いてあることを読む」ものではないので、この差が出るのが正しい。</text>
</svg>
