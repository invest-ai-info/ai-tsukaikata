<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="P1とP4が同時に停止した同じログに「いちばん異常な処理はどれですか」と1つだけ尋ねた結果を示す図。1回目・2回目とも、見出しの答えは「いちばん異常なのはprocess=P4です」で、頻度の高いP4だけを名指ししている。本文ではP4について実行頻度・パターンの変化・4日間の欠落を理由に挙げている。P1についても本文の後半で「P1も9/10〜9/13は動いていない」と触れているが、見出しの答えには出てこない。下の枠には、P1の停止は本文から消えてはいないが見出しの答えには出ないこと、見出しだけを読む・見出しだけを後段に渡す使い方ではP1の停止が伝わらないことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">「いちばん異常な処理は」と1つだけ尋ねると、見出しは1本に絞られる</text>
<text class="t-sm" x="18" y="45">P1とP4が同時に停止した同じログに、単数形の尋ね方で2回試した結果。</text>
<text class="t-sm" x="18" y="100">1回目・2回目とも同じ形だった：</text>
<rect class="box-bad" x="18" y="116" width="684" height="48" rx="6"/>
<text class="t-strong" x="34" y="136">見出しの答え</text>
<text class="t-bad" x="34" y="154">「いちばん異常なのは process=P4 です」（2回とも）</text>
<rect class="box-good" x="18" y="176" width="684" height="48" rx="6"/>
<text class="t-strong" x="34" y="196">本文のP4の扱い</text>
<text class="t-good" x="34" y="214">頻度・実行パターン・4日間の欠落を理由に挙げる（2回とも）</text>
<rect class="box-bad" x="18" y="236" width="684" height="48" rx="6"/>
<text class="t-strong" x="34" y="256">本文のP1の扱い</text>
<text class="t-bad" x="34" y="274">「P1も9/10〜9/13は動いていない」と後半で触れるだけ（2回とも）</text>
<rect class="box-accent" x="18" y="302" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="322">⚠️ P1の停止は本文から消えてはいない。ただし見出しの答えには出ない。</text>
<text class="t-accent" x="34" y="340">⚠️ 見出しだけを読む・見出しだけを後段に渡す使い方では、P1の停止が伝わらない。</text>
</svg>
