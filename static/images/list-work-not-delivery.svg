<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-label="自分で集めた候補25件を条件で仕分けた図。3条件とも○にできたのが7件、従業員数が空欄で自分が確かめることになるのが11件、重複の疑いが1件、条件から外れるのが6件。発注が求めた20件目の位置は、条件から外れる6件の中に入ってしまう。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="370"/>
<text class="t-strong" x="18" y="26">「20件そろえて」と言われた仕事。条件を○にできたのは 7件だった</text>
<text class="t-sm" x="18" y="45">架空の候補25行を渡して、同じ指示文を3回。3回とも同じ7件・11件・6件・重複1件に割れた。</text>
<text class="t-sm" x="18" y="64">3回とも「20件は作れません」と断り、数をそろえるために条件外を混ぜた回は0回。</text>
<text class="t-bad" x="415.2" y="88">発注が求めた20件目 → ここ</text>
<path class="line" d="M565.2 94 L565.2 170" stroke-dasharray="4 3"/>
<rect class="bar-new" x="18.0" y="122" width="191.5" height="40" rx="3"/>
<text class="t-xs" x="101.8" y="147">7件</text>
<rect class="bar-in" x="209.5" y="122" width="301.0" height="40" rx="3"/>
<text class="t-xs" x="348.0" y="147">11件</text>
<rect class="bar-old" x="510.5" y="122" width="27.4" height="40" rx="3"/>
<text class="t-xs" x="512.2" y="147">1件</text>
<rect class="bar-old" x="537.8" y="122" width="164.2" height="40" rx="3"/>
<text class="t-xs" x="607.9" y="147">6件</text>
<text class="t-accent" x="18" y="202">確かめられた　7件</text>
<text class="t-sm" x="200" y="202">3条件とも○。このまま出せる</text>
<text class="t-accent" x="18" y="226">自分で確かめる　11件</text>
<text class="t-sm" x="200" y="226">従業員数が空欄。○とも×とも言えない</text>
<text class="t-accent" x="18" y="250">重複の疑い　1件</text>
<text class="t-sm" x="200" y="250">同じ社名の表記ゆれ</text>
<text class="t-accent" x="18" y="274">条件から外れる　6件</text>
<text class="t-sm" x="200" y="274">100人超3件・別業種2件・関東外1件</text>
<text class="t-xs" x="18" y="310">※ 7件＋11件＝18件。全部が100人以下だったとしても、20件には届かない。</text>
<text class="t-bad" x="18" y="332">※ 値打ちは「20件が7件に減ったこと」ではない。11件が自分の作業として残ったこと。</text>
<text class="t-xs" x="18" y="354">架空データでの実測。指示文ごとの生の返りは docs/evidence/ に置いてある。</text>
</svg>
