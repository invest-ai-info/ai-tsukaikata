<svg xmlns="http://www.w3.org/2000/svg" width="720" height="388" viewBox="0 0 720 388" role="img" aria-label="GPT-5.6 Sol/Luna から GPT-6 Sol/Luna への単価の変化を示す横棒グラフ。100万トークンあたりのドル。薄い灰＝前世代（GPT-5.6）、濃い青＝新モデル（GPT-6）。Sol の入力は4.00ドルから2.00ドルへ50%減、Sol の出力は20.00ドルから10.00ドルへ50%減。Luna の入力は0.20ドルから0.10ドルへ50%減、Luna の出力は1.20ドルから0.50ドルへ58%減。Sol は入力・出力とも正確に半額だが、Luna の出力は半額を超えて下がっている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="388"/>
<text class="t-strong" x="18" y="26">Sol も Luna も、前世代よりおおむね半額</text>
<text class="t-sm" x="18" y="45">薄い灰＝前世代（GPT-5.6）、濃い青＝新モデル（GPT-6）。100万トークンあたりのドル。</text>
<text class="t-sm" x="18" y="64">Sol は入力・出力とも正確に半額。Luna は入力が半額、出力はそれ以上（58.3%減）下がっている。</text>
<text class="t-sm" x="18" y="83">※ Sol とLuna は目盛りの縮尺が違う（Luna の値が小さいため）。</text>
<text class="t" x="18" y="108">Sol 入力</text>
<text class="t-xs" x="18" y="124">50%減</text>
