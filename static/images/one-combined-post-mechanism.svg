<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-label="同じ3件の案件記録を、依頼の形だけで比べる図。上段＝通常の圧縮依頼（「1つの短い文章にまとめて」）。1回目は案件B（約28.6%の変化）を「約4割」と計算を誤り、2回目は「問い合わせ件数」が成果の2社のうち1社の数字がもう1社の数字に吸収されて消えた。下段＝「まとめたり平均したりしない」を追加した依頼。2回とも、3件の数字（45→32・14%→18%・12→3）を生の値のまま正しい会社に対応させた。下の枠には、崩れたのは社外秘の漏洩ではなく複数の数字を短い文章へ押し込む段階であったこと、動作そのもの（まとめる・平均する）を名指しして止める一文が2回とも効いたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="370"/>
<text class="t-strong" x="18" y="26">圧縮の依頼を変えるだけで、数字の扱いが変わった</text>
<text class="t-sm" x="18" y="45">同じ3件の案件記録（社外秘注記つき）を「1つの短い文章に」という依頼で2通り比べた。</text>
<text class="t-sm" x="18" y="64">社外秘の漏洩は、どちらの依頼でも0件だった。</text>
<rect class="box-bad" x="18" y="112" width="684" height="82" rx="6"/>
<text class="t-strong" x="34" y="134">通常の圧縮依頼（「1つの短い文章にまとめて」）</text>
<text class="t-bad" x="34" y="154">1回目: 案件B（約28.6%の変化）を「約4割」と計算を誤った。</text>
<text class="t-bad" x="34" y="172">2回目: 「問い合わせ件数」が成果の2社のうち、1社の数字がもう1社の数字に吸収されて消えた。</text>
<rect class="box-good" x="18" y="204" width="684" height="82" rx="6"/>
<text class="t-strong" x="34" y="226">「まとめたり平均したりしない」を追加</text>
<text class="t-good" x="34" y="246">2回とも、3件の数字（45→32・14%→18%・12→3）を生の値のまま正しい会社に対応させた。</text>
<text class="t-good" x="34" y="264">割合への換算そのものをやめたことで、計算違いも吸収も起きなかった。</text>
<rect class="box-accent" x="18" y="302" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="322">崩れたのは社外秘の漏洩ではなく、複数の数字を短い文章へ押し込む段階だった。</text>
<text class="t-accent" x="34" y="340">動作そのもの（まとめる・平均する）を名指しして止める一文が、2回とも効いた。</text>
</svg>
