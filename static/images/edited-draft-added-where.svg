<svg xmlns="http://www.w3.org/2000/svg" width="720" height="446" viewBox="0 0 720 446" role="img" aria-label="欄が二つに分かれた下書きをAIに整えさせたとき、事実の欄と約束の欄にそれぞれ何件足されたかを並べた横棒グラフ。架空の応募文（実績の欄と抱負の欄）と架空の謝罪文（経緯の欄と今後の対応の欄）に、「読みやすく整えてください。」だけを各5回、合わせて10回通した。数えたのは、原稿に一語も無いことを先に確かめた約束語24語と詫びの語9語、および原稿に無い数字の、のべ件数。応募文の5回は、事実の欄も約束の欄も0件。謝罪文の5回は、事実の欄が0件で、約束の欄だけが7件。内訳は再発防止が4回、徹底が1回、申し訳が1回、ご迷惑が1回。書いていないことは足さないでと一文を足した4回は、両方の欄とも0件。足した文の欄を作らせた4回も、両方とも0件。事実欄は1文字も変えるなと指定した4回も、両方とも0件。事実の欄は、追加も欠落も全回0件で、事実欄の数字が1つでも消えた回は0回だった。">
<style>
