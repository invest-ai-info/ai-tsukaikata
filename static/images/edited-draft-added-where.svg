</style>
<rect class="bg" x="0" y="0" width="720" height="446"/>
<text class="t-strong" x="18" y="26">整えさせても数字は動かない。増えるのは約束の欄だけだった</text>
<text class="t-sm" x="18" y="45">欄が二つに分かれた架空の下書き2本（応募文＝実績／抱負、謝罪文＝経緯／今後の対応）に、「読みやすく整えてください。」だけを各5回。</text>
<text class="t-sm" x="18" y="64">数えたのは、原稿に一語も無いことを先に確かめた約束語24語・詫びの語9語と、原稿に無い数字の、のべ件数。</text>
<text class="t-sm" x="18" y="83">事実の欄は、追加も欠落も全回0件。事実欄の数字が1つでも消えた回も0回。</text>
<rect class="bar-old" x="18" y="97" width="14" height="11" rx="2"/>
<text class="t-xs" x="38" y="106">事実の欄に足された件数</text>
<rect class="bar-new" x="18" y="114" width="14" height="11" rx="2"/>
<text class="t-xs" x="38" y="123">約束の欄に足された件数</text>
<text class="t-xs" x="328" y="138" text-anchor="middle">0</text>
<text class="t-xs" x="468" y="138" text-anchor="middle">4</text>
<text class="t-xs" x="608" y="138" text-anchor="middle">8件</text>
<text class="t" x="18" y="164">そのまま「読みやすく整えて」・応募文（5回）</text>
<rect class="box-quiet" x="328.0" y="148" width="280" height="10" rx="2"/>
<rect class="box-quiet" x="328.0" y="162" width="280" height="10" rx="2"/>
<text class="t-good" x="616.0" y="164">0件／0件</text>
<text class="t" x="18" y="204">そのまま「読みやすく整えて」・謝罪文（5回）</text>
<rect class="box-quiet" x="328.0" y="188" width="280" height="10" rx="2"/>
<rect class="box-quiet" x="328.0" y="202" width="280" height="10" rx="2"/>
<rect class="bar-new" x="328.0" y="202" width="245.0" height="10" rx="2"/>
<text class="t-bad" x="616.0" y="204">0件／7件</text>
<text class="t" x="18" y="244">＋「書いていないことは足さないで」（4回）</text>
<rect class="box-quiet" x="328.0" y="228" width="280" height="10" rx="2"/>
<rect class="box-quiet" x="328.0" y="242" width="280" height="10" rx="2"/>
<text class="t-good" x="616.0" y="244">0件／0件</text>
<text class="t" x="18" y="284">＋〔足した文〕の欄を作らせる（4回）</text>
<rect class="box-quiet" x="328.0" y="268" width="280" height="10" rx="2"/>
<rect class="box-quiet" x="328.0" y="282" width="280" height="10" rx="2"/>
<text class="t-good" x="616.0" y="284">0件／0件</text>
<text class="t" x="18" y="324">事実欄は1文字も変えるな／約束欄だけ整えて（4回）</text>
<rect class="box-quiet" x="328.0" y="308" width="280" height="10" rx="2"/>
<rect class="box-quiet" x="328.0" y="322" width="280" height="10" rx="2"/>
<text class="t-good" x="616.0" y="324">0件／0件</text>
<text class="t-bad" x="18" y="362">※ 足されたのは謝罪文の側だけ（再発防止4回・徹底1回・申し訳1回・ご迷惑1回）。</text>
<text class="t-good" x="18" y="383">※ 応募文では、そのまま整えさせた5回とも0件だった。同じ指示文でも材料で違う。</text>
<text class="t-good" x="18" y="404">※ 「書いていないことは足さないで」の一文で、4回とも0件になった。</text>
<text class="t-xs" x="18" y="425">架空データでの実測（本体10回＋後半の指示文20回）。生の返りと判定コードは docs/evidence/ に全文置いてある。</text>
</svg>
