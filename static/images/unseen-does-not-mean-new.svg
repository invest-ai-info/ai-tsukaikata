<svg xmlns="http://www.w3.org/2000/svg" width="720" height="398" viewBox="0 0 720 398" role="img" aria-label="監視対象を1件追加したとき、その対象の過去分（本日付は0件）を「本日の新着」に含めずに済んだ回数を、聞き方4通りで比べたマス目。日付を主役にして聞いた8回は8回とも正しく0件だった（8/8）。「既読リストに無いものを新着として」という、自動処理の内部ロジックに近い聞き方をそのまま使うと、4回とも過去分（9件または7件）を丸ごと新着として数えてしまった（0/4）。「追加時点より前は本日の日付のものだけを新着として数えてください」という明示的な一文を足すと4回とも0件に戻り（4/4）、「過去の記録まで新着に含めないよう注意してください」という短い注意を足すだけでも同じく4回とも0件に戻った（4/4）。">
