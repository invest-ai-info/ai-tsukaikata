<rect class="bg" x="0" y="0" width="720" height="398"/>
<text class="t-strong" x="18" y="26">「未読」だけで聞くと、追加した対象の過去分が新着に化けた</text>
<text class="t-sm" x="18" y="45">架空のSNS監視・入金監視の2本に、新しい監視対象を1件ずつ追加した。過去分は</text>
<text class="t-sm" x="18" y="64">9件・7件とも本日付は0件で、正しい答えはどちらも「本日の新着は0件」である。</text>
<text class="t-xs" x="18" y="83">数字は、正しく0件と判定できた回数（材料2本×各2回、日付ベースのみ材料2本×各4回）。</text>
<text class="t-xs" x="18" y="102">生の回答は docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="171">日付ベースで聞く（未読なし）</text>
<rect class="box-good" x="288" y="150" width="170" height="32" rx="4"/>
<text class="t-good" x="328.0" y="171">8/8 正しく0件</text>
<text class="t-sm" x="18" y="213">「既読リストに無い＝新着」のまま</text>
<rect class="box-bad" x="288" y="192" width="170" height="32" rx="4"/>
<text class="t-bad" x="328.0" y="213">0/4 正しく0件</text>
<text class="t-sm" x="18" y="255">「本日の日付のものだけ」と一文</text>
<rect class="box-good" x="288" y="234" width="170" height="32" rx="4"/>
<text class="t-good" x="328.0" y="255">4/4 正しく0件</text>
<text class="t-sm" x="18" y="297">「過去分は含めないで」と一文</text>
<rect class="box-good" x="288" y="276" width="170" height="32" rx="4"/>
<text class="t-good" x="328.0" y="297">4/4 正しく0件</text>
<rect class="box-quiet" x="18" y="322" width="678" height="52" rx="6"/>
<text class="t-strong" x="34" y="344">崩れたのは「既読/未読」の枠組みで聞いたときだけ。日付では崩れなかった。</text>
<text class="t-sm" x="34" y="362">一文を足せば、短い注意でも明示的なルールでも、4回とも0件に戻った。</text>
