  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="486"/>
<text class="t-strong" x="18" y="26">崩れ方を分けたのは「期間か金額か」より「数字の埋まり具合」だった</text>
<text class="t-sm" x="18" y="45">「前提が材料に無ければ、勝手に置かずそう書いて」という一文を、期間を聞く材料・金額を聞く材料それぞれに、材料の数字が</text>
<text class="t-sm" x="18" y="64">ゼロの版と部分的に埋まっている版で試した（一文は末尾で統一）。数字は「具体的な数値を書いた回数／試した回数」。</text>
<text class="t-xs" x="18" y="83">期間・数値ゼロと金額・部分数値ありは前の記事（estimate-gap-leaks-on-money-ask）からの流用。他の2セルが今回の新規測定。</text>
<text class="t-xs" x="328.0" y="116" text-anchor="middle">数値ゼロ</text>
<text class="t-xs" x="528.0" y="116" text-anchor="middle">部分数値あり</text>
<text class="t" x="18" y="153">期間を聞く（納期）</text>
<rect class="box-good" x="240" y="130" width="176" height="34" rx="4"/>
<text class="t-good" x="328.0" y="153" text-anchor="middle" style="font-weight:700">0／3</text>
<rect class="box-bad" x="440" y="130" width="176" height="34" rx="4"/>
<text class="t-bad" x="528.0" y="153" text-anchor="middle" style="font-weight:700">3／5</text>
<text class="t" x="18" y="197">金額を聞く（報酬）</text>
<rect class="box-bad" x="240" y="174" width="176" height="34" rx="4"/>
<text class="t-bad" x="328.0" y="197" text-anchor="middle" style="font-weight:700">1／5</text>
<rect class="box-bad" x="440" y="174" width="176" height="34" rx="4"/>
<text class="t-bad" x="528.0" y="197" text-anchor="middle" style="font-weight:700">3／3</text>
<rect class="box-quiet" x="18" y="228" width="678" height="68" rx="6"/>
<text class="t" x="34" y="248">期間か金額かで束ねると 37.5%（3／8）対 50%（4／8）＝差12.5ポイント。</text>
<text class="t-accent" x="34" y="268" style="font-weight:700">数値ゼロか部分数値ありかで束ねると 12.5%（1／8）対 75%（6／8）＝差62.5ポイント。</text>
<text class="t-sm" x="34" y="286">束ね方を変えると、効いていた軸が入れ替わった。</text>
<text class="t-strong" x="18" y="320">「他の数字が分かっていても」と名指しした一文（材料A）</text>
<text class="t-sm" x="18" y="362">素朴な一文（末尾）</text>
<rect class="box-bad" x="318" y="342" width="302" height="28" rx="4"/>
<text class="t-bad" x="469.0" y="362" text-anchor="middle" style="font-weight:700">3／5</text>
<text class="t-sm" x="18" y="398">改良版の一文（末尾）</text>
<rect class="box-bad" x="318" y="378" width="302" height="28" rx="4"/>
<text class="t-bad" x="469.0" y="398" text-anchor="middle" style="font-weight:700">1／3</text>
<rect class="box-accent" x="18" y="422" width="678" height="40" rx="6"/>
<text class="t-accent" x="34" y="446">60%から33%まで下がったが、ゼロにはならなかった。</text>
</svg>
