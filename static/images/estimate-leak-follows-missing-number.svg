<svg xmlns="http://www.w3.org/2000/svg" width="720" height="486" viewBox="0 0 720 486" role="img" aria-label="見積もりの前提が材料に無いとき、AIが勝手に数字を計算するかを、期間を聞いたか金額を聞いたかと、材料の数字がゼロか部分的に埋まっているかの2軸で比較した図。期間・数値ゼロは0／3(前の記事から流用)、期間・部分数値ありは3／5(今回測定)、金額・数値ゼロは1／5(今回測定)、金額・部分数値ありは3／3(前の記事から流用)。期間か金額かで束ねると37.5%対50%で差は12.5ポイントだったが、数値ゼロか部分数値ありかで束ねると12.5%対75%で差は62.5ポイントと、5倍近く大きかった。「他の数字が分かっていても、勝手に前提を置いて計算を完成させないで」と名指しした改良版の一文を材料A(期間・部分数値あり)に足すと、漏れは3／5(60%)から1／3(33%)まで下がったが、ゼロにはならなかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
