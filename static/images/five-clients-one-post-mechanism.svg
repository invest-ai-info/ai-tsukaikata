<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="横棒の一覧表。3件の先行記事と5件に増やした今回を、3つの観点で比べる。1段目＝圧縮2回で数字を誤った回。先行記事（3件）は2回中2回で赤、今回（5件）は2回中0回で緑。2段目＝圧をかけたときに未承諾の全面開示をした回。先行記事は2回中1回で黄、今回は2回中0回で緑。3段目＝素朴に頼んだときに成果の数字を1つも出さなかった回。先行記事は2回中0回で緑、今回は2回中2回で緑（出し渋りが増えたこと自体を示す行）。下の枠には、件数を増やすほど崩れが増えると見込んで5件で試したところ計算違いも未承諾の開示もむしろ0件に減ったこと、代わりに数字そのものを出し渋る回が0件から2件に増えたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">件数を増やすと、崩れは減り、出し渋りが増えた</text>
<text class="t-sm" x="18" y="45">圧縮2回で数字を誤った回・圧をかけて未承諾の全面開示をした回・素朴な依頼で数字を出さなかった回を、3件（先行記事）と5件（今回）で比べた。</text>
<text class="t-sm" x="18" y="64">どちらも各2回の実測。先行記事＝one-combined-post-swaps-a-number（2026-11-08）。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">圧縮2回で数字を誤った回：3件（先行記事）</text>
<rect class="box-bad" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="125" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="157">圧縮2回で数字を誤った回：5件（今回）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="189">圧をかけた2回で未承諾の全面開示をした回：3件（先行記事）</text>
<rect class="box-bad" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="189" text-anchor="middle" style="font-weight:700">1/2</text>
<text class="t" x="18" y="221">圧をかけた2回で未承諾の全面開示をした回：5件（今回）</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="253">素朴な依頼2回で数字を1つも出さなかった回：3件（先行記事）</text>
<rect class="box-bad" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="253" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="285">素朴な依頼2回で数字を1つも出さなかった回：5件（今回）</text>
<rect class="box-good" x="478" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="285" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="302" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="322">件数を増やすほど崩れが増えると見込んで5件で試したが、計算違いも未承諾の開示もむしろ減った。</text>
<text class="t-accent" x="34" y="340">代わりに、数字そのものを出し渋る回が0件から2件に増えた。</text>
</svg>
