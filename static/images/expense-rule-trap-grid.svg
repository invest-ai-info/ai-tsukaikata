<text class="t-strong" x="18" y="26">わざと仕込んだ「罠」8件も、3回とも正しく読めた</text>
<text class="t-sm" x="18" y="45">OR条件の見落とし・姻族の一親等・キーワードに引っ張られる誤読を、狙って仕込んだ8件。</text>
<text class="t-sm" x="18" y="64">例：「22時以降なら電車が使えてもタクシー代は対象」というOR条件の読み違いを狙った1件目。</text>
<text class="t-sm" x="18" y="83">新規の会話で3回判定させ、セルの◯＝その回で真値と一致（×は不一致・今回は0件）。</text>
