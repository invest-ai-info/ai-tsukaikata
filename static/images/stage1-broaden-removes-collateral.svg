<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" role="img" aria-label="工程1の基準を広げた結果を示す横棒グラフ。材料A（丁寧な長文）では、独立の実測2回とも至急7件中7件を正しく拾い、拾い漏れは0件だった。材料B（口語の社内チャット）では、2回とも7件中6件しか拾えず、「そろそろ始まる」という言い方の1件だけが毎回拾い漏れた。工程2に「本当に該当するか確認して」という一言を足さず、確認なしの並べ替えだけを渡した4回では、広げた工程1の出力に誤りが無かったため、正しい項目を誤って除外する巻き添えは0/4回だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="384"/>
<text class="t-strong" x="18" y="26">工程1の基準を広げたら、工程2の確認なしでも巻き添えは消えた</text>
<text class="t-sm" x="18" y="45">架空の問い合わせ16件を2本、独立のサブエージェントで各2回=4回（材料2本×2回）。</text>
<text class="t-sm" x="18" y="64">材料Aは言い換えを含め全部拾えたが、材料Bは1種類の言い方だけ毎回拾い漏れた。</text>
<text class="t-xs" x="18" y="83">生の返りは docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="142">材料A・広げた工程1が拾った至急（7件中）</text>
<rect class="box" x="300" y="150" width="340" height="40" rx="4"/>
<rect class="box-good" x="300" y="150" width="340.0" height="40" rx="4"/>
<text class="t-good" x="654" y="175">7/7</text>
<text class="t-xs" x="300" y="205">2回とも7件全部を正しく拾った</text>
<text class="t-sm" x="18" y="222">材料B・広げた工程1が拾った至急（7件中）</text>
<rect class="box" x="300" y="230" width="340" height="40" rx="4"/>
<rect class="box-bad" x="300" y="230" width="291.4" height="40" rx="4"/>
<text class="t-bad" x="654" y="255">6/7</text>
<text class="t-xs" x="300" y="285">「そろそろ始まる」の1件だけ2回とも拾えず</text>
<text class="t-sm" x="18" y="302">工程2（確認なしの並べ替えのみ）の巻き添え除外（4回中）</text>
<rect class="box" x="300" y="310" width="340" height="40" rx="4"/>
<text class="t-good" x="654" y="335">0/4</text>
<text class="t-xs" x="300" y="365">広げた工程1の出力には誤りが無く、消す必要も無かった</text>
</svg>
