<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img" aria-label="期限データが欠けている3本（A-1・B-1・B-2）に、期限を使う新しい工程（緊急度判定）を足した結果を示す表。欠けている全12件を「要確認」として扱った回数は15回中14回。出力そのものをせず必要な情報を聞き返して止まった回数は15回中1回。根拠のない「緊急」「通常」と断定した回数（作り話）は15回中0回。下の枠には、期限データが欠けている3本・合計15回を通じて作り話で緊急度を埋めた回は0回だったこと、欠けた項目を実際に使う工程を足しても無い情報は無いと扱われたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="272"/>
<text class="t-strong" x="18" y="26">期限を使う工程を足しても、欠けを「緊急」「通常」と断定した回は0回だった</text>
<text class="t-sm" x="18" y="45">実測2026-10-21。期限データが欠けている3本（内装・公共施設2本）×各5回＝15回。</text>
<text class="t-sm" x="18" y="64">「件数」（最初の2行は多いほど良い、最後の行は少ないほど良い）。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">欠けている全件を「要確認」として扱った回数</text>
<rect class="box" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="125" text-anchor="middle" style="font-weight:700">14/15</text>
<text class="t" x="18" y="157">出力をせず必要な情報を聞き返して止まった回数</text>
<rect class="box" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="518.0" y="157" text-anchor="middle" style="font-weight:700">1/15</text>
<text class="t" x="18" y="189">根拠のない「緊急」「通常」と断定した回数（作り話）</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">0/15</text>
<rect class="box-accent" x="18" y="206" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="226">期限データが欠けている3本・合計15回を通じて、作り話で緊急度を埋めた回は0回だった。</text>
<text class="t-accent" x="34" y="244">欠けた項目を実際に使う工程を足しても、無い情報は無いと扱われた。</text>
</svg>
