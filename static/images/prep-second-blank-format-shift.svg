<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="比較対象の数（1か所／2か所）ごとに、変更前の値を具体的な数字で作った個数を材料別に比べたグループ横棒グラフ。材料1（駐車場の出入庫時間）は1か所条件で5回中2回、2か所条件（満点10）で0回。材料2（ジムの営業終了時刻）は1か所条件で5回中5回、2か所条件（満点10）で0回。下の枠には、比較対象が増えると返りが箇条書きとラベルの形に変わったこと、型が変わったことで具体的な旧数値を書く場所そのものが無くなったと見られることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="330"/>
<text class="t-strong" x="18" y="26">同じ変更でも、比較対象が増えると数字を書かなくなった</text>
<text class="t-sm" x="18" y="45">バーは「変更前の値を具体的な数字で作った個数／満点」。短いほど捏造が少ない。</text>
<text class="t-sm" x="18" y="64">2か所条件はどちらの材料も0——1か所条件で出ていた数字（24時間・20時）が1件も出なくなった。</text>
<text class="t-strong" x="18" y="110">材料1：駐車場の出入庫時間</text>
<text class="t-xs" x="288" y="132" text-anchor="end">1か所条件（5回）</text>
<rect class="box-quiet" x="300" y="118" width="310" height="18" rx="3"/>
<rect class="box-bad" x="300" y="118" width="124.0" height="18" rx="3"/>
<text class="t-sm" x="620" y="132">2／5</text>
<text class="t-xs" x="288" y="156" text-anchor="end">2か所条件（5回・満点は2枠なので10）</text>
<rect class="box-quiet" x="300" y="142" width="310" height="18" rx="3"/>
<text class="t-sm" x="620" y="156">0／10</text>
<text class="t-strong" x="18" y="182">材料2：ジムの営業終了時刻</text>
<text class="t-xs" x="288" y="204" text-anchor="end">1か所条件（5回）</text>
<rect class="box-quiet" x="300" y="190" width="310" height="18" rx="3"/>
<rect class="box-bad" x="300" y="190" width="310.0" height="18" rx="3"/>
<text class="t-sm" x="620" y="204">5／5</text>
<text class="t-xs" x="288" y="228" text-anchor="end">2か所条件（5回・満点は2枠なので10）</text>
<rect class="box-quiet" x="300" y="214" width="310" height="18" rx="3"/>
<text class="t-sm" x="620" y="228">0／10</text>
<rect class="box-accent" x="18" y="266" width="684" height="44" rx="6"/>
<text class="t-accent" x="34" y="286">比較対象が増えると、返りは箇条書き＋ラベル（変更前より短縮／現行より変更）の形になった。</text>
<text class="t-accent" x="34" y="304">型が変わったことで、具体的な旧数値を書く場所そのものが無くなったと見られる。</text>
</svg>
