<svg xmlns="http://www.w3.org/2000/svg" width="720" height="506" viewBox="0 0 720 506" role="img" aria-label="本文が取れなかった項目の要約に、読んでいないという断りが付くか、付くとしたら何行目に入るかを、頼み方5通りで並べた表。架空の一覧20件を4本作り、うち10件は本文あり、10件は本文が取れていない状態にした。分母は薄い10件かける回数。そのまま1件ずつ3行で要約してと頼んだ8回では、断りは80件中80件に付いたが、印は0件で、1行目に入ったのは0件だった。80件とも最終行である。本文を読んでいない前提で書いてを足した4回では、断りは40件中40件に付き、印は0件、1行目に入ったのは10件だった。残りは途中の行が10件、最終行が20件で、4回で3通りに割れている。1行目の先頭に本文未読と付けてを足した4回では、断り40件、印40件、1行目40件。断定しない書き方にしてを足した4回も同じく40件、40件、40件。本文の行そのものが無い一覧に印を頼んだ4回も、40件、40件、40件だった。心配していた事故は起きておらず、24回240件のうち、材料に無い数字が要約に出た件数は0件である。本文の行が無い一覧でも、頼まないうちから40件とも自分から断りを書いた。本文がある10件に誤って印が付いた件数も0件だった。">
