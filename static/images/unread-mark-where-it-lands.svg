<text class="t-strong" x="18" y="26">断りは付く。ただし、こちらが場所を決めるまで1行目には来ない</text>
<text class="t-sm" x="18" y="45">架空の一覧20件を4本。うち10件は本文あり（平均233字）、10件は本文が取れていない。薄い10件の説明文には、</text>
<text class="t-sm" x="18" y="64">あとで数えられる数字をちょうど1個だけ置いた。分母は「薄い10件 × 回数」。</text>
<text class="t-sm" x="18" y="83">上4行は「本文: 取得できませんでした」と書いてある一覧。いちばん下は、本文の行そのものが無い一覧。</text>
<text class="t-bad" x="18" y="105">※ 心配していた事故は起きなかった＝24回・240件のうち、材料に無い数字が要約に出た件数は0件。</text>
<text class="t-bad" x="18" y="124">　 本文の行が無い一覧でも、頼まないうちから40件とも自分で断った。</text>
