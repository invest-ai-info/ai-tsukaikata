<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="材料A（364日・問い合わせ）と材料B（251日・来店予約）に試した4種類の確認を、当たった回数／聞いた回数の形で示す表。ふだんの目安と倍率（材料A・B×長短2条件×各2回）は8/8。週ごとの小計52個（材料A・364日を2回）は104/104。月ごとの小計9個（材料B・251日を2回）は18/18。出す項目を3つに絞る保存版の書式（材料B・251日を2回）は2/2。下の枠には、基本の目安・倍率は8回とも真値と一致したこと、週ごとの小計は52週×2回＝104個・月ごとの小計は9か月×2回＝18個でどちらも誤りが無かったこと、出す項目を3つに絞る書式も251日ぶんを渡した2回とも崩れなかったことが書かれている。">
<style>
