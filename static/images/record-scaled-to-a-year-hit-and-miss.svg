<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">記録が数百日に育っても、計算は全部正解だった</text>
<text class="t-sm" x="18" y="45">実測2026-11-10。材料A（364日・問い合わせ）・材料B（251日・来店予約）、いずれも増減の無い記録。</text>
<text class="t-sm" x="18" y="64">同じ指示文を独立した新規の会話で複数回試し、AIの答えを真値（単純平均・実際の小計）と突き合わせた。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">ふだんの目安と倍率（材料A・B×長短2条件×各2回）</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">8/8</text>
<text class="t" x="18" y="157">週ごとの小計52個（材料A・364日を2回）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">104/104</text>
<text class="t" x="18" y="189">月ごとの小計9個（材料B・251日を2回）</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">18/18</text>
<text class="t" x="18" y="221">出す項目を3つに絞る保存版の書式（材料B・251日を2回）</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">基本の目安・倍率は8回とも真値と一致した。</text>
<text class="t-accent" x="34" y="276">週ごとの小計は52週×2回＝104個、月ごとの小計は9か月×2回＝18個、どちらも1個の誤りも無かった。</text>
<text class="t-accent" x="34" y="294">出す項目を3つに絞る書式も、251日ぶんを渡した2回とも崩れなかった。</text>
