<svg xmlns="http://www.w3.org/2000/svg" width="720" height="298" viewBox="0 0 720 298" role="img" aria-label="同じ架空の原稿28文に、発注書に合うように直してくださいと頼んだ結果を並べた図。発注書の違反8件は8件とも直った。一方、自分が書いた28の文のうち、直した版にそのまま残ったのは1文だけだった。つまり納品物のほとんどが、自分の書いた文ではなくなる。さらに、元の原稿にはURLが1件も無かったのに、直した版には参考にしたページとして4件のURLが立った。厚生労働省のガイドラインや業界団体の資料、規格のページなどで、自分は1つも開いていない。そのまま出せば、参考にしたと申告したことになる。同じ原稿を、直さずに確認してくださいと頼んだときは、URLは補われず、実際に参照したページをご自身で列挙してくださいと返ってきた。直した版には申し送りが付いていたが、付いていても、貼って出すのは自分なので、読まなければ同じことである。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="298"/>
<text class="t-strong" x="18" y="26">「発注書に合うように直してください」と頼んだ結果</text>
<text class="t-sm" x="18" y="45">同じ架空の原稿（28文）。違反はきれいに直る。残らないのは、自分の文のほう。</text>
<text class="t-sm" x="18" y="120">自分が書いた文が、そのまま残った数</text>
<rect class="bar-old" x="300" y="104" width="268" height="22" rx="3" opacity="0.35"/>
<rect class="bar-in" x="300" y="104" width="10" height="22" rx="3"/>
<text class="t-bad" x="320" y="120">28文中 1文</text>
<text class="t-sm" x="18" y="172">発注書の違反が直った数</text>
<rect class="bar-old" x="300" y="156" width="268" height="22" rx="3" opacity="0.35"/>
<rect class="bar-new" x="300" y="156" width="268" height="22" rx="3"/>
<text class="t-good" x="578" y="172">8件中 8件</text>
<text class="t-bad" x="18" y="220">そして、原稿に無かった「参考にしたページ」が4件立った</text>
<text class="t-sm" x="18" y="240">元の原稿のURL 0件 → 直した版 4件（厚生労働省・業界団体・規格のPDFなど）。</text>
<text class="t-sm" x="18" y="258">自分は1つも開いていない。そのまま出せば「参考にした」と申告したことになる。</text>
<text class="t-xs" x="18" y="274">※ 同じ原稿を「確認して」と頼んだときは、URLは補われず「ご自身で列挙してください」と返ってきた。</text>
<text class="t-xs" x="18" y="292">※ 直した版には申し送りが付いていた。付いていても、貼って出すのは自分なので、読まなければ同じこと。</text>
</svg>
