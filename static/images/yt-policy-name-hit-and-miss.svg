<svg xmlns="http://www.w3.org/2000/svg" width="720" height="258" viewBox="0 0 720 258" role="img" aria-label="YouTubeの収益化ポリシーの正式名称を尋ねた実測結果を示す表。原文を見せずに聞いた4回（架空のチャンネル2種を2回ずつ）は、4回とも現行の正式名称『量産型のコンテンツ』を言い当てられず、『反復コンテンツ』『reused content』など改称前の古い名前を答えた。原文を貼ってから聞いた2回は、2回とも現行の正式名称を正しく答えた。下の枠には、収益化できるかどうかの判定そのものは原文の有無に関わらず今回の全26回とも正しい方向だったこと、当たっているのは結論であって規定の名前は別に確かめないと古いままであることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="258"/>
<text class="t-strong" x="18" y="26">規定の正式名称は、原文を見せないと言い当てられない</text>
<text class="t-sm" x="18" y="45">「正式名称と、最後の改定時期も書いて」と同じ聞き方をして、原文の有無だけを変えた実測。</text>
<text class="t-sm" x="18" y="64">「量産型のコンテンツ」（現行の正式名称）と答えられたかどうか。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">原文なしで聞く（架空チャンネル2種×2回＝4回）</text>
<rect class="box-bad" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="125" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="157">原文を貼ってから聞く（架空チャンネル1種×2回＝2回）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="174" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="194">原文なしの4回は、4回とも「反復コンテンツ」「reused content」など改称前の名前だった。</text>
<text class="t-accent" x="34" y="212">判定（収益化できるか）そのものは、原文の有無に関わらず今回の全26回とも正しい方向だった。</text>
<text class="t-accent" x="34" y="230">当たっているのは『収益化できるか』の結論で、規定の『名前』は別に確かめないと古いまま。</text>
</svg>
