<rect class="bg" x="0" y="0" width="720" height="330" rx="8"/>

<text class="t-strong" x="24" y="34">1ファイルはこの形にする</text>

<rect class="box" x="24" y="54" width="440" height="252" rx="7"/>
<rect class="box-quiet" x="24" y="54" width="440" height="114" rx="7"/>
<rect class="bar-plain" x="24" y="146" width="440" height="22"/>
<text class="mono-sm" x="42" y="78">---</text>
<text class="mono-sm" x="42" y="98">name: feedback_date_freshness</text>
<text class="mono-sm" x="42" y="118">description: 日付は書き込む直前に取り直す</text>
<text class="mono-sm" x="42" y="138">type: feedback</text>
<text class="mono-sm" x="42" y="158">---</text>

<text class="t-sm" x="42" y="186">会話が中断され3日後に再開された際、冒頭で</text>
<text class="t-sm" x="42" y="206">取った日付を使って誤った日付で公開した。</text>

<text class="mono-sm" x="42" y="240">**Why:** 会話は日をまたぐことがあり、冒頭で</text>
<text class="mono-sm" x="42" y="258">取った時刻は再開時点では古い。</text>

<text class="mono-sm" x="42" y="288">**How to apply:** 書き込む直前に取り直す。</text>

<path class="line" d="M464 100 H500"/>
<path class="head" d="M500 95 l10 5 -10 5 z"/>
<rect class="box-quiet" x="512" y="72" width="184" height="56" rx="6"/>
<text class="t-strong" x="528" y="94">名前・一行説明・種別</text>
<text class="t-xs" x="528" y="116">一行説明で関連判定される</text>

<path class="line" d="M464 196 H500"/>
<path class="head" d="M500 191 l10 5 -10 5 z"/>
<rect class="box-quiet" x="512" y="168" width="184" height="56" rx="6"/>
<text class="t-strong" x="528" y="190">何が起きたか</text>
<text class="t-xs" x="528" y="212">絶対日付で書く（「先週」は禁止）</text>

<path class="line" d="M464 264 H500"/>
<path class="head" d="M500 259 l10 5 -10 5 z"/>
<rect class="box-accent" x="512" y="236" width="184" height="70" rx="6"/>
<text class="t-accent" x="528" y="258">Why と How to apply</text>
<text class="t-xs" x="528" y="280">これが無いと、半年後に</text>
<text class="t-xs" x="528" y="298">まだ有効か判断できない</text>
