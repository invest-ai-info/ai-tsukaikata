<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-label="同じ日に公開された Qwen3.8 の2つの重みを比べた図。左の Qwen3.8-2.4T-A95B はファイル合計が約4.9テラバイト（4,892ギガバイト）、パラメータ数は2.4兆でうち950億が動き、ライセンスは Qwen3.8-Max License、画像や動画は読めず文章だけ、思考モードは常にオンで切れない、一度に読める量は262,144トークンで最大101万トークン。右の Qwen3.8-27B はファイル合計が約55.6ギガバイト、パラメータ数は270億、ライセンスは Apache-2.0、画像や動画を読める、思考モードは切り替えられる、一度に読める量は262,144トークンで最大100万トークン。ファイルの合計はファイル一覧を記事側で足した値。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="430"/>
<text class="t-strong" x="18" y="26">同じ日に公開された2つは、名前が似ているだけで別物です</text>
<text class="t-sm" x="18" y="45">左＝最上位クラスの重み。右＝手元に置ける大きさの重み。</text>
<text class="t-sm" x="18" y="64">どちらも Qwen 自身がモデルカードに書いている値です。</text>
<rect class="box-quiet" x="18" y="84" width="336" height="284" rx="6"/>
<text class="t-strong" x="34" y="108">Qwen3.8-2.4T-A95B</text>
<text class="t-xs" x="34" y="136">ファイルの合計</text>
<text class="t" x="34" y="154">約4.9TB（4,892GB）</text>
<text class="t-xs" x="34" y="174">パラメータ数</text>
<text class="t" x="34" y="192">2.4T（うち95Bが動く）</text>
<text class="t-xs" x="34" y="212">ライセンス</text>
<text class="t" x="34" y="230">Qwen3.8-Max License</text>
<text class="t-xs" x="34" y="250">画像・動画</text>
<text class="t" x="34" y="268">読めない（文章だけ）</text>
<text class="t-xs" x="34" y="288">思考モード</text>
<text class="t" x="34" y="306">常にオン。切れない</text>
<text class="t-xs" x="34" y="326">一度に読める量</text>
<text class="t" x="34" y="344">262,144（最大101万）</text>
<rect class="box-accent" x="366" y="84" width="336" height="284" rx="6"/>
<text class="t-strong" x="382" y="108">Qwen3.8-27B</text>
<text class="t-xs" x="382" y="136">ファイルの合計</text>
<text class="t" x="382" y="154">約55.6GB</text>
<text class="t-xs" x="382" y="174">パラメータ数</text>
<text class="t" x="382" y="192">27B</text>
<text class="t-xs" x="382" y="212">ライセンス</text>
<text class="t" x="382" y="230">Apache-2.0</text>
<text class="t-xs" x="382" y="250">画像・動画</text>
<text class="t" x="382" y="268">読める</text>
<text class="t-xs" x="382" y="288">思考モード</text>
<text class="t" x="382" y="306">切り替えられる</text>
<text class="t-xs" x="382" y="326">一度に読める量</text>
<text class="t" x="382" y="344">262,144（最大100万）</text>
<text class="t-xs" x="18" y="388">※ ファイルの合計は、HuggingFace が出しているファイル一覧をこの記事で足した値です。</text>
<text class="t-xs" x="18" y="406">※ APIで使える Qwen3.8-Max は、左の重みをもとにした別仕様です（画像も読めます）。</text>
</svg>
