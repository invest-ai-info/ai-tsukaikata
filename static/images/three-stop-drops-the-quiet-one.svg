<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-label="process=P1〜P4の4本を1本のログに混ぜ、同じ4日間(09-10〜09-13)に止める本数を3本・4本に増やして「処理ごとに計算して」を各2回試した結果を示す表。P1+P2+P3が同時停止（頻度が低いP1を含み、P4だけ正常）の行は0/2で、P1が2回とも名指しから外れた。P2+P3+P4が同時停止（P1を除く）の行は2/2で3本とも名指しできた。P1〜P4の全部が同時停止（正常な処理が残らない）の行は2/2でP1を含む4本すべてを名指しできた。全処理が正常な構成も2/2で誤報なく「該当なし」と答えた。下の枠には、P1を含む3本停止だけP1が2回とも「ふだんが少ない」と理由をつけて名指しから外れたこと、同じP1でも他に正常な処理が1本も残らない4本同時停止では2回とも名指しされたことが書かれている。">
