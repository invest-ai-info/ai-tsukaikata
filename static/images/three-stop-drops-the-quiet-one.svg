<rect class="bg" x="0" y="0" width="720" height="304"/>
<text class="t-strong" x="18" y="26">P1を含む3本同時停止だけ、P1が2回とも名指しから外れた</text>
<text class="t-sm" x="18" y="45">実測2026-11-08。P1〜P4を1本のログに混ぜ、同じ4日間(09-10〜09-13)に止める本数を3本・4本に増やした。</text>
<text class="t-sm" x="18" y="64">P4だけが正常に残る3本停止ではP1が0/2。全4本が同時に止まるとP1も2/2で名指しされた。</text>
<text class="t-xs" x="498.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">P1+P2+P3が同時停止（P1を含む。P4だけ正常）</text>
<rect class="box-bad" x="418" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="498.0" y="125" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="157">P2+P3+P4が同時停止（P1を除く。P1だけ正常）</text>
<rect class="box-good" x="418" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="498.0" y="157" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="189">P1〜P4の全部が同時停止（正常な処理が残らない）</text>
<rect class="box-good" x="418" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="498.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="221">全処理が正常（誤報ゼロの確認）</text>
<rect class="box-good" x="418" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="498.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="258">P1を含む3本停止だけ、P1は2回とも「ふだんが少ない」と理由をつけて名指しから外れた。</text>
<text class="t-accent" x="34" y="276">同じP1でも、他に正常な処理が1本も残らない4本同時停止では2回とも名指しされた。</text>
