<svg xmlns="http://www.w3.org/2000/svg" width="720" height="582" viewBox="0 0 720 582" role="img" aria-label="毎朝の処理を3つの工程に分けて回したとき、工程1が下流へ「何についての問い合わせか」をどれだけ渡したかと、その先で起きたことを並べた横棒グラフ。工程1に頼んだのは期限が書いてあるものだけ抜き出してということだけで、何を添えるかは書いていない。棒は、工程1の出力にその1件にしか出てこない文字列が残っていた件数で、12件が満点である。分けただけの版は、丁寧な長文の材料で2回とも12件を渡して最終12件になったが、短い口語の材料では2回とも0件しか渡さず、2回とも下流が一覧を作らずに断った。毎回もとの24件も渡した版は12件、8件、1件、0件を渡し、最終はそれぞれ24件、12件、24件、24件で、3回は絞り込みが消えた。各工程に受け取った件数を書かせた版は8件、12件、12件、8件を渡し、4回とも最終12件で真値どおりだった。同じ指示文なのに、工程1が渡した量は220字から875字まで開いている。用件が8件ぶんしか渡らなかった回でも最終は12件そろっており、要旨のほうは残っていた。">
