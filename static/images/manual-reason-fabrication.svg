<svg xmlns="http://www.w3.org/2000/svg" width="720" height="484" viewBox="0 0 720 484" role="img" aria-label="手順表に「やらないとどうなるか」列を足す頼み方を2条件で試し、本文に理由が書かれていない3手順（件名の統一・控えのフォルダ保存・Slackへの投稿）について、作り話の理由が付いたか「書かれていません」と正直に書いたかを、5回ぶん並べた表。条件A（そのまま列を足した3回）は、3手順とも3回とも全部「作り話」。条件B（『書かれていなければ理由は書かれていませんと書いて』を足した2回）は、3手順とも2回とも全部「書かれていません」。下の注記には、条件Aの作り話はSlack投稿の理由だけでも回ごとに中身が違う3通りの説明文になったこと、条件Bは9マスとも作り話が0件で、理由が書いてある1手順（月末メンテナンス）だけは本文のとおりに正しく書いたことが書かれている。">
