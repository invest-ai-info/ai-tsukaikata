<text class="t-strong" x="18" y="26">「やらないとどうなるか」欄を足すと、理由が書かれていない3手順は3/3・3/3・3/3で作り話になった</text>
<text class="t-sm" x="18" y="45">月次の請求書発行を説明した架空の文章に、本文には理由が書かれていない手順が3つある。</text>
<text class="t-sm" x="18" y="64">条件Aはそのまま列を足した版（3回）、条件Bは「書かれていなければ正直に言って」を足した版（2回）。</text>
<text class="t-xs" x="18" y="83">架空データでの実測。回ごとの生の返りは docs/evidence/ に全文置いてある。</text>
