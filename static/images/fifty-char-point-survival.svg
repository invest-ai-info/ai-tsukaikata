<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="「採用に関する問い合わせ」の行を50字に縮めた6回について、原文の2つの質問(①リモート勤務・地方拠点での採用は可能か ②応募書類は追加で必要か)が残ったかを示す表。言い直し前1回目は①②とも残った。言い直し前2回目は①は残り②(応募書類)が消えた。言い直し後1回目は②は残り①(リモート/地方拠点)が消えた。言い直し後2回目は①②とも残った。「要約する前に質問の数を数えて」と足した2回は、どちらも①②とも残った。いずれの回も「…」という省略記号は使われていない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="24">「…」は出なくても、2つの質問の片方が静かに消える回があった</text>
<text class="t-sm" x="18" y="43">「採用に関する問い合わせ」の原文には2つの質問がある。①リモート勤務・地方拠点は可能か ②応募書類は追加で必要か。</text>
<text class="t-sm" x="18" y="62">50字に縮めた6回すべてで「…」は0回だったが、言い直し前2回目は②が消え、言い直し後1回目は①が消えた。</text>
<text class="t-xs" x="18" y="81">「要約する前に質問の数を数えて」と足した2回は、どちらも①②とも残った（この2回での結果）。</text>
<text class="t-accent" x="322.0" y="98" text-anchor="middle">①リモート/地方拠点</text>
<text class="t-accent" x="576.0" y="98" text-anchor="middle">②応募書類</text>
<text class="t-sm" x="18" y="128.0">言い直し前</text>
