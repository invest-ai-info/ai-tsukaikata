<text class="t-bad" x="322.0" y="216.0" text-anchor="middle">消えた</text>
<rect class="box-good" x="456.0" y="196.0" width="240.0" height="32" rx="6"/>
<text class="t-good" x="576.0" y="216.0" text-anchor="middle">残った</text>
<text class="t-sm" x="18" y="248.0">言い直し後</text>
<text class="t-sm" x="18" y="264.0">2回目</text>
<rect class="box-good" x="202.0" y="236.0" width="240.0" height="32" rx="6"/>
<text class="t-good" x="322.0" y="256.0" text-anchor="middle">残った</text>
<rect class="box-good" x="456.0" y="236.0" width="240.0" height="32" rx="6"/>
<text class="t-good" x="576.0" y="256.0" text-anchor="middle">残った</text>
