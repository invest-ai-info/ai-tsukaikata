    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="340"/>
<text class="t-strong" x="18" y="26">言い換えを強めるほど一致は消えたが、事実はほとんど残った</text>
<text class="t-sm" x="18" y="45">架空の紹介資料3本に「この資料をもとに紹介文を書いて」と頼み、言い換えの指示を3段階で足した。</text>
<text class="t-sm" x="18" y="64">版cで欠けた2件は、いずれも同じ資料の「横浜市」から「市」が落ちた回だった（本文参照）。</text>
<text class="t-sm" x="18" y="83">慣用句（決まり文句5個）は、言い換えを頼んだ版b・cでは1件も残らなかった。</text>
<text class="t-xs" x="190.0" y="126">20字以上の一致（6回合計）</text>
<text class="t-xs" x="350.0" y="126">事実の保持（36項目中）</text>
<text class="t-xs" x="510.0" y="126">慣用句の一致（30個中）</text>
<text class="t-sm" x="18" y="160">版a　そのまま頼む</text>
<rect class="box-bad" x="190" y="138" width="150" height="34" rx="4"/>
<text class="t-bad" x="248.2" y="160">19件</text>
<rect class="box-good" x="350" y="138" width="150" height="34" rx="4"/>
<text class="t-good" x="397.0" y="160">36/36</text>
<rect class="box-quiet" x="510" y="138" width="150" height="34" rx="4"/>
<text class="t-sm" x="562.6" y="160">7/30</text>
<text class="t-sm" x="18" y="204">版b　＋自分の言葉で</text>
<rect class="box-accent" x="190" y="182" width="150" height="34" rx="4"/>
<text class="t-accent" x="253.8" y="204">6件</text>
<rect class="box-good" x="350" y="182" width="150" height="34" rx="4"/>
<text class="t-good" x="397.0" y="204">36/36</text>
<rect class="box-quiet" x="510" y="182" width="150" height="34" rx="4"/>
<text class="t-sm" x="562.6" y="204">0/30</text>
<text class="t-sm" x="18" y="248">版c　＋20字以上つなげない</text>
<rect class="box-good" x="190" y="226" width="150" height="34" rx="4"/>
<text class="t-good" x="253.8" y="248">0件</text>
<rect class="box-accent" x="350" y="226" width="150" height="34" rx="4"/>
<text class="t-accent" x="397.0" y="248">34/36</text>
<rect class="box-quiet" x="510" y="226" width="150" height="34" rx="4"/>
<text class="t-sm" x="562.6" y="248">0/30</text>
<text class="t-xs" x="18" y="303">※ 事実の項目＝社名・所在地・創業年・人数・数量・締め日など資料1本につき6項目。正規表現で照合。</text>
<text class="t-xs" x="18" y="324">架空データでの実測。生の返り18回は docs/evidence/ に全文置いてある。</text>
</svg>
