<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="架空の紹介資料3本をもとに紹介文を書かせ、言い換えの指示を3段階にしたときの、20字以上の一致件数と、事実の保持数を並べたマス目。版a（そのまま頼む）は6回合計で19件の一致があり、事実は36項目中36件が残った。版b（自分の言葉で書き直して、を足す）は一致が6件に減り、事実は36件のまま残った。版c（20字以上つながらないように、ただし固有名詞と数字はそのまま、を足す）は一致が0件になったが、事実は36項目中34件に減った。慣用句5個の一致は、版b・cではいずれも0件だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
