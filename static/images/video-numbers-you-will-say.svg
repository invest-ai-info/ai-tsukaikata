<svg xmlns="http://www.w3.org/2000/svg" width="720" height="348" viewBox="0 0 720 348" role="img" aria-label="素朴に頼んだ動画台本の台詞から、走り書きに出てこない数字を全部拾った表。6件あった。117,600円は、走り書きの定期は月9,800円だったという行から、9,800かける12か月で作られた。36,000円は、月3,000円の駐輪場を借りたという行から、3,000かける12か月で作られた。54,400円は、点検とタイヤ交換で18,400円という行から、18,400たす36,000で作られた。6万円ちょっとは、上の2つの差で、117,600ひく54,400である。2,800kmちょっとは、片道7.2kmと198日から、7.2かける2かける198で作られた。46分は、信号込みで23分という行から、23かける2で作られた。計算はどれも合っている。問題は、これをカメラの前で言うのが自分だということ。素朴な台本には、雨の日の電車代が入っていませんという断りが自分から書かれていて、抜けを隠してはいなかった。別の頼み方では、定期の1年ぶんは9,800円かける12か月で計算しましたと、使った前提を書き添えて返った。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="348"/>
<text class="t-strong" x="18" y="26">台本に入っていた、走り書きに無い数字</text>
<text class="t-sm" x="18" y="45">素朴に頼んだ台本の台詞から、走り書きに出てこない数字を全部拾った（6件）。計算は6件とも合っていた。</text>
<text class="t-bad" x="18" y="96">台本で言うことになる数字</text>
<text class="t-sm" x="150" y="96">走り書きにある行</text>
<text class="t-sm" x="400" y="96">どう作られたか</text>
<text class="t-bad" x="18" y="128">117,600円</text>
<text class="t-sm" x="150" y="128">定期は月9,800円だった</text>
<text class="mono" x="400" y="128">9,800 × 12か月</text>
<text class="t-bad" x="18" y="155">36,000円</text>
<text class="t-sm" x="150" y="155">月3,000円の駐輪場を借りた</text>
<text class="mono" x="400" y="155">3,000 × 12か月</text>
<text class="t-bad" x="18" y="182">54,400円</text>
<text class="t-sm" x="150" y="182">点検とタイヤ交換で18,400円</text>
<text class="mono" x="400" y="182">18,400 ＋ 36,000</text>
<text class="t-bad" x="18" y="209">6万円ちょっと</text>
<text class="t-sm" x="150" y="209">（上の2つの差）</text>
<text class="mono" x="400" y="209">117,600 − 54,400</text>
<text class="t-bad" x="18" y="236">2,800kmちょっと</text>
<text class="t-sm" x="150" y="236">片道7.2km／198日</text>
<text class="mono" x="400" y="236">7.2 × 2 × 198</text>
<text class="t-bad" x="18" y="263">46分</text>
<text class="t-sm" x="150" y="263">信号込みで23分</text>
<text class="mono" x="400" y="263">23 × 2</text>
<text class="t-xs" x="18" y="298">※ 計算はどれも合っている。問題は、これをカメラの前で言うのが自分だということ。</text>
<text class="t-xs" x="18" y="318">※ 素朴な台本には「雨の日の電車代が入っていません」という断りが自分から書かれていた＝抜けを隠してはいない。</text>
<text class="t-xs" x="18" y="338">※ 別の頼み方では「定期の1年ぶんは9,800円×12か月で計算しました」と、使った前提を書き添えて返った。</text>
</svg>
