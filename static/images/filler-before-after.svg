<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="指示文を直す前と後で、当たり障りのない一文が入っていた要約の割合を比べた図。行数を3行に固定していたときは59件中59件すべてに入っていたが、行数の固定をやめたあとは120件中0件になった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="240"/>
<text class="t-strong" x="18" y="26">「当たり障りのない一文」が入っていた要約の割合</text>
<text class="t-sm" x="18" y="45">「〜に影響します」「注目されています」のような、誰にでも当てはまる行のこと。</text>
<text class="t-sm" x="18" y="64">同じ相手・同じ材料で、指示文だけを変えて数えました。</text>
<text class="t" x="18" y="105">行数を固定していたとき</text>
<rect class="box-quiet" x="250" y="82" width="350" height="34" rx="3"/>
<rect class="bar-old" x="250" y="82" width="350.0" height="34" rx="3"/>
<text class="t-strong" x="612" y="105">59 / 59件</text>
<text class="t" x="18" y="173">固定をやめたあと</text>
<rect class="box-quiet" x="250" y="150" width="350" height="34" rx="3"/>
<text class="t-strong" x="612" y="173">0 / 120件</text>
<text class="t-xs" x="18" y="228">※ 直したのはAIではなく、こちらの指示文です。行数の指定をやめただけで消えました。</text>
</svg>
