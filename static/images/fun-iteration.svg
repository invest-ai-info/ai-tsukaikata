<svg xmlns="http://www.w3.org/2000/svg" width="720" height="292" viewBox="0 0 720 292" role="img" aria-label="創作でのAIの使い方2通りを比べた図。上（1回で完成させようとする）＝長い注文を書く、1案だけ返ってくる、違うのでまた長い注文、だんだん惜しくなる。下（案を並べさせて選ぶ）＝短い注文を書く、5案まとめて返る、良い所を指して選ぶ、選んだ案を伸ばす。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="292"/>
<text class="t-strong" x="18" y="26">創作は「1回で完成」より「並べて選ぶ」が速い</text>
<text class="t-sm" x="18" y="45">好みは言葉にしにくいので、見てから選ぶほうが早く着きます。</text>
<text class="t-bad" x="18" y="84">1回で完成させようとする</text>
<rect class="box-quiet" x="18" y="96" width="152" height="46" rx="6"/>
<text class="t-sm" x="28" y="124">長い注文を書く</text>
<line class="line" x1="173" y1="119.0" x2="184" y2="119.0"/>
<path d="M184 115.0 L191 119.0 L184 123.0 Z" fill="#8b949e"/>
<rect class="box-bad" x="192" y="96" width="152" height="46" rx="6"/>
<text class="t-sm" x="202" y="124">1案だけ返ってくる</text>
<line class="line" x1="347" y1="119.0" x2="358" y2="119.0"/>
<path d="M358 115.0 L365 119.0 L358 123.0 Z" fill="#8b949e"/>
<rect class="box-bad" x="366" y="96" width="152" height="46" rx="6"/>
<text class="t-sm" x="376" y="124">違う→また長い注文</text>
<line class="line" x1="521" y1="119.0" x2="532" y2="119.0"/>
<path d="M532 115.0 L539 119.0 L532 123.0 Z" fill="#8b949e"/>
<rect class="box-bad" x="540" y="96" width="152" height="46" rx="6"/>
<text class="t-sm" x="550" y="124">だんだん惜しくなる</text>
<text class="t-good" x="18" y="188">案を並べさせて選ぶ</text>
<rect class="box-quiet" x="18" y="200" width="152" height="46" rx="6"/>
<text class="t-sm" x="28" y="228">短い注文を書く</text>
<line class="line" x1="173" y1="223.0" x2="184" y2="223.0"/>
<path d="M184 219.0 L191 223.0 L184 227.0 Z" fill="#8b949e"/>
<rect class="box-good" x="192" y="200" width="152" height="46" rx="6"/>
<text class="t-sm" x="202" y="228">5案まとめて返る</text>
<line class="line" x1="347" y1="223.0" x2="358" y2="223.0"/>
<path d="M358 219.0 L365 223.0 L358 227.0 Z" fill="#8b949e"/>
<rect class="box-good" x="366" y="200" width="152" height="46" rx="6"/>
<text class="t-sm" x="376" y="228">良い所を指して選ぶ</text>
<line class="line" x1="521" y1="223.0" x2="532" y2="223.0"/>
<path d="M532 219.0 L539 223.0 L532 227.0 Z" fill="#8b949e"/>
<rect class="box-good" x="540" y="200" width="152" height="46" rx="6"/>
<text class="t-sm" x="550" y="228">選んだ案を伸ばす</text>
<text class="t-xs" x="18" y="280">※ 5案は多すぎず少なすぎない数です。3案だと似たものが並び、10案だと選ぶのが仕事になります。</text>
</svg>
