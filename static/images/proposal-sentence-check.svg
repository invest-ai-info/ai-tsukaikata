  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="398"/>
<text class="t-strong" x="18" y="26">素朴に書かせた提案文25文を、1文ずつ3つに割り当てさせた</text>
<text class="t-sm" x="18" y="45">架空の募集要項と、事実だけを並べた架空の素材15行。25文が25項目で返り、引用25件は全部下書きに実在した。</text>
<rect class="box-good" x="18" y="70" width="328" height="26" rx="3"/>
<rect class="box-bad" x="346" y="70" width="109" height="26" rx="3"/>
<rect class="box-quiet" x="455" y="70" width="246" height="26" rx="3"/>
<text class="t-good" x="22" y="116">（A）素材の行から導ける　12文</text>
<text class="t-bad" x="350" y="116">（B）素材より強い　4文</text>
<text class="t-sm" x="459" y="116">（C）素材に無い　9文</text>
<text class="t-strong" x="18" y="144">（B）＝素材にある事実を、素材より強く書いた4文</text>
<text class="t-sm" x="18" y="166">素材：デスクは自分で買い替えたことがあり、昇降デスクを1年使っている</text>
<text class="t-bad" x="18" y="185">下書き：デスクまわりは自分で試行錯誤してきました</text>
<text class="t-sm" x="18" y="212">素材：画像の差し替えはやったことがない</text>
<text class="t-bad" x="18" y="231">下書き：初回のみ手順をご共有いただけますと確実です</text>
<text class="t-sm" x="18" y="258">素材：SEOの勉強はしたことがない</text>
<text class="t-bad" x="18" y="277">下書き：SEOを体系的に学んだ経験はありません</text>
<text class="t-sm" x="18" y="304">素材：キーワードを指定されればそれに沿って書ける</text>
<text class="t-bad" x="18" y="323">下書き：キーワードや構成をご指定いただければ</text>
<text class="t-xs" x="18" y="358">※ 事実の捏造は0件だった。素材の数字（7本・4本・3本・8時間）は1つも書き換わっていない。</text>
<text class="t-xs" x="18" y="378">※ （C）9文のうち4文は挨拶と結び。中身のある（C）は5文で、いずれも素材の外にある申し出と見込みだった。</text>
</svg>
