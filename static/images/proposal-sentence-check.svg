<svg xmlns="http://www.w3.org/2000/svg" width="720" height="398" viewBox="0 0 720 398" role="img" aria-label="架空の募集要項と、事実だけを並べた架空の素材15行を渡して素朴に書かせた提案文25文を、1文ずつ3つに割り当てさせた結果の図。素材の行から導ける文が12文、素材にある事実だが素材より強く書いてある文が4文、素材のどの行からも導けない文が9文だった。25文が25項目として返り、引用25件はすべて下書きに実在した。素材より強く書いてある4文は次のとおり。素材にはデスクは自分で買い替えたことがあり昇降デスクを1年使っているとあるのに、下書きはデスクまわりは自分で試行錯誤してきましたと書いた。素材には画像の差し替えはやったことがないとあるのに、下書きは初回のみ手順をご共有いただけますと確実ですと書いた。素材にはSEOの勉強はしたことがないとあるのに、下書きはSEOを体系的に学んだ経験はありませんと書いた。素材にはキーワードを指定されればそれに沿って書けるとあるのに、下書きはキーワードや構成をご指定いただければと書いた。なお事実の捏造は0件で、素材の数字である7本、4本、3本、8時間は1つも書き換わっていない。素材のどの行からも導けない9文のうち4文は挨拶と結びで、中身のある文は5文、いずれも素材の外にある申し出と見込みだった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
