<svg xmlns="http://www.w3.org/2000/svg" width="720" height="357" viewBox="0 0 720 357" role="img" aria-label="GPT-5.6 の3モデルの値段を比べた横棒グラフ。100万トークンあたりのドル。GPT-5.6 Sol（いちばん賢い）は入力5ドル・出力30ドル、GPT-5.6 Terra（中間）は入力2ドル・出力12ドル、GPT-5.6 Luna（いちばん安い）は入力0.2ドル・出力1.2ドル。3つとも読める量1.05M、書ける量12.8万、知識は2026年2月16日まで、使える道具（関数・ウェブ検索・ファイル検索・パソコン操作）も同じ。違うのは値段と賢さだけ。">
