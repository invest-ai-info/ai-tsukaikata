<rect class="bg" x="0" y="0" width="720" height="376"/>
<text class="t-strong" x="18" y="26">値段より先に、選べる幅のほうが狭くなっています</text>
<text class="t-sm" x="18" y="45">Amazon Bedrock のモデルカード3枚に書かれていることを並べたものです。</text>
<text class="t-sm" x="18" y="64">汎用＝GPT-5.6 Sol、Blue＝Daybreak Blue、Red＝Daybreak Red。</text>
<text class="t-sm" x="18" y="83">「使えない」は、モデルカードに Not supported と書かれているという意味です。</text>
<text class="t-xs" x="18" y="106">見るところ</text>
<text class="t-xs" x="292" y="106">汎用の Sol</text>
<text class="t-xs" x="428" y="106">Blue</text>
<text class="t-xs" x="566" y="106">Red</text>
<text class="t" x="18" y="134">事前の審査</text>
<text class="t-good" x="292" y="134">要らない</text>
<text class="t-bad" x="428" y="134">要る</text>
<text class="t-bad" x="566" y="134">要る</text>
<text class="t" x="18" y="160">使えるリージョン</text>
<text class="t-good" x="292" y="160">米欧亜に多数</text>
<text class="t-bad" x="428" y="160">オハイオだけ</text>
<text class="t-bad" x="566" y="160">オハイオだけ</text>
<text class="t" x="18" y="186">東京リージョン</text>
<text class="t-good" x="292" y="186">表にある</text>
<text class="t-bad" x="428" y="186">表にない</text>
<text class="t-bad" x="566" y="186">表にない</text>
<text class="t" x="18" y="212">Geo・Global 経路</text>
<text class="t-good" x="292" y="212">使える</text>
<text class="t-bad" x="428" y="212">使えない</text>
<text class="t-bad" x="566" y="212">使えない</text>
<text class="t" x="18" y="238">速い層・安い層</text>
<text class="t-bad" x="292" y="238">使えない</text>
<text class="t-bad" x="428" y="238">使えない</text>
<text class="t-bad" x="566" y="238">使えない</text>
<text class="t" x="18" y="264">微調整（Fine-tuning）</text>
<text class="t" x="292" y="264">記載なし</text>
<text class="t-bad" x="428" y="264">できない</text>
<text class="t-bad" x="566" y="264">できない</text>
<text class="t" x="18" y="290">一度に読める量</text>
<text class="t" x="292" y="290">100万</text>
<text class="t" x="428" y="290">100万</text>
<text class="t" x="566" y="290">27.2万</text>
<text class="t-xs" x="18" y="336">※ 審査＝OpenAI の Trusted Access for Cyber への登録。承認後に AWS 側で申請します。</text>
<text class="t-xs" x="18" y="354">※ 速い層（Priority）と安い層（Flex）は、汎用の Sol でも使えないと書かれています。</text>
</svg>
