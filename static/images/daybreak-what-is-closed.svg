<svg xmlns="http://www.w3.org/2000/svg" width="720" height="376" viewBox="0 0 720 376" role="img" aria-label="Amazon Bedrock のモデルカード3枚に書かれている条件を並べた表。汎用の GPT-5.6 Sol は事前の審査が要らず、米国・欧州・アジアの多数のリージョンの表があり、東京もその表にあり、Geo 経路と Global 経路が使えて、一度に100万トークン読める。Daybreak Blue と Daybreak Red はどちらも事前の審査が要り、リージョンの表は米国東部オハイオの1行だけで東京は無く、Geo 経路も Global 経路も使えず、微調整もできない。一度に読める量は Blue が100万トークン、Red は27.2万トークン。速い層（Priority）と安い層（Flex）は、汎用の Sol を含む3つとも使えないと書かれている。審査は OpenAI の Trusted Access for Cyber への登録で、承認後に AWS 側で申請する必要がある。">
