<svg xmlns="http://www.w3.org/2000/svg" width="720" height="484" viewBox="0 0 720 484" role="img" aria-label="架空の2週間ぶんの予定表から、新しい依頼が入るかどうかを引き算で出した図。使える時間の合計は2,160分。いま抱えている案件3件の残りが1,140分。差し引き1,020分が、新しい依頼に回せる時間になる。新しい依頼の見積もりは幅で出ていて、下限が800分、上限が1,120分。下限の800分なら1,020分の枠に収まり、220分あまる。上限の1,120分だと枠を100分はみ出して、たりない。つまり見積もりの下限と上限のどちらを使うかで、入るか入らないかの答えが逆になる。「この依頼、受けられますか」と聞いた4回は、4回ともこの数字を正しく計算したうえで、受ける、または断るという言い切りを、それぞれ2語・3語・1語・3語書いた。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="484"/>
<text class="t-strong" x="18" y="26">合計は足りている。上限で見ると100分足りない</text>
<text class="t-sm" x="18" y="45">架空の2週間ぶんの予定表・抱えている案件3件・新しい依頼1件。数字はすべて材料から計算した真値。</text>
<text class="t-sm" x="18" y="64">見積もりは幅で出ている（800分〜1,120分）。どちらを使うかで答えが逆になる。</text>
<text class="t-sm" x="18" y="136">使える時間</text>
<rect class="bar-old" x="152" y="116" width="490.9" height="30" rx="2"/>
<text class="t" x="650.9" y="136">2,160分</text>
<text class="t-sm" x="18" y="186">抱えている案件</text>
<rect class="bar-in" x="152" y="166" width="259.1" height="30" rx="2"/>
<text class="t" x="419.1" y="186">1,140分</text>
<text class="t-sm" x="18" y="236">新しい依頼</text>
<rect class="box-quiet" x="411.1" y="216" width="231.8" height="30" rx="2"/>
<rect class="bar-new" x="411.1" y="221" width="181.8" height="20" rx="2"/>
<rect class="box-bad" x="592.9" y="221" width="72.7" height="20" rx="2"/>
<text class="t-good" x="166" y="236">下限 800分</text>
<text class="t-bad" x="587.6" y="260">上限 1,120分</text>
<path class="line" d="M642.9 110 L642.9 260" stroke-dasharray="4 3"/>
<text class="t-bad" x="407" y="274">この線を100分はみ出す＝上限で見ると入らない</text>
<text class="t-sm" x="18" y="300">使える時間の合計</text>
<text class="t" x="252" y="300">2,160分</text>
<text class="t-sm" x="18" y="322">抱えている案件の残り</text>
<text class="t" x="252" y="322">1,140分</text>
<text class="t-sm" x="18" y="344">差し引き（新しい依頼に回せる時間）</text>
<text class="t" x="252" y="344">1,020分</text>
<text class="t-sm" x="18" y="366">下限（800分）で見た場合</text>
<text class="t" x="252" y="366">220分あまる</text>
<text class="t-sm" x="18" y="388">上限（1,120分）で見た場合</text>
<text class="t-bad" x="252" y="388">100分たりない</text>
<text class="t-bad" x="18" y="416">※ 「この依頼、受けられますか」と聞いた4回は、4回ともこの数字を正しく出したうえで、</text>
<text class="t-bad" x="18" y="438">　 受ける／断るの言い切りを 2語・3語・1語・3語 書いた。決めるのは自分のはず。</text>
<text class="t-xs" x="18" y="460">架空データでの実測。回ごとの生の返りは docs/evidence/ に全文置いてある。</text>
</svg>
