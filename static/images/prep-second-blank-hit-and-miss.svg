<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="PREP法の「具体例」欄が変更前の値を捏造する個数を、比較対象の数（1か所／2か所）ごとに示した表。すべて変更前の時刻を具体的な数字で作った個数で、少ないほど良い。材料1（駐車場の出入庫時間）は1か所条件で5回中2回捏造したが、精算窓口の対応時間を足して2か所にすると10枠中0回になった。材料2（ジムの営業終了時刻）は1か所条件で5回中5回捏造したが、土日祝の開始時刻を足して2か所にすると10枠中0回になった。1か所条件の合計は満点10中7、2か所条件の合計は満点20中0。下の枠には、反証条件（2か所の合計が1か所の合計×2＝14を下回るなら棄却）が、0は14を下回るため成立して棄却されたこと、比較対象が増えると捏造の個数は2倍ではなくゼロになったこと、返りの形が箇条書きとラベルに変わって具体的な旧数値を書かなくなったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">比較対象を2か所に増やすと、捏造は2倍ではなくゼロになった</text>
<text class="t-sm" x="18" y="45">実測2026-09-22（仮説キューH21）。駐車場・ジムの時刻変更案内、各5回。</text>
<text class="t-sm" x="18" y="64">すべて「変更前の時刻を具体的な数字で作った個数」（少ないほど良い）。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">材料1（駐車場）：1か所条件</text>
<rect class="box-bad" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="125" text-anchor="middle" style="font-weight:700">2/5</text>
<text class="t" x="18" y="157">材料1（駐車場）：2か所条件（満点10）</text>
<rect class="box-good" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="157" text-anchor="middle" style="font-weight:700">0/10</text>
<text class="t" x="18" y="189">材料2（ジム）：1か所条件</text>
<rect class="box-bad" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="189" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="221">材料2（ジム）：2か所条件（満点10）</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">0/10</text>
<text class="t" x="18" y="253">1か所条件の合計（満点10）</text>
<rect class="box-bad" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="253" text-anchor="middle" style="font-weight:700">7/10</text>
<text class="t" x="18" y="285">2か所条件の合計（満点20）</text>
<rect class="box-good" x="478" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="285" text-anchor="middle" style="font-weight:700">0/20</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">反証条件＝2か所の合計が、1か所の合計×2（14）を下回るなら棄却。0&lt;14で棄却。</text>
<text class="t-accent" x="34" y="340">比較対象が1か所→2か所に増えると、変更前の値を作る個数は2倍ではなくゼロになった。</text>
<text class="t-accent" x="34" y="358">返りの形が箇条書き＋ラベル（変更前より短縮／現行より変更）に変わり、具体的な旧数値を書かなくなった。</text>
</svg>
