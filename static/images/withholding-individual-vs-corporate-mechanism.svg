<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-label="同じ月額顧問料600,000円（消費税別）という条件だけを揃え、受注者の形態だけを変えた2契約を比べる図。上段＝受注者が弁護士個人（桜井法律事務所　桜井健一）の場合、顧問料600,000円＋消費税60,000円＝660,000円から、源泉徴収61,260円（10.21%）を差し引いて手取りは598,740円。下段＝受注者が税理士法人（まつば税理士法人）の場合、同じ660,000円から、支払先が法人のため源泉徴収は原則不要で、手取りは全額660,000円。どちらの契約書にも源泉徴収の要否を説明する条項は書いていない。下の枠には、源泉徴収は支払先が個人の場合に適用される制度で法人への支払いは原則対象外であること（国税庁No.2792）、3回とも受注者名の法人格の表記だけからこの条文の分岐に自分で気づいたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="370"/>
<text class="t-strong" x="18" y="26">同じ60万円でも、受注者が法人なら源泉徴収は不要</text>
<text class="t-sm" x="18" y="45">月額顧問料600,000円（消費税別）という条件だけを揃え、受注者の形態だけを変えた2契約。</text>
<text class="t-sm" x="18" y="64">どちらの契約書にも「源泉徴収の要否」を説明する条項は書いていない。</text>
<rect class="box" x="18" y="112" width="684" height="82" rx="6"/>
<text class="t-strong" x="34" y="134">受注者＝弁護士個人（桜井法律事務所　桜井　健一）</text>
<text class="t" x="34" y="154">顧問料600,000円（税別）＋消費税60,000円＝660,000円。源泉徴収61,260円</text>
<text class="t" x="34" y="172">（10.21%）を差し引いて、手取りは598,740円</text>
<rect class="box-good" x="18" y="204" width="684" height="82" rx="6"/>
<text class="t-strong" x="34" y="226">受注者＝税理士法人（まつば税理士法人）</text>
<text class="t-good" x="34" y="246">顧問料600,000円</text>
<text class="t-good" x="34" y="264">（税別）＋消費税60,000円＝660,000円。支払先が法人のため源泉徴収は原則不要。手取りは全額660,000円</text>
<rect class="box-accent" x="18" y="302" width="684" height="48" rx="6"/>
<text class="t-accent" x="34" y="322">源泉徴収は「支払先が個人の場合」に適用される制度。法人への支払いは原則対象外（国税庁No.2792）。</text>
<text class="t-accent" x="34" y="340">3回とも、受注者名の法人格の表記（「◯◯税理士法人」）だけから、この条文の分岐に自分で気づいた。</text>
</svg>
