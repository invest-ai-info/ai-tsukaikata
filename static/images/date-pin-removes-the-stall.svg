</style>
<rect class="bg" x="0" y="0" width="720" height="256"/>
<text class="t-strong" x="18" y="26">日付を言い直すと、確認待ちが0回になった</text>
<text class="t-sm" x="18" y="45">優先指定あり・材料Aの条件だけを取り出して比べた。</text>
<text class="t-sm" x="18" y="64">言い直し後は「今日は2026-09-22です」の直後に、日付が食い違っても</text>
<text class="t-sm" x="18" y="83">確認せずそのまま進めるよう念押しを1文足した。</text>
<text class="t-sm" x="18" y="172">言い直し前（材料A・優先指定・計4回）</text>
<rect class="box" x="318" y="150" width="180" height="34" rx="4"/>
<rect class="box-good" x="318" y="150" width="90.0" height="34"/>
<rect class="box-accent" x="408.0" y="150" width="90.0" height="34" rx="4"/>
<text class="t-sm" x="512" y="172">2/4正解・2/4確認</text>
<text class="t-sm" x="18" y="220">言い直し後（同条件＋日付の念押し・計8回）</text>
