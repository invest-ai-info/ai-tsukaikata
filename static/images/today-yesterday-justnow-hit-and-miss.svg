<svg xmlns="http://www.w3.org/2000/svg" width="720" height="418" viewBox="0 0 720 418" role="img" aria-label="「今日」「昨日」「さっき」という3つの走り書きで、日付ズレの直り方を比べた表。直す前は、今日・昨日・さっきのいずれも、続きの日付になった回が4回中0回。「本日」「今日」としか名指ししていない既存の直し方では、「今日」が2回中2回、「さっき」が2回中2回、続きの日付に直った。ところが同じ直し方での「昨日」は、4回中3回しか続きの日付にならず、4回中1回は壁時計の実日付に戻った。「昨日」も名指しに加えた最終版では、2回中2回とも直った。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="418"/>
<text class="t-strong" x="18" y="26">「さっき」は名指し無しでも直るが、「昨日」は4回に1回戻る</text>
<text class="t-sm" x="18" y="45">実測2026-10-22。架空の記録2本（作業記録／買い物メモ）。続きの日付になった回／試した回。</text>
<text class="t-sm" x="18" y="64">「直す前」は0が正しい（壁時計の日付に化ける）。直し方は多いほど良い。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">直す前・「今日」が続きの日付になった回</text>
<rect class="box-bad" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="125" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="157">直す前・「昨日」が続きの日付になった回</text>
<rect class="box-bad" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="157" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="189">直す前・「さっき」が続きの日付になった回</text>
<rect class="box-bad" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="189" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="221">直し方（「本日」「今日」だけ名指し）・「今日」</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="253">同じ直し方・「さっき」（名指し無し）</text>
<rect class="box-good" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="253" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="285">同じ直し方・「昨日」（名指し無し）</text>
<rect class="box" x="478" y="264" width="160" height="26" rx="4"/>
<text class="t-sm" x="558.0" y="285" text-anchor="middle" style="font-weight:700">3/4</text>
<text class="t" x="18" y="317">「昨日」も名指しした最終版・「昨日」</text>
<rect class="box-good" x="478" y="296" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="317" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="334" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="354">直す前は12回とも、ファイルの続きの日付ではなく実行した実際の日に化けた。</text>
<text class="t-accent" x="34" y="372">「本日」「今日」としか名指ししていない直し方は、「さっき」には2/2で効いた。</text>
<text class="t-accent" x="34" y="390">だが「昨日」には4回に1回、壁時計の日付に戻った。「昨日」も名指しした最終版は2/2で直った。</text>
</svg>
