<svg xmlns="http://www.w3.org/2000/svg" width="720" height="434" viewBox="0 0 720 434" role="img" aria-label="1件が複数の基準に同時に違反していても、全数確認が違反理由をすべて正しく列挙できたかを示す横棒グラフ。「全数確認・2基準同時違反」（材料A・D-08とD-16が2基準ずつ同時違反・8回）は8/8。「全数確認・3基準同時違反」（材料B・D-14が3基準すべて同時違反・4回）は4/4。「全数確認＋念押し」（材料A・4回）も4/4だが、すでに天井に達しているため念押しの効果は確認できず、1回は本文冒頭の件数表記と列挙した件数が食い違った。「抜き取り6件・サンプルに同時違反品が入った回」は2/2で、サンプルに実際に入った場合は両方の理由を正しく列挙した。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="434"/>
<text class="t-strong" x="18" y="26">全数確認は、1件が複数の基準に同時に違反していても見逃さなかった</text>
<text class="t-sm" x="18" y="45">違反理由をすべて正しく列挙できた回数／試した回数。</text>
<text class="t-sm" x="18" y="64">念押しは天井に達した挙動を伸ばさず、抜き取りは当たれば両方を列挙した。</text>
<text class="t-xs" x="18" y="83">生の回答は docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="160">全数確認・2基準同時違反（材料A・8回）</text>
<rect class="box" x="340" y="168" width="300" height="34" rx="4"/>
<rect class="box-good" x="340" y="168" width="300.0" height="34" rx="4"/>
<text class="t-good" x="654" y="190">8/8</text>
<text class="t-xs" x="340" y="217">D-08・D-16とも両方の理由を列挙</text>
<text class="t-sm" x="18" y="226">全数確認・3基準同時違反（材料B・4回）</text>
<rect class="box" x="340" y="234" width="300" height="34" rx="4"/>
<rect class="box-good" x="340" y="234" width="300.0" height="34" rx="4"/>
<text class="t-good" x="654" y="256">4/4</text>
<text class="t-xs" x="340" y="283">D-14の3つの理由をすべて列挙</text>
<text class="t-sm" x="18" y="292">全数確認＋念押し（材料A・4回）</text>
<rect class="box" x="340" y="300" width="300" height="34" rx="4"/>
<rect class="box-good" x="340" y="300" width="300.0" height="34" rx="4"/>
<text class="t-good" x="654" y="322">4/4</text>
<text class="t-xs" x="340" y="349">伸びず。1回は見出しの件数が食い違った</text>
<text class="t-sm" x="18" y="358">抜き取り6件・サンプルに同時違反品が入った回</text>
<rect class="box" x="340" y="366" width="300" height="34" rx="4"/>
<rect class="box-good" x="340" y="366" width="300.0" height="34" rx="4"/>
<text class="t-good" x="654" y="388">2/2</text>
<text class="t-xs" x="340" y="415">入った2回は両方の理由を列挙</text>
</svg>
