<svg xmlns="http://www.w3.org/2000/svg" width="720" height="418" viewBox="0 0 720 418" role="img" aria-label="「実行中」のまま止まったフラグに対して、AIが「今回の処理を進める」と判定した割合を、版ごとに横棒で示した図。無指定で素朴に判断させた版は4回中0回、経過時間を計算させても4回中0回しか進めなかった。6時間の閾値を明示した版は4回中4回、書き戻しも指示した版は4回中4回、計算と書き戻しを両方指示した推奨版は2回中2回、いずれも正しく進めた。参考として、本当にまだ実行中で経過2時間の材料に閾値版を使った場合は2回中0回しか進めず、これは正しい判断である（本来は待つべき場面のため）。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="418"/>
<text class="t-strong" x="18" y="24">「進めるべきか判断して」と開いた聞き方では、8回中0回しか自分から進めなかった</text>
<text class="t-sm" x="18" y="43">架空の実行記録2本（開始から3日・30時間が経過、いずれも異常終了を疑うべき状態）。版ごとに材料2本×各2回。</text>
<text class="t-sm" x="18" y="62">縦軸は「今回の処理を進める」と判定した回の割合。①②は「進める」が正解の場面での結果、参考行だけ「待つ」が正解の場面。</text>
<text class="t-xs" x="18" y="81">① と ② は理由も経過時間の計算も示したうえで、それでも「調査すべき」「待つべき」で止まった。</text>
<text class="t" x="18" y="144">① 無指定（素朴に判断）</text>
<rect class="box-quiet" x="340.0" y="132" width="160.0" height="16" rx="3"/>
<rect class="box-bad" x="340.0" y="132" width="3.0" height="16" rx="3"/>
<text class="t-bad" x="512.0" y="144">0/4</text>
<text class="t" x="18" y="184">② ①＋経過時間を計算させても</text>
<rect class="box-quiet" x="340.0" y="172" width="160.0" height="16" rx="3"/>
<rect class="box-bad" x="340.0" y="172" width="3.0" height="16" rx="3"/>
<text class="t-bad" x="512.0" y="184">0/4</text>
<text class="t" x="18" y="224">③ 6時間の閾値を明示</text>
<rect class="box-quiet" x="340.0" y="212" width="160.0" height="16" rx="3"/>
<rect class="box-good" x="340.0" y="212" width="160.0" height="16" rx="3"/>
<text class="t-accent" x="512.0" y="224">4/4</text>
<text class="t" x="18" y="264">④ ③＋書き戻しも指示</text>
<rect class="box-quiet" x="340.0" y="252" width="160.0" height="16" rx="3"/>
<rect class="box-good" x="340.0" y="252" width="160.0" height="16" rx="3"/>
<text class="t-accent" x="512.0" y="264">4/4</text>
<text class="t" x="18" y="304">⑤ ③＋計算＋書き戻し（推奨版）</text>
<rect class="box-quiet" x="340.0" y="292" width="160.0" height="16" rx="3"/>
<rect class="box-good" x="340.0" y="292" width="160.0" height="16" rx="3"/>
<text class="t-accent" x="512.0" y="304">2/2</text>
<text class="t" x="18" y="344">参考：本当にまだ実行中の材料に③を使う</text>
<rect class="box-quiet" x="340.0" y="332" width="160.0" height="16" rx="3"/>
<rect class="box-good" x="340.0" y="332" width="3.0" height="16" rx="3"/>
<text class="t-accent" x="512.0" y="344">0/2</text>
<text class="t-sm" x="18" y="376">※ 灰色の枠いっぱいが「全回で進めた」。①②が0本、③④⑤が満杯、参考行が0本なのが正解の並び。</text>
<text class="t-xs" x="18" y="395">架空データでの実測（材料2本×5版×各2回＝18回、うち⑤は各1回、参考行は閾値版を材料違いで各1回）。生の回答は docs/evidence/ に全文置いてある。</text>
</svg>
