<svg xmlns="http://www.w3.org/2000/svg" width="720" height="378" viewBox="0 0 720 378" role="img" aria-label="応募記録の件数を12件から3件に減らしたときに、AIが開いた質問に対して具体的な数値を書いたかを比較した横棒グラフ。既存記事(12件・材料2本×各5回=10回)は10回とも数値を書いた。今回(3件・材料2本×各3回=6回)は数値を書いたのが4回、留保のみで数値を書かなかった回が2回だった。要因を名指しして聞き直すと、この2回とも数値つきの答えに変わった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="378"/>
<text class="t-strong" x="18" y="26">件数を12件から3件に減らすと、数えずに留保する回が増えた</text>
<text class="t-sm" x="18" y="45">「通った1件（または3件）と通らなかった分の差を出してください」という開いた質問に、</text>
<text class="t-sm" x="18" y="64">具体的な数値を書いて答えた回の割合。</text>
<text class="t-xs" x="18" y="83">既存記事は採用3・不採用9の12件。今回は採用1・不採用2の3件。どちらも2種類の材料で試した。</text>
<text class="t-sm" x="18" y="132">既存記事（12件・材料2本×各5回=10回）</text>
<rect class="box" x="300" y="140" width="340" height="42" rx="4"/>
<rect class="box-good" x="300" y="140" width="340.0" height="42" rx="4"/>
<text class="t-good" x="654" y="166" style="font-weight:700">10／10</text>
<text class="t-sm" x="18" y="208">今回（3件・材料2本×各3回=6回）</text>
<rect class="box" x="300" y="216" width="340" height="42" rx="4"/>
<rect class="box-bad" x="300" y="216" width="226.7" height="42" rx="4"/>
<text class="t-bad" x="654" y="242" style="font-weight:700">4／6</text>
<rect class="box-accent" x="18" y="292" width="678" height="62" rx="6"/>
<text class="t-accent" x="34" y="316" style="font-weight:700">数えずに留保だけで終えた回は、12件で0回→3件で2回に増えた</text>
<text class="t-sm" x="34" y="336">要因を名指しして聞き直すと、留保だけで終えた2回とも数値つきの答えに変わった。</text>
</svg>
