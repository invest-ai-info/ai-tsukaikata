<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-label="Sakana Marlin・OpenAI Deep Research・Google Gemini Deep Researchの3つを、提供形態・実行時間の目安・最安で始める値段で比べた表。提供形態＝Sakana Marlinは法人向けSaaS（クレジット制）、OpenAIは開発者向けAPI（トークン課金）、Googleは個人向けアプリの機能（無料枠あり）。実行時間の目安＝Sakana Marlinは最大8時間、OpenAIは数十分、Googleは数分（いずれも各社公式の表現）。最安で始める値段＝Sakana Marlinは1回9,800円（従量課金）、OpenAIは単価非公開でモデル単体は百万トークンあたり10ドルから、Googleは0ドル/月（Freeプランに含む）。単位がそれぞれ違うため1本の表には並べられない。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="368"/>
<text class="t-strong" x="18" y="26">「AIに調べさせる」の値段は、3社で単位からして違う</text>
<text class="t-sm" x="18" y="45">Sakana Marlinはリサーチ1回ごとの課金、OpenAIは開発者向けのトークン課金、</text>
<text class="t-sm" x="18" y="64">Googleは個人向けサブスクの一機能。単位が違うため1本の表には並べられない。</text>
<text class="t-accent" x="134.0" y="100">Sakana Marlin</text>
<text class="t-accent" x="328.0" y="100">OpenAI Deep Research</text>
<text class="t-accent" x="522.0" y="100">Google Gemini</text>
<text class="t-accent" x="522.0" y="115">Deep Research</text>
<text class="t-sm" x="18" y="146.0">提供形態</text>
<rect class="box-accent" x="126.0" y="128" width="188.0" height="62" rx="4"/>
<text class="t-accent" x="134.0" y="146">法人向けSaaS</text>
<text class="t-accent" x="134.0" y="161">（クレジット制）</text>
<rect class="box-quiet" x="320.0" y="128" width="188.0" height="62" rx="4"/>
<text class="t-sm" x="328.0" y="146">開発者向けAPI</text>
<text class="t-sm" x="328.0" y="161">（トークン課金）</text>
<rect class="box-quiet" x="514.0" y="128" width="188.0" height="62" rx="4"/>
<text class="t-sm" x="522.0" y="146">個人向けアプリの</text>
<text class="t-sm" x="522.0" y="161">機能（無料枠あり）</text>
<text class="t-sm" x="18" y="218.0">実行時間の目安</text>
<rect class="box-accent" x="126.0" y="200" width="188.0" height="62" rx="4"/>
<text class="t-accent" x="134.0" y="218">最大8時間</text>
<text class="t-accent" x="134.0" y="233">（公式の表現）</text>
<rect class="box-quiet" x="320.0" y="200" width="188.0" height="62" rx="4"/>
<text class="t-sm" x="328.0" y="218">数十分</text>
<text class="t-sm" x="328.0" y="233">（公式の表現）</text>
<rect class="box-quiet" x="514.0" y="200" width="188.0" height="62" rx="4"/>
<text class="t-sm" x="522.0" y="218">数分</text>
<text class="t-sm" x="522.0" y="233">（公式の表現）</text>
<text class="t-sm" x="18" y="290.0">最安で始める値段</text>
<rect class="box-accent" x="126.0" y="272" width="188.0" height="62" rx="4"/>
<text class="t-accent" x="134.0" y="290">1回¥9,800</text>
<text class="t-accent" x="134.0" y="305">（従量課金）</text>
<rect class="box-quiet" x="320.0" y="272" width="188.0" height="62" rx="4"/>
<text class="t-sm" x="328.0" y="290">単価は非公開</text>
<text class="t-sm" x="328.0" y="305">（モデル単体は$10/百万</text>
<text class="t-sm" x="328.0" y="320">トークン〜）</text>
<rect class="box-quiet" x="514.0" y="272" width="188.0" height="62" rx="4"/>
<text class="t-sm" x="522.0" y="290">$0/月</text>
<text class="t-sm" x="522.0" y="305">Freeプランに含む</text>
</svg>
