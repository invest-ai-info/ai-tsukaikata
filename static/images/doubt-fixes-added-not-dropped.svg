<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" role="img" aria-label="工程1の判定ミスが、工程2の確認でどれだけ直ったかを示す横棒グラフ。意図的に挿入した誤り（本当は解決済みなのに「至急」という語が本文に残っていた行）を、確認を一言足した版は独立の実測4回中4回で正しく検出した。ところが同じ確認の一言は、何も間違っていない健全な5件だけを渡した回でも、4回中4回で正しい項目を1件ずつ誤って除外した。一方、工程1が最初から抜き出さなかった行（本文に至急を示す語が無いだけで、実際には今日中の対応が要る内容）は、確認あり・確認なしのどちらでも、のべ8機会中0回しか最終の一覧に戻らなかった。工程2に渡されていない行は、確認のしようがないため。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="384"/>
<text class="t-strong" x="18" y="26">確認は誤りを見つけたが、健全なときほど正しい項目も一緒に落とした</text>
<text class="t-sm" x="18" y="45">架空の問い合わせ16件を2本、独立のサブエージェントで各2回=4回（材料2本×2回）。</text>
<text class="t-sm" x="18" y="64">工程1が黙って落とした行は、確認あり／なしのどちらでも一度も戻らなかった。</text>
<text class="t-xs" x="18" y="83">生の返りは docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="142">意図的に挿入した誤りを、確認版が検出</text>
<rect class="box" x="300" y="150" width="340" height="40" rx="4"/>
<rect class="box-good" x="300" y="150" width="340.0" height="40" rx="4"/>
<text class="t-good" x="654" y="175">4/4</text>
<text class="t-xs" x="300" y="205">見つけたこと自体は毎回成功</text>
<text class="t-sm" x="18" y="222">健全な5件だけでも、確認版が正しい項目を誤除外</text>
<rect class="box" x="300" y="230" width="340" height="40" rx="4"/>
<rect class="box-bad" x="300" y="230" width="340.0" height="40" rx="4"/>
<text class="t-bad" x="654" y="255">4/4</text>
<text class="t-xs" x="300" y="285">誤りが無いときに新しい誤りを生んだ</text>
<text class="t-sm" x="18" y="302">工程1が落とした行（のべ8機会）・確認を足しても</text>
<rect class="box" x="300" y="310" width="340" height="40" rx="4"/>
<text class="t-bad" x="654" y="335">0/8</text>
<text class="t-xs" x="300" y="365">工程2には渡っていないので戻らない</text>
</svg>
