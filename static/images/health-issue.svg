<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="異常を検知したときに自動で立つGitHub Issueの図。タイトルはサイト異常検知と日付、本文に検出した項目が並ぶ。既に開いているIssueがあるときは新しく立てず、そのIssueに再検知としてコメントを追加する。">
