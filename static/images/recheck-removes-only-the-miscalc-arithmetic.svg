<svg xmlns="http://www.w3.org/2000/svg" width="720" height="374" viewBox="0 0 720 374" role="img" aria-label="誤検知の中身を、正しい計算と並べて示した図。左の「正しい計算」は、11,000円−9,900円=1,100円、1,100÷11,000=10%で、本文の「10%オフ」という表記と一致する。右の「誤検知（元の指摘）」は、同じ1,100円の値引きを900円と取り違え、「実際は900円引き＝約8.2%オフ」と誤って指摘していた。誤りの正体は、AI自身の引き算の間違い（11,000−9,900を900と計算した）である。下の注記には、検算で計算をやり直させると、この引き算の間違いに気づけたことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="374"/>
<text class="t-strong" x="18" y="26">誤検知の中身は、AI自身の引き算の間違いだった</text>
<text class="t-sm" x="18" y="45">教材Aの1号（通常11,000円が期間限定で9,900円）は、正しく10%オフだった。</text>
<text class="t-sm" x="18" y="64">指示文4の2回目は、この号を「約8.2%オフ」と誤って指摘した。</text>
<text class="t-xs" x="18" y="83">生の指摘文は docs/evidence/urgent-wording-does-not-catch-more.md にある。</text>
<rect class="box-good" x="18" y="130" width="330" height="150" rx="6"/>
<text class="t-good" x="34" y="156">正しい計算（検算後）</text>
<text class="mono" x="34" y="186">11,000円 − 9,900円 = 1,100円</text>
<text class="mono" x="34" y="212">1,100 ÷ 11,000 = 10%</text>
<text class="t-sm" x="34" y="242">→ 本文の「10%オフ」と一致する</text>
<rect class="box-bad" x="368" y="130" width="330" height="150" rx="6"/>
<text class="t-bad" x="384" y="156">誤検知（元の指摘）</text>
<text class="mono" x="384" y="186">「実際は900円引き」</text>
<text class="mono" x="384" y="212">「＝約8.2%オフ」</text>
<text class="t-sm" x="384" y="242">→ 1,100円を900円と誤って計算</text>
<rect class="box-quiet" x="18" y="310" width="678" height="40" rx="6"/>
<text class="t-sm" x="34" y="335">検算で計算をやり直させると、この引き算の間違いに気づけた（前図）。</text>
</svg>
