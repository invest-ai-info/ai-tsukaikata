<svg xmlns="http://www.w3.org/2000/svg" width="720" height="408" viewBox="0 0 720 408" role="img" aria-label="最初に渡した5つの縛りが、5往復のやりとりのあとも守られていたかを並べた図。6本の会話のうち何本で守られていたかを、1往復目と5往復目で比べている。全部の行を1行ずつ書く、メモに無い品質を書かない、言い回しを整えない、〔要確認〕を残す、の4つは1往復目も5往復目も6本すべてで守られた。数字をメモのまま写す縛りだけが5往復目に6本中5本になり、1件だけ在庫の数が変わった。一方で、頼んでいない在庫の合計は記録した4回とも54点で、メモの行を足した真値56点と合っていない。もう1本の材料では、報酬の合計104,000円も発注元ごとの小計6件も真値と一致した。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="408"/>
<text class="t-strong" x="18" y="26">5往復たっても縛りは戻らない。狂ったのは、頼んでいない合計のほう</text>
<text class="t-sm" x="18" y="45">架空の副業の材料2本×各2回＋毎回縛りを貼り直した対照2本＝6本の会話。</text>
<text class="t-sm" x="18" y="64">2往復目からは、縛りに一切触れない普通の追加依頼だけを送っている。</text>
<text class="t-sm" x="18" y="83">数字は「その回で縛りが守られていた会話の数／6」。</text>
<text class="t-xs" x="270" y="118">1往復目</text>
<text class="t-xs" x="366" y="118">5往復目</text>
<text class="t-sm" x="18" y="148">① 全部の行を1行ずつ</text>
<rect class="box-good" x="248" y="128" width="84" height="30" rx="4"/>
<text class="t-good" x="270.0" y="148">6／6</text>
<rect class="box-good" x="344" y="128" width="84" height="30" rx="4"/>
<text class="t-good" x="366.0" y="148">6／6</text>
<text class="t-sm" x="18" y="190">② 数字はメモのまま</text>
<rect class="box-good" x="248" y="170" width="84" height="30" rx="4"/>
<text class="t-good" x="270.0" y="190">6／6</text>
<rect class="box-bad" x="344" y="170" width="84" height="30" rx="4"/>
<text class="t-bad" x="366.0" y="190">5／6</text>
<text class="t-sm" x="18" y="232">③ メモに無い品質を書かない</text>
<rect class="box-good" x="248" y="212" width="84" height="30" rx="4"/>
<text class="t-good" x="270.0" y="232">6／6</text>
<rect class="box-good" x="344" y="212" width="84" height="30" rx="4"/>
<text class="t-good" x="366.0" y="232">6／6</text>
<text class="t-sm" x="18" y="274">④ 言い回しを整えない</text>
<rect class="box-good" x="248" y="254" width="84" height="30" rx="4"/>
<text class="t-good" x="270.0" y="274">6／6</text>
<rect class="box-good" x="344" y="254" width="84" height="30" rx="4"/>
<text class="t-good" x="366.0" y="274">6／6</text>
<text class="t-sm" x="18" y="316">⑤ 〔要確認〕を残す</text>
<rect class="box-good" x="248" y="296" width="84" height="30" rx="4"/>
<text class="t-good" x="270.0" y="316">6／6</text>
<rect class="box-good" x="344" y="296" width="84" height="30" rx="4"/>
<text class="t-good" x="366.0" y="316">6／6</text>
<rect class="box-bad" x="440" y="128" width="250" height="72" rx="6"/>
<text class="t-bad" x="454" y="150">頼んでいない在庫の合計</text>
<text class="t-bad" x="454" y="172">記録した4回とも54点（真値56点）</text>
<rect class="box-good" x="440" y="212" width="250" height="72" rx="6"/>
<text class="t-good" x="454" y="234">もう1本の材料の報酬の合計</text>
<text class="t-good" x="454" y="256">104,000円＝真値と一致（小計6件も）</text>
<text class="t-bad" x="18" y="348">※ ②の1件は、在庫1が3に変わったもの。返り自身が気づいたが、「直前の一覧で誤っていた」という申告のほうが事実と違った。</text>
<text class="t-xs" x="18" y="370">※ 合計の誤りは1往復目から出ていて、5往復ずっと直らない。毎回縛りを貼り直した対照でも同じ54点だった。</text>
<text class="t-xs" x="18" y="392">架空データでの実測。指示文ごとの生の返りは docs/evidence/ に置いてある。</text>
</svg>
