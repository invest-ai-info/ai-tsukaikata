<text class="t-strong" x="18" y="24">Xは8日前に回復しているのに、「どこかで3連続」だと今も死んだままに見える</text>
<text class="t-sm" x="18" y="43">3つの情報源について、取得件数が0だった日（赤）と0でなかった日（緑）を21日分並べた。</text>
