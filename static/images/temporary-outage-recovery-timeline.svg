<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="3つの情報源（S・T・X）について、21日分の取得件数が0だった日と0でなかった日を、日ごとに緑と赤で並べたタイムライン図。Sは21日間すべて赤（取得できない状態が最初から最後まで続く）。Tは1〜5日目が緑、6日目以降21日目まで赤（6日目に取得が止まり、以後ずっと止まったまま）。Xは1〜10日目が緑、11〜13日目だけ赤、14日目以降21日目まで緑（3日だけ止まり、その後8日間回復している）。右端の19〜20〜21日目には破線の枠が重ねられ「直近3回」と注記されている。下の枠には、SとTは直近3回も含めて赤が続くので「取得自体ができない」で正しいこと、Xは直近3回がすべて緑なので「正常」に戻るべきだが、記録のどこかに3連続の赤があればよいという基準だと、Xも「取得自体ができない」に化けることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
