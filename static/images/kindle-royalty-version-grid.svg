<rect class="bg" x="0" y="0" width="720" height="454"/>
<text class="t-strong" x="18" y="26">原文を貼ると直るもの、貼らなくても出るもの</text>
<text class="t-sm" x="18" y="45">同じ質問を、そのまま聞いた3回（版A）と、KDPの原文を貼って聞いた3回（版B）。各項目は3回中の該当回数。</text>
<text class="t-sm" x="18" y="64">配信コストは貼らなくても出る。落ちるのは、その配信コストが日本では10MB以上だと引かれないという例外のほう。</text>
<text class="t-sm" x="470" y="114">版A そのまま</text>
<text class="t-accent" x="590" y="114">版B 原文あり</text>
<text class="t-sm" x="18" y="142">35%と70%の選択制に触れた</text>
<rect class="bar-old" x="470" y="148" width="84" height="15" rx="3"/>
<text class="t-good" x="560" y="160">3/3</text>
<rect class="bar-out" x="590" y="148" width="84" height="15" rx="3"/>
<text class="t-good" x="680" y="160">3/3</text>
<text class="t-sm" x="18" y="182">配信コストに触れた</text>
<rect class="bar-old" x="470" y="188" width="84" height="15" rx="3"/>
<text class="t-good" x="560" y="200">3/3</text>
<rect class="bar-out" x="590" y="188" width="84" height="15" rx="3"/>
<text class="t-good" x="680" y="200">3/3</text>
<text class="t-sm" x="18" y="222">10MBルールに触れた</text>
<rect class="bar-old" x="470" y="228" width="28" height="15" rx="3"/>
<text class="t-bad" x="504" y="240">1/3</text>
<rect class="bar-out" x="590" y="228" width="84" height="15" rx="3"/>
<text class="t-good" x="680" y="240">3/3</text>
<text class="t-sm" x="18" y="262">10MBルールを原文どおり（引かれない）</text>
<rect class="bar-old" x="470" y="268" width="4" height="15" rx="3"/>
<text class="t-bad" x="480" y="280">0/3</text>
<rect class="bar-out" x="590" y="268" width="84" height="15" rx="3"/>
<text class="t-good" x="680" y="280">3/3</text>
<text class="t-sm" x="18" y="302">日本の70%条件＝KDPセレクトと正しく結んだ</text>
<rect class="bar-old" x="470" y="308" width="4" height="15" rx="3"/>
<text class="t-bad" x="480" y="320">0/3</text>
<rect class="bar-out" x="590" y="308" width="84" height="15" rx="3"/>
<text class="t-good" x="680" y="320">3/3</text>
<text class="t-sm" x="18" y="342">70%の価格帯を数字で言い切らなかった（言い切った3回は上限が誤り）</text>
<rect class="bar-old" x="470" y="348" width="4" height="15" rx="3"/>
<text class="t-bad" x="480" y="360">0/3</text>
<rect class="bar-out" x="590" y="348" width="84" height="15" rx="3"/>
<text class="t-good" x="680" y="360">3/3</text>
<text class="t-sm" x="18" y="382">渡していないことを、資料に無いと断った</text>
<rect class="bar-old" x="470" y="388" width="4" height="15" rx="3"/>
<text class="t-bad" x="480" y="400">0/3</text>
<rect class="bar-out" x="590" y="388" width="84" height="15" rx="3"/>
<text class="t-good" x="680" y="400">3/3</text>
<text class="t-xs" x="18" y="412">⚠️ 「触れた」は、その語が返りに出たかどうかだけを機械照合したもの。正しく使えたかは別の行で数えている。</text>
<text class="t-xs" x="18" y="430">実測 2026-08-26・全6回。生の返りと判定コードは docs/evidence/ に全文置いてある。</text>
</svg>
