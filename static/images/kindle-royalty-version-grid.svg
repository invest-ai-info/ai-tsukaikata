<svg xmlns="http://www.w3.org/2000/svg" width="720" height="454" viewBox="0 0 720 454" role="img" aria-label="KDPの印税をAIに計算させた実測で、原文を貼ると直る項目と、貼らなくても出る項目を並べた図。3回中の該当回数で、版Aはそのまま聞いた3回、版Bは原文を貼って聞いた3回。35%と70%の選択制に触れたのは版A3回・版B3回。配信コストに触れたのは両方とも3回。10MBルールに触れたのは版A1回・版B3回で、原文どおり引かれないと述べたのは版A0回・版B3回。日本の70%条件をKDPセレクトと正しく結んだのは版A0回・版B3回。70%の価格帯を数字で言い切らなかったのは版A0回・版B3回で、言い切った3回とも上限が原文と違っていた。渡していないことを書かれていないと断ったのは版A0回・版B3回。">
<style>
