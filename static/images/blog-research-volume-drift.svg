<svg xmlns="http://www.w3.org/2000/svg" width="720" height="366" viewBox="0 0 720 366" role="img" aria-label="同じ指示文で月間の検索回数を2回聞いた結果を並べた表。別々の新しいセッションに、1文字も同じ指示文を渡している。挙がった20個のキーワードのうち、両方の回に出たのは11個だけで、9個は入れ替わった。両方に出た語も数字が食い違う。食洗機 工事不要は1回目が1位で約12,000、2回目も1位で8,000から12,000。タンク式食洗機は2位で約9,900だったものが4位で4,000から7,000。食洗機 賃貸は3位で約8,100だったものが8位で2,000から3,500へ動いた。これは記事の主題そのもののキーワードで、順位で5つ、数字で2.3倍から4倍ちがう。卓上食洗機は4位で約8,100が2位で6,000から10,000へ、食洗機 一人暮らしは5位で約5,400が3位で5,000から8,000へ動いた。食洗機 分岐水栓、食洗機 置き場所、食洗機 設置は順位がほぼ動いていない。どちらの回も、検索ボリュームのツールに接続できないので推定ですと自分から断ったうえで、具体的な順位と数字を並べている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="366"/>
<text class="t-strong" x="18" y="26">同じ指示文で「月間の検索回数」を2回聞いた結果</text>
<text class="t-sm" x="18" y="45">別々の新しいセッションに、1文字も同じ指示文を渡した。20個のうち両方に出たのは11個。</text>
<text class="t-xs" x="18" y="86">キーワード</text>
<text class="t-xs" x="250" y="86">1回目</text>
<text class="t-xs" x="470" y="86">2回目（同じ指示文）</text>
<text class="t" x="18" y="116">食洗機 工事不要</text>
<text class="t-sm" x="250" y="116">1位・約12,000</text>
<text class="t-sm" x="470" y="116">1位・8,000〜12,000</text>
<text class="t" x="18" y="140">タンク式食洗機</text>
<text class="t-bad" x="250" y="140">2位・約9,900</text>
<text class="t-bad" x="470" y="140">4位・4,000〜7,000</text>
<text class="t" x="18" y="164">食洗機 賃貸</text>
<text class="t-bad" x="250" y="164">3位・約8,100</text>
<text class="t-bad" x="470" y="164">8位・2,000〜3,500</text>
<text class="t" x="18" y="188">卓上食洗機</text>
<text class="t-bad" x="250" y="188">4位・約8,100</text>
<text class="t-bad" x="470" y="188">2位・6,000〜10,000</text>
<text class="t" x="18" y="212">食洗機 一人暮らし</text>
<text class="t-bad" x="250" y="212">5位・約5,400</text>
<text class="t-bad" x="470" y="212">3位・5,000〜8,000</text>
<text class="t" x="18" y="236">食洗機 分岐水栓</text>
<text class="t-sm" x="250" y="236">6位・約4,400</text>
<text class="t-sm" x="470" y="236">6位・3,000〜5,000</text>
<text class="t" x="18" y="260">食洗機 置き場所</text>
<text class="t-sm" x="250" y="260">8位・約2,900</text>
<text class="t-sm" x="470" y="260">9位・1,500〜3,000</text>
<text class="t" x="18" y="284">食洗機 設置</text>
<text class="t-sm" x="250" y="284">10位・約2,400</text>
<text class="t-sm" x="470" y="284">10位・1,500〜3,000</text>
<text class="t-xs" x="18" y="314">※ 赤い行＝順位か桁が動いたもの。「食洗機 賃貸」は記事の主題そのもので、3位→8位・数字で2.3〜4倍ちがう。</text>
<text class="t-xs" x="18" y="332">※ どちらの回も「ツールに接続できないので推定です」と自分から断っている。断ったうえで順位が並ぶ。</text>
<text class="t-xs" x="18" y="350">※ 20個のうち9個は入れ替わった（1回目だけに出た語・2回目だけに出た語が9個ずつ）。</text>
</svg>
