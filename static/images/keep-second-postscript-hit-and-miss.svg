<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="追記を2つ（近い話題＋遠い話題）同じブロックに束ねたとき、提案文の本文に実質的な言及が残った回数を示す表。材料1（サイトリニューアル）は、近い話題（フォームの不具合）で5/5、遠い話題（展示会の案内係）で0/5、遠い話題に「困っていそうなことも考えて」を足すと3/3、「同じ重みで反映して」を足すと2/2。材料2（動画ナレーション）は、近い話題（動画の字幕）で5/5、遠い話題（展示会の受付）で0/5、「困っていそうなことも考えて」を足すと3/3、「同じ重みで反映して」を足すと2/2。下の枠には、近い話題は2材料とも10/10が本文に残り遠い話題は2材料とも10/10が本文から消えたこと、前作は遠い話題だけなら材料2が3/6拾っていたが近い話題と同居させると0/5に落ちたこと、「同じ重みで反映して」まで頼むと4/4が本文に戻るが留保なしの同格は材料2だけだったことが書かれている。">
