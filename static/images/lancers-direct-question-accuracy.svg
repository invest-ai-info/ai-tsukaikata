<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="ランサーズの「生成AIの使用許可・制限を選べる制度」の有無を、聞き方を変えて直接尋ねた結果を示す表。1行目は広く聞いた4回中4回が慎重な（分からないに近い）回答だったこと、2行目は先行記事と同じ場面指定の聞き方を再実行した4回中1回だけが先行記事に近い内容だったこと（先行記事の3回とも近い内容という結果は再現しなかった）、3行目は「わからないなら分からないと書いて」を足した4回中4回が正直に分かりませんと答えたこと、4行目は「推測でもいいから具体的に」と求めた4回のうち正しい導入時期（2024年3月）を言えた回は0回だったこと、5行目は同じ条件で対象範囲を明確に誤り、コンペ方式限定のはずの制度を全形式に広げて説明した回が4回中1回あったことを示す。下の枠には、広く聞くと慎重だが場面を指定した先行記事の再実行は4回中1回しか同じ傾向にならなかったこと、わからないと書く許可を与えると4回とも正直に分からないと答えたこと、推測を求めると正しい導入時期には届かず1回は対象範囲を全形式に広げて誤ったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">ランサーズの制度を直接尋ねると、答えは聞き方で大きく割れた</text>
<text class="t-sm" x="18" y="45">実測2026-10-09。独立した新規の会話にそれぞれ4回。</text>
<text class="t-sm" x="18" y="64">4行目・5行目は「分からない」と答えた回・誤った回を含む別の観点。右の数字の意味は行ごとに注記を参照。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">広く聞くと、慎重な回答（分からないに近い）になった回</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="157">場面を指定して聞くと、先行記事に近い内容が出た回（同じ聞き方の再実行）</text>
<rect class="box" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="558.0" y="157" text-anchor="middle" style="font-weight:700">1/4</text>
<text class="t" x="18" y="189">「わからなければ分からないと書いて」で正直に分かりませんと答えた回</text>
<rect class="box-good" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="189" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="221">「推測でもいいから具体的に」で正しい導入時期(2024年3月)を言えた回</text>
<rect class="box-bad" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="221" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="253">「推測でもいいから具体的に」で対象範囲を誤った(全形式に広げた)回</text>
<rect class="box-bad" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="253" text-anchor="middle" style="font-weight:700">1/4</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">広く聞くと4回とも慎重だったが、先行記事と同じ場面指定の聞き方では4回中1回しか同じ傾向にならなかった。</text>
<text class="t-accent" x="34" y="308">「わからなければ分からないと書いて」を足すと4回とも正直に分かりませんと答えた。</text>
<text class="t-accent" x="34" y="326">「推測でも具体的に」と求めると、正しい導入時期(2024年3月)には4回とも届かず、1回は範囲を誤った。</text>
</svg>
