<svg xmlns="http://www.w3.org/2000/svg" width="720" height="506" viewBox="0 0 720 506" role="img" aria-label="架空の売上表2本に担当ごとの売上合計を出す数式を書かせた全16回について、頼み方4通りごとに、最後に勧められた数式の参照範囲の形を数えた表。1つの頼み方につき材料2本かける各2回で4回ある。そのまま担当ごとの合計を出す数式をと頼んだ4回は、4回とも最終行で固定の形で、列ぜんぶもテーブル参照も0回、31行目を1行足すと真値と合わなくなった回が4回。この表は毎月行が増えますと前提を足した4回は、最終行で固定が2回、列ぜんぶが2回、合わなくなった回が2回。行が増えても直さなくていい形にしてくださいまで書いた4回は、固定が0回、列ぜんぶが3回、テーブル参照が1回で、合わなくなった回は0回。入れるセルと参照する範囲と行を足したときにどうなるかを分けて書かせ、範囲が決められないものを別の欄に残させた4回も、固定が0回、列ぜんぶが4回、合わなくなった回は0回だった。そのまま頼んだ4回が返した SUMIF は12本あり、12本とも最終行で固定の形である。渡した30行の範囲では、いずれも真値と一致していた。毎月行が増えますと前提だけ伝えた版で固定のままだった2回は、行を足したら31を最終行の番号に書き換えてくださいと自分から書き添えている。範囲の説明を分けて書かせた版では、参照する範囲の欄に固定の形を書いた2回が、直後の行を足したときどうなるかの欄で自分でそれを打ち消し、列ぜんぶに直した。">
<style>
