<rect class="bg" x="0" y="0" width="720" height="506"/>
<text class="t-strong" x="18" y="26">そのまま頼むと、4回とも範囲が「渡した表の最終行」で止まる</text>
<text class="t-sm" x="18" y="45">架空の売上表を2本（きれいな30行／列の形を変えて空欄と表記ゆれを混ぜた30行）。1つの頼み方に</text>
<text class="t-sm" x="18" y="64">つき材料2本 × 各2回 ＝ 4回。全16回。1行足したあとの正しい答えは、走らせる前に Python で確定させた。</text>
<text class="t-sm" x="18" y="83">下の数は、16回それぞれから「最後にこれを使ってと勧められた数式」を1本ずつ拾って分類したもの。</text>
<text class="t-sm" x="18" y="102">いちばん右は、その数式を実際に計算して、31行目を1行足した表の真値と合わなくなった回の数。</text>
<text class="t-xs" x="358" y="124" text-anchor="middle">最終行で</text>
<text class="t-xs" x="358" y="138" text-anchor="middle">固定</text>
<text class="t-xs" x="436" y="124" text-anchor="middle">列ぜんぶ</text>
<text class="t-xs" x="436" y="138" text-anchor="middle">$B:$B</text>
<text class="t-xs" x="514" y="124" text-anchor="middle">テーブル</text>
<text class="t-xs" x="514" y="138" text-anchor="middle">参照</text>
<text class="t-xs" x="592" y="124" text-anchor="middle">1行足すと</text>
<text class="t-xs" x="592" y="138" text-anchor="middle">合わない</text>
<text class="t" x="18" y="173">そのまま「担当ごとの合計を出す数式を」</text>
<rect class="box-bad" x="330" y="159" width="56" height="19" rx="4"/>
<text class="t-bad" x="358" y="173" text-anchor="middle">4/4</text>
<rect class="box-quiet" x="408" y="159" width="56" height="19" rx="4"/>
<text class="t-sm" x="436" y="173" text-anchor="middle">0/4</text>
<rect class="box-quiet" x="486" y="159" width="56" height="19" rx="4"/>
<text class="t-sm" x="514" y="173" text-anchor="middle">0/4</text>
<rect class="box-bad" x="564" y="159" width="56" height="19" rx="4"/>
<text class="t-bad" x="592" y="173" text-anchor="middle">4/4</text>
<text class="t" x="18" y="227">＋「この表は毎月行が増えます」</text>
<rect class="box-bad" x="330" y="213" width="56" height="19" rx="4"/>
<text class="t-bad" x="358" y="227" text-anchor="middle">2/4</text>
<rect class="box-good" x="408" y="213" width="56" height="19" rx="4"/>
<text class="t-good" x="436" y="227" text-anchor="middle">2/4</text>
<rect class="box-quiet" x="486" y="213" width="56" height="19" rx="4"/>
<text class="t-sm" x="514" y="227" text-anchor="middle">0/4</text>
<rect class="box-bad" x="564" y="213" width="56" height="19" rx="4"/>
<text class="t-bad" x="592" y="227" text-anchor="middle">2/4</text>
<text class="t" x="18" y="281">＋「行が増えても直さなくていい形に」</text>
<rect class="box-quiet" x="330" y="267" width="56" height="19" rx="4"/>
<text class="t-sm" x="358" y="281" text-anchor="middle">0/4</text>
<rect class="box-good" x="408" y="267" width="56" height="19" rx="4"/>
<text class="t-good" x="436" y="281" text-anchor="middle">3/4</text>
<rect class="box-good" x="486" y="267" width="56" height="19" rx="4"/>
<text class="t-good" x="514" y="281" text-anchor="middle">1/4</text>
<rect class="box-good" x="564" y="267" width="56" height="19" rx="4"/>
<text class="t-good" x="592" y="281" text-anchor="middle">0/4</text>
<text class="t" x="18" y="335">＋㋐㋑㋒に分けて書かせる（受け皿つき）</text>
<rect class="box-quiet" x="330" y="321" width="56" height="19" rx="4"/>
<text class="t-sm" x="358" y="335" text-anchor="middle">0/4</text>
<rect class="box-good" x="408" y="321" width="56" height="19" rx="4"/>
<text class="t-good" x="436" y="335" text-anchor="middle">4/4</text>
<rect class="box-quiet" x="486" y="321" width="56" height="19" rx="4"/>
<text class="t-sm" x="514" y="335" text-anchor="middle">0/4</text>
<rect class="box-good" x="564" y="321" width="56" height="19" rx="4"/>
<text class="t-good" x="592" y="335" text-anchor="middle">0/4</text>
<text class="t-bad" x="18" y="380">※ そのまま頼んだ4回は、返した SUMIF 12本が12本とも $B$2:$B$31 の形だった。渡した30行では真値と一致する。</text>
<text class="t-sm" x="18" y="401">※ 「毎月行が増えます」と前提だけ伝えると、4回中2回しか直らない。残る2回は固定のまま、</text>
<text class="t-sm" x="18" y="422">　 「行を足したら『31』を最終行の番号に書き換えてください」と自分から書き添えてくる。</text>
<text class="t-good" x="18" y="443">※ 「行が増えても直さなくていい形にしてください」まで書くと、4回とも固定が消えた（列ぜんぶ／テーブル参照）。</text>
<text class="t-good" x="18" y="464">※ ㋒「その範囲は行を足したときにどうなるか」の欄を作ると、㋑に固定を書いた2回が、直後の㋒で自分で打ち消した。</text>
<text class="t-xs" x="18" y="485">架空データでの実測（全16回）。生の返りと照合コードは docs/evidence/ に全文置いてある。</text>
</svg>
