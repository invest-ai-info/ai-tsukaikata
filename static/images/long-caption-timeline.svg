<rect class="bg" x="0" y="0" width="720" height="676"/>
<text class="t-strong" x="18" y="26">前半の仕込みは0〜2回、後半は0〜3回。見つかった回数に偏りがある</text>
<text class="t-sm" x="18" y="45">10分23秒の架空レビュー動画に仕込んだ16件を、時系列順に並べた（通しで素朴に聞いた5回の結果）。</text>
<text class="t-sm" x="18" y="64">色の濃さが、5回中見つかった回数（0〜5）を示す。前半（0:00〜5:43）と後半（5:50〜10:23）の区切りに縦線。</text>
