<svg xmlns="http://www.w3.org/2000/svg" width="720" height="676" viewBox="0 0 720 676" role="img" aria-label="10分23秒の動画に仕込んだ16件の誤りを、時系列順に点で示したタイムライン図。各点の色の濃さは、通しで素朴に聞いた5回のうち見つかった回数（0〜5）を示す。前半（0:00〜5:43、8件）は対応畳数18畳が0回、フィルター交換2年に1回が0回、重さ5.2kgが2回、コード3mが0回、清浄時間15分が2回、高さ60cmが2回、センサー4種類が1回、モード5段階が3回。後半（5:50〜10:23、8件）は花粉除去10分が2回、保証3年間が0回、フィルター40cmが3回、お手入れ3か月に1回が0回、比較6〜8畳が3回、価格3万円前後が0回、消費電力80Wが1回、保証登録1か月以内が2回。下の枠には、前半8件の合計は10/40、後半8件の合計は12/40で後半のほうがわずかに多く見つかっていること、前半だけを分けて聞くと13/24まで上がるが後半だけを分けても8/24で大差ないことが書かれている。">
<style>
