<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-label="図の崩れを止める流れ。図を生成したら、①公開のたびに自動で座標を検査（文字を線が貫く・枠や画面からのはみ出し。実例として副題を枠の上辺が貫いたのを公開前に停止）、②図を触った日にはブラウザで実寸を計測（実例として3pxと22pxのはみ出しを検出）、その両方を通ってから公開する。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="392"/>
<text class="t-strong" x="18" y="26">図の崩れは2段構えで止める</text>
<text class="t-sm" x="18" y="45">目視は最後の手段。先に機械に見せます。</text>
<rect class="box-quiet" x="18" y="66" width="430" height="52" rx="6"/>
<text class="t" x="32" y="87">図を生成する</text>
<text class="t-sm" x="32" y="106">座標は目分量ではなく計算で出す</text>
<line class="line" x1="78" y1="121" x2="78" y2="136"/>
<path d="M74 136 L78 143 L82 136 Z" fill="#8b949e"/>
<rect class="box-accent" x="18" y="144" width="430" height="52" rx="6"/>
<text class="t" x="32" y="165">① 座標の検査（公開のたび・自動）</text>
<text class="t-sm" x="32" y="184">文字を線が貫く／枠や画面からはみ出す、を機械で見る</text>
<text class="t-sm" x="464" y="175">実例: 副題を枠の上辺が貫いた → 公開前に停止</text>
<line class="line" x1="78" y1="199" x2="78" y2="214"/>
<path d="M74 214 L78 221 L82 214 Z" fill="#8b949e"/>
<rect class="box-accent" x="18" y="222" width="430" height="52" rx="6"/>
<text class="t" x="32" y="243">② ブラウザで実寸を計測（図を触った日に1回）</text>
<text class="t-sm" x="32" y="262">①が見逃す数ピクセルのはみ出しまで拾う</text>
<text class="t-sm" x="464" y="253">実例: 3px と 22px のはみ出しを検出</text>
<line class="line" x1="78" y1="277" x2="78" y2="292"/>
<path d="M74 292 L78 299 L82 292 Z" fill="#8b949e"/>
<rect class="box-good" x="18" y="300" width="430" height="52" rx="6"/>
<text class="t" x="32" y="321">公開</text>
<text class="t-xs" x="18" y="380">※ 崩れていたら公開そのものが止まります。「直った記事だけ古いまま公開」を作らないため。</text>
</svg>
