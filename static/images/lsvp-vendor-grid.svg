<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" role="img" aria-label="生命科学向けのアクセス制度を3社で比べた表。アプローチ＝Anthropicは一般提供モデルに検証者向けの緩和策を適用、OpenAIは生命科学専用のGPT-Rosalindを新設、Googleは確認できず。対象＝Anthropicは研究資格などを審査した団体・チーム、OpenAIはTrusted Access Programの承認組織、Googleは記載なし。価格の目安（100万トークンあたり）＝Anthropicは既存モデルの通常価格で入力2〜10ドル・出力10〜50ドル、OpenAIはgpt-rosalind-researchが入力5ドル・出力25ドルで2026年10月5日に課金開始、Googleは記載なし。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="356"/>
<text class="t-strong" x="18" y="26">Claude Opus 5とOpenAIの専用モデルは、単価が同額だった</text>
<text class="t-sm" x="18" y="45">各社の公式ページ（発表・モデル一覧・料金）に書かれている範囲だけを並べた。</text>
<text class="t-sm" x="18" y="64">OpenAIは生命科学専用のGPT-Rosalindを新設し、承認した組織にだけ提供している。</text>
<text class="t-sm" x="18" y="83">Googleの公式ページには、同種の検証済みアクセス制度についての記載を確認できなかった。</text>
<text class="t-accent" x="134.0" y="124">Anthropic</text>
<text class="t-accent" x="328.0" y="124">OpenAI</text>
<text class="t-accent" x="522.0" y="124">Google</text>
<text class="t-sm" x="18" y="156">アプローチ</text>
<rect class="box-accent" x="126.0" y="138" width="188.0" height="48" rx="4"/>
<text class="t-accent" x="134.0" y="156">一般提供モデルに</text>
<text class="t-accent" x="134.0" y="172">検証者向け緩和策を適用</text>
<rect class="box-quiet" x="320.0" y="138" width="188.0" height="48" rx="4"/>
<text class="t-sm" x="328.0" y="156">生命科学専用の</text>
<text class="t-sm" x="328.0" y="172">GPT-Rosalindを新設</text>
<rect class="box-bad" x="514.0" y="138" width="188.0" height="48" rx="4"/>
<text class="t-bad" x="522.0" y="156">確認できず</text>
<text class="t-sm" x="18" y="214">対象</text>
<rect class="box-accent" x="126.0" y="196" width="188.0" height="48" rx="4"/>
<text class="t-accent" x="134.0" y="214">研究資格などを</text>
<text class="t-accent" x="134.0" y="230">審査した団体・チーム</text>
<rect class="box-quiet" x="320.0" y="196" width="188.0" height="48" rx="4"/>
<text class="t-sm" x="328.0" y="214">Trusted Access</text>
<text class="t-sm" x="328.0" y="230">Programの承認組織</text>
<rect class="box-bad" x="514.0" y="196" width="188.0" height="48" rx="4"/>
<text class="t-bad" x="522.0" y="214">—</text>
<text class="t-sm" x="18" y="272">価格の目安</text>
<text class="t-sm" x="18" y="288">(100万トークン)</text>
<rect class="box-accent" x="126.0" y="254" width="188.0" height="48" rx="4"/>
<text class="t-accent" x="134.0" y="272">既存モデルの通常価格</text>
<text class="t-accent" x="134.0" y="288">$2/$10〜$10/$50</text>
<rect class="box-quiet" x="320.0" y="254" width="188.0" height="48" rx="4"/>
<text class="t-sm" x="328.0" y="272">gpt-rosalind-research</text>
<text class="t-sm" x="328.0" y="288">$5/$25（10月5日課金開始）</text>
<rect class="box-bad" x="514.0" y="254" width="188.0" height="48" rx="4"/>
<text class="t-bad" x="522.0" y="272">—</text>
<text class="t-xs" x="18" y="330">※「確認できず」「—」は機能が無いと明言されているのではなく、公式ページに記載が見当たらなかった意味。</text>
</svg>
