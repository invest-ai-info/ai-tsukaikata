<svg xmlns="http://www.w3.org/2000/svg" width="720" height="534" viewBox="0 0 720 534" role="img" aria-label="架空の応募記録12件を、提案文の字数の多い順に並べた横棒グラフ。字数は材料そのものから数えた真値で、手で書いたものではない。1番が311字で採用、2番が284字で採用、3番が271字で採用。ここまでが上位3件で、そのまま採用の3件と一致する。以下は不採用で、7番258字、5番236字、12番224字、10番160字、9番151字、11番126字、6番119字、4番108字、8番85字と続く。つまり字数で並べるだけで採用と不採用が完全に分かれており、これは記録の中で数えれば誰でも確かめられる事実である。ところが「通った提案と通らなかった提案の差を出してください」と頼んだ4回は、4回とも「長さの差ではありません」と書いた。しかもその4回とも、案件ごとの字数を1件も数えていない。数えずに否定している。">
