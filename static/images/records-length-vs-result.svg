<rect class="bg" x="0" y="0" width="720" height="534"/>
<text class="t-strong" x="18" y="26">字数の多い順に並べると、上位3件がそのまま採用の3件だった</text>
<text class="t-sm" x="18" y="45">架空の応募記録12件（採用3・不採用9）。字数は材料そのものから数えた真値で、手で書いていない。</text>
<text class="t-sm" x="18" y="64">この並びは、記録の中で数えれば誰でも確かめられる。推測は要らない。</text>
