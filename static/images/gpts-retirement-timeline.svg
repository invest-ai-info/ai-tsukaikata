<svg xmlns="http://www.w3.org/2000/svg" width="720" height="426" viewBox="0 0 720 426" role="img" aria-label="ChatGPTのカスタムGPT（GPTs）で収入を得る門が閉じていることを、OpenAIヘルプの記載どおりに日付順で並べた図。1行目＝いま（2026年9月18日確認時点）、個人プラン（Free・Go・Plus・Pro）では新規作成と公開が不可で赤。2行目＝2026年9月25日（planned）に新しいカスタムGPTの作成が終了する予定。3行目＝2026年12月11日（Scheduled）にカスタムGPTが停止する予定。4行目＝収益化FAQ（記事9119255）は開くと別記事へ転送され、本文に revenue・monetiz・earn・payout の語が0件で赤。日付はEnterprise向けの予定で他のプランも同じ日程に従う見込みとされ、原文自身が「subject to change」と書いているため予定であって確定ではないと注記。下の枠には、一般記事は今も検索に出るが個人が新しく作る入口は無いこと、後継のPluginsにも個人がChatGPTの中で有料販売して受け取る仕組みは未提供であること、この門の推定収入は0円で、確かめる先は原文3ページであることが書かれている。">
<style>
