</style>
<rect class="bg" x="0" y="0" width="720" height="426"/>
<text class="t-strong" x="18" y="26">GPTsで稼ぐ門は、原文の予定表では閉じている</text>
<text class="t-sm" x="18" y="45">OpenAIヘルプ「Custom GPT retirement and migration FAQ」ほかの記載を、日付順に4行で並べた（2026-09-18確認）。</text>
<text class="t-sm" x="18" y="64">日付はEnterprise向けの予定で「他のプランも同じ日程に従う見込み」。原文自身が「subject to change」と書く。</text>
<rect class="box-bad" x="18" y="96" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="116">いま（2026-09-18 確認時点）</text>
<text class="t-bad" x="34" y="136">個人プラン（Free・Go・Plus・Pro）では新規作成・公開が不可</text>
<rect class="box-quiet" x="18" y="156" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="176">2026-09-25（planned）</text>
<text class="t" x="34" y="196">新しいカスタムGPTの作成が終了する予定</text>
<rect class="box-quiet" x="18" y="216" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="236">2026-12-11（Scheduled）</text>
<text class="t" x="34" y="256">カスタムGPTが停止する予定（stop running）</text>
<rect class="box-bad" x="18" y="276" width="684" height="50" rx="6"/>
<text class="t-strong" x="34" y="296">収益化FAQ（記事 9119255）</text>
<text class="t-bad" x="34" y="316">開くと別記事へ転送され、本文に revenue / monetiz / earn / payout は0件</text>
<rect class="box-accent" x="18" y="342" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="362">「GPTsで稼ぐ」の一般記事は今も検索に出るが、個人が新しく作る入口は原文の時点で無い。</text>
<text class="t-accent" x="34" y="380">後継として案内される Plugins も、個人がChatGPTの中で有料販売して受け取る仕組みは未提供。</text>
<text class="t-accent" x="34" y="398">＝この門の推定収入は 0円。確かめる先は原文3ページ（本文の「開く順番」）。</text>
</svg>
