<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="YouTube要約の流れ。追いかけるチャンネルのIDから、YouTube Data APIを3回叩いてアップロード再生リスト、動画ID、動画の詳細を取る。次に字幕を取得し、AIに要約させて1ページにまとめる。要約済みの動画IDは保存しておき、翌日はスキップする。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .box-warn { fill: #fdf6e8; stroke: #d4a72c; stroke-width: 1.3; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13.5px; font-weight: 700; }
  .t-bad { fill: #b02020; font-size: 13px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 13px; font-weight: 700; }
  .t-warn { fill: #8a6100; font-size: 12px; }
  .mono { fill: #1f2328; font-size: 13px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .mono-big { fill: #1f2328; font-size: 21px; font-weight: 700; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .mono-sm { fill: #616b76; font-size: 11px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .line { stroke: #8b949e; stroke-width: 1.4; fill: none; }
  .line-quiet { stroke: #d5dae0; stroke-width: 1; fill: none; }
  .head { fill: #8b949e; }
  .bar { fill: #c8d1da; }
  .bar-hot { fill: #d92b2b; }
  .bar-pick { fill: #1a56b8; }
  .dot-ok { fill: #1a7f37; }
  .dot-skip { fill: #d92b2b; }
  .dot-idle { fill: #c8d1da; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .box-warn { fill: #2b2415; stroke: #a68321; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .t-warn { fill: #e0b644; }
    .mono { fill: #e6e9ec; }
    .mono-big { fill: #e6e9ec; }
    .mono-sm { fill: #9aa4ae; }
    .line { stroke: #6e7781; }
    .line-quiet { stroke: #363c43; }
    .head { fill: #6e7781; }
    .bar { fill: #3a424a; }
    .bar-hot { fill: #f07a7a; }
    .bar-pick { fill: #7ab0ff; }
    .dot-ok { fill: #57ab68; }
    .dot-skip { fill: #f07a7a; }
    .dot-idle { fill: #3a424a; }
  }
</style>

<rect class="bg" x="0" y="0" width="720" height="300" rx="8"/>

<text class="t-strong" x="24" y="34">1日1回、この順で動く</text>

<rect class="box" x="24" y="52" width="132" height="76" rx="7"/>
<text class="t-strong" x="38" y="76">チャンネル</text>
<text class="t-sm" x="38" y="96">UCで始まる24文字</text>
<text class="t-sm" x="38" y="114">のチャンネルID</text>

<path class="line" d="M156 90 H186"/>
<path class="head" d="M186 85 l10 5 -10 5 z"/>

<rect class="box-accent" x="200" y="52" width="200" height="76" rx="7"/>
<text class="t-accent" x="214" y="76">YouTube Data API ×3</text>
<text class="t-sm" x="214" y="96">①再生リストID ②動画ID</text>
<text class="t-sm" x="214" y="114">③詳細（再生時間が取れる）</text>

<path class="line" d="M400 90 H430"/>
<path class="head" d="M430 85 l10 5 -10 5 z"/>

<rect class="box" x="444" y="52" width="132" height="76" rx="7"/>
<text class="t-strong" x="458" y="76">字幕を取る</text>
<text class="t-sm" x="458" y="96">日本語→英語→</text>
<text class="t-sm" x="458" y="114">中国語の順に試す</text>

<path class="line" d="M576 90 H606"/>
<path class="head" d="M606 85 l10 5 -10 5 z"/>

<rect class="box-accent" x="620" y="52" width="76" height="76" rx="7"/>
<text class="t-accent" x="634" y="76">AIに</text>
<text class="t-accent" x="634" y="96">要約</text>
<text class="t-sm" x="634" y="116">させる</text>

<path class="line" d="M658 128 V162 H360"/>
<path class="head" d="M360 157 l-10 5 10 5 z"/>

<rect class="box" x="200" y="176" width="200" height="66" rx="7"/>
<text class="t-strong" x="214" y="200">1ページにまとめる</text>
<text class="t-sm" x="214" y="222">3行サマリー＋重要トピック</text>

<path class="line" d="M200 209 H170"/>
<path class="head" d="M170 204 l-10 5 10 5 z"/>

<rect class="box-quiet" x="24" y="176" width="132" height="66" rx="7"/>
<text class="t-strong" x="38" y="200">要約済みを保存</text>
<text class="t-sm" x="38" y="222">翌日はスキップ</text>

<text class="t-sm" x="24" y="272">保存しないと、毎日同じ動画にAIの利用料を払い続けることになります。</text>
</svg>
