<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" role="img" aria-label="5つの条件で、PR表記が投稿の最初の1行に来た回数を示す表。①PR表記に触れずに依頼は0回中0回（表記自体が無い）、②『PR表記も入れて』とだけ依頼は0回中4回、③『目立つように』と強調を追加は0回中2回、④本文の最初の1行に独立して書くよう位置を指定は4回中4回、⑤埋もれた投稿文をPR表記の位置で自己点検・修正させるは2回中2回。下の枠には、位置を名指しした④と埋もれを指摘させた⑤だけが毎回1行目に来たこと、『PRを入れて』『目立たせて』だけでは8回中0回も1行目に来なかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="336"/>
<text class="t-strong" x="18" y="26">位置を名指しした条件だけが、毎回1行目に来た</text>
<text class="t-sm" x="18" y="45">実測2026-10-26。架空の商品2種、Instagram投稿想定のアフィリエイト紹介文。</text>
<text class="t-sm" x="18" y="64">各条件の「最初の1行にPR表記が来た回数／試した回数」。①は表記自体が無いため0/2。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">①PR表記に触れずに依頼（対照）</text>
<rect class="box-bad" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="518.0" y="125" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="157">②「PR表記も入れて」とだけ依頼</text>
<rect class="box-bad" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="518.0" y="157" text-anchor="middle" style="font-weight:700">0/4</text>
<text class="t" x="18" y="189">③「目立つように」と強調を追加</text>
<rect class="box-bad" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="518.0" y="189" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="221">④最初の1行に独立して書くよう位置を指定</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">4/4</text>
<text class="t" x="18" y="253">⑤埋もれた投稿文を位置で自己点検・修正</text>
<rect class="box-good" x="438" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="253" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="270" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="290">✅ 位置を名指しした④と、埋もれを指摘させた⑤だけが、毎回1行目に来た</text>
<text class="t-accent" x="34" y="308">⚠️「PRを入れて」「目立たせて」だけでは、8回中0回も1行目に来なかった</text>
</svg>
