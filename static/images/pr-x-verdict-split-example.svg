<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="同じXのハッシュタグ埋没版の投稿を2回判定した結果を比べた図。1回目は判定「不十分である可能性が高い」根拠「#PRが前後をタグに挟まれ紛れ込んでいる構造」。2回目は判定「グレーゾーン（セーフとも言い切れない）」根拠「6個は『大量』と言えるか微妙、構造面はグレー寄り」。下の枠には、2回とも埋没している構造自体は認めたが『大量』という文言の有無で結論の強さが割れたこと、note・ブログの長文による表示はこうした文言の揺れが2回とも起きなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="320"/>
<text class="t-strong" x="18" y="26">同じX投稿(ハッシュタグ埋没)でも、判定の強さが割れた</text>
<text class="t-sm" x="18" y="45">材料＝#PRが6個のハッシュタグの4番目に挟まれたX投稿。同じ指示文を2回試した。</text>
<text class="t-strong" x="18" y="114">1回目</text>
<text class="t-strong" x="368.0" y="114">2回目</text>
<rect class="box-bad" x="18" y="122" width="334.0" height="52" rx="5"/>
<text class="t-strong" x="32" y="142" style="font-size:12px">判定</text>
<text class="t-bad" x="32" y="160" style="font-size:11px">不十分である可能性が高い</text>
<rect class="box-quiet" x="368.0" y="122" width="334.0" height="52" rx="5"/>
<text class="t-strong" x="382.0" y="142" style="font-size:12px">判定</text>
<text class="t" x="382.0" y="160" style="font-size:11px">グレーゾーン（セーフとも言い切れない）</text>
<rect class="box-quiet" x="18" y="184" width="334.0" height="52" rx="5"/>
<text class="t-strong" x="32" y="204" style="font-size:12px">根拠</text>
<text class="t" x="32" y="222" style="font-size:11px">#PRが前後をタグに挟まれ紛れ込んでいる構造</text>
<rect class="box-quiet" x="368.0" y="184" width="334.0" height="52" rx="5"/>
<text class="t-strong" x="382.0" y="204" style="font-size:12px">根拠</text>
<text class="t" x="382.0" y="222" style="font-size:11px">6個は「大量」と言えるか微妙、構造面はグレー寄り</text>
<rect class="box-accent" x="18" y="254" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="274">⚠️ 2回とも「埋没している」という構造自体は認めたが、「大量」という文言の有無で結論の強さが割れた。</text>
<text class="t-accent" x="34" y="292">📌 note・ブログの「長文による表示」は、こうした文言の揺れが2回とも起きなかった。</text>
</svg>
