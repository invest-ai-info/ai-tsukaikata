<text class="t-sm" x="18" y="45">ココナラ「AI業務効率化・自動化」634件の1ページ目（ランキング順・60件）。2026年9月18日18時35分の表示を写した。</text>
<text class="t-sm" x="18" y="64">区分はタイトルの語で機械的に分けた（規則は上から順に当てる）。説明文は読んでいない。</text>
