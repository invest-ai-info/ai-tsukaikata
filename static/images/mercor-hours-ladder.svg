<svg xmlns="http://www.w3.org/2000/svg" width="720" height="402" viewBox="0 0 720 402" role="img" aria-label="Mercorの時間制案件の単価$33.58/時（2026年9月18日の1案件の表示）に週の作業時間を前提として掛け、52週÷12で月に直した推定を4段で並べた横棒グラフ。週5時間ならUS$728で約109,135円（副業帯・JILPTの副業者の中央値は週10時間）、週10時間ならUS$1,455で約218,270円（副業帯の上のほう）、週20時間ならUS$2,910で約436,540円（準本業帯・副業者の中央値の2倍で週20時間以上は副業者の23.5%）、週40時間ならUS$5,821で約873,080円（本業の作業量で副業ではない）。USD建て・週払いで、円は1ドル150円と置いた前提の換算であり、実際はStripe／Wiseが支払い時の相場で換算すること、時間は前提で案件が続く保証は無いことを注記。下の枠には、同じ単価で時間の前提だけで帯が動き時間制の仕事は作業量の前提を書かないと金額が書けないこと、単価は日々入れ替わり相場と読まないこと、週20時間は副業者の中央値の2倍でJILPT 2022年調査の分布で上位23.5%に入る量であることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="402"/>
<text class="t-strong" x="18" y="26">推定＝$33.58 × 週の時間 × 52 ÷ 12（時間は前提・単価は9月18日の1案件の表示）</text>
<text class="t-sm" x="18" y="45">USD建て・週払い。円は1ドル150円と置いた前提の換算で、実際は Stripe／Wise が支払い時の相場で換算する。</text>
<text class="t-sm" x="18" y="64">時間はこちらが置いた前提。案件が続く保証は無い（「Projects can be … concluded early」）。</text>
<text class="t-xs" x="200" y="86">月の受け取り（USD・振込前）　右＝1ドル150円なら</text>
<text class="t-strong" x="18" y="122">週5時間（前提）</text>
<rect class="bar-in" x="200" y="107" width="38" height="20" rx="3"/>
<text class="t-strong" x="246" y="122">US$728　約109,135円</text>
<text class="t-xs" x="200" y="140">副業帯（JILPT 副業者の中央値は週10時間）</text>
<text class="t-strong" x="18" y="174">週10時間（前提）</text>
<rect class="bar-in" x="200" y="159" width="75" height="20" rx="3"/>
<text class="t-strong" x="283" y="174">US$1,455　約218,270円</text>
<text class="t-xs" x="200" y="192">副業帯の上のほう（副業者の中央値と同じ作業量）</text>
<text class="t-strong" x="18" y="226">週20時間（前提）</text>
<rect class="bar-in" x="200" y="211" width="150" height="20" rx="3"/>
<text class="t-strong" x="358" y="226">US$2,910　約436,540円</text>
<text class="t-xs" x="200" y="244">準本業帯（副業者の中央値の2倍。週20時間以上は副業者の23.5%）</text>
<text class="t-strong" x="18" y="278">週40時間（前提）</text>
<rect class="bar-in" x="200" y="263" width="300" height="20" rx="3"/>
<text class="t-strong" x="508" y="278">US$5,821　約873,080円</text>
<text class="t-xs" x="200" y="296">本業の作業量（副業ではない。案件は早期終了ありと明記）</text>
<rect class="box-accent" x="18" y="318" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="338">同じ単価で、時間の前提だけで帯が動く。時間制の仕事は「作業量の前提」を書かないと金額が書けない。</text>
<text class="t-accent" x="34" y="356">単価は日々入れ替わる（$18/task の案件は2日で消えた）。この表の単価を「相場」と読まないこと。</text>
<text class="t-accent" x="34" y="374">週20時間は副業者の中央値（週10時間）の2倍。JILPT 2022年調査（n=11,358）の分布で上位23.5%に入る量。</text>
</svg>
