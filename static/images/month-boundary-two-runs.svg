<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-label="出す形を固定した指示文を2回ずつ走らせたときの、またぎ欄に挙がった行数を並べた横棒グラフ。材料Aの7月ぶんは1回目も2回目も4件で、合計はどちらも10,890分。材料Aの8月ぶんは1回目も2回目も5件で、合計はどちらも10,800分。材料Bの7月ぶんは1回目も2回目も5件で、合計はどちらも922,000円。材料Bの8月ぶんだけが割れて、1回目は4件で合計852,000円、2回目は8件で合計594,000円。その差は258,000円である。8回のうち6回は返ってきた文が2回とも1文字も違わず、割れた回にも見出しの崩れや欄の欠落は1か所も無い。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="410"/>
<text class="t-strong" x="18" y="26">出す形が1文字も動かなくても、拾う行数のほうが割れる</text>
<text class="t-sm" x="18" y="45">【期間】【またぎ】【合計】の3つを見出しごと決めて、同じ指示文を2回ずつ走らせた（材料2本 × 各月2回 = 8回）。</text>
<text class="t-sm" x="18" y="64">棒の長さ＝またぎ欄に挙がった行数。右の数字＝その回が出した合計。</text>
<text class="t-xs" x="158" y="94">上の棒が1回目、下の棒が2回目</text>
<text class="t" x="18" y="126">材料A ・ 7月ぶん</text>
<rect class="bar-old" x="158" y="106" width="150.0" height="14" rx="2"/>
<text class="t-xs" x="316.0" y="118">4件 / 10,890分</text>
<rect class="bar-old" x="158" y="126" width="150.0" height="14" rx="2"/>
<text class="t-xs" x="316.0" y="138">4件 / 10,890分</text>
<text class="t" x="18" y="184">材料A ・ 8月ぶん</text>
<rect class="bar-old" x="158" y="164" width="187.5" height="14" rx="2"/>
<text class="t-xs" x="353.5" y="176">5件 / 10,800分</text>
<rect class="bar-old" x="158" y="184" width="187.5" height="14" rx="2"/>
<text class="t-xs" x="353.5" y="196">5件 / 10,800分</text>
<text class="t" x="18" y="242">材料B ・ 7月ぶん</text>
<rect class="bar-old" x="158" y="222" width="187.5" height="14" rx="2"/>
<text class="t-xs" x="353.5" y="234">5件 / 922,000円</text>
<rect class="bar-old" x="158" y="242" width="187.5" height="14" rx="2"/>
<text class="t-xs" x="353.5" y="254">5件 / 922,000円</text>
<text class="t" x="18" y="300">材料B ・ 8月ぶん</text>
<rect class="bar-new" x="158" y="280" width="150.0" height="14" rx="2"/>
<text class="t-bad" x="316.0" y="292">4件 / 852,000円</text>
<rect class="bar-new" x="158" y="300" width="300.0" height="14" rx="2"/>
<text class="t-bad" x="466.0" y="312">8件 / 594,000円</text>
<text class="t-good" x="18" y="344">※ 8回のうち6回は、返ってきた文が2回とも1文字も違わなかった。</text>
<text class="t-bad" x="18" y="366">※ 割れたのは材料B・8月ぶんの2回だけ。またぎが4件と8件で、合計の差は258,000円。形の崩れは1か所も無い。</text>
<text class="t-xs" x="18" y="388">架空データでの実測。生の返りは docs/evidence/ に置いてある。</text>
</svg>
