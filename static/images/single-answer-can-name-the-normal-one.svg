  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="240"/>
<text class="t-strong" x="18" y="26">単数形の答えは2回ともP3。片方の構成では止まっていない処理だった</text>
<text class="t-sm" x="18" y="45">実測2026-11-09。P1〜P4を1本のログに混ぜ、同じ4日間(09-10〜09-13)に3本を同時停止させた。</text>
<text class="t-sm" x="18" y="64">「いちばん異常な処理はどれですか」を各2回試し、答えが実際に停止した処理と一致したかを見た。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">P1+P2+P3停止（P4だけ正常）→答えは停止した処理と一致したか</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="157">P1+P2+P4停止（P3だけ正常）→答えは停止した処理と一致したか</text>
<rect class="box-bad" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-bad" x="558.0" y="157" text-anchor="middle" style="font-weight:700">0/2</text>
<rect class="box-accent" x="18" y="174" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="194">どちらの構成でも、単数形の答えは2回ともP3でした（常に1つだけ）。</text>
<text class="t-accent" x="34" y="212">P1+P2+P4停止では、実際に止まった3本（P1・P2・P4）のどれも答えに入りませんでした。</text>
</svg>
