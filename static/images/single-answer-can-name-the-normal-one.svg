<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="process=P1〜P4の4本を1本のログに混ぜ、3本同時に09-10〜09-13停止させた2つの構成で「いちばん異常な処理はどれですか」と単数形で2回ずつ尋ねた結果を示す表。P1+P2+P3が停止しP4だけ正常な構成の行は2/2で、見出しの答え（P3）が実際に停止していた処理と一致した。P1+P2+P4が停止しP3だけ正常な構成の行は0/2で、見出しの答え（P3）が実際には停止していない処理だった。下の枠には、単数形は常に1つだけ答えるが、どの1つを選ぶかは止まった処理の組み合わせによって変わり、止まっていない処理を選ぶこともあることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
