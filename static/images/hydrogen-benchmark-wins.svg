<svg xmlns="http://www.w3.org/2000/svg" width="720" height="226" viewBox="0 0 720 226" role="img" aria-label="Gemini 4 Hydrogen モデルカードの比較表10項目のうち、各モデルが最高値だった項目数を示す横棒グラフ。Gemini 4 Hydrogenが7/10項目、Claude Sonnet 5.5が3/10項目、GPT-6.1 Terraが0/10項目。この表を作ったのはGoogleで、他社が自社で測った値ではない。残り3項目のうち1つ（Terminal-Bench 4.1）はエージェント型コーディングの看板テストで、そこはSonnet 5.5のほうが高かった。">
<style>
