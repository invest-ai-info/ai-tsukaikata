<rect class="bg" x="0" y="0" width="720" height="226"/>
<text class="t-strong" x="18" y="26">モデルカードの10項目中、Hydrogenが7項目で最高値</text>
<text class="t-sm" x="18" y="45">目盛りは0〜10項目。この比較表を作ったのはGoogleで、他社が自社で測った値ではない。</text>
