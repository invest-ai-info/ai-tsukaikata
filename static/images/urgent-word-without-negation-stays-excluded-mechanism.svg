<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="前作の紛れ語と今回の紛れ語の違いを示す図。上段＝前作が試した紛れ語は「特に期限はありませんが」のように否定語を自分から含んでいた。下段＝今回の紛れ語は「至急対応をお願いしたい件ですが、来週分の定期メンテナンスでまとめて…結構です」のように、否定語は無く「至急」という緊急語自体が本文に実在する。下の枠には、結果はそれでも16回中16回正しく除外されたこと、判断の根拠は語の有無ではなく文全体が指す対応時期だったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="350"/>
<text class="t-strong" x="18" y="26">今回は、否定語ではなく緊急語そのものが本文にある</text>
<text class="t-sm" x="18" y="45">前作（synonym-wording-empties-the-collateral）が試した紛れ語と、今回の紛れ語の違い。</text>
<text class="t-sm" x="18" y="64">「至急」「今すぐ」という語の有無では見分けがつかない点が、今回新しく踏み込んだ軸。</text>
<rect class="box-quiet" x="18" y="112" width="684" height="68" rx="6"/>
<text class="t-strong" x="34" y="132">前作の紛れ語（否定語あり）</text>
<text class="mono" x="34" y="152">「来週の資料…特に期限はありませんが、早めにいただけると嬉しいです」</text>
<text class="t" x="34" y="170">「ありません」という否定語が、急ぎでないことを自分から言っている</text>
<rect class="box-good" x="18" y="190" width="684" height="68" rx="6"/>
<text class="t-strong" x="34" y="210">今回の紛れ語（否定語なし）</text>
<text class="mono" x="34" y="230">「至急対応をお願いしたい件ですが、来週分の定期メンテナンスでまとめて…結構です」</text>
<text class="t-good" x="34" y="248">否定語は無く、「至急」という緊急語自体が本文に実在する</text>
<rect class="box-accent" x="18" y="274" width="684" height="56" rx="6"/>
<text class="t-accent" x="34" y="294">結果＝それでも16回中16回、正しく除外された。</text>
<text class="t-accent" x="34" y="312">判断の根拠は語の有無ではなく、文全体が指す対応時期（今日中か、来週・月末でよいか）だった。</text>
</svg>
