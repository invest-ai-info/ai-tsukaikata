<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="〔保留〕マークが行の先頭に来たかどうかを、材料と指示文のバージョンごとに表した一覧図。すべて「先頭に来た行数／試した行数」で、多いほど良い。材料A（表形式の送信・受信一覧）は①〜④・⑥の通算で24行すべてが先頭。材料B（走り書きの送信・受信一覧）は、①先頭に付けてだけの版が8行中4行、②実例を1行足した版が4行中2行、③前置き禁止・重複禁止・位置の言い方を束ねた版が6行中6行、④さらに送った回数の単位も明記した最終の生成指示が4行中2行、⑤生成後に自分で確認させる1文を足した版が6行中6行だった。下の枠には、材料Aは24行とも先頭だったこと、材料Bは②50%から③100%、④50%と指示文を強めても上下したこと、③の6/6だけを見ると直ったように見えるが同じ束ねに1点足した④で2/4に戻っていること、材料Bで安定したのは⑤のみで生成を強めるより出した後に見直させる1文のほうが頼りになったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">〔保留〕マークの位置、材料Aは崩れず材料Bだけ揺れた</text>
<text class="t-sm" x="18" y="45">実測2026-10-10。「先頭に付けてください」の指示を5段階で強め、〔保留〕が実際に行の先頭に来たかを数えた。</text>
<text class="t-sm" x="18" y="64">材料A＝表形式の送信・受信一覧。材料B＝走り書きの送信・受信一覧。行数＝対象の2行×試した回数。</text>
<text class="t-xs" x="558.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">材料A（表形式）― ①〜④・⑥の通算</text>
<rect class="box-good" x="478" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="125" text-anchor="middle" style="font-weight:700">24/24</text>
<text class="t" x="18" y="157">材料B（走り書き）① 先頭に付けてだけ</text>
<rect class="box" x="478" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="558.0" y="157" text-anchor="middle" style="font-weight:700">4/8</text>
<text class="t" x="18" y="189">材料B② ①+実例を1行足す</text>
<rect class="box" x="478" y="168" width="160" height="26" rx="4"/>
<text class="t-sm" x="558.0" y="189" text-anchor="middle" style="font-weight:700">2/4</text>
<text class="t" x="18" y="221">材料B③ ②+前置き禁止・重複禁止・位置の言い方を束ねる</text>
<rect class="box-good" x="478" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="221" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="253">材料B④ ③+送った回数の単位も明記（最終の生成指示）</text>
<rect class="box" x="478" y="232" width="160" height="26" rx="4"/>
<text class="t-sm" x="558.0" y="253" text-anchor="middle" style="font-weight:700">2/4</text>
<text class="t" x="18" y="285">材料B⑤ ④+生成後に自分で確認させる1文を足す</text>
<rect class="box-good" x="478" y="264" width="160" height="26" rx="4"/>
<text class="t-good" x="558.0" y="285" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">材料Aは24行とも先頭。材料Bは②50%→③100%→④50%と、指示文を強めても上下した。</text>
<text class="t-accent" x="34" y="340">③の6/6だけ見ると直ったように見えるが、同じ束ねに1点足した④で2/4に戻っている。</text>
<text class="t-accent" x="34" y="358">材料Bで安定したのは⑤のみ――生成を強めるより、出した後に自分で見直させる1文だった。</text>
</svg>
