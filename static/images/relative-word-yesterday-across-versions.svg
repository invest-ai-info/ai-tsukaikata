<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="「前日を指す語」（昨日）だけの正答率を、3つの指示文で比べた表。前作が名指しした指示文は4回中3回で黄色、今回の素朴な一般化は2回中1回で黄色、意味で分けた一般化は2回中2回で緑。下の枠には、名指しても素朴に一般化しても昨日は安定しなかったこと、今日型と前日型を意味で分けると名指しせずに2回とも正しくなったこと、不安定の原因は名指しの有無ではなく今日型と前日型を区別していないことだったと書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="290"/>
<text class="t-strong" x="18" y="26">「前日を指す語」は、名指しても一般化しても不安定だった</text>
<text class="t-sm" x="18" y="45">前作（2026-10-22）は「昨日」を名指しして4回中3回。本実測（2026-10-30）は同じ語を2つの一般化で試した。</text>
<text class="t-sm" x="18" y="64">どちらの一般化でも、「前日」を意味で区別するまでは安定しなかった。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">名指しした指示文（前作実測・昨日）</text>
<rect class="box" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="125" text-anchor="middle" style="font-weight:700">3/4</text>
<text class="t" x="18" y="157">素朴な一般化（今回実測・昨日）</text>
<rect class="box" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-sm" x="478.0" y="157" text-anchor="middle" style="font-weight:700">1/2</text>
<text class="t" x="18" y="189">意味で分けた一般化（今回実測・昨日）</text>
<rect class="box-good" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="206" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="226">名指しても（前作）、語を列挙せず素朴に一般化しても（今回）、「昨日」は安定して直らなかった。</text>
<text class="t-accent" x="34" y="244">「続きとして今日にあたる語」と「前日にあたる語」を意味で分けると、名指しせずに2回とも正しくなった。</text>
<text class="t-accent" x="34" y="262">＝不安定の原因は「名指ししていないこと」ではなく、「今日型」と「前日型」を区別していないことだった。</text>
</svg>
