<text class="t-sm" x="236.0" y="152" text-anchor="middle">未知＝31ポイント（5.7%〜36.5%）</text>
<rect class="bar-new" x="148.7" y="200" width="78.7" height="22" rx="4"/>
<text class="t" x="18" y="216">この記事まで</text>
<text class="t-accent" x="188.0" y="192" text-anchor="middle" style="font-weight:700">未知＝10ポイント（10%〜20%）</text>
<circle class="bar-old" cx="114.8" cy="230" r="6"/>
<text class="t-xs" x="114.8" y="278" text-anchor="middle">5.7%=同じ</text>
<circle class="bar-old" cx="148.7" cy="230" r="6"/>
