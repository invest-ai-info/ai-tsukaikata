<text class="t-xs" x="608.9" y="294" text-anchor="middle">68.5%=大きく違う</text>
<rect class="box-accent" x="18" y="314" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="334">灰色＝『同じ』と判定された差。青＝『大きく違う』と判定された差（いずれも2回とも一致）。</text>
<text class="t-accent" x="34" y="352">残り10ポイント（10%〜20%）のどこで切り替わるかは、この記事でもまだ1点には絞れていません。</text>
