<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="1本のログに頻度の違う処理Xと処理Yを混ぜ、指示文を「処理ごとに計算」と「日ごとに合算」で比べた結果を示す表。処理ごとに計算は、多数派の処理Xが停止したセット1で2/2、少数派の処理Yが停止したセット2でも2/2、どちらも停止4日間を正しく名指しできた。日ごとに合算は、セット1では2/2で正しく名指しできたが、セット2では0/2で、2回とも『該当なし』という見逃しになった。下の枠には、処理ごとに計算は止まった処理が多数派でも少数派でも4回とも正解だったこと、日ごとに合算は多数派が止まった回はまぐれで正解できたこと、少数派が止まった回は合計がふだんの範囲に収まり2回とも該当なしになったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">「処理ごと」は4回とも正解。「合算」は少数派の停止だけ見逃した</text>
<text class="t-sm" x="18" y="45">実測2026-10-20。1本のログに頻度の違う処理X・Yを混ぜ、どちらが止まっても正しく分かるかを見た。</text>
<text class="t-sm" x="18" y="64">数値は「停止4日間を正しく名指しできた回数／試した回数」。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">処理ごとに計算：セット1(多数派Xが停止・2回)</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="157">処理ごとに計算：セット2(少数派Yが停止・2回)</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="189">日ごとに合算：セット1(多数派Xが停止・2回)</text>
<rect class="box-good" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="221">日ごとに合算：セット2(少数派Yが停止・2回)</text>
<rect class="box-bad" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="221" text-anchor="middle" style="font-weight:700">0/2</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">「処理ごとに計算」は、止まった処理が多数派でも少数派でも4回とも正解だった。</text>
<text class="t-accent" x="34" y="276">「日ごとに合算」は、多数派が止まった回は合計も落ちるので正解できた（まぐれ）。</text>
<text class="t-accent" x="34" y="294">少数派が止まった回は、合計がふだんの範囲に収まり、2回とも『該当なし』になった。</text>
</svg>
