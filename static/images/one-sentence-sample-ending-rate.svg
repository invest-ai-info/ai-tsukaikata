<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="見本を1文まで削っても、比率指定なら73%まで戻ることを示す表。犬の1文見本そのものは1文中1文（100%）。1文見本で単純に書かせると13文中3文（23%）、比率指定では16文中12文（75%）。万年筆の1文見本そのものも1文中1文（100%）。1文見本で単純に書かせると11文中4文（36%）、比率指定では14文中10文（71%）。下の枠には、1文の見本自体は比率が100%に見えること、単純に書かせると合計29%で2文見本の先行記事とほぼ同じこと、比率を数字で指定すると合計73%で2文見本の先行記事と同じ値に戻ることが書かれている。">
