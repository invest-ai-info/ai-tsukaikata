<text class="t-sm" x="478.0" y="285" text-anchor="middle" style="font-weight:700">10/14</text>
<rect class="box-accent" x="18" y="302" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="322">1文の見本そのものは1文とも対象の文末で、比率は100%に見える。</text>
<text class="t-accent" x="34" y="340">単純に書かせると犬23%・万年筆36%（合計29%）。2文見本（先行記事）の29%とほぼ同じだった。</text>
<text class="t-accent" x="34" y="358">比率を数字で指定すると犬75%・万年筆71%（合計73%）。2文見本（先行記事）の73%と同じ値に戻った。</text>
