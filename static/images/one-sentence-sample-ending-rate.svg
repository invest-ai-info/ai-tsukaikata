<rect class="bg" x="0" y="0" width="720" height="386"/>
<text class="t-strong" x="18" y="26">見本を1文まで削っても、比率指定なら73%まで戻った</text>
<text class="t-sm" x="18" y="45">実測2026-11-01。2文見本記事（2026-10-20）の見本をさらに1文に削り、単純版・比率指定版を試した。</text>
<text class="t-sm" x="18" y="64">2文見本（先行記事）は単純29%・比率指定73%だった。1文に削っても、ほぼ同じ比率になった。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
