<rect class="box-good" x="300.0" y="210" width="3.0" height="16" rx="3"/>
<text class="t-accent" x="590.0" y="222">0円(15回)</text>
<text class="t-sm" x="18" y="254">※ 元記事は率のページを丸ごと貼る形。この記事は率の要点を1文で渡す形。</text>
<text class="t-sm" x="18" y="274">渡した情報の量が違うので、割れなかった理由もそこにある可能性がある。</text>
<text class="t-xs" x="18" y="294">架空データでの実測（この記事は2材料×各15回＝30回）。生の回答はdocs/evidence/ に全文置いてある。</text>
