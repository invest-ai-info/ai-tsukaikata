<rect class="bg" x="0" y="0" width="720" height="318"/>
<text class="t-strong" x="18" y="24">同じ指示文を繰り返しても、割れたのは元記事の1回だけだった</text>
<text class="t-sm" x="18" y="43">横軸は、同じ指示文を繰り返したときの最大額と最小額の差（円）。元記事は契約12万円・料率ページを全文貼った回。</text>
<text class="t-sm" x="18" y="62">この記事は契約9.2万円・材料の要点（税抜/税込は書かない）だけを渡した回。金額の水準が違うので、比べるのは差の有無だけ。</text>
<text class="t-xs" x="18" y="81">この記事の2本は、段階制も一律16.5%も、15回とも同じ額（73,600円／76,820円）が返った。</text>
<text class="t-xs" x="300.0" y="118">0円</text>
<path class="line" d="M300.0 124 L300.0 230" stroke-dasharray="4 3"/>
