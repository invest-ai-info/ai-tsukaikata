<svg xmlns="http://www.w3.org/2000/svg" width="720" height="318" viewBox="0 0 720 318" role="img" aria-label="同じ指示文を繰り返したとき、手取り計算の答えがどれだけ割れたかを3本の横棒で比べた図。横軸は、同じ指示文を繰り返したときの最大額と最小額の差（円）。元記事（料率ページを全文貼った契約12万円・2回）は差1,320円で、106,480円と107,800円という別の額が返った。この記事（材料の要点だけを渡した契約9.2万円）は、段階制（クラウドワークス型）15回・一律16.5%（ランサーズ型）15回のどちらも差0円で、段階制は15回とも73,600円、一律16.5%は15回とも76,820円が返った。金額の水準が違うため、比べているのは差が出たかどうかだけである。">
