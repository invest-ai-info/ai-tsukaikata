<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="振込手数料ぶんの差額（500円）が、分割入金の合算の中に埋もれても見逃されないことを示す表。材料1（リフォーム工事・完成金が500円不足）は5/5、材料2（結婚式場・中間金が500円不足）は5/5で、不足した1件を正しく名指しで検出した。不足額を丸くない437円に変えた版は材料1＋2合わせて6/6、「合計額が一致するか確認してください」という一文を削った版も材料1＋2合わせて6/6で、どちらも検出は崩れなかった。下の枠には、振込手数料ぶんの差額は2材料×5回＝10回とも名指しで検出され健全な11件への誤検知は0回だったこと、不足額を丸くない437円に変えても検出は崩れなかったこと、照合を明示する一文を削っても自分から合計を照合して不足を検出したことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">振込手数料ぶんの差額は、22回とも埋もれて消えなかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-01。前作と同じ2材料に、3回払いの1件だけ入金を少なくした。</text>
<text class="t-sm" x="18" y="64">すべて「不足した1件を正しく名指しで検出した回数」（多いほど見逃していない）。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">材料1（リフォーム）：500円不足・完成金</text>
<rect class="box-good" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="125" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="157">材料2（結婚式場）：500円不足・中間金</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">5/5</text>
<text class="t" x="18" y="189">材料1＋2：丸くない額（437円）に変えても</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="221">材料1＋2：「確認してください」を削っても</text>
<rect class="box-good" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="221" text-anchor="middle" style="font-weight:700">6/6</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">振込手数料ぶんの差額（500円）は、2材料×5回＝10回とも名指しで検出され、健全な11件への誤検知は0回。</text>
<text class="t-accent" x="34" y="276">不足額を丸くない437円に変えても、6/6で検出は崩れなかった。</text>
<text class="t-accent" x="34" y="294">「合計額が一致するか確認して」という一文を削っても、6/6が自分から合計を照合して不足を検出した。</text>
</svg>
