<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" role="img" aria-label="ふだんの目安を渡すかどうかで、35件の急増を自分から報告した回数を4本の横棒で比べた図。縦軸は3件満点。材料A（ヘルプデスク）は基準なしが0/3、基準ありが2/3。材料B（返品申請）は基準なしが0/3、基準ありが3/3。2材料を合わせると、基準なしは6回中0回、基準ありは6回中5回が「通常の7〜10倍」のように自分から報告した。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="316"/>
<text class="t-strong" x="18" y="24">基準を渡さなければ0対6。渡すと5対6まで上がる</text>
<text class="t-sm" x="18" y="43">架空の「今日ぶんの一覧」35件（ふだんは1日3〜5件）を2種類用意し、同じ集計の指示文を各3回試した。</text>
<text class="t-sm" x="18" y="62">縦軸は、35件という総数の異常に自分から触れた回数（満点3）。「ふだんは1日3〜5件程度です」の一言があるかどうかだけが違う。</text>
<text class="t-xs" x="18" y="81">基準ありの材料Aは1回だけ、渡された基準に一言も触れなかった。件数そのものを減らして返した回は12回とも0回。</text>
<text class="t-xs" x="466.0" y="120">満点=3</text>
<text class="t" x="18" y="144">材料A・基準なし</text>
<rect class="box-quiet" x="280.0" y="132" width="200.0" height="16" rx="3"/>
<rect class="box-bad" x="280.0" y="132" width="3.0" height="16" rx="3"/>
<text class="t-bad" x="492.0" y="144">0/3</text>
<text class="t" x="18" y="178">材料B・基準なし</text>
<rect class="box-quiet" x="280.0" y="166" width="200.0" height="16" rx="3"/>
<rect class="box-bad" x="280.0" y="166" width="3.0" height="16" rx="3"/>
<text class="t-bad" x="492.0" y="178">0/3</text>
<text class="t" x="18" y="212">材料A・基準あり</text>
<rect class="box-quiet" x="280.0" y="200" width="200.0" height="16" rx="3"/>
<rect class="box-good" x="280.0" y="200" width="133.3" height="16" rx="3"/>
<text class="t-accent" x="492.0" y="212">2/3</text>
<text class="t" x="18" y="246">材料B・基準あり</text>
<rect class="box-quiet" x="280.0" y="234" width="200.0" height="16" rx="3"/>
<rect class="box-good" x="280.0" y="234" width="200.0" height="16" rx="3"/>
<text class="t-accent" x="492.0" y="246">3/3</text>
<path class="line" d="M480.0 124 L480.0 248" stroke-dasharray="4 3"/>
<text class="t-sm" x="18" y="274">※ 点線は満点の3。基準なしの2本だけが左端のままである。</text>
<text class="t-xs" x="18" y="293">架空データでの実測（材料2本×2版×各3回＝12回）。生の返りはdocs/evidence/ に全文置いてある。</text>
</svg>
