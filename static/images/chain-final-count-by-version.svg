<svg xmlns="http://www.w3.org/2000/svg" width="720" height="407" viewBox="0 0 720 407" role="img" aria-label="毎朝の処理を工程に分けて回したとき、最終に出た件数を4通りの切り方で並べた図。架空の問い合わせ24件を2本、事務機器メーカーの窓口の丁寧な長文と、公共施設の窓口の短い口語で用意した。やらせる中身は4版とも同じで、期限が書いてあるものだけ抜き、3つに分け、1件3行にまとめる。抜くべきは12件である。4版かける材料2本かける各2回で16通し、のべ40回。1回で全部やらせた版は4回とも12件で真値どおり。3回に分けた版は12件、12件、0件、1件で、短い口語の材料の2回は下流が中身が渡っていないと断って一覧を作らなかった。分けたうえで毎回もとの24件も渡した版は24件、12件、24件、24件で、4回中3回は下流が上流の絞り込みを捨てて24件全部をやり直している。分けたうえで各工程に受け取った件数を書かせた版は4回とも12件で真値どおり。材料に無い型番が出た回は40回で0件だった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
