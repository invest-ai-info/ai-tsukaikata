<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" role="img" aria-label="資料の中身を条件にした聞き方と、開いた聞き方の正答率を、30日後と90日後で比べた表。資料の中身を条件にした聞き方は30日後（正解11件）・90日後（正解31件）とも6/6で緑。開いた聞き方は30日後・90日後とも0/6で赤。下の枠には、資料の中身を条件にした聞き方は詰んだ行が11件から31件に増えても6回とも正しい件数に合ったこと、開いた聞き方は規模が変わっても6回とも資料はあるが未着手の行を詰んだ行と同じ数に数え、答えが真値より常に5件・15件多かった（16件・46件）ことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="322"/>
<text class="t-strong" x="18" y="26">資料の中身を条件にした聞き方は、規模が3〜8倍でも6回とも正しかった</text>
<text class="t-sm" x="18" y="45">実測2026-10-30。問い合わせ待ち行列を30日後（詰んだ行11件／40行）・90日後（31件／100行）まで伸ばした。</text>
<text class="t-sm" x="18" y="64">前作と同じ2つの聞き方を、新規セッションに2回転×3回＝6回ずつ聞いた。</text>
<text class="t-xs" x="478.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">資料の中身を条件にした聞き方／30日後（正解11件）</text>
<rect class="box-good" x="398" y="104" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="125" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="157">資料の中身を条件にした聞き方／90日後（正解31件）</text>
<rect class="box-good" x="398" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="478.0" y="157" text-anchor="middle" style="font-weight:700">6/6</text>
<text class="t" x="18" y="189">開いた聞き方／30日後（正解11件）</text>
<rect class="box-bad" x="398" y="168" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="189" text-anchor="middle" style="font-weight:700">0/6</text>
<text class="t" x="18" y="221">開いた聞き方／90日後（正解31件）</text>
<rect class="box-bad" x="398" y="200" width="160" height="26" rx="4"/>
<text class="t-bad" x="478.0" y="221" text-anchor="middle" style="font-weight:700">0/6</text>
<rect class="box-accent" x="18" y="238" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="258">資料の中身を条件にした聞き方は、詰んだ行が11件→31件に増えても6回とも正しい件数に合った。</text>
<text class="t-accent" x="34" y="276">開いた聞き方は、規模が変わっても6回とも、資料はあるが未着手の行を詰んだ行と同じ数に数えた。</text>
<text class="t-accent" x="34" y="294">＝開いた聞き方の答えは、詰んだ行の真値より常に5件・15件多かった（16件・46件）。</text>
</svg>
