<svg xmlns="http://www.w3.org/2000/svg" width="720" height="402" viewBox="0 0 720 402" role="img" aria-label="工程2の確認指示に「除外の基準を固定する」対策を足したとき、健全な5件だけの条件と、誤りを1件混ぜた6件の条件で、正しく処理できた回数を比べたマス目。対策なしの確認版は、健全5件で材料2本×各2回=4回中0回しか正しく処理できず、誤り混入6件では4回中3回だった。基準を固定する対策を足すと、誤り混入6件では4回中4回に上がったが、健全5件は対策後も4回中0回のままで、巻き添えは無くならなかった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="402"/>
<text class="t-strong" x="18" y="26">対策は、誤りが実在するときだけ効いた</text>
<text class="t-sm" x="18" y="45">架空の問い合わせを2本、独立したAIの新規プロセスで各2回ずつ実行した（材料2本×各2回=4回）。</text>
<text class="t-sm" x="18" y="64">「健全5件」は誤りを含まない一覧、「誤り混入6件」は解決済みの至急を1件混ぜた一覧。</text>
<text class="t-xs" x="18" y="83">数字は、健全な項目を巻き込まず正しく処理できた回数。生の回答は docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="171">確認あり・対策なし（健全5件）</text>
<rect class="box-bad" x="288" y="150" width="170" height="32" rx="4"/>
<text class="t-bad" x="328.0" y="171">0/4 正しく処理</text>
<text class="t-sm" x="18" y="213">確認あり・対策なし（誤り混入6件）</text>
<rect class="box-bad" x="288" y="192" width="170" height="32" rx="4"/>
<text class="t-bad" x="328.0" y="213">3/4 正しく処理</text>
<text class="t-sm" x="18" y="255">確認あり＋基準固定（健全5件）</text>
<rect class="box-bad" x="288" y="234" width="170" height="32" rx="4"/>
<text class="t-bad" x="328.0" y="255">0/4 正しく処理</text>
<text class="t-sm" x="18" y="297">確認あり＋基準固定（誤り混入6件）</text>
<rect class="box-good" x="288" y="276" width="170" height="32" rx="4"/>
<text class="t-good" x="328.0" y="297">4/4 正しく処理</text>
<rect class="box-quiet" x="18" y="322" width="678" height="56" rx="6"/>
<text class="t-strong" x="34" y="344">対策は誤り混入6件を3/4→4/4に上げたが、健全5件は0/4のままだった。</text>
<text class="t-sm" x="34" y="362">健全5件で除外される項目は変わったが、巻き添えの件数そのものは減らなかった。</text>
</svg>
