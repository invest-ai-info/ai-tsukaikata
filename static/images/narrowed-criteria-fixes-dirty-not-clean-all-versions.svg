<svg xmlns="http://www.w3.org/2000/svg" width="720" height="566" viewBox="0 0 720 566" role="img" aria-label="指示文1〜6それぞれで、健全な項目を巻き込まず正しく処理できた回数を比べた横棒グラフ。確認あり・対策なしは健全5件で0/4（毎回1件を誤って除外）、誤り混入6件で3/4（誤りは4回とも検出したが1回だけ健全な項目も巻き添え）。基準を固定する対策を足すと、健全5件は0/4のまま（除外される項目が変わっただけ）で、誤り混入6件は4/4に上がった。軽い言い方に変えた基準固定は健全5件で1/4にとどまった。基準固定に引用の指定を加えた版は誤り混入6件で4/4を維持し、除外の根拠を本文の語句で確認できた。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="566"/>
<text class="t-strong" x="18" y="26">指示文1〜6を並べると、条件で効き方が分かれる</text>
<text class="t-sm" x="18" y="45">健全5件・誤り混入6件それぞれに、材料2本×各2回=4回ずつ通した。</text>
<text class="t-sm" x="18" y="64">正しい答えは、どの回も「健全な項目を1件も巻き込まないこと」。</text>
<text class="t-xs" x="18" y="83">生の回答は docs/evidence/ に全文置いてある。</text>
<text class="t-sm" x="18" y="160">1. 確認あり・対策なし（健全5件）</text>
<rect class="box" x="330" y="168" width="310" height="34" rx="4"/>
<text class="t-bad" x="654" y="190">0/4</text>
<text class="t-xs" x="330" y="217">誤って1件を毎回除外</text>
<text class="t-sm" x="18" y="226">2. 確認あり・対策なし（誤り6件）</text>
<rect class="box" x="330" y="234" width="310" height="34" rx="4"/>
<rect class="box-accent" x="330" y="234" width="232.5" height="34" rx="4"/>
<text class="t-bad" x="654" y="256">3/4</text>
<text class="t-xs" x="330" y="283">誤りは検出。1回だけ健全な項目も巻き添え</text>
<text class="t-sm" x="18" y="292">3. 確認あり＋基準固定（健全5件）</text>
<rect class="box" x="330" y="300" width="310" height="34" rx="4"/>
<text class="t-bad" x="654" y="322">0/4</text>
<text class="t-xs" x="330" y="349">除外される項目が変わっただけ</text>
<text class="t-sm" x="18" y="358">4. 確認あり＋基準固定（誤り6件）</text>
<rect class="box" x="330" y="366" width="310" height="34" rx="4"/>
<rect class="box-good" x="330" y="366" width="310.0" height="34" rx="4"/>
<text class="t-good" x="654" y="388">4/4</text>
<text class="t-xs" x="330" y="415">誤りだけを正しく除外</text>
<text class="t-sm" x="18" y="424">5. 確認あり＋軽い基準固定（健全5件）</text>
<rect class="box" x="330" y="432" width="310" height="34" rx="4"/>
<rect class="box-accent" x="330" y="432" width="77.5" height="34" rx="4"/>
<text class="t-bad" x="654" y="454">1/4</text>
<text class="t-xs" x="330" y="481">4回中1回だけ安定</text>
<text class="t-sm" x="18" y="490">6. 確認あり＋基準固定＋引用（誤り6件）</text>
<rect class="box" x="330" y="498" width="310" height="34" rx="4"/>
<rect class="box-good" x="330" y="498" width="310.0" height="34" rx="4"/>
<text class="t-good" x="654" y="520">4/4</text>
<text class="t-xs" x="330" y="547">誤りだけを除外。根拠を引用つきで確認可能</text>
</svg>
