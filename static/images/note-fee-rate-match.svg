<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-label="noteの決済手段別の事務手数料6種類（クレジットカード5パーセント・携帯キャリア15パーセント・PayPay 7パーセント・Amazon Pay 7パーセント・noteポイント10パーセント・PayPal 6.5パーセント）のうち、AIの回答に正しく出てきた個数を6回ぶん並べた棒グラフ。率を貼らずに聞いた3回はそれぞれ1個・2個・2個、出典URLを求めた3回はいずれも2個で、6回ともクレジットカードと携帯キャリアの2つ止まりだった。PayPay・Amazon Pay・noteポイント・PayPalは6回とも0回だった。「決済手段は購読者が選ぶ」という原文の一言は、率を貼らずに聞いた3回では一度も出なかった。">
