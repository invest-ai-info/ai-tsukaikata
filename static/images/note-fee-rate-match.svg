<rect class="bg" x="0" y="0" width="720" height="480"/>
<text class="t-strong" x="18" y="26">6種類ある決済手段のうち、6回とも2つ止まり</text>
<text class="t-sm" x="18" y="45">「noteで有料記事を売ると手数料はいくら引かれますか」を、率を貼らずに3回・出典URLも足して3回、計6回聞いた。</text>
<text class="t-sm" x="18" y="64">下の数は、6種類の事務手数料（クレカ5%・キャリア15%・PayPay 7%・Amazon Pay 7%・noteポイント10%・PayPal 6.5%）のうち、</text>
<text class="t-sm" x="18" y="83">正しく出てきた個数。</text>
<text class="t-xs" x="380" y="128">6種類のうち一致した数</text>
<text class="t" x="18" y="165">① 率を貼らずに聞く・1回目</text>
<rect class="bar-in" x="380" y="152" width="33" height="18" rx="3"/>
<text class="t-sm" x="421" y="165">1/6種</text>
<text class="t" x="18" y="199">① 率を貼らずに聞く・2回目</text>
<rect class="bar-in" x="380" y="186" width="67" height="18" rx="3"/>
<text class="t-sm" x="455" y="199">2/6種</text>
<text class="t" x="18" y="233">① 率を貼らずに聞く・3回目</text>
<rect class="bar-in" x="380" y="220" width="67" height="18" rx="3"/>
<text class="t-sm" x="455" y="233">2/6種</text>
<text class="t" x="18" y="267">② 出典URLも書いてと足す・1回目</text>
<rect class="bar-in" x="380" y="254" width="67" height="18" rx="3"/>
<text class="t-sm" x="455" y="267">2/6種</text>
<text class="t" x="18" y="301">② 出典URLも書いてと足す・2回目</text>
<rect class="bar-in" x="380" y="288" width="67" height="18" rx="3"/>
<text class="t-sm" x="455" y="301">2/6種</text>
<text class="t" x="18" y="335">② 出典URLも書いてと足す・3回目</text>
<rect class="bar-in" x="380" y="322" width="67" height="18" rx="3"/>
<text class="t-sm" x="455" y="335">2/6種</text>
<rect class="box-bad" x="18" y="364" width="678" height="44" rx="6"/>
<text class="t-bad" x="34" y="382">🚨 6回を通じて出たのは、クレジットカードと携帯キャリアの2つだけ。</text>
<text class="t-bad" x="34" y="400">PayPay・Amazon Pay・noteポイント・PayPalは、6回とも1回も出なかった。</text>
<text class="t-sm" x="18" y="432">※ 「購読者の決済手段によります（クリエイターは選べない）」の一言は、率を貼らずに聞いた3回では一度も出なかった。</text>
<text class="t-xs" x="18" y="451">架空の実測ではなくAIの知識そのものを聞いた6回。送った指示文と返りは docs/evidence/ に置いてある。</text>
</svg>
