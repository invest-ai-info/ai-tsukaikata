<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-label="崩れの3日目への伝播・点検の当たり外れ・言い直しの効果を並べた表。3日目に崩れた行が自動で直った回数は0/2で赤、新しい行が崩れを巻き込んだ回数は0/2で緑（起きなかったので良い）。点検で崩れた行を正しく発見した回数は2/2で緑、点検が崩れていないダミー見本行を誤って指摘した回数は2/2で赤。指示文に「追記する行もそろえてください」を足すと2日目から崩れが起きなかった回数は2/2で緑。下の枠には、崩れた行は自分では直らないが後続を巻き込まないこと、点検はダミーの見本行を誤検出すること、指示文に一文足すと同じ材料で崩れなくなったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="354"/>
<text class="t-strong" x="18" y="26">崩れた行は自動では直らないが、広がりもしない。点検は逆にダミー行を誤検出する</text>
<text class="t-sm" x="18" y="45">実測2026-09-20。崩れた記録ファイルをそのまま3日目に使い、点検・修正・言い直しの指示文を試した。</text>
<text class="t-sm" x="18" y="64">上2行＝3日目の伝播。中2行＝点検の当たり外れ。下1行＝言い直しの効果。</text>
<text class="t-xs" x="518.0" y="92" text-anchor="middle">当たった回数／聞いた回数</text>
<text class="t" x="18" y="125">3日目、崩れた行が自動で直った</text>
<rect class="box-bad" x="438" y="104" width="160" height="26" rx="4"/>
<text class="t-bad" x="518.0" y="125" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="157">3日目、新しい行が崩れを巻き込んだ</text>
<rect class="box-good" x="438" y="136" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="157" text-anchor="middle" style="font-weight:700">0/2</text>
<text class="t" x="18" y="189">点検＝崩れた行を正しく発見</text>
<rect class="box-good" x="438" y="168" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="189" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="221">点検＝崩れていないダミー見本行を誤って指摘</text>
<rect class="box-bad" x="438" y="200" width="160" height="26" rx="4"/>
<text class="t-bad" x="518.0" y="221" text-anchor="middle" style="font-weight:700">2/2</text>
<text class="t" x="18" y="253">指示文に一文足すと2日目から崩れなくなった</text>
<rect class="box-good" x="438" y="232" width="160" height="26" rx="4"/>
<text class="t-good" x="518.0" y="253" text-anchor="middle" style="font-weight:700">2/2</text>
<rect class="box-accent" x="18" y="270" width="684" height="64" rx="6"/>
<text class="t-accent" x="34" y="290">崩れた1行は3日目になっても自分では直らない。ただし後続の行を巻き込むこともない。</text>
<text class="t-accent" x="34" y="308">「どの行が変か」と聞く点検は、書式としては正しいダミーの見本行を2/2で誤って名指しした。</text>
<text class="t-accent" x="34" y="326">指示文に「追記する行もそろえてください」の一文を足すと、同じ材料で2/2とも崩れなかった。</text>
</svg>
