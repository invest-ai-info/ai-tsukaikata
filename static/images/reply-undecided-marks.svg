<rect class="bg" x="0" y="0" width="720" height="346"/>
<text class="t-strong" x="18" y="26">条件表に答えの無い6通が、頼み方ひとつで「そのまま送れる文」になる</text>
<text class="t-sm" x="18" y="45">架空の条件表8行と架空の問い合わせ12通。6通は条件表のどこにも答えが書いていない。</text>
<text class="t-sm" x="18" y="64">青＝本文の中に「私が決める」印が残っている ／ 赤＝印が無く、1つの文面に決まっている。</text>
<text class="t-sm" x="18" y="83">数えたのは、相手に貼る本文だけ。文面の外に付いた注記は数えていない。</text>
<text class="t-xs" x="223.0" y="112">B1</text>
<text class="t-xs" x="279.0" y="112">B2</text>
<text class="t-xs" x="335.0" y="112">B3</text>
