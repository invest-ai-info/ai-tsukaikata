<text class="t-xs" x="18" y="286">※ 「そのまま送れる形に」の2回では、条件表に無い決めごとが本文に6件ずつ入った。</text>
<text class="t-bad" x="18" y="308">※ うち1回は「記事料金の3割」という数字を、もう1回は「他のお取引先とのお約束」という事実を作った。</text>
<text class="t-xs" x="18" y="330">架空データでの実測。指示文ごとの生の返りは docs/evidence/ に置いてある。</text>
