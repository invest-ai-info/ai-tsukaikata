<svg xmlns="http://www.w3.org/2000/svg" width="720" height="346" viewBox="0 0 720 346" role="img" aria-label="条件表に答えの無い6通について、頼み方ごとに「私が決める」印が本文に残った数を並べた図。下書きを作ってと頼んだ1回目は6通中3通、2回目は6通中2通にしか印が残らなかった。そのまま送れる形にしてと頼むと2回とも0通になり、〔私が決める〕を本文に残してと頼むと6通すべてに印が残った。">
