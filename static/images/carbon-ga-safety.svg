<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244" role="img" aria-label="Gemini 4 CarbonとGemini 4 Argonの安全性2項目を比べた横棒グラフ。数字が小さいほど安全。1回の攻撃あたりの侵入成功率は、Carbonが0.8%・Argonが3.1%。自動サイバー攻撃の成功率（Gray Swanの測定）は、Carbonが2.17%・Argonが9.86%。いずれもCarbonのほうが低い（安全）。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="244"/>
<text class="t-strong" x="18" y="26">攻撃の成功率が下がった（数字が小さいほど安全）</text>
<text class="t-sm" x="18" y="45">濃い色＝Carbon、薄い色＝Argon。単位は％。</text>
<text class="t-sm" x="18" y="64">いずれもGoogle自身のレッドチーミング・外部機関（Gray Swan）による測定。</text>
<text class="t" x="18" y="94">1回の攻撃あたりの侵入成功率</text>
<text class="t-xs" x="226" y="93">Carbon</text>
<rect class="bar-new" x="300" y="82" width="26.0" height="14" rx="2"/>
<text class="t-sm" x="334.0" y="93">0.8%</text>
<text class="t-xs" x="226" y="112">Argon</text>
<rect class="bar-old" x="300" y="101" width="100.6" height="14" rx="2"/>
<text class="t-sm" x="408.6" y="112">3.1%</text>
<text class="t" x="18" y="153">自動サイバー攻撃の成功率（Gray Swan）</text>
<text class="t-xs" x="226" y="152">Carbon</text>
<rect class="bar-new" x="300" y="141" width="70.4" height="14" rx="2"/>
<text class="t-sm" x="378.4" y="152">2.17%</text>
<text class="t-xs" x="226" y="171">Argon</text>
<rect class="bar-old" x="300" y="160" width="320.0" height="14" rx="2"/>
<text class="t-sm" x="628.0" y="171">9.86%</text>
<text class="t-xs" x="18" y="220">※ 誠実さベンチマークの合格率（高いほど良い・この図には入れていない）は本文参照。</text>
<text class="t-xs" x="18" y="236">※ 出典: 一般提供の発表ページ本文。</text>
</svg>
