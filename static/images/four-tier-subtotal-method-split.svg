<svg xmlns="http://www.w3.org/2000/svg" width="720" height="328" viewBox="0 0 720 328" role="img" aria-label="同じ指示文でも、選んだ数式の方式が材料によって割れたことを示す横棒グラフ。店舗別売上表(材料A・自由記述5回)は、SUMIFSで作り直す方式が5回中4回、SUBTOTAL方式が5回中1回。部門別経費表(材料B・自由記述5回)は、SUMIFSで作り直す方式が5回中0回、SUBTOTAL方式が5回中5回。どちらの方式でも12箇所の数式はすべて正しく、方式そのものに優劣はつけていない。下の枠には、店舗別売上表ではSUMIFSを4回・SUBTOTALを1回、部門別経費表ではSUBTOTALを5回とも選んだこと、方式は指示文ではなく材料が決めている可能性があることが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="328"/>
<text class="t-strong" x="18" y="26">同じ指示文でも、選んだ方式は材料で割れた</text>
<text class="t-sm" x="18" y="45">実測2026-10-05。同じ指示文（4段の数式を作らせる自由記述）を材料2種×5回ずつ試した。</text>
<text class="t-sm" x="18" y="64">どちらの方式でも12箇所の数式はすべて正しかった。方式そのものに優劣はつけていない。</text>
<text class="t" x="18" y="92">店舗別売上表（材料A・自由記述5回）</text>
<rect class="bar-in" x="18" y="100" width="547.2" height="28"/>
<text class="t-sm" x="291.6" y="118.0" text-anchor="middle" style="fill:#ffffff">4/5</text>
<rect class="bar-out" x="565.2" y="100" width="136.8" height="28"/>
<text class="t-sm" x="633.6" y="118.0" text-anchor="middle" style="fill:#ffffff">1/5</text>
<text class="t" x="18" y="148">部門別経費表（材料B・自由記述5回）</text>
<rect class="bar-out" x="18.0" y="156" width="684.0" height="28"/>
<text class="t-sm" x="360.0" y="174.0" text-anchor="middle" style="fill:#ffffff">5/5</text>
<rect class="bar-in" x="18" y="216" width="14" height="14"/>
<text class="t-sm" x="38" y="228">SUMIFSで作り直す方式(下位の計を経由せず、ラベル名で直接集計し直す)</text>
<rect class="bar-out" x="18" y="238" width="14" height="14"/>
<text class="t-sm" x="38" y="250">SUBTOTAL方式(範囲内の他のSUBTOTALを自動で無視する)</text>
<rect class="box-accent" x="18" y="268" width="684" height="40" rx="6"/>
<text class="t-accent" x="34" y="288">店舗別売上表ではSUMIFSを4回・SUBTOTALを1回、部門別経費表ではSUBTOTALを5回とも選んだ。</text>
<text class="t-accent" x="34" y="304">方式は指示文ではなく材料が決めている可能性がある。</text>
</svg>
