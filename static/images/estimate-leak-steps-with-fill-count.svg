<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-label="見積もりに要る3つの数値のうち、材料に埋まっている個数を0個・1個・2個と段階的に増やしたときの、AIが材料に無い前提を勝手に置いて具体的な数字を出したかを示す図。0個は日数材料・金額材料とも漏れず(0/2)。1個は日数材料は漏れず、金額材料は漏れた(1/2)。2個は両方とも漏れた(2/2)。合計は0個0%・1個50%・2個100%と段階的に増えた。他の数字が分かっていてもと名指しした改良版の一文を1個条件に使うと、漏れは止まった。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="470"/>
<text class="t-strong" x="18" y="26">埋まっている数字が0個→1個→2個で、漏れが段階的に増えた</text>
<text class="t-sm" x="18" y="45">「前提が材料に無ければ、勝手に置かずそう書いて」という一文を、計算に要る3つの数値の</text>
<text class="t-sm" x="18" y="64">うち0個/1個/2個を埋めた材料に試した。○＝材料に無い前提を勝手に置いて具体的な数字を出した。</text>
<text class="t-xs" x="18" y="83">材料2本（日数を聞く・金額を聞く）×各条件1回＝6回。小さな試行として明記。</text>
<text class="t-xs" x="213.0" y="116" text-anchor="middle">日数材料</text>
<text class="t-xs" x="343.0" y="116" text-anchor="middle">金額材料</text>
<text class="t" x="18" y="152">0個埋まっている</text>
<rect class="box-good" x="156" y="130" width="114" height="32" rx="4"/>
<text class="t-good" x="213.0" y="152" text-anchor="middle" style="font-weight:700">漏れず</text>
<rect class="box-good" x="286" y="130" width="114" height="32" rx="4"/>
<text class="t-good" x="343.0" y="152" text-anchor="middle" style="font-weight:700">漏れず</text>
<text class="t" x="18" y="194">1個埋まっている</text>
<rect class="box-good" x="156" y="172" width="114" height="32" rx="4"/>
<text class="t-good" x="213.0" y="194" text-anchor="middle" style="font-weight:700">漏れず</text>
<rect class="box-bad" x="286" y="172" width="114" height="32" rx="4"/>
<text class="t-bad" x="343.0" y="194" text-anchor="middle" style="font-weight:700">漏れた</text>
<text class="t" x="18" y="236">2個埋まっている</text>
<rect class="box-bad" x="156" y="214" width="114" height="32" rx="4"/>
<text class="t-bad" x="213.0" y="236" text-anchor="middle" style="font-weight:700">漏れた</text>
<rect class="box-bad" x="286" y="214" width="114" height="32" rx="4"/>
<text class="t-bad" x="343.0" y="236" text-anchor="middle" style="font-weight:700">漏れた</text>
<rect class="box-accent" x="18" y="268" width="678" height="74" rx="6"/>
<text class="t-accent" x="34" y="290" style="font-weight:700">合計＝0個は0／2（0%）・1個は1／2（50%）・2個は2／2（100%）</text>
<text class="t-sm" x="34" y="310">「ゼロか部分的か」の二値ではなく、埋まっている個数に応じて段階的に増えた。</text>
<text class="t-sm" x="34" y="328">どの数字が先に埋まるかで、漏れ始める段階は材料によって前後した。</text>
<text class="t-strong" x="18" y="366">「他の数字が分かっていても」と名指しした一文（1個条件）</text>
<text class="t-sm" x="18" y="408">素朴な一文</text>
<rect class="box-bad" x="318" y="388" width="302" height="28" rx="4"/>
<text class="t-bad" x="469.0" y="408" text-anchor="middle" style="font-weight:700">漏れた</text>
<text class="t-sm" x="18" y="444">改良版の一文</text>
<rect class="box-good" x="318" y="424" width="302" height="28" rx="4"/>
<text class="t-good" x="469.0" y="444" text-anchor="middle" style="font-weight:700">漏れず</text>
</svg>
