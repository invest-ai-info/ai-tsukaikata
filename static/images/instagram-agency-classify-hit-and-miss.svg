<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" role="img" aria-label="ココナラの実際の出品5件の価格が「そのまま1か月分の運用代金」か「別物」かを、出品ページ本文を渡してAIに判定させた正解数を示す表。1,500円（アカウント診断）・3,000円（見積もり購入）・25,000円（1か月単位の運用代行）・60,000円（1アカウント/月あたりの料金）・2,000円（3プランのどれにも対応しない額）の5件とも、2回の実施で2/2正解。下の枠には、正解は25,000円・60,000円の2件だけが運用代金そのもので残り3件は別物であること、価格だけを見た素朴な質問ではこの区別が出てこず本文を渡すと2回とも5件全部正解したことが書かれている。">
