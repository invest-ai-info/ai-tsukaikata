<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-label="クラウドワークスの実際の募集文4件（A・B・C・D）の文字単価と、よく言われる相場目安「0.5円から3円」の帯を並べた横棒グラフ。Aは2.0円、Bは1.67円から2.5円の範囲、Cは2.0円、Dは0.07円。0.5円と3円の位置に縦の点線が引かれ、A・B・Cはこの帯の中に収まるが、Dは0.5円の線より大きく左側にあり、帯から外れている。下の枠には、4件のうち3件は目安の範囲に収まるが、Dだけが下限の7分の1まで下回ること、この0.07円という水準は素朴にAIへ相場を聞いた3回では一度も出てこなかったことが書かれている。">
<style>
  .bg { fill: #fbfcfd; }
  .box { fill: #ffffff; stroke: #d5dae0; stroke-width: 1.5; }
  .box-accent { fill: #eaf1fc; stroke: #1a56b8; stroke-width: 1.5; }
  .box-quiet { fill: #f2f4f6; stroke: #d5dae0; stroke-width: 1.5; }
  .box-bad { fill: #fdf0ef; stroke: #d92b2b; stroke-width: 1.5; }
  .box-good { fill: #eef7f0; stroke: #1a7f37; stroke-width: 1.5; }
  .line { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  .t-bad { fill: #b02020; font-size: 12.5px; font-weight: 700; }
  .t-good { fill: #16682e; font-size: 12.5px; }
  .mono { fill: #1f2328; font-size: 12.5px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
  .t { fill: #1f2328; font-size: 13px; }
  .t-sm { fill: #616b76; font-size: 11.5px; }
  .t-xs { fill: #8b949e; font-size: 10.5px; }
  .t-strong { fill: #1f2328; font-size: 13.5px; font-weight: 700; }
  .t-accent { fill: #1a56b8; font-size: 13px; font-weight: 700; }
  .bar-in { fill: #7aa7e0; }
  .bar-out { fill: #1a56b8; }
  .bar-old { fill: #c8d1da; }
  .bar-new { fill: #1a56b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #191d21; }
    .box { fill: #14171a; stroke: #363c43; }
    .box-accent { fill: #1b2735; stroke: #7ab0ff; }
    .box-quiet { fill: #1c2126; stroke: #363c43; }
    .box-bad { fill: #2a1a1a; stroke: #f07a7a; }
    .box-good { fill: #16261b; stroke: #57ab68; }
    .line { stroke: #6e7781; }
    .t-bad { fill: #f07a7a; }
    .t-good { fill: #57ab68; }
    .mono { fill: #e6e9ec; }
    .t { fill: #e6e9ec; }
    .t-sm { fill: #9aa4ae; }
    .t-xs { fill: #6e7781; }
    .t-strong { fill: #e6e9ec; }
    .t-accent { fill: #7ab0ff; }
    .bar-in { fill: #4a72a8; }
    .bar-out { fill: #7ab0ff; }
    .bar-old { fill: #3a4149; }
    .bar-new { fill: #7ab0ff; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="332"/>
<text class="t-strong" x="18" y="26">A・B・Cは相場目安の帯の中。Dだけ下限の約7分の1</text>
<text class="t-sm" x="18" y="45">クラウドワークスの実在の募集文4件（2026-11-13確認）の文字単価（税抜）。</text>
<text class="t-sm" x="18" y="64">点線はよく言われる目安「文字単価0.5円から3円くらい」の両端。</text>
<text class="t-xs" x="358.5" y="94">↑ 目安の下限0.5円</text>
<text class="t-xs" x="557.3" y="94">目安の上限3.0円 ↑</text>
<path class="line" d="M354.5 104 L354.5 252" stroke-dasharray="4 3"/>
<path class="line" d="M627.3 104 L627.3 252" stroke-dasharray="4 3"/>
<text class="t" x="18" y="131">A（テスト記事・500字・1,000円）</text>
<rect class="bar-new" x="518.2" y="118" width="3.3" height="18" rx="3"/>
<text class="t-sm" x="529.5" y="131.0">2円</text>
<text class="t" x="18" y="167">B（1記事・800〜1,200字・2,000円）</text>
<rect class="bar-new" x="482.2" y="154" width="90.5" height="18" rx="3"/>
<text class="t-sm" x="580.7" y="167.0">1.67〜2.5円</text>
<text class="t" x="18" y="203">C（テスト記事・500字・1,000円）</text>
<rect class="bar-new" x="518.2" y="190" width="3.3" height="18" rx="3"/>
<text class="t-sm" x="529.5" y="203.0">2円</text>
<text class="t" x="18" y="239">D（継続・7,000字・500円）</text>
<rect class="bar-new" x="307.8" y="226" width="3.3" height="18" rx="3"/>
<text class="t-sm" x="319.1" y="239.0">0.0714円</text>
<rect class="box-accent" x="18" y="266" width="684" height="46" rx="6"/>
<text class="t-accent" x="34" y="286">Dの文字単価は約0.07円。目安の下限0.5円の約7分の1で、A・B・Cとは一桁違う。</text>
<text class="t-accent" x="34" y="304">この0.07円という水準は、データを渡さずAIへ素朴に相場を聞いた3回では一度も出てこなかった。</text>
</svg>
