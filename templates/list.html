{% extends "base.html" %}
{% block content %}
{% import "_macros.html" as macros %}
<section class="article-list">
  <h1 class="section-title">{{ category_label }}</h1>
  <p class="section-lead">{{ description }}</p>
  {% for article in articles %}
  {{ macros.card(article) }}
  {% endfor %}
</section>
{% endblock %}
