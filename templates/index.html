{% extends "base.html" %}
{% block content %}
{% import "_macros.html" as macros %}
<section class="hero">
  <h1>{{ site.name }}</h1>
  <p class="hero-lead">{{ site.description }}</p>
</section>

<section class="article-list">
  <h2 class="section-title">新着</h2>
  {% for article in articles %}
  {{ macros.card(article) }}
  {% endfor %}
</section>
{% endblock %}
