<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page_title %}{{ page_title }} | {{ site.name }}{% else %}{{ site.name }}{% endif %}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:type" content="{{ og_type }}">
<meta property="og:title" content="{% if page_title %}{{ page_title }}{% else %}{{ site.name }}{% endif %}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:locale" content="ja_JP">
<meta property="og:image" content="{{ site.url }}/static/images/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="686">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/static/images/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.url }}/feed.xml">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/js/copy.js" defer></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-{{ site.adsense_publisher_id }}"
     crossorigin="anonymous"></script>
</head>
<body>
<header class="site-header">
  <a class="site-name" href="/">{{ site.name }}</a>
</header>

<main class="site-main">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <nav class="footer-nav">
    <a href="/about/">このサイトについて</a>
    <a href="/privacy/">プライバシーポリシー</a>
    <a href="/feed.xml">RSS</a>
  </nav>
  <p class="copyright">© {{ site.name }}</p>
</footer>
</body>
</html>
