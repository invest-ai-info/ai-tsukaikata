# 追跡対象。到達性を実測で確認したものだけを入れる（設計書 §3 参照）。
# 追加はこのファイルに数行足すだけでよく、コードの変更は不要。
sources:
  # --- Anthropic ---
  # 公式news はRSS未提供（/news/rss.xml・/rss.xml とも404を2026-08-04に再実測）。
  # ⚠️「releases 2本で実質的にカバーする」という旧方針は誤りだった。料金改定・
  # 利用上限の変更・モデルの提供終了は GitHub のリリースには一切現れない。
  # ページ自体は素のUAで200を返すので、埋め込みデータから拾う（parse_anthropic_news）。
  - id: anthropic-news
    vendor: Anthropic
    label: Anthropic 公式ニュース
    type: anthropic_news
    url: https://www.anthropic.com/news

  # ⚠️ Claude Code のリリースは、実測で100件中 major 判定が0件（タイトルが
  # "v2.1.221" という素のバージョン文字列で、patch番号も0にならないため）。
  # 即時メールにはならずダイジェスト行き。CLIの更新通知のほうが中央値178分
  # 早い（npm公開が先行・直近30件で30/30）ので、これは意図した状態。
  - id: claude-code
    vendor: Anthropic
    label: Claude Code
    type: github_releases
    url: https://github.com/anthropics/claude-code/releases.atom

  - id: anthropic-sdk
    vendor: Anthropic
    label: Anthropic SDK (Python)
    type: github_releases
    url: https://github.com/anthropics/anthropic-sdk-python/releases.atom

  # --- OpenAI ---
  - id: openai-news
    vendor: OpenAI
    label: OpenAI News
    type: rss
    url: https://openai.com/news/rss.xml

  # --- Google ---
  - id: google-ai-blog
    vendor: Google
    label: Google AI Blog
    type: rss
    url: https://blog.google/technology/ai/rss/

  - id: deepmind-blog
    vendor: Google DeepMind
    label: DeepMind Blog
    type: rss
    url: https://deepmind.google/blog/rss.xml

  # --- xAI ---
  # x.ai/news は403でbotブロック。迂回はしない。
  # HuggingFace の xai-org は2025-08で停止（2026-08-02 実測で344日更新なし）
  # のため外した。OpenRouter が唯一の生きた経路。
  - id: openrouter-xai
    vendor: xAI
    label: Grok 新モデル
    type: openrouter
    org: x-ai

  # --- 中国系 ---
  # HuggingFace の org フィードは研究成果物リポジトリが大量に混ざるうえ、
  # 実際に提供が始まったモデルが載るとは限らない。2026-08-02 の実測で
  # Qwen 37日 / Moonshot 50日の更新途絶に対し、OpenRouter は同じ時点で
  # Qwen 6日 / Moonshot 17日だった。提供中のモデルだけが載るぶん精度も高い。
  - id: openrouter-qwen
    vendor: Alibaba Qwen
    label: Qwen 新モデル
    type: openrouter
    org: qwen

  - id: openrouter-moonshot
    vendor: Moonshot AI
    label: Kimi 新モデル
    type: openrouter
    org: moonshotai

  # DeepSeek は HuggingFace 側が生きている（実測2日）ので触らない。
  - id: hf-deepseek
    vendor: DeepSeek
    label: DeepSeek 新モデル
    type: huggingface
    org: deepseek-ai

  # ⚠️ Zhipu は差し替えない。OpenRouter の z-ai も同じ 2026-06-17 の
  # glm-5.2 が最新で、1日も新しくならない。これはソースの問題ではなく
  # Zhipu 自体が出していないということ。停止警告に任せて実態を見る。
  - id: hf-zhipu
    vendor: Zhipu AI
    label: GLM 新モデル
    type: huggingface
    org: zai-org

  # --- 日本系 ---
  - id: sakana-blog
    vendor: Sakana AI
    label: Sakana AI Blog
    type: rss
    url: https://sakana.ai/feed.xml

  - id: pfn-blog
    vendor: Preferred Networks
    label: PFN 技術ブログ
    type: rss
    url: https://tech.preferred.jp/ja/blog/feed/

  - id: elyza-note
    vendor: ELYZA
    label: ELYZA note
    type: rss
    url: https://note.com/elyza/rss
